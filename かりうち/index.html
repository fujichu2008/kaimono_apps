<!DOCTYPE html>
<!--
============================================================
 かりうち（樗蒲） 単一HTML版 v1.1
============================================================
【修正箇所】（v1.1 コア体験改善）
・A 行き先の札：「危◯%」（次の一投で打たれる確率）「打」「関」（関の手前）を全候補に表示（フォーカス外は薄く）
・B 見送り理由：関で止まった馬に「関」を点滅表示し、理由を具体的に表示（passReason）
・C タッチ操作：1回目で選択、2回目で確定（マウス・キーボードは従来どおり）
・D 速さ設定（ふつう／はやい）、相手の手番中に盤を押すと早送り
・E 采の内訳（黒◯・白◯と一言）を大書きの下に表示、初回対局のみ要所で案内帯を表示
・F 出／上の皿に陣営の駒印、「戻」「法」ボタンに文字ラベル
【制約条件】
・ゲームルール、勝敗判定、CPU思考ロジックは変更なし。
・樗蒲の原ルールは断片しか伝わらないため、唐代『五木経』の采（盧・雉・犢・白ほか）と
  「関」「打馬」を下敷きにした復元ルール。原典の120升・6馬は冗長なため36升・3〜5馬に短縮。
・外部依存は Google Fonts（Yuji Syuku / Shippori Mincho B1）のみ。読めない環境では明朝体に代替。
・localStorage 等は不使用（sandbox iframe 配慮）。設定と案内の表示済み状態はページを開いている間だけ保持。
・音は最初のタップ／クリック後に有効（ブラウザの自動再生制限）。
・prefers-reduced-motion 有効時は揺れ・金粉の漂いを止め、駒の移動を短縮。
・案内帯は約3.5秒で消える（長い文は文字数に応じて延長）。タップでも閉じる。
【改善提案】
・「関の手前で止まれる」ルール設定（見送りの軽減）
・同一端末での2人対戦、棋譜記録とリプレイ
・采の出目統計、CPU候補手の評価値表示（学習用）
============================================================
-->
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#007acc">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<!-- APPSTUDIO_PWA_HEAD_END -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かりうち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
:root{
  --urushi:#1c0f0b; --shitan:#3b1d14; --kin:#c9a24a; --kin-hi:#ecd18a;
  --zoge:#efe4c9; --shu:#b3322a; --akane:#5c1a1f; --ink:#2a1a12;
  --brush:"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--urushi);color:var(--zoge);font-family:var(--mincho);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--kin-hi);outline-offset:3px}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:50}
.screen{position:fixed;inset:0;display:flex;z-index:2}
.hidden{display:none!important}

/* ---------- 題字 ---------- */
#title{flex-direction:row;align-items:center;justify-content:center;gap:clamp(28px,7vw,110px);padding:clamp(20px,4vw,48px)}
.t-hero{display:flex;align-items:center;gap:clamp(6px,2vw,22px)}
#tcan{width:clamp(180px,22vw,280px);height:clamp(250px,54vh,430px);display:block}
.t-mark{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:10px}
.t-name{writing-mode:vertical-rl;font-family:var(--brush);font-weight:400;font-size:clamp(64px,13vh,140px);line-height:1.02;letter-spacing:.06em;
  background:linear-gradient(172deg,#f6e3a6 0%,#c9a24a 34%,#8a6a2a 55%,#ecd18a 76%,#a9853a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(201,162,74,.22));animation:brush 1.9s cubic-bezier(.5,0,.2,1) both}
.seal{writing-mode:vertical-rl;background:var(--shu);color:#f6e7cf;font-weight:700;font-size:clamp(14px,2.3vh,20px);letter-spacing:.1em;padding:.4em .28em;border-radius:3px;
  transform:rotate(-3deg);box-shadow:inset 0 0 0 2px rgba(246,231,207,.55),0 2px 6px rgba(0,0,0,.5);margin-bottom:.4em;animation:seal .5s 1.6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes brush{from{clip-path:inset(0 0 100% 0);opacity:.3}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes seal{from{transform:rotate(-3deg) scale(1.8);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.t-menu{display:flex;flex-direction:column;gap:18px;width:min(340px,88vw);animation:fadein .8s 1.1s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.opt{display:grid;gap:8px}
.opt-l{font-size:14px;color:rgba(239,228,201,.72);letter-spacing:.08em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid rgba(201,162,74,.45);border-radius:6px;overflow:hidden;background:rgba(0,0,0,.28)}
.seg button{font-size:16px;padding:10px 4px;background:transparent;color:var(--zoge);border:0;border-left:1px solid rgba(201,162,74,.22);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(#6a1f25,#3d1014);color:var(--kin-hi);box-shadow:inset 0 0 0 1px var(--kin)}
.btn-main{font-family:var(--brush);font-size:24px;letter-spacing:.14em;padding:12px 26px;color:#f7e6b8;background:linear-gradient(#c13b2e,#8c2219);
  border:1px solid var(--kin);border-radius:8px;box-shadow:0 4px 0 #4a0f0b,0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,180,.35);cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0f0b,0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,220,180,.35)}
.btn-main:disabled{opacity:.38;cursor:default;transform:none;box-shadow:0 4px 0 #4a0f0b}
.btn-main.small{font-size:20px;padding:9px 20px}
.btn-main.ready{animation:ready 1.6s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 4px 0 #4a0f0b,0 0 0 0 rgba(236,209,138,0),inset 0 1px 0 rgba(255,220,180,.35)}50%{box-shadow:0 4px 0 #4a0f0b,0 0 18px 3px rgba(236,209,138,.45),inset 0 1px 0 rgba(255,220,180,.35)}}
.btn-sub{background:transparent;color:var(--kin-hi);border:0;text-decoration:underline;text-underline-offset:.35em;padding:8px;cursor:pointer;font-size:16px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,162,74,.6);background:rgba(28,15,11,.8);color:var(--kin-hi);font-family:var(--brush);font-size:18px;cursor:pointer;flex:none}
#btnSound{position:fixed;top:8px;right:10px;z-index:40}
#btnSound[aria-pressed="false"]{color:rgba(239,228,201,.4);text-decoration:line-through}

/* ---------- 対局 ---------- */
#game{flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:8px clamp(10px,3vw,24px);background:linear-gradient(rgba(30,16,11,.94),rgba(20,10,7,.94));min-height:58px}
.bar.top{border-bottom:1px solid rgba(201,162,74,.32);padding-right:62px}
.bar.bottom{border-top:1px solid rgba(201,162,74,.32);display:grid;grid-template-columns:auto 1fr auto;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.plate{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;transition:box-shadow .3s,background .3s}
.plate.turn{background:rgba(201,162,74,.08);box-shadow:inset 0 -2px 0 var(--kin)}
.pc{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none}
.p0{background:radial-gradient(circle at 35% 35%,#e0664f,#b3322a 55%,#5e1510);box-shadow:inset 0 0 0 2px #d9b45c}
.p1{background:radial-gradient(circle at 35% 35%,#fffaf0,#e9dcbc 55%,#a48b5c);box-shadow:inset 0 0 0 2px #6b4a24}
.pn{font-weight:700;font-size:16px;white-space:nowrap}
.lv{font-size:13px;opacity:.6;white-space:nowrap}
.pips{display:flex;gap:4px;margin-left:4px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(201,162,74,.7)}
.pips i.on{background:radial-gradient(circle at 35% 35%,#f6e3a6,#c9a24a 60%,#7a5a1e);border-color:#f6e3a6}
.spacer{flex:1}
#msg{font-size:15px;line-height:1.5;text-align:center;color:rgba(239,228,201,.92);min-height:1.5em;padding:0 6px}
#stageWrap{flex:1;position:relative;min-height:0}
#stageWrap.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
#board{position:absolute;inset:0;touch-action:manipulation}
#callout{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;--cfs:64px}
#callout.show{animation:call .6s cubic-bezier(.2,1.35,.4,1) forwards}
@keyframes call{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7);filter:blur(8px)}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}
.cn{font-family:var(--brush);font-size:var(--cfs);line-height:1.05;color:var(--zoge);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 24px rgba(0,0,0,.6)}
.cn rt{font-family:var(--mincho);font-size:.17em;letter-spacing:.25em;color:rgba(239,228,201,.8);text-shadow:none}
.noble .cn{color:#f3d98e;text-shadow:0 3px 0 rgba(60,30,0,.7),0 0 28px rgba(236,209,138,.55)}
.cv{font-family:var(--brush);font-size:calc(var(--cfs)*.36);color:var(--kin-hi);text-shadow:0 2px 0 rgba(0,0,0,.6);margin-top:.1em}
.ct{margin-top:8px;font-size:13px;letter-spacing:.16em;color:#f7e6b8;background:rgba(92,26,31,.9);border:1px solid var(--kin);padding:2px 10px;border-radius:3px;white-space:nowrap}
.cb{margin-top:4px;font-size:12px;letter-spacing:.06em;color:rgba(239,228,201,.88);text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap}
#coach{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:min(92%,480px);padding:8px 14px;background:rgba(28,15,11,.95);
  border:1px solid var(--kin);border-radius:6px;font-size:14px;line-height:1.65;color:var(--zoge);box-shadow:0 6px 20px rgba(0,0,0,.6);z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
#coach.show{opacity:1;pointer-events:auto;cursor:pointer}
.ib{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.ib .btn-icon{width:36px;height:36px;font-size:16px}
.ib small{font-size:10px;line-height:1;color:rgba(239,228,201,.7);white-space:nowrap}

/* ---------- 窓 ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,4,2,.74);display:flex;align-items:center;justify-content:center;padding:14px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal .scroll{max-height:92vh;overflow:auto;width:min(640px,100%);background:linear-gradient(160deg,#3a1d13,#23110b 70%);border:1px solid var(--kin);border-radius:10px;
  padding:clamp(18px,4vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 0 5px rgba(28,15,11,.9),inset 0 0 0 6px rgba(201,162,74,.35);-webkit-user-select:text;user-select:text}
.modal h2{font-family:var(--brush);font-weight:400;font-size:32px;color:var(--kin-hi);margin-bottom:12px;letter-spacing:.1em}
.modal h3{font-size:17px;color:var(--kin-hi);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(201,162,74,.3)}
.modal p,.modal li{font-size:15px;line-height:1.85;max-width:40em}
.modal ul{padding-left:1.2em}
.modal .note{font-size:13px;opacity:.75;margin-top:10px}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{font-weight:400;font-size:12px;opacity:.7;text-align:left;padding:4px 6px;border-bottom:1px solid rgba(201,162,74,.3)}
.tt td{padding:6px;border-bottom:1px solid rgba(201,162,74,.12);vertical-align:middle}
.tt .nm{font-family:var(--brush);font-size:22px}
.tt .nm small{font-family:var(--mincho);font-size:11px;opacity:.7;margin-left:4px}
.tt tr.nb .nm{color:#f3d98e}
.tt .vv{font-size:16px;font-weight:700}
.minis{display:inline-flex;gap:3px}
.ms{display:inline-flex;align-items:center;justify-content:center;width:13px;height:38px;border-radius:7px;font-size:9px;writing-mode:vertical-rl;font-family:var(--brush)}
.ms.b{background:linear-gradient(90deg,#3a2a22,#0c0706);box-shadow:inset 0 0 0 1px rgba(201,162,74,.8);color:#e0503c}
.ms.w{background:linear-gradient(90deg,#f6ead0,#c9ae7c);color:#2a1a12}
.mbtns{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:22px;flex-wrap:wrap}
.res{text-align:center}
.res-k{font-family:var(--brush);font-size:clamp(96px,22vh,150px);line-height:1;margin:6px 0 4px}
.res.win .res-k{background:linear-gradient(172deg,#f6e3a6,#c9a24a 45%,#8a6a2a 70%,#ecd18a);-webkit-background-clip:text;background-clip:text;color:transparent}
.res.lose .res-k{color:#a89a82}
.res-t{font-size:18px;margin-bottom:14px;max-width:none!important}
.res-s{display:grid;grid-template-columns:auto auto;gap:6px 18px;justify-content:center;font-size:15px}
.res-s dt{opacity:.7;text-align:right}
.res-s dd{text-align:left;font-weight:700}

@media (max-width:720px),(max-aspect-ratio:4/5){
  #title{flex-direction:column;gap:20px;justify-content:flex-start;overflow-y:auto;padding-top:max(36px,6vh)}
  #tcan{height:clamp(160px,30vh,250px);width:clamp(150px,42vw,220px)}
  .t-name{font-size:clamp(54px,10.5vh,96px)}
}
@media (max-width:560px){
  .bar.bottom{grid-template-columns:1fr auto;row-gap:4px}
  #msg{grid-column:1/-1;order:-1;font-size:14px}
  .lv{display:none}
}
@media (prefers-reduced-motion:reduce){
  .t-name,.seal,.t-menu{animation:none}
  #stageWrap.shake{animation:none}
  .btn-main.ready{animation:none;box-shadow:0 4px 0 #4a0f0b,0 0 0 2px var(--kin-hi)}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<section id="title" class="screen">
  <div class="t-hero">
    <canvas id="tcan" aria-hidden="true"></canvas>
    <div class="t-mark">
      <h1 class="t-name">かりうち</h1>
      <div class="seal" aria-hidden="true">樗蒲</div>
    </div>
  </div>
  <div class="t-menu">
    <div class="opt"><span class="opt-l" id="l-level">相手の強さ</span>
      <div class="seg" data-key="level" role="group" aria-labelledby="l-level">
        <button data-v="easy">やさしい</button><button data-v="normal" aria-pressed="true">ふつう</button><button data-v="hard">つよい</button>
      </div></div>
    <div class="opt"><span class="opt-l" id="l-n">馬の数</span>
      <div class="seg" data-key="n" role="group" aria-labelledby="l-n">
        <button data-v="3">三</button><button data-v="4" aria-pressed="true">四</button><button data-v="5">五</button>
      </div></div>
    <div class="opt"><span class="opt-l" id="l-first">先に投げる</span>
      <div class="seg" data-key="first" role="group" aria-labelledby="l-first">
        <button data-v="0" aria-pressed="true">あなた</button><button data-v="1">相手</button><button data-v="r">くじ</button>
      </div></div>
    <div class="opt"><span class="opt-l" id="l-speed">速さ</span>
      <div class="seg" data-key="speed" role="group" aria-labelledby="l-speed">
        <button data-v="normal" aria-pressed="true">ふつう</button><button data-v="fast">はやい</button>
      </div></div>
    <button id="btnStart" class="btn-main">対局を始める</button>
    <button id="btnRules" class="btn-sub">遊び方</button>
  </div>
</section>

<section id="game" class="screen hidden">
  <header class="bar top">
    <div class="ib"><button id="btnBack" class="btn-icon" aria-label="題字に戻る">戻</button><small aria-hidden="true">戻る</small></div>
    <div class="plate" id="plate1"><i class="pc p1"></i><span class="pn">相手</span><span class="lv" id="lvName"></span><span class="pips" id="pips1"></span></div>
    <div class="spacer"></div>
    <div class="ib"><button id="btnHelp" class="btn-icon" aria-label="遊び方">法</button><small aria-hidden="true">遊び方</small></div>
  </header>
  <div id="stageWrap">
    <canvas id="board" aria-label="盤"></canvas>
    <div id="callout" aria-live="polite"></div>
    <div id="coach" role="status"></div>
  </div>
  <footer class="bar bottom">
    <div class="plate" id="plate0"><i class="pc p0"></i><span class="pn">あなた</span><span class="pips" id="pips0"></span></div>
    <p id="msg" aria-live="polite"></p>
    <button id="btnThrow" class="btn-main small" disabled>投げる</button>
  </footer>
</section>

<button id="btnSound" class="btn-icon" aria-pressed="true" aria-label="音">音</button>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="scroll"><div id="modalBody"></div></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(()=>{
'use strict';

/* ================= SPEC（仕様データ） ================= */
const SPEC={
  track:36, gates:[12,24], sections:['序','破','急'], sectionLabelAt:[5,17,29], highThrow:8,
  levels:{
    easy:  {label:'やさしい',rand:.45,danger:0,   threat:0,  stack:0,  noise:4},
    normal:{label:'ふつう',  rand:0,  danger:.6,  threat:.2, stack:1.5,noise:2.5},
    hard:  {label:'つよい',  rand:0,  danger:1.05,threat:.35,stack:2,  noise:0}
  },
  hitBonus:6, goalBonus:8,
  timing:{throwMs:1250, stepMs:135, cpuThink:650, afterThrow:600, fly:540}
};
const THROWS={
  ro:   {name:'盧',yomi:'ろ',  v:16,noble:true},
  chi:  {name:'雉',yomi:'ち',  v:14,noble:true},
  kai:  {name:'開',yomi:'かい',v:12,noble:false},
  sai:  {name:'塞',yomi:'さい',v:11,noble:false},
  toku: {name:'犢',yomi:'とく',v:10,noble:true},
  haku: {name:'白',yomi:'はく',v:8, noble:true},
  to:   {name:'塔',yomi:'とう',v:5, noble:false},
  toku2:{name:'禿',yomi:'とく',v:4, noble:false},
  ketsu:{name:'撅',yomi:'けつ',v:3, noble:false},
  kyo:  {name:'梟',yomi:'きょう',v:2,noble:false}
};
const KANSUJI={1:'一',2:'二',3:'三',4:'四',5:'五',8:'八',10:'十',11:'十一',12:'十二',14:'十四',16:'十六'};
const PAL={
  p0:{hi:'#e8705a',mid:'#b3322a',lo:'#5e1510',edge:'#3e0c08',rim:'#d9b45c',glyph:'#f0d27e'},
  p1:{hi:'#fffaf0',mid:'#e9dcbc',lo:'#a48b5c',edge:'#5e4629',rim:'#6b4a24',glyph:'#2a1a12'},
  kin:'#c9a24a',kinHi:'#ecd18a',zoge:'#efe4c9',akane:'#5c1a1f'
};
const FB='"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif';
const TAU=Math.PI*2;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=SPEC.timing, TR=SPEC.track;

/* ================= 汎用 ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,p){const n=parseInt(hex.slice(1),16),f=p/100;const adj=v=>clamp(Math.round(f>=0?v+(255-v)*f:v*(1+f)),0,255);return `rgb(${adj(n>>16)},${adj(n>>8&255)},${adj(n&255)})`;}
function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= 采（五木）の判定 ================= */
// faces[0],[1] は刻みのある投木（黒面＝雉、白面＝犢）。1＝黒
function classify(f){
  const m=f[0]+f[1], p=f[2]+f[3]+f[4], t=m+p;
  if(t===5) return 'ro';
  if(t===0) return 'haku';
  if(m===2&&p===0) return 'chi';
  if(m===0&&p===3) return 'toku';
  if(m===2&&p===1) return 'kai';
  if(m===0&&p===2) return 'sai';
  return ({4:'to',3:'toku2',2:'ketsu',1:'kyo'})[t];
}
const facesOf=b=>[0,1,2,3,4].map(i=>(b>>i)&1);
const OUTCOMES=(()=>{const cnt={};for(let b=0;b<32;b++){const k=classify(facesOf(b));cnt[k]=(cnt[k]||0)+1;}
  return Object.keys(THROWS).map(k=>({key:k,...THROWS[k],n:cnt[k],p:cnt[k]/32}));})();
function repFaces(key){for(let b=0;b<32;b++){const f=facesOf(b);if(classify(f)===key)return f;}}

/* ================= 規則エンジン ================= */
function destOf(from,v){return from<0?v-2:from+v;}
function crossesGate(from,to){return SPEC.gates.some(g=>from<g&&to>=g);}
function groupsOf(pos,side){
  const m=new Map();
  pos[side].forEach((p,i)=>{if(p>=0&&p<TR){if(!m.has(p))m.set(p,[]);m.get(p).push(i);}});
  const g=[...m].map(([from,idxs])=>({from,idxs}));
  const s=pos[side].findIndex(p=>p<0);
  if(s>=0) g.push({from:-1,idxs:[s]});
  return g;
}
function legalMoves(pos,side,res){
  const out=[],opp=1-side;
  for(const g of groupsOf(pos,side)){
    const dest=destOf(g.from,res.v);
    if(crossesGate(g.from,Math.min(dest,TR))&&res.v<SPEC.highThrow) continue;
    if(dest>=TR){out.push({side,from:g.from,to:TR,idxs:g.idxs,hits:[]});continue;}
    const e=[];pos[opp].forEach((p,i)=>{if(p===dest)e.push(i);});
    if(e.length&&!(e.length<=g.idxs.length||res.noble)) continue;
    out.push({side,from:g.from,to:dest,idxs:g.idxs,hits:e});
  }
  return out;
}
function applyMove(pos,mv){
  const np=[pos[0].slice(),pos[1].slice()];
  mv.idxs.forEach(i=>np[mv.side][i]=mv.to);
  mv.hits.forEach(i=>np[1-mv.side][i]=-1);
  return np;
}
const doneCount=(pos,side)=>pos[side].filter(p=>p>=TR).length;

/* ================= CPU思考 ================= */
function hitProb(pos,side,cell,k){ // sideの馬群(cell,k)が次の一投で打たれる確率
  const gs=groupsOf(pos,1-side);let p=0;
  for(const o of OUTCOMES){
    if(gs.some(g=>{const d=destOf(g.from,o.v);if(d!==cell)return false;
      if(crossesGate(g.from,d)&&o.v<SPEC.highThrow)return false;return g.idxs.length>=k||o.noble;})) p+=o.p;
  }
  return p;
}
function evaluate(pos,side,lv){
  const prog=s=>pos[s].reduce((a,p)=>a+(p<0?0:p>=TR?TR+SPEC.goalBonus:p+1),0);
  let sc=prog(side)-prog(1-side);
  if(lv.danger>0){
    for(const g of groupsOf(pos,side)) if(g.from>=0) sc-=lv.danger*hitProb(pos,side,g.from,g.idxs.length)*(g.from+1)*g.idxs.length;
    for(const g of groupsOf(pos,1-side)) if(g.from>=0) sc+=lv.threat*hitProb(pos,1-side,g.from,g.idxs.length)*(g.from+1)*g.idxs.length;
  }
  return sc;
}
function chooseMove(moves,side){
  const lv=SPEC.levels[G.level];
  if(Math.random()<lv.rand) return moves[Math.random()*moves.length|0];
  let best=moves[0],bs=-1e9;
  for(const m of moves){
    let s=evaluate(applyMove(G.pos,m),side,lv);
    if(m.hits.length) s+=SPEC.hitBonus;
    if(m.to<TR&&G.pos[side].some((p,i)=>p===m.to&&!m.idxs.includes(i))) s+=lv.stack;
    s+=(Math.random()-.5)*lv.noise;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}

const Sound={
  ctx:null,on:true,bgm:false,cache:{},
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{
      const c=this.ctx=new AC();
      this.master=c.createGain();this.master.gain.value=this.on?.8:0;this.master.connect(c.destination);
      this.rev=c.createConvolver();this.rev.buffer=this.makeIR(2.4);
      const rg=c.createGain();rg.gain.value=.3;this.rev.connect(rg);rg.connect(this.master);
      this.startBgm();
    }catch(e){this.ctx=null;}
  },
  ready(){return !!(this.ctx&&this.on);},
  makeIR(sec){const c=this.ctx,len=c.sampleRate*sec|0,b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}return b;},
  out(node,wet){node.connect(this.master);if(wet>0){const g=this.ctx.createGain();g.gain.value=wet;node.connect(g);g.connect(this.rev);}},
  setOn(v){this.on=v;if(this.master)this.master.gain.setTargetAtTime(v?.8:0,this.ctx.currentTime,.05);},
  noiseBuf(){if(this._nb)return this._nb;const c=this.ctx,b=c.createBuffer(1,c.sampleRate*.5|0,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return this._nb=b;},
  clack(t0,f,vol){
    if(!this.ready())return;const c=this.ctx,t=c.currentTime+t0;
    const s=c.createBufferSource();s.buffer=this.noiseBuf();
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=7;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);
    s.connect(bp);bp.connect(g);this.out(g,.25);s.start(t);s.stop(t+.1);
    const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f*.42,t);
    const g2=c.createGain();g2.gain.setValueAtTime(vol*.3,t);g2.gain.exponentialRampToValueAtTime(.001,t+.09);
    o.connect(g2);this.out(g2,.2);o.start(t);o.stop(t+.12);
  },
  sticks(){for(let i=0;i<8;i++)this.clack(i*.03+Math.random()*.05,1500+Math.random()*1800,.2+Math.random()*.3);},
  tock(){this.clack(0,850+Math.random()*250,.22);},
  ks(f){
    const k=Math.round(f);if(this.cache[k])return this.cache[k];
    const c=this.ctx,sr=c.sampleRate,len=sr*2.4|0,b=c.createBuffer(1,len,sr),d=b.getChannelData(0);
    const N=Math.max(2,Math.round(sr/f)),buf=new Float32Array(N);
    for(let i=0;i<N;i++)buf[i]=Math.random()*2-1;
    let idx=0;for(let i=0;i<len;i++){const nx=(idx+1)%N,v=buf[idx];d[i]=v;buf[idx]=.4982*(v+buf[nx]);idx=nx;}
    return this.cache[k]=b;
  },
  pluck(f,t0=0,vol=.35,wet=.5){
    if(!this.ready())return;const c=this.ctx,t=c.currentTime+t0;
    const s=c.createBufferSource();s.buffer=this.ks(f);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*9);
    const g=c.createGain();g.gain.value=vol;s.connect(lp);lp.connect(g);this.out(g,wet);s.start(t);
  },
  taiko(vol=.9){
    if(!this.ready())return;const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(46,t+.3);
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g);this.out(g,.35);o.start(t);o.stop(t+1);
    const n=c.createBufferSource();n.buffer=this.noiseBuf();const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
    const ng=c.createGain();ng.gain.setValueAtTime(vol*.5,t);ng.gain.exponentialRampToValueAtTime(.001,t+.18);
    n.connect(lp);lp.connect(ng);this.out(ng,.2);n.start(t);n.stop(t+.25);
  },
  chime(base=1320,vol=.16){
    if(!this.ready())return;const c=this.ctx,t=c.currentTime;
    [1,2.76,5.4,8.93].forEach((m,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=base*m;
      const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol/(i+1),t+.005);
      g.gain.exponentialRampToValueAtTime(.0005,t+1.8/(1+i*.6));o.connect(g);this.out(g,.6);o.start(t);o.stop(t+2);});
  },
  fanfare(){const s=[293.66,311.13,392,440,466.16,587.33,622.25,783.99];s.forEach((f,i)=>this.pluck(f,i*.11,.32,.7));
    [293.66,440,587.33].forEach(f=>this.pluck(f,1.05,.28,.8));this.chime(1760,.12);},
  lose(){this.taiko(.7);this.pluck(146.83,.25,.35,.8);this.pluck(155.56,.55,.28,.8);},
  startBgm(){
    if(!this.ctx||this.bgm)return;this.bgm=true;const c=this.ctx;
    const g=c.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.042,c.currentTime+5);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.connect(g);this.out(g,.7);
    [293.66,440,493.88,659.25].forEach((f,i)=>{
      const o=c.createOscillator();o.type=i%2?'triangle':'sawtooth';o.frequency.value=f;o.detune.value=(Math.random()-.5)*10;
      const og=c.createGain();og.gain.value=i%2?.28:.1;
      const l=c.createOscillator();l.frequency.value=.04+i*.017;const lg=c.createGain();lg.gain.value=og.gain.value*.6;
      l.connect(lg);lg.connect(og.gain);o.connect(og);og.connect(lp);o.start();l.start();});
    const scale=[293.66,311.13,392,440,466.16,587.33,622.25,783.99];
    const tick=()=>{if(this.on){this.pluck(scale[Math.random()*scale.length|0],0,.1,.85);
      if(Math.random()<.35)this.pluck(scale[Math.random()*scale.length|0],.2,.07,.85);}
      setTimeout(tick,1900+Math.random()*2800);};
    setTimeout(tick,2500);
  }
};

/* ================= 盤の幾何 ================= */
function buildPath(cols,rows){
  const p=[];
  for(let y=rows-1;y>=0;y--)p.push([0,y]);
  for(let x=1;x<cols;x++)p.push([x,0]);
  for(let y=1;y<rows;y++)p.push([cols-1,y]);
  for(let x=cols-2;x>=1;x--)p.push([x,rows-1]);
  return p;
}
function cellC(i){const [x,y]=V.path[i];return {x:V.ox+(x+.5)*V.cs,y:V.oy+(y+.5)*V.cs};}
function outward(i){const [x,y]=V.path[i];if(y===V.rows-1)return{x:0,y:1};if(x===0)return{x:-1,y:0};if(y===0)return{x:0,y:-1};return{x:1,y:0};}
function slotPos(side,kind,k){
  const r=V.tray[side][kind],cs=V.cs,first=r.x+cs*.78;
  const step=Math.min(cs*.8,(r.x+r.w-cs*.42-first)/Math.max(1,G.n-1));
  return {x:first+k*step,y:r.y+r.h/2};
}
function rankOf(side,i,kind){
  const list=[];G.pos[side].forEach((p,j)=>{if(kind==='start'?p<0:p>=TR)list.push(j);});
  return Math.max(0,list.indexOf(i));
}
function layout(){
  const r=wrap.getBoundingClientRect();
  const W=Math.max(240,Math.floor(r.width)),H=Math.max(240,Math.floor(r.height));
  const land=W>=H*.92;
  V.cols=land?11:9;V.rows=land?9:11;
  const padC=.62;
  V.cs=Math.max(16,Math.floor(Math.min(W/(V.cols+padC*2+.2),H/(V.rows+padC*2+.2))));
  V.pad=V.cs*padC;V.W=W;V.H=H;V.dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*V.dpr);cv.height=Math.round(H*V.dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  V.ox=Math.round((W-V.cs*V.cols)/2);V.oy=Math.round((H-V.cs*V.rows)/2);
  V.path=buildPath(V.cols,V.rows);
  const cs=V.cs,ix=V.ox+cs,iw=(V.cols-2)*cs;
  V.tray=[0,1].map(s=>{const y=V.oy+(s===0?V.rows-2:1)*cs+cs*.1,h=cs*.8,w=iw/2-cs*.3;
    return {start:{x:ix+cs*.15,y,w,h},goal:{x:ix+iw/2+cs*.15,y,w,h}};});
  V.mat={x:ix+cs*.18,y:V.oy+2*cs+cs*.14,w:iw-cs*.36,h:(V.rows-4)*cs-cs*.28};
  const m=V.mat;V.side=m.w>m.h*1.25;
  V.L=Math.min(m.w*.3,m.h/1.85,cs*2.7);V.SW=V.L*.17;
  V.sg=V.side?{x:m.x+m.w*.33,y:m.y+m.h*.5}:{x:m.x+m.w*.5,y:m.y+m.h*.34};
  V.co=V.side?{x:m.x+m.w*.72,y:m.y+m.h*.5}:{x:m.x+m.w*.5,y:m.y+m.h*.79};
  callout.style.left=V.co.x+'px';callout.style.top=V.co.y+'px';
  callout.style.setProperty('--cfs',Math.round(Math.min(cs*1.6,m.h*(V.side?.42:.2)))+'px');
  buildStatic();
}

function woodFill(c,x,y,w,h,base,seed,dark=.2){
  const R=rng(seed);
  const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,shade(base,8));g.addColorStop(.5,base);g.addColorStop(1,shade(base,-18));
  c.fillStyle=g;c.fillRect(x,y,w,h);
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  const lines=Math.floor(h/2.6);
  for(let i=0;i<lines;i++){
    const yy=y+R()*h,amp=2+R()*7,fr=.002+R()*.01,ph=R()*TAU;
    c.strokeStyle=R()<.65?`rgba(0,0,0,${R()*dark})`:`rgba(255,215,170,${R()*.06})`;
    c.lineWidth=.5+R()*1.6;c.beginPath();
    for(let xx=x;xx<=x+w+6;xx+=6){const yv=yy+Math.sin(xx*fr+ph)*amp+Math.sin(xx*fr*3.1+ph*2)*amp*.3;xx===x?c.moveTo(xx,yv):c.lineTo(xx,yv);}
    c.stroke();
  }
  c.restore();
}
function rosette(c,x,y,r,col,alpha=1){ // 宝相華
  c.save();c.translate(x,y);c.globalAlpha=alpha;
  for(let layer=0;layer<2;layer++){
    const rr=layer?r*.56:r,rot=layer?Math.PI/8:0;
    c.fillStyle=layer?shade(col,22):col;
    for(let k=0;k<8;k++){c.save();c.rotate(rot+k*TAU/8);c.beginPath();c.moveTo(0,0);
      c.bezierCurveTo(rr*.35,-rr*.27,rr*.9,-rr*.34,rr,0);c.bezierCurveTo(rr*.9,rr*.34,rr*.35,rr*.27,0,0);c.fill();c.restore();}
  }
  c.beginPath();c.arc(0,0,r*.2,0,TAU);c.fillStyle=PAL.akane;c.fill();c.lineWidth=Math.max(.6,r*.06);c.strokeStyle=col;c.stroke();
  c.restore();
}
function pearl(c,x,y,r){ // 螺鈿
  const g=c.createLinearGradient(x-r,y-r,x+r,y+r);
  ['#eaf6f2','#c7d6f2','#f3d6e6','#d6f0dc','#f6ecd0','#cfe0f6'].forEach((s,i,a)=>g.addColorStop(i/(a.length-1),s));
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
}
function drawMat(c,m){
  const cs=V.cs;
  c.save();roundRect(c,m.x,m.y,m.w,m.h,cs*.1);c.clip();
  const g=c.createLinearGradient(m.x,m.y,m.x,m.y+m.h);g.addColorStop(0,'#6c2027');g.addColorStop(1,'#3f1118');
  c.fillStyle=g;c.fillRect(m.x,m.y,m.w,m.h);
  const sp=cs*.74,cx0=m.x+m.w/2,cy0=m.y+m.h/2,C1=cx0-cy0,C2=cx0+cy0;
  c.strokeStyle='rgba(201,162,74,.17)';c.lineWidth=1;
  const n0=Math.floor((m.x-m.y-m.h-C1)/sp)-1,n1=Math.ceil((m.x+m.w-m.y-C1)/sp)+1;
  for(let n=n0;n<=n1;n++){const d=C1+n*sp;c.beginPath();c.moveTo(m.x-m.h,m.x-m.h-d);c.lineTo(m.x+m.w+m.h,m.x+m.w+m.h-d);c.stroke();}
  const s0=Math.floor((m.x+m.y-C2)/sp)-1,s1=Math.ceil((m.x+m.w+m.y+m.h-C2)/sp)+1;
  for(let n=s0;n<=s1;n++){const s=C2+n*sp;c.beginPath();c.moveTo(m.x-m.h,s-m.x+m.h);c.lineTo(m.x+m.w+m.h,s-m.x-m.w-m.h);c.stroke();}
  const ni=Math.ceil(m.w/sp)+1,nj=Math.ceil(m.h/sp)+1;
  for(let i=-ni;i<=ni;i++)for(let j=-nj;j<=nj;j++){if((i+j)&1)continue;
    const x=cx0+i*sp/2,y=cy0+j*sp/2;if(x<m.x-4||x>m.x+m.w+4||y<m.y-4||y>m.y+m.h+4)continue;
    rosette(c,x,y,sp*.15,'#c9a24a',.34);}
  rosette(c,cx0,cy0,Math.min(m.w,m.h)*.34,'#c9a24a',.07);
  const vg=c.createRadialGradient(cx0,cy0,Math.min(m.w,m.h)*.2,cx0,cy0,Math.max(m.w,m.h)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=vg;c.fillRect(m.x,m.y,m.w,m.h);
  c.restore();
  c.lineWidth=2;c.strokeStyle=PAL.kin;roundRect(c,m.x,m.y,m.w,m.h,cs*.1);c.stroke();
  c.lineWidth=1;c.strokeStyle='rgba(236,209,138,.4)';roundRect(c,m.x+cs*.12,m.y+cs*.12,m.w-cs*.24,m.h-cs*.24,cs*.06);c.stroke();
}
function drawTray(c,r,label,side){

  c.lineWidth=1.2;c.strokeStyle=side===0?'rgba(224,110,86,.6)':'rgba(239,228,201,.45)';c.stroke();
  c.fillStyle='rgba(236,209,138,.85)';c.font=`${cs*.42}px ${FB}`;c.textAlign='center';c.textBaseline='middle';
  c.fillText(label,r.x+cs*.34,r.y+r.h/2+cs*.02);
  c.strokeStyle='rgba(201,162,74,.3)';c.beginPath();c.moveTo(r.x+cs*.6,r.y+r.h*.2);c.lineTo(r.x+cs*.6,r.y+r.h*.8);c.stroke();
  drawPiece(c,r.x+cs*.16,r.y+cs*.12,cs*.12,side); // 陣営の駒印

    let dx,dy;if(b){dx=b.x-a.x;dy=b.y-a.y;}else{dx=a.x-pv.x;dy=a.y-pv.y;}
    const dl=Math.hypot(dx,dy);dx/=dl;dy/=dl;
    const hx=a.x+dx*cs*.33,hy=a.y+dy*cs*.33,s=cs*.08;

    c.lineCap='butt';
    const px=mx+nx*(cs*.5+pad*.5),py=my+ny*(cs*.5+pad*.5),rr=Math.min(pad*.44,cs*.28);
    c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.arc(px+1,py+2,rr*1.1,0,TAU);c.fill();

    c.fillStyle='#2a1a12';c.font=`${rr*1.25}px ${FB}`;c.fillText('関',px,py+rr*.05);

    c.fillText('入',b.x,b.y+cs*.5+pad*.48);c.fillText('上',a.x,a.y+cs*.5+pad*.48);}

function drawPiece(c,x,y,r,side,alpha=1){
  const P=side===0?PAL.p0:PAL.p1;
  c.save();c.globalAlpha=alpha;
  c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(x+r*.12,y+r*.26,r*1.02,r*.88,0,0,TAU);c.fill();
  c.fillStyle=P.edge;c.beginPath();c.arc(x,y+r*.13,r,0,TAU);c.fill();
  const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.05);g.addColorStop(0,P.hi);g.addColorStop(.55,P.mid);g.addColorStop(1,P.lo);
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  c.lineWidth=Math.max(1,r*.09);c.strokeStyle=P.rim;c.beginPath();c.arc(x,y,r*.83,0,TAU);c.stroke();
  c.fillStyle=P.glyph;c.font=`${r*1.02}px ${FB}`;c.textAlign='center';c.textBaseline='middle';c.fillText('馬',x,y+r*.06);
  c.globalAlpha=alpha*.32;c.fillStyle='#fff';c.beginPath();c.ellipse(x-r*.32,y-r*.46,r*.36,r*.14,-.5,0,TAU);c.fill();
  c.restore();
}
function drawStack(c,x,y,r,side,n,alpha=1,lift=0){
  const vis=Math.min(n,3);
  for(let k=0;k<vis;k++)drawPiece(c,x,y-lift-k*r*.24,r,side,alpha);
  if(n>1){const bx=x+r*.8,by=y-lift-(vis-1)*r*.24-r*.74,br=r*.4;
    c.save();c.globalAlpha=alpha;c.fillStyle='#1c0f0b';c.beginPath();c.arc(bx,by,br,0,TAU);c.fill();
    c.lineWidth=1.3;c.strokeStyle=PAL.kinHi;c.stroke();
    c.fillStyle=PAL.kinHi;c.font=`${br*1.3}px ${FB}`;c.textAlign='center';c.textBaseline='middle';c.fillText(KANSUJI[n]||n,bx,by+br*.06);c.restore();}
}
function stickShape(c,L,W){
  const h=L/2,w=W/2,k=W*1.5;c.beginPath();c.moveTo(-h,0);
  c.quadraticCurveTo(-h+W*.25,-w,-h+k,-w);c.lineTo(h-k,-w);c.quadraticCurveTo(h-W*.25,-w,h,0);
  c.quadraticCurveTo(h-W*.25,w,h-k,w);c.lineTo(-h+k,w);c.quadraticCurveTo(-h+W*.25,w,-h,0);c.closePath();
}
function drawStick(c,x,y,L,W,ang,flip,marked,lift){
  const cf=Math.cos(flip),black=cf>=0,sq=Math.max(.14,Math.abs(cf));
  c.save();c.translate(x+lift*.25,y+W*.3+lift*.15);c.rotate(ang);c.scale(1,Math.max(.5,sq));
  c.fillStyle=`rgba(0,0,0,${clamp(.44-lift/(L*1.6),.12,.44)})`;stickShape(c,L*1.02,W*1.15);c.fill();c.restore();
  c.save();c.translate(x,y-lift);c.rotate(ang);
  c.save();c.translate(0,W*.14);c.scale(1,sq);c.fillStyle='#4a2d18';stickShape(c,L,W);c.fill();c.restore();
  c.scale(1,sq);stickShape(c,L,W);
  if(black){
    const g=c.createLinearGradient(0,-W/2,0,W/2);g.addColorStop(0,'#4d372c');g.addColorStop(.35,'#1e1310');g.addColorStop(1,'#0c0706');
    c.fillStyle=g;c.fill();c.lineWidth=Math.max(.8,W*.06);c.strokeStyle='rgba(201,162,74,.85)';c.stroke();
    if(!marked){c.fillStyle='rgba(201,162,74,.8)';c.fillRect(-L*.3,-W*.34,W*.12,W*.68);c.fillRect(L*.3-W*.12,-W*.34,W*.12,W*.68);}
  }else{
    const g=c.createLinearGradient(0,-W/2,0,W/2);g.addColorStop(0,'#f6ead0');g.addColorStop(.5,'#e2cc9c');g.addColorStop(1,'#b8995f');
    c.fillStyle=g;c.fill();c.lineWidth=Math.max(.8,W*.05);c.strokeStyle='rgba(90,58,30,.6)';c.stroke();
    c.save();stickShape(c,L,W);c.clip();c.strokeStyle='rgba(120,80,40,.22)';c.lineWidth=.7;
    for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(-L/2,k*W*.16);c.bezierCurveTo(-L*.15,k*W*.16+W*.08,L*.15,k*W*.16-W*.08,L/2,k*W*.16);c.stroke();}
    c.restore();
  }
  if(marked){c.fillStyle=black?'#e0503c':'#2a1a12';c.font=`${W*.84}px ${FB}`;c.textAlign='center';c.textBaseline='middle';c.fillText(black?'雉':'犢',0,W*.04);}
  c.restore();
}

/* ================= 投木 ================= */
function restSticks(){
  const m=V.mat;
  G.sticks=[0,1,2,3,4].map(s=>{const x=V.sg.x,y=V.sg.y+(s-2)*V.SW*2.15,marked=s===1||s===3;
    const st={u:(x-m.x)/m.w,v:(y-m.y)/m.h,ang:0,flip:marked?Math.PI:0};return {marked,delay:0,a:st,b:st};});
  G.stickT0=0;
}
function throwSticks(side){
  return new Promise(resolve=>{
    callout.classList.remove('show');
    const faces=[0,1,2,3,4].map(()=>Math.random()<.5?1:0);
    const res={key:classify(faces),...THROWS[classify(faces)],faces};
    const m=V.mat,L=V.L,W=V.SW,order=shuffle([0,1,2,3,4]);
    G.sticks=order.map((si,slot)=>{
      const fx=V.sg.x+(Math.random()-.5)*L*.2,fy=V.sg.y+(slot-2)*W*2.15+(Math.random()-.5)*W*.35,fa=(Math.random()-.5)*.3;
      const sx=V.sg.x+(Math.random()-.5)*m.w*.3,sy=side===0?m.y+m.h+L*.5:m.y-L*.5;
      const black=faces[si]===1,spin=(Math.random()<.5?-1:1)*Math.PI*(1+Math.random()*1.5);
      return {marked:si<2,delay:slot*.045,
        a:{u:(sx-m.x)/m.w,v:(sy-m.y)/m.h,ang:fa+spin,flip:0},
        b:{u:(fx-m.x)/m.w,v:(fy-m.y)/m.h,ang:fa,flip:TAU*(2+(Math.random()*2|0))+(black?0:Math.PI)}};
    });
    G.stickDur=tm(T.throwMs)*(RM?.5:1);G.stickT0=performance.now();
    Sound.clack(0,700,.12);
    setTimeout(()=>Sound.sticks(),G.stickDur*.7);
    setTimeout(()=>{
      showCallout(res);G.stats.throws[side]++;
      if(res.noble){Sound.chime(1320,.14);addSparks(V.co.x,V.co.y,26);}
      resolve(res);
    },G.stickDur+60);
  });
}
const FACE_NOTE={ro:'すべて黒',haku:'すべて白',chi:'雉二本が黒、他は白',toku:'犢二本が白、他は黒',kai:'雉二本と他一本が黒',sai:'犢二本と他一本が白'};
function faceBreakdown(res){
  if(!res.faces)return '';
  const b=res.faces.reduce((a,x)=>a+x,0),num=n=>n===0?'〇':KANSUJI[n];
  return `<span class="cb">黒${num(b)}・白${num(5-b)}${FACE_NOTE[res.key]?'　'+FACE_NOTE[res.key]:''}</span>`;
}
function showCallout(res){
  callout.className=res.noble?'noble':'';
  callout.innerHTML=`<ruby class="cn">${res.name}<rt>${res.yomi}</rt></ruby><span class="cv">${KANSUJI[res.v]}</span>${faceBreakdown(res)}${res.noble?'<span class="ct">貴采・もう一投</span>':''}`;
  void callout.offsetWidth;callout.classList.add('show');
}

/* ================= 駒の移動 ================= */
function srcPoint(mv){return mv.from<0?slotPos(mv.side,'start',rankOf(mv.side,mv.idxs[0],'start')):cellC(mv.from);}
function destPoint(mv){return mv.to>=TR?slotPos(mv.side,'goal',doneCount(G.pos,mv.side)):cellC(mv.to);}
function animateMove(mv){
  return new Promise(res=>{
    const pts=[srcPoint(mv)];
    for(let i=mv.from+1;i<=Math.min(mv.to,TR-1);i++)pts.push(cellC(i));
    if(mv.to>=TR)pts.push(destPoint(mv));
    const base=tm(pts.length>12?T.stepMs*.7:T.stepMs)*(RM?.4:1);
    G.anim={mv,side:mv.side,idxs:mv.idxs,n:mv.idxs.length,pts,seg:0,t0:performance.now(),step:base,done:res};
  });
}
function updateAnim(now){
  const a=G.anim;if(!a)return;
  if(G.skip&&a.side===1)a.step=Math.min(a.step,30); // 相手手番の早送り
  while(a&&now-a.t0>=a.step){
    a.seg++;a.t0+=a.step;Sound.tock();
    if(a.seg>=a.pts.length-1){finishMove(a);return;}
  }
}
function finishMove(a){
  const mv=a.mv,side=mv.side,end=a.pts[a.pts.length-1];
  const stacked=mv.to<TR&&G.pos[side].some((p,i)=>p===mv.to&&!mv.idxs.includes(i));
  G.pos=applyMove(G.pos,mv);G.anim=null;
  if(mv.to>=TR){Sound.chime(1760,.14);Sound.pluck(587.33,.05,.25,.6);addSparks(end.x,end.y,30);}
  else if(mv.hits.length){
    Sound.taiko();addInk(end.x,end.y);shake();
    const now=performance.now(),opp=1-side;
    mv.hits.forEach(i=>G.flying.push({side:opp,i,from:{...end},to:slotPos(opp,'start',rankOf(opp,i,'start')),t0:now}));
    G.stats.hits[side]+=mv.hits.length;
  }else if(stacked){Sound.pluck(440,0,.22,.5);}
  updateHUD();
  setTimeout(a.done,mv.hits.length?T.fly+80:120);
}
function shake(){if(RM)return;wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');}

/* ================= 盤上の効果 ================= */
function addInk(x,y){const cs=V.cs;G.fx.push({k:'blot',x,y,life:0,max:900,R:cs*.95});
  for(let i=0;i<18;i++){const a=Math.random()*TAU,sp=cs*(2+Math.random()*5);
    G.fx.push({k:'drop',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:cs*(.03+Math.random()*.07),life:0,max:650+Math.random()*350});}}
function addSparks(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=V.cs*(1+Math.random()*4);
  G.fx.push({k:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-V.cs,r:V.cs*(.02+Math.random()*.05),life:0,max:700+Math.random()*500});}}
function addGateMark(from){const q=cellC(from);G.fx.push({k:'gate',x:q.x,y:q.y,life:0,max:1100});}
function drawBoardFx(c,dt){
  G.fx=G.fx.filter(f=>(f.life+=dt*1000)<f.max);
  for(const f of G.fx){
    const t=f.life/f.max;
    if(f.k==='blot'){const r=f.R*easeOut(Math.min(1,t*3)),a=(1-t)*.75;
      const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,`rgba(20,6,4,${a})`);g.addColorStop(.7,`rgba(60,10,8,${a*.8})`);g.addColorStop(1,'rgba(60,10,8,0)');
      c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,TAU);c.fill();}
    else if(f.k==='gate'){const on=Math.sin(t*TAU*3)>-.2,gr=V.cs*.24,gy=f.y-V.cs*.62;
      c.save();c.globalAlpha=(on?1:.3)*(1-t*.4);pearl(c,f.x,gy,gr);
      c.lineWidth=1.5;c.strokeStyle=PAL.kin;c.beginPath();c.arc(f.x,gy,gr,0,TAU);c.stroke();
      c.fillStyle='#2a1a12';c.font=`${gr*1.25}px ${FB}`;c.textAlign='center';c.textBaseline='middle';c.fillText('関',f.x,gy+gr*.06);c.restore();}
    else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy=f.vy*.92+(f.k==='spark'?V.cs*.8*dt:0);
      c.fillStyle=f.k==='drop'?`rgba(30,8,6,${(1-t)*.85})`:`rgba(243,217,142,${1-t})`;
      c.beginPath();c.arc(f.x,f.y,f.r*(f.k==='spark'?(1-t*.5):1),0,TAU);c.fill();}
  }
}

/* ================= フレーム描画 ================= */
function drawSticks(c,now){
  const m=V.mat,L=V.L,W=V.SW;
  const Tt=G.stickT0?clamp((now-G.stickT0)/G.stickDur,0,1):1;
  for(const s of G.sticks){
    const ti=clamp((Tt-s.delay)/.8,0,1),e=easeOut(ti);
    const x=m.x+lerp(s.a.u,s.b.u,e)*m.w,y=m.y+lerp(s.a.v,s.b.v,e)*m.h;
    let lift=0;if(ti<.78)lift=Math.sin(Math.PI*ti/.78)*L*.55;else if(ti<1)lift=Math.sin(Math.PI*(ti-.78)/.22)*L*.07;
    drawStick(c,x,y,L,W,lerp(s.a.ang,s.b.ang,e),lerp(s.a.flip,s.b.flip,e),s.marked,lift);
  }
}
function drawPieces(c){
  const r=V.cs*.36;
  for(const s of [0,1]){
    const skip=new Set();
    if(G.anim&&G.anim.side===s)G.anim.idxs.forEach(i=>skip.add(i));
    G.flying.forEach(f=>{if(f.side===s)skip.add(f.i);});
    const cells=new Map();let si=0,gi=0;
    G.pos[s].forEach((p,i)=>{
      if(p<0){const k=si++;if(!skip.has(i)){const q=slotPos(s,'start',k);drawPiece(c,q.x,q.y,r,s);}}
      else if(p>=TR){const k=gi++;if(!skip.has(i)){const q=slotPos(s,'goal',k);drawPiece(c,q.x,q.y,r,s);}}
      else if(!skip.has(i))cells.set(p,(cells.get(p)||0)+1);
    });
    [...cells].sort((a,b)=>cellC(a[0]).y-cellC(b[0]).y).forEach(([p,n])=>{const q=cellC(p);drawStack(c,q.x,q.y,r,s,n);});
  }
}
function drawPreview(c,mv,pulse){
  const cs=V.cs,r=cs*.36;
  c.fillStyle=`rgba(243,217,142,${.5+.3*pulse})`;
  for(let i=Math.max(0,mv.from+1);i<Math.min(mv.to,TR);i++){const q=cellC(i);c.beginPath();c.arc(q.x,q.y,cs*.06,0,TAU);c.fill();}
  const d=destPoint(mv);
  drawStack(c,d.x,d.y,r,mv.side,mv.idxs.length,.42);
  c.lineWidth=2;c.strokeStyle=`rgba(243,217,142,${.5+.5*pulse})`;c.setLineDash([4,4]);
  c.beginPath();c.arc(d.x,d.y,r*1.3,0,TAU);c.stroke();c.setLineDash([]);
}

function draw(now,dt){
  const c=cx;c.setTransform(V.dpr,0,0,V.dpr,0,0);c.clearRect(0,0,V.W,V.H);

  drawPieces(c);

  if(fm)drawTags(c,fm,1);
  if(G.choosing){const r=V.cs*.36;
    G.moves.forEach((mv,k)=>{const q=srcPoint(mv),n=Math.min(mv.idxs.length,3);
      c.lineWidth=k===G.focus?3:2;c.strokeStyle=`rgba(243,217,142,${k===G.focus?.95:.35+.45*pulse})`;
      c.beginPath();c.arc(q.x,q.y-(n-1)*r*.12,r*1.28,0,TAU);c.stroke();});}
  if(G.anim){const a=G.anim,p0=a.pts[a.seg],p1=a.pts[Math.min(a.seg+1,a.pts.length-1)];
    const t=clamp((now-a.t0)/a.step,0,1),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  G.flying=G.flying.filter(f=>{const t=clamp((now-f.t0)/T.fly,0,1),e=easeOut(t);
    drawPiece(c,lerp(f.from.x,f.to.x,e),lerp(f.from.y,f.to.y,e)-Math.sin(Math.PI*t)*V.cs*1.4,V.cs*.36,f.side);return t<1;});
  drawBoardFx(c,dt);

/* ================= 対局進行 ================= */
async function gsleep(ms){
  const end=performance.now()+ms;
  while(!G.skip&&performance.now()<end)await sleep(Math.max(1,Math.min(40,end-performance.now())));
  while(G.paused)await sleep(120);
}
function waitThrow(){G.canThrow=true;btnThrow.disabled=false;btnThrow.classList.add('ready');return new Promise(r=>G.throwResolve=r);}
function requestThrow(){
  if(!G.canThrow)return;G.canThrow=false;btnThrow.disabled=true;btnThrow.classList.remove('ready');
  const r=G.throwResolve;G.throwResolve=null;r&&r(true);
}
function waitPick(moves){G.moves=moves;G.focus=0;G.choosing=true;return new Promise(r=>G.pickResolve=r);}
function pick(k){
  if(!G.choosing||!G.moves[k])return;const mv=G.moves[k];
  G.choosing=false;G.moves=[];G.focus=-1;G.touchArmed=-1;const r=G.pickResolve;G.pickResolve=null;r&&r(mv);
}
// 候補手に判断材料を付与（候補確定時に一度だけ計算）
function annotateMoves(moves){
  for(const mv of moves){
    if(mv.to>=TR){mv.risk=0;mv.nearGate=false;continue;}
    const np=applyMove(G.pos,mv),k=np[mv.side].filter(p=>p===mv.to).length;
    mv.risk=hitProb(np,mv.side,mv.to,k);
    mv.nearGate=SPEC.gates.some(g=>mv.to>=g-7&&mv.to<=g-1);
  }
  return moves;
}
// 見送りの原因：関で止められた馬群の位置と、打てずに止まった馬群の有無
function passReason(pos,side,res){
  const gate=[];let blocked=false;
  for(const g of groupsOf(pos,side)){
    const dest=destOf(g.from,res.v);
    if(crossesGate(g.from,Math.min(dest,TR))&&res.v<SPEC.highThrow){gate.push(g.from);continue;}
    if(dest<TR&&!res.noble&&pos[1-side].filter(p=>p===dest).length>g.idxs.length)blocked=true;
  }
  return {gate,blocked};
}
async function turnLoop(gid){
  const alive=()=>gid===G.gid&&G.phase==='play';
  while(alive()){
    const side=G.turn;updateHUD();
    if(side===0){G.skip=false;if(!G.again)msg('あなたの番です。投げてください。');G.again=false;
      coach('throw','盤の中央の錦か「投げる」を押して、五本の投木を投げます。黒い面の数と刻みの出方で進む数が決まります。');
      const ok=await waitThrow();if(!ok||!alive())return;}
    else{if(!G.again)msg('相手の番です。盤を押すと早送りします。');G.again=false;await gsleep(tm(T.cpuThink));if(!alive())return;}
    const res=await throwSticks(side);if(!alive())return;
    await gsleep(250);if(!alive())return;
    const moves=annotateMoves(legalMoves(G.pos,side,res)),who=side===0?'':'相手：';
    let mv=null;
    if(!moves.length){
      const pr=passReason(G.pos,side,res);
      const why=pr.gate.length?'関を越えるには八以上が必要です。':pr.blocked?'相手の重なりが多く、打てません。':'進める馬がありません。';
      msg(`${who}${res.name}（${res.v}）— ${why}`);
      pr.gate.forEach(f=>{if(f>=0)addGateMark(f);});
      if(side===0&&pr.gate.length)coach('gate','関は八以上の采でないと越えられません。関の手前で待つ馬は足止めされがちです。');
      await gsleep(1100);if(!alive())return;}
    else if(side===0){
      if(moves.length===1){msg(`${res.name}（${res.v}）— ${res.v}升進みます。`);G.preview=moves[0];await gsleep(650);G.preview=null;mv=moves[0];}
      else{G.touchArmed=-1;
        msg(`${res.name}（${res.v}）— ${G.touchUI?'馬を押して選び、もう一度押すと進めます。':'進める馬を選んでください。'}`);
        coach('choose','光る輪の馬を進められます。行き先の札の「危」は次に打たれる確率、「関」は関の手前で足止めされやすい升です。');
        mv=await waitPick(moves);}
      if(!alive()||!mv)return;
    }else{
      await gsleep(tm(T.afterThrow));if(!alive())return;
      mv=chooseMove(moves,side);G.preview=mv;msg(`相手：${res.name}（${res.v}）`);await gsleep(tm(560));G.preview=null;if(!alive())return;
    }
    let hit=false;
    if(mv){await animateMove(mv);if(!alive())return;hit=mv.hits.length>0;
      if(hit)coach('hit',side===0?'相手の馬を打ちました。打つと、もう一度投げられます。重なった馬は打たれにくくなります。'
        :'馬が打たれて「出」に戻りました。「危」の札が出た升を避けると安全です。');
      if(doneCount(G.pos,side)===G.n){endGame(side);return;}}
    if(res.noble||hit){
      const why=hit?(side===0?'相手の馬を打ちました':'あなたの馬が打たれました'):'貴采';
      msg(`${why}。${side===0?'もう一度投げられます。':'相手がもう一度投げます。'}`);
      G.again=true;await gsleep(side===0?300:750);if(!alive())return;
    }else G.turn=1-side;
  }
}

function ptr(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function inMat(p){const m=V.mat;return p.x>=m.x&&p.x<=m.x+m.w&&p.y>=m.y&&p.y<=m.y+m.h;}
function hitMove(p){
  const R=V.cs*.55;
  for(let k=0;k<G.moves.length;k++){const q=srcPoint(G.moves[k]);if(Math.hypot(p.x-q.x,p.y-q.y)<R)return k;}
  for(let k=0;k<G.moves.length;k++){const q=destPoint(G.moves[k]);if(Math.hypot(p.x-q.x,p.y-q.y)<R)return k;}
  return -1;
}
cv.addEventListener('pointermove',e=>{
  const p=ptr(e);
  if(G.choosing){const k=hitMove(p);if(k>=0)G.focus=k;cv.style.cursor=k>=0?'pointer':'default';}
  else cv.style.cursor=G.canThrow&&inMat(p)?'pointer':'default';
});
cv.addEventListener('pointerdown',e=>{
  Sound.init();const p=ptr(e);
  if(G.choosing){
    let k=hitMove(p);
    if(e.pointerType!=='touch'){if(k>=0)pick(k);return;}
    // タッチ：選択中の手の行き先は優先して判定
    if(G.touchArmed>=0&&G.moves[G.touchArmed]){const q=destPoint(G.moves[G.touchArmed]);if(Math.hypot(p.x-q.x,p.y-q.y)<V.cs*.55)k=G.touchArmed;}
    if(k<0){G.touchArmed=-1;return;}
    if(G.touchArmed===k){pick(k);return;}
    G.touchArmed=k;G.focus=k;msg('もう一度押すと進めます。');
  }
  else if(G.canThrow&&inMat(p))requestThrow();
  else if(G.phase==='play'&&G.turn===1)G.skip=true;
});
btnThrow.addEventListener('click',()=>{Sound.init();requestThrow();});
document.addEventListener('pointerdown',()=>Sound.init(),{once:true});
document.addEventListener('pointerdown',e=>{G.touchUI=e.pointerType==='touch';},true);
document.addEventListener('keydown',e=>{
  if(modalOpen()){if(e.key==='Escape'&&!modalBody.querySelector('.res'))closeModal();return;}
  if(!gameVisible()||e.target.tagName==='BUTTON')return;
  if(G.choosing){
    const n=G.moves.length;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){G.focus=(G.focus+1)%n;e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){G.focus=(G.focus-1+n)%n;e.preventDefault();}
    else if(e.key==='Enter'||e.key===' '){pick(G.focus);e.preventDefault();}
  }else if(G.canThrow&&(e.key===' '||e.key==='Enter')){Sound.init();requestThrow();e.preventDefault();}
});
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  const k=seg.dataset.key;settings[k]=k==='n'?+b.dataset.v:b.dataset.v;Sound.init();Sound.tock();
}));
$('#btnStart').addEventListener('click',()=>{Sound.init();newGame();});
$('#btnRules').addEventListener('click',()=>openModal(rulesHTML()));
$('#btnHelp').addEventListener('click',()=>openModal(rulesHTML()));
$('#btnBack').addEventListener('click',()=>{
  if(G.phase!=='play'){abortGame();showScreen('title');return;}
  openModal(`<h2>対局をやめる</h2><p>いまの対局をやめて題字に戻りますか。</p>
    <div class="mbtns"><button class="btn-main small" data-act="close">続ける</button><button class="btn-sub" data-act="title">やめて戻る</button></div>`);
});
$('#btnSound').addEventListener('click',e=>{Sound.init();const on=!Sound.on;Sound.setOn(on);e.currentTarget.setAttribute('aria-pressed',on);});
modal.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target===modal&&!modalBody.querySelector('.res'))closeModal();return;}
  const act=b.dataset.act;
  if(act==='close')closeModal();
  else if(act==='again')newGame();
  else if(act==='title'){closeModal();abortGame();showScreen('title');}
});

/* ================= 起動 ================= */
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!titleEl.classList.contains('hidden'))drawTitle(now);
  if(gameVisible()&&V.path.length){updateAnim(now);draw(now,dt);}
  drawFxLayer(now,dt);
}
function onResize(){drawBG();sizeFx();if(!titleEl.classList.contains('hidden'))layoutTitle();}
window.addEventListener('resize',onResize);
if(window.ResizeObserver)new ResizeObserver(()=>{if(gameVisible())layout();}).observe(wrap);
else window.addEventListener('resize',()=>{if(gameVisible())layout();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(gameVisible())buildStatic();});
drawBG();sizeFx();layoutTitle();requestAnimationFrame(frame);
})();
</script>
