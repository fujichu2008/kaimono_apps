<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>
<title>川崎クエスト</title>

<style>
:root{
  --bg:#dce8ec;
  --panel:rgba(13,24,31,.84);
  --white:#fff;
  --accent:#ffd54a;
  --danger:#ff665e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1b252a;
  touch-action:none;
  overscroll-behavior:none;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;
}

body{
  position:fixed;
  inset:0;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#dce8ec;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* ==============================
   HUD
============================== */

#hud{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}

.hudCard{
  min-width:92px;
  padding:8px 12px;
  color:#fff;
  background:rgba(17,28,34,.72);
  border:1px solid rgba(255,255,255,.13);
  border-radius:15px;
  backdrop-filter:blur(8px);
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.hudLabel{
  margin-bottom:1px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:.7;
}

.hudValue{
  font-size:21px;
  font-weight:900;
  line-height:1.1;
}

#distanceCard{
  text-align:right;
}

/* ==============================
   NICE表示
============================== */

#toast{
  position:absolute;
  left:50%;
  top:27%;
  z-index:6;
  color:#fff;
  font-size:28px;
  font-weight:1000;
  letter-spacing:.04em;
  text-shadow:
    0 3px 12px rgba(0,0,0,.32),
    0 0 4px rgba(0,0,0,.22);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,20px) scale(.8);
}

#toast.show{
  animation:toastPop .58s ease-out;
}

@keyframes toastPop{
  0%{
    opacity:0;
    transform:translate(-50%,20px) scale(.75);
  }
  22%{
    opacity:1;
    transform:translate(-50%,0) scale(1.12);
  }
  70%{
    opacity:1;
    transform:translate(-50%,-5px) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-15px) scale(.96);
  }
}

/* ==============================
   オーバーレイ
============================== */

.screen{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    24px
    calc(env(safe-area-inset-bottom) + 24px);
  background:
    linear-gradient(
      180deg,
      rgba(21,34,41,.18),
      rgba(14,23,28,.74)
    );
  transition:
    opacity .22s ease,
    visibility .22s ease;
}

.screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.panel{
  width:min(86vw,380px);
  text-align:center;
  color:#fff;
}

#title{
  margin:0 0 44px;
  font-size:clamp(43px,13vw,66px);
  font-weight:1000;
  line-height:.98;
  letter-spacing:-.06em;
  text-shadow:0 6px 28px rgba(0,0,0,.28);
}

.mainButton{
  width:min(260px,76vw);
  min-height:58px;
  padding:14px 28px;
  border:0;
  border-radius:18px;
  color:#172027;
  background:var(--accent);
  box-shadow:
    0 8px 0 #ccaa32,
    0 14px 26px rgba(0,0,0,.22);
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
}

.mainButton:active{
  transform:translateY(5px);
  box-shadow:
    0 3px 0 #ccaa32,
    0 8px 15px rgba(0,0,0,.22);
}

#resultTitle{
  margin:0 0 12px;
  font-size:42px;
  font-weight:1000;
}

#resultEmoji{
  margin-bottom:16px;
  font-size:72px;
  line-height:1;
}

#resultScore{
  margin:0 0 5px;
  font-size:30px;
  font-weight:1000;
}

#resultBest{
  min-height:24px;
  margin:0 0 34px;
  font-size:14px;
  font-weight:800;
  opacity:.8;
}

#goalMeter{
  position:absolute;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:5;
  width:min(72vw,320px);
  height:7px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(0,0,0,.22);
  transform:translateX(-50%);
  pointer-events:none;
}

#goalFill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:#ffd54a;
}

#controlsHint{
  position:absolute;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 38px);
  z-index:5;
  padding:5px 10px;
  border-radius:999px;
  color:#fff;
  background:rgba(11,20,25,.48);
  font-size:11px;
  font-weight:800;
  opacity:0;
  transform:translateX(-50%);
  pointer-events:none;
  transition:opacity .25s ease;
}

#controlsHint.visible{
  opacity:.75;
}

@media (min-width:700px){
  #app{
    max-width:500px;
    margin:0 auto;
    box-shadow:0 0 80px rgba(0,0,0,.4);
  }

  body{
    background:#131b20;
  }
}
</style>
</head>

<body>
<div id="app">

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hudCard">
      <div class="hudLabel">SCORE</div>
      <div id="scoreValue" class="hudValue">0</div>
    </div>

    <div id="distanceCard" class="hudCard">
      <div class="hudLabel">OFFICE</div>
      <div id="distanceValue" class="hudValue">1,200m</div>
    </div>
  </div>

  <div id="toast">NICE! +50</div>

  <div id="controlsHint">← DRAG →</div>

  <div id="goalMeter">
    <div id="goalFill"></div>
  </div>

  <div id="titleScreen" class="screen">
    <div class="panel">
      <h1 id="title">川崎<br>クエスト</h1>
      <button id="startButton" class="mainButton">START</button>
    </div>
  </div>

  <div id="resultScreen" class="screen hidden">
    <div class="panel">
      <div id="resultEmoji">💩</div>
      <h2 id="resultTitle">遅刻</h2>
      <div id="resultScore">0m</div>
      <div id="resultBest"></div>
      <button id="retryButton" class="mainButton">RETRY</button>
    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     CONFIG
     ゲームバランスを変更する場合は基本的にここだけを触る。
  ========================================================= */

  const CONFIG = {
    goalDistance: 1200,

    player: {
      width: 38,
      height: 54,
      bottomRatio: 0.17,
      followSpeed: 14
    },

    world: {
      roadWidthRatio: 0.78,
      minRoadWidth: 280,
      maxRoadWidth: 430,
      baseSpeed: 255,
      maxSpeed: 470,
      speedIncreasePerMeter: 0.14
    },

    poop: {
      radius: 20,
      spawnMin: 0.48,
      spawnMax: 0.88,
      minGapX: 74,
      nearMissExtra: 32
    },

    scoring: {
      meterPoint: 1,
      nearMiss: 50
    },

    storageKey: 'kawasaki_quest_best_v1'
  };


  /* =========================================================
     DOM
  ========================================================= */

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const titleScreen = document.getElementById('titleScreen');
  const resultScreen = document.getElementById('resultScreen');

  const startButton = document.getElementById('startButton');
  const retryButton = document.getElementById('retryButton');

  const scoreValue = document.getElementById('scoreValue');
  const distanceValue = document.getElementById('distanceValue');

  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultScore = document.getElementById('resultScore');
  const resultBest = document.getElementById('resultBest');

  const goalFill = document.getElementById('goalFill');
  const toast = document.getElementById('toast');
  const controlsHint = document.getElementById('controlsHint');


  /* =========================================================
     GAME STATE
     可変状態はstateへ集約する。
  ========================================================= */

  const state = {
    mode: 'title',

    width: 0,
    height: 0,
    dpr: 1,

    time: 0,
    distance: 0,
    score: 0,
    speed: CONFIG.world.baseSpeed,

    spawnTimer: 0,
    nextSpawn: 0.7,

    player: {
      x: 0,
      targetX: 0,
      y: 0
    },

    poops: [],
    decorations: [],

    roadOffset: 0,

    pointerDown: false,
    lastTime: 0,

    best: loadBest(),

    audio: null
  };


  /* =========================================================
     STORAGE
  ========================================================= */

  function loadBest() {
    try {
      const value = Number(localStorage.getItem(CONFIG.storageKey));
      return Number.isFinite(value) ? value : 0;
    } catch {
      return 0;
    }
  }

  function saveBest(value) {
    state.best = Math.max(state.best, Math.floor(value));

    try {
      localStorage.setItem(
        CONFIG.storageKey,
        String(state.best)
      );
    } catch {
      // 保存不能でもゲーム自体は継続する
    }
  }


  /* =========================================================
     AUDIO
  ========================================================= */

  function ensureAudio() {
    if (state.audio) {
      if (state.audio.state === 'suspended') {
        state.audio.resume().catch(() => {});
      }
      return;
    }

    try {
      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (AudioContext) {
        state.audio = new AudioContext();
      }
    } catch {
      state.audio = null;
    }
  }

  function playTone(freq, duration, type = 'sine', volume = 0.035) {
    if (!state.audio) return;

    try {
      const osc = state.audio.createOscillator();
      const gain = state.audio.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(
        freq,
        state.audio.currentTime
      );

      gain.gain.setValueAtTime(
        volume,
        state.audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        state.audio.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(state.audio.destination);

      osc.start();
      osc.stop(state.audio.currentTime + duration);
    } catch {
      // 音が使えない環境は無音で継続
    }
  }


  /* =========================================================
     RESIZE
  ========================================================= */

  function resize() {
    const rect = canvas.getBoundingClientRect();

    state.width = rect.width;
    state.height = rect.height;

    state.dpr = Math.min(
      window.devicePixelRatio || 1,
      2
    );

    canvas.width =
      Math.round(state.width * state.dpr);

    canvas.height =
      Math.round(state.height * state.dpr);

    ctx.setTransform(
      state.dpr,
      0,
      0,
      state.dpr,
      0,
      0
    );

    state.player.y =
      state.height *
      (1 - CONFIG.player.bottomRatio);

    if (
      state.mode === 'title' ||
      state.mode === 'result'
    ) {
      state.player.x = state.width / 2;
      state.player.targetX = state.width / 2;
    }
  }


  /* =========================================================
     WORLD HELPERS
  ========================================================= */

  function roadBounds() {
    const width = Math.min(
      CONFIG.world.maxRoadWidth,
      Math.max(
        CONFIG.world.minRoadWidth,
        state.width *
          CONFIG.world.roadWidthRatio
      )
    );

    return {
      left: (state.width - width) / 2,
      right: (state.width + width) / 2,
      width
    };
  }

  function playerBoundsX() {
    const road = roadBounds();

    const margin =
      CONFIG.player.width * 0.65;

    return {
      min: road.left + margin,
      max: road.right - margin
    };
  }

  function clampPlayerTarget(x) {
    const bounds = playerBoundsX();

    state.player.targetX = Math.max(
      bounds.min,
      Math.min(bounds.max, x)
    );
  }


  /* =========================================================
     RESET / START
  ========================================================= */

  function resetGame() {
    state.time = 0;
    state.distance = 0;
    state.score = 0;

    state.speed =
      CONFIG.world.baseSpeed;

    state.spawnTimer = 0;
    state.nextSpawn = 0.7;

    state.poops.length = 0;
    state.decorations.length = 0;

    state.roadOffset = 0;

    state.player.x = state.width / 2;
    state.player.targetX = state.width / 2;

    updateHud();

    createInitialDecorations();
  }

  function startGame() {
    ensureAudio();

    resetGame();

    state.mode = 'playing';

    titleScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');

    controlsHint.classList.add('visible');

    setTimeout(() => {
      controlsHint.classList.remove('visible');
    }, 1800);

    playTone(520, 0.08, 'square', 0.025);
    setTimeout(() => {
      playTone(690, 0.09, 'square', 0.025);
    }, 70);

    state.lastTime = performance.now();
  }


  /* =========================================================
     INPUT
  ========================================================= */

  function pointerToCanvasX(event) {
    const rect = canvas.getBoundingClientRect();

    return event.clientX - rect.left;
  }

  canvas.addEventListener('pointerdown', event => {
    ensureAudio();

    if (state.mode !== 'playing') return;

    state.pointerDown = true;

    canvas.setPointerCapture?.(
      event.pointerId
    );

    clampPlayerTarget(
      pointerToCanvasX(event)
    );
  });

  canvas.addEventListener('pointermove', event => {
    if (
      state.mode !== 'playing' ||
      !state.pointerDown
    ) {
      return;
    }

    clampPlayerTarget(
      pointerToCanvasX(event)
    );
  });

  canvas.addEventListener('pointerup', event => {
    state.pointerDown = false;

    canvas.releasePointerCapture?.(
      event.pointerId
    );
  });

  canvas.addEventListener('pointercancel', () => {
    state.pointerDown = false;
  });


  /* =========================================================
     KEYBOARD
  ========================================================= */

  const keys = new Set();

  window.addEventListener('keydown', event => {
    if (
      event.key === 'ArrowLeft' ||
      event.key === 'ArrowRight' ||
      event.key.toLowerCase() === 'a' ||
      event.key.toLowerCase() === 'd'
    ) {
      event.preventDefault();
      keys.add(event.key.toLowerCase());
    }

    if (
      (event.key === ' ' || event.key === 'Enter') &&
      state.mode !== 'playing'
    ) {
      startGame();
    }
  });

  window.addEventListener('keyup', event => {
    keys.delete(event.key.toLowerCase());
  });

  function updateKeyboard(dt) {
    if (state.mode !== 'playing') return;

    const amount = 310 * dt;

    if (
      keys.has('arrowleft') ||
      keys.has('a')
    ) {
      clampPlayerTarget(
        state.player.targetX - amount
      );
    }

    if (
      keys.has('arrowright') ||
      keys.has('d')
    ) {
      clampPlayerTarget(
        state.player.targetX + amount
      );
    }
  }


  /* =========================================================
     POOP GENERATION
  ========================================================= */

  function scheduleNextPoop() {
    const progress =
      state.distance /
      CONFIG.goalDistance;

    const difficulty =
      Math.min(1, progress);

    const min =
      CONFIG.poop.spawnMin -
      difficulty * 0.09;

    const max =
      CONFIG.poop.spawnMax -
      difficulty * 0.18;

    state.nextSpawn =
      min +
      Math.random() *
      Math.max(0.2, max - min);
  }

  function spawnPoop() {
    const road = roadBounds();
    const radius = CONFIG.poop.radius;

    let x = road.left + radius;

    /*
      同じ高さ付近に複数生成する場合、
      完全封鎖しにくいようX距離を確認。
    */
    for (let attempt = 0; attempt < 10; attempt++) {
      const candidate =
        road.left +
        radius +
        Math.random() *
        (road.width - radius * 2);

      const tooClose = state.poops.some(poop => {
        return (
          poop.y < 120 &&
          Math.abs(poop.x - candidate) <
            CONFIG.poop.minGapX
        );
      });

      if (!tooClose) {
        x = candidate;
        break;
      }
    }

    const sizeVariance =
      0.88 + Math.random() * 0.22;

    state.poops.push({
      x,
      y: -35,
      radius:
        CONFIG.poop.radius *
        sizeVariance,
      rotation:
        (Math.random() - 0.5) * 0.18,
      checkedNearMiss: false,
      phase:
        Math.random() * Math.PI * 2
    });
  }


  /* =========================================================
     DECORATIONS
  ========================================================= */

  function createInitialDecorations() {
    for (let i = 0; i < 12; i++) {
      state.decorations.push(
        makeDecoration(
          Math.random() * state.height
        )
      );
    }
  }

  function makeDecoration(y = -50) {
    const side =
      Math.random() < 0.5
        ? 'left'
        : 'right';

    return {
      side,
      y,
      speedScale:
        0.68 + Math.random() * 0.15,
      type:
        Math.random() < 0.65
          ? 'commuter'
          : 'pole',
      seed: Math.random()
    };
  }

  function updateDecorations(dt) {
    for (
      let i = state.decorations.length - 1;
      i >= 0;
      i--
    ) {
      const item =
        state.decorations[i];

      item.y +=
        state.speed *
        item.speedScale *
        dt;

      if (item.y > state.height + 80) {
        state.decorations.splice(i, 1);
      }
    }

    while (state.decorations.length < 12) {
      state.decorations.push(
        makeDecoration(
          -Math.random() * 180
        )
      );
    }
  }


  /* =========================================================
     COLLISION
  ========================================================= */

  function checkPoopCollision(poop) {
    const playerX = state.player.x;
    const playerY =
      state.player.y -
      CONFIG.player.height * 0.03;

    /*
      人型全体ではなく足元付近を判定対象にする。
      見た目より少し寛容にして理不尽感を減らす。
    */
    const footY =
      playerY +
      CONFIG.player.height * 0.34;

    const dx = poop.x - playerX;
    const dy = poop.y - footY;

    const collisionRadius =
      poop.radius * 0.68 +
      CONFIG.player.width * 0.27;

    return (
      dx * dx + dy * dy <
      collisionRadius * collisionRadius
    );
  }

  function checkNearMiss(poop) {
    if (poop.checkedNearMiss) return;

    const passLine =
      state.player.y +
      CONFIG.player.height * 0.5;

    if (poop.y < passLine) return;

    poop.checkedNearMiss = true;

    const dx =
      Math.abs(
        poop.x - state.player.x
      );

    const nearThreshold =
      poop.radius +
      CONFIG.player.width * 0.5 +
      CONFIG.poop.nearMissExtra;

    const safeThreshold =
      poop.radius +
      CONFIG.player.width * 0.31;

    if (
      dx < nearThreshold &&
      dx > safeThreshold
    ) {
      state.score +=
        CONFIG.scoring.nearMiss;

      showToast('NICE! +50');

      playTone(
        760,
        0.08,
        'triangle',
        0.025
      );

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }
  }


  /* =========================================================
     UPDATE
  ========================================================= */

  function update(dt) {
    if (state.mode !== 'playing') {
      return;
    }

    state.time += dt;

    updateKeyboard(dt);

    const progress =
      Math.min(
        1,
        state.distance /
        CONFIG.goalDistance
      );

    state.speed = Math.min(
      CONFIG.world.maxSpeed,
      CONFIG.world.baseSpeed +
        state.distance *
        CONFIG.world.speedIncreasePerMeter
    );

    const meterSpeed =
      13 +
      progress * 7;

    state.distance +=
      meterSpeed * dt;

    state.score +=
      meterSpeed *
      CONFIG.scoring.meterPoint *
      dt;

    state.roadOffset +=
      state.speed * dt;

    const follow =
      1 -
      Math.exp(
        -CONFIG.player.followSpeed * dt
      );

    state.player.x +=
      (
        state.player.targetX -
        state.player.x
      ) * follow;

    state.spawnTimer += dt;

    if (
      state.spawnTimer >=
      state.nextSpawn
    ) {
      state.spawnTimer = 0;

      spawnPoop();

      /*
        後半は時々2個配置。
        ただし同一地点に重ねない。
      */
      if (
        progress > 0.42 &&
        Math.random() <
          0.12 + progress * 0.12
      ) {
        spawnPoop();
      }

      scheduleNextPoop();
    }

    updatePoops(dt);
    updateDecorations(dt);
    updateHud();

    if (
      state.distance >=
      CONFIG.goalDistance
    ) {
      clearGame();
    }
  }

  function updatePoops(dt) {
    for (
      let i = state.poops.length - 1;
      i >= 0;
      i--
    ) {
      const poop = state.poops[i];

      poop.y +=
        state.speed * dt;

      poop.phase +=
        dt * 3;

      if (checkPoopCollision(poop)) {
        failGame();
        return;
      }

      checkNearMiss(poop);

      if (
        poop.y >
        state.height + 60
      ) {
        state.poops.splice(i, 1);
      }
    }
  }


  /* =========================================================
     RESULT
  ========================================================= */

  function failGame() {
    if (state.mode !== 'playing') return;

    state.mode = 'result';

    const finalDistance =
      Math.min(
        CONFIG.goalDistance,
        Math.floor(state.distance)
      );

    const previousBest = state.best;

    saveBest(finalDistance);

    resultEmoji.textContent = '💩';
    resultTitle.textContent = '遅刻';
    resultScore.textContent =
      `${finalDistance.toLocaleString()}m`;

    resultBest.textContent =
      finalDistance > previousBest
        ? 'NEW BEST!'
        : `BEST ${state.best.toLocaleString()}m`;

    playTone(
      170,
      0.18,
      'sawtooth',
      0.04
    );

    setTimeout(() => {
      playTone(
        105,
        0.28,
        'sawtooth',
        0.035
      );
    }, 90);

    if (navigator.vibrate) {
      navigator.vibrate(
        [50, 50, 110]
      );
    }

    resultScreen.classList.remove(
      'hidden'
    );
  }

  function clearGame() {
    if (state.mode !== 'playing') return;

    state.mode = 'result';

    const finalScore =
      Math.floor(state.score);

    saveBest(CONFIG.goalDistance);

    resultEmoji.textContent = '🏢';
    resultTitle.textContent = '出社完了';
    resultScore.textContent =
      `${finalScore.toLocaleString()} pts`;

    resultBest.textContent =
      '川崎の朝を生き抜いた';

    playTone(
      523,
      0.10,
      'triangle',
      0.035
    );

    setTimeout(() => {
      playTone(
        659,
        0.10,
        'triangle',
        0.035
      );
    }, 100);

    setTimeout(() => {
      playTone(
        784,
        0.18,
        'triangle',
        0.04
      );
    }, 200);

    if (navigator.vibrate) {
      navigator.vibrate([20, 40, 20]);
    }

    resultScreen.classList.remove(
      'hidden'
    );
  }


  /* =========================================================
     HUD
  ========================================================= */

  function updateHud() {
    scoreValue.textContent =
      Math.floor(state.score)
        .toLocaleString();

    const remaining = Math.max(
      0,
      Math.ceil(
        CONFIG.goalDistance -
        state.distance
      )
    );

    distanceValue.textContent =
      `${remaining.toLocaleString()}m`;

    const percentage =
      Math.min(
        100,
        state.distance /
        CONFIG.goalDistance *
        100
      );

    goalFill.style.width =
      `${percentage}%`;
  }

  function showToast(text) {
    toast.textContent = text;

    toast.classList.remove('show');

    void toast.offsetWidth;

    toast.classList.add('show');
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function render() {
    ctx.clearRect(
      0,
      0,
      state.width,
      state.height
    );

    drawBackground();
    drawRoad();
    drawDecorations();
    drawPoops();
    drawPlayer();

    if (state.mode === 'title') {
      drawTitleBackgroundLife();
    }
  }


  /* =========================================================
     BACKGROUND
  ========================================================= */

  function drawBackground() {
    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        0,
        state.height
      );

    gradient.addColorStop(
      0,
      '#d8e5e9'
    );

    gradient.addColorStop(
      1,
      '#becfd3'
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
      0,
      0,
      state.width,
      state.height
    );

    drawBuildings();
  }

  function drawBuildings() {
    const road = roadBounds();

    ctx.save();

    ctx.fillStyle =
      'rgba(90,109,116,.23)';

    const buildingWidth =
      Math.max(
        24,
        road.left - 14
      );

    const shift =
      state.roadOffset * 0.13;

    for (
      let y =
        -140 + (shift % 170);
      y < state.height + 170;
      y += 170
    ) {
      ctx.fillRect(
        0,
        y,
        buildingWidth,
        108
      );

      ctx.fillRect(
        state.width -
          buildingWidth,
        y + 42,
        buildingWidth,
        108
      );
    }

    ctx.fillStyle =
      'rgba(255,255,255,.38)';

    for (
      let y =
        -100 + (shift % 170);
      y < state.height + 170;
      y += 170
    ) {
      ctx.fillRect(
        7,
        y,
        Math.max(
          8,
          buildingWidth - 18
        ),
        8
      );

      ctx.fillRect(
        state.width -
          buildingWidth + 9,
        y + 45,
        Math.max(
          8,
          buildingWidth - 18
        ),
        8
      );
    }

    ctx.restore();
  }


  /* =========================================================
     ROAD
  ========================================================= */

  function drawRoad() {
    const road = roadBounds();

    /* 歩道 */
    ctx.fillStyle = '#d2d1cc';

    ctx.fillRect(
      road.left,
      0,
      road.width,
      state.height
    );

    /* 路肩 */
    ctx.fillStyle = '#a9afb0';

    ctx.fillRect(
      road.left - 5,
      0,
      5,
      state.height
    );

    ctx.fillRect(
      road.right,
      0,
      5,
      state.height
    );

    /* タイル線 */
    ctx.strokeStyle =
      'rgba(90,95,92,.18)';

    ctx.lineWidth = 1;

    const tileSize = 72;

    const offset =
      state.roadOffset %
      tileSize;

    for (
      let y = offset - tileSize;
      y < state.height;
      y += tileSize
    ) {
      ctx.beginPath();

      ctx.moveTo(
        road.left,
        y
      );

      ctx.lineTo(
        road.right,
        y
      );

      ctx.stroke();
    }

    /*
      中央の点字ブロック。
      「川崎の駅前を歩いている」視覚記号として利用。
    */
    const stripWidth = 22;

    ctx.fillStyle =
      'rgba(224,180,50,.6)';

    ctx.fillRect(
      state.width / 2 -
        stripWidth / 2,
      0,
      stripWidth,
      state.height
    );

    ctx.fillStyle =
      'rgba(123,97,25,.24)';

    const dotSpacing = 17;

    const dotOffset =
      state.roadOffset %
      dotSpacing;

    for (
      let y = -20 + dotOffset;
      y < state.height + 20;
      y += dotSpacing
    ) {
      ctx.beginPath();

      ctx.arc(
        state.width / 2 - 5,
        y,
        1.8,
        0,
        Math.PI * 2
      );

      ctx.arc(
        state.width / 2 + 5,
        y,
        1.8,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }


  /* =========================================================
     DECORATION DRAW
  ========================================================= */

  function drawDecorations() {
    const road = roadBounds();

    for (
      const item of
      state.decorations
    ) {
      let x;

      if (item.side === 'left') {
        x =
          road.left -
          15 -
          item.seed * 35;
      } else {
        x =
          road.right +
          15 +
          item.seed * 35;
      }

      if (
        item.type ===
        'commuter'
      ) {
        drawTinyCommuter(
          x,
          item.y,
          item.seed,
          item.side
        );
      } else {
        drawPole(
          x,
          item.y
        );
      }
    }
  }

  function drawTinyCommuter(
    x,
    y,
    seed,
    side
  ) {
    ctx.save();

    ctx.globalAlpha = .6;

    ctx.translate(x, y);

    if (side === 'right') {
      ctx.scale(-1, 1);
    }

    const s =
      0.7 + seed * 0.25;

    ctx.scale(s, s);

    ctx.fillStyle =
      '#59676d';

    ctx.beginPath();

    ctx.arc(
      0,
      -17,
      6,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
      '#46555c';

    roundRect(
      ctx,
      -7,
      -11,
      14,
      23,
      5
    );

    ctx.fill();

    ctx.strokeStyle =
      '#46555c';

    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(-3, 10);
    ctx.lineTo(-6, 22);
    ctx.moveTo(3, 10);
    ctx.lineTo(7, 22);
    ctx.stroke();

    ctx.restore();
  }

  function drawPole(x, y) {
    ctx.save();

    ctx.globalAlpha = .55;

    ctx.strokeStyle =
      '#6d777a';

    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(x, y - 24);
    ctx.lineTo(x, y + 30);
    ctx.stroke();

    ctx.fillStyle =
      '#596467';

    roundRect(
      ctx,
      x - 12,
      y - 35,
      24,
      14,
      3
    );

    ctx.fill();

    ctx.restore();
  }


  /* =========================================================
     POOP DRAW
  ========================================================= */

  function drawPoops() {
    for (
      const poop of state.poops
    ) {
      drawPoop(poop);
    }
  }

  function drawPoop(poop) {
    ctx.save();

    ctx.translate(
      poop.x,
      poop.y
    );

    ctx.rotate(
      poop.rotation +
      Math.sin(poop.phase) * 0.018
    );

    const size =
      poop.radius * 2.3;

    /*
      影を先に描いて、
      路面との距離感を明確化。
    */
    ctx.fillStyle =
      'rgba(37,28,20,.14)';

    ctx.beginPath();

    ctx.ellipse(
      2,
      poop.radius * 0.72,
      poop.radius * 0.85,
      poop.radius * 0.28,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.font =
      `${size}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(
      '💩',
      0,
      -2
    );

    ctx.restore();
  }


  /* =========================================================
     PLAYER DRAW
  ========================================================= */

  function drawPlayer() {
    const x =
      state.player.x;

    const y =
      state.player.y;

    const w =
      CONFIG.player.width;

    const h =
      CONFIG.player.height;

    ctx.save();

    /* 影 */
    ctx.fillStyle =
      'rgba(20,28,31,.18)';

    ctx.beginPath();

    ctx.ellipse(
      x,
      y + h * 0.45,
      w * 0.46,
      7,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /*
      バッグ
    */
    ctx.fillStyle =
      '#26333b';

    roundRect(
      ctx,
      x + w * 0.16,
      y - 2,
      w * 0.36,
      h * 0.43,
      5
    );

    ctx.fill();

    /* 脚 */
    ctx.strokeStyle =
      '#263139';

    ctx.lineWidth =
      Math.max(5, w * 0.15);

    ctx.lineCap = 'round';

    ctx.beginPath();

    ctx.moveTo(
      x - w * 0.12,
      y + h * 0.16
    );

    ctx.lineTo(
      x - w * 0.20,
      y + h * 0.43
    );

    ctx.moveTo(
      x + w * 0.12,
      y + h * 0.16
    );

    ctx.lineTo(
      x + w * 0.19,
      y + h * 0.43
    );

    ctx.stroke();

    /* スーツ */
    ctx.fillStyle =
      '#334651';

    roundRect(
      ctx,
      x - w * 0.31,
      y - h * 0.20,
      w * 0.62,
      h * 0.49,
      8
    );

    ctx.fill();

    /* シャツ */
    ctx.fillStyle =
      '#eef5f7';

    ctx.beginPath();

    ctx.moveTo(
      x - 5,
      y - h * 0.18
    );

    ctx.lineTo(
      x,
      y + 2
    );

    ctx.lineTo(
      x + 5,
      y - h * 0.18
    );

    ctx.closePath();
    ctx.fill();

    /* ネクタイ */
    ctx.fillStyle =
      '#b94b45';

    ctx.beginPath();

    ctx.moveTo(
      x - 2,
      y - h * 0.12
    );

    ctx.lineTo(
      x + 2,
      y - h * 0.12
    );

    ctx.lineTo(
      x + 1,
      y + 7
    );

    ctx.lineTo(
      x,
      y + 11
    );

    ctx.lineTo(
      x - 1,
      y + 7
    );

    ctx.closePath();
    ctx.fill();

    /* 頭 */
    ctx.fillStyle =
      '#efc19f';

    ctx.beginPath();

    ctx.arc(
      x,
      y - h * 0.35,
      w * 0.20,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /* 髪 */
    ctx.fillStyle =
      '#252c30';

    ctx.beginPath();

    ctx.arc(
      x,
      y - h * 0.39,
      w * 0.20,
      Math.PI,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }


  /* =========================================================
     TITLE AMBIENCE
  ========================================================= */

  function drawTitleBackgroundLife() {
    const road = roadBounds();

    ctx.save();

    ctx.globalAlpha = .7;

    ctx.font =
      '31px Apple Color Emoji, Segoe UI Emoji';

    ctx.textAlign = 'center';

    ctx.fillText(
      '💩',
      road.left +
        road.width * .28,
      state.height * .37
    );

    ctx.fillText(
      '💩',
      road.left +
        road.width * .70,
      state.height * .53
    );

    ctx.restore();
  }


  /* =========================================================
     UTIL
  ========================================================= */

  function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
  ) {
    const r = Math.min(
      radius,
      width / 2,
      height / 2
    );

    context.beginPath();

    context.moveTo(
      x + r,
      y
    );

    context.arcTo(
      x + width,
      y,
      x + width,
      y + height,
      r
    );

    context.arcTo(
      x + width,
      y + height,
      x,
      y + height,
      r
    );

    context.arcTo(
      x,
      y + height,
      x,
      y,
      r
    );

    context.arcTo(
      x,
      y,
      x + width,
      y,
      r
    );

    context.closePath();
  }


  /* =========================================================
     LOOP
  ========================================================= */

  function loop(now) {
    let dt =
      (now - state.lastTime) /
      1000;

    state.lastTime = now;

    /*
      タブ復帰時などに大量更新されないよう、
      1フレームの時間を制限。
    */
    dt = Math.min(
      Math.max(dt, 0),
      0.05
    );

    update(dt);
    render();

    requestAnimationFrame(loop);
  }


  /* =========================================================
     VISIBILITY
  ========================================================= */

  document.addEventListener(
    'visibilitychange',
    () => {
      state.lastTime =
        performance.now();
    }
  );


  /* =========================================================
     BUTTONS
  ========================================================= */

  startButton.addEventListener(
    'click',
    startGame
  );

  retryButton.addEventListener(
    'click',
    startGame
  );


  /* =========================================================
     INIT
  ========================================================= */

  window.addEventListener(
    'resize',
    resize
  );

  resize();
  resetGame();

  state.mode = 'title';
  state.lastTime =
    performance.now();

  requestAnimationFrame(loop);

})();
</script>

</body>
