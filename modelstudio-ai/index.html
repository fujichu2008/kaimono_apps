// ============================================================
// 11. Inspector / Domain Mutations
// スカラー編集は既存Object/Materialを更新する。
// ============================================================

function snapshot() {
 return clone(state.modelSpec);
}

function remember(before) {
 state.undo.push(before);
 if (state.undo.length > LIMIT.history) state.undo.shift();
 state.redo = [];
}

function markChanged() {
 state.dirty = true;
 updateHeader();
 scheduleDraft();
}

function commitSpec(next,{history=true,fit=false}={}) {
 validateModelSpec(next);

 // 現在のSceneを破棄する前に新しいモデルを構築する。
 const candidate = state.runtime ? state.engine.buildModel(next) : null;

 if (history) remember(snapshot());

 state.modelSpec = next;

 if (!own(next.parts,state.selectedPartId)) {
  state.selectedPartId = null;
 }
 if (!own(next.anchors,state.selectedAnchorId)) {
  state.selectedAnchorId = null;
 }
 if (!own(next.materials,state.selectedMaterialId)) {
  state.selectedMaterialId = Object.keys(next.materials)[0];
 }

 rebuildScene(candidate);
 state.stats = calculateStats(candidate);

 markChanged();
 renderPanel();

 if (fit) fitCamera();
}

function mutate(fn,fit=false) {
 const next = snapshot();
 fn(next);
 commitSpec(next,{fit});
}

function refreshDirect(collection,id) {
 const r = state.runtime;
 if (!r) return;

 // 再生中に部品を編集したら、止めて基本姿勢に戻してから反映する
 if (collection === 'parts') stopMotion();

 const d = state.modelSpec[collection][id];

 if (collection === 'materials') {
  state.engine.updateMaterial(r.root.userData.materials[id],d);
 } else if (collection === 'parts') {
  const o = r.root.userData.parts[id];
  state.engine.transform(o,d);
  o.name = d.name;

  const mesh = o.children.find(x => x.isMesh);
  if (mesh) mesh.material = r.root.userData.materials[d.material];

  r.root.updateMatrixWorld(true);
  updateStage();
 } else {
  state.engine.transform(r.root.userData.anchors[id],d);
 }

 // 編集後の姿勢を新しい基本姿勢として動きを作り直す
 if (collection === 'parts') resetAnimator();

 invalidate();
}

function editDirect(collection,id,key,value,index=null,live=false) {
 const next = snapshot();

 if (index === null) next[collection][id][key] = value;
 else next[collection][id][key][index] = value;

 validateModelSpec(next);

 if (live) state.liveBefore ??= snapshot();
 else remember(snapshot());

 state.modelSpec = next;

 refreshDirect(collection,id);
 markChanged();
}

function finishLive() {
 if (!state.liveBefore) return;

 if (JSON.stringify(state.liveBefore) !== JSON.stringify(state.modelSpec)) {
  remember(state.liveBefore);
 }

 state.liveBefore = null;
 updateHeader();
 scheduleDraft();
}

function undoRedo(redo=false) {
 finishLive();

 const from = redo ? state.redo : state.undo;
 const to = redo ? state.undo : state.redo;

 if (!from.length) return;

 const next = clone(from[from.length-1]);
 validateModelSpec(next);

 const candidate = state.runtime ? state.engine.buildModel(next) : null;

 to.push(snapshot());
 from.pop();

 state.modelSpec = next;
 state.selectedPartId = null;
 state.selectedAnchorId = null;

 rebuildScene(candidate);
 state.stats = calculateStats(candidate);

 markChanged();
 renderPanel();
}

function descendants(id,s=state.modelSpec) {
 const result = [id];

 for (let i=0;i<result.length;i++) {
  for (const p of Object.values(s.parts)) {
   if (p.parent === result[i]) result.push(p.id);
  }
 }

 return result;
}

function addPart(type) {
 const id = uid(type);

 mutate(s => {
  s.parts[id] = {
   id,
   name: geoLabel(type),
   type: type === 'group' ? 'group' : 'primitive',
   parent: null,
   position: [0,1,0],
   rotation: [0,0,0],
   scale: [1,1,1],
   visible: true
  };

  if (type !== 'group') {
   s.parts[id].geometry = clone(GEO[type]);
   s.parts[id].material = Object.keys(s.materials)[0];
  }
 });

 selectPart(id);
}

function duplicatePart() {
 const id = state.selectedPartId;
 if (!id) return;

 let newId;

 mutate(s => {
  const ids = descendants(id,s);
  const map = {};

  ids.forEach(old => map[old] = uid('part'));
  newId = map[id];

  for (const old of ids) {
   const p = clone(s.parts[old]);

   p.id = map[old];
   p.name += ' copy';
   p.parent = map[p.parent] || p.parent;

   if (old === id) p.position[0] += .3;

   s.parts[p.id] = p;
  }

  for (const a of Object.values(clone(s.anchors))) {
   if (!map[a.parent]) continue;

   a.id = uid('anchor');
   a.parent = map[a.parent];
   s.anchors[a.id] = a;
  }
 });

 selectPart(newId);
}

function deleteSelected() {
 const id = state.selectedPartId;
 const aid = state.selectedAnchorId;

 if (aid) {
  askConfirm('取付点を削除しますか？',() => {
   mutate(s => delete s.anchors[aid]);
  });
  return;
 }

 if (id) {
  const ids = descendants(id);

  askConfirm(
   '選んだ部品とそれに付いている部品（計'+ids.length+'個）、付属の取付点を削除しますか？',
   () => mutate(s => {
    ids.forEach(x => delete s.parts[x]);
    pruneAnimations(s,ids);

    for (const [key,a] of Object.entries(s.anchors)) {
     if (ids.includes(a.parent)) delete s.anchors[key];
    }
   })
  );
 }
}

function addAnchor() {
 const id = uid('anchor');

 mutate(s => {
  s.anchors[id] = {
   id,
   name: '新しい取付点',
   parent: state.selectedPartId,
   position: [0,0,0],
   rotation: [0,0,0]
  };
 });

 selectAnchor(id);
}

// ============================================================
// 12. Patch Engine
// JSON Pointer。parts/anchorsはIDマップ。
// addは新規キーのみ、replace/removeは既存キーのみ。
// 作業用コピーに全件適用し、最後に整合性を検証する。
// ============================================================

function applyModelPatch(source,patch) {
 guardTree(patch);

 assert(
  obj(patch)
   && patch.format === 'MODELSTUDIO_PATCH_V1'
   && Array.isArray(patch.operations),
  'MODELSTUDIO_PATCH_V1 / operationsが必要です'
 );
 assert(
  patch.operations.length > 0 && patch.operations.length <= 500,
  '操作数は1〜500です'
 );

 const next = clone(source);

 // 動きの無い古いデータにも /animations/動きID を追加できるようにする
 if (!own(next,'animations')) next.animations = {};

 for (const [i,op] of patch.operations.entries()) {
  assert(
   obj(op) && ['add','replace','remove'].includes(op.op),
   '操作'+(i+1)+': op不正'
  );
  assert(
   typeof op.path === 'string'
    && op.path.startsWith('/')
    && !/~(?![01])/g.test(op.path),
   'Patch path不正'
  );

  const keys = op.path.slice(1).split('/').map(k =>
   k.replace(/~1/g,'/').replace(/~0/g,'~')
  );

  assert(
   ['meta','settings','parts','materials','anchors','animations'].includes(keys[0]),
   'このルートは変更できません'
  );
  assert(
   keys.every(k => k && !['__proto__','prototype','constructor'].includes(k)),
   'Patch pathに禁止キーがあります'
  );

  let parent = next;

  for (const k of keys.slice(0,-1)) {
   assert(
    parent && typeof parent === 'object' && own(parent,k),
    'Patch pathが存在しません: '+op.path
   );
   parent = parent[k];
  }

  assert(
   parent && typeof parent === 'object',
   'Patch親がObject/Arrayではありません'
  );

  const key = keys[keys.length-1];

  if (op.op !== 'remove') {
   assert(own(op,'value'),'Patch valueが必要です');
  }

  if (Array.isArray(parent)) {
   assert(
    /^(0|[1-9][0-9]*)$/.test(key) || key === '-' && op.op === 'add',
    '配列path不正'
   );

   const index = key === '-' ? parent.length : Number(key);

   assert(
    index >= 0 && index < (op.op === 'add' ? parent.length+1 : parent.length),
    '配列index範囲外'
   );

   if (op.op === 'add') {
    parent.splice(index,0,clone(op.value));
   } else if (op.op === 'remove') {
    parent.splice(index,1);
   } else {
    parent[index] = clone(op.value);
   }
  } else {
   if (op.op !== 'add') {
    assert(own(parent,key),'Patch pathが存在しません: '+op.path);
   }
   if (op.op === 'add') {
    assert(
     !own(parent,key),
     'add先は既存です。replaceを使用してください: '+op.path
    );
   }

   if (op.op === 'remove') delete parent[key];
   else parent[key] = clone(op.value);
  }
 }

 validateModelSpec(next);
 return next;
}

// ============================================================
// 12.5 AI回答の読み込み
// 新規モデル（MODEL_SPEC_V1）か修正データ（MODELSTUDIO_PATCH_V1）かを自動判別する。
// ============================================================

function applyAIText(text) {
 const data = parseJSON(cleanPastedJSON(text));

 assert(obj(data),'AIの回答がモデルデータの形になっていません');

 if (data.format === 'MODELSTUDIO_PATCH_V1' || Array.isArray(data.operations)) {
  const next = applyModelPatch(
   state.modelSpec,
   {...data,format:'MODELSTUDIO_PATCH_V1'}
  );
  commitSpec(next);
  return '修正を反映しました（↶で取り消せます）';
 }

 assert(
  data.format === 'MODEL_SPEC_V1',
  'AIの回答が「新しいモデル」でも「修正データ」でもありません。AIの回答全体をコピーし直してください'
 );

 const s = normalizeSpec(data);
 validateModelSpec(s);
 commitSpec(s,{fit:true});
 return '新しいモデルを読み込みました（↶で取り消せます）';
}

async function loadFromClipboard() {
 let text = '';

 try {
  assert(navigator.clipboard?.readText && window.isSecureContext,'fallback');
  text = await navigator.clipboard.readText();
 } catch (_) {
  // クリップボードを読めない環境では貼り付け画面に切り替える
  showImport();
  return;
 }

 if (!text.trim()) {
  toast('クリップボードが空です。AIの回答をコピーしてから押してください');
  return;
 }

 safe(() => toast(applyAIText(text)));
}

// ============================================================
// 13. Persistence
// 名前付き複数プロジェクトと、編集中の復旧用Draftを分離。
// ============================================================

function readStore() {
 const raw = localStorage.getItem(STORE);
 if (!raw) return {projects:[],last:null};

 const data = parseJSON(raw,20000000);

 assert(
  obj(data) && Array.isArray(data.projects),
  '保存領域の形式が不正です'
 );

 return data;
}

function saveProject() {
 finishLive();

 try {
  const data = readStore();
  const id = state.projectId || uid('project');

  const record = {
   projectId: id,
   name: state.modelSpec.meta.name,
   modelSpec: snapshot(),
   updatedAt: new Date().toISOString()
  };

  const index = data.projects.findIndex(p => p.projectId === id);

  if (index < 0) data.projects.push(record);
  else data.projects[index] = record;

  data.last = id;

  localStorage.setItem(STORE,JSON.stringify(data));

  state.projectId = id;
  state.projects = data.projects;
  state.dirty = false;
  state.storageError = false;

  writeDraft();
  updateHeader();

  if (state.activeTab === 'model') renderPanel();

  toast('プロジェクトを保存しました');
 } catch (e) {
  state.storageError = true;
  showError(Error(
   '保存できません: '+e.message+'。「データをコピー」で控えを取ってください。'
  ));
 }
}

function writeDraft() {
 try {
  localStorage.setItem(DRAFT,JSON.stringify({
   projectId: state.projectId,
   modelSpec: state.modelSpec,
   dirty: state.dirty,
   updatedAt: Date.now()
  }));

  state.storageError = false;
  updateHeader();
 } catch (e) {
  state.storageError = true;
  showError(Error('自動保存できません。「データをコピー」で控えを取ってください。'));
  updateHeader();
 }
}

function scheduleDraft() {
 clearTimeout(state.saveTimer);
 state.saveTimer = setTimeout(writeDraft,600);
}

function replaceProject(spec,id=null,dirty=true) {
 validateModelSpec(spec);
 commitSpec(spec,{history:false,fit:true});

 state.projectId = id;
 state.undo = [];
 state.redo = [];
 state.dirty = dirty;

 writeDraft();
 renderPanel();
}

function loadProject(id) {
 const data = readStore();
 const p = data.projects.find(p => p.projectId === id);

 assert(p,'プロジェクトが見つかりません');

 replaceProject(normalizeSpec(p.modelSpec),id,false);
 data.last = id;

 try {
  localStorage.setItem(STORE,JSON.stringify(data));
 } catch (e) {
  showError(e);
 }
}

function restoreProject() {
 let chosen = null;

 try {
  const data = readStore();
  state.projects = data.projects;

  const draft = localStorage.getItem(DRAFT);

  if (draft) {
   const d = parseJSON(draft);
   const s = normalizeSpec(d.modelSpec);

   validateModelSpec(s);
   chosen = s;

   state.projectId = d.projectId;
   state.dirty = !!d.dirty;
  } else {
   const p = data.projects.find(x => x.projectId === data.last);

   if (p) {
    chosen = normalizeSpec(p.modelSpec);
    validateModelSpec(chosen);
    state.projectId = p.projectId;
   }
  }
 } catch (e) {
  showError(Error('保存データを復元できません: '+e.message));
 }

 state.modelSpec = chosen || sampleSpec();

 if (!chosen) state.dirty = true;

 state.selectedMaterialId = Object.keys(state.modelSpec.materials)[0];
}

function replaceGuard(fn) {
 if (state.dirty) {
  askConfirm(
   '未保存の変更を置き換えますか？必要なら先に「保存」してください。',
   fn
  );
 } else {
  fn();
 }
}

function schemaGuide() {

meta={name,id,version:1,description}。
settings={unit:"meter",origin:"center-bottom"}。
+Y上、+Z前。originは作者の配置規約であり自動リセンターしない。
回転はXYZ Eulerラジアン。

parts/materials/anchorsは配列ではなくIDキーのObject。
IDは英字開始の英数字/_/-、64文字以内。

各Part={

 parent:nullまたはPart ID,
 position:[x,y,z],
 rotation:[x,y,z],
 scale:[x,y,z],

}。

groupはgeometry/material不要。
位置/回転/scaleは親ローカル。
scaleは正数のみ。
parent循環禁止、深さ32以下。

Material={
 name,
 type:"standard",
 color:"#rrggbb",
 roughness:0〜1,
 metalness:0〜1,
 opacity:0〜1,
 transparent:boolean,
 emissive:"#rrggbb",
 emissiveIntensity:0〜10
}。
不透明度を下げるときtransparent:trueも指定。

Anchor={
 id,
 name,
 parent:nullまたはPart ID,
 position:[x,y,z],
 rotation:[x,y,z]
}。
Anchorはゲーム側でObject3Dとして取得可能。

Geometryは以下のキー/既定値に準拠:
${json(GEO)}

lathe points=[半径,Y]。
extrude points=[X,Y]の自己交差しない輪郭、+Zにdepth押出し、穴/ベベルなし。
tube points=[X,Y,Z]、隣接同一点禁止。
capsuleはY軸、lengthは円筒部分の長さ。
sphere/cylinder/cone/capsule/latheはY軸、torus/planeはXY面。
分割数は整数3〜128、pointsは最大128点。

animations（動き）は任意項目。部品を削除・ID変更する場合は、その部品を参照するanimationsのtracks/spinsも整合させること。`;

async function copyText(text,message='コピーしました') {
 try {
  assert(navigator.clipboard && window.isSecureContext,'fallback');
  await navigator.clipboard.writeText(text);
  toast(message);
 } catch (e) {
  const t = document.createElement('textarea');

  t.value = text;
  t.style.cssText = 'position:fixed;left:0;top:0;opacity:0';

  document.body.appendChild(t);
  t.focus();
  t.select();

  let ok = false;

  try {
   ok = document.execCommand('copy');
  } catch (_) {}

  t.remove();

  if (ok) toast(message);
  else manualCopy(text);
 }
}

// ============================================================
// 16. Event Handlers
// イベントは振り分け中心とし、処理本体は上記の関数へ分離。
// ============================================================

function handleEdit(el,live=false) {
 const d = el.dataset;

 let value = el.type === 'checkbox'
  ? el.checked
  : el.type === 'number' || el.type === 'range'
   ? (el.value === '' ? NaN : Number(el.value))
   : el.value;

 if (d.key === 'parent') value = value || null;
 if (d.key === 'rotation') value = value*Math.PI/180;

 const index = d.index === undefined ? null : Number(d.index);

 if (d.key === 'parent') {
  mutate(s => s[d.edit][d.id].parent = value);
 } else {
  editDirect(d.edit,d.id,d.key,value,index,live);
 }

 if ($('out_'+d.key)) $('out_'+d.key).value = value;
}

function handleChange(e) {
 const el = e.target;
 const d = el.dataset;

 if (d.live) {
  finishLive();
  return;
 }

 if (d.edit) {
  const result = safe(() => handleEdit(el));
  renderPanel();
  return result;
 }

 if (d.meta) {
  safe(() => mutate(s => s.meta[d.meta] = el.value));
  renderPanel();
 } else if (el.id === 'materialSelect') {
  state.selectedMaterialId = el.value;
  renderPanel();
 } else if (el.id === 'motionKind') {
  state.motion.kind = el.value;
  state.motion.roleKey = null;
  state.motion.picks = defaultPicks(el.value);
  renderPanel();
 } else if (d.role) {
  state.motion.roles[d.role] = el.value;
 } else if (el.id === 'background') {
  state.background = el.value;
  setPreviewMode();
 }
}

function handleInput(e) {
 const d = e.target.dataset;

 if (d.ai) {
  state.ai[d.ai] = e.target.value;
 } else if (d.motion) {
  state.motion[d.motion] = Number(e.target.value);
  const out = $('out_m_'+d.motion);
  if (out) out.value = e.target.value;
  if (d.motion === 'trySpeed') startTry();
 } else if (d.live) {
  safe(() => handleEdit(e.target,true));
 }
}

function handleClick(e) {
 const b = e.target.closest('button');
 if (!b) return;

 finishLive();

 safe(() => {
  if (b.dataset.tab) {
   state.activeTab = b.dataset.tab;
   renderPanel();
  } else if (b.dataset.part) {
   selectPart(b.dataset.part);
  } else if (b.dataset.anchor) {
   selectAnchor(b.dataset.anchor);
  } else if (b.dataset.play) {
   playMotion(b.dataset.play);
  } else if (b.dataset.pick) {
   const m = state.motion;
   const id = b.dataset.pick;
   m.picks = m.picks.includes(id) ? m.picks.filter(x => x !== id) : [...m.picks,id];
   renderPanel();
  } else if (b.dataset.fix) {
   const m = state.motion;
   m.fixId = m.fixId === b.dataset.fix ? null : b.dataset.fix;
   state.ai.motionFix = '';
   renderPanel();
  } else if (b.dataset.try) {
   tryAction(b.dataset.try);
  } else if (b.dataset.delmotion) {
   const id = b.dataset.delmotion;
   const name = state.modelSpec.animations?.[id]?.name || id;

   askConfirm('動き「'+name+'」を削除しますか？',() => mutate(s => {
    delete s.animations[id];
   }));
  } else if (b.dataset.visible) {
   const id = b.dataset.visible;

   editDirect(
    'parts',
    id,
    'visible',
    !state.modelSpec.parts[id].visible
   );

   renderPanel();
  } else if (actions[b.dataset.action]) {
   actions[b.dataset.action]();
  }
 });
}

function handleKeyboard(e) {
 if (!$('modal').hidden) {
  if (e.key === 'Escape') closeDialog();

  if (e.key === 'Tab') {
   const nodes = [
    ...$('modal').querySelectorAll('button,textarea,input,select')
   ].filter(n => !n.disabled);

   const first = nodes[0];
   const last = nodes[nodes.length-1];

   if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
   } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
   }
  }

  return;
 }

 if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

 if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
  e.preventDefault();
  safe(() => undoRedo(e.shiftKey));
 }
}

  state.stats = calculateStats(state.runtime?.root);
  fitCamera();
 });

 renderPanel();

 document.addEventListener('click',handleClick);
 document.addEventListener('input',handleInput);
 document.addEventListener('change',handleChange);
 document.addEventListener('keydown',handleKeyboard);

 document.addEventListener('focusout',e => {
  if (e.target.dataset.live) finishLive();
 });

 document.addEventListener('visibilitychange',() => {
  if (document.hidden) {
   finishLive();
   writeDraft();
  } else {
   invalidate();
  }
 });

 window.addEventListener('pagehide',writeDraft);

 try {
  if (!localStorage.getItem(GUIDE)) showGuide();
 } catch (_) {
  showGuide();
 }
}

init();
</script>
