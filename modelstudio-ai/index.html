<!DOCTYPE html>
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#10151c">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<meta charset="UTF-8">

<title>ModelStudio AI</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#191f29;--line:#303b49;--muted:#a6b4c5;--cyan:#63d9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#edf4fc;font:14px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input:not([type=checkbox]):not([type=color]){min-height:44px}
button{background:#283343;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.38;cursor:default}
.primary{background:#175d75;border-color:#327e97}
.danger{color:#ffb5b5}
input,select,textarea{background:#101721;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input[type=color]{height:44px;padding:4px}
input[type=checkbox]{width:21px;height:21px;vertical-align:middle}
input[type=range]{padding:0;accent-color:var(--cyan)}
textarea{resize:vertical;min-height:130px;font:13px/1.55 ui-monospace,monospace}
label{display:block;color:var(--muted);margin:10px 0 4px}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:15px;margin:14px 0 8px}
p{margin:8px 0}
.muted,small{color:var(--muted)}
#startupSplash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#startupSplash .logo{font-size:64px;line-height:1}
#startupSplash strong{font-size:clamp(26px,7vw,42px);letter-spacing:.04em}
.logo{color:var(--cyan)}
body.preview-pinned{overflow:hidden}
body.preview-pinned .workspace{height:100vh;height:100dvh;overflow:hidden}
body.preview-pinned #viewport{flex:none;height:42svh;min-height:0}
body.preview-pinned #panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
#panel{scroll-padding-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.row.fill>*{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.workspace{display:flex;flex-direction:column}
#viewport{height:46svh;min-height:240px;position:relative;background:#202a36;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#viewTools{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:12}

#moreMenu>summary::-webkit-details-marker{display:none}
#moreMenu>summary::marker{content:''}
#moreMenu>summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#moreMenu[open]>summary{border-color:var(--cyan);background:#204255}
#moreMenu .menu-sheet{position:absolute;top:calc(100% + 8px);right:0;width:min(320px,calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;background:#191f29;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 36px #0008}

#moreMenu .menu-heading{font-size:12px;color:var(--muted);margin:12px 0 6px}
#moreMenu .menu-status{margin:0 0 10px;overflow-wrap:anywhere;color:#edf4fc;font-size:13px}
#moreMenu .menu-check{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;color:#edf4fc;cursor:pointer}
#moreMenu .menu-check input{flex:none}
#moreMenu .menu-wide{display:block;width:100%;text-align:left}
#moreMenu .menu-color{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
#moreMenu .menu-color input{width:64px}
#stats{margin-top:12px;font:11px/1.6 ui-monospace,monospace;color:#d8e7f2;overflow-wrap:anywhere}
#renderMessage{position:absolute;top:80px;left:14px;right:14px;background:#111d;color:#ffddb0;border-radius:10px;padding:12px;display:none;pointer-events:none}
#panel{padding:16px 16px 100px;min-width:0;overflow-wrap:anywhere}
.card{background:#1b2531b8;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}

nav button.active{background:#204255;color:#8eeaff}

.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}

.beat{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:6px;margin:6px 0;align-items:center}
.card.review{border-color:var(--cyan)}

.libcard{position:relative;min-width:0}
.libopen{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;padding:6px;text-align:left}
.libopen img,.nothumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#1c2633}
.nothumb{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.libopen b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libopen small{font-size:11px}
.libcard.current .libopen{border-color:var(--cyan);background:#1f3442}
.libdel{position:absolute;top:10px;right:10px;min-height:32px;width:32px;padding:0;background:#18212de6}

body.library-open #viewTools{display:none}
#libraryScreen{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#libraryScreen[hidden]{display:none}
.libhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#121b27}
.libhead h2{flex:1;margin:0;min-width:0}
.libtools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 14px 0}
.libtools select{width:auto}
.libbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 14px calc(24px + env(safe-area-inset-bottom))}
#libraryScreen .library{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.libmeta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:#d8e7f2}
.libdesc{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.libacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.libacts button{padding:6px 4px;font-size:12px}
.keybar{position:relative;height:44px;margin:0 8px;border-bottom:1px solid var(--line)}
.keymark{position:absolute;top:0;height:44px;min-height:44px;padding:0;border:0;border-radius:6px;background:transparent;z-index:1}
.keydot{position:absolute;top:50%;width:10px;height:10px;border-radius:2px;background:#ffc66f;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none}
.keydot.on{background:var(--cyan)}
#startupSplash{cursor:pointer}
@media(min-width:950px){
 .libhead,.libtools,.libbody{padding-left:max(24px,calc((100vw - 1100px)/2));padding-right:max(24px,calc((100vw - 1100px)/2))}
}
#levelBtn{font-size:12px;padding:9px 8px}
.nudge{border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0;background:#16202b}
.nudgegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.nudgegrid button{min-height:44px;padding:6px 4px;font-size:13px}
.newkind{display:block;width:100%;text-align:left;margin:6px 0}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:6px 0}
.swatch{min-height:40px;padding:0;border-radius:10px;border:2px solid var(--line)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
#walkUI{position:absolute;inset:0;pointer-events:none;z-index:3}
#walkStick{position:absolute;left:16px;bottom:44px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}
#walkKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#63d9f5cc;pointer-events:none}
#walkActs{position:absolute;right:12px;bottom:44px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#walkActs button{background:#175d75e6;min-width:92px}
.warnbox{border:1px solid #b98b52;background:#3a2e1c;color:#ffe2b8;border-radius:10px;padding:10px}
#assignHint{position:absolute;left:10px;right:10px;top:58px;z-index:4;background:#204255f2;color:#e6f9ff;border:1px solid var(--cyan);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
@media(min-width:950px){
 #panel{padding-left:max(24px,calc((100vw - 1000px)/2));padding-right:max(24px,calc((100vw - 1000px)/2))}
}
@media(max-width:500px){
 input,select,textarea{font-size:16px}
 .steps{gap:4px}
 .steps button{padding:5px 7px;min-height:40px}
 .steps small{font-size:11px}
 .stephint{font-size:11px;margin:2px 0 6px}
 .grid3 input{padding:8px 5px}
}
@media(max-height:500px){
 #viewport{height:45svh;min-height:160px}
 body.preview-pinned #viewport{height:40svh}
}
</style>

<body>
<div id="startupSplash" role="status" aria-label="ModelStudio AI 起動中">
 <span class="logo" aria-hidden="true">◈</span>
 <strong>ModelStudio AI</strong>
</div>
<script>
// 最初の描画機会を確保してから、タイトルの計時とアプリの準備を始める
const startupPainted = new Promise(resolve => {
 requestAnimationFrame(() => {
  requestAnimationFrame(resolve);
 });
});

// 捕捉されなかったエラーを画面のエラー欄に表示する（起動しないときの原因確認用）
// 上書きせずに追記し、同じ内容は1回だけ表示する
const startupLog = [];

function reportStartupError(message) {
 const text = String(message);
 if (!startupLog.includes(text)) startupLog.push(text);

 const show = () => {
  const box = document.getElementById('error');
  if (!box) return false;
  box.textContent = 'エラー:\n'+startupLog.join('\n');
  box.hidden = false;
  return true;
 };

 if (!show()) document.addEventListener('DOMContentLoaded',show,{once:true});
}

// 本体スクリプトを実行せずに、文法だけを確かめる
function checkMainSyntax() {
 const mark = 'function create'+'ModelRenderer';
 const main = [...document.scripts].find(s => !s.src && s.textContent.includes(mark));

 if (!main) return '本体のスクリプトが見つかりません。';

 try {
  new Function(main.textContent);
  return '本体のスクリプトに文法の誤りは見つかりませんでした。';
 } catch (e) {
  if (e instanceof SyntaxError) {
   const line = e.line || e.lineNumber;
   if (!line) return '構文エラー: '+e.message;

   // new Function が付け足す行の数を調べて、本体スクリプトでの行番号に直す
   let offset = 0;
   try {
    new Function('\n\n)');
   } catch (probe) {
    const probeLine = probe.line || probe.lineNumber;
    if (probeLine) offset = probeLine-3;
   }

   const n = line-offset;
   const lines = main.textContent.split('\n');
   const from = Math.max(1,n-4);
   const to = Math.min(lines.length,n+1);
   const excerpt = [];

   for (let i = from;i <= to;i++) {
    const code = lines[i-1].trim();
    excerpt.push(
     (i === n ? '▶ ' : '　 ')+i+': '
     + (code.length > 80 ? code.slice(0,80)+'…' : code)
    );
   }

   return '構文エラー: '+e.message+'（本体スクリプトの'+n+'行目付近）\n'
    + '--- 該当箇所 ---\n'+excerpt.join('\n');
  }
  return '文法を確かめられませんでした（'+(e && e.message ? e.message : e)+'）。';
 }
}

// 別のサイトから読み込んだスクリプトのエラーは、ブラウザの制限で「Script error.」とだけ届く
let externalScriptError = false;

window.addEventListener('error',e => {
 if (!e.message) return;

 // 詳細のない外部スクリプトのエラーは記録だけにする（起動できなかったときに案内する）
 if (/^Script error\.?$/i.test(e.message) && !e.filename) {
  externalScriptError = true;
  return;
 }

 const file = e.filename ? String(e.filename).split(/[?#]/)[0].split('/').pop() : '';
 const where = file || e.lineno
  ? '（'+(file ? file+' ' : '')+(e.lineno ? e.lineno+'行目' : '')+'）'
  : '';

 reportStartupError(e.message+where);
});

// 10秒たっても起動していない（読み込み中の表示のまま）ときだけ、止まった段階を知らせる
setTimeout(() => {
 // 起動完了の合図があれば何もしない（合図がないときだけ、読み込み中の表示を確かめる）
 if (window.__msStage === 'ready') return;

 const panel = document.getElementById('panel');
 const loading = panel && panel.querySelector('[data-startup-loading]');
 if (!loading) return;

 const stage = window.__msStage;
 const where = !stage
  ? '本体のスクリプトが実行されていません。'+checkMainSyntax()
  : stage === 'main-start'
   ? '本体のスクリプトの実行が途中で止まりました（読み込み中のエラー）。'
   : stage === 'main-loaded'
    ? '起動の準備（画面描画の待ち）から先に進んでいません。'
    : stage === 'lib'
     ? '保存データの準備が終わっていません。'
     : stage === 'init'
      ? '起動処理（init）の途中で止まりました。上のエラーを確認してください。'
      : '段階: '+stage;

 reportStartupError(
  '起動できませんでした。'+where
  + (externalScriptError ? '（詳細が隠されたエラー「Script error」も発生しています）' : '')
 );
},10000);

window.addEventListener('unhandledrejection',e => {
 const r = e.reason;
 reportStartupError('処理に失敗しました: '+(r && r.message ? r.message : String(r)));
});

// init の完了（成功・失敗とも）を知らせる
let startupReadyMark = () => {};
const startupReady = new Promise(resolve => {
 startupReadyMark = resolve;
});

// 最短400ms経過と init 完了の両方で閉じる。最大1500ms、タップ/クリックで即座に閉じる
const startupSplashDone = startupPainted.then(() => new Promise(resolve => {
 let closed = false;

 const close = () => {
  if (closed) return;
  closed = true;
  document.getElementById('startupSplash')?.remove();
  document.querySelectorAll('[data-startup-lock]').forEach(el => {
   el.removeAttribute('inert');
  });
  resolve();
 };

 document.getElementById('startupSplash')?.addEventListener('click',close);
 Promise.all([new Promise(r => setTimeout(r,400)),startupReady]).then(close);
 setTimeout(close,1500);
}));
</script>

<div id="error" class="error" role="alert" hidden></div>

<main class="workspace" data-startup-lock inert>
 <section id="viewport" aria-label="3Dプレビュー">
  <div id="renderMessage"></div>
 </section>
 <section id="panel"><p class="hint" data-startup-loading="1">保存データを読み込んでいます…</p></section>
</main>

<div id="viewTools" data-startup-lock inert>
 <details id="moreMenu">
  <summary aria-label="その他の操作と表示設定">
   <span aria-hidden="true">☰</span><span>その他</span>
  </summary>
  <div class="menu-sheet">
   <p id="modelTitle" class="menu-status">読み込み中…</p>
   <div class="grid2">
    <button id="undoBtn" data-action="undo" aria-label="元に戻す">↶ 元に戻す</button>
    <button id="redoBtn" data-action="redo" aria-label="やり直す">↷ やり直す</button>
   </div>
   <p><button data-action="save" class="primary menu-wide">保存</button></p>
   <p><button data-action="library" class="menu-wide">▦ ライブラリ</button></p>

   <p class="menu-heading">表示設定</p>
   <label class="menu-check">
    <input type="checkbox" id="pinViewport">
    3D表示を上部に固定
   </label>
   <p class="hint">固定すると、下の編集欄だけをスクロールできます。</p>
   <div class="row">
    <span class="muted">表示の細かさ</span>
    <button id="levelBtn" data-action="level" aria-label="表示の切り替え（現在: かんたん）">かんたん</button>
   </div>

   <p class="menu-heading">3D表示の操作</p>
   <div class="grid2">
    <button data-action="fit">⊙ 全体表示</button>
    <button data-action="studio" id="studioBtn">仕上がり確認</button>
    <button data-action="grid" id="gridBtn">方眼 ✓</button>
    <button data-action="anchors" id="anchorBtn">取付点 ✓</button>
   </div>
   <label class="menu-color">背景色
    <input type="color" id="background" value="#202a36" aria-label="背景色">
   </label>

   <p class="menu-heading">ヘルプ</p>
   <button data-action="guide" class="menu-wide">? 使い方</button>
   <div id="stats"></div>
  </div>
 </details>
</div>

<nav aria-label="主要タブ" data-startup-lock inert>
 <button data-tab="model" class="active"><span>◈</span>モデル</button>
 <button data-tab="parts"><span>▤</span>部品</button>
 <button data-tab="material"><span>◐</span>色・質感</button>
 <button data-tab="motion"><span>▶</span>動き</button>
 <button data-tab="ai"><span>✧</span>AI相談</button>
 <button data-tab="export"><span>↗</span>書き出し</button>
</nav>

<section id="libraryScreen" role="dialog" aria-modal="true" aria-labelledby="libraryTitle" hidden></section>

<div id="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div class="row" id="dialogActions"></div>
 </section>
</div>

<script>
// 1つ目のCDNから読み込めなかったときだけ、予備のCDNから読み込む
if (!window.THREE) document.write('<script crossorigin="anonymous" src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
</script>
<script>
'use strict';

// ============================================================
// 4. Utilities
// ============================================================

const $ = id => document.getElementById(id);
const clone = x => JSON.parse(JSON.stringify(x));
const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const obj = o => o !== null && typeof o === 'object' && !Array.isArray(o);
const json = x => JSON.stringify(x,null,2);
const uid = p => p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);

const esc = x => String(x ?? '').replace(
 /[&<>"']/g,
 c => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);

function assert(test,message) {
 if (!test) throw Error(message);
}

function showError(e) {
 $('error').textContent = e.message || String(e);
 $('error').hidden = false;
}

function clearError() {
 $('error').hidden = true;
}

function safe(fn) {
 try {
  clearError();
  return fn();
 } catch (e) {
  showError(e);
  return null;
 }
}

function toast(message,ms=2400) {
 $('toast').textContent = message;
 $('toast').style.display = 'block';
 clearTimeout(state.toastTimer);
 state.toastTimer = setTimeout(() => {
  $('toast').style.display = 'none';
 },ms);
}

function guardTree(v,depth=0) {
 assert(depth < 50,'JSONの入れ子が深すぎます');

 if (v && typeof v === 'object') {
  for (const k of Object.keys(v)) {
   assert(
    !['__proto__','constructor','prototype'].includes(k),
    '禁止キー: '+k
   );
   guardTree(v[k],depth+1);
  }
 } else if (typeof v === 'number') {
  assert(Number.isFinite(v),'有限の数値が必要です');
 }
}

function parseJSON(text,max=LIMIT.bytes) {
 assert(text.length <= max,'JSONがサイズ上限を超えています');

 let v;
 try {
  v = JSON.parse(text);
 } catch (e) {
  throw Error('データの書き方に誤りがあります（JSON構文エラー）: '+e.message);
 }

 guardTree(v);
 return v;
}

function toMap(value,label) {
 if (!Array.isArray(value)) return value;

 const result = {};
 for (const item of value) {
  assert(
   obj(item) && typeof item.id === 'string',
   label+': idが必要です'
  );
  assert(!own(result,item.id),label+': ID重複 '+item.id);
  result[item.id] = item;
 }
 return result;
}

function normalizeSpec(source) {
 const s = clone(source);
 guardTree(s);
 assert(obj(s),'ModelSpecはObjectです');

 s.parts = toMap(s.parts,'parts');
 s.anchors = toMap(s.anchors ?? {},'anchors');
 s.animations ??= {};

 if (obj(s.parts)) {
  for (const [id,p] of Object.entries(s.parts)) {
   assert(obj(p),'PartがObjectではありません: '+id);
   p.id ??= id;
   p.name ??= id;
   p.type ??= 'primitive';
   p.parent ??= null;
   p.position ??= [0,0,0];
   p.rotation ??= [0,0,0];
   p.scale ??= [1,1,1];
   p.visible ??= true;
  }
 }

 if (obj(s.anchors)) {
  for (const [id,a] of Object.entries(s.anchors)) {
   assert(obj(a),'AnchorがObjectではありません');
   a.id ??= id;
   a.name ??= id;
   a.parent ??= null;
   a.rotation ??= [0,0,0];
  }
 }

 return s;
}

function cleanPastedJSON(text) {
 return String(text ?? '')
  .replace(/^\uFEFF/,'')
  .replace(/[\u201C\u201D\u201E\u201F\u2033\uFF02]/g,'"')
  .replace(/\u00A0/g,' ')
  .trim()
  .replace(/^`{3}[A-Za-z]*\s*\n?/,'')
  .replace(/\n?`{3}\s*$/,'')
  .trim();
}

function parseModelSpec(text) {
 const s = normalizeSpec(parseJSON(cleanPastedJSON(text)));
 validateModelSpec(s);
 return s;
}

// ============================================================
// 5. ModelSpec Validation
// 検証と負荷上限チェックを済ませてからSceneを変更する。
// ============================================================

function validId(id) {
 return typeof id === 'string'
  && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(id)
  && !['constructor','prototype','__proto__'].includes(id);
}

function number(n,label,min=-10000,max=10000) {
 assert(
  typeof n === 'number' && Number.isFinite(n) && n >= min && n <= max,
  label+': '+min+'〜'+max+'の数値が必要です'
 );
}

function vector(v,label,n=3) {
 assert(
  Array.isArray(v) && v.length === n,
  label+': '+n+'要素の配列が必要です'
 );
 v.forEach(x => number(x,label));
}

function validateGeometry(g,label) {
 assert(
  obj(g) && own(GEO,g.type),
  '部品「'+label+'」の形の種類が分かりません。箱・球・円柱などの形を選び直してください'
 );

 const base = GEO[g.type];

 for (const key of Object.keys(base)) {
  const v = g[key] ?? base[key];

  if (key === 'type') continue;

  if (key === 'points') {
   assert(g.points !== undefined,label+': pointsが必要です');
   assert(
    Array.isArray(v)
     && v.length >= (g.type === 'extrude' ? 3 : 2)
     && v.length <= 128,
    label+': pointsは2/3〜128点'
   );

   v.forEach(p => vector(p,label+'.points',g.type === 'tube' ? 3 : 2));

   if (g.type === 'lathe') {
    v.forEach(p => number(p[0],label+'.radius',0,10000));
   }

   if (g.type === 'extrude') {
    let area = 0;
    v.forEach((p,i) => {
     const q = v[(i+1)%v.length];
     area += p[0]*q[1]-q[0]*p[1];
    });
    assert(Math.abs(area) > 1e-8,label+': 輪郭面積が0です');
   }

   if (g.type === 'tube') {
    for (let i=1;i<v.length;i++) {
     assert(
      v[i].some((x,j) => x !== v[i-1][j]),
      label+': tubeの隣接点が重複しています'
     );
    }
   }
  } else if (key === 'size') {
   vector(v,label+'.size',base.size.length);
   v.forEach(n => number(n,label+'.size',.001,10000));
  } else if (key === 'closed') {
   assert(typeof v === 'boolean',label+': closedはbooleanです');
  } else if (/Segments$|^segments$/.test(key)) {
   number(v,label+'.'+key,3,128);
   assert(Number.isInteger(v),label+': 分割数は整数です');
  } else {
   number(
    v,
    label+'.'+key,
    ['radiusTop','radiusBottom','length'].includes(key) ? 0 : .001,
    10000
   );
  }
 }

 if (g.type === 'cylinder') {
  assert(
   (g.radiusTop ?? .5)+(g.radiusBottom ?? .5) > 0,
   label+': 半径を指定してください'
  );
 }

 const d = {...base,...g};

 switch (d.type) {
  case 'box': return 12;
  case 'plane': return 2;
  case 'sphere': return d.widthSegments*d.heightSegments*2;
  case 'cylinder':
  case 'cone': return d.radialSegments*4;
  case 'torus':
  case 'tube': return d.radialSegments*d.tubularSegments*2;
  case 'capsule': return d.radialSegments*(d.capSegments*2+3)*2;
  case 'lathe': return d.segments*d.points.length*2;
  case 'extrude': return d.points.length*4;
 }
}

// 動き（animations）の検証。回転は基本姿勢からの差分（度）、位置は差分（m）。
function validateAnimations(s) {
 const anims = s.animations;

 assert(obj(anims),'animations（動き）は動きIDをキーにしたObjectです');
 assert(
  Object.keys(anims).length <= LIMIT.animations,
  '動きは'+LIMIT.animations+'個までです'
 );

 for (const [id,a] of Object.entries(anims)) {
  const label = '動き「'+id+'」';

  assert(validId(id) && obj(a),label+': IDは英字で始まる英数字、中身はObjectです');
  assert(a.name === undefined || typeof a.name === 'string',label+': nameは文字列です');
  number(a.duration,label+'の長さ(duration)',.1,30);
  assert(a.loop === undefined || typeof a.loop === 'boolean',label+': loopはtrue/falseです');
  assert(
   a.ease === undefined || ['linear','smooth'].includes(a.ease),
   label+': easeは "linear" か "smooth" です'
  );
  assert(a.tracks === undefined || obj(a.tracks),label+': tracksは部品IDをキーにしたObjectです');

  let keys = 0;

  for (const [pid,tr] of Object.entries(a.tracks || {})) {
   assert(own(s.parts,pid),label+': 部品「'+pid+'」がありません');
   assert(obj(tr),label+': '+pid+'の記録が不正です');

   for (const [ch,list] of Object.entries(tr)) {
    assert(
     ['rotation','position','scale'].includes(ch),
     label+': '+pid+'.'+ch+'は使えません（rotation/position/scaleのみ）'
    );
    assert(
     Array.isArray(list) && list.length > 0,
     label+': '+pid+'.'+ch+'にはキーが1つ以上必要です'
    );

    let prev = 0;

    for (const k of list) {
     assert(Array.isArray(k) && k.length === 2,label+': キーは[時刻,[x,y,z]]の形です');
     number(k[0],label+'の時刻',0,a.duration);
     assert(k[0] >= prev,label+': '+pid+'.'+ch+'の時刻は小さい順に並べてください');
     prev = k[0];
     vector(k[1],label+': '+pid+'.'+ch);
     // scale は倍率（1=元の大きさ）
     if (ch === 'scale') k[1].forEach(v => number(v,label+': '+pid+'.scale（倍率）',.001,1000));
     keys++;
    }
   }
  }

  assert(keys <= LIMIT.motionKeys,label+': キーは'+LIMIT.motionKeys+'個までです');

  assert(a.spins === undefined || Array.isArray(a.spins),label+': spinsは配列です');
  for (const sp of a.spins || []) {
   assert(obj(sp) && own(s.parts,sp.part),label+': 回し続ける部品が見つかりません');
   assert(['x','y','z'].includes(sp.axis),label+': spinsのaxisはx/y/zです');
   number(sp.degPerSec,label+'の回転速度',-100000,100000);
  }

  assert(a.show === undefined || Array.isArray(a.show),label+': showは部品IDの配列です');
  for (const pid of a.show || []) {
   assert(typeof pid === 'string' && own(s.parts,pid),label+': showの部品「'+pid+'」がありません');
  }

  assert(a.events === undefined || Array.isArray(a.events),label+': eventsは配列です');
  for (const ev of a.events || []) {
   assert(
    Array.isArray(ev) && ev.length === 2 && validId(ev[1]),
    label+': 合図は[時刻,英数字の名前]の形です'
   );
   number(ev[0],label+'の合図の時刻',0,a.duration);
  }
 }
}

function validateModelSpec(s) {
 guardTree(s);

 assert(
  obj(s) && s.format === 'MODEL_SPEC_V1',
  'format: MODEL_SPEC_V1 が必要です'
 );
 assert(
  obj(s.meta)
   && typeof s.meta.name === 'string'
   && s.meta.name.trim()
   && validId(s.meta.id),
  'meta.name / 英数字のmeta.idが必要です'
 );

 number(s.meta.version,'meta.version',1,100000);
 assert(Number.isInteger(s.meta.version),'versionは整数です');
 assert(
  s.meta.description === undefined || typeof s.meta.description === 'string',
  'descriptionは文字列です'
 );
 assert(
  obj(s.settings)
   && s.settings.unit === 'meter'
   && s.settings.origin === 'center-bottom',
  'settingsは unit: meter / origin: center-bottom としてください'
 );

 for (const k of ['parts','materials','anchors']) {
  assert(obj(s[k]),k+'はIDをキーにしたObjectです');
 }

 assert(Object.keys(s.parts).length <= LIMIT.parts,'Partは300個までです');
 assert(
  Object.keys(s.materials).length > 0
   && Object.keys(s.materials).length <= LIMIT.materials,
  'Materialは1〜100個です'
 );
 assert(Object.keys(s.anchors).length <= LIMIT.anchors,'Anchorは100個までです');

 for (const [id,m] of Object.entries(s.materials)) {
  assert(
   validId(id) && obj(m),
   '色・質感の識別名（'+id+'）が正しくありません。英字で始まる英数字の名前にしてください'
  );
  assert(m.type === 'standard','Material.typeはstandardです');
  assert(
   m.name === undefined || typeof m.name === 'string',
   'Material.nameは文字列です'
  );

  for (const k of ['color','emissive']) {
   if (k === 'color' || m[k] !== undefined) {
    assert(
     /^#[0-9a-f]{6}$/i.test(m[k]),
     id+'.'+k+': #rrggbb が必要です'
    );
   }
  }

  for (const k of ['roughness','metalness','opacity']) {
   if (m[k] !== undefined) number(m[k],id+'.'+k,0,1);
  }

  if (m.emissiveIntensity !== undefined) {
   number(m.emissiveIntensity,id+'.emissiveIntensity',0,10);
  }
  if (m.transparent !== undefined) {
   assert(typeof m.transparent === 'boolean','transparentはbooleanです');
  }
 }

 let estimate = 0;

 for (const [id,p] of Object.entries(s.parts)) {
  assert(
   validId(id) && obj(p) && p.id === id,
   '部品の識別名（ID）が一致していません（'+id+'）。データを読み込み直すか、AIに作り直してもらってください'
  );
  assert(typeof p.name === 'string','Part.nameが必要です');
  assert(
   ['primitive','group'].includes(p.type),
   id+': typeはprimitive/groupです'
  );

  for (const k of ['position','rotation','scale']) {
   vector(p[k],id+'.'+k);
  }
  p.scale.forEach(n => number(n,id+'.scale',.001,1000));

  assert(typeof p.visible === 'boolean',id+': visibleはbooleanです');
  assert(p.effect === undefined || typeof p.effect === 'boolean',id+': effectはtrue/falseです');
  assert(
   p.parent === null
    || typeof p.parent === 'string' && own(s.parts,p.parent),
   '部品「'+id+'」の親部品が見つかりません。親部品を選び直すか、AIに「今のモデルに合わせて直して」と頼んでください'
  );

  if (p.type === 'primitive') {
   assert(
    typeof p.material === 'string' && own(s.materials,p.material),
    '部品「'+id+'」の色・質感が見つかりません。「色・質感」を選び直してください'
   );
   estimate += validateGeometry(p.geometry,id);
  }

  const visited = new Set([id]);
  let parent = p.parent;

  while (parent !== null) {
   assert(
    !visited.has(parent),
    '部品の親子関係が輪になっています（'+id+'）。親部品の選び方を見直してください'
   );
   visited.add(parent);
   assert(visited.size <= 32,'階層は32段までです');
   assert(
    obj(s.parts[parent]),
    '部品「'+id+'」の親部品が見つかりません。親部品を選び直すか、AIに「今のモデルに合わせて直して」と頼んでください'
   );
   parent = s.parts[parent].parent;
  }
 }

 for (const [id,a] of Object.entries(s.anchors)) {
  assert(
   validId(id) && obj(a) && a.id === id && typeof a.name === 'string',
   'Anchor ID/name不正: '+id
  );
  vector(a.position,id+'.position');
  vector(a.rotation,id+'.rotation');
  assert(
   a.parent === null
    || typeof a.parent === 'string' && own(s.parts,a.parent),
   '取付点「'+id+'」を付ける部品が見つかりません。取付点を付け直すか、削除してください'
  );
 }

 if (s.animations !== undefined) validateAnimations(s);

 assert(
  estimate <= LIMIT.triangles,
  '推定20万Triangleを超えます。分割数/Part数を減らしてください'
 );
 assert(JSON.stringify(s).length <= LIMIT.bytes,'モデルが2MBを超えます');

 return true;
}

// ============================================================
// 6–8. Geometry Builders / Material Manager / Generic Model Renderer
//
// このFactoryは外側のstateやGEOに依存しない。
// ゲーム組込時にも同じ関数をそのまま出力する。
// 入力は検証済みModelSpecを前提にする。
// ============================================================

function createModelRenderer(THREE) {
 function buildGeometry(g) {
  switch (g.type) {
   case 'box':
    return new THREE.BoxGeometry(...(g.size || [1,1,1]));

   case 'sphere':
    return new THREE.SphereGeometry(
     g.radius ?? .5,
     g.widthSegments ?? 20,
     g.heightSegments ?? 12
    );

   case 'cylinder':
    return new THREE.CylinderGeometry(
     g.radiusTop ?? .5,
     g.radiusBottom ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'cone':
    return new THREE.ConeGeometry(
     g.radius ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'torus':
    return new THREE.TorusGeometry(
     g.radius ?? .5,
     g.tube ?? .12,
     g.radialSegments ?? 8,
     g.tubularSegments ?? 24
    );

   case 'plane':
    return new THREE.PlaneGeometry(...(g.size || [1,1]));

   case 'lathe':
    return new THREE.LatheGeometry(
     g.points.map(p => new THREE.Vector2(...p)),
     g.segments ?? 24
    );

   case 'extrude': {
    const shape = new THREE.Shape();
    g.points.forEach((p,i) => {
     if (i) shape.lineTo(...p);
     else shape.moveTo(...p);
    });
    shape.closePath();

    return new THREE.ExtrudeGeometry(shape,{
     depth: g.depth ?? .4,
     steps: 1,
     bevelEnabled: false,
     curveSegments: 1
    });
   }

   case 'tube': {
    const curve = new THREE.CatmullRomCurve3(
     g.points.map(p => new THREE.Vector3(...p)),
     g.closed ?? false,
     'centripetal'
    );

    return new THREE.TubeGeometry(
     curve,
     g.tubularSegments ?? 32,
     g.radius ?? .08,
     g.radialSegments ?? 8,
     g.closed ?? false
    );
   }

   case 'capsule': {
    const r = g.radius ?? .3;
    const l = g.length ?? 1;
    const n = g.capSegments ?? 6;
    const pts = [];

    for (let i=0;i<=n;i++) {
     const a = -Math.PI/2+i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      -l/2+Math.sin(a)*r
     ));
    }

    for (let i=0;i<=n;i++) {
     const a = i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      l/2+Math.sin(a)*r
     ));
    }

    return new THREE.LatheGeometry(pts,g.radialSegments ?? 20);
   }

   default:
    throw Error('不明なGeometry: '+g.type);
  }
 }

 function updateMaterial(m,d) {
  m.color.set(d.color);
  m.roughness = d.roughness ?? .6;
  m.metalness = d.metalness ?? 0;
  m.opacity = d.opacity ?? 1;
  m.transparent = d.transparent ?? false;
  m.emissive.set(d.emissive ?? '#000000');
  m.emissiveIntensity = d.emissiveIntensity ?? 0;
  m.side = THREE.DoubleSide;
  m.depthWrite = !m.transparent;
  m.needsUpdate = true;
 }

 function buildMaterial(d) {
  const m = new THREE.MeshStandardMaterial();
  updateMaterial(m,d);
  return m;
 }

 function transform(o,d) {
  o.position.fromArray(d.position);
  o.rotation.set(...d.rotation);
  o.scale.fromArray(d.scale || [1,1,1]);
  o.visible = d.visible !== false;
 }

 function buildPart(p,materials) {
  const group = new THREE.Group();
  group.name = p.name;
  group.userData.partId = p.id;
  transform(group,p);

  if (p.type === 'primitive') {
   const mesh = new THREE.Mesh(
    buildGeometry(p.geometry),
    materials[p.material]
   );
   mesh.castShadow = true;
   mesh.receiveShadow = true;
   mesh.userData.partId = p.id;
   group.add(mesh);
  }

  return group;
 }

 function dispose(root) {
  const gs = new Set();
  const ms = new Set();

  root.traverse(o => {
   if (o.geometry) gs.add(o.geometry);
   if (o.material) {
    (Array.isArray(o.material) ? o.material : [o.material])
     .forEach(m => ms.add(m));
   }
  });

  Object.values(root.userData.materials || {}).forEach(m => ms.add(m));
  gs.forEach(g => g.dispose());
  ms.forEach(m => m.dispose());
 }

 function buildModel(spec) {
  const root = new THREE.Group();
  const parts = {};
  const materials = {};
  const anchors = {};

  root.name = spec.meta.name;
  root.userData = {parts,materials,anchors};

  try {
   for (const [id,m] of Object.entries(spec.materials)) {
    materials[id] = buildMaterial(m);
   }

   for (const p of Object.values(spec.parts)) {
    parts[p.id] = buildPart(p,materials);
    root.add(parts[p.id]);
   }

   for (const p of Object.values(spec.parts)) {
    if (p.parent) parts[p.parent].add(parts[p.id]);
   }

   for (const a of Object.values(spec.anchors)) {
    const o = new THREE.Object3D();
    o.name = a.id;
    o.userData.anchorId = a.id;
    transform(o,a);

    (a.parent ? parts[a.parent] : root).add(o);
    anchors[a.id] = o;
   }

   root.updateMatrixWorld(true);
   return root;
  } catch (e) {
   dispose(root);
   throw e;
  }
 }

 // 動きの再生。各部品の基本姿勢に「差分（回転=度, 位置=m）」を足して毎フレーム当てはめる。
 // 使い方: const anim = createAnimator(model, spec); anim.play('walk'); 毎フレーム anim.update(dt,{speed});
 // showEffects: 停止中（動きなし）に効果部品を表示するか（編集画面では true、ゲームでは既定の false）
 function createAnimator(root,spec,{showEffects=false}={}) {
  const D = Math.PI/180;
  const parts = root.userData.parts;
  const clips = spec.animations || {};
  const rest = {};
  const touched = new Set();
  const handlers = {};
  // 効果部品（effect:true。炎・煙・光など）と、その本来の表示設定
  const effects = {};
  // 動きごとに参照している部品（tracks・spins・show）
  const uses = {};
  let current = null;
  let previous = null;
  let fade = 0;
  let fadeTime = 0;

  for (const [id,o] of Object.entries(parts)) {
   rest[id] = {p:o.position.clone(),r:o.rotation.clone(),s:o.scale.clone()};
  }

  for (const p of Object.values(spec.parts || {})) {
   if (p.effect === true && parts[p.id]) effects[p.id] = p.visible !== false;
  }

  for (const [cid,c] of Object.entries(clips)) {
   const used = uses[cid] = new Set((c.show || []).filter(id => parts[id]));

   Object.keys(c.tracks || {}).forEach(id => {
    if (!parts[id]) return;
    touched.add(id);
    used.add(id);
   });
   (c.spins || []).forEach(sp => {
    if (!parts[sp.part]) return;
    touched.add(sp.part);
    used.add(sp.part);
   });
  }

  // Catmull-Rom 補間（ease:"smooth" のとき、前後のキーを使って滑らかにつなぐ）
  function catmull(p0,p1,p2,p3,k) {
   const k2 = k*k;
   const k3 = k2*k;
   return .5*(
    2*p1
    +(-p0+p2)*k
    +(2*p0-5*p1+4*p2-p3)*k2
    +(-p0+3*p1-3*p2+p3)*k3
   );
  }

  function sample(list,t,c) {
   if (!Array.isArray(list) || !list.length) return null;
   if (t <= list[0][0]) return list[0][1];

   for (let i=1;i<list.length;i++) {
    const a = list[i-1];
    const b = list[i];

    if (t <= b[0]) {
     const span = b[0]-a[0];
     const k = span > 0 ? (t-a[0])/span : 1;

     if (c && c.ease === 'smooth' && list.length > 2) {
      const n = list.length;
      const loop = c.loop !== false;
      // くり返す動きは端の前後キーを反対側から、一回きりの動きは端のキーを使う
      const prev = i-2 >= 0 ? list[i-2][1] : loop ? list[n-2][1] : a[1];
      const next = i+1 < n ? list[i+1][1] : loop ? list[1][1] : b[1];
      return [0,1,2].map(j => catmull(prev[j],a[1][j],b[1][j],next[j],k));
     }

     return [0,1,2].map(j => a[1][j]+(b[1][j]-a[1][j])*k);
    }
   }

   return list[list.length-1][1];
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(layer,from,to,inclusive) {
   for (const [t,name] of clips[layer.id].events || []) {
    if ((inclusive ? t >= from : t > from) && t <= to) emit(name,layer.id);
   }
  }

  function advance(layer,step,withEvents) {
   const c = clips[layer.id];
   const dur = c.duration;
   let t = layer.time+step;

   layer.elapsed += step;

   if (withEvents) fire(layer,layer.time,Math.min(t,dur),layer.fresh);
   layer.fresh = false;

   if (t >= dur) {
    if (c.loop === false) {
     t = dur;
    } else {
     t = dur > 0 ? t % dur : 0;
     if (withEvents) fire(layer,0,t,true);
    }
   }

   layer.time = t;
  }

  function addLayer(layer,w,acc) {
   const c = clips[layer.id];
   if (!c || w <= 0) return;

   for (const [id,tr] of Object.entries(c.tracks || {})) {
    if (!parts[id]) continue;

    const a = acc[id] || (acc[id] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    const r = sample(tr.rotation,layer.time,c);
    const p = sample(tr.position,layer.time,c);
    const sc = sample(tr.scale,layer.time,c);

    for (let j=0;j<3;j++) {
     if (r) a.r[j] += r[j]*w;
     if (p) a.p[j] += p[j]*w;
     // 大きさは倍率（1=元の大きさ）。1からのずれを重みで混ぜる
     if (sc) a.s[j] += (sc[j]-1)*w;
    }
   }

   for (const sp of c.spins || []) {
    if (!parts[sp.part]) continue;

    const a = acc[sp.part] || (acc[sp.part] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    a.r['xyz'.indexOf(sp.axis)] += (sp.degPerSec*layer.elapsed % 360)*w;
   }
  }

  function apply() {
   const acc = {};
   const w = previous && fade > 0 ? Math.min(1,fadeTime/fade) : 1;

   if (current) addLayer(current,w,acc);
   if (previous) addLayer(previous,1-w,acc);

   for (const id of touched) {
    const o = parts[id];
    const base = rest[id];
    const a = acc[id] || {r:[0,0,0],p:[0,0,0],s:[0,0,0]};

    o.position.set(base.p.x+a.p[0],base.p.y+a.p[1],base.p.z+a.p[2]);
    o.rotation.set(
     base.r.x+a.r[0]*D,
     base.r.y+a.r[1]*D,
     base.r.z+a.r[2]*D,
     base.r.order
    );
    o.scale.set(
     base.s.x*Math.max(.001,1+a.s[0]),
     base.s.y*Math.max(.001,1+a.s[1]),
     base.s.z*Math.max(.001,1+a.s[2])
    );
   }

   // 効果部品は、それを使う動きの再生中だけ表示する（停止中は showEffects に従う）
   for (const [id,visible] of Object.entries(effects)) {
    const shown = current
     ? !!(uses[current.id]?.has(id) || previous && uses[previous.id]?.has(id))
     : showEffects;
    parts[id].visible = visible && shown;
   }
  }

  function play(id,{fade:f=.2,restart=false}={}) {
   if (!clips[id]) return false;
   if (current && current.id === id && !restart) return true;

   previous = current && f > 0 ? current : null;
   fade = f;
   fadeTime = 0;
   current = {id,time:0,elapsed:0,fresh:true};
   apply();
   return true;
  }

  function stop() {
   current = null;
   previous = null;
   apply();
  }

  // 指定した動きを時刻 t の姿勢で止めて表示する（前の動きのフェードは消し、合図は発火しない）
  function seek(id,t) {
   const c = clips[id];
   if (!c) return false;

   const time = Math.min(c.duration,Math.max(0,Number(t) || 0));

   current = {id,time,elapsed:time,fresh:false};
   previous = null;
   fade = 0;
   fadeTime = 0;
   apply();
   return true;
  }

  function update(dt,{speed=1}={}) {
   if (!current) return;

   const step = Math.max(0,dt)*speed;
   advance(current,step,true);

   if (previous) {
    advance(previous,step,false);
    fadeTime += Math.max(0,dt);
    if (fadeTime >= fade) previous = null;
   }

   apply();
  }

  function on(name,fn) {
   (handlers[name] ??= []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.entries(clips).map(([id,c]) => ({
    id,
    name: c.name || id,
    duration: c.duration,
    loop: c.loop !== false
   }));
  }

  // 作った直後に、効果部品の表示を停止中の状態へそろえる
  apply();

  return {
   play,
   stop,
   seek,
   update,
   on,
   list,
   get playing() {
    return current ? current.id : null;
   }
  };
 }

 // 移動の速さから待機・歩く・走る（乗り物は走行）を選ぶ。アプリの「試してみる」とゲームで共通の判定。
 function pickLocomotion(clips,speed,{walkSpeed=1.2,runSpeed=4}={}) {
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  // 乗り物: 動いていれば走行（車輪の回転は速さに比例）、止まっていれば停止
  if (has('drive') && !has('walk') && !has('run')) {
   return v > .05
    ? {id:'drive',rate:Math.min(5,Math.max(.1,v/walkSpeed))}
    : {id:first('idle'),rate:1};
  }

  if (v < .05) return {id:first('idle'),rate:1};

  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }

  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。setSpeed で移動系を自動選択し、action の一回きりの動きが終わると移動系へ戻る。
 function createController(animator,spec,opts={}) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;
  // play で指定した、続けて再生する動き（null のときは速さで自動選択）
  let hold = null;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
   hold = null;
  }

  // くり返しの動き（炎を吹いて飛ぶ fly など）を続けて再生する。null で自動の切り替えに戻す
  function play(id,{fade=.2}={}) {
   if (id === null || id === undefined) {
    hold = null;
    loco = undefined;
    return true;
   }

   if (dead || !clips[id]) return false;

   hold = id;
   oneShot = null;
   loco = id;
   animator.play(id,{fade});
   return true;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id,{fade=.12}={}) {
   if (dead || !clips[id]) return false;

   animator.play(id,{fade,restart:true});
   oneShot = {id,left:clips[id].duration};
   loco = undefined;
   if (id === 'die') dead = true;

   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);

   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }

   const next = hold ? {id:hold,rate:1} : pickLocomotion(clips,speed,opts);

   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{fade:.2});
    else animator.stop();
   }

   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,
   action,
   play,
   update,
   reset,
   get current() {
    return oneShot ? oneShot.id : loco || null;
   },
   get dead() {
    return dead;
   }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.action('attack'); 毎フレーム hero.update(dt);
 function createCharacter(spec,opts={}) {
  const object = buildModel(spec);
  const animator = createAnimator(object,spec);
  const controller = createController(animator,spec,opts);
  const disposeModel = dispose;

  return {
   object,
   animator,
   setSpeed: controller.setSpeed,
   action: controller.action,
   play: controller.play,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() {
    return controller.current;
   },
   dispose() {
    animator.stop();
    if (object.parent) object.parent.remove(object);
    disposeModel(object);
   }
  };
 }

 function getAnchor(root,id) {
  return root.userData.anchors[id] || null;
 }

 return {
  buildGeometry,
  buildMaterial,
  updateMaterial,
  transform,
  buildPart,
  buildModel,
  getAnchor,
  createAnimator,
  pickLocomotion,
  createController,
  createCharacter,
  dispose
 };
}

// ============================================================
// 9. Three.js Scene
// 1本指: 回転 / 2本指: パンとズーム
// PC: 左ドラッグ回転 / 右ドラッグまたはShiftでパン / Wheelズーム
// ============================================================

function initScene() {
 if (!window.THREE) {
  $('renderMessage').textContent =
   '3D表示の仕組みを読み込めませんでした。インターネットにつないで再読み込みしてください。データの編集・保存・書き出しは使えます。';
  $('renderMessage').style.display = 'block';
  return;
 }

 try {
  state.engine = createModelRenderer(THREE);

  const renderer = new THREE.WebGLRenderer({
   antialias: true,
   alpha: false
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  $('viewport').prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42,1,.01,10000);

  const grid = new THREE.GridHelper(
   20,40,0x526f82,0x334654
  );

  const ground = new THREE.Mesh(
   new THREE.PlaneGeometry(1,1),
   new THREE.MeshStandardMaterial({
    color: 0x202936,
    roughness: .9
   })
  );

  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;

  scene.add(
   grid,
   ground,
   new THREE.HemisphereLight(0xbce5ff,0x4d4e5d,.9)
  );

  const key = new THREE.DirectionalLight(0xfff2dc,1.5);
  key.position.set(4,8,5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024,1024);
  key.shadow.bias = -.0003;
  key.shadow.normalBias = .025;
  scene.add(key,key.target);

  const rim = new THREE.DirectionalLight(0x73bfff,1.1);
  rim.position.set(-4,3,-5);
  scene.add(rim);

  state.runtime = {
   renderer,
   scene,
   camera,
   grid,
   ground,
   key,
   rim,
   root: null,
   anchorLayer: new THREE.Group(),
   highlight: null,
   target: new THREE.Vector3(),
   radius: 7,
   theta: .65,
   phi: 1.12,
   pointers: new Map(),
   dragStart: null,
   needsRender: true,
   frame: 0,
   contextLost: false
  };

  scene.add(state.runtime.anchorLayer);

  bindOrbit(renderer.domElement);
  new ResizeObserver(resizeView).observe($('viewport'));

  renderer.domElement.addEventListener('webglcontextlost',e => {
   e.preventDefault();
   state.runtime.contextLost = true;
   $('renderMessage').textContent =
    '3D描画が停止しました。データを保存して再読み込みしてください。';
   $('renderMessage').style.display = 'block';
  });

  resizeView();
  renderLoop();
 } catch (e) {
  $('renderMessage').textContent = '3D初期化に失敗しました: '+e.message;
  $('renderMessage').style.display = 'block';
  state.runtime = null;
 }
}

function resizeView() {
 const r = state.runtime;
 if (!r) return;

 const w = $('viewport').clientWidth;
 const h = $('viewport').clientHeight;

 r.renderer.setSize(w,h);
 r.camera.aspect = w/h;
 r.camera.updateProjectionMatrix();
 invalidate();
}

function invalidate() {
 if (state.runtime) state.runtime.needsRender = true;
}

function renderLoop() {
 const r = state.runtime;
 if (!r) return;

 r.frame = requestAnimationFrame(renderLoop);

 const now = performance.now();
 const dt = Math.min(.1,(now-(r.lastTime || now))/1000);
 r.lastTime = now;

 // 再生中・試し中だけ毎フレーム描き直す（停止中は変化があったときだけ）
 const m = state.motion;

 if (m.animator && !document.hidden && !r.contextLost) {
  if (m.trying && m.tester) {
   if (m.walk) updateWalk(dt);
   m.tester.update(dt);
   r.needsRender = true;
  } else if (m.playing) {
   m.animator.update(dt,{speed:m.speed});
   r.needsRender = true;
  }
 }

 if (!r.needsRender || document.hidden || r.contextLost) return;

 r.needsRender = false;

 r.camera.position.set(
  r.target.x+r.radius*Math.sin(r.phi)*Math.sin(r.theta),
  r.target.y+r.radius*Math.cos(r.phi),
  r.target.z+r.radius*Math.sin(r.phi)*Math.cos(r.theta)
 );
 r.camera.lookAt(r.target);

 r.scene.updateMatrixWorld(true);
 updateMarkers();

 if (r.highlight) r.highlight.update();

 r.renderer.render(r.scene,r.camera);
}

function bindOrbit(canvas) {
 canvas.addEventListener('pointerdown',e => {
  const r = state.runtime;
  canvas.setPointerCapture(e.pointerId);
  r.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  r.dragStart = r.pointers.size === 1
   ? {x:e.clientX,y:e.clientY,moved:false}
   : null;

  if (r.pointers.size === 1) {
   // 選択中の部品に当たったら、視点の回転ではなく部品のドラッグ移動を始める
   if (e.button === 0) startPartDrag(e);
  } else if (r.partDrag) {
   // 2本目の指が触れたら、ここまでの移動を確定してパン・ズームに任せる
   endPartDrag();
  }
 });

 canvas.addEventListener('pointermove',e => {
  const r = state.runtime;
  if (!r.pointers.has(e.pointerId)) return;

  const before = [...r.pointers.values()];
  const old = r.pointers.get(e.pointerId);
  const dx = e.clientX-old.x;
  const dy = e.clientY-old.y;

  r.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if (
   r.dragStart
   && Math.hypot(e.clientX-r.dragStart.x,e.clientY-r.dragStart.y) > 5
  ) {
   r.dragStart.moved = true;
  }

  const pd = r.partDrag;

  if (pd && pd.pointerId === e.pointerId && r.pointers.size === 1) {
   pd.last = {x:e.clientX,y:e.clientY,shift:e.shiftKey,alt:e.altKey};
   // 5px以上動いてから反映する（それ未満で離せばタップとして扱う）
   if (r.dragStart?.moved) queuePartDrag();
   return;
  }

  if (r.pointers.size === 1) {
   if (e.buttons === 2 || e.shiftKey) {
    panCamera(dx,dy);
   } else {
    r.theta -= dx*.008;
    r.phi = Math.max(.04,Math.min(Math.PI-.04,r.phi+dy*.008));
   }
  } else {
   const after = [...r.pointers.values()];
   const dist = a => Math.hypot(
    a[0].x-a[1].x,
    a[0].y-a[1].y
   );

   r.radius = Math.max(
    .02,
    Math.min(100000,r.radius*dist(before)/Math.max(1,dist(after)))
   );

   panCamera(dx/2,dy/2);
  }

  invalidate();
 });

 function end(e) {
  const r = state.runtime;

  if (r.partDrag && r.partDrag.pointerId === e.pointerId) endPartDrag();

  if (
   e.type === 'pointerup'
   && r.dragStart
   && !r.dragStart.moved
   && r.pointers.size === 1
  ) {
   pickObject(e);
  }

  r.pointers.delete(e.pointerId);
  r.dragStart = null;
 }

 canvas.addEventListener('pointerup',end);
 canvas.addEventListener('pointercancel',end);
 canvas.addEventListener('lostpointercapture',end);
 canvas.addEventListener('contextmenu',e => e.preventDefault());

 canvas.addEventListener('wheel',e => {
  e.preventDefault();
  const r = state.runtime;

  r.radius = Math.max(
   .02,
   Math.min(
    100000,
    r.radius*Math.exp(Math.max(-200,Math.min(200,e.deltaY))*.002)
   )
  );

  invalidate();
 },{passive:false});
}

// ------------------------------------------------------------
// 3D画面で選択中の部品をドラッグして動かす
// ------------------------------------------------------------

function canPartDrag() {
 const m = state.motion;

 return state.activeTab === 'parts'
  && state.dragMove
  && !!state.selectedPartId
  && !state.selectedAnchorId
  && own(state.modelSpec.parts,state.selectedPartId)
  && !m.walk
  && !m.assignRole
  && !m.edit
  && !!state.runtime?.root;
}

function pointerRay(p) {
 const r = state.runtime;
 const rect = r.renderer.domElement.getBoundingClientRect();
 const ray = new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(
   (p.x-rect.left)/rect.width*2-1,
   -(p.y-rect.top)/rect.height*2+1
  ),
  r.camera
 );

 return ray;
}

function partDragPlane(mode,base) {
 if (mode === 'vertical') {
  const n = new THREE.Vector3();
  state.runtime.camera.getWorldDirection(n);
  n.y = 0;
  if (n.lengthSq() < 1e-8) n.set(0,0,1);
  return new THREE.Plane().setFromNormalAndCoplanarPoint(n.normalize(),base);
 }

 return new THREE.Plane().setFromNormalAndCoplanarPoint(new THREE.Vector3(0,1,0),base);
}

// 現在のポインタ位置とモードで、移動の基準（開始位置・面・交点）を取り直す
function rebasePartDrag(d) {
 const r = state.runtime;
 const o = r.root.userData.parts[d.id];
 if (!o) return false;

 const mode = state.dragMode === 'vertical' || d.last.shift ? 'vertical' : 'horizontal';

 r.root.updateMatrixWorld(true);

 const base = o.getWorldPosition(new THREE.Vector3());
 const plane = partDragPlane(mode,base);
 const hit = pointerRay(d.last).ray.intersectPlane(plane,new THREE.Vector3());

 if (!hit) {
  d.mode = null;
  return false;
 }

 Object.assign(d,{mode,base,plane,startHit:hit});
 return true;
}

function startPartDrag(e) {
 try {
  if (!canPartDrag()) return;

  const r = state.runtime;
  const id = state.selectedPartId;
  const o = r.root.userData.parts[id];
  if (!o) return;

  const p = {x:e.clientX,y:e.clientY,shift:e.shiftKey,alt:e.altKey};

  const hit = pointerRay(p).intersectObjects([r.anchorLayer,r.root],true).find(h => {
   let yes = h.object.visible;
   h.object.traverseAncestors(a => {
    yes = yes && a.visible;
   });
   return yes;
  });
  if (!hit) return;

  // 当たったのが選択中の部品か、その子孫のときだけ動かす
  let n = hit.object;
  while (n && n !== o) n = n.parent;
  if (!n) return;

  // かんたん調整などの未確定の連続操作を先に確定して、履歴を分ける
  clearTimeout(state.nudgeTimer);
  finishLive();

  const d = {
   pointerId: e.pointerId,
   id,
   last: p,
   mode: null,
   base: null,
   plane: null,
   startHit: null,
   raf: 0,
   changed: false,
   limit: modelSpan()*10,
   // 吸着の刻み（ドラッグ開始時のかんたん調整の刻み）
   step: nudgeStepSize()
  };

  rebasePartDrag(d);
  r.partDrag = d;
  r.renderer.domElement.style.cursor = 'grabbing';
 } catch (_) {
  if (state.runtime) state.runtime.partDrag = null;
 }
}

function queuePartDrag() {
 const d = state.runtime?.partDrag;
 if (!d || d.raf) return;

 d.raf = requestAnimationFrame(() => {
  d.raf = 0;
  if (state.runtime?.partDrag === d) applyPartDrag(d);
 });
}

function applyPartDrag(d) {
 const r = state.runtime;
 const o = r?.root?.userData.parts[d.id];
 if (!o || !own(state.modelSpec.parts,d.id) || !d.last) return;

 const mode = state.dragMode === 'vertical' || d.last.shift ? 'vertical' : 'horizontal';

 // モードが変わったら（Shift の押し始め・離しなど）、その時点を新しい基準にする
 if (mode !== d.mode) {
  rebasePartDrag(d);
  return;
 }

 const hit = pointerRay(d.last).ray.intersectPlane(d.plane,new THREE.Vector3());
 if (!hit) return;

 const delta = hit.sub(d.startHit);

 if (mode === 'vertical') delta.set(0,delta.y,0);
 else delta.y = 0;

 // 視線が面とほぼ平行なときに遠くへ飛ばないよう、移動量を制限する
 if (delta.length() > d.limit) delta.setLength(d.limit);

 const local = o.parent.worldToLocal(d.base.clone().add(delta));

 // 方眼に吸着: 水平は X・Z、上下は Y だけを刻みの倍数に丸める（Alt 押下中は吸着しない）
 const snapStep = state.dragSnap && !d.last.alt && d.step > 0 ? d.step : 0;

 const pos = local.toArray().map((v,i) => {
  const snapThis = snapStep > 0 && (mode === 'vertical' ? i === 1 : i !== 1);
  const snapped = snapThis ? Math.round(v/snapStep)*snapStep : v;
  return Math.round(snapped*10000)/10000 || 0;
 });
 const cur = state.modelSpec.parts[d.id].position;

 if (pos.every((v,i) => v === cur[i])) return;

 try {
  editDirect('parts',d.id,'position',pos,null,true);
  d.changed = true;
 } catch (_) {}

 invalidate();
}

function endPartDrag() {
 const r = state.runtime;
 const d = r?.partDrag;
 if (!d) return;

 // 反映待ちの移動があれば、確定の前に当てる
 if (d.raf) {
  cancelAnimationFrame(d.raf);
  d.raf = 0;
  applyPartDrag(d);
 }

 r.partDrag = null;
 r.renderer.domElement.style.cursor = '';

 if (d.changed) {
  finishLive();
  renderPanel();
 }

 invalidate();
}

function saveDragPrefs() {
 try {
  localStorage.setItem(DRAG_KEY,JSON.stringify({
   on: state.dragMove,
   mode: state.dragMode,
   snap: state.dragSnap
  }));
 } catch (_) {}
}

function dragMoveControls() {
 const chip = (mode,label) => `
  <button
   data-dragmode="${mode}"
   class="${state.dragMode === mode ? 'selected' : ''}"
   aria-pressed="${state.dragMode === mode}"
  >${label}</button>
 `;

 return `
  <div class="nudge">
   <label>
    <input type="checkbox" id="dragMove" ${state.dragMove ? 'checked' : ''}>
    3D画面でドラッグして動かす
   </label>
   <div class="chips">
    ${chip('horizontal','水平に動かす')}
    ${chip('vertical','上下に動かす')}
   </div>
   <label>
    <input type="checkbox" id="dragSnap" ${state.dragSnap ? 'checked' : ''}>
    方眼に吸着（かんたん調整の刻み）
   </label>
   <p class="hint">
    選んだ部品を3D画面でドラッグすると動かせます（何もない所をドラッグすると視点が回ります）。
    PCでは Shift を押しながらドラッグすると上下に、Alt を押している間は吸着せずに動かせます。
   </p>
  </div>
 `;
}

function panCamera(dx,dy) {
 const r = state.runtime;
 const amount = r.radius*1.1/$('viewport').clientHeight;

 const right = new THREE.Vector3().setFromMatrixColumn(r.camera.matrix,0);
 const up = new THREE.Vector3().setFromMatrixColumn(r.camera.matrix,1);

 r.target.addScaledVector(right,-dx*amount).addScaledVector(up,dy*amount);
}

function fitCamera() {
 const r = state.runtime;
 if (!r || !r.root) return;

 const box = new THREE.Box3().setFromObject(r.root);

 if (box.isEmpty()) {
  box.set(
   new THREE.Vector3(-1,0,-1),
   new THREE.Vector3(1,2,1)
  );
 }

 const size = box.getSize(new THREE.Vector3());
 const span = Math.max(size.x,size.y,size.z,.1);

 box.getCenter(r.target);

 const fov = r.camera.fov*Math.PI/180;
 const fitFov = Math.min(
  fov,
  2*Math.atan(Math.tan(fov/2)*r.camera.aspect)
 );

 r.radius = span*.65/Math.tan(fitFov/2);
 r.theta = .65;
 r.phi = 1.13;

 r.camera.near = Math.max(.001,span/1000);
 r.camera.far = Math.max(1000,span*1000);
 r.camera.updateProjectionMatrix();

 invalidate();
}

// 効果部品（炎・煙など）を除いた、モデル本体の範囲（接地や地面チェックに使う）
function solidBox(root,spec) {
 const fx = new Set(
  Object.values(spec.parts || {}).filter(p => p.effect === true).map(p => p.id)
 );

 if (!fx.size) return new THREE.Box3().setFromObject(root);

 root.updateMatrixWorld(true);

 const box = new THREE.Box3();

 root.traverse(o => {
  if (!o.isMesh) return;
  for (let n = o; n && n !== root; n = n.parent) {
   if (fx.has(n.userData.partId)) return;
  }
  box.expandByObject(o);
 });

 return box.isEmpty() ? new THREE.Box3().setFromObject(root) : box;
}

function updateStage() {
 const r = state.runtime;
 if (!r) return;

 const box = solidBox(r.root,state.modelSpec);
 const size = box.isEmpty()
  ? new THREE.Vector3(2,2,2)
  : box.getSize(new THREE.Vector3());

 const span = Math.max(size.x,size.y,size.z,1);
 const center = box.isEmpty()
  ? new THREE.Vector3()
  : box.getCenter(new THREE.Vector3());

 r.ground.scale.set(span*15,span*15,1);
 r.ground.position.set(
  center.x,
  box.isEmpty() ? -.015 : box.min.y-.015,
  center.z
 );

 r.grid.position.copy(r.ground.position);
 r.grid.position.y += .005;
 r.grid.scale.setScalar(span/4);

 r.key.position.copy(center).add(new THREE.Vector3(span,span*2,span));
 r.key.target.position.copy(center);

 Object.assign(r.key.shadow.camera,{
  left: -span*1.5,
  right: span*1.5,
  top: span*1.5,
  bottom: -span*1.5,
  near: .01,
  far: span*8
 });

 r.key.shadow.camera.updateProjectionMatrix();
 r.key.shadow.normalBias = span*.003;

 setPreviewMode();
}

function setPreviewMode() {
 const r = state.runtime;
 if (!r) return;

 const studio = state.previewMode === 'studio';

 r.scene.background = new THREE.Color(
  studio ? '#171d27' : state.background
 );
 r.grid.visible = !studio && state.showGrid;
 r.ground.visible = true;

 r.key.intensity = studio ? 1.7 : 1.35;
 r.rim.intensity = studio ? 1.25 : .75;
 r.key.shadow.radius = studio ? 4 : 1;

 $('studioBtn').textContent = studio ? '編集表示に戻る' : '仕上がり確認';
 $('gridBtn').textContent = '方眼 '+(state.showGrid ? '✓' : '−');
 $('anchorBtn').textContent = '取付点 '+(state.showAnchors ? '✓' : '−');

 invalidate();
}

function calculateStats(root) {
 const st = {
  parts: Object.keys(state.modelSpec.parts).length,
  objects: 0,
  materials: Object.keys(state.modelSpec.materials).length,
  vertices: 0,
  triangles: 0
 };

 if (root) {
  root.traverse(o => {
   st.objects++;

   if (o.isMesh) {
    st.vertices += o.geometry.attributes.position.count;
    st.triangles += (
     o.geometry.index
      ? o.geometry.index.count
      : o.geometry.attributes.position.count
    )/3;
   }
  });
 }

 return st;
}

function clearHighlight(r) {
 if (!r || !r.highlight) return;

 // r128のBoxHelperにはdispose()が無いため、形状と素材を個別に破棄する
 r.scene.remove(r.highlight);
 r.highlight.geometry?.dispose();
 r.highlight.material?.dispose();
 r.highlight = null;
}

function rebuildScene(candidate) {
 const r = state.runtime;
 if (!r) return;

 // モデルを作り直すときは試遊を終える（入力・UI・位置の後片付け）
 endWalk();

 clearHighlight(r);

 const old = r.root;
 r.root = candidate || state.engine.buildModel(state.modelSpec);
 r.scene.add(r.root);

 if (old) {
  r.scene.remove(old);
  state.engine.dispose(old);
 }

 // 動きは新しいモデルに合わせて作り直し、停止状態から始める
 resetAnimator();

 buildMarkers();
 updateStage();
 updateHighlight();
 invalidate();
}

// ============================================================
// 10. Selection
// 補助表示はModelSpec/ゲーム向けRendererに混入させない。
// ============================================================

function buildMarkers() {
 const r = state.runtime;

 state.engine.dispose(r.anchorLayer);
 r.anchorLayer.clear();

 for (const id of Object.keys(state.modelSpec.anchors)) {
  const m = new THREE.Mesh(
   new THREE.SphereGeometry(1,8,6),
   new THREE.MeshBasicMaterial({
    color: 0xffc66f,
    depthTest: false
   })
  );

  m.userData.anchorId = id;
  m.renderOrder = 20;
  r.anchorLayer.add(m);
 }
}

function updateMarkers() {
 const r = state.runtime;
 r.anchorLayer.visible = state.showAnchors && !easy();

 for (const m of r.anchorLayer.children) {
  const a = r.root.userData.anchors[m.userData.anchorId];
  a.getWorldPosition(m.position);

  let visible = true;
  a.traverseAncestors(o => {
   if (!o.visible) visible = false;
  });

  m.visible = visible;

  m.scale.setScalar(
   r.radius*(state.selectedAnchorId === m.userData.anchorId ? .017 : .01)
  );

  m.material.color.set(
   state.selectedAnchorId === m.userData.anchorId ? 0x65e8ff : 0xffc66f
  );
 }
}

function updateHighlight() {
 const r = state.runtime;
 if (!r) return;

 clearHighlight(r);

 const o = r.root?.userData.parts[state.selectedPartId];

 if (o) {
  r.highlight = new THREE.BoxHelper(o,0x64ddff);
  r.highlight.material.depthTest = false;
  r.highlight.renderOrder = 10;
  r.scene.add(r.highlight);
 }

 invalidate();
}

function selectPart(id) {
 state.selectedPartId = id;
 state.selectedAnchorId = null;
 state.activeTab = 'parts';
 updateHighlight();
 renderPanel();
}

function selectAnchor(id) {
 state.selectedAnchorId = id;
 state.selectedPartId = null;
 state.activeTab = 'parts';
 updateHighlight();
 renderPanel();
}

function pickObject(e) {
 // 試遊中は3D画面のタップで部品を選ばない
 if (state.motion.walk) return;

 const r = state.runtime;
 const rect = r.renderer.domElement.getBoundingClientRect();
 const ray = new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(
   (e.clientX-rect.left)/rect.width*2-1,
   -(e.clientY-rect.top)/rect.height*2+1
  ),
  r.camera
 );

 const hits = ray.intersectObjects([r.anchorLayer,r.root],true).filter(h => {
  let yes = h.object.visible;
  h.object.traverseAncestors(o => {
   yes = yes && o.visible;
  });
  return yes;
 });

 // 部位の割り当て中・手で直す編集中は、部品タブへ移動せずに部品を選ぶ
 const mm = state.motion;

 if (mm.assignRole || mm.edit) {
  const partHit = hits.find(h => h.object.userData.partId);
  if (partHit) handleMotionPick(partHit.object.userData.partId);
  return;
 }

 const anchor = hits.find(h => h.object.userData.anchorId);

 if (anchor) {
  selectAnchor(anchor.object.userData.anchorId);
  scrollToInspector();
  return;
 }

 const hit = hits.find(h => h.object.userData.partId);

 if (hit) {
  selectPart(hit.object.userData.partId);
  scrollToInspector();
 }
}

// スクロールの動きは端末の「動きを減らす」設定に従う
function viewScrollBehavior() {
 return window.matchMedia('(prefers-reduced-motion: reduce)').matches
  ? 'auto'
  : 'smooth';
}

// 再生・試遊・部位割り当ての結果を、非固定時だけ画面内へ戻す
function scrollToPreview(stillNeeded=() => true) {
 requestAnimationFrame(() => {
  if (state.pinViewport || !stillNeeded() || !$('modal').hidden) return;

  const view = $('viewport');
  if (!view) return;

  const rect = view.getBoundingClientRect();
  const visual = window.visualViewport;
  const top = visual?.offsetTop || 0;
  const bottom = Math.min(
   top+(visual?.height || window.innerHeight),
   document.querySelector('nav').getBoundingClientRect().top
  );

  if (rect.top >= top && rect.bottom <= bottom) return;

  window.scrollTo({
   top: Math.max(0,window.scrollY+rect.top-top),
   behavior: viewScrollBehavior()
  });
 });
}

// 固定時はパネルだけを動かし、ページ全体へのスクロール伝播を避ける
function scrollPanelTargetIntoView(target) {
 if (!target) return;

 const panel = $('panel');
 const rect = target.getBoundingClientRect();
 const behavior = viewScrollBehavior();

 if (state.pinViewport) {
  const panelRect = panel.getBoundingClientRect();
  panel.scrollTo({
   top: Math.max(0,panel.scrollTop+rect.top-panelRect.top-panel.clientTop-12),
   behavior
  });
 } else {
  const visualTop = window.visualViewport?.offsetTop || 0;
  const menuBottom = $('viewTools').getBoundingClientRect().bottom;
  const top = Math.max(visualTop+12,menuBottom+12);

  window.scrollTo({
   top: Math.max(0,window.scrollY+rect.top-top),
   behavior
  });
 }
}

// 3Dで選んだ部品の設定見出しへ移動する
function scrollToInspector() {
 requestAnimationFrame(() => {
  scrollPanelTargetIntoView($('inspectorHeading'));
 });
}

// ============================================================
// 10.5 Motion（動き）
// 部品を回す・動かすだけの軽いモーション。ボーンやスキンは使わない。
// ============================================================

const MOTION_KINDS = {
 biped: {
  label: '二足（人・ロボットなど）',
  clips: '待機・歩く・走る・ジャンプ・攻撃・やられ・倒れる・喜ぶ',
  roles: ['body','head','armL','armR','legL','legR']
 },
 quad: {
  label: '四足（馬・犬・猫など）',
  clips: '待機・歩く・走る・ジャンプ・攻撃・やられ・倒れる・喜ぶ',
  roles: ['body','head','tail','legFL','legFR','legBL','legBR']
 },
 vehicle: {
  label: '乗り物（車・バイクなど）',
  clips: '走行・旋回・跳ねる',
  roles: ['body','wheelFL','wheelFR','wheelBL','wheelBR','steer']
 },
 flyer: {
  label: '飛ぶもの（鳥・ドラゴンなど）',
  clips: '待機・飛ぶ・速く飛ぶ・ジャンプ・攻撃・やられ・倒れる・喜ぶ',
  roles: ['body','head','wingL','wingR','tail']
 }
};

const ROLE_RE = {
 body: /body|torso|chassis|hull|barrel|trunk|胴|車体|ボディ/,
 head: /head|skull|頭/,
 tail: /tail|尾|しっぽ/,
 arm: /arm|shoulder|腕/,
 leg: /leg|thigh|脚|足/,
 wheel: /wheel|tire|tyre|車輪|タイヤ/,
 steer: /steer|handle|fork|ハンドル/,
 wing: /wing|翼|羽/
};

const ROLE_INFO = {
 body: {label:'胴（体）',re:ROLE_RE.body},
 head: {label:'頭',re:ROLE_RE.head},
 tail: {label:'尾',re:ROLE_RE.tail},
 armL: {label:'左腕',re:ROLE_RE.arm,side:'L'},
 armR: {label:'右腕',re:ROLE_RE.arm,side:'R'},
 legL: {label:'左脚',re:ROLE_RE.leg,side:'L'},
 legR: {label:'右脚',re:ROLE_RE.leg,side:'R'},
 legFL: {label:'左前脚',re:ROLE_RE.leg,side:'L',end:'F'},
 legFR: {label:'右前脚',re:ROLE_RE.leg,side:'R',end:'F'},
 legBL: {label:'左後脚',re:ROLE_RE.leg,side:'L',end:'B'},
 legBR: {label:'右後脚',re:ROLE_RE.leg,side:'R',end:'B'},
 wheelFL: {label:'左前輪',re:ROLE_RE.wheel,side:'L',end:'F'},
 wheelFR: {label:'右前輪',re:ROLE_RE.wheel,side:'R',end:'F'},
 wheelBL: {label:'左後輪',re:ROLE_RE.wheel,side:'L',end:'B'},
 wheelBR: {label:'右後輪',re:ROLE_RE.wheel,side:'R',end:'B'},
 steer: {label:'前輪の向きを変える部品（ハンドル）',re:ROLE_RE.steer},
 wingL: {label:'左の翼',re:ROLE_RE.wing,side:'L'},
 wingR: {label:'右の翼',re:ROLE_RE.wing,side:'R'}
};

function stopMotion() {
 const m = state.motion;

 // 停止・部品の編集などでは試遊も終える（後片付けだけを行い、再帰しない）
 if (m.walk) endWalk();

 // 手で直す編集中なら、直接当てた姿勢を戻して編集を終える
 if (m.edit) endEdit();

 m.animator?.stop();
 m.playing = null;
 m.trying = false;
 m.tester?.reset();
 invalidate();
}

function resetAnimator() {
 const r = state.runtime;
 const m = state.motion;

 m.playing = null;
 m.animator = r?.root && state.engine
  ? state.engine.createAnimator(r.root,state.modelSpec,{showEffects:true})
  : null;

 m.animator?.on('*',e => toast('合図「'+e.event+'」'));

 // 「試してみる」はゲームと同じ切り替え役（createController）を使う
 m.trying = false;
 m.tester = m.animator
  ? state.engine.createController(m.animator,state.modelSpec)
  : null;

 // 手で直す編集中なら、新しいモデルでも同じ時刻の姿勢を表示し直す
 refreshEdit();
}

function playMotion(id) {
 const m = state.motion;

 // 試遊中に通常の再生へ切り替えたら、試遊の入力・UI・位置を元に戻す
 if (m.walk) endWalk();

 // 手で直す編集中なら、編集を終えてから再生する
 if (m.edit) endEdit();

 if (m.playing === id) {
  stopMotion();
 } else {
  assert(m.animator,'3D表示が使えないため、動きを再生できません');
  m.trying = false;
  assert(
   m.animator.play(id,{fade:m.playing ? .25 : 0}),
   '動きが見つかりません: '+id
  );
  m.playing = id;
  invalidate();
  scrollToPreview(() => state.motion.playing === id);
 }

 renderPanel();
}

function pruneAnimations(s,ids) {
 for (const a of Object.values(s.animations || {})) {
  ids.forEach(id => {
   if (a.tracks) delete a.tracks[id];
  });
  if (a.spins) a.spins = a.spins.filter(sp => !ids.includes(sp.part));
  if (a.show) a.show = a.show.filter(pid => !ids.includes(pid));
 }
}

function partDepth(s,id) {
 let depth = 0;
 let parent = s.parts[id].parent;

 while (parent) {
  depth++;
  parent = s.parts[parent]?.parent;
 }

 return depth;
}

function partTraits(p) {
 const text = (p.id+' '+p.name).toLowerCase();
 const tokens = text.split(/[^a-z0-9]+/).filter(Boolean);
 const has = (...list) => list.some(x => tokens.includes(x));
 let side = null;
 let end = null;

 if (has('fl','lf')) {
  side = 'L';
  end = 'F';
 } else if (has('fr','rf')) {
  side = 'R';
  end = 'F';
 } else if (has('hl','bl','rl','lh','lb')) {
  side = 'L';
  end = 'B';
 } else if (has('hr','br','rr','rh','rb')) {
  side = 'R';
  end = 'B';
 }

 if (!side) {
  if (has('l','left') || /左/.test(text)) side = 'L';
  else if (has('r','right') || /右/.test(text)) side = 'R';
 }

 if (!end) {
  if (has('front','fore','f') || /前/.test(text)) end = 'F';
  else if (has('rear','back','hind','b','h') || /後/.test(text)) end = 'B';
 }

 return {text,side,end};
}

// 部品の名前・IDから役割を推測する（関節グループ・上の階層を優先）
function guessRoles(kind) {
 const s = state.modelSpec;
 const all = Object.values(s.parts);
 const info = all.map(p => ({p,...partTraits(p),depth:partDepth(s,p.id)}));
 const used = new Set();
 const result = {};

 for (const role of MOTION_KINDS[kind].roles) {
  const want = ROLE_INFO[role];
  let best = null;
  let bestScore = -Infinity;

  for (const c of info) {
   if (used.has(c.p.id) || !want.re.test(c.text)) continue;

   // 座標規約: +X がモデルから見て左。中央（x≈0）の部品は左右を決めない
   const x = c.p.position[0];
   const side = c.side || (x > 1e-4 ? 'L' : x < -1e-4 ? 'R' : null);
   const end = c.end || (c.p.position[2] >= 0 ? 'F' : 'B');

   if (want.side && side !== want.side) continue;
   if (want.end && end !== want.end) continue;

   const score = (c.p.type === 'group' ? 3 : 0)
    + (/joint|関節/.test(c.text) ? 4 : 0)
    - c.depth*2;

   if (score > bestScore) {
    best = c.p.id;
    bestScore = score;
   }
  }

  if (best) {
   result[role] = best;
   used.add(best);
  }
 }

 // 胴が全体をまとめていない（例: 胴が複数部品に分かれている）ときはモデル全体を揺らす
 if (MOTION_KINDS[kind].roles.includes('body')) {
  const b = result.body;
  if (!b || (kind !== 'vehicle' && descendants(b,s).length < all.length*.5)) {
   result.body = '*';
  }
 }

 return result;
}

function guessKind() {
 const text = Object.values(state.modelSpec.parts)
  .map(p => (p.id+' '+p.name).toLowerCase())
  .join(' ');

 if (ROLE_RE.wheel.test(text)) return 'vehicle';
 if (ROLE_RE.wing.test(text) || /rotor|propeller|プロペラ/.test(text)) return 'flyer';

 const q = guessRoles('quad');
 return ['legFL','legFR','legBL','legBR'].filter(r => q[r]).length >= 3 ? 'quad' : 'biped';
}

function ensureMotionRoles() {
 const m = state.motion;
 const s = state.modelSpec;

 if (m.kindFor !== s.meta.id) {
  m.kind = guessKind();
  m.kindFor = s.meta.id;
  m.roleKey = null;
  m.picks = defaultPicks(m.kind);
 }

 const key = m.kind+'|'+Object.keys(s.parts).join(',');

 if (m.roleKey !== key) {
  m.roles = guessRoles(m.kind);
  m.roleKey = key;
 }
}

function modelHeight() {
 const r = state.runtime;
 if (!r?.root) return 1;

 const size = new THREE.Box3().setFromObject(r.root).getSize(new THREE.Vector3());
 return Math.max(.2,size.y || 1);
}

const cyc = p => Math.sin(p*Math.PI*2);
const hump = p => (1-Math.cos(p*Math.PI*2))/2;
const r3 = v => Math.round(v*1000)/1000;

function waveKeys(dur,fn,n=8) {
 const keys = [];
 for (let i=0;i<=n;i++) keys.push([r3(dur*i/n),fn(i/n).map(r3)]);
 return keys;
}

function poseKeys(dur,list) {
 return list.map(([ph,v]) => [r3(dur*ph),v.map(r3)]);
}

function addTrack(tracks,id,channel,keys) {
 if (!id || !keys) return;

 const t = tracks[id] ??= {};
 const old = t[channel];

 if (
  old
  && old.length === keys.length
  && old.every((k,i) => k[0] === keys[i][0])
 ) {
  t[channel] = old.map((k,i) => [k[0],k[1].map((v,j) => r3(v+keys[i][1][j]))]);
 } else {
  t[channel] = keys;
 }
}

// おまかせ自動生成。R は役割→部品ID（胴は'*'でモデル全体）
function buildMotionClips(kind,R,opt) {
 const s = state.modelSpec;
 const H = opt.height;
 const B = opt.bounce*H;
 const A = 28*opt.stride;
 const bodyAll = R.body === '*';
 const bodyIds = bodyAll
  ? Object.values(s.parts).filter(p => p.parent === null).map(p => p.id)
  : R.body ? [R.body] : [];
 const clips = {};

 const clip = (id,name,base,loop,build) => {
  const d = Math.max(.1,Math.round(base/opt.pace*100)/100);
  const c = {name,duration:d,loop,tracks:{}};

  const k = {
   rot: (pid,fn,n=8) => addTrack(c.tracks,pid,'rotation',waveKeys(d,fn,n)),
   pose: (pid,list) => addTrack(c.tracks,pid,'rotation',poseKeys(d,list)),
   bob: (fn,n=8) => bodyIds.forEach(pid =>
    addTrack(c.tracks,pid,'position',waveKeys(d,fn,n))
   ),
   move: list => bodyIds.forEach(pid =>
    addTrack(c.tracks,pid,'position',poseKeys(d,list))
   ),
   lean: (fn,n=8) => {
    if (!bodyAll) addTrack(c.tracks,R.body,'rotation',waveKeys(d,fn,n));
   },
   tilt: list => {
    if (!bodyAll) addTrack(c.tracks,R.body,'rotation',poseKeys(d,list));
   },
   spin: (pid,deg) => {
    if (pid) (c.spins ??= []).push({part:pid,axis:'x',degPerSec:r3(deg)});
   },
   hit: ph => {
    (c.events ??= []).push([r3(d*ph),'hit']);
   }
  };

  build(k);
  clips[id] = c;
 };

 if (kind === 'biped') {
  clip('idle','待機',2.4,true,k => {
   k.bob(p => [0,.012*B*hump(p),0]);
   k.rot(R.head,p => [3*cyc(p),0,0]);
   k.rot(R.armL,p => [0,0,3*cyc(p)]);
   k.rot(R.armR,p => [0,0,-3*cyc(p)]);
  });
  clip('walk','歩く',1,true,k => {
   k.rot(R.legL,p => [A*cyc(p),0,0]);
   k.rot(R.legR,p => [-A*cyc(p),0,0]);
   k.rot(R.armL,p => [-.8*A*cyc(p),0,0]);
   k.rot(R.armR,p => [.8*A*cyc(p),0,0]);
   k.bob(p => [0,.03*B*hump(p*2),0]);
   k.lean(p => [2,3*cyc(p),0]);
   k.rot(R.head,p => [2*cyc(p*2),0,0]);
  });
  clip('run','走る',.6,true,k => {
   k.rot(R.legL,p => [1.7*A*cyc(p),0,0],12);
   k.rot(R.legR,p => [-1.7*A*cyc(p),0,0],12);
   k.rot(R.armL,p => [-1.4*A*cyc(p),0,0],12);
   k.rot(R.armR,p => [1.4*A*cyc(p),0,0],12);
   k.bob(p => [0,.07*B*hump(p*2),0],12);
   k.lean(p => [10,5*cyc(p),0],12);
   k.rot(R.head,p => [-6+3*cyc(p*2),0,0],12);
  });
  clip('jump','ジャンプ',1,false,k => {
   k.move([[0,[0,0,0]],[.18,[0,-.06*H,0]],[.5,[0,.4*B,0]],[.82,[0,-.04*H,0]],[1,[0,0,0]]]);
   const legs = [[0,[0,0,0]],[.18,[-25,0,0]],[.5,[20,0,0]],[.82,[-20,0,0]],[1,[0,0,0]]];
   k.pose(R.legL,legs);
   k.pose(R.legR,legs);
   const arms = [[0,[0,0,0]],[.18,[30,0,0]],[.5,[-140,0,0]],[.82,[-20,0,0]],[1,[0,0,0]]];
   k.pose(R.armL,arms);
   k.pose(R.armR,arms);
  });
  clip('attack','攻撃',.7,false,k => {
   k.pose(R.armR,[[0,[0,0,0]],[.3,[50,0,0]],[.5,[-110,0,0]],[.75,[-60,0,0]],[1,[0,0,0]]]);
   k.tilt([[0,[0,0,0]],[.3,[0,-15,0]],[.5,[5,20,0]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.5,[0,0,.06*H]],[1,[0,0,0]]]);
   k.hit(.5);
  });
  clip('hurt','やられ',.5,false,k => {
   k.tilt([[0,[0,0,0]],[.3,[-15,0,0]],[1,[0,0,0]]]);
   k.pose(R.head,[[0,[0,0,0]],[.3,[-20,0,0]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.3,[0,0,-.05*H]],[1,[0,0,0]]]);
  });
  clip('die','倒れる',1.2,false,k => {
   k.tilt([[0,[0,0,0]],[.3,[-10,0,0]],[1,[0,0,80]]]);
   k.move([[0,[0,0,0]],[.3,[0,-.05*H,0]],[1,[0,-.3*H,0]]]);
   if (bodyAll) {
    // 胴がモデル全体のときは、脚を外へ開いて沈む
    k.pose(R.legL,[[0,[0,0,0]],[1,[0,0,35]]]);
    k.pose(R.legR,[[0,[0,0,0]],[1,[0,0,-35]]]);
   }
   k.pose(R.head,[[0,[0,0,0]],[.6,[15,0,0]],[1,[20,0,0]]]);
  });
  clip('emote','喜ぶ',1.2,false,k => {
   k.pose(R.armL,[[0,[0,0,0]],[.2,[0,0,150]],[.8,[0,0,150]],[1,[0,0,0]]]);
   k.pose(R.armR,[[0,[0,0,0]],[.2,[0,0,-150]],[.8,[0,0,-150]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.2,[0,0,0]],[.35,[0,.12*B,0]],[.5,[0,0,0]],[.65,[0,.12*B,0]],[.8,[0,0,0]],[1,[0,0,0]]]);
   k.pose(R.head,[[0,[0,0,0]],[.3,[-12,0,0]],[.8,[-12,0,0]],[1,[0,0,0]]]);
  });
 }

 if (kind === 'quad') {
  clip('idle','待機',3,true,k => {
   k.bob(p => [0,.01*B*hump(p),0]);
   k.rot(R.head,p => [4*cyc(p),0,0]);
   k.rot(R.tail,p => [0,12*cyc(p),0]);
  });
  clip('walk','歩く',1.1,true,k => {
   k.rot(R.legFL,p => [A*cyc(p),0,0]);
   k.rot(R.legBR,p => [A*cyc(p),0,0]);
   k.rot(R.legFR,p => [-A*cyc(p),0,0]);
   k.rot(R.legBL,p => [-A*cyc(p),0,0]);
   k.bob(p => [0,.02*B*hump(p*2),0]);
   k.rot(R.head,p => [5*cyc(p*2),0,0]);
   k.rot(R.tail,p => [0,8*cyc(p),0]);
  });
  clip('run','走る',.55,true,k => {
   const a = 1.6*A;
   k.rot(R.legFL,p => [a*cyc(p),0,0],12);
   k.rot(R.legFR,p => [a*cyc(p-.1),0,0],12);
   k.rot(R.legBL,p => [a*cyc(p-.5),0,0],12);
   k.rot(R.legBR,p => [a*cyc(p-.6),0,0],12);
   k.bob(p => [0,.06*B*hump(p),0],12);
   k.lean(p => [6*cyc(p),0,0],12);
   k.rot(R.head,p => [10*cyc(p),0,0],12);
   k.rot(R.tail,p => [15*cyc(p),0,0],12);
  });
  clip('jump','ジャンプ',1.1,false,k => {
   k.move([[0,[0,0,0]],[.2,[0,-.05*H,0]],[.5,[0,.45*B,0]],[.82,[0,-.03*H,0]],[1,[0,0,0]]]);
   k.tilt([[0,[0,0,0]],[.2,[-12,0,0]],[.5,[0,0,0]],[.75,[10,0,0]],[1,[0,0,0]]]);

 if (kind === 'vehicle') {

function generateMotion() {
 const m = state.motion;
 const s = state.modelSpec;
 const R = {};

 for (const role of MOTION_KINDS[m.kind].roles) {
  const id = m.roles[role];
  if (role === 'body' && id === '*') R.body = '*';
  else if (id && own(s.parts,id)) R[role] = id;
 }

 assert(Object.keys(R).length,'役割に部品を1つ以上選んでください');

 stopMotion();

 const clips = buildMotionClips(m.kind,R,{
  stride: m.stride,
  bounce: m.bounce,
  pace: m.pace,
  height: modelHeight()
 });

 mutate(x => {
  x.animations = {...(x.animations || {}),...clips};
 });

 toast(Object.keys(clips).length+'個の動きを作りました（↶で取り消せます）');

 if (state.motion.animator) playMotion(m.kind === 'vehicle' ? 'drive' : 'walk');
}

// 部品の見た目の範囲を、親から見た座標で求めて関節の位置を決める
function computePivot(id,where) {
 const r = state.runtime;
 assert(r?.root,'3D表示が使えないため、関節の位置を計算できません');

 const o = r.root.userData.parts[id];
 assert(o,'部品が見つかりません: '+id);

 r.root.updateMatrixWorld(true);

 const toParent = new THREE.Matrix4().copy(o.parent.matrixWorld).invert();
 const box = new THREE.Box3();

 o.traverse(n => {
  if (!n.isMesh) return;
  if (!n.geometry.boundingBox) n.geometry.computeBoundingBox();
  const m = new THREE.Matrix4().multiplyMatrices(toParent,n.matrixWorld);
  box.union(n.geometry.boundingBox.clone().applyMatrix4(m));
 });

 assert(!box.isEmpty(),'この部品には形がないため、関節の位置を決められません');

 const c = box.getCenter(new THREE.Vector3());
 const y = where === 'top' ? box.max.y
  : where === 'bottom' ? box.min.y
  : c.y;

 return [c.x,y,c.z].map(v => Math.round(v*10000)/10000);
}

function insertJoint(s,id,pivot) {
 const p = s.parts[id];
 let jointId = id.slice(0,56)+'_joint';

 if (own(s.parts,jointId)) jointId = uid('joint');

 s.parts[jointId] = {
  id: jointId,
  name: p.name+'の関節',
  type: 'group',
  parent: p.parent,
  position: pivot.slice(),
  rotation: [0,0,0],
  scale: [1,1,1],
  visible: true
 };

 // 関節は回転0・倍率1なので、位置を差し引くだけで見た目は変わらない
 p.parent = jointId;
 p.position = p.position.map((v,i) => Math.round((v-pivot[i])*10000)/10000);

 return jointId;
}

function makeJoint(where) {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id),'関節を作る部品を選んでください');

 stopMotion();

 const pivot = computePivot(id,where);
 let jointId = null;

 mutate(s => {
  jointId = insertJoint(s,id,pivot);
 });

 selectPart(jointId);
 toast('関節を作りました。動きはこの関節に付けると付け根から回ります');
}

function autoJoints() {
 const m = state.motion;
 const s = state.modelSpec;

 const ids = [...new Set(
  ['legL','legR','legFL','legFR','legBL','legBR','armL','armR'].map(r => m.roles[r])
 )].filter(id => id && own(s.parts,id) && !/(_joint$|^joint_)/.test(id));

 assert(ids.length,'脚・腕の役割に部品が選ばれていないか、すでに関節があります');

 stopMotion();

 const pivots = ids.map(id => [id,computePivot(id,'top')]);

 mutate(x => pivots.forEach(([id,pv]) => insertJoint(x,id,pv)));

 toast(ids.length+'か所に関節を作りました（↶で取り消せます）');
}
