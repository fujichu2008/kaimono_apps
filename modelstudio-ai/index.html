<!DOCTYPE html>
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#10151c">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<!-- APPSTUDIO_PWA_HEAD_END -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>ModelStudio AI</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#191f29;--line:#303b49;--muted:#a6b4c5;--cyan:#63d9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#edf4fc;font:14px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input:not([type=checkbox]):not([type=color]){min-height:44px}
button{background:#283343;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.38;cursor:default}
.primary{background:#175d75;border-color:#327e97}
.danger{color:#ffb5b5}
input,select,textarea{background:#101721;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input[type=color]{height:44px;padding:4px}
input[type=checkbox]{width:21px;height:21px;vertical-align:middle}
input[type=range]{padding:0;accent-color:var(--cyan)}
textarea{resize:vertical;min-height:130px;font:13px/1.55 ui-monospace,monospace}
label{display:block;color:var(--muted);margin:10px 0 4px}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:15px;margin:14px 0 8px}
p{margin:8px 0}
.muted,small{color:var(--muted)}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);gap:10px}
header strong{font-size:17px}
header small{display:block;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{color:var(--cyan)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.row.fill>*{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.workspace{display:flex;flex-direction:column}
#viewport{height:46svh;min-height:240px;position:relative;background:#202a36;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#viewTools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#viewTools>*{pointer-events:auto;background:#18212de6}
#viewTools button{padding:7px 10px}
#viewTools input{width:44px}
#stats{position:absolute;bottom:10px;left:12px;right:12px;font:11px/1.5 ui-monospace,monospace;pointer-events:none;color:#d8e7f2;text-shadow:0 1px 4px #000}
#renderMessage{position:absolute;top:80px;left:14px;right:14px;background:#111d;color:#ffddb0;border-radius:10px;padding:12px;display:none;pointer-events:none}
#panel{padding:16px 16px 100px;min-width:0;overflow-wrap:anywhere}
.card{background:#1b2531b8;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#121b27f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:transparent;padding:8px 2px;font-size:11px;min-height:49px}
nav button.active{background:#204255;color:#8eeaff}
nav span{display:block;font-size:17px}
.partrow{display:flex;gap:5px;margin:4px 0;align-items:center}
.partrow .pick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected{border-color:var(--cyan);background:#244654}
.partrow small{margin-left:8px}
.toggle{width:44px;padding:5px;flex:none}
.error{border:1px solid #a85f65;background:#3c202b;color:#ffd9db;border-radius:10px;padding:10px;white-space:pre-wrap}
.success{color:#9decce}
#error{margin:10px 16px}
#error[hidden]{display:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:90vw;background:#d7f8ff;color:#102733;padding:10px 18px;border-radius:12px;z-index:30;display:none}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}
.modal[hidden]{display:none}
.dialog{width:min(760px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.dialog textarea{height:43dvh}
.dialog .row{justify-content:flex-end}
.dialog label{color:#e0eaf5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.badge{color:#94e4fa;font-size:12px}
.helpsteps{display:grid;gap:8px;margin:14px 0}
.helpsteps div{padding:10px;background:#25303e;border-radius:9px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:4px}
.steps button{display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px;text-align:left}
.steps small{display:block;font-size:11px}
.steps .done{border-color:#3f8f73}
.steps .warn{border-color:#b98b52}
.steps button.active{background:#204255}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{min-height:40px;padding:6px 12px;border-radius:999px}
details.card summary{cursor:pointer;padding:6px 0;color:var(--muted)}
@media(min-width:950px){
 .workspace{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100dvh - 68px)}
 #viewport{height:100%;min-height:0}
 #panel{height:100%;overflow:auto;padding-bottom:100px;border-left:1px solid var(--line)}
 nav{left:auto;width:420px}
 #error{position:fixed;top:65px;left:12px;max-width:calc(100% - 470px);z-index:10}
}
@media(max-width:500px){
 input,select,textarea{font-size:16px}
 .grid3 input{padding:8px 5px}
 header{padding:8px 12px}
 #viewTools{gap:4px}
 #viewTools button{font-size:12px;padding:6px 8px}
}
</style>
</head>
<body>
<header>
 <div>
  <strong><span class="logo">◈</span> ModelStudio AI</strong>
  <small id="modelTitle">読み込み中…</small>
 </div>
 <div class="row">
  <button id="undoBtn" data-action="undo" aria-label="元に戻す">↶</button>
  <button id="redoBtn" data-action="redo" aria-label="やり直す">↷</button>
  <button data-action="save" class="primary">保存</button>
 </div>
</header>

<div id="error" class="error" role="alert" hidden></div>

<main class="workspace">
 <section id="viewport" aria-label="3Dプレビュー">
  <div id="viewTools">
   <button data-action="fit">⊙ 全体表示</button>
   <button data-action="studio" id="studioBtn">仕上がり確認</button>
   <button data-action="grid" id="gridBtn">方眼 ✓</button>
   <button data-action="anchors" id="anchorBtn">取付点 ✓</button>
   <input type="color" id="background" value="#202a36" aria-label="背景色">
   <button data-action="guide" aria-label="使い方">?</button>
  </div>
  <div id="renderMessage"></div>
  <div id="stats"></div>
 </section>
 <section id="panel"></section>
</main>

<nav aria-label="主要タブ">
 <button data-tab="model" class="active"><span>◈</span>モデル</button>
 <button data-tab="parts"><span>▤</span>部品</button>
 <button data-tab="material"><span>◐</span>色・質感</button>
 <button data-tab="motion"><span>▶</span>動き</button>
 <button data-tab="ai"><span>✧</span>AI相談</button>
 <button data-tab="export"><span>↗</span>書き出し</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div class="row" id="dialogActions"></div>
 </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';

// ============================================================
// 1. Constants
// ModelSpec V1: meters / radians / local transforms / +Y up / +Z forward
// ============================================================

const STORE = 'modelstudio.ai.v1';
const DRAFT = STORE + '.draft';
const GUIDE = STORE + '.guide';

const LIMIT = {
 parts: 300,
 materials: 100,
 anchors: 100,
 triangles: 200000,
 bytes: 2000000,
 history: 25,
 animations: 50,
 motionKeys: 300
};

const GEO = {
 box: {
  type: 'box',
  size: [1, 1, 1]
 },
 sphere: {
  type: 'sphere',
  radius: .5,
  widthSegments: 20,
  heightSegments: 12
 },
 cylinder: {
  type: 'cylinder',
  radiusTop: .5,
  radiusBottom: .5,
  height: 1,
  radialSegments: 20
 },
 cone: {
  type: 'cone',
  radius: .5,
  height: 1,
  radialSegments: 20
 },
 torus: {
  type: 'torus',
  radius: .5,
  tube: .12,
  radialSegments: 8,
  tubularSegments: 24
 },
 plane: {
  type: 'plane',
  size: [1, 1]
 },
 capsule: {
  type: 'capsule',
  radius: .3,
  length: 1,
  radialSegments: 20,
  capSegments: 6
 },
 lathe: {
  type: 'lathe',
  points: [[0,0],[.4,0],[.5,.5],[.3,1],[0,1]],
  segments: 24
 },
 extrude: {
  type: 'extrude',
  points: [[-.5,-.5],[.5,-.5],[.4,.5],[-.4,.5]],
  depth: .4
 },
 tube: {
  type: 'tube',
  points: [[0,0,0],[.5,.5,0],[1,.5,.5]],
  radius: .08,
  tubularSegments: 32,
  radialSegments: 8,
  closed: false
 }
};

// 形の名前を初心者向けの日本語で表示するための対応表
const GEO_LABEL = {
 box: '箱',
 sphere: '球',
 cylinder: '円柱',
 cone: '円すい',
 torus: '輪（ドーナツ形）',
 plane: '板',
 capsule: 'カプセル',
 lathe: '回転体（つぼ・びん形）',
 extrude: '押し出し（平面を厚くした形）',
 tube: '管（曲がったパイプ）',
 group: 'グループ（部品のまとめ役）'
};

const geoLabel = t => GEO_LABEL[t] || t;

// ============================================================
// 2. Default Data
// サンプルをデータとして組み立てる。描画は必ず共通Rendererが担当。
// ============================================================

function emptySpec() {
 return {
  format: 'MODEL_SPEC_V1',
  meta: {
   name: 'Untitled Model',
   id: 'model_' + Date.now().toString(36),
   version: 1,
   description: ''
  },
  settings: {
   unit: 'meter',
   origin: 'center-bottom'
  },
  materials: {
   body: {
    name: 'Body',
    type: 'standard',
    color: '#dae4ea',
    roughness: .55,
    metalness: .2,
    opacity: 1,
    transparent: false,
    emissive: '#000000',
    emissiveIntensity: 0
   }
  },
  parts: {},
  anchors: {}
 };
}

function sampleSpec() {
 const s = emptySpec();

 s.meta = {
  name: 'AQUA • Survey Drone',
  id: 'aqua_survey_drone',
  version: 1,
  description: '海岸調査用ドローン。4基のローター、カメラ、着陸脚。+Zが前方。'
 };

 s.materials = {
  shell: {
   name: 'Porcelain',
   type: 'standard',
   color: '#dce7eb',
   roughness: .38,
   metalness: .28
  },
  dark: {
   name: 'Graphite',
   type: 'standard',
   color: '#233243',
   roughness: .5,
   metalness: .55
  },
  cyan: {
   name: 'Signal cyan',
   type: 'standard',
   color: '#32cce8',
   roughness: .35,
   metalness: .35,
   emissive: '#10788e',
   emissiveIntensity: .55
  },
  glass: {
   name: 'Optical glass',
   type: 'standard',
   color: '#17334c',
   roughness: .12,
   metalness: .5
  },
  rubber: {
   name: 'Soft rubber',
   type: 'standard',
   color: '#101821',
   roughness: .95,
   metalness: 0
  }
 };

 const add = (
  id, type, geometry, position, material,
  parent = null, scale = [1,1,1], rotation = [0,0,0]
 ) => {
  s.parts[id] = {
   id,
   name: id.replace(/_/g, ' '),
   type,
   geometry,
   position,
   rotation,
   scale,
   material,
   parent,
   visible: true
  };
 };

 add(
  'body', 'primitive',
  {type:'sphere', radius:1, widthSegments:24, heightSegments:16},
  [0,1.15,0], 'shell', null, [1.08,.36,1.35]
 );
 add(
  'spine', 'primitive',
  {type:'box', size:[.35,.15,1.7]},
  [0,.3,-.05], 'dark', 'body'
 );
 add(
  'status', 'primitive',
  {type:'box', size:[.16,.06,.7]},
  [0,.54,.02], 'cyan', 'body'
 );
 add(
  'camera_mount', 'primitive',
  {type:'cylinder', radiusTop:.17, radiusBottom:.17, height:.24, radialSegments:16},
  [0,.72,.75], 'dark'
 );
 add(
  'camera', 'primitive',
  {type:'sphere', radius:.29, widthSegments:20, heightSegments:12},
  [0,-.19,.06], 'shell', 'camera_mount'
 );
 add(
  'lens', 'primitive',
  {type:'cylinder', radiusTop:.18, radiusBottom:.18, height:.12, radialSegments:20},
  [0,0,.25], 'glass', 'camera', [1,1,1], [Math.PI/2,0,0]
 );
 add(
  'lens_ring', 'primitive',
  {type:'torus', radius:.19, tube:.035, radialSegments:8, tubularSegments:24},
  [0,0,.32], 'cyan', 'camera'
 );

 for (let i = 0; i < 4; i++) {
  const x = i % 2 ? 1 : -1;
  const z = i < 2 ? 1 : -1;
  const root = 'rotor_' + i;

  add(root, 'group', undefined, [x*1.15,1.17,z*.95], undefined);

  add(
   root+'_arm', 'primitive',
   {type:'box', size:[.9,.13,.2]},
   [-x*.4,0,0], 'dark', root, [1,1,1], [0,0,x*.08]
  );
  add(
   root+'_motor', 'primitive',
   {type:'cylinder', radiusTop:.22, radiusBottom:.2, height:.32, radialSegments:20},
   [0,.06,0], 'shell', root
  );
  add(
   root+'_guard', 'primitive',
   {type:'torus', radius:.6, tube:.045, radialSegments:8, tubularSegments:32},
   [0,.23,0], 'cyan', root, [1,1,1], [Math.PI/2,0,0]
  );
  add(
   root+'_blade', 'primitive',
   {type:'box', size:[1.05,.045,.11]},
   [0,.25,0], 'dark', root, [1,1,1], [0,i*.8,0]
  );
  add(
   root+'_hub', 'primitive',
   {type:'sphere', radius:.11, widthSegments:12, heightSegments:8},
   [0,.29,0], 'dark', root
  );
 }

 for (let i = 0; i < 2; i++) {
  const x = i ? .7 : -.7;

  add(
   'leg_'+i, 'primitive',
   {type:'capsule', radius:.075, length:.56, radialSegments:12, capSegments:4},
   [x,.56,-.35], 'dark'
  );
  add(
   'foot_'+i, 'primitive',
   {type:'box', size:[.22,.12,1.12]},
   [x,.15,-.22], 'rubber'
  );
 }

 s.anchors = {
  cameraPoint: {
   id: 'cameraPoint',
   name: 'Camera viewpoint',
   parent: 'camera',
   position: [0,0,.38],
   rotation: [0,0,0]
  },
  itemAttachPoint: {
   id: 'itemAttachPoint',
   name: 'Payload mount',
   position: [0,.65,-.3],
   rotation: [0,0,0]
  },
  spawnPoint: {
   id: 'spawnPoint',
   name: 'Ground origin',
   position: [0,0,0],
   rotation: [0,0,0]
  }
 };

 return normalizeSpec(s);
}

// ============================================================
// 3. State
// ============================================================

const state = {
 modelSpec: null,
 projectId: null,
 selectedPartId: null,
 selectedAnchorId: null,
 selectedMaterialId: null,
 activeTab: 'model',
 dirty: false,
 cameraMode: 'orbit',
 previewMode: 'edit',
 showGrid: true,
 showAnchors: true,
 background: '#202a36',
 undo: [],
 redo: [],
 liveBefore: null,
 projects: [],
 ai: {
  request: '',
  idea: '',
  patch: '',
  prompt: '',
  motion: '',
  motionFix: ''
 },
 stats: {
  parts: 0,
  objects: 0,
  materials: 0,
  vertices: 0,
  triangles: 0
 },
 runtime: null,
 engine: null,
 saveTimer: null,
 toastTimer: null,
 modalAction: null,
 modalReturn: null,
 storageError: false,
 motion: {
  animator: null,
  playing: null,
  speed: 1,
  kind: 'quad',
  kindFor: null,
  roles: {},
  roleKey: null,
  stride: 1,
  bounce: 1,
  pace: 1,
  picks: ['idle','walk','run','jump','attack','hurt'],
  fixId: null,
  trySpeed: 0,
  trying: false,
  tester: null,
  exported: false
 }
};

// ============================================================
// 4. Utilities
// ============================================================

const $ = id => document.getElementById(id);
const clone = x => JSON.parse(JSON.stringify(x));
const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const obj = o => o !== null && typeof o === 'object' && !Array.isArray(o);
const json = x => JSON.stringify(x,null,2);
const uid = p => p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);

const esc = x => String(x ?? '').replace(
 /[&<>"']/g,
 c => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);

function assert(test,message) {
 if (!test) throw Error(message);
}

function showError(e) {
 $('error').textContent = e.message || String(e);
 $('error').hidden = false;
}

function clearError() {
 $('error').hidden = true;
}

function safe(fn) {
 try {
  clearError();
  return fn();
 } catch (e) {
  showError(e);
  return null;
 }
}

function toast(message) {
 $('toast').textContent = message;
 $('toast').style.display = 'block';
 clearTimeout(state.toastTimer);
 state.toastTimer = setTimeout(() => {
  $('toast').style.display = 'none';
 },2400);
}

function guardTree(v,depth=0) {
 assert(depth < 50,'JSONの入れ子が深すぎます');

 if (v && typeof v === 'object') {
  for (const k of Object.keys(v)) {
   assert(
    !['__proto__','constructor','prototype'].includes(k),
    '禁止キー: '+k
   );
   guardTree(v[k],depth+1);
  }
 } else if (typeof v === 'number') {
  assert(Number.isFinite(v),'有限の数値が必要です');
 }
}

function parseJSON(text,max=LIMIT.bytes) {
 assert(text.length <= max,'JSONがサイズ上限を超えています');

 let v;
 try {
  v = JSON.parse(text);
 } catch (e) {
  throw Error('データの書き方に誤りがあります（JSON構文エラー）: '+e.message);
 }

 guardTree(v);
 return v;
}

function toMap(value,label) {
 if (!Array.isArray(value)) return value;

 const result = {};
 for (const item of value) {
  assert(
   obj(item) && typeof item.id === 'string',
   label+': idが必要です'
  );
  assert(!own(result,item.id),label+': ID重複 '+item.id);
  result[item.id] = item;
 }
 return result;
}

function normalizeSpec(source) {
 const s = clone(source);
 guardTree(s);
 assert(obj(s),'ModelSpecはObjectです');

 s.parts = toMap(s.parts,'parts');
 s.anchors = toMap(s.anchors ?? {},'anchors');
 s.animations ??= {};

 if (obj(s.parts)) {
  for (const [id,p] of Object.entries(s.parts)) {
   assert(obj(p),'PartがObjectではありません: '+id);
   p.id ??= id;
   p.name ??= id;
   p.type ??= 'primitive';
   p.parent ??= null;
   p.position ??= [0,0,0];
   p.rotation ??= [0,0,0];
   p.scale ??= [1,1,1];
   p.visible ??= true;
  }
 }

 if (obj(s.anchors)) {
  for (const [id,a] of Object.entries(s.anchors)) {
   assert(obj(a),'AnchorがObjectではありません');
   a.id ??= id;
   a.name ??= id;
   a.parent ??= null;
   a.rotation ??= [0,0,0];
  }
 }

 return s;
}

function cleanPastedJSON(text) {
 return String(text ?? '')
  .replace(/^\uFEFF/,'')
  .replace(/[\u201C\u201D\u201E\u201F\u2033\uFF02]/g,'"')
  .replace(/\u00A0/g,' ')
  .trim()
  .replace(/^`{3}[A-Za-z]*\s*\n?/,'')
  .replace(/\n?`{3}\s*$/,'')
  .trim();
}

function parseModelSpec(text) {
 const s = normalizeSpec(parseJSON(cleanPastedJSON(text)));
 validateModelSpec(s);
 return s;
}

// ============================================================
// 5. ModelSpec Validation
// 検証と負荷上限チェックを済ませてからSceneを変更する。
// ============================================================

function validId(id) {
 return typeof id === 'string'
  && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(id)
  && !['constructor','prototype','__proto__'].includes(id);
}

function number(n,label,min=-10000,max=10000) {
 assert(
  typeof n === 'number' && Number.isFinite(n) && n >= min && n <= max,
  label+': '+min+'〜'+max+'の数値が必要です'
 );
}

function vector(v,label,n=3) {
 assert(
  Array.isArray(v) && v.length === n,
  label+': '+n+'要素の配列が必要です'
 );
 v.forEach(x => number(x,label));
}

function validateGeometry(g,label) {
 assert(obj(g) && own(GEO,g.type),label+': 不明なGeometry');

 const base = GEO[g.type];

 for (const key of Object.keys(base)) {
  const v = g[key] ?? base[key];

  if (key === 'type') continue;

  if (key === 'points') {
   assert(g.points !== undefined,label+': pointsが必要です');
   assert(
    Array.isArray(v)
     && v.length >= (g.type === 'extrude' ? 3 : 2)
     && v.length <= 128,
    label+': pointsは2/3〜128点'
   );

   v.forEach(p => vector(p,label+'.points',g.type === 'tube' ? 3 : 2));

   if (g.type === 'lathe') {
    v.forEach(p => number(p[0],label+'.radius',0,10000));
   }

   if (g.type === 'extrude') {
    let area = 0;
    v.forEach((p,i) => {
     const q = v[(i+1)%v.length];
     area += p[0]*q[1]-q[0]*p[1];
    });
    assert(Math.abs(area) > 1e-8,label+': 輪郭面積が0です');
   }

   if (g.type === 'tube') {
    for (let i=1;i<v.length;i++) {
     assert(
      v[i].some((x,j) => x !== v[i-1][j]),
      label+': tubeの隣接点が重複しています'
     );
    }
   }
  } else if (key === 'size') {
   vector(v,label+'.size',base.size.length);
   v.forEach(n => number(n,label+'.size',.001,10000));
  } else if (key === 'closed') {
   assert(typeof v === 'boolean',label+': closedはbooleanです');
  } else if (/Segments$|^segments$/.test(key)) {
   number(v,label+'.'+key,3,128);
   assert(Number.isInteger(v),label+': 分割数は整数です');
  } else {
   number(
    v,
    label+'.'+key,
    ['radiusTop','radiusBottom','length'].includes(key) ? 0 : .001,
    10000
   );
  }
 }

 if (g.type === 'cylinder') {
  assert(
   (g.radiusTop ?? .5)+(g.radiusBottom ?? .5) > 0,
   label+': 半径を指定してください'
  );
 }

 const d = {...base,...g};

 switch (d.type) {
  case 'box': return 12;
  case 'plane': return 2;
  case 'sphere': return d.widthSegments*d.heightSegments*2;
  case 'cylinder':
  case 'cone': return d.radialSegments*4;
  case 'torus':
  case 'tube': return d.radialSegments*d.tubularSegments*2;
  case 'capsule': return d.radialSegments*(d.capSegments*2+3)*2;
  case 'lathe': return d.segments*d.points.length*2;
  case 'extrude': return d.points.length*4;
 }
}

// 動き（animations）の検証。回転は基本姿勢からの差分（度）、位置は差分（m）。
function validateAnimations(s) {
 const anims = s.animations;

 assert(obj(anims),'animations（動き）は動きIDをキーにしたObjectです');
 assert(
  Object.keys(anims).length <= LIMIT.animations,
  '動きは'+LIMIT.animations+'個までです'
 );

 for (const [id,a] of Object.entries(anims)) {
  const label = '動き「'+id+'」';

  assert(validId(id) && obj(a),label+': IDは英字で始まる英数字、中身はObjectです');
  assert(a.name === undefined || typeof a.name === 'string',label+': nameは文字列です');
  number(a.duration,label+'の長さ(duration)',.1,30);
  assert(a.loop === undefined || typeof a.loop === 'boolean',label+': loopはtrue/falseです');
  assert(a.tracks === undefined || obj(a.tracks),label+': tracksは部品IDをキーにしたObjectです');

  let keys = 0;

  for (const [pid,tr] of Object.entries(a.tracks || {})) {
   assert(own(s.parts,pid),label+': 部品「'+pid+'」がありません');
   assert(obj(tr),label+': '+pid+'の記録が不正です');

   for (const [ch,list] of Object.entries(tr)) {
    assert(
     ['rotation','position'].includes(ch),
     label+': '+pid+'.'+ch+'は使えません（rotation/positionのみ）'
    );
    assert(
     Array.isArray(list) && list.length > 0,
     label+': '+pid+'.'+ch+'にはキーが1つ以上必要です'
    );

    let prev = 0;

    for (const k of list) {
     assert(Array.isArray(k) && k.length === 2,label+': キーは[時刻,[x,y,z]]の形です');
     number(k[0],label+'の時刻',0,a.duration);
     assert(k[0] >= prev,label+': '+pid+'.'+ch+'の時刻は小さい順に並べてください');
     prev = k[0];
     vector(k[1],label+': '+pid+'.'+ch);
     keys++;
    }
   }
  }

  assert(keys <= LIMIT.motionKeys,label+': キーは'+LIMIT.motionKeys+'個までです');

  assert(a.spins === undefined || Array.isArray(a.spins),label+': spinsは配列です');
  for (const sp of a.spins || []) {
   assert(obj(sp) && own(s.parts,sp.part),label+': 回し続ける部品が見つかりません');
   assert(['x','y','z'].includes(sp.axis),label+': spinsのaxisはx/y/zです');
   number(sp.degPerSec,label+'の回転速度',-100000,100000);
  }

  assert(a.events === undefined || Array.isArray(a.events),label+': eventsは配列です');
  for (const ev of a.events || []) {
   assert(
    Array.isArray(ev) && ev.length === 2 && validId(ev[1]),
    label+': 合図は[時刻,英数字の名前]の形です'
   );
   number(ev[0],label+'の合図の時刻',0,a.duration);
  }
 }
}

function validateModelSpec(s) {
 guardTree(s);

 assert(
  obj(s) && s.format === 'MODEL_SPEC_V1',
  'format: MODEL_SPEC_V1 が必要です'
 );
 assert(
  obj(s.meta)
   && typeof s.meta.name === 'string'
   && s.meta.name.trim()
   && validId(s.meta.id),
  'meta.name / 英数字のmeta.idが必要です'
 );

 number(s.meta.version,'meta.version',1,100000);
 assert(Number.isInteger(s.meta.version),'versionは整数です');
 assert(
  s.meta.description === undefined || typeof s.meta.description === 'string',
  'descriptionは文字列です'
 );
 assert(
  obj(s.settings)
   && s.settings.unit === 'meter'
   && s.settings.origin === 'center-bottom',
  'settingsは unit: meter / origin: center-bottom としてください'
 );

 for (const k of ['parts','materials','anchors']) {
  assert(obj(s[k]),k+'はIDをキーにしたObjectです');
 }

 assert(Object.keys(s.parts).length <= LIMIT.parts,'Partは300個までです');
 assert(
  Object.keys(s.materials).length > 0
   && Object.keys(s.materials).length <= LIMIT.materials,
  'Materialは1〜100個です'
 );
 assert(Object.keys(s.anchors).length <= LIMIT.anchors,'Anchorは100個までです');

 for (const [id,m] of Object.entries(s.materials)) {
  assert(validId(id) && obj(m),'Material ID/Objectが不正: '+id);
  assert(m.type === 'standard','Material.typeはstandardです');
  assert(
   m.name === undefined || typeof m.name === 'string',
   'Material.nameは文字列です'
  );

  for (const k of ['color','emissive']) {
   if (k === 'color' || m[k] !== undefined) {
    assert(
     /^#[0-9a-f]{6}$/i.test(m[k]),
     id+'.'+k+': #rrggbb が必要です'
    );
   }
  }

  for (const k of ['roughness','metalness','opacity']) {
   if (m[k] !== undefined) number(m[k],id+'.'+k,0,1);
  }

  if (m.emissiveIntensity !== undefined) {
   number(m.emissiveIntensity,id+'.emissiveIntensity',0,10);
  }
  if (m.transparent !== undefined) {
   assert(typeof m.transparent === 'boolean','transparentはbooleanです');
  }
 }

 let estimate = 0;

 for (const [id,p] of Object.entries(s.parts)) {
  assert(
   validId(id) && obj(p) && p.id === id,
   'Partキーとidが不一致: '+id
  );
  assert(typeof p.name === 'string','Part.nameが必要です');
  assert(
   ['primitive','group'].includes(p.type),
   id+': typeはprimitive/groupです'
  );

  for (const k of ['position','rotation','scale']) {
   vector(p[k],id+'.'+k);
  }
  p.scale.forEach(n => number(n,id+'.scale',.001,1000));

  assert(typeof p.visible === 'boolean',id+': visibleはbooleanです');
  assert(
   p.parent === null
    || typeof p.parent === 'string' && own(s.parts,p.parent),
   id+': Parent ID不正'
  );

  if (p.type === 'primitive') {
   assert(
    typeof p.material === 'string' && own(s.materials,p.material),
    id+': 不明なMaterial'
   );
   estimate += validateGeometry(p.geometry,id);
  }

  const visited = new Set([id]);
  let parent = p.parent;

  while (parent !== null) {
   assert(!visited.has(parent),'Circular hierarchy: '+id);
   visited.add(parent);
   assert(visited.size <= 32,'階層は32段までです');
   assert(obj(s.parts[parent]),id+': Parent ID不正');
   parent = s.parts[parent].parent;
  }
 }

 for (const [id,a] of Object.entries(s.anchors)) {
  assert(
   validId(id) && obj(a) && a.id === id && typeof a.name === 'string',
   'Anchor ID/name不正: '+id
  );
  vector(a.position,id+'.position');
  vector(a.rotation,id+'.rotation');
  assert(
   a.parent === null
    || typeof a.parent === 'string' && own(s.parts,a.parent),
   id+': Anchor Parent ID不正'
  );
 }

 if (s.animations !== undefined) validateAnimations(s);

 assert(
  estimate <= LIMIT.triangles,
  '推定20万Triangleを超えます。分割数/Part数を減らしてください'
 );
 assert(JSON.stringify(s).length <= LIMIT.bytes,'モデルが2MBを超えます');

 return true;
}

// ============================================================
// 6–8. Geometry Builders / Material Manager / Generic Model Renderer
//
// このFactoryは外側のstateやGEOに依存しない。
// ゲーム組込時にも同じ関数をそのまま出力する。
// 入力は検証済みModelSpecを前提にする。
// ============================================================

function createModelRenderer(THREE) {
 function buildGeometry(g) {
  switch (g.type) {
   case 'box':
    return new THREE.BoxGeometry(...(g.size || [1,1,1]));

   case 'sphere':
    return new THREE.SphereGeometry(
     g.radius ?? .5,
     g.widthSegments ?? 20,
     g.heightSegments ?? 12
    );

   case 'cylinder':
    return new THREE.CylinderGeometry(
     g.radiusTop ?? .5,
     g.radiusBottom ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'cone':
    return new THREE.ConeGeometry(
     g.radius ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'torus':
    return new THREE.TorusGeometry(
     g.radius ?? .5,
     g.tube ?? .12,
     g.radialSegments ?? 8,
     g.tubularSegments ?? 24
    );

   case 'plane':
    return new THREE.PlaneGeometry(...(g.size || [1,1]));

   case 'lathe':
    return new THREE.LatheGeometry(
     g.points.map(p => new THREE.Vector2(...p)),
     g.segments ?? 24
    );

   case 'extrude': {
    const shape = new THREE.Shape();
    g.points.forEach((p,i) => {
     if (i) shape.lineTo(...p);
     else shape.moveTo(...p);
    });
    shape.closePath();

    return new THREE.ExtrudeGeometry(shape,{
     depth: g.depth ?? .4,
     steps: 1,
     bevelEnabled: false,
     curveSegments: 1
    });
   }

   case 'tube': {
    const curve = new THREE.CatmullRomCurve3(
     g.points.map(p => new THREE.Vector3(...p)),
     g.closed ?? false,
     'centripetal'
    );

    return new THREE.TubeGeometry(
     curve,
     g.tubularSegments ?? 32,
     g.radius ?? .08,
     g.radialSegments ?? 8,
     g.closed ?? false
    );
   }

   case 'capsule': {
    const r = g.radius ?? .3;
    const l = g.length ?? 1;
    const n = g.capSegments ?? 6;
    const pts = [];

    for (let i=0;i<=n;i++) {
     const a = -Math.PI/2+i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      -l/2+Math.sin(a)*r
     ));
    }

    for (let i=0;i<=n;i++) {
     const a = i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      l/2+Math.sin(a)*r
     ));
    }

    return new THREE.LatheGeometry(pts,g.radialSegments ?? 20);
   }

   default:
    throw Error('不明なGeometry: '+g.type);
  }
 }

 function updateMaterial(m,d) {
  m.color.set(d.color);
  m.roughness = d.roughness ?? .6;
  m.metalness = d.metalness ?? 0;
  m.opacity = d.opacity ?? 1;
  m.transparent = d.transparent ?? false;
  m.emissive.set(d.emissive ?? '#000000');
  m.emissiveIntensity = d.emissiveIntensity ?? 0;
  m.side = THREE.DoubleSide;
  m.depthWrite = !m.transparent;
  m.needsUpdate = true;
 }

 function buildMaterial(d) {
  const m = new THREE.MeshStandardMaterial();
  updateMaterial(m,d);
  return m;
 }

 function transform(o,d) {
  o.position.fromArray(d.position);
  o.rotation.set(...d.rotation);
  o.scale.fromArray(d.scale || [1,1,1]);
  o.visible = d.visible !== false;
 }

 function buildPart(p,materials) {
  const group = new THREE.Group();
  group.name = p.name;
  group.userData.partId = p.id;
  transform(group,p);

  if (p.type === 'primitive') {
   const mesh = new THREE.Mesh(
    buildGeometry(p.geometry),
    materials[p.material]
   );
   mesh.castShadow = true;
   mesh.receiveShadow = true;
   mesh.userData.partId = p.id;
   group.add(mesh);
  }

  return group;
 }

 function dispose(root) {
  const gs = new Set();
  const ms = new Set();

  root.traverse(o => {
   if (o.geometry) gs.add(o.geometry);
   if (o.material) {
    (Array.isArray(o.material) ? o.material : [o.material])
     .forEach(m => ms.add(m));
   }
  });

  Object.values(root.userData.materials || {}).forEach(m => ms.add(m));
  gs.forEach(g => g.dispose());
  ms.forEach(m => m.dispose());
 }

 function buildModel(spec) {
  const root = new THREE.Group();
  const parts = {};
  const materials = {};
  const anchors = {};

  root.name = spec.meta.name;
  root.userData = {parts,materials,anchors};

  try {
   for (const [id,m] of Object.entries(spec.materials)) {
    materials[id] = buildMaterial(m);
   }

   for (const p of Object.values(spec.parts)) {
    parts[p.id] = buildPart(p,materials);
    root.add(parts[p.id]);
   }

   for (const p of Object.values(spec.parts)) {
    if (p.parent) parts[p.parent].add(parts[p.id]);
   }

   for (const a of Object.values(spec.anchors)) {
    const o = new THREE.Object3D();
    o.name = a.id;
    o.userData.anchorId = a.id;
    transform(o,a);

    (a.parent ? parts[a.parent] : root).add(o);
    anchors[a.id] = o;
   }

   root.updateMatrixWorld(true);
   return root;
  } catch (e) {
   dispose(root);
   throw e;
  }
 }

 // 動きの再生。各部品の基本姿勢に「差分（回転=度, 位置=m）」を足して毎フレーム当てはめる。
 // 使い方: const anim = createAnimator(model, spec); anim.play('walk'); 毎フレーム anim.update(dt,{speed});
 function createAnimator(root,spec) {
  const D = Math.PI/180;
  const parts = root.userData.parts;
  const clips = spec.animations || {};
  const rest = {};
  const touched = new Set();
  const handlers = {};
  let current = null;
  let previous = null;
  let fade = 0;
  let fadeTime = 0;

  for (const [id,o] of Object.entries(parts)) {
   rest[id] = {p:o.position.clone(),r:o.rotation.clone()};
  }

  for (const c of Object.values(clips)) {
   Object.keys(c.tracks || {}).forEach(id => {
    if (parts[id]) touched.add(id);
   });
   (c.spins || []).forEach(sp => {
    if (parts[sp.part]) touched.add(sp.part);
   });
  }

  function sample(list,t) {
   if (!Array.isArray(list) || !list.length) return null;
   if (t <= list[0][0]) return list[0][1];

   for (let i=1;i<list.length;i++) {
    const a = list[i-1];
    const b = list[i];

    if (t <= b[0]) {
     const span = b[0]-a[0];
     const k = span > 0 ? (t-a[0])/span : 1;
     return [0,1,2].map(j => a[1][j]+(b[1][j]-a[1][j])*k);
    }
   }

   return list[list.length-1][1];
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(layer,from,to,inclusive) {
   for (const [t,name] of clips[layer.id].events || []) {
    if ((inclusive ? t >= from : t > from) && t <= to) emit(name,layer.id);
   }
  }

  function advance(layer,step,withEvents) {
   const c = clips[layer.id];
   const dur = c.duration;
   let t = layer.time+step;

   layer.elapsed += step;

   if (withEvents) fire(layer,layer.time,Math.min(t,dur),layer.fresh);
   layer.fresh = false;

   if (t >= dur) {
    if (c.loop === false) {
     t = dur;
    } else {
     t = dur > 0 ? t % dur : 0;
     if (withEvents) fire(layer,0,t,true);
    }
   }

   layer.time = t;
  }

  function addLayer(layer,w,acc) {
   const c = clips[layer.id];
   if (!c || w <= 0) return;

   for (const [id,tr] of Object.entries(c.tracks || {})) {
    if (!parts[id]) continue;

    const a = acc[id] || (acc[id] = {r:[0,0,0],p:[0,0,0]});
    const r = sample(tr.rotation,layer.time);
    const p = sample(tr.position,layer.time);

    for (let j=0;j<3;j++) {
     if (r) a.r[j] += r[j]*w;
     if (p) a.p[j] += p[j]*w;
    }
   }

   for (const sp of c.spins || []) {
    if (!parts[sp.part]) continue;

    const a = acc[sp.part] || (acc[sp.part] = {r:[0,0,0],p:[0,0,0]});
    a.r['xyz'.indexOf(sp.axis)] += (sp.degPerSec*layer.elapsed % 360)*w;
   }
  }

  function apply() {
   const acc = {};
   const w = previous && fade > 0 ? Math.min(1,fadeTime/fade) : 1;

   if (current) addLayer(current,w,acc);
   if (previous) addLayer(previous,1-w,acc);

   for (const id of touched) {
    const o = parts[id];
    const base = rest[id];
    const a = acc[id] || {r:[0,0,0],p:[0,0,0]};

    o.position.set(base.p.x+a.p[0],base.p.y+a.p[1],base.p.z+a.p[2]);
    o.rotation.set(
     base.r.x+a.r[0]*D,
     base.r.y+a.r[1]*D,
     base.r.z+a.r[2]*D,
     base.r.order
    );
   }
  }

  function play(id,{fade:f=.2,restart=false}={}) {
   if (!clips[id]) return false;
   if (current && current.id === id && !restart) return true;

   previous = current && f > 0 ? current : null;
   fade = f;
   fadeTime = 0;
   current = {id,time:0,elapsed:0,fresh:true};
   apply();
   return true;
  }

  function stop() {
   current = null;
   previous = null;
   apply();
  }

  function update(dt,{speed=1}={}) {
   if (!current) return;

   const step = Math.max(0,dt)*speed;
   advance(current,step,true);

   if (previous) {
    advance(previous,step,false);
    fadeTime += Math.max(0,dt);
    if (fadeTime >= fade) previous = null;
   }

   apply();
  }

  function on(name,fn) {
   (handlers[name] ??= []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.entries(clips).map(([id,c]) => ({
    id,
    name: c.name || id,
    duration: c.duration,
    loop: c.loop !== false
   }));
  }

  return {
   play,
   stop,
   update,
   on,
   list,
   get playing() {
    return current ? current.id : null;
   }
  };
 }

 // 移動の速さから待機・歩く・走る（乗り物は走行）を選ぶ。アプリの「試してみる」とゲームで共通の判定。
 function pickLocomotion(clips,speed,{walkSpeed=1.2,runSpeed=4}={}) {
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  // 乗り物: 動いていれば走行（車輪の回転は速さに比例）、止まっていれば停止
  if (has('drive') && !has('walk') && !has('run')) {
   return v > .05
    ? {id:'drive',rate:Math.min(5,Math.max(.1,v/walkSpeed))}
    : {id:first('idle'),rate:1};
  }

  if (v < .05) return {id:first('idle'),rate:1};

  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }

  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。setSpeed で移動系を自動選択し、action の一回きりの動きが終わると移動系へ戻る。
 function createController(animator,spec,opts={}) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id,{fade=.12}={}) {
   if (dead || !clips[id]) return false;

   animator.play(id,{fade,restart:true});
   oneShot = {id,left:clips[id].duration};
   loco = undefined;
   if (id === 'die') dead = true;

   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);

   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }

   const next = pickLocomotion(clips,speed,opts);

   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{fade:.2});
    else animator.stop();
   }

   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,
   action,
   update,
   reset,
   get current() {
    return oneShot ? oneShot.id : loco || null;
   },
   get dead() {
    return dead;
   }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.action('attack'); 毎フレーム hero.update(dt);
 function createCharacter(spec,opts={}) {
  const object = buildModel(spec);
  const animator = createAnimator(object,spec);
  const controller = createController(animator,spec,opts);
  const disposeModel = dispose;

  return {
   object,
   animator,
   setSpeed: controller.setSpeed,
   action: controller.action,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() {
    return controller.current;
   },
   dispose() {
    animator.stop();
    if (object.parent) object.parent.remove(object);
    disposeModel(object);
   }
  };
 }

 function getAnchor(root,id) {
  return root.userData.anchors[id] || null;
 }

 return {
  buildGeometry,
  buildMaterial,
  updateMaterial,
  transform,
  buildPart,
  buildModel,
  getAnchor,
  createAnimator,
  pickLocomotion,
  createController,
  createCharacter,
  dispose
 };
}

// ============================================================
// 9. Three.js Scene
// 1本指: 回転 / 2本指: パンとズーム
// PC: 左ドラッグ回転 / 右ドラッグまたはShiftでパン / Wheelズーム
// ============================================================

function initScene() {
 if (!window.THREE) {
  $('renderMessage').textContent =
   '3D表示の仕組みを読み込めませんでした。インターネットにつないで再読み込みしてください。データの編集・保存・書き出しは使えます。';
  $('renderMessage').style.display = 'block';
  return;
 }

 try {
  state.engine = createModelRenderer(THREE);

  const renderer = new THREE.WebGLRenderer({
   antialias: true,
   alpha: false
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  $('viewport').prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42,1,.01,10000);

  const grid = new THREE.GridHelper(
   20,40,0x526f82,0x334654
  );

  const ground = new THREE.Mesh(
   new THREE.PlaneGeometry(1,1),
   new THREE.MeshStandardMaterial({
    color: 0x202936,
    roughness: .9
   })
  );

  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;

  scene.add(
   grid,
   ground,
   new THREE.HemisphereLight(0xbce5ff,0x4d4e5d,.9)
  );

  const key = new THREE.DirectionalLight(0xfff2dc,1.5);
  key.position.set(4,8,5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024,1024);
  key.shadow.bias = -.0003;
  key.shadow.normalBias = .025;
  scene.add(key,key.target);

  const rim = new THREE.DirectionalLight(0x73bfff,1.1);
  rim.position.set(-4,3,-5);
  scene.add(rim);

  state.runtime = {
   renderer,
   scene,
   camera,
   grid,
   ground,
   key,
   rim,
   root: null,
   anchorLayer: new THREE.Group(),
   highlight: null,
   target: new THREE.Vector3(),
   radius: 7,
   theta: .65,
   phi: 1.12,
   pointers: new Map(),
   dragStart: null,
   needsRender: true,
   frame: 0,
   contextLost: false
  };

  scene.add(state.runtime.anchorLayer);

  bindOrbit(renderer.domElement);
  new ResizeObserver(resizeView).observe($('viewport'));

  renderer.domElement.addEventListener('webglcontextlost',e => {
   e.preventDefault();
   state.runtime.contextLost = true;
   $('renderMessage').textContent =
    '3D描画が停止しました。データを保存して再読み込みしてください。';
   $('renderMessage').style.display = 'block';
  });

  resizeView();
  renderLoop();
 } catch (e) {
  $('renderMessage').textContent = '3D初期化に失敗しました: '+e.message;
  $('renderMessage').style.display = 'block';
  state.runtime = null;
 }
}

function resizeView() {
 const r = state.runtime;
 if (!r) return;

 const w = $('viewport').clientWidth;
 const h = $('viewport').clientHeight;

 r.renderer.setSize(w,h);
 r.camera.aspect = w/h;
 r.camera.updateProjectionMatrix();
 invalidate();
}

function invalidate() {
 if (state.runtime) state.runtime.needsRender = true;
}

function renderLoop() {
 const r = state.runtime;
 if (!r) return;

 r.frame = requestAnimationFrame(renderLoop);

 const now = performance.now();
 const dt = Math.min(.1,(now-(r.lastTime || now))/1000);
 r.lastTime = now;

 // 再生中・試し中だけ毎フレーム描き直す（停止中は変化があったときだけ）
 const m = state.motion;

 if (m.animator && !document.hidden && !r.contextLost) {
  if (m.trying && m.tester) {
   m.tester.update(dt);
   r.needsRender = true;
  } else if (m.playing) {
   m.animator.update(dt,{speed:m.speed});
   r.needsRender = true;
  }
 }

 if (!r.needsRender || document.hidden || r.contextLost) return;

 r.needsRender = false;

 r.camera.position.set(
  r.target.x+r.radius*Math.sin(r.phi)*Math.sin(r.theta),
  r.target.y+r.radius*Math.cos(r.phi),
  r.target.z+r.radius*Math.sin(r.phi)*Math.cos(r.theta)
 );
 r.camera.lookAt(r.target);

 r.scene.updateMatrixWorld(true);
 updateMarkers();

 if (r.highlight) r.highlight.update();

 r.renderer.render(r.scene,r.camera);
}

function bindOrbit(canvas) {
 canvas.addEventListener('pointerdown',e => {
  const r = state.runtime;
  canvas.setPointerCapture(e.pointerId);
  r.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  r.dragStart = r.pointers.size === 1
   ? {x:e.clientX,y:e.clientY,moved:false}
   : null;
 });

 canvas.addEventListener('pointermove',e => {
  const r = state.runtime;
  if (!r.pointers.has(e.pointerId)) return;

  const before = [...r.pointers.values()];
  const old = r.pointers.get(e.pointerId);
  const dx = e.clientX-old.x;
  const dy = e.clientY-old.y;

  r.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if (
   r.dragStart
   && Math.hypot(e.clientX-r.dragStart.x,e.clientY-r.dragStart.y) > 5
  ) {
   r.dragStart.moved = true;
  }

  if (r.pointers.size === 1) {
   if (e.buttons === 2 || e.shiftKey) {
    panCamera(dx,dy);
   } else {
    r.theta -= dx*.008;
    r.phi = Math.max(.04,Math.min(Math.PI-.04,r.phi+dy*.008));
   }
  } else {
   const after = [...r.pointers.values()];
   const dist = a => Math.hypot(
    a[0].x-a[1].x,
    a[0].y-a[1].y
   );

   r.radius = Math.max(
    .02,
    Math.min(100000,r.radius*dist(before)/Math.max(1,dist(after)))
   );

   panCamera(dx/2,dy/2);
  }

  invalidate();
 });

 function end(e) {
  const r = state.runtime;

  if (
   e.type === 'pointerup'
   && r.dragStart
   && !r.dragStart.moved
   && r.pointers.size === 1
  ) {
   pickObject(e);
  }

  r.pointers.delete(e.pointerId);
  r.dragStart = null;
 }

 canvas.addEventListener('pointerup',end);
 canvas.addEventListener('pointercancel',end);
 canvas.addEventListener('lostpointercapture',end);
 canvas.addEventListener('contextmenu',e => e.preventDefault());

 canvas.addEventListener('wheel',e => {
  e.preventDefault();
  const r = state.runtime;

  r.radius = Math.max(
   .02,
   Math.min(
    100000,
    r.radius*Math.exp(Math.max(-200,Math.min(200,e.deltaY))*.002)
   )
  );

  invalidate();
 },{passive:false});
}

function panCamera(dx,dy) {
 const r = state.runtime;
 const amount = r.radius*1.1/$('viewport').clientHeight;

 const right = new THREE.Vector3().setFromMatrixColumn(r.camera.matrix,0);
 const up = new THREE.Vector3().setFromMatrixColumn(r.camera.matrix,1);

 r.target.addScaledVector(right,-dx*amount).addScaledVector(up,dy*amount);
}

function fitCamera() {
 const r = state.runtime;
 if (!r || !r.root) return;

 const box = new THREE.Box3().setFromObject(r.root);

 if (box.isEmpty()) {
  box.set(
   new THREE.Vector3(-1,0,-1),
   new THREE.Vector3(1,2,1)
  );
 }

 const size = box.getSize(new THREE.Vector3());
 const span = Math.max(size.x,size.y,size.z,.1);

 box.getCenter(r.target);

 const fov = r.camera.fov*Math.PI/180;
 const fitFov = Math.min(
  fov,
  2*Math.atan(Math.tan(fov/2)*r.camera.aspect)
 );

 r.radius = span*.65/Math.tan(fitFov/2);
 r.theta = .65;
 r.phi = 1.13;

 r.camera.near = Math.max(.001,span/1000);
 r.camera.far = Math.max(1000,span*1000);
 r.camera.updateProjectionMatrix();

 invalidate();
}

function updateStage() {
 const r = state.runtime;
 if (!r) return;

 const box = new THREE.Box3().setFromObject(r.root);
 const size = box.isEmpty()
  ? new THREE.Vector3(2,2,2)
  : box.getSize(new THREE.Vector3());

 const span = Math.max(size.x,size.y,size.z,1);
 const center = box.isEmpty()
  ? new THREE.Vector3()
  : box.getCenter(new THREE.Vector3());

 r.ground.scale.set(span*15,span*15,1);
 r.ground.position.set(
  center.x,
  box.isEmpty() ? -.015 : box.min.y-.015,
  center.z
 );

 r.grid.position.copy(r.ground.position);
 r.grid.position.y += .005;
 r.grid.scale.setScalar(span/4);

 r.key.position.copy(center).add(new THREE.Vector3(span,span*2,span));
 r.key.target.position.copy(center);

 Object.assign(r.key.shadow.camera,{
  left: -span*1.5,
  right: span*1.5,
  top: span*1.5,
  bottom: -span*1.5,
  near: .01,
  far: span*8
 });

 r.key.shadow.camera.updateProjectionMatrix();
 r.key.shadow.normalBias = span*.003;

 setPreviewMode();
}

function setPreviewMode() {
 const r = state.runtime;
 if (!r) return;

 const studio = state.previewMode === 'studio';

 r.scene.background = new THREE.Color(
  studio ? '#171d27' : state.background
 );
 r.grid.visible = !studio && state.showGrid;
 r.ground.visible = true;

 r.key.intensity = studio ? 1.7 : 1.35;
 r.rim.intensity = studio ? 1.25 : .75;
 r.key.shadow.radius = studio ? 4 : 1;

 $('studioBtn').textContent = studio ? '編集表示に戻る' : '仕上がり確認';
 $('gridBtn').textContent = '方眼 '+(state.showGrid ? '✓' : '−');
 $('anchorBtn').textContent = '取付点 '+(state.showAnchors ? '✓' : '−');

 invalidate();
}

function calculateStats(root) {
 const st = {
  parts: Object.keys(state.modelSpec.parts).length,
  objects: 0,
  materials: Object.keys(state.modelSpec.materials).length,
  vertices: 0,
  triangles: 0
 };

 if (root) {
  root.traverse(o => {
   st.objects++;

   if (o.isMesh) {
    st.vertices += o.geometry.attributes.position.count;
    st.triangles += (
     o.geometry.index
      ? o.geometry.index.count
      : o.geometry.attributes.position.count
    )/3;
   }
  });
 }

 return st;
}

function clearHighlight(r) {
 if (!r || !r.highlight) return;

 // r128のBoxHelperにはdispose()が無いため、形状と素材を個別に破棄する
 r.scene.remove(r.highlight);
 r.highlight.geometry?.dispose();
 r.highlight.material?.dispose();
 r.highlight = null;
}

function rebuildScene(candidate) {
 const r = state.runtime;
 if (!r) return;

 clearHighlight(r);

 const old = r.root;
 r.root = candidate || state.engine.buildModel(state.modelSpec);
 r.scene.add(r.root);

 if (old) {
  r.scene.remove(old);
  state.engine.dispose(old);
 }

 // 動きは新しいモデルに合わせて作り直し、停止状態から始める
 resetAnimator();

 buildMarkers();
 updateStage();
 updateHighlight();
 invalidate();
}

// ============================================================
// 10. Selection
// 補助表示はModelSpec/ゲーム向けRendererに混入させない。
// ============================================================

function buildMarkers() {
 const r = state.runtime;

 state.engine.dispose(r.anchorLayer);
 r.anchorLayer.clear();

 for (const id of Object.keys(state.modelSpec.anchors)) {
  const m = new THREE.Mesh(
   new THREE.SphereGeometry(1,8,6),
   new THREE.MeshBasicMaterial({
    color: 0xffc66f,
    depthTest: false
   })
  );

  m.userData.anchorId = id;
  m.renderOrder = 20;
  r.anchorLayer.add(m);
 }
}

function updateMarkers() {
 const r = state.runtime;
 r.anchorLayer.visible = state.showAnchors;

 for (const m of r.anchorLayer.children) {
  const a = r.root.userData.anchors[m.userData.anchorId];
  a.getWorldPosition(m.position);

  let visible = true;
  a.traverseAncestors(o => {
   if (!o.visible) visible = false;
  });

  m.visible = visible;

  m.scale.setScalar(
   r.radius*(state.selectedAnchorId === m.userData.anchorId ? .017 : .01)
  );

  m.material.color.set(
   state.selectedAnchorId === m.userData.anchorId ? 0x65e8ff : 0xffc66f
  );
 }
}

function updateHighlight() {
 const r = state.runtime;
 if (!r) return;

 clearHighlight(r);

 const o = r.root?.userData.parts[state.selectedPartId];

 if (o) {
  r.highlight = new THREE.BoxHelper(o,0x64ddff);
  r.highlight.material.depthTest = false;
  r.highlight.renderOrder = 10;
  r.scene.add(r.highlight);
 }

 invalidate();
}

function selectPart(id) {
 state.selectedPartId = id;
 state.selectedAnchorId = null;
 state.activeTab = 'parts';
 updateHighlight();
 renderPanel();
}

function selectAnchor(id) {
 state.selectedAnchorId = id;
 state.selectedPartId = null;
 state.activeTab = 'parts';
 updateHighlight();
 renderPanel();
}

function pickObject(e) {
 const r = state.runtime;
 const rect = r.renderer.domElement.getBoundingClientRect();
 const ray = new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(
   (e.clientX-rect.left)/rect.width*2-1,
   -(e.clientY-rect.top)/rect.height*2+1
  ),
  r.camera
 );

 const hits = ray.intersectObjects([r.anchorLayer,r.root],true).filter(h => {
  let yes = h.object.visible;
  h.object.traverseAncestors(o => {
   yes = yes && o.visible;
  });
  return yes;
 });

 const anchor = hits.find(h => h.object.userData.anchorId);

 if (anchor) {
  selectAnchor(anchor.object.userData.anchorId);
  return;
 }

 const hit = hits.find(h => h.object.userData.partId);
 if (hit) selectPart(hit.object.userData.partId);
}

// ============================================================
// 10.5 Motion（動き）
// 部品を回す・動かすだけの軽いモーション。ボーンやスキンは使わない。
// ============================================================

const MOTION_KINDS = {
 biped: {
  label: '二足（人・ロボットなど）',
  clips: '待機・歩く・走る・ジャンプ・攻撃',
  roles: ['body','head','armL','armR','legL','legR']
 },
 quad: {
  label: '四足（馬・犬・猫など）',
  clips: '待機・歩く・走る・ジャンプ・攻撃',
  roles: ['body','head','tail','legFL','legFR','legBL','legBR']
 },
 vehicle: {
  label: '乗り物（車・バイクなど）',
  clips: '走行・旋回・跳ねる',
  roles: ['body','wheelFL','wheelFR','wheelBL','wheelBR','steer']
 },
 flyer: {
  label: '飛ぶもの（鳥・ドラゴンなど）',
  clips: '待機・飛ぶ・速く飛ぶ・ジャンプ・攻撃',
  roles: ['body','head','wingL','wingR','tail']
 }
};

const ROLE_RE = {
 body: /body|torso|chassis|hull|barrel|trunk|胴|車体|ボディ/,
 head: /head|skull|頭/,
 tail: /tail|尾|しっぽ/,
 arm: /arm|shoulder|腕/,
 leg: /leg|thigh|脚|足/,
 wheel: /wheel|tire|tyre|車輪|タイヤ/,
 steer: /steer|handle|fork|ハンドル/,
 wing: /wing|翼|羽/
};

const ROLE_INFO = {
 body: {label:'胴（体）',re:ROLE_RE.body},
 head: {label:'頭',re:ROLE_RE.head},
 tail: {label:'尾',re:ROLE_RE.tail},
 armL: {label:'左腕',re:ROLE_RE.arm,side:'L'},
 armR: {label:'右腕',re:ROLE_RE.arm,side:'R'},
 legL: {label:'左脚',re:ROLE_RE.leg,side:'L'},
 legR: {label:'右脚',re:ROLE_RE.leg,side:'R'},
 legFL: {label:'左前脚',re:ROLE_RE.leg,side:'L',end:'F'},
 legFR: {label:'右前脚',re:ROLE_RE.leg,side:'R',end:'F'},
 legBL: {label:'左後脚',re:ROLE_RE.leg,side:'L',end:'B'},
 legBR: {label:'右後脚',re:ROLE_RE.leg,side:'R',end:'B'},
 wheelFL: {label:'左前輪',re:ROLE_RE.wheel,side:'L',end:'F'},
 wheelFR: {label:'右前輪',re:ROLE_RE.wheel,side:'R',end:'F'},
 wheelBL: {label:'左後輪',re:ROLE_RE.wheel,side:'L',end:'B'},
 wheelBR: {label:'右後輪',re:ROLE_RE.wheel,side:'R',end:'B'},
 steer: {label:'前輪の向きを変える部品（ハンドル）',re:ROLE_RE.steer},
 wingL: {label:'左の翼',re:ROLE_RE.wing,side:'L'},
 wingR: {label:'右の翼',re:ROLE_RE.wing,side:'R'}
};

function stopMotion() {
 const m = state.motion;
 m.animator?.stop();
 m.playing = null;
 m.trying = false;
 m.tester?.reset();
 invalidate();
}

function resetAnimator() {
 const r = state.runtime;
 const m = state.motion;

 m.playing = null;
 m.animator = r?.root && state.engine
  ? state.engine.createAnimator(r.root,state.modelSpec)
  : null;

 m.animator?.on('*',e => toast('合図「'+e.event+'」'));

 // 「試してみる」はゲームと同じ切り替え役（createController）を使う
 m.trying = false;
 m.tester = m.animator
  ? state.engine.createController(m.animator,state.modelSpec)
  : null;
}

function playMotion(id) {
 const m = state.motion;

 if (m.playing === id) {
  stopMotion();
 } else {
  assert(m.animator,'3D表示が使えないため、動きを再生できません');
  m.trying = false;
  assert(
   m.animator.play(id,{fade:m.playing ? .25 : 0}),
   '動きが見つかりません: '+id
  );
  m.playing = id;
  invalidate();
 }

 renderPanel();
}

function pruneAnimations(s,ids) {
 for (const a of Object.values(s.animations || {})) {
  ids.forEach(id => {
   if (a.tracks) delete a.tracks[id];
  });
  if (a.spins) a.spins = a.spins.filter(sp => !ids.includes(sp.part));
 }
}

function partDepth(s,id) {
 let depth = 0;
 let parent = s.parts[id].parent;

 while (parent) {
  depth++;
  parent = s.parts[parent]?.parent;
 }

 return depth;
}

function partTraits(p) {
 const text = (p.id+' '+p.name).toLowerCase();
 const tokens = text.split(/[^a-z0-9]+/).filter(Boolean);
 const has = (...list) => list.some(x => tokens.includes(x));
 let side = null;
 let end = null;

 if (has('fl','lf')) {
  side = 'L';
  end = 'F';
 } else if (has('fr','rf')) {
  side = 'R';
  end = 'F';
 } else if (has('hl','bl','rl','lh','lb')) {
  side = 'L';
  end = 'B';
 } else if (has('hr','br','rr','rh','rb')) {
  side = 'R';
  end = 'B';
 }

 if (!side) {
  if (has('l','left') || /左/.test(text)) side = 'L';
  else if (has('r','right') || /右/.test(text)) side = 'R';
 }

 if (!end) {
  if (has('front','fore','f') || /前/.test(text)) end = 'F';
  else if (has('rear','back','hind','b','h') || /後/.test(text)) end = 'B';
 }

 return {text,side,end};
}

// 部品の名前・IDから役割を推測する（関節グループ・上の階層を優先）
function guessRoles(kind) {
 const s = state.modelSpec;
 const all = Object.values(s.parts);
 const info = all.map(p => ({p,...partTraits(p),depth:partDepth(s,p.id)}));
 const used = new Set();
 const result = {};

 for (const role of MOTION_KINDS[kind].roles) {
  const want = ROLE_INFO[role];
  let best = null;
  let bestScore = -Infinity;

  for (const c of info) {
   if (used.has(c.p.id) || !want.re.test(c.text)) continue;

   const side = c.side || (c.p.position[0] < 0 ? 'L' : 'R');
   const end = c.end || (c.p.position[2] >= 0 ? 'F' : 'B');

   if (want.side && side !== want.side) continue;
   if (want.end && end !== want.end) continue;

   const score = (c.p.type === 'group' ? 3 : 0)
    + (/joint|関節/.test(c.text) ? 4 : 0)
    - c.depth*2;

   if (score > bestScore) {
    best = c.p.id;
    bestScore = score;
   }
  }

  if (best) {
   result[role] = best;
   used.add(best);
  }
 }

 // 胴が全体をまとめていない（例: 胴が複数部品に分かれている）ときはモデル全体を揺らす
 if (MOTION_KINDS[kind].roles.includes('body')) {
  const b = result.body;
  if (!b || (kind !== 'vehicle' && descendants(b,s).length < all.length*.5)) {
   result.body = '*';
  }
 }

 return result;
}

function guessKind() {
 const text = Object.values(state.modelSpec.parts)
  .map(p => (p.id+' '+p.name).toLowerCase())
  .join(' ');

 if (ROLE_RE.wheel.test(text)) return 'vehicle';
 if (ROLE_RE.wing.test(text) || /rotor|propeller|プロペラ/.test(text)) return 'flyer';

 const q = guessRoles('quad');
 return ['legFL','legFR','legBL','legBR'].filter(r => q[r]).length >= 3 ? 'quad' : 'biped';
}

function ensureMotionRoles() {
 const m = state.motion;
 const s = state.modelSpec;

 if (m.kindFor !== s.meta.id) {
  m.kind = guessKind();
  m.kindFor = s.meta.id;
  m.roleKey = null;
  m.picks = defaultPicks(m.kind);
 }

 const key = m.kind+'|'+Object.keys(s.parts).join(',');

 if (m.roleKey !== key) {
  m.roles = guessRoles(m.kind);
  m.roleKey = key;
 }
}

function modelHeight() {
 const r = state.runtime;
 if (!r?.root) return 1;

 const size = new THREE.Box3().setFromObject(r.root).getSize(new THREE.Vector3());
 return Math.max(.2,size.y || 1);
}

const cyc = p => Math.sin(p*Math.PI*2);
const hump = p => (1-Math.cos(p*Math.PI*2))/2;
const r3 = v => Math.round(v*1000)/1000;

function waveKeys(dur,fn,n=8) {
 const keys = [];
 for (let i=0;i<=n;i++) keys.push([r3(dur*i/n),fn(i/n).map(r3)]);
 return keys;
}

function poseKeys(dur,list) {
 return list.map(([ph,v]) => [r3(dur*ph),v.map(r3)]);
}

function addTrack(tracks,id,channel,keys) {
 if (!id || !keys) return;

 const t = tracks[id] ??= {};
 const old = t[channel];

 if (
  old
  && old.length === keys.length
  && old.every((k,i) => k[0] === keys[i][0])
 ) {
  t[channel] = old.map((k,i) => [k[0],k[1].map((v,j) => r3(v+keys[i][1][j]))]);
 } else {
  t[channel] = keys;
 }
}

// おまかせ自動生成。R は役割→部品ID（胴は'*'でモデル全体）
function buildMotionClips(kind,R,opt) {
 const s = state.modelSpec;
 const H = opt.height;
 const B = opt.bounce*H;
 const A = 28*opt.stride;
 const bodyAll = R.body === '*';
 const bodyIds = bodyAll
  ? Object.values(s.parts).filter(p => p.parent === null).map(p => p.id)
  : R.body ? [R.body] : [];
 const clips = {};

 const clip = (id,name,base,loop,build) => {
  const d = Math.max(.1,Math.round(base/opt.pace*100)/100);
  const c = {name,duration:d,loop,tracks:{}};

  const k = {
   rot: (pid,fn,n=8) => addTrack(c.tracks,pid,'rotation',waveKeys(d,fn,n)),
   pose: (pid,list) => addTrack(c.tracks,pid,'rotation',poseKeys(d,list)),
   bob: (fn,n=8) => bodyIds.forEach(pid =>
    addTrack(c.tracks,pid,'position',waveKeys(d,fn,n))
   ),
   move: list => bodyIds.forEach(pid =>
    addTrack(c.tracks,pid,'position',poseKeys(d,list))
   ),
   lean: (fn,n=8) => {
    if (!bodyAll) addTrack(c.tracks,R.body,'rotation',waveKeys(d,fn,n));
   },
   tilt: list => {
    if (!bodyAll) addTrack(c.tracks,R.body,'rotation',poseKeys(d,list));
   },
   spin: (pid,deg) => {
    if (pid) (c.spins ??= []).push({part:pid,axis:'x',degPerSec:r3(deg)});
   },
   hit: ph => {
    (c.events ??= []).push([r3(d*ph),'hit']);
   }
  };

  build(k);
  clips[id] = c;
 };

 if (kind === 'biped') {
  clip('idle','待機',2.4,true,k => {
   k.bob(p => [0,.012*B*hump(p),0]);
   k.rot(R.head,p => [3*cyc(p),0,0]);
   k.rot(R.armL,p => [0,0,3*cyc(p)]);
   k.rot(R.armR,p => [0,0,-3*cyc(p)]);
  });
  clip('walk','歩く',1,true,k => {
   k.rot(R.legL,p => [A*cyc(p),0,0]);
   k.rot(R.legR,p => [-A*cyc(p),0,0]);
   k.rot(R.armL,p => [-.8*A*cyc(p),0,0]);
   k.rot(R.armR,p => [.8*A*cyc(p),0,0]);
   k.bob(p => [0,.03*B*hump(p*2),0]);
   k.lean(p => [2,3*cyc(p),0]);
   k.rot(R.head,p => [2*cyc(p*2),0,0]);
  });
  clip('run','走る',.6,true,k => {
   k.rot(R.legL,p => [1.7*A*cyc(p),0,0],12);
   k.rot(R.legR,p => [-1.7*A*cyc(p),0,0],12);
   k.rot(R.armL,p => [-1.4*A*cyc(p),0,0],12);
   k.rot(R.armR,p => [1.4*A*cyc(p),0,0],12);
   k.bob(p => [0,.07*B*hump(p*2),0],12);
   k.lean(p => [10,5*cyc(p),0],12);
   k.rot(R.head,p => [-6+3*cyc(p*2),0,0],12);
  });
  clip('jump','ジャンプ',1,false,k => {
   k.move([[0,[0,0,0]],[.18,[0,-.06*H,0]],[.5,[0,.4*B,0]],[.82,[0,-.04*H,0]],[1,[0,0,0]]]);
   const legs = [[0,[0,0,0]],[.18,[-25,0,0]],[.5,[20,0,0]],[.82,[-20,0,0]],[1,[0,0,0]]];
   k.pose(R.legL,legs);
   k.pose(R.legR,legs);
   const arms = [[0,[0,0,0]],[.18,[30,0,0]],[.5,[-140,0,0]],[.82,[-20,0,0]],[1,[0,0,0]]];
   k.pose(R.armL,arms);
   k.pose(R.armR,arms);
  });
  clip('attack','攻撃',.7,false,k => {
   k.pose(R.armR,[[0,[0,0,0]],[.3,[50,0,0]],[.5,[-110,0,0]],[.75,[-60,0,0]],[1,[0,0,0]]]);
   k.tilt([[0,[0,0,0]],[.3,[0,-15,0]],[.5,[5,20,0]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.5,[0,0,.06*H]],[1,[0,0,0]]]);
   k.hit(.5);
  });
 }

 if (kind === 'quad') {
  clip('idle','待機',3,true,k => {
   k.bob(p => [0,.01*B*hump(p),0]);
   k.rot(R.head,p => [4*cyc(p),0,0]);
   k.rot(R.tail,p => [0,12*cyc(p),0]);
  });
  clip('walk','歩く',1.1,true,k => {
   k.rot(R.legFL,p => [A*cyc(p),0,0]);
   k.rot(R.legBR,p => [A*cyc(p),0,0]);
   k.rot(R.legFR,p => [-A*cyc(p),0,0]);
   k.rot(R.legBL,p => [-A*cyc(p),0,0]);
   k.bob(p => [0,.02*B*hump(p*2),0]);
   k.rot(R.head,p => [5*cyc(p*2),0,0]);
   k.rot(R.tail,p => [0,8*cyc(p),0]);
  });
  clip('run','走る',.55,true,k => {
   const a = 1.6*A;
   k.rot(R.legFL,p => [a*cyc(p),0,0],12);
   k.rot(R.legFR,p => [a*cyc(p-.1),0,0],12);
   k.rot(R.legBL,p => [a*cyc(p-.5),0,0],12);
   k.rot(R.legBR,p => [a*cyc(p-.6),0,0],12);
   k.bob(p => [0,.06*B*hump(p),0],12);
   k.lean(p => [6*cyc(p),0,0],12);
   k.rot(R.head,p => [10*cyc(p),0,0],12);
   k.rot(R.tail,p => [15*cyc(p),0,0],12);
  });
  clip('jump','ジャンプ',1.1,false,k => {
   k.move([[0,[0,0,0]],[.2,[0,-.05*H,0]],[.5,[0,.45*B,0]],[.82,[0,-.03*H,0]],[1,[0,0,0]]]);
   k.tilt([[0,[0,0,0]],[.2,[-12,0,0]],[.5,[0,0,0]],[.75,[10,0,0]],[1,[0,0,0]]]);
   const front = [[0,[0,0,0]],[.2,[-35,0,0]],[.5,[-50,0,0]],[.8,[10,0,0]],[1,[0,0,0]]];
   const back = [[0,[0,0,0]],[.2,[25,0,0]],[.5,[40,0,0]],[.8,[-10,0,0]],[1,[0,0,0]]];
   k.pose(R.legFL,front);
   k.pose(R.legFR,front);
   k.pose(R.legBL,back);
   k.pose(R.legBR,back);
   k.pose(R.head,[[0,[0,0,0]],[.5,[-10,0,0]],[1,[0,0,0]]]);
  });
  clip('attack','攻撃',.8,false,k => {
   k.pose(R.head,[[0,[0,0,0]],[.3,[-25,0,0]],[.5,[30,0,0]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.3,[0,0,-.05*H]],[.5,[0,.03*H,.12*H]],[1,[0,0,0]]]);
   const lift = [[0,[0,0,0]],[.3,[-40,0,0]],[.5,[-20,0,0]],[1,[0,0,0]]];
   k.pose(R.legFL,lift);
   k.pose(R.legFR,lift);
   k.hit(.5);
  });
 }

 if (kind === 'flyer') {
  const W = 25*opt.stride;
  const flap = (k,amp,cycles,n) => {
   k.rot(R.wingL,p => [0,0,amp*cyc(p*cycles)],n);
   k.rot(R.wingR,p => [0,0,-amp*cyc(p*cycles)],n);
  };

  clip('idle','待機',1.6,true,k => {
   flap(k,W,1,8);
   k.bob(p => [0,.03*B*hump(p),0]);
   k.rot(R.head,p => [3*cyc(p),0,0]);
   k.rot(R.tail,p => [0,6*cyc(p),0]);
  });
  clip('walk','飛ぶ',.8,true,k => {
   flap(k,1.6*W,1,12);
   k.bob(p => [0,.04*B*hump(p+.25),0],12);
   k.lean(() => [4,0,0]);
   k.rot(R.tail,p => [5*cyc(p),0,0]);
  });
  clip('run','速く飛ぶ',.45,true,k => {
   flap(k,2*W,1,12);
   k.bob(p => [0,.02*B*hump(p),0],12);
   k.lean(() => [14,0,0]);
  });
  clip('jump','ジャンプ',1.2,false,k => {
   k.move([[0,[0,0,0]],[.2,[0,-.04*H,0]],[.5,[0,.6*B,0]],[1,[0,0,0]]]);
   flap(k,2*W,2,16);
  });
  clip('attack','攻撃',.9,false,k => {
   k.tilt([[0,[0,0,0]],[.3,[-15,0,0]],[.55,[30,0,0]],[1,[0,0,0]]]);
   k.move([[0,[0,0,0]],[.3,[0,.05*H,-.05*H]],[.55,[0,-.05*H,.2*H]],[1,[0,0,0]]]);
   k.pose(R.head,[[0,[0,0,0]],[.55,[25,0,0]],[1,[0,0,0]]]);
   k.pose(R.wingL,[[0,[0,0,0]],[.3,[0,0,40]],[.55,[0,0,-20]],[1,[0,0,0]]]);
   k.pose(R.wingR,[[0,[0,0,0]],[.3,[0,0,-40]],[.55,[0,0,20]],[1,[0,0,0]]]);
   k.hit(.55);
  });
 }

 if (kind === 'vehicle') {
  const wheels = [R.wheelFL,R.wheelFR,R.wheelBL,R.wheelBR];
  const spinAll = (k,rate) => wheels.forEach(w => k.spin(w,360*rate*opt.stride));

  clip('drive','走行',1,true,k => {
   spinAll(k,opt.pace);
   k.bob(p => [0,.006*B*cyc(p*4),0],16);
   k.lean(p => [.8*cyc(p*2),0,0],16);
  });
  clip('turn','旋回',2,true,k => {
   spinAll(k,opt.pace*.7);
   k.pose(R.steer,[[0,[0,22*opt.stride,0]],[1,[0,22*opt.stride,0]]]);
   k.tilt([[0,[0,0,-4]],[1,[0,0,-4]]]);
  });
  clip('bump','跳ねる',.8,false,k => {
   spinAll(k,opt.pace);
   k.move([[0,[0,0,0]],[.2,[0,.1*B,0]],[.45,[0,-.02*H,0]],[.7,[0,.02*H,0]],[1,[0,0,0]]]);
   k.tilt([[0,[0,0,0]],[.2,[-5,0,0]],[.45,[3,0,0]],[1,[0,0,0]]]);
  });
 }

 return clips;
}

function generateMotion() {
 const m = state.motion;
 const s = state.modelSpec;
 const R = {};

 for (const role of MOTION_KINDS[m.kind].roles) {
  const id = m.roles[role];
  if (role === 'body' && id === '*') R.body = '*';
  else if (id && own(s.parts,id)) R[role] = id;
 }

 assert(Object.keys(R).length,'役割に部品を1つ以上選んでください');

 stopMotion();

 const clips = buildMotionClips(m.kind,R,{
  stride: m.stride,
  bounce: m.bounce,
  pace: m.pace,
  height: modelHeight()
 });

 mutate(x => {
  x.animations = {...(x.animations || {}),...clips};
 });

 toast(Object.keys(clips).length+'個の動きを作りました（↶で取り消せます）');

 if (state.motion.animator) playMotion(m.kind === 'vehicle' ? 'drive' : 'walk');
}

// 部品の見た目の範囲を、親から見た座標で求めて関節の位置を決める
function computePivot(id,where) {
 const r = state.runtime;
 assert(r?.root,'3D表示が使えないため、関節の位置を計算できません');

 const o = r.root.userData.parts[id];
 assert(o,'部品が見つかりません: '+id);

 r.root.updateMatrixWorld(true);

 const toParent = new THREE.Matrix4().copy(o.parent.matrixWorld).invert();
 const box = new THREE.Box3();

 o.traverse(n => {
  if (!n.isMesh) return;
  if (!n.geometry.boundingBox) n.geometry.computeBoundingBox();
  const m = new THREE.Matrix4().multiplyMatrices(toParent,n.matrixWorld);
  box.union(n.geometry.boundingBox.clone().applyMatrix4(m));
 });

 assert(!box.isEmpty(),'この部品には形がないため、関節の位置を決められません');

 const c = box.getCenter(new THREE.Vector3());
 const y = where === 'top' ? box.max.y
  : where === 'bottom' ? box.min.y
  : c.y;

 return [c.x,y,c.z].map(v => Math.round(v*10000)/10000);
}

function insertJoint(s,id,pivot) {
 const p = s.parts[id];
 let jointId = id.slice(0,56)+'_joint';

 if (own(s.parts,jointId)) jointId = uid('joint');

 s.parts[jointId] = {
  id: jointId,
  name: p.name+'の関節',
  type: 'group',
  parent: p.parent,
  position: pivot.slice(),
  rotation: [0,0,0],
  scale: [1,1,1],
  visible: true
 };

 // 関節は回転0・倍率1なので、位置を差し引くだけで見た目は変わらない
 p.parent = jointId;
 p.position = p.position.map((v,i) => Math.round((v-pivot[i])*10000)/10000);

 return jointId;
}

function makeJoint(where) {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id),'関節を作る部品を選んでください');

 stopMotion();

 const pivot = computePivot(id,where);
 let jointId = null;

 mutate(s => {
  jointId = insertJoint(s,id,pivot);
 });

 selectPart(jointId);
 toast('関節を作りました。動きはこの関節に付けると付け根から回ります');
}

function autoJoints() {
 const m = state.motion;
 const s = state.modelSpec;

 const ids = [...new Set(
  ['legL','legR','legFL','legFR','legBL','legBR','armL','armR'].map(r => m.roles[r])
 )].filter(id => id && own(s.parts,id) && !/(_joint$|^joint_)/.test(id));

 assert(ids.length,'脚・腕の役割に部品が選ばれていないか、すでに関節があります');

 stopMotion();

 const pivots = ids.map(id => [id,computePivot(id,'top')]);

 mutate(x => pivots.forEach(([id,pv]) => insertJoint(x,id,pv)));

 toast(ids.length+'か所に関節を作りました（↶で取り消せます）');
}

// 動きの指示文の共通部分（モデル・部品一覧・形式・ルール）。tail に依頼内容を付ける。
function motionPromptBase(tail) {

 const s = state.modelSpec;
 const deg = v => Math.round(v*180/Math.PI*10)/10;
 const num = v => Math.round(v*1000)/1000;

 const partLines = Object.values(s.parts).map(p =>
  '- '+p.id
  +' | 名前:'+p.name
  +' | 親:'+(p.parent || 'なし')
  +' | 形:'+(p.type === 'group' ? 'group（関節・まとめ役）' : p.geometry.type)
  +' | 位置:['+p.position.map(num).join(',')+']'
  +' | 回転(度):['+p.rotation.map(deg).join(',')+']'
 ).join('\n');

 const existing = Object.keys(s.animations || {}).join(', ') || 'なし';

 return 'あなたはゲーム用3Dモデルのアニメーション設計者です。次のモデルに動き（animations）を追加してください。\n'
  + 'モデル: '+s.meta.name+'（'+s.meta.id+'）\n'
  + '座標: 単位メートル、+Yが上、+Zが前方。位置・回転は親から見た値。回転はXYZ順のオイラー角。\n'
  + '各部品は自分の「位置」を中心に回ります。脚や腕は、付け根にある group（関節）を回すと自然に動きます。\n'
  + '\n部品一覧:\n'+partLines+'\n'
  + '\n既存の動きID: '+existing+'\n'
  + '\n動きの形式:\n'
  + '{"name":"表示名","duration":秒(0.1〜30),"loop":true/false,'
  + '"tracks":{"部品ID":{"rotation":[[時刻,[x,y,z]],...],"position":[[時刻,[x,y,z]],...]}},'
  + '"spins":[{"part":"部品ID","axis":"x|y|z","degPerSec":数値}],'
  + '"events":[[時刻,"英数字の合図名"]]}\n'
  + 'ルール:\n'
  + '- rotation は基本姿勢からの差分を「度」で、position は差分を「メートル」で書く（0 = いつもの姿勢）。\n'
  + '- 時刻は0〜durationの範囲で小さい順。くり返す動きは最初と最後のキーを同じ値にする。\n'
  + '- 1つの動きのキーは合計300個まで。tracks/spinsの部品IDは上の一覧に実在するものだけ。\n'
  + '- spinsは車輪やプロペラなど回り続ける部品に使う。攻撃が当たる瞬間などは events に "hit" などの合図を入れる。\n'
  + '- 動きIDは英字で始まる英数字・_・-（64文字以内）。部品やその他の項目は変更しない。\n'
  + '\n出力: MODELSTUDIO_PATCH_V1 のJSONのみ。新しい動きは {"op":"add","path":"/animations/動きID","value":{...}}、'
  + '既存の動きIDを作り直す場合は op を "replace" にする。\n'
  + '例: {"format":"MODELSTUDIO_PATCH_V1","operations":[{"op":"add","path":"/animations/wave","value":'
  + '{"name":"手を振る","duration":1,"loop":true,"tracks":{"arm_r":{"rotation":[[0,[0,0,0]],[0.5,[0,0,-60]],[1,[0,0,0]]]}}}}]}\n'
  + '出力はプレーンテキストとし、Markdown・コードフェンス（```）・見出し・説明文は禁止。先頭文字は{、末尾文字は}としてください。\n'
  + tail;
}

// 標準の動きをまとめてAIに頼む指示文
function createMotionPrompt() {
 const m = state.motion;
 const extra = String(state.ai.motion || '').trim();
 const picks = m.picks.filter(id => STANDARD_MOTIONS.some(x => x[0] === id));

 assert(picks.length || extra,'作りたい動きを選ぶか、追加の要望を入力してください');

 const existing = state.modelSpec.animations || {};
 const lines = picks.map(id => {
  const [,label,loop] = STANDARD_MOTIONS.find(x => x[0] === id);
  return '- '+id+'（'+label+'） loop:'+loop
   +(own(existing,id) ? ' / 既存なので op は "replace"' : ' / 新規なので op は "add"');
 }).join('\n');

 return motionPromptBase(
  (picks.length
   ? '\n作る動き（標準ID。ゲーム側がこの名前で呼び出すので、IDは必ずこのとおりにする）:\n'+lines+'\n'
   : '')
  + '\n標準の動きのルール:\n'
  + '- attack には events に "hit"（当たる瞬間）、jump には "land"（着地の瞬間）を入れる。\n'
  + '- jump・attack・hurt・die・emote・bump は loop:false。idle・walk・run・drive・turn は loop:true にし、最初と最後のキーを同じ値にする。\n'
  + '- walk・run・drive はその場での動き（モデル自体を前へ進めない）。移動はゲーム側で行う。\n'
  + '- die は最後のキーを倒れた姿勢にして、その姿勢で止まるようにする。\n'
  + (extra
   ? '\n追加の要望:\n'+extra+'\n（標準以外の動きを追加する場合は、英字で始まる分かりやすいIDを付ける）\n'
   : '')
  + '\nすべての動きを1つの MODELSTUDIO_PATCH_V1 の operations にまとめて出力すること。'
  + '\n出力は MODELSTUDIO_PATCH_V1 のJSONのみ。先頭文字は{、末尾文字は}。'
 );
}

// 既存の動き1つだけをAIに直してもらう指示文
function createMotionFixPrompt() {
 const id = state.motion.fixId;
 const a = state.modelSpec.animations?.[id];
 assert(a,'直す動きが見つかりません');

 const request = String(state.ai.motionFix || '').trim();
 assert(request,'どう直したいか入力してください');

 return motionPromptBase(

const STANDARD_MOTIONS = [

 ['jump','ジャンプ',false],
 ['attack','攻撃',false],

 ['turn','旋回',true],

];

const VEHICLE_MOTIONS = ['drive','turn','bump'];

function defaultPicks(kind) {
 return kind === 'vehicle'

// 脚・腕・翼の回転の中心が付け根から離れていないかを調べる（3D表示がなければ null）
function jointIssues() {
 const r = state.runtime;
 if (!r?.root || !Object.keys(state.modelSpec.parts).length) return null;

 ensureMotionRoles();

 const m = state.motion;
 const out = [];

 r.root.updateMatrixWorld(true);

 for (const role of ['legL','legR','legFL','legFR','legBL','legBR','armL','armR','wingL','wingR']) {
  const id = m.roles[role];
  const o = id && r.root.userData.parts[id];
  if (!o) continue;

  const box = new THREE.Box3().setFromObject(o);
  if (box.isEmpty()) continue;

  const origin = o.getWorldPosition(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const wing = role.startsWith('wing');
  const size = wing ? box.max.x-box.min.x : box.max.y-box.min.y;

  // 付け根: 脚・腕は上端の中心、翼は体に近い側の端
  const pivot = wing
   ? new THREE.Vector3(
     Math.abs(box.min.x) < Math.abs(box.max.x) ? box.min.x : box.max.x,
     center.y,
     center.z
    )
   : new THREE.Vector3(center.x,box.max.y,center.z);

  if (size > 0 && origin.distanceTo(pivot) > size*.25) out.push({role,id});
 }

 return out;
}

function motionReadinessCard() {
 const issues = jointIssues();
 if (issues === null) return '';

 if (!issues.length) {
  return `

 }

 const names = issues.map(i => ROLE_INFO[i.role].label+'（'+i.id+'）').join('、');

function startTry() {

 if (!m.tester) return;

 if (!m.trying) {

 }

 m.tester.setSpeed(m.trySpeed);
 invalidate();
}

function tryAction(id) {

 assert(m.tester,'3D表示が使えないため、試せません');

    ? '倒れています。「起き上がる」を押してください'
