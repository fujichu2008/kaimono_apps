// 同じプロジェクトは更新日時が新しい方を残し、片方にしかないものはすべて残す
function mergeLibrary(base,local) {
 const out = {
  projects: [...base.projects],
  last: base.last ?? local.last ?? null
 };

 for (const p of local.projects) {
  if (!obj(p) || typeof p.projectId !== 'string') continue;

  const i = out.projects.findIndex(q => q.projectId === p.projectId);

  if (i < 0) out.projects.push(p);
  else if (String(p.updatedAt || '') > String(out.projects[i].updatedAt || '')) out.projects[i] = p;
 }

 return out;
}

// 起動時に1回だけ呼ぶ。従来データは移行を確かめてからでないと消さない
async function initLibraryStorage() {
 let raw = null;
 let local = null;

 try {
  raw = localStorage.getItem(STORE);
  if (raw) local = parseLibraryRaw(raw);
 } catch (_) {
  // 読めない従来データは消さずにそのまま残す
  local = null;
 }

 try {
  assert(window.indexedDB,'IndexedDBが使えません');

  libDb = await withTimeout(idbOpen(),4000);
  libDb.onversionchange = () => libDb.close();

  let data = await withTimeout(idbLoadLibrary(),4000);

  if (local) {
   // 統合した結果との差分（追加・更新のみ）をプロジェクト単位で書き込む
   await withTimeout(idbApplyDiff(libraryDiff(data,mergeLibrary(data,local))),8000);

   // 書き込んだ内容を読み直し、従来のプロジェクトがすべて入っていることを確かめる
   const check = await withTimeout(idbLoadLibrary(),4000);
   const ids = new Set(validLibrary(check) ? check.projects.map(p => p?.projectId) : []);

   assert(
    validLibrary(check)
     && local.projects
      .filter(p => obj(p) && typeof p.projectId === 'string')
      .every(p => ids.has(p.projectId)),
    '移行の確認に失敗しました'
   );

   // 従来データの原文を控えとして残してから、localStorage から削除する
   await withTimeout(idbPut(LIB_LEGACY+Date.now(),{savedAt:new Date().toISOString(),raw}),8000);

   // 起動が先に進んでいたら、従来データは消さない（従来方式で保存された分を守る）
   if (libInitAbandoned) throw Error('abandoned');

   try {
    localStorage.removeItem(STORE);
   } catch (_) {}

   data = check;
  }

  if (libInitAbandoned) throw Error('abandoned');

  libraryData = data;
  libraryBackend = 'idb';

  // 別のタブの保存・削除を受け取ったら読み直す
  try {
   if (typeof BroadcastChannel === 'function') {
    libChannel = new BroadcastChannel(LIB_CHANNEL);
    libChannel.onmessage = e => {
     if (e.data?.type === 'library') queueLibraryReload();
    };
   }
  } catch (_) {
   libChannel = null;
  }
 } catch (e) {
  // 時間切れで起動が先に進んでいたら、状態を変えずに接続だけ閉じる
  if (libInitAbandoned) {
   try {
    libDb?.close();
   } catch (_) {}
   libDb = null;
   return;
  }

  if (String(e?.message) === 'timeout') libInitTimedOut = true;

  // IndexedDB が使えない・移行に失敗したときは、従来どおり localStorage で動く
  try {
   libDb?.close();
  } catch (_) {}
  libDb = null;
  libraryBackend = 'local';
  libraryData = local || {projects:[],last:null};
 }
}

function readStore() {
 if (libraryBackend === 'idb') return clone(libraryData);

 const raw = localStorage.getItem(STORE);
 if (!raw) return {projects:[],last:null};

 return parseLibraryRaw(raw);
}

// ライブラリを保存する。完了を待てる Promise を返す。
// localStorage のときはその場で書き込み、失敗すると例外（写しは変えない）
function writeStore(data,{silent=false,forceIds=[]}={}) {
 if (libraryBackend !== 'idb') {
  localStorage.setItem(STORE,JSON.stringify(data));
  libraryData = data;
  return Promise.resolve();
 }

 // 差分は呼び出し時点の写しと比べて決める（他のタブの追加分は削除しない）
 const diff = libraryDiff(libraryData,data);

 // 明示的な保存は、楽観的な写しとの一致にかかわらず対象を必ず書く。
 // 直前の保存が失敗しても、同じ内容の再試行を空の差分にしない。
 const putIds = new Set(diff.puts.map(p => p.projectId));
 for (const id of new Set(forceIds)) {
  const record = data.projects.find(p => p.projectId === id);
  assert(record,'保存対象のプロジェクトが見つかりません');
  if (!putIds.has(id)) {
   diff.puts.push(record);
   putIds.add(id);
  }
 }

 // 待機中に呼び出し元が変更しても、書き込む内容は変えない。
 diff.puts = clone(diff.puts);
 if (diff.last) diff.last = clone(diff.last);

 libraryData = clone(data);
 libPending++;

 const job = libWriteChain.then(async () => {
  try {
   await idbApplyDiff(diff);
  } catch (e) {
   // 後続の保存が待機している間は、その楽観的な写しを消さない。
   // 全要求が完了してから保存先を読み直す。
   libReloadAgain = true;
   throw e;
  }
 });

 libWriteChain = job.catch(() => {});

 const settle = () => {
  libPending--;
  if (!libPending && libReloadAgain) {
   libReloadAgain = false;
   queueLibraryReload();
  }
 };

 job.then(() => {
  settle();
  const ids = [...diff.puts.map(p => p.projectId),...diff.dels];
  if (ids.length || diff.last) postLibraryChange(ids);
 },e => {
  settle();
  if (!silent) {
   showError(Error(
    'ライブラリをIndexedDBに保存できませんでした（'+(e?.message || e)
    +'）。ライブラリの「すべて書き出す」や「ファイルに保存」で控えを取ってください'
   ));
  }
 });

 return job;
}

function storageEstimateText() {
 if (!navigator.storage?.estimate) return '不明';
 if (!storageEstimate) return '計算中…';

 const mb = v => (v/1024/1024).toFixed(1);
 const usage = storageEstimate.usage || 0;
 const quota = storageEstimate.quota || 0;

 return '約'+mb(usage)+'MB'
  + (quota ? ' / 上限の目安 約'+mb(quota)+'MB' : '')
  + (quota && usage > quota*.8 ? '（残りわずかです。使わないモデルを削除してください）' : '');
}

function refreshStorageEstimate() {
 if (!navigator.storage?.estimate || Date.now()-storageEstimateAt < 5000) return;

 storageEstimateAt = Date.now();

 navigator.storage.estimate()
  .then(est => {
   storageEstimate = est;
   document.querySelectorAll('.storage-usage').forEach(el => {
    el.textContent = storageEstimateText();
   });
  })
  .catch(() => {});
}

function saveProject({asNew=false}={}) {
 finishLive();

 const io = state.io;
 let ticket = null;
 let started = false;
 let name = state.modelSpec.meta.name;

 const isCurrent = () => ticket
  && io.session === ticket.session
  && state.projectId === ticket.projectId
  && io.saveSerial === ticket.serial;

 const fail = e => {
  if (!started || isCurrent()) {
   io.libraryError = true;
   io.saving = null;
   state.dirty = true;
   if (started) writeDraft();
   updateHeader();
  }

  showError(Error(
   '「'+name+'」のライブラリ保存に失敗しました: '
   +(e?.message || e)
   +'。「データをコピー」や「ファイルに保存」で控えを取ってください。'
  ));
 };

 try {
  const data = readStore();
  const id = asNew ? uid('project') : state.projectId || uid('project');
  const saved = state.modelSpec;
  const record = {
   projectId: id,
   name: saved.meta.name,
   modelSpec: snapshot(),
   thumb: makeThumbnail(saved)
    || data.projects.find(p => p.projectId === id)?.thumb
    || null,
   updatedAt: new Date().toISOString()
  };

  name = record.name;
  const index = data.projects.findIndex(p => p.projectId === id);
  if (index < 0) data.projects.push(record);
  else data.projects[index] = record;
  data.last = id;

  // 同期的な保存失敗では、別名保存の保存先を切り替えない。
  const pending = writeStore(data,{silent:true,forceIds:[id]});

  if (asNew) beginEditSession();

  state.projectId = id;
  state.projects = data.projects;
  ticket = {
   session: io.session,
   projectId: id,
   serial: ++io.saveSerial,
   spec: saved
  };
  started = true;
  io.saving = ticket;

  const finish = () => {
   const current = isCurrent();

   if (current) {
    io.saving = null;
    io.libraryError = false;
    state.dirty = state.modelSpec !== ticket.spec;
    writeDraft();
    updateHeader();
    if (state.activeTab === 'model') renderPanel();
   }

   renderLibraryGrid();

   let tip = false;
   try {
    tip = !localStorage.getItem(SAVE_TIP);
    if (tip) localStorage.setItem(SAVE_TIP,'1');
   } catch (_) {}

   let message = '「'+name+'」の保存要求時点の内容をライブラリに保存しました。';

   if (current && state.dirty) {
    message += 'その後の編集は未保存です。';
   } else if (!current) {
    message += '現在の編集画面の保存状態は変更していません。';
   }

   if (current && io.draftError) {
    message += '復旧用の一時保存はできていません。';
   }

   if (tip) {
    message += '大切なモデルは「ファイルに保存」でも控えを取ってください。';
   }

   toast(message,tip || !current || state.dirty ? 6000 : 3200);
  };

  if (libraryBackend !== 'idb') {
   finish();
   return pending;
  }

  // 保存開始時にも保存先をDraftへ記録するが、保存済みにはしない。
  writeDraft();
  updateHeader();
  toast('「'+name+'」を保存しています…',8000);
  renderLibraryGrid();

  return pending.then(finish,fail);
 } catch (e) {
  fail(e);
  return Promise.resolve();
 }
}

function writeDraft() {
 const io = state.io;

 if (!state.modelSpec) return false;

 // 原文の退避を確認できなかった起動では、pagehideでも上書きしない。
 if (io.draftBlocked) {
  io.draftError = true;
  updateHeader();
  return false;
 }

 try {
  localStorage.setItem(DRAFT,JSON.stringify({
   projectId: state.projectId,
   modelSpec: state.modelSpec,
   // 未完了のライブラリ保存を、復元後に保存済みと誤認しない。
   dirty: state.dirty || !!io.saving,
   updatedAt: Date.now()
  }));

  io.draftError = false;
  updateHeader();
  return true;
 } catch (e) {
  io.draftError = true;
  showError(Error(
   '復旧用の一時保存ができません。ライブラリ保存の結果とは別のエラーです。'
   +'「データをコピー」や「ファイルに保存」で控えを取ってください。'
  ));
  updateHeader();
  return false;
 }
}

function scheduleDraft() {
 clearTimeout(state.saveTimer);
 state.saveTimer = setTimeout(writeDraft,600);
}

function replaceProject(spec,id=null,dirty=true) {
 validateModelSpec(spec);
 commitSpec(spec,{history:false,fit:true,newSession:true});

 state.projectId = id;
 state.undo = [];
 state.redo = [];
 state.partListOpen = null;
 // 別のモデルに置き換えたら、前のモデルの確認バーは残さない
 state.motion.review = null;
 state.dirty = dirty;

 writeDraft();
 renderPanel();
}

function loadProject(id) {
 const data = readStore();
 const p = data.projects.find(p => p.projectId === id);

 assert(p,'プロジェクトが見つかりません');

 replaceProject(normalizeSpec(p.modelSpec),id,false);
 data.last = id;

 try {
  writeStore(data);
 } catch (e) {
  showError(e);
 }
}

function preserveInvalidDraft(raw) {
 const key = DRAFT+'.recovery.'+uid('raw');

 try {
  localStorage.setItem(key,raw);
  assert(localStorage.getItem(key) === raw,'退避内容を確認できません');
  return key;
 } catch (_) {
  // 退避できなければ、元のDRAFTへの以後の書き込みを止める。
  state.io.draftBlocked = true;
  state.io.draftError = true;
  return null;
 }
}

function restoreProject() {
 let chosen = null;
 let data = {projects:[],last:null};
 let draft = null;
 let opened = '';
 const notices = [];

 try {
  data = readStore();
  state.projects = data.projects;
 } catch (e) {
  notices.push('ライブラリを読み込めません: '+e.message);
  state.io.libraryError = true;
  state.projects = [];
 }

 // ライブラリが読めない場合もDraftの復元は独立して試す。
 try {
  draft = localStorage.getItem(DRAFT);
 } catch (e) {
  state.io.draftBlocked = true;
  state.io.draftError = true;
  notices.push(
   '一時保存の原文を読み取れないため、上書きを停止しました: '+e.message
  );
 }

 if (draft !== null) {
  try {
   // ModelSpec本体の上限に、Draftの管理情報分を加える。
   const d = parseJSON(draft,LIMIT.bytes+4096);
   assert(obj(d),'一時保存の形式が不正です');
   assert(
    d.projectId == null
     || typeof d.projectId === 'string' && d.projectId.length > 0,
    '一時保存の保存先IDが不正です'
   );
   assert(
    d.dirty === undefined || typeof d.dirty === 'boolean',
    '一時保存の保存状態が不正です'
   );

   const spec = normalizeSpec(d.modelSpec);
   validateModelSpec(spec);

   const requestedId = d.projectId ?? null;
   const saved = data.projects.find(p => p.projectId === requestedId);
   const projectId = saved ? requestedId : null;

   // Draftのdirtyだけを信用せず、保存済み内容との一致も確認する。
   let sameAsSaved = false;
   if (saved) {
    try {
     const storedSpec = normalizeSpec(saved.modelSpec);
     validateModelSpec(storedSpec);
     sameAsSaved = JSON.stringify(storedSpec) === JSON.stringify(spec);
    } catch (_) {}
   }

   chosen = {
    spec,
    projectId,
    dirty: !!d.dirty || !sameAsSaved
   };
   opened = '復旧用の一時保存から「'+spec.meta.name+'」を開きました。';
  } catch (e) {
   const backup = preserveInvalidDraft(draft);

   notices.push('一時保存を復元できません: '+e.message);
   notices.push(
    backup
     ? '不正な一時保存の原文をブラウザ内に退避しました（'+backup+'）。'
     : '原文を退避できなかったため、一時保存の上書きを停止しています。'
   );
  }
 }

 // 不正なDraftがあっても、最後に開いた保存済みモデルを試す。
 if (!chosen) {
  const p = data.projects.find(x => x?.projectId === data.last);

  if (p) {
   try {
    assert(
     typeof p.projectId === 'string' && p.projectId.length > 0,
     '保存先IDが不正です'
    );
    const spec = normalizeSpec(p.modelSpec);
    validateModelSpec(spec);

    chosen = {spec,projectId:p.projectId,dirty:false};
    opened = '保存済みの「'+spec.meta.name+'」を開きました。';
   } catch (e) {
    notices.push(
     '最後の保存済みモデルを復元できません: '+e.message
     +'。元のライブラリデータは削除していません。'
    );
   }
  }
 }

 if (!chosen) {
  const spec = sampleSpec();
  validateModelSpec(spec);
  chosen = {spec,projectId:null,dirty:true};
  opened = '代わりに標準サンプルを未保存のモデルとして開きました。';
 }

 state.modelSpec = chosen.spec;
 state.projectId = chosen.projectId;
 state.dirty = chosen.dirty;
 state.selectedMaterialId = Object.keys(chosen.spec.materials)[0];

 state.io.restoreNotice = notices.length
  ? notices.join('\n')+'\n'+opened
  : '';
}

function replaceGuard(fn) {
 if (state.motion.edit?.pending) {
  requestPoseChange(fn,{
   message: state.dirty
    ? '続行するとモデルを置き換えます。未保存のモデル変更も置き換わります。'
      +'ポーズの記録はライブラリへの保存ではありません。現在のモデルを残す場合は、キャンセルして先に記録・保存してください。'
    : '続行するとモデルを置き換えます。現在のモデルにポーズを残す場合は、キャンセルして先に記録・保存してください。'
  });
  return;
 }

 if (state.dirty) {
  askConfirm(
   '未保存の変更を置き換えますか？必要なら先に「保存」してください。',
   fn
  );
 } else {
  fn();
 }
}

function schemaGuide() {
 return `ModelSpec契約: format="MODEL_SPEC_V1"。
meta={name,id,version:1,description}。
settings={unit:"meter",origin:"center-bottom"}。
+Y上、+Z前。originは作者の配置規約であり自動リセンターしない。
回転はXYZ Eulerラジアン。

parts/materials/anchorsは配列ではなくIDキーのObject。
IDは英字開始の英数字/_/-、64文字以内。

各Part={
 id,
 name,
 type:"primitive"または"group",
 parent:nullまたはPart ID,
 position:[x,y,z],
 rotation:[x,y,z],
 scale:[x,y,z],
 visible:true,
 geometry,
 material:Material ID
}。

groupはgeometry/material不要。
位置/回転/scaleは親ローカル。
scaleは正数のみ。
parent循環禁止、深さ32以下。

Material={
 name,
 type:"standard",
 color:"#rrggbb",
 roughness:0〜1,
 metalness:0〜1,
 opacity:0〜1,
 transparent:boolean,
 emissive:"#rrggbb",
 emissiveIntensity:0〜10
}。
不透明度を下げるときtransparent:trueも指定。

Anchor={
 id,
 name,
 parent:nullまたはPart ID,
 position:[x,y,z],
 rotation:[x,y,z]
}。
Anchorはゲーム側でObject3Dとして取得可能。

Geometryは以下のキー/既定値に準拠:
${json(GEO)}

lathe points=[半径,Y]。
extrude points=[X,Y]の自己交差しない輪郭、+Zにdepth押出し、穴/ベベルなし。
tube points=[X,Y,Z]、隣接同一点禁止。
capsuleはY軸、lengthは円筒部分の長さ。
sphere/cylinder/cone/capsule/latheはY軸、torus/planeはXY面。
分割数は整数3〜128、pointsは最大128点。
Part上限300、Material100、Anchor100、推定triangle20万以下。
拡張情報はextensionsに保持し描画の追加機能を捏造しない。
animations（動き）は任意項目。部品を削除・ID変更する場合は、その部品を参照するanimationsのtracks/spins/showも整合させること。
Partは任意で effect:true を持てる（炎・煙・光などの演出用の効果部品。その部品を参照する動きの再生中だけ表示され、待機中などは隠れる）。`;
}

 const guide = [

  '- 対象のゲームコードが提示されていない場合は、推測で修正せず、コードの提示を求める。',
  '- 出力形式は、依頼側（AppStudioなど）の指示に従う。'
 ].join('\n');

 return guide+'\n\n```js\n'+code+'```\n';
}

function applyViewportLayout() {
 document.body.classList.toggle('preview-pinned',state.pinViewport);
 $('pinViewport').checked = state.pinViewport;
}

function setViewportPinned(on) {
 const panel = $('panel');
 const panelTop = panel.getBoundingClientRect().top;
 const oldPanelScroll = panel.scrollTop;

 state.pinViewport = !!on;
 applyViewportLayout();

 if (state.pinViewport) {
  window.scrollTo(0,0);
  panel.scrollTop = Math.max(0,-panelTop);
 } else {
  panel.scrollTop = 0;
  if (oldPanelScroll > 0) {
   window.scrollTo(0,panel.getBoundingClientRect().top+window.scrollY+oldPanelScroll);
  }
 }

 try {
  localStorage.setItem(PIN_VIEW_KEY,state.pinViewport ? '1' : '0');
 } catch (_) {
  toast('表示を変更しました。設定は次回起動時には引き継がれません');
 }

 requestAnimationFrame(resizeView);
}

function closeMoreMenu(returnFocus=false) {
 const menu = $('moreMenu');
 if (!menu.open) return;
 menu.open = false;
 if (returnFocus) menu.querySelector('summary').focus({preventScroll:true});
}

function bindMoreMenu() {
 const menu = $('moreMenu');

 document.addEventListener('click',e => {
  if (!menu.open || menu.contains(e.target)) return;
  closeMoreMenu(menu.contains(document.activeElement));
 });

 document.addEventListener('focusin',e => {

function libraryItems() {
 const q = String(state.libraryQuery || '').trim().toLowerCase();

 const list = state.projects.filter(p => {
  if (!q) return true;
  const meta = p.modelSpec?.meta || {};
  return [p.name,meta.id,meta.description]
   .some(x => String(x ?? '').toLowerCase().includes(q));
 });

 const count = p => Object.keys(p.modelSpec?.parts || {}).length;
 const time = p => String(p.updatedAt || '');

 const sorters = {
  new: (a,b) => time(b).localeCompare(time(a)),
  old: (a,b) => time(a).localeCompare(time(b)),
  name: (a,b) => String(a.name).localeCompare(String(b.name),'ja'),
  parts: (a,b) => count(b)-count(a)
 };

 return list.sort(sorters[state.librarySort] || sorters.new);
}

function libraryDate(v) {
 const d = new Date(v);
 return isNaN(d.getTime())
  ? '不明'
  : d.toLocaleString([],{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

let libraryLegacyKey = null;

function checkLegacyBackups() {
 libraryLegacyKey = null;
 if (libraryBackend !== 'idb' || !libDb) return;

 idbRequest('readonly',s => s.getAllKeys())
  .then(keys => {
   const stamp = k => Number(k.slice(LIB_LEGACY.length)) || 0;
   const list = (keys || [])
    .filter(k => typeof k === 'string' && k.startsWith(LIB_LEGACY))
    .sort((a,b) => stamp(a)-stamp(b));

   libraryLegacyKey = list.length ? list[list.length-1] : null;

   const slot = $('libraryLegacySlot');
   if (slot && state.libraryOpen) {
    slot.innerHTML = libraryLegacyKey ? button('libraryLegacy','移行前の控えを保存') : '';
   }
  })
  .catch(() => {});
}

function saveLegacyBackup() {
 assert(
  libraryBackend === 'idb' && libDb && libraryLegacyKey,
  '移行前の控えが見つかりません'
 );

 const key = libraryLegacyKey;

 idbGet(key)
  .then(rec => {
   assert(obj(rec) && typeof rec.raw === 'string','控えの中身を読み取れません');

   const time = Number(key.slice(LIB_LEGACY.length)) || Date.parse(rec.savedAt) || Date.now();
   const stamp = new Date(time).toISOString().slice(0,10).replace(/-/g,'');

   downloadBlob(rec.raw,'modelstudio_legacy_'+stamp+'.json','application/json');
   toast('移行前の控えを保存しました');
  })
  .catch(e => showError(e));
}

let libraryRenameId = null;
// 同じプロジェクトの名前変更は、先行する要求の完了まで受け付けない。
const renameJobs = new Map();

// 保存に失敗したときは localStorage も state.projects も変えない
function writeLibrary(data) {
 let pending;

 try {
  pending = writeStore(data);
 } catch (_) {
  throw Error('保存領域が足りないため保存できませんでした。既存のデータは変わっていません。使わないモデルを削除してから、もう一度お試しください');
 }

 state.projects = data.projects;
 return pending;
}

function newModelId(base,data) {
 const stem = (validId(base) ? base : 'model').slice(0,40);
 const taken = new Set(data.projects.map(p => p.modelSpec?.meta?.id));
 taken.add(state.modelSpec?.meta?.id);

 let id;
 do {
  id = stem+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 } while (taken.has(id));

 return id;
}

  'このプロジェクトの名前変更を保存中です。完了してからお試しください'
 );

 libraryRenameId = id;

 openDialog(
  '名前を変更',
  `<label>新しい名前

async function applyRename(id,raw) {
 const name = String(raw ?? '').trim();

 assert(name,'名前を入力してください');
 assert(name.length <= 100,'名前は100文字以内にしてください');
 assert(
  !renameJobs.has(id),
  'このプロジェクトの名前変更を保存中です。完了してからお試しください'
 );

 const data = readStore();
 const p = data.projects.find(x => x.projectId === id);
 assert(p,'プロジェクトが見つかりません');

 const spec = normalizeSpec(p.modelSpec);
 spec.meta.name = name;
 validateModelSpec(spec);

 p.name = name;
 p.modelSpec = spec;
 p.updatedAt = new Date().toISOString();

 const io = state.io;
 const ticket = {
  session: io.session,
  projectId: id,
  serial: null,
  startSerial: io.saveSerial,
  editing: state.projectId === id,
  name: state.modelSpec.meta.name,
  nameRevision: io.nameRevision
 };

 // 通常保存との前後関係も、既存のsaveSerialで判定する。
 const current = () => ticket.editing
  && io.session === ticket.session
  && state.projectId === id
  && io.saveSerial === (ticket.serial ?? ticket.startSerial);

 let persisted = false;
 renameJobs.set(id,ticket);

 try {
  // 楽観的な写しが同じ名前でも、対象レコードを必ず永続化する。
  const saving = writeStore(data,{silent:true,forceIds:[id]});
  state.projects = data.projects;

  if (current()) {
   ticket.serial = ++io.saveSerial;
   io.saving = ticket;
   writeDraft();
   updateHeader();
  }

  await saving;
  persisted = true;

  if (current()) {
   io.saving = null;
   io.libraryError = false;
   finishLive();

   // 待機中に名前を編集していたら、元の名前に戻していても上書きしない。
   if (
    io.nameRevision === ticket.nameRevision
    && state.modelSpec.meta.name === ticket.name
   ) {
    const wasDirty = state.dirty;

    if (state.modelSpec.meta.name !== name) {
     mutate(s => {
      s.meta.name = name;
     });
    }

    // 名前以外の未保存変更を維持する。
    state.dirty = wasDirty
     || JSON.stringify(state.modelSpec) !== JSON.stringify(spec);
   } else {
    state.dirty = true;
   }

   writeDraft();
   renderPanel();
  }

  renderLibraryGrid();
  toast('保存したモデルの名前を「'+name+'」に変更しました');
 } catch (e) {
  if (current()) {
   if (io.saving === ticket) io.saving = null;
   io.libraryError = !persisted;

   // 書き込み失敗では編集内容・dirty・履歴を変更しない。
   // 保存後の画面反映だけが失敗した場合は、不一致を未保存として示す。
   if (persisted) state.dirty = true;

   writeDraft();
   updateHeader();
  }

  throw Error(
   (persisted
    ? '名前は保存できましたが、編集画面への反映に失敗しました: '
    : '名前変更を保存できませんでした: ')
   +(e?.message || e)
  );
 } finally {
  if (renameJobs.get(id) === ticket) renameJobs.delete(id);
 }
}

function importLibrary(file) {
 assert(file.size <= 20000000,'ファイルが大きすぎます（20MBまで）');

 file.text()
  .then(text => safe(() => {
   const src = parseJSON(text,20000000);

   assert(
    obj(src) && src.format === 'MODELSTUDIO_LIBRARY_V1' && Array.isArray(src.projects),
    'ライブラリの書き出しファイル（MODELSTUDIO_LIBRARY_V1）を選んでください'
   );

   const data = readStore();
   let added = 0;
   let failed = 0;
   // 既存のプロジェクトと、このファイルから先に追加したモデルの meta.id
   const taken = new Set(data.projects.map(x => x.modelSpec?.meta?.id).filter(Boolean));

   for (const p of src.projects) {
    try {
     assert(obj(p),'形式が不正です');

     const spec = normalizeSpec(p.modelSpec);
     validateModelSpec(spec);

     // 重なるときだけ新しい meta.id に振り直す
     if (taken.has(spec.meta.id)) {
      spec.meta.id = newModelId(spec.meta.id,data);
      validateModelSpec(spec);
     }
     taken.add(spec.meta.id);

     const name = typeof p.name === 'string' && p.name.trim()
      ? p.name.trim().slice(0,100)
      : spec.meta.name;
     const thumb = typeof p.thumb === 'string'
      && /^data:image\/(jpeg|png|webp);base64,/.test(p.thumb)
      ? p.thumb
      : null;
     const updatedAt = typeof p.updatedAt === 'string' && !isNaN(Date.parse(p.updatedAt))
      ? p.updatedAt
      : new Date().toISOString();

     data.projects.push({projectId:uid('project'),name,modelSpec:spec,thumb,updatedAt});
     added++;
    } catch (_) {
     failed++;
    }
   }

   assert(added,'読み込めるモデルがありませんでした（失敗 '+failed+'件）');

   const pending = writeLibrary(data);
   renderLibraryGrid();
   pending.then(
    () => toast(added+'件を追加しました'+(failed ? '（'+failed+'件は読み込めませんでした）' : ''),3200),
    () => {}
   );
  }))
  .catch(() => showError(Error('ファイルを読み込めませんでした。書き出したJSONファイルを選んでください')));
}

// 再描画の前後で、パネル内のフォーカス・選択範囲・スクロール位置を保つ
let panelRenderTimer = null;
let panelRenderDefer = 0;

function panelFocusKey(el) {
 if (el.id) return el.tagName+'#'+el.id;

 const data = [...el.attributes]
  .filter(a => a.name.startsWith('data-'))
  .map(a => a.name+'='+a.value)
  .sort();

 if (data.length) return el.tagName+'['+data.join('][')+']';

 // id も data-* もない summary は、親の details の id で見分ける
 const parent = el.parentElement;

 if (el.tagName === 'SUMMARY' && parent?.tagName === 'DETAILS' && parent.id) {
  return 'SUMMARY@'+parent.id;
 }

 return null;
}

function capturePanelFocus(panel) {
 const info = {tab:state.activeTab,scroll:panel.scrollTop,focus:null};
 const el = document.activeElement;

 if (!el || el === panel || !panel.contains(el)) return info;

 const key = panelFocusKey(el);
 if (!key) return info;

 const same = [...panel.querySelectorAll(el.tagName)].filter(n => panelFocusKey(n) === key);
 let sel = null;

 if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
  try {
   if (typeof el.selectionStart === 'number') sel = [el.selectionStart,el.selectionEnd];
  } catch (_) {}
 }

 info.focus = {tag:el.tagName,key,index:same.indexOf(el),sel};
 return info;
}

function restorePanelFocus(panel,info) {
 if (!info || info.tab !== state.activeTab) return;

 panel.scrollTop = info.scroll;

 const f = info.focus;
 if (!f || f.index < 0) return;

 const same = [...panel.querySelectorAll(f.tag)].filter(n => panelFocusKey(n) === f.key);
 const n = same[f.index];
 if (!n || n.disabled) return;

 n.focus({preventScroll:true});

 if (f.sel) {
  try {
   n.setSelectionRange(f.sel[0],f.sel[1]);
  } catch (_) {}
 }

 panel.scrollTop = info.scroll;
}

function renderPanel() {
 // change の処理中は、Tab によるフォーカス移動が終わってから描き直す
 if (panelRenderDefer) {
  if (panelRenderTimer === null) {
   panelRenderTimer = setTimeout(() => {
    panelRenderTimer = null;
    renderPanel();
   },0);
  }
  return;
 }

 clearTimeout(panelRenderTimer);
 panelRenderTimer = null;

 const views = {
  model: modelPanel,
  parts: partsPanel,
  material: materialPanel,
  motion: motionPanel,
  ai: aiPanel,
  export: exportPanel
 };

 const panel = $('panel');
 const keep = capturePanelFocus(panel);

 panel.innerHTML = stepBar()+views[state.activeTab]();
 restorePanelFocus(panel,keep);

 document.querySelectorAll('[data-tab]').forEach(b => {
  b.classList.toggle('active',b.dataset.tab === state.activeTab);
 });

 updateHeader();
}

async function copyText(text,message='コピーしました') {
 try {
  assert(navigator.clipboard && window.isSecureContext,'fallback');
  await navigator.clipboard.writeText(text);
  if (message) toast(message);
  return true;
 } catch (e) {
  const t = document.createElement('textarea');
  let ok = false;

  t.value = text;
  t.style.cssText = 'position:fixed;left:0;top:0;opacity:0';

  try {
   document.body.appendChild(t);
   t.focus();
   t.select();
   ok = document.execCommand('copy') === true;
  } catch (_) {
   ok = false;
  } finally {
   t.remove();
  }

  if (ok) {
   if (message) toast(message);
   return true;
  }

  manualCopy(text);
  return false;
 }
}

// ============================================================
// 16. Event Handlers
// イベントは振り分け中心とし、処理本体は上記の関数へ分離。
// ============================================================

function handleEdit(el,live=false) {
 const d = el.dataset;

 let value = el.type === 'checkbox'
  ? el.checked
  : el.type === 'number' || el.type === 'range'
   ? (el.value === '' ? NaN : Number(el.value))
   : el.value;

 if (d.key === 'parent') value = value || null;
 if (d.key === 'rotation') value = value*Math.PI/180;

 const index = d.index === undefined ? null : Number(d.index);

 if (d.key === 'parent') {
  mutate(s => s[d.edit][d.id].parent = value);
 } else {
  editDirect(d.edit,d.id,d.key,value,index,live);
 }

 if ($('out_'+d.key)) $('out_'+d.key).value = value;
}

// change の中で起きたパネルの再描画は、フォーカス移動の後へ遅らせる
function handleChange(e) {
 const el = e.target;
 const d = el.dataset;

 if (
  state.motion.edit?.pending
  && (d.edit === 'parts' || d.geotype || d.dim)
 ) {
  // 確認中の再描画から、変更した値を独立して保持する。
  const target = el.cloneNode(true);
  target.value = el.value;
  target.checked = el.checked;

  requestPoseChange(
   () => handleChange({target}),
   {onCancel: () => renderPanel()}
  );
  return;
 }

 panelRenderDefer++;

 try {
  return handleChangeNow(e);
 } finally {
  panelRenderDefer--;
 }
}

function handleChangeNow(e) {
 const el = e.target;
 const d = el.dataset;

 if (el.id === 'librarySort') {
  state.librarySort = el.value;
  renderLibraryGrid();
  return;
 }

 if (el.id === 'libraryFile') {
  const file = el.files?.[0];
  el.value = '';
  if (file) safe(() => importLibrary(file));
  return;
 }

 if (d.live) {
  finishLive();
  return;
 }

 if (d.edit) {
  const result = safe(() => handleEdit(el));
  renderPanel();
  return result;
 }

 if (d.meta) {
  safe(() => mutate(s => s.meta[d.meta] = el.value));
  renderPanel();
 } else if (el.id === 'materialSelect') {
  state.selectedMaterialId = el.value;
  renderPanel();
 } else if (el.id === 'motionKind') {
  state.motion.kind = el.value;
  state.motion.roleKey = null;
  state.motion.picks = defaultPicks(el.value);
  renderPanel();
 } else if (d.role) {
  state.motion.roles[d.role] = el.value;
 } else if (d.draft) {
  const draft = state.ai.motionDraft;

  draft[d.draft] = el.type === 'checkbox' ? el.checked : el.value;

  if (d.draft === 'id') applyDraftDefaults();
  scheduleQueueSave();
  if (d.draft === 'id' || d.draft === 'ref') renderPanel();
 } else if (d.draftPart) {
  const draft = state.ai.motionDraft;
  const all = usableRoles().map(x => x[0]);
  const on = new Set(draft.parts || all);

  if (el.checked) on.add(d.draftPart);
  else on.delete(d.draftPart);

  draft.parts = all.filter(r => on.has(r));
  scheduleQueueSave();
 } else if (d.batch) {
  state.ai.batchSize = [2,3,4,6].includes(Number(el.value)) ? Number(el.value) : 3;
  saveQueue();
  renderPanel();
 } else if (d.etime) {
  // 指を離したら、キーの有無などの表示を更新する
  renderPanel();
 } else if (el.id === 'editFine') {
  if (state.motion.edit) state.motion.edit.fine = el.checked;
 } else if (el.id === 'dragMove' || el.id === 'dragSnap') {
  if (el.id === 'dragMove') state.dragMove = el.checked;
  else state.dragSnap = el.checked;
  saveDragPrefs();
 } else if (el.id === 'paintOnly') {
  state.paintOnly = el.checked;
 } else if (d.geotype) {
  safe(() => changeGeoType(el.value));
 } else if (d.dim) {
  safe(() => setDimension(d.dim,d.dimi === '' ? null : Number(d.dimi),Number(el.value)));
 } else if (el.id === 'fileInput') {
  const file = el.files?.[0];
  el.value = '';
  if (file) safe(() => openFile(file));
 } else if (el.id === 'background') {
  state.background = el.value;
  setPreviewMode();
 } else if (el.id === 'pinViewport') {
  setViewportPinned(el.checked);
 }
}

function handleInput(e) {
 const d = e.target.dataset;

 if (
  state.motion.edit?.pending
  && (d.etime || d.motion === 'trySpeed')
 ) {
  const target = e.target.cloneNode(true);
  target.value = e.target.value;

  // 回答待ちの間は、スライダーと数値表示も現在の編集状態へ戻す。
  const value = d.etime ? state.motion.edit.time : state.motion.trySpeed;
  e.target.value = value;

  const out = $(d.etime ? 'editTimeOut' : 'out_m_trySpeed');
  if (out) out.value = d.etime ? r3(value) : value;

  // 連続input中も、保留する操作と確認ダイアログは1つだけ。
  requestPoseChange(() => {
   handleInput({target});
   renderPanel();
  });
  return;
 }

 if (e.target.id === 'librarySearch') {
  state.libraryQuery = e.target.value;
  renderLibraryGrid();
  return;
 }

 if (d.ai) {
  state.ai[d.ai] = e.target.value;
  if (d.ai === 'batchNote') scheduleQueueSave();
 } else if (
  d.draft
  && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')
  && e.target.type !== 'checkbox'
 ) {
  state.ai.motionDraft[d.draft] = e.target.value;
  scheduleQueueSave();
 } else if (d.beatT !== undefined) {
  const beat = state.ai.motionDraft.beats[Number(d.beatT)];
  if (beat) beat[0] = e.target.value;
  scheduleQueueSave();
 } else if (d.beatD !== undefined) {
  const beat = state.ai.motionDraft.beats[Number(d.beatD)];
  if (beat) beat[1] = e.target.value;
  scheduleQueueSave();
 } else if (d.motion) {
  state.motion[d.motion] = Number(e.target.value);
  const out = $('out_m_'+d.motion);
  if (out) out.value = e.target.value;
  if (d.motion === 'trySpeed') startTry();
 } else if (d.etime) {
  // 手で直す: 時間スライダーを動かしている間は姿勢の表示だけを更新する
  const ed = state.motion.edit;

  if (ed) {
   ed.time = Number(e.target.value) || 0;
   ed.pending = null;
   const out = $('editTimeOut');
   if (out) out.value = r3(ed.time);
   showEditPose();
  }
 } else if (d.escale) {
  const ed = state.motion.edit;

  if (ed) {
   ed[d.escale] = Number(e.target.value) || 1;
   const out = $(d.escale === 'len' ? 'editLenOut' : 'editAmpOut');
   if (out) out.value = ed[d.escale];
  }
 } else if (d.dim) {
  // 形の寸法は指を離したときに反映する（ここでは数値表示だけ更新）
  const out = $('dim_'+d.dim+'_'+(d.dimi || 'v'));
  if (out) out.value = e.target.value;
 } else if (d.live) {
  safe(() => handleEdit(e.target,true));
 }
}

function handleKeyboard(e) {
 if ($('startupSplash')) return;

 if ($('moreMenu').open && e.key === 'Escape') {
  e.preventDefault();
  closeMoreMenu(true);
  return;
 }

 if (!$('modal').hidden) {
  // 名前変更の入力欄では Enter で確定する（IME変換中は除く）
  if (
   e.key === 'Enter'
   && e.target.id === 'renameText'
   && !e.isComposing
   && e.keyCode !== 229
  ) {
   e.preventDefault();
   actions.doRename();
   return;
  }

  if (e.key === 'Escape') closeDialog();

  if (e.key === 'Tab') {
   const nodes = [
    ...$('modal').querySelectorAll('button,textarea,input,select')
   ].filter(n => !n.disabled);

   const first = nodes[0];
   const last = nodes[nodes.length-1];

   if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
   } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
   }
  }

  return;
 }

 // ライブラリ表示中は、Escで閉じる以外のショートカットを受け取らない
 if (state.libraryOpen) {
  if (e.key === 'Escape') {
   e.preventDefault();
   closeLibrary();
  }
  return;
 }

 if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

 // メニュー操作中は試遊の移動キーを受け取らない
 if ($('moreMenu').open) return;

 // 試遊中は W/A/S/D・矢印キーで操作する
 if (state.motion.walk && WALK_KEYS.includes(e.key.toLowerCase())) {
  e.preventDefault();
  state.walkKeys[e.key.toLowerCase()] = true;
  return;
 }

 if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
  e.preventDefault();
  const redo = e.shiftKey;
  requestPoseChange(() => safe(() => undoRedo(redo)));
 }
}

  if (level === 'easy' || level === 'pro') state.uiLevel = level;
  state.pinViewport = localStorage.getItem(PIN_VIEW_KEY) === '1';
 } catch (_) {}

 try {
  const drag = JSON.parse(localStorage.getItem(DRAG_KEY) || 'null');

  if (obj(drag)) {
   if (typeof drag.on === 'boolean') state.dragMove = drag.on;
   if (['vertical','horizontal'].includes(drag.mode)) state.dragMode = drag.mode;
   // snap が無い古い保存データは、吸着オンとして扱う
   if (typeof drag.snap === 'boolean') state.dragSnap = drag.snap;
  }
 } catch (_) {}

 applyViewportLayout();
 bindMoreMenu();

 restoreProject();
 initScene();

 safe(() => {
  rebuildScene();
  state.stats = calculateStats(state.runtime?.root);
  fitCamera();
 });

 renderPanel();

 // init中のsafe()で復元時の案内が消えないよう、初期描画後に表示する。
 if (state.io.restoreNotice) {
  showError(Error(state.io.restoreNotice));
 }

 document.addEventListener('click',handleClick);
 document.addEventListener('input',handleInput);
 document.addEventListener('change',handleChange);
 document.addEventListener('keydown',handleKeyboard);

 document.addEventListener('keyup',e => {
  state.walkKeys[String(e.key).toLowerCase()] = false;
 });

 window.addEventListener('blur',resetWalkInput);

 // 折りたたみの開閉をユーザーが操作したときだけ覚える（summary のクリックで判定）
 document.addEventListener('click',e => {
  const summary = e.target.closest?.('summary');
  const details = summary?.parentElement;
  if (!details) return;

  if (details.id === 'partList') state.partListOpen = !details.open;
  if (details.id === 'queueDetails') state.ai.queueOpen = !details.open;
  if (details.id === 'autoDetails') state.motion.autoOpen = !details.open;

  const motionCard = {readyDetails:'ready',aiDetails:'ai',tryDetails:'try',fxDetails:'fx'}[details.id];
  if (motionCard) state.motion.openCards[motionCard] = !details.open;
 },true);

 document.addEventListener('focusout',e => {
  if (e.target.dataset.live) finishLive();
 });

 document.addEventListener('visibilitychange',() => {
  if (document.hidden) {
   finishLive();
   writeDraft();
   resetWalkInput();
  } else {
   invalidate();
  }
 });

 window.addEventListener('pagehide',writeDraft);

 // 起動タイトルが消えてから、初回案内を表示する
 startupSplashDone.then(() => {
  try {
   if (!localStorage.getItem(GUIDE)) {
    // 保存したモデルも一時保存もない初回は、ひな形の選択から始める
    const fresh = !state.projects.length && !localStorage.getItem(DRAFT);

    if (fresh) {
     localStorage.setItem(GUIDE,'1');
     showNewDialog(true);
    } else {
     showGuide();
    }
   }
  } catch (_) {
   showGuide();
  }
 });
}

// タイトルの初回描画後、終了を待たずに準備する。
// タイトルの除去は独立したタイマーなので、初期化エラーでも解除される。
// ここまで本体スクリプトの読み込みが完了した
window.__msStage = 'main-loaded';

// ライブラリの保存先（IndexedDB）を準備し、従来データを移行してから初期化する。
// 準備が6秒を超えたら、従来の保存方式（localStorage）で起動を続ける
startupPainted
 .then(() => {
  window.__msStage = 'lib';
  return withTimeout(initLibraryStorage(),6000).catch(() => {
   libInitAbandoned = true;
   libraryBackend = 'local';
  });
 })
 .catch(() => {})
 .then(() => {
  try {
   window.__msStage = 'init';
   init();
   window.__msStage = 'ready';
  } catch (e) {
   // アプリ側で捕まえたエラーは詳細が隠されないので、発生箇所も含めて残す
   const stack = String(e && e.stack || '').split('\n').slice(0,2).join(' / ');
   reportStartupError(
    '起動処理のエラー: '+(e && e.message ? e.message : e)+(stack ? '（'+stack+'）' : '')
   );
  } finally {
   // 成功・失敗にかかわらず、スプラッシュを閉じられる状態にする
   startupReadyMark();
  }

  if (libInitAbandoned || libInitTimedOut) {
   setTimeout(() => {
    toast(
     '保存用データベースを開けなかったため、今回は従来の保存方式で動いています。'
     + 'ライブラリが空に見えてもデータは消えていません。ほかのタブや画面を閉じてから再読み込みしてください',
     8000
    );
   },1600);
  }
 });
</script>
