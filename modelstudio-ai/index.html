// 標準の動きをまとめてAIに頼む指示文
function createMotionPrompt() {
 const m = state.motion;
 const extra = String(state.ai.motion || '').trim();
 const picks = m.picks.filter(id => STANDARD_MOTIONS.some(x => x[0] === id));

 assert(picks.length || extra,'作りたい動きを選ぶか、追加の要望を入力してください');

 const existing = state.modelSpec.animations || {};
 const lines = picks.map(id => {
  const [,label,loop] = STANDARD_MOTIONS.find(x => x[0] === id);
  return '- '+id+'（'+label+'） loop:'+loop
   +(own(existing,id) ? ' / 既存なので op は "replace"' : ' / 新規なので op は "add"');
 }).join('\n');

 return motionPromptBase(
  (picks.length
   ? '\n作る動き（標準ID。ゲーム側がこの名前で呼び出すので、IDは必ずこのとおりにする）:\n'+lines+'\n'
   : '')
  + '\n標準の動きのルール:\n'
  + '- attack には events に "hit"（当たる瞬間）、jump には "land"（着地の瞬間）を入れる。\n'
  + '- jump・attack・hurt・die・emote・bump は loop:false。idle・walk・run・drive・turn は loop:true にし、最初と最後のキーを同じ値にする。\n'
  + '- walk・run・drive はその場での動き（モデル自体を前へ進めない）。移動はゲーム側で行う。\n'
  + '- die は最後のキーを倒れた姿勢にして、その姿勢で止まるようにする。\n'
  + (extra
   ? '\n追加の要望:\n'+extra+'\n（標準以外の動きを追加する場合は、英字で始まる分かりやすいIDを付ける）\n'
   : '')
  + '\nすべての動きを1つの MODELSTUDIO_PATCH_V1 の operations にまとめて出力すること。'
  + '\n出力は MODELSTUDIO_PATCH_V1 のJSONのみ。先頭文字は{、末尾文字は}。'
 );
}

 if (m.walk || m.edit) stopMotion();

// 割り当て中・手で直す編集中に3D画面でタップされた部品を受け取る
function handleMotionPick(id) {
 const m = state.motion;
 const s = state.modelSpec;
 if (!own(s.parts,id)) return;

 if (m.assignRole) {
  const role = m.assignRole;
  const p = s.parts[id];
  // 親が group（関節）なら、関節を優先する
  const pick = p.parent && s.parts[p.parent]?.type === 'group' ? p.parent : id;

  m.roles[role] = pick;
  endAssign();
  renderPanel();
  toast('「'+ROLE_INFO[role].label+'」に「'+s.parts[pick].name+'」を割り当てました');
  return;
 }

 if (m.edit) {
  if (m.edit.partId === id) return;

  requestPoseChange(() => {
   if (!m.edit || !own(state.modelSpec.parts,id)) return;
   m.edit.partId = id;
   m.edit.pending = null;
   showEditPose();
   renderPanel();
  });
 }
}

// ユーザー操作の入口だけで未記録ポーズを確認する。
// 記録後の再構築・refreshEdit・showEditPoseには確認処理を入れない。
// poseTransitionは、同じ本体スクリプト内の既存宣言を共用する。

function requestPoseChange(run,{message='',onCancel=null}={}) {
 if (poseTransition) return false;

 const edit = state.motion.edit;
 if (!edit?.pending) {
  run();
  return true;
 }

 // DOMノード自体を保持し、貼り付け欄などの現在の入力値も維持する。
 const prior = {
  hidden: $('modal').hidden,
  title: $('dialogTitle').textContent,
  body: [...$('dialogBody').childNodes],
  actions: [...$('dialogActions').childNodes],
  action: state.modalAction,
  returnTo: state.modalReturn,
  focus: document.activeElement
 };

 poseTransition = {
  edit,
  session: state.io.session,
  run,
  onCancel,
  prior
 };

 state.modalAction = null;

 openDialog(
  '未記録のポーズがあります',
  `<p>現在の姿勢を記録してから続けますか？</p>
   ${message ? `<p class="warnbox">${esc(message)}</p>` : ''}
   <p class="hint">
    「破棄して続行」は未記録の姿勢だけを破棄します。
    「キャンセル」は元の編集へ戻ります。
   </p>
   <p id="poseTransitionError" class="error" hidden></p>`,
  button('poseCancel','キャンセル')
   +button('poseDiscard','破棄して続行')
   +button('poseRecord','記録して続行','primary')
 );

 return false;
}

function restorePoseDialog(prior) {
 $('dialogTitle').textContent = prior.title;
 $('dialogBody').replaceChildren(...prior.body);
 $('dialogActions').replaceChildren(...prior.actions);
 $('modal').hidden = prior.hidden;
 state.modalAction = prior.action;
 state.modalReturn = prior.returnTo;

 if (prior.focus && document.contains(prior.focus)) {
  prior.focus.focus({preventScroll:true});
 }
}

function resolvePoseChange(choice) {
 const task = poseTransition;
 if (!task) return;

 const stillCurrent = state.io.session === task.session
  && state.motion.edit === task.edit;

 if (choice !== 'cancel' && !stillCurrent) {
  poseTransition = null;
  restorePoseDialog(task.prior);
  showError(Error('編集対象が変わったため、保留していた操作を中止しました。'));
  return;
 }

 if (choice === 'record') {
  const pending = clone(task.edit.pending);

  try {
   recordEditKey();
  } catch (e) {
   // 検証・記録に失敗した場合、続行せず調整中の姿勢を残す。
   if (state.motion.edit === task.edit) {
    task.edit.pending = pending;
    showEditPose();
   }

   const box = $('poseTransitionError');
   if (box) {
    box.hidden = false;
    box.textContent = e.message || String(e);
   } else {
    showError(e);
   }
   return;
  }
 } else if (choice === 'discard') {
  task.edit.pending = null;
  showEditPose();
 }

 poseTransition = null;
 restorePoseDialog(task.prior);

 if (choice === 'cancel') {
  if (stillCurrent && task.onCancel) safe(task.onCancel);
  return;
 }

 safe(task.run);
}

// 確認済みの操作を再実行する。記録・破棄後はpendingがないので再確認しない。
function guardPoseClick(b) {
 const action = b.dataset.action;

 if (poseTransition) {
  return !['poseRecord','poseDiscard','poseCancel','close'].includes(action);
 }

 if (!state.motion.edit?.pending) return false;

 const dataKeys = [
  'editClip','play','try','assign','ekeyt','ekey','estep',
  'paint','visible','nudge'
 ];
 const actionKeys = [
  'undo','redo','stopMotion','editClose','editDeleteKey',
  'editApplyLen','editApplyAmp','walkToggle','walkStop','tryReset',
  'generateMotion','autoJoints','makeJoint','mirror','reviewFix',
  'doImport','pasteImport'
 ];

 const destructive = dataKeys.some(k => b.dataset[k] !== undefined)
  || actionKeys.includes(action);

 if (!destructive) return false;

 // 記録によるパネル再描画で、関節位置の選択が既定値に戻るのを防ぐ。
 const jointAt = action === 'makeJoint' ? $('jointAt')?.value : null;
 const message = ['doImport','pasteImport'].includes(action)
  ? '読み込むデータによっては、モデル全体が置き換わります。'
  : '';

 requestPoseChange(() => {
  if (jointAt !== null && $('jointAt')) $('jointAt').value = jointAt;
  handleClick({target:b});
 },{message});

 return true;
}

  const pending = clone(task.edit.pending);

  try {
   recordEditKey();
  } catch (e) {
   // 検証・記録に失敗した場合、続行せず調整中の姿勢を残す。
   if (state.motion.edit === task.edit) {
    task.edit.pending = pending;
    showEditPose();
   }

   const box = $('poseTransitionError');
   if (box) {
    box.hidden = false;
    box.textContent = e.message || String(e);
   } else {
    showError(e);
   }
   return;
  }
 } else if (choice === 'discard') {
  task.edit.pending = null;
  showEditPose();
 }

 poseTransition = null;
 restorePoseDialog(task.prior);

 if (choice === 'cancel') {
  if (stillCurrent && task.onCancel) safe(task.onCancel);
  return;
 }

 safe(task.run);
}

// 確認済みの操作を再実行する。記録・破棄後はpendingがないので再確認しない。
function guardPoseClick(b) {
 const action = b.dataset.action;

 if (poseTransition) {
  return !['poseRecord','poseDiscard','poseCancel','close'].includes(action);
 }

 if (!state.motion.edit?.pending) return false;

 const dataKeys = [
  'editClip','play','try','assign','ekeyt','ekey','estep',
  'paint','visible','nudge'
 ];
 const actionKeys = [
  'undo','redo','stopMotion','editClose','editDeleteKey',
  'editApplyLen','editApplyAmp','walkToggle','walkStop','tryReset',
  'generateMotion','autoJoints','makeJoint','mirror','reviewFix',
  'doImport','pasteImport'
 ];

 const destructive = dataKeys.some(k => b.dataset[k] !== undefined)
  || actionKeys.includes(action);

 if (!destructive) return false;

 // 記録によるパネル再描画で、関節位置の選択が既定値に戻るのを防ぐ。
 const jointAt = action === 'makeJoint' ? $('jointAt')?.value : null;
 const message = ['doImport','pasteImport'].includes(action)
  ? '読み込むデータによっては、モデル全体が置き換わります。'
  : '';

 requestPoseChange(() => {
  if (jointAt !== null && $('jointAt')) $('jointAt').value = jointAt;
  handleClick({target:b});
 },{message});

 return true;
}

function toggleEdit(id) {
 const m = state.motion;

 if (m.edit?.clipId === id) {
  stopMotion();
  renderPanel();
  return;
 }

 assert(m.animator,'3D表示が使えないため、手で直せません');
 assert(state.modelSpec.animations?.[id],'動きが見つかりません');

 stopMotion();

 m.edit = {clipId:id,time:0,partId:null,fine:false,pending:null,lastPart:null,len:1,amp:1};
 showEditPose();
 renderPanel();
}

// 編集の後片付け（手で当てた部品を基本姿勢へ戻す）。再生の停止は呼び出し側（stopMotion）が行う
function endEdit() {
 const m = state.motion;
 const e = m.edit;
 if (!e) return;

 m.edit = null;

 const parts = state.runtime?.root?.userData.parts;

 if (parts) {
  for (const id of [e.lastPart,e.partId]) {
   if (id && parts[id] && state.modelSpec.parts[id]) {
    state.engine.transform(parts[id],state.modelSpec.parts[id]);
   }
  }
 }
}

// モデルが作り直されたとき（resetAnimator の最後）に編集の表示を合わせ直す
function refreshEdit() {
 const m = state.motion;
 const e = m.edit;
 if (!e) return;

 const a = state.modelSpec.animations?.[e.clipId];

 if (!a || !m.animator) {
  m.edit = null;
  return;
 }

 e.time = Math.min(e.time,a.duration);

 if (e.partId && !own(state.modelSpec.parts,e.partId)) {
  e.partId = null;
  e.pending = null;
 }

 // 新しいモデルには、まだ手で当てた部品はない
 e.lastPart = null;
 showEditPose();
}

// その時刻の姿勢を表示し、選んだ部品に pending（差分）を当てる
function showEditPose() {
 const m = state.motion;
 const e = m.edit;
 const r = state.runtime;
 if (!e || !m.animator || !r?.root) return;

 const parts = r.root.userData.parts;
 const spec = state.modelSpec.parts;

 // 前に手で当てた部品を基本姿勢へ戻してから、動きの姿勢を当て直す
 for (const id of [e.lastPart,e.partId]) {
  if (id && parts[id] && spec[id]) state.engine.transform(parts[id],spec[id]);
 }

 m.animator.seek(e.clipId,e.time);

 if (e.partId && e.pending && parts[e.partId] && spec[e.partId]) {
  const o = parts[e.partId];
  const p = spec[e.partId];
  const D = Math.PI/180;

  o.position.set(
   p.position[0]+e.pending.pos[0],
   p.position[1]+e.pending.pos[1],
   p.position[2]+e.pending.pos[2]
  );
  o.rotation.set(
   p.rotation[0]+e.pending.rot[0]*D,
   p.rotation[1]+e.pending.rot[1]*D,
   p.rotation[2]+e.pending.rot[2]*D
  );
 }

 e.lastPart = e.partId;
 r.root.updateMatrixWorld(true);
 invalidate();
}

// 選んだ部品の、その時刻の差分（回転=度、位置=m）を表示から読み取る
function currentOffset() {
 const e = state.motion.edit;
 const r = state.runtime;

 e.pending = null;
 showEditPose();

 const o = r.root.userData.parts[e.partId];
 const p = state.modelSpec.parts[e.partId];
 const DEG = 180/Math.PI;
 const pos = v => Math.round(v*10000)/10000;

 return {
  rot: [
   (o.rotation.x-p.rotation[0])*DEG,
   (o.rotation.y-p.rotation[1])*DEG,
   (o.rotation.z-p.rotation[2])*DEG
  ].map(r3),
  pos: [
   o.position.x-p.position[0],
   o.position.y-p.position[1],
   o.position.z-p.position[2]
  ].map(pos)
 };
}

function editRotate(dir) {
 const e = state.motion.edit;
 assert(e?.partId,'3D画面で動かしたい部品をタップしてください');

 if (!e.pending) e.pending = currentOffset();

 const i = 'xyz'.indexOf(dir[0]);
 const step = (e.fine ? 5 : 15)*(dir[1] === '+' ? 1 : -1);

 e.pending.rot[i] = r3(e.pending.rot[i]+step);
 showEditPose();
 renderPanel();
}

function editMove(dir) {
 const e = state.motion.edit;
 assert(e?.partId,'3D画面で動かしたい部品をタップしてください');

 if (!e.pending) e.pending = currentOffset();

 const i = 'xyz'.indexOf(dir[0]);
 assert(i >= 0,'移動の向きが分かりません');

 const step = modelSpan()*.02*(dir[1] === '+' ? 1 : -1);

 e.pending.pos[i] = Math.round((e.pending.pos[i]+step)*10000)/10000;
 showEditPose();
 renderPanel();
}

function stepEdit(dir) {
 const e = state.motion.edit;
 const a = e && state.modelSpec.animations?.[e.clipId];
 if (!a) return;

 e.time = r3(Math.min(a.duration,Math.max(0,e.time+dir/24)));
 e.pending = null;
 showEditPose();
 renderPanel();
}

// キーの時刻一覧（部品を選んでいればその部品だけ、未選択なら全トラック）
function editKeyTimes(a,pid) {
 const set = new Set();
 const tracks = pid ? {[pid]:a.tracks?.[pid]} : (a.tracks || {});

 for (const tr of Object.values(tracks)) {
  if (!tr) continue;
  for (const list of Object.values(tr)) {
   list.forEach(k => set.add(r3(k[0])));
  }
 }

 return [...set].sort((x,y) => x-y);
}

function editKeyMarkers(a,e) {
 const times = editKeyTimes(a,e.partId);
 const label = e.partId ? '選択中の部品のキー' : 'すべてのキー';

 if (!times.length) return `<p class="hint">${label}: まだありません</p>`;

 return `
  <div class="keybar" aria-label="${label}">
   ${(() => {
    const pos = times.map(t =>
     a.duration > 0 ? Math.min(100,Math.max(0,t/a.duration*100)) : 0
    );

    // 左右それぞれ「22px」と「隣との中点」の小さい方（片側最小8px＝合計16px以上）
    const half = (i,dir) => {
     const j = i+dir;
     if (j < 0 || j >= pos.length) return '22px';
     return 'max(8px,min(22px,'+r3(Math.abs(pos[j]-pos[i])/2)+'%))';
    };

    return times.map((t,i) => {
     const on = Math.abs(t-e.time) <= .01;
     const L = half(i,-1);
     const R = half(i,1);

     return `<span class="keydot ${on ? 'on' : ''}" style="left:${pos[i]}%"></span>`
      + `<button class="keymark" data-ekeyt="${t}" style="left:calc(${pos[i]}% - ${L});width:calc(${L} + ${R})" aria-label="${t}秒のキーへ移動"></button>`;
    }).join('');
   })()}
  </div>
  <p class="hint">${label}: ${times.length}個（◆をタップするとその時刻へ移動）</p>
 `;
}

function seekEditTime(t) {
 const e = state.motion.edit;
 const a = e && state.modelSpec.animations?.[e.clipId];
 if (!a) return;

 e.time = r3(Math.min(a.duration,Math.max(0,Number(t) || 0)));
 e.pending = null;
 showEditPose();
 renderPanel();
}

function jumpEditKey(dir) {
 const e = state.motion.edit;
 const a = e && state.modelSpec.animations?.[e.clipId];
 if (!a) return;

 const times = editKeyTimes(a,e.partId);
 const t = dir > 0
  ? times.find(x => x > e.time+.01)
  : [...times].reverse().find(x => x < e.time-.01);

 if (t === undefined) {
  toast(dir > 0 ? 'この先にキーはありません' : 'この前にキーはありません');
  return;
 }

 seekEditTime(t);
}

// ±0.01秒以内に既存のキーがあれば値を置き換え、なければ時刻順に挿入する
function upsertKey(list,t,val) {
 const i = list.findIndex(k => Math.abs(k[0]-t) <= .01);

 if (i >= 0) {
  list[i][1] = val.slice();
  return;
 }

 const at = list.findIndex(k => k[0] > t);
 list.splice(at < 0 ? list.length : at,0,[t,val.slice()]);
}

function findKeyNear(a,pid,t) {
 const tr = pid && a.tracks?.[pid];
 return !!tr && Object.values(tr).some(list => list.some(k => Math.abs(k[0]-t) <= .01));
}

function recordEditKey() {
 const e = state.motion.edit;
 assert(e?.partId,'3D画面で動かしたい部品をタップしてください');
 assert(e.pending,'回転や上下のボタンで姿勢を変えてから記録してください');

 const pend = clone(e.pending);
 const pid = e.partId;
 const cid = e.clipId;
 const t = r3(e.time);

 // 記録後は、新しいモデルで記録した姿勢を表示し直す（失敗したら pending を戻す）
 e.pending = null;

 try {
  mutate(s => {
   const a = s.animations[cid];
   assert(a,'動きが見つかりません');

   a.tracks ??= {};
   const tr = a.tracks[pid] ??= {};
   const loop = a.loop !== false;
   const dur = r3(a.duration);

   const write = (ch,val) => {
    const list = tr[ch] ??= [[0,[0,0,0]],[dur,[0,0,0]]];
    upsertKey(list,t,val);

    // くり返す動きは、端に記録したら反対側の端もそろえる
    if (loop) {
     if (t <= .01) upsertKey(list,dur,val);
     else if (t >= dur-.01) upsertKey(list,0,val);
    }
   };

   write('rotation',pend.rot.map(r3));

   if (pend.pos.some(v => Math.abs(v) > 1e-6) || tr.position) {
    write('position',pend.pos.map(v => Math.round(v*10000)/10000));
   }

   let count = 0;
   Object.values(a.tracks).forEach(x => Object.values(x).forEach(list => count += list.length));

   assert(
    count <= LIMIT.motionKeys,
    'キーが多すぎます（1つの動きで'+LIMIT.motionKeys+'個まで）。不要なキーを消してから記録してください'
   );
  });
 } catch (err) {
  e.pending = pend;
  showEditPose();
  throw err;
 }

 toast('この時刻の姿勢を記録しました（↶で取り消せます）');
}

function deleteEditKey() {
 const e = state.motion.edit;
 assert(e?.partId,'キーを消す部品を選んでください');

 const t = e.time;
 const pid = e.partId;
 const cid = e.clipId;

 e.pending = null;

 mutate(s => {
  const a = s.animations[cid];
  const tr = a?.tracks?.[pid];
  if (!tr) return;

  for (const ch of Object.keys(tr)) {
   tr[ch] = tr[ch].filter(k => Math.abs(k[0]-t) > .01);
   if (!tr[ch].length) delete tr[ch];
  }

  if (!Object.keys(tr).length) delete a.tracks[pid];
 });

 toast('このキーを消しました（↶で取り消せます）');
}

// 動き全体の調整（長さ・大きさ）。反映ボタンを押したときだけデータを変える
function applyEditScale(kind) {
 const e = state.motion.edit;
 const a = e && state.modelSpec.animations?.[e.clipId];
 assert(a,'動きが見つかりません');

 const f = kind === 'len' ? e.len : e.amp;

 if (Math.abs(f-1) < 1e-6) {
  toast('倍率が1なので、変更はありません');
  return;
 }

 const cid = e.clipId;

 if (kind === 'len') {
  const dur = Math.min(30,Math.max(.1,r3(a.duration*f)));
  const g = dur/a.duration;

  mutate(s => {
   const c = s.animations[cid];

   for (const tr of Object.values(c.tracks || {})) {
    for (const list of Object.values(tr)) {
     list.forEach(k => {
      k[0] = Math.min(dur,r3(k[0]*g));
     });
    }
   }

   (c.events || []).forEach(ev => {
    ev[0] = Math.min(dur,r3(ev[0]*g));
   });

   (c.spins || []).forEach(sp => {
    sp.degPerSec = r3(sp.degPerSec/g);
   });

   c.duration = dur;
  });

  e.time = Math.min(dur,r3(e.time*g));
  e.len = 1;
 } else {
  mutate(s => {
   const c = s.animations[cid];

   for (const tr of Object.values(c.tracks || {})) {
    if (tr.rotation) tr.rotation.forEach(k => {
     k[1] = k[1].map(v => r3(v*f));
    });
    if (tr.position) tr.position.forEach(k => {
     k[1] = k[1].map(v => Math.round(v*f*10000)/10000);
    });
   }
  });

  e.amp = 1;
 }

 showEditPose();
 renderPanel();
 toast((kind === 'len' ? '長さ' : '大きさ')+'を反映しました（↶で取り消せます）');
}

// 回転の中心を調べる部位（脚・腕・翼）
const LIMB_ROLES = ['legL','legR','legFL','legFR','legBL','legBR','armL','armR','wingL','wingR'];

// 種類ごとの主要部位（ないと、おまかせ生成やチェックが正しく働かない）。それ以外は任意部位
const REQUIRED_ROLES = {
 biped: ['legL','legR'],
 quad: ['legFL','legFR','legBL','legBR'],
 flyer: ['wingL','wingR'],
 vehicle: []
};

// 準備チェック（参考情報）。ModelSpec の基本姿勢から作った一時モデルで計測し、画面のモデルには触れない。
// 結果は、ModelSpec（編集のたびに新しい参照になる）と種類・役割が同じ間だけ使い回す。3D表示がなければ null
function readiness() {
 const e = state.engine;
 const s = state.modelSpec;
 if (!e || !window.THREE || !Object.keys(s.parts).length) return null;

 ensureMotionRoles();

 const m = state.motion;
 const key = m.kind+'|'+JSON.stringify(m.roles);
 const c = state.readyCache;

 if (c && c.spec === s && c.key === key) return c.result;

 const result = measureReadiness(s,m.kind,m.roles);
 state.readyCache = {spec:s,key,result};
 return result;
}

function measureReadiness(s,kind,roles) {
 const e = state.engine;
 const kindRoles = MOTION_KINDS[kind].roles;
 const required = REQUIRED_ROLES[kind] || [];
 const wheelRoles = ['wheelFL','wheelFR','wheelBL','wheelBR'];
 const assigned = role => {
  const id = roles[role];
  return !!id && (id === '*' || own(s.parts,id));
 };

 const missing = required.filter(role => !assigned(role));

 // 乗り物は、車輪が2つ以上あれば動かせる
 if (kind === 'vehicle' && wheelRoles.filter(assigned).length < 2) missing.push('wheels');

 const optionalMissing = kindRoles.filter(role =>
  !assigned(role)
  && !required.includes(role)
  && !(kind === 'vehicle' && wheelRoles.includes(role))
 );

 const pivots = [];
 const root = e.buildModel(s);

 try {
  root.updateMatrixWorld(true);

  for (const role of LIMB_ROLES) {
   if (!kindRoles.includes(role)) continue;

   const id = roles[role];
   const o = id && id !== '*' && root.userData.parts[id];
   if (!o) continue;

   const box = new THREE.Box3().setFromObject(o);
   if (box.isEmpty()) continue;

   const origin = o.getWorldPosition(new THREE.Vector3());
   const center = box.getCenter(new THREE.Vector3());
   const wing = role.startsWith('wing');
   const size = wing ? box.max.x-box.min.x : box.max.y-box.min.y;

   // 付け根: 脚・腕は上端の中心、翼は体に近い側の端
   const pivot = wing
    ? new THREE.Vector3(
      Math.abs(box.min.x) < Math.abs(box.max.x) ? box.min.x : box.max.x,
      center.y,
      center.z
     )
    : new THREE.Vector3(center.x,box.max.y,center.z);

   if (size > 0 && origin.distanceTo(pivot) > size*.25) pivots.push({role,id});
  }
 } finally {
  e.dispose(root);
 }

 return {missing,optionalMissing,pivots};
}

// 回転の中心が付け根から離れている可能性のある部位（既存の呼び出し元との互換用。3D表示がなければ null）
function jointIssues() {
 const r = readiness();
 return r ? r.pivots : null;
}

function motionReadinessCard() {
 const r = readiness();
 if (r === null) return '';

 const label = role => role === 'wheels' ? '車輪（2つ以上）' : ROLE_INFO[role].label;
 const names = r.pivots.map(i => ROLE_INFO[i.role].label+'（'+i.id+'）').join('、');
 const limbs = r.pivots.some(i => !i.role.startsWith('wing'));
 const wings = r.pivots.some(i => i.role.startsWith('wing'));
 const good = !r.missing.length && !r.pivots.length;

 return `
  <details class="card" id="readyDetails" ${motionCardOpen('ready',!good) ? 'open' : ''}>
   <summary><b>準備チェック（参考）</b>${good ? ' ✓' : ' · 要確認'}</summary>

   ${good ? `
    <p class="success">✓ 主要な部位がそろっていて、回転の中心にも目立つずれは見つかりませんでした（基本姿勢で計測）。</p>
   ` : ''}

   ${r.missing.length ? `
    <p class="warnbox">
     主要な部位の役割が決まっていません: ${esc(r.missing.map(label).join('、'))}<br>

 if (!m.trying) {

}

// 先端の移動量を「前へ0.12m・上へ0.05m」のような言葉にする
function describeMove(v,len) {
 const f = x => Math.round(Math.abs(x)*100)/100;

 const list = [
  [v.z,v.z > 0 ? '前へ' : '後ろへ'],
  [v.y,v.y > 0 ? '上へ' : '下へ'],
  [v.x,v.x > 0 ? '左(+X)へ' : '右(-X)へ']
 ]
  .filter(([x]) => Math.abs(x) > Math.max(len*.05,.001))
  .sort((a,b) => Math.abs(b[0])-Math.abs(a[0]))
  .map(([x,t]) => t+f(x)+'m');

 return list.length ? list.join('・') : 'ほとんど動かない（その場でねじれる回転）';
}

// 指示文に入れる「関節ガイド」と動きの基準。一時モデルで実測し、プレビューには触れない。
function motionGuideText() {
 const s = state.modelSpec;
 const e = state.engine;
 const f = v => Math.round(v*1000)/1000;
 const lines = [];

 if (e && window.THREE && Object.keys(s.parts).length) {
  ensureMotionRoles();

  const m = state.motion;
  const root = e.buildModel(s);

  try {
   root.updateMatrixWorld(true);

   const box = solidBox(root,s);
   const size = box.getSize(new THREE.Vector3());
   const bottom = box.getCenter(new THREE.Vector3());
   const fxIds = Object.values(s.parts).filter(p => p.effect === true).map(p => p.id);

   lines.push('\n関節ガイド（アプリが3Dから計算した実測値。回転は基本姿勢からの差分）:');
   lines.push(
    '- モデルの大きさ（効果部品を除く）: 幅'+f(size.x)+'m・高さ'+f(size.y)+'m・奥行き'+f(size.z)
    +'m。地面の高さ y='+f(box.min.y)+'（これより下に部品を出さない。炎・煙などの効果部品は例外）'
   );
   lines.push('- 向き: +Zがモデルの前、+Yが上、+Xがモデルから見て左。');
   lines.push(
    '- 機体の最下部の中心（効果部品を除く。最上位から見た座標）: ['
    +f(bottom.x)+','+f(box.min.y)+','+f(bottom.z)
    +']。下向きの噴射・煙などを付けるときの目安。'
   );
   if (fxIds.length) {
    lines.push('- すでにある効果部品: '+fxIds.join(', ')+'（同じ演出にはこれを使い、重複して追加しない）');
   }

   for (const role of MOTION_KINDS[m.kind].roles) {
    const id = m.roles[role];
    if (!id) continue;

    if (id === '*') {
     const tops = Object.values(s.parts).filter(p => p.parent === null).map(p => p.id);
     lines.push(
      '- '+ROLE_INFO[role].label+'（'+role+'）: モデル全体。体全体を上下・前後に動かすときは、'
      +'最上位の部品（'+tops.join(', ')+'）すべてに同じ position の差分を入れる。'
     );
     continue;
    }

    const o = root.userData.parts[id];
    if (!o) continue;

    const pb = new THREE.Box3().setFromObject(o);
    if (pb.isEmpty()) continue;

    const pivot = o.getWorldPosition(new THREE.Vector3());
    const ps = pb.getSize(new THREE.Vector3());
    const len = Math.max(ps.x,ps.y,ps.z);
    const center = pb.getCenter(new THREE.Vector3());
    const off = center.clone().sub(pivot);
    let tip;

    if (off.length() > len*.1) {
     // 関節から見て形の中心の反対側の端を先端とみなす
     tip = pivot.clone().addScaledVector(off,2);
    } else {
     // 関節が形の中心にあるときは、いちばん遠い角を先端とみなす
     let far = -1;
     for (const x of [pb.min.x,pb.max.x]) {
      for (const y of [pb.min.y,pb.max.y]) {
       for (const z of [pb.min.z,pb.max.z]) {
        const c = new THREE.Vector3(x,y,z);
        const d = c.distanceTo(pivot);
        if (d > far) {
         far = d;
         tip = c;
        }
       }
      }
     }
    }

    const dir = tip.clone().sub(pivot).normalize();
    const localTip = o.worldToLocal(tip.clone());

    // 実際に部品を+30°回して先端の動きを測り、測った後は元に戻す
    const effects = ['x','y','z'].map(ax => {
     const before = o.rotation[ax];
     o.rotation[ax] = before+Math.PI/6;
     o.updateMatrixWorld(true);
     const moved = o.localToWorld(localTip.clone()).sub(tip);
     o.rotation[ax] = before;
     o.updateMatrixWorld(true);
     return ax.toUpperCase()+'+30°: 先端が'+describeMove(moved,len);
    });

    lines.push(
     '- '+ROLE_INFO[role].label+'（'+role+'） = 部品 '+id
     +' | 関節の位置 ['+pivot.toArray().map(f).join(',')+']'
     +' | 長さ '+f(len)+'m'
     +' | 先端の向き ['+dir.toArray().map(v => Math.round(v*100)/100).join(',')+']'
     +' | '+effects.join(' / ')
    );
   }
  } finally {
   e.dispose(root);
  }
 }

 lines.push('\n動きの基準:');
 lines.push('- 推奨の振り幅: 脚の歩き±20〜30°、走り±40〜60°、腕の振り±20〜35°、頭の揺れ±3〜10°、胴の上下は身長の1〜4%。');
 lines.push('- 二足の歩き方: 左右の脚は半周期ずらし、腕は同じ側の脚と逆向きに振る。');
 lines.push('- 四足の歩き方: 歩き＝左後→左前→右後→右前を周期の1/4ずつずらす。速歩＝対角の脚（左前と右後、右前と左後）が同時。駆け足＝前脚ペアと後脚ペアが半周期ずれる。');
 lines.push('- キーの目安: くり返す動きは1秒あたり6〜12キー。一回きりの動きは台本の各タイミングと、その前後に1つずつ。');

 return lines.join('\n')+'\n';
}

const QUEUE = STORE+'.motionQueue';
let queueTimer = null;

// 注文の動きID（自由入力なら入力値）
function itemId(it) {
 return it.id === '*' ? String(it.custom || '').trim() : it.id;
}

function newDraftItem(id='attack') {
 const std = STANDARD_MOTIONS.find(x => x[0] === id);

 return {
  id: std ? id : '*',
  custom: std || id === '*' ? '' : String(id).slice(0,64),
  name: std ? std[1] : '',
  duration: DRAFT_DURATION[id] || 1,
  loop: std ? std[2] : false,
  strength: 'normal',
  parts: null,
  ref: '',
  beats: clone(DRAFT_BEATS[id] || DEFAULT_BEATS),
  loaded: false,
  note: ''
 };
}

function normalizeQueueItem(x) {
 const o = obj(x) ? x : {};
 const beats = Array.isArray(o.beats)
  ? o.beats
   .filter(b => Array.isArray(b))
   .slice(0,40)
   .map(b => [Number(b[0]) || 0,String(b[1] ?? '').slice(0,300)])
  : [];

 return {
  id: o.id === '*' || STANDARD_MOTIONS.some(s => s[0] === o.id) ? o.id : 'attack',
  custom: String(o.custom ?? '').slice(0,64),
  name: String(o.name ?? '').slice(0,100),
  duration: Number(o.duration) || 1,
  loop: !!o.loop,
  strength: ['soft','normal','big'].includes(o.strength) ? o.strength : 'normal',
  parts: Array.isArray(o.parts) ? o.parts.filter(r => typeof r === 'string') : null,
  ref: typeof o.ref === 'string' ? o.ref : '',
  beats: beats.length ? beats : clone(DEFAULT_BEATS),
  loaded: !!o.loaded,
  note: String(o.note ?? '').slice(0,2000)
 };
}

// 台本が初期状態・空・未編集のひな形なら true
function isTemplateBeats(beats) {
 const filled = (beats || []).filter(b => String(b[1] || '').trim());
 if (!filled.length) return true;

 const same = (a,t) => a.length === t.length
  && a.every((x,i) => Number(x[0]) === t[i][0] && String(x[1]).trim() === t[i][1]);

 return [DEFAULT_BEATS,...Object.values(DRAFT_BEATS)].some(t => same(filled,t));
}

function readQueueStore() {
 try {
  const v = JSON.parse(localStorage.getItem(QUEUE) || '{}');
  return obj(v) ? v : {};
 } catch (_) {
  return {};
 }
}

// 表示中のモデルの注文リストを用意する（モデルIDごとに保存・復元）
function ensureQueue() {
 const a = state.ai;
 const key = state.modelSpec.meta.id;
 if (a.queueFor === key) return;

 a.queueFor = key;

 const saved = readQueueStore()[key];

 if (obj(saved) && Array.isArray(saved.queue) && saved.queue.length) {
  a.motionQueue = saved.queue.slice(0,LIMIT.animations).map(normalizeQueueItem);
  a.queueIndex = Math.min(Math.max(0,Number(saved.index) || 0),a.motionQueue.length-1);
  a.batchSize = [2,3,4,6].includes(saved.batchSize) ? saved.batchSize : 3;
  a.batchNote = typeof saved.note === 'string' ? saved.note.slice(0,2000) : '';
 } else {
  a.motionQueue = [newDraftItem('attack')];
  a.queueIndex = 0;
  a.batchSize = 3;
  a.batchNote = '';
 }
}

function saveQueue() {
 clearTimeout(queueTimer);

 try {
  const a = state.ai;
  if (!a.queueFor) return;

  const all = readQueueStore();
  delete all[a.queueFor];
  all[a.queueFor] = {
   queue: a.motionQueue,
   index: a.queueIndex,
   batchSize: a.batchSize,
   note: String(a.batchNote || '').slice(0,2000)
  };

  // 古いモデルの分が増えすぎないよう、新しい30モデル分だけ残す
  const keys = Object.keys(all);
  keys.slice(0,Math.max(0,keys.length-30)).forEach(k => delete all[k]);

  localStorage.setItem(QUEUE,JSON.stringify(all));
 } catch (_) {}
}

function scheduleQueueSave() {

}

function copyQueueItem(i) {

 if (!src) return;

 assert(q.length < LIMIT.animations,'注文リストは'+LIMIT.animations+'件までです');

 const copy = normalizeQueueItem(clone(src));
 copy.id = '*';
 copy.custom = (itemId(src) || 'motion').slice(0,58)+'_copy';
 copy.name = (src.name || itemId(src) || '')+'（コピー）';
 copy.loaded = false;

 q.splice(i+1,0,copy);
 state.ai.queueIndex = i+1;
 saveQueue();
 renderPanel();
 toast('複製しました。動きIDを変えてください');
}

function deleteQueueItem(i) {
 const q = state.ai.motionQueue;
 if (q.length <= 1 || !q[i]) return;

 const name = q[i].name || itemId(q[i]) || (i+1)+'件目';

 askConfirm('注文リストから「'+name+'」を削除しますか？',() => {
  const a = state.ai;
  q.splice(i,1);

  if (a.queueIndex >= q.length) a.queueIndex = q.length-1;

  saveQueue();
  renderPanel();
 });
}

// ---- 読み込みの強化 ----

function parseAIJSON(text) {
 const t = cleanPastedJSON(text);

 try {
  return parseJSON(t);
 } catch (e) {
  if (/構文エラー/.test(e.message) && t.startsWith('{') && !t.endsWith('}')) {
   throw Error('AIの回答が途中で切れている可能性があります。1回に頼む数を減らして分割コピーを使うか、AIに続きを出すよう頼んでください');
  }
  throw e;
 }
}

function motionOpId(op) {
 return String(op.path).split('/')[2].replace(/~1/g,'/').replace(/~0/g,'~');
}

// 動きの修正データで扱う操作: 動き（/animations/<id>）の add/replace と、演出用の効果部品・色の追加
const ANIM_OP_RE = /^\/animations\/[^/]+$/;
const ASSET_OP_RE = /^\/(parts|materials)\/[^/]+$/;

function isAnimOp(op) {
 return obj(op)
  && ['add','replace'].includes(op.op)
  && typeof op.path === 'string'
  && ANIM_OP_RE.test(op.path);
}

// 効果部品（effect:true）と色・質感の追加
function isEffectAssetOp(op) {
 return obj(op)
  && op.op === 'add'
  && typeof op.path === 'string'
  && ASSET_OP_RE.test(op.path)
  && obj(op.value)
  && (op.path.startsWith('/materials/') || op.value.effect === true);
}

// 動きの追加・作り直しと、演出用の効果部品・色の追加だけなら true
function isMotionOnlyPatch(ops) {
 return Array.isArray(ops)
  && ops.some(isAnimOp)
  && ops.every(op => isAnimOp(op) || isEffectAssetOp(op));
}

// add と replace の取り違えを読み替える（既存の効果部品・演出専用の色は作り直す）
function fixMotionOps(spec,ops) {
 const present = new Set(Object.keys(spec.animations || {}));
 const solidMats = new Set(
  Object.values(spec.parts)
   .filter(p => p.type === 'primitive' && p.effect !== true)
   .map(p => p.material)
 );

 return ops.map(op => {
  const id = motionOpId(op);
  const fixed = {...op};

  if (!isAnimOp(op)) {
   if (op.path.startsWith('/parts/') && own(spec.parts,id) && spec.parts[id].effect === true) {
    fixed.op = 'replace';
   }
   if (op.path.startsWith('/materials/') && own(spec.materials,id) && !solidMats.has(id)) {
    fixed.op = 'replace';
   }
   return fixed;
  }

  if (op.op === 'add' && present.has(id)) fixed.op = 'replace';
  if (op.op === 'replace' && !present.has(id)) fixed.op = 'add';

  present.add(id);
  return fixed;
 });
}

// 効果部品・色を先にまとめて適用し、動きは1つずつ適用・検証して成功した分だけを重ねる
function applyMotionOpsOneByOne(source,ops) {
 const assets = ops.filter(op => !isAnimOp(op));
 let cur = source;
 let ok = 0;
 const failed = [];

 if (assets.length) {
  try {
   cur = applyModelPatch(cur,{format:'MODELSTUDIO_PATCH_V1',operations:assets});
  } catch (e) {
   failed.push({id:'effect_parts',reason:'演出用の部品・色を追加できませんでした: '+e.message});
  }
 }

 for (const op of ops.filter(isAnimOp)) {
  try {
   cur = applyModelPatch(cur,{format:'MODELSTUDIO_PATCH_V1',operations:[op]});
   ok++;
  } catch (e) {
   failed.push({id:motionOpId(op),reason:e.message});
  }
 }

 return {next: ok ? cur : null,failed};
}

// 修正データがすべて /animations 配下なら、追加・変更された動きIDを返す
function changedAnimationIds(ops,next) {
 if (
  !Array.isArray(ops)
  || !ops.length
  || !ops.every(op =>
   obj(op)
   && typeof op.path === 'string'
   && (
    op.path.startsWith('/animations')
    || ['add','replace'].includes(op.op) && ASSET_OP_RE.test(op.path)
   )
  )
 ) {
  return [];
 }

 const anims = next.animations || {};
 const ids = new Set();

 for (const op of ops) {
  // 効果部品・色の追加は動きの確認対象ではない
  if (!op.path.startsWith('/animations')) continue;

  const key = op.path.split('/')[2];

  if (key) {
   if (own(anims,key)) ids.add(key);
  } else if (obj(op.value)) {
   Object.keys(op.value).forEach(k => {
    if (own(anims,k)) ids.add(k);
   });
  }
 }

 return [...ids];
}

// チェック表示と修正候補の両方で同じ端点の判定を使う
function hasLoopEndpointGap(a,ch,keys) {
 if (!a || a.loop === false || !keys?.length) return false;

 const first = keys[0];
 const last = keys[keys.length-1];
 const tolerance = ch === 'rotation' ? 1 : .01;

 return first[0] > .001
  || last[0] < a.duration-.001
  || first[1].some((v,i) => Math.abs(v-last[1][i]) > tolerance);
}

// 修正可能な動きだけ、適用するキー列を作る。元データは変更しない。
// キー上限を超える場合は動き単位で除外し、表示と実行の条件を一致させる。
function loopEndpointFixPlan(a) {
 if (!a || a.loop === false) return null;

 const changes = [];
 let totalKeys = 0;

 for (const [pid,tr] of Object.entries(a.tracks || {})) {
  for (const [ch,keys] of Object.entries(tr)) {
   totalKeys += keys.length;
   if (!hasLoopEndpointGap(a,ch,keys)) continue;

   const next = keys.map(([t,v]) => [
    Math.min(a.duration,Math.max(0,t)),
    v.slice()
   ]);
   const first = next[0][1].slice();

   if (next[0][0] > 0) next.unshift([0,first.slice()]);

   if (next[next.length-1][0] < a.duration) {
    next.push([a.duration,first.slice()]);
   } else {
    // 終端に同じ時刻のキーが複数ある場合も、終端の値をそろえる
    for (let i=next.length-1;i>=0 && next[i][0] === a.duration;i--) {
     next[i][1] = first.slice();
    }
   }

   totalKeys += next.length-keys.length;
   changes.push({pid,ch,keys:next});
  }
 }

 return changes.length && totalKeys <= LIMIT.motionKeys ? changes : null;
}

// 動きの品質チェック。地面へのめり込みは一時モデルで実際に再生して測る。
function reviewMotions(ids) {
 const s = state.modelSpec;
 const e = state.engine;
 const out = {};
 const problemParts = (jointIssues() || []).map(j => j.id);
 let root = null;
 let anim = null;
 let baseMin = 0;
 let H = 1;

 if (e && window.THREE) {
  root = e.buildModel(s);
  root.updateMatrixWorld(true);
  // 炎などの効果部品は地面チェックの対象外
  const box = solidBox(root,s);
  baseMin = box.min.y;
  H = Math.max(.05,box.max.y-box.min.y);
  anim = e.createAnimator(root,s);
 }

 try {
  for (const id of ids) {
   const a = s.animations?.[id];
   if (!a) continue;

   const list = [];
   const loop = a.loop !== false;
   let keys = 0;
   let tracked = 0;

   for (const [pid,tr] of Object.entries(a.tracks || {})) {
    tracked++;

    for (const [ch,k] of Object.entries(tr)) {
     keys += k.length;

     if (ch === 'rotation') {
      const big = k.find(x => x[1].some(v => Math.abs(v) > 170));
      if (big) list.push(pid+' の回転が170°を超えています（'+big[0]+'秒）');
     }

     if (hasLoopEndpointGap(a,ch,k)) {
      list.push(pid+' の'+(ch === 'rotation' ? '回転' : '位置')+'が、くり返しのつなぎ目でずれています');
     }
    }
   }

   if (loop && tracked && keys/tracked < 3) {
    list.push('部品あたりのキーが少なく、動きが単調です（'+keys+'キー／'+tracked+'部品）');
   }

   if (id === 'attack' && !(a.events || []).some(ev => ev[1] === 'hit')) {
    list.push('攻撃の合図「hit」がありません');
   }
   if (id === 'jump' && !(a.events || []).some(ev => ev[1] === 'land')) {
    list.push('着地の合図「land」がありません');
   }

   const moving = Object.keys(a.tracks || {}).filter(pid => problemParts.includes(pid));
   if (moving.length) {
    list.push('回転の中心が付け根から離れている可能性がある部品を動かしています: '+moving.join('、'));
   }

   if (anim) {
    anim.play(id,{fade:0,restart:true});

    const n = 24;
    const floor = baseMin-H*.03;
    let worst = null;

    for (let i=0;i<=n;i++) {
     if (i) anim.update(a.duration/n);
     root.updateMatrixWorld(true);
     const y = solidBox(root,s).min.y;
     if (y < floor && (!worst || y < worst.y)) worst = {y,t:r3(a.duration*i/n)};
    }

    if (worst) {
     list.push('地面にめり込みます（'+worst.t+'秒ごろ、約'+r3(baseMin-worst.y)+'m）');
    }

    anim.stop();
   }

   out[id] = list;
  }
 } finally {
  if (root) e.dispose(root);
 }

 return out;
}

// AIの動きを読み込んだ後の確認を始める
// base は AIの回答を適用する直前の状態（{spec, projectId, dirty}）。「取り消す」の復元基準になる
function startReview(ids,plan,failed=[],base=null) {
 const m = state.motion;
 const plans = {};

 // plan は文字列（全体の計画）か、{動きID: 計画} のオブジェクト
 if (obj(plan)) {
  for (const [k,v] of Object.entries(plan)) {
   if (typeof v === 'string') plans[k] = v.slice(0,1000);
  }
 }

 m.review = {
  ids,
  plan: typeof plan === 'string' ? plan.slice(0,2000) : '',
  plans,
  failed: failed.map(f => ({id:f.id,reason:String(f.reason).slice(0,500)})),

  owned: state.modelSpec
 };

 state.activeTab = 'motion';

 if (m.animator && ids[0]) playMotion(ids[0]);
 else renderPanel();
}

// ボタンの表示判定と同じ計画を使い、修正可能な端点だけを変更する
function autoFixMotions() {
 const m = state.motion;
 const rv = m.review;
 assert(rv,'確認中の動きがありません');

 const anims = state.modelSpec.animations || {};
 const ids = [...new Set(rv.ids.filter(id => own(anims,id)))];
 const plans = ids
  .map(id => ({id,changes:loopEndpointFixPlan(anims[id])}))
  .filter(plan => plan.changes !== null);

 if (!plans.length) {
  toast('自動で修正できるつなぎ目はありません');
  renderPanel();
  return;
 }

 // 候補を先に検証し、失敗時にモデルや履歴を変更しない
 const next = snapshot();

 for (const {id,changes} of plans) {
  for (const {pid,ch,keys} of changes) {
   next.animations[id].tracks[pid][ch] = keys;
  }
 }

 validateModelSpec(next);
 stopMotion();
 commitSpec(next);

 m.review = {...rv,report:reviewMotions(ids),owned:state.modelSpec};
 renderPanel();
 toast(plans.length+'件の動きのつなぎ目を直しました（↶で取り消せます）');
}

// 品質チェックの結果を入れて、問題のある動きだけを直してもらう指示文
function createReviewFixPrompt() {
 const rv = state.motion.review;
 assert(rv,'確認中の動きがありません');

 const anims = state.modelSpec.animations || {};
 const bad = rv.ids.filter(id => own(anims,id) && (rv.report[id] || []).length);

 const failed = rv.failed || [];

 assert(bad.length || failed.length,'直す必要のある動きはありません');

 return motionPromptBase(
  (bad.length
   ? '\n次の動きに、アプリの品質チェックで問題が見つかりました。問題を直した動きを返してください。\n'
    + bad.map(id =>
     '\n動きID: '+id+'\n問題:\n'
     + rv.report[id].map(x => '- '+x).join('\n')
     + '\n現在の中身:\n'+JSON.stringify(anims[id])
    ).join('\n')
   : '')
  + (failed.length
   ? '\n\n次の動きは、データの誤りで読み込めませんでした。理由を直して作り直してください。\n'
    + failed.map(f => {
     const item = queueItemById(f.id);
     const order = item ? orderTextSafe(item) : '';

     return '\n動きID: '+f.id+'\n理由: '+f.reason
      + (own(anims,f.id) ? '\n現在の中身:\n'+JSON.stringify(anims[f.id]) : '')
      + (order ? '\n注文内容:'+order : '');
    }).join('\n')
   : '')
  + '\n\n各動きを {"op":"replace","path":"/animations/動きID","value":{...}} で返すこと（まだ登録されていない動きは op を "add" にする）。'
  + 'IDは変えない。ほかの動きや部品は変更しない。最上位に "plan" を書く。'
  + '\n出力は MODELSTUDIO_PATCH_V1 のJSONのみ。先頭文字は{、末尾文字は}。'
 );
}

// ============================================================
// 11. Inspector / Domain Mutations
// スカラー編集は既存Object/Materialを更新する。
// ============================================================

function snapshot() {
 return clone(state.modelSpec);
}

// 履歴は「モデル」と「保存先（projectId）」を組で持つ（元に戻したときに保存先も対応させる）
function remember(before) {
 state.undo.push({spec:before,projectId:state.projectId});
 if (state.undo.length > LIMIT.history) state.undo.shift();
 state.redo = [];
}

function beginEditSession() {
 state.io.session++;
 state.io.saving = null;
 state.io.libraryError = false;
 state.motion.exported = false;
}

function markChanged() {
 state.dirty = true;
 state.motion.exported = false;
 updateHeader();
 scheduleDraft();
}

function commitSpec(next,{history=true,fit=false,newSession=false}={}) {
 validateModelSpec(next);

 // 現在のSceneを破棄する前に新しいモデルを構築する。
 const candidate = state.runtime ? state.engine.buildModel(next) : null;

 if (history) remember(snapshot());
 if (newSession) beginEditSession();

 if (state.modelSpec?.meta.name !== next.meta.name) {
  state.io.nameRevision++;
 }

 state.modelSpec = next;

 if (!own(next.parts,state.selectedPartId)) {
  state.selectedPartId = null;
 }
 if (!own(next.anchors,state.selectedAnchorId)) {
  state.selectedAnchorId = null;
 }
 if (!own(next.materials,state.selectedMaterialId)) {
  state.selectedMaterialId = Object.keys(next.materials)[0];
 }

 rebuildScene(candidate);
 state.stats = calculateStats(candidate);

 markChanged();
 renderPanel();

 if (fit) fitCamera();
}

function mutate(fn,fit=false) {
 const next = snapshot();
 fn(next);
 commitSpec(next,{fit});
}

function refreshDirect(collection,id) {
 const r = state.runtime;
 if (!r) return;

 // 再生中に部品を編集したら、止めて基本姿勢に戻してから反映する
 if (collection === 'parts') stopMotion();

 const d = state.modelSpec[collection][id];

 if (collection === 'materials') {
  state.engine.updateMaterial(r.root.userData.materials[id],d);
 } else if (collection === 'parts') {
  const o = r.root.userData.parts[id];
  state.engine.transform(o,d);
  o.name = d.name;

  const mesh = o.children.find(x => x.isMesh);
  if (mesh) mesh.material = r.root.userData.materials[d.material];

  r.root.updateMatrixWorld(true);
  updateStage();
 } else {
  state.engine.transform(r.root.userData.anchors[id],d);
 }

 // 編集後の姿勢を新しい基本姿勢として動きを作り直す
 if (collection === 'parts') resetAnimator();

 invalidate();
}

function editDirect(collection,id,key,value,index=null,live=false) {
 // 確定していない連続操作があれば、先に1つの履歴として確定する
 if (!live) finishLive();

 const next = snapshot();

 if (index === null) next[collection][id][key] = value;
 else next[collection][id][key][index] = value;

 validateModelSpec(next);

 if (live) state.liveBefore ??= snapshot();
 else remember(snapshot());

 state.modelSpec = next;

 refreshDirect(collection,id);
 markChanged();
}

function finishLive() {
 if (!state.liveBefore) return;

 if (JSON.stringify(state.liveBefore) !== JSON.stringify(state.modelSpec)) {
  remember(state.liveBefore);
 }

 state.liveBefore = null;
 updateHeader();
 scheduleDraft();
}

function undoRedo(redo=false) {
 finishLive();

 const from = redo ? state.redo : state.undo;
 const to = redo ? state.undo : state.redo;

 if (!from.length) return;

 const entry = from[from.length-1];
 const next = clone(entry.spec);
 validateModelSpec(next);

 const candidate = state.runtime ? state.engine.buildModel(next) : null;

 to.push({spec:snapshot(),projectId:state.projectId});
 from.pop();

 beginEditSession();
 state.modelSpec = next;
 state.projectId = entry.projectId;
 // 履歴を移動したら確認バーは閉じる（取り消しの基準と食い違わないようにする）
 state.motion.review = null;
 state.selectedPartId = null;
 state.selectedAnchorId = null;

 rebuildScene(candidate);
 state.stats = calculateStats(candidate);

 markChanged();
 renderPanel();
}

function descendants(id,s=state.modelSpec) {
 const result = [id];

 for (let i=0;i<result.length;i++) {
  for (const p of Object.values(s.parts)) {
   if (p.parent === result[i]) result.push(p.id);
  }
 }

 return result;
}

// 初心者向け: 表示の細かさ・かんたん調整・ミラー複製・ひな形・ファイル保存

const easy = () => state.uiLevel !== 'pro';

// かんたん調整の1回の移動量（モデル全体の最大辺に対する割合）
function nudgeStepSize() {
 const r = state.runtime;
 let span = 2;

 if (r?.root) {
  const box = new THREE.Box3().setFromObject(r.root);
  if (!box.isEmpty()) {
   const size = box.getSize(new THREE.Vector3());
   span = Math.max(size.x,size.y,size.z,.05);
  }
 }

 return span*({fine:.01,normal:.03,coarse:.1}[state.nudgeStep] || .03);
}

    ${b('s-','小さく −10%')}${b('rx-','後ろに傾ける 15°')}${b('s+','大きく +10%')}

function nudgePart(dir) {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id),'調整する部品を選んでください');

 // 別の部品に切り替えたら、それまでの連続操作を確定する
 if (state.nudge.id !== id) finishLive();
 state.nudge.id = id;

 const p = state.modelSpec.parts[id];
 const r4 = v => Math.round(v*10000)/10000;
 const sign = dir.endsWith('+') ? 1 : -1;

 if (dir[0] === 's') {
  const f = sign > 0 ? 1.1 : .9;
  editDirect(
   'parts',id,'scale',
   p.scale.map(v => r4(Math.min(1000,Math.max(.001,v*f)))),
   null,true
  );
 } else if (dir[0] === 'r') {
  const i = 'xyz'.indexOf(dir[1]);
  editDirect('parts',id,'rotation',r4(p.rotation[i]+sign*Math.PI/12),i,true);
 } else {
  const i = 'xyz'.indexOf(dir[0]);
  editDirect('parts',id,'position',r4(p.position[i]+sign*nudgeStepSize()),i,true);
 }

 // 1.5秒操作がなければ、ここまでを1つの履歴として確定する
 clearTimeout(state.nudgeTimer);
 state.nudgeTimer = setTimeout(finishLive,1500);

 renderPanel();
}

// 名前・IDの左右を入れ替える（left/right・左/右・単語としての L/R）
function swapSide(text) {
 const map = {
  left:'right',right:'left',Left:'Right',Right:'Left',LEFT:'RIGHT',RIGHT:'LEFT',
  '左':'右','右':'左'
 };
 const letter = {l:'r',r:'l',L:'R',R:'L'};

 return String(text)
  .replace(/left|right|Left|Right|LEFT|RIGHT|左|右/g,m => map[m])
  .replace(/(^|[_\-\s])([lLrR])(?=$|[_\-\s])/g,(all,pre,c) => pre+letter[c]);
}

// 選んだ部品を子部品ごと左右反対側に複製する
// 子部品も含めて X位置・Y回転・Z回転を反転すると、左右対称の形が正しく複製される
function mirrorPart() {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id),'複製する部品を選んでください');

 const center = Math.abs(state.modelSpec.parts[id].position[0]) < 1e-6;
 let newId;

 mutate(s => {
  const ids = descendants(id,s);
  const taken = new Set(Object.keys(s.parts));
  const map = {};

  for (const old of ids) {
   let nid = swapSide(old);
   if (!validId(nid) || taken.has(nid)) nid = uid('part');
   taken.add(nid);
   map[old] = nid;
  }

  newId = map[id];

  const flip = o => {
   o.position[0] = -o.position[0] || 0;
   o.rotation[1] = -o.rotation[1] || 0;
   o.rotation[2] = -o.rotation[2] || 0;
  };

  for (const old of ids) {
   const p = clone(s.parts[old]);
   const name = swapSide(p.name);

   p.id = map[old];
   p.name = name === p.name ? p.name+'（反対側）' : name;
   p.parent = map[p.parent] || p.parent;
   flip(p);

   s.parts[p.id] = p;
  }

  for (const a of Object.values(clone(s.anchors))) {
   if (!map[a.parent]) continue;

   a.id = uid('anchor');
   a.name = swapSide(a.name);
   a.parent = map[a.parent];
   flip(a);

   s.anchors[a.id] = a;
  }
 });

 selectPart(newId);
 toast(
  center
   ? '中央にある部品なので、同じ位置に複製しました。かんたん調整で位置を動かしてください'
   : '左右反対側に複製しました（↶で取り消せます）',
  3200
 );
}

  group('body',[0,0,0]);
  add('body_shell','primitive',box([1.7,.5,4]),[0,.6,0],'paint','body');
  add('cabin','primitive',box([1.44,.46,2]),[0,1.08,-.2],'glass','body');
  add('roof','primitive',box([1.36,.06,1.7]),[0,1.33,-.25],'paint','body');
  add('bumper_front','primitive',box([1.72,.18,.15]),[0,.42,2.05],'dark','body');
  add('bumper_back','primitive',box([1.72,.18,.15]),[0,.42,-2.05],'dark','body');
  add('light_l','primitive',box([.32,.12,.05]),[.58,.68,2.01],'light','body');
  add('light_r','primitive',box([.32,.12,.05]),[-.58,.68,2.01],'light','body');

  group('steer_front',[0,.35,1.3],'body');

  for (const [tag,x,front] of [['fl',1,true],['fr',-1,true],['bl',1,false],['br',-1,false]]) {
   group(
    'wheel_'+tag,
    front ? [x*.85,0,0] : [x*.85,.35,-1.3],
    front ? 'steer_front' : 'body'
   );
   add(
    'tire_'+tag,'primitive',
    {type:'cylinder',radiusTop:.35,radiusBottom:.35,height:.26,radialSegments:24},
    [0,0,0],'rubber','wheel_'+tag,[1,1,1],[0,0,P/2]
   );
   add(
    'hub_'+tag,'primitive',
    {type:'cylinder',radiusTop:.2,radiusBottom:.2,height:.28,radialSegments:16},
    [0,0,0],'metal','wheel_'+tag,[1,1,1],[0,0,P/2]
   );
  }
 }

 return normalizeSpec(s);
}

// ------------------------------------------------------------
// 初心者向け: 形の変更・寸法・色見本・部品の追加・指示文の共有
// ------------------------------------------------------------

const round4 = v => Math.round(v*10000)/10000;

// かんたん表示で選べる形
const EASY_GEO = ['box','sphere','cylinder','cone','capsule','torus','plane'];

// 形ごとの寸法スライダー [キー, 配列の番号(なければnull), 表示名]
const DIM_FIELDS = {
 box: [['size',0,'幅'],['size',1,'高さ'],['size',2,'奥行き']],
 sphere: [['radius',null,'半径']],
 cylinder: [['radiusTop',null,'上の半径'],['radiusBottom',null,'下の半径'],['height',null,'高さ']],
 cone: [['radius',null,'半径'],['height',null,'高さ']],
 capsule: [['radius',null,'半径'],['length',null,'長さ']],
 torus: [['radius',null,'半径'],['tube',null,'太さ']],
 plane: [['size',0,'幅'],['size',1,'高さ']]
};

const PALETTE = [
 '#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5',
 '#5e35b1','#d81b60','#795548','#9e9e9e','#212121','#fafafa'
];

// モデル全体の最大辺（3D表示がなければ2m）
function modelSpan() {
 const r = state.runtime;

 if (r?.root) {
  const box = new THREE.Box3().setFromObject(r.root);
  if (!box.isEmpty()) {
   const size = box.getSize(new THREE.Vector3());
   return Math.max(size.x,size.y,size.z,.05);
  }
 }

 return 2;
}

// 形状パラメータから見た目の大きさ [幅, 高さ, 奥行き] を概算する
function geoSize(g) {
 const d = {...GEO[g.type],...g};

 switch (g.type) {
  case 'box':
   return d.size.slice();
  case 'sphere':
   return [2*d.radius,2*d.radius,2*d.radius];
  case 'cylinder': {
   const r = Math.max(d.radiusTop,d.radiusBottom);
   return [2*r,d.height,2*r];
  }
  case 'cone':
   return [2*d.radius,d.height,2*d.radius];
  case 'capsule':
   return [2*d.radius,d.length+2*d.radius,2*d.radius];
  case 'torus': {
   const o = 2*(d.radius+d.tube);
   return [o,o,2*d.tube];
  }
  case 'plane':
   return [d.size[0],d.size[1],.01];
  case 'lathe': {
   const r = Math.max(...d.points.map(p => p[0]));
   const ys = d.points.map(p => p[1]);
   return [2*r,Math.max(...ys)-Math.min(...ys),2*r];
  }
  case 'extrude': {
   const xs = d.points.map(p => p[0]);
   const ys = d.points.map(p => p[1]);
   return [Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),d.depth];
  }
  case 'tube': {
   const span = i => {
    const v = d.points.map(p => p[i]);
    return Math.max(...v)-Math.min(...v)+2*d.radius;
   };
   return [span(0),span(1),span(2)];
  }
 }

 return [1,1,1];
}

// 形状の長さ系の値をまとめて f 倍する（分割数・closed はそのまま）
function scaleGeometry(g,f) {
 const k = v => Math.max(.001,round4(v*f));

 for (const key of Object.keys(g)) {
  const v = g[key];

  if (key === 'type' || key === 'closed' || /Segments$|^segments$/.test(key)) continue;

  if (key === 'points') {
   g.points = v.map(p => p.map(x => round4(x*f)));
  } else if (Array.isArray(v)) {
   g[key] = v.map(k);
  } else if (typeof v === 'number') {
   g[key] = ['radiusTop','radiusBottom','length'].includes(key) && v === 0 ? 0 : k(v);
  }
 }

 return g;
}

// 見た目の大きさ [幅, 高さ, 奥行き] に近い新しい形を作る
function geometryForSize(type,[w,h,z]) {
 const g = clone(GEO[type]);
 const m = v => Math.max(.01,round4(v));
 const r = Math.max(w,z)/2;

 switch (type) {
  case 'box':
   g.size = [m(w),m(h),m(z)];
   break;
  case 'sphere':
   g.radius = m(Math.max(w,h,z)/2);
   break;
  case 'cylinder':
   g.radiusTop = m(r);
   g.radiusBottom = m(r);
   g.height = m(h);
   break;
  case 'cone':
   g.radius = m(r);
   g.height = m(h);
   break;
  case 'capsule':
   g.radius = m(r);
   g.length = m(h-2*r);
   break;
  case 'torus': {
   const o = Math.max(w,h)/2;
   g.tube = m(o*.2);
   g.radius = m(o-g.tube);
   break;
  }
  case 'plane':
   g.size = [m(w),m(h)];
   break;
  default: {
   // 回転体・押し出し・管は、既定の形を全体の大きさに合わせて拡大縮小する
   const base = Math.max(...geoSize(g),.001);
   scaleGeometry(g,Math.max(w,h,z)/base);
  }
 }

 return g;
}

function shapeEditor(d) {
 const g = d.geometry;
 const types = easy() ? EASY_GEO : Object.keys(GEO);
 const items = types.includes(g.type) ? types : [g.type,...types];

 let html = `
  <h3>形</h3>
  ${selectField('形の種類','data-geotype="1"',items.map(t => [t,geoLabel(t)]),g.type)}
 `;

 const fields = DIM_FIELDS[g.type];

 if (!fields) {
  return html+'<p class="hint">この形の寸法は、くわしく表示の形状データで変えられます。</p>';
 }

 for (const [key,idx,label] of fields) {
  const raw = g[key] ?? GEO[g.type][key];
  const cur = round4(idx === null ? raw : raw[idx]);
  const max = round4(Math.max(1,cur*3));
  const step = Math.max(.0001,round4((max-.01)/100));

  html += `
   <label>${esc(label)}（m） <output id="dim_${key}_${idx ?? 'v'}">${cur}</output>
    <input
     type="range"
     min=".01"
     max="${max}"
     step="${step}"
     value="${cur}"
     data-dim="${key}"
     data-dimi="${idx ?? ''}"
    >
   </label>
  `;
 }

 return html+'<p class="hint">スライダーから指を離すと形に反映します（↶で戻せます）。</p>';
}

function changeGeoType(type) {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id) && own(GEO,type),'部品と形を選んでください');

 const p = state.modelSpec.parts[id];
 if (p.type !== 'primitive' || p.geometry.type === type) return;

 stopMotion();

 const size = geoSize(p.geometry);

 mutate(s => {
  s.parts[id].geometry = geometryForSize(type,size);
 });

 toast('形を「'+geoLabel(type)+'」に変えました（↶で戻せます）');
}

function setDimension(key,idx,v) {
 const id = state.selectedPartId;
 assert(id && own(state.modelSpec.parts,id),'寸法を変える部品を選んでください');
 assert(Number.isFinite(v) && v > 0,'寸法は0より大きい数にしてください');

 stopMotion();

 mutate(s => {
  const g = s.parts[id].geometry;

  if (idx === null) {
   g[key] = round4(v);
  } else {
   const arr = (g[key] ?? GEO[g.type][key]).slice();
   arr[idx] = round4(v);
   g[key] = arr;
  }
 });
}

// 色見本で色を変える（共有している色・質感は、必要なときだけ分ける）
function paintPart(color) {
 const id = state.selectedPartId;
 const spec = state.modelSpec;

 assert(
  id && own(spec.parts,id) && spec.parts[id].type === 'primitive',
  '色を変える部品を選んでください'
 );

 const mid = spec.parts[id].material;
 const users = Object.values(spec.parts)
  .filter(p => p.type === 'primitive' && p.material === mid).length;

 const norm = m => ({
  type: m.type,
  color: String(m.color).toLowerCase(),
  roughness: m.roughness ?? .6,
  metalness: m.metalness ?? 0,
  opacity: m.opacity ?? 1,
  transparent: m.transparent ?? false,
  emissive: String(m.emissive ?? '#000000').toLowerCase(),
  emissiveIntensity: m.emissiveIntensity ?? 0
 });
 const keys = Object.keys(norm(spec.materials[mid]));

 stopMotion();

 mutate(s => {
  const cur = s.materials[mid];

  if (users <= 1 || !state.paintOnly) {
   cur.color = color;
   return;
  }

  const want = norm({...cur,color});
  const same = Object.entries(s.materials).find(([,m]) => {
   const n = norm(m);
   return keys.every(k => n[k] === want[k]);
  });

  if (same) {
   s.parts[id].material = same[0];
   return;
  }

  assert(
   Object.keys(s.materials).length < LIMIT.materials,
   '色・質感が100個に達しています。使っていない色・質感を減らすか、「この部品だけ変える」をオフにしてください'
  );

  const nid = uid('material');
  s.materials[nid] = {...clone(cur),name:'色 '+color,color};
  s.parts[id].material = nid;
 });
}

// 指示文をコピーし、共有ボタン用に覚えておく
function copyPrompt(text,message) {
 state.ai.lastPrompt = text;
 const done = copyText(text,message);
 if (state.activeTab === 'ai') renderPanel();
 return done;
}

// 部品を追加する。選んだ部品があればその子として、モデルに合う大きさで追加する
function addPart(type) {
 const id = uid(type);
 const spec = state.modelSpec;
 const parent = own(spec.parts,state.selectedPartId) ? state.selectedPartId : null;
 const span = modelSpan();

 let geometry = null;

 if (type !== 'group') {
  const g = clone(GEO[type]);
  const base = Math.max(...geoSize(g),.001);
  geometry = scaleGeometry(g,span*.15/base);
 }

 const material = parent && spec.parts[parent].type === 'primitive'
  ? spec.parts[parent].material
  : Object.keys(spec.materials)[0];

 mutate(s => {
  s.parts[id] = {
   id,
   name: geoLabel(type),
   type: type === 'group' ? 'group' : 'primitive',
   parent,
   position: parent ? [0,round4(span*.1),0] : [0,1,0],
   rotation: [0,0,0],
   scale: [1,1,1],
   visible: true
  };

  if (type !== 'group') {
   s.parts[id].geometry = geometry;
   s.parts[id].material = material;
  }
 });

 selectPart(id);
}

function duplicatePart() {
 const id = state.selectedPartId;
 if (!id) return;

 let newId;

 mutate(s => {
  const ids = descendants(id,s);
  const map = {};

  ids.forEach(old => map[old] = uid('part'));
  newId = map[id];

  for (const old of ids) {
   const p = clone(s.parts[old]);

   p.id = map[old];
   p.name += ' copy';
   p.parent = map[p.parent] || p.parent;

   if (old === id) p.position[0] += .3;

   s.parts[p.id] = p;
  }

  for (const a of Object.values(clone(s.anchors))) {
   if (!map[a.parent]) continue;

   a.id = uid('anchor');
   a.parent = map[a.parent];
   s.anchors[a.id] = a;
  }
 });

 selectPart(newId);
}

function deleteSelected() {
 const id = state.selectedPartId;
 const aid = state.selectedAnchorId;

 if (aid) {
  askConfirm('取付点を削除しますか？',() => {
   mutate(s => delete s.anchors[aid]);
  });
  return;
 }

 if (id) {
  const ids = descendants(id);

  askConfirm(
   '選んだ部品とそれに付いている部品（計'+ids.length+'個）、付属の取付点を削除しますか？',
   () => mutate(s => {
    ids.forEach(x => delete s.parts[x]);
    pruneAnimations(s,ids);

    for (const [key,a] of Object.entries(s.anchors)) {
     if (ids.includes(a.parent)) delete s.anchors[key];
    }
   }),
   ids.includes(state.motion.edit?.partId)
  );
 }
}

function addAnchor() {
 const id = uid('anchor');

 mutate(s => {
  s.anchors[id] = {
   id,
   name: '新しい取付点',
   parent: state.selectedPartId,
   position: [0,0,0],
   rotation: [0,0,0]
  };
 });

 selectAnchor(id);
}

// ============================================================
// 12. Patch Engine
// JSON Pointer。parts/anchorsはIDマップ。
// addは新規キーのみ、replace/removeは既存キーのみ。
// 作業用コピーに全件適用し、最後に整合性を検証する。
// ============================================================

function applyModelPatch(source,patch) {
 guardTree(patch);

 assert(
  obj(patch)
   && patch.format === 'MODELSTUDIO_PATCH_V1'
   && Array.isArray(patch.operations),
  'MODELSTUDIO_PATCH_V1 / operationsが必要です'
 );
 assert(
  patch.operations.length > 0 && patch.operations.length <= 500,
  '操作数は1〜500です'
 );

 const next = clone(source);

 // 動きの無い古いデータにも /animations/動きID を追加できるようにする
 if (!own(next,'animations')) next.animations = {};

 for (const [i,op] of patch.operations.entries()) {
  assert(
   obj(op) && ['add','replace','remove'].includes(op.op),
   '修正データの'+(i+1)+'番目の操作の種類（op）が正しくありません。add・replace・remove のどれかにするよう、AIに頼み直してください'
  );
  assert(
   typeof op.path === 'string'
    && op.path.startsWith('/')
    && !/~(?![01])/g.test(op.path),
   'AIの回答で、変更する場所の書き方（path）が正しくありません。AIに「pathは / で始まる形で書いて」と頼み直してください'
  );

  const keys = op.path.slice(1).split('/').map(k =>
   k.replace(/~1/g,'/').replace(/~0/g,'~')
  );

  assert(
   ['meta','settings','parts','materials','anchors','animations'].includes(keys[0]),
   'AIの回答で、変更できない場所を変えようとしています。変更できるのは meta・settings・parts・materials・anchors・animations だけです。AIに頼み直してください'
  );
  assert(
   keys.every(k => k && !['__proto__','prototype','constructor'].includes(k)),
   'Patch pathに禁止キーがあります'
  );

  let parent = next;

  for (const k of keys.slice(0,-1)) {
   assert(
    parent && typeof parent === 'object' && own(parent,k),
    'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のモデルに合わせて直して」と頼んでください'
   );
   parent = parent[k];
  }

  assert(
   parent && typeof parent === 'object',
   'Patch親がObject/Arrayではありません'
  );

  const key = keys[keys.length-1];

  if (op.op !== 'remove') {
   assert(own(op,'value'),'Patch valueが必要です');
  }

  if (Array.isArray(parent)) {
   assert(
    /^(0|[1-9][0-9]*)$/.test(key) || key === '-' && op.op === 'add',
    '配列path不正'
   );

   const index = key === '-' ? parent.length : Number(key);

   assert(
    index >= 0 && index < (op.op === 'add' ? parent.length+1 : parent.length),
    '配列index範囲外'
   );

   if (op.op === 'add') {
    parent.splice(index,0,clone(op.value));
   } else if (op.op === 'remove') {
    parent.splice(index,1);
   } else {
    parent[index] = clone(op.value);
   }
  } else {
   if (op.op !== 'add') {
    assert(
     own(parent,key),
     'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のモデルに合わせて直して」と頼んでください'
    );
   }
   if (op.op === 'add') {
    assert(
     !own(parent,key),
     'AIの回答で、すでにある項目を「追加（add）」しようとしています（'+op.path+'）。AIに「既存の項目は replace で書き直して」と頼んでください'
    );
   }

   if (op.op === 'remove') delete parent[key];
   else parent[key] = clone(op.value);
  }
 }

 validateModelSpec(next);
 return next;
}

// ============================================================
// 12.5 AI回答の読み込み
// 新規モデル（MODEL_SPEC_V1）か修正データ（MODELSTUDIO_PATCH_V1）かを自動判別する。
// ============================================================

function applyAIText(text) {
 finishLive();

 const data = parseAIJSON(text);

 assert(obj(data),'AIの回答がモデルデータの形になっていません');

 // 確認バーの「取り消す」で戻す基準（適用する直前のモデルと保存先）
 const base = {spec:snapshot(),projectId:state.projectId,dirty:state.dirty};

 if (data.format === 'MODELSTUDIO_PATCH_V1' || Array.isArray(data.operations)) {
  const patch = {...data,format:'MODELSTUDIO_PATCH_V1'};
  let next = null;
  let failed = [];

  if (isMotionOnlyPatch(patch.operations)) {
   // 動きだけの修正データは、add と replace の取り違えを読み替える
   patch.operations = fixMotionOps(state.modelSpec,patch.operations);

   try {
    next = applyModelPatch(state.modelSpec,patch);
   } catch (e) {
    // 全体で失敗したら、動きごとに確かめて読み込めた分だけ反映する（↶1回で戻せる）
    const part = applyMotionOpsOneByOne(state.modelSpec,patch.operations);
    failed = part.failed;
    next = part.next;

    assert(
     next,
     '読み込めた動きがありませんでした。\n'+failed.map(f => f.id+': '+f.reason).join('\n')
    );
   }
  } else {
   next = applyModelPatch(state.modelSpec,patch);
  }

  commitSpec(next);

  // 動きだけを変更した修正データは、品質チェック付きの確認バーを出す
  const failedIds = failed.map(f => f.id);
  const ids = changedAnimationIds(patch.operations,next).filter(id => !failedIds.includes(id));

  if (ids.length) {
   markQueueLoaded(ids);

   const fxAdded = Object.keys(next.parts)
    .filter(id => !own(base.spec.parts,id) && next.parts[id].effect === true)
    .length;
   const fxNote = fxAdded ? '（演出用の効果部品を'+fxAdded+'個追加）' : '';

   startReview(ids,data.plan,failed,base);

   return failed.length
    ? ids.length+'件の動きを読み込みました'+fxNote+'（'+failed.length+'件は読み込めませんでした。確認バーを見てください）'
    : '動きを読み込みました'+fxNote+'。確認バーで品質を確かめてください';
  }

  return '修正を反映しました（↶で取り消せます）';
 }

 assert(
  data.format === 'MODEL_SPEC_V1',
  'AIの回答が「新しいモデル」でも「修正データ」でもありません。AIの回答全体をコピーし直してください'
 );

 const s = normalizeSpec(data);
 validateModelSpec(s);

 // 検証や描画モデルの構築に失敗したら、ここで止まり、現在のモデルと保存先は変わらない
 commitSpec(s,{fit:true,newSession:true});

 // 完全なモデルは新しい未保存プロジェクトとして扱う（元の保存済みモデルは上書きしない）
 state.projectId = null;
 state.dirty = true;
 writeDraft();

 const ids = Object.keys(s.animations || {});

 if (ids.length) {
  startReview(ids,data.plan,[],base);
  return '新しいモデルを読み込みました（未保存の新しいプロジェクトです）。動きは確認バーで品質を確かめてください';
 }

 return '新しいモデルを読み込みました（未保存の新しいプロジェクトです。↶で取り消せます）';
}

// ライブラリ用のサムネイル。画面とは別の小さな描画領域で、モデルを斜め上から撮影する。
function makeThumbnail(spec) {
 if (!window.THREE || !state.engine) return null;

 let t = state.thumb;

 if (!t) {
  try {
   const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false,
    preserveDrawingBuffer: true
   });

   renderer.setPixelRatio(1);
   renderer.setSize(240,180,false);
   renderer.outputEncoding = THREE.sRGBEncoding;
   renderer.toneMapping = THREE.ACESFilmicToneMapping;
   renderer.toneMappingExposure = 1.15;

   const scene = new THREE.Scene();
   scene.background = new THREE.Color('#1c2633');
   scene.add(new THREE.HemisphereLight(0xbce5ff,0x4d4e5d,.9));

   const key = new THREE.DirectionalLight(0xfff2dc,1.5);
   key.position.set(4,8,5);
   scene.add(key);

   const rim = new THREE.DirectionalLight(0x73bfff,1.1);
   rim.position.set(-4,3,-5);
   scene.add(rim);

   const camera = new THREE.PerspectiveCamera(35,240/180,.01,10000);

   t = state.thumb = {renderer,scene,camera};
  } catch (_) {
   return null;
  }
 }

 let root = null;

 try {
  root = state.engine.buildModel(spec);
  t.scene.add(root);
  root.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(root);

  if (box.isEmpty()) {
   box.set(new THREE.Vector3(-1,0,-1),new THREE.Vector3(1,2,1));
  }

  const center = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length()/2 || 1;
  const fov = t.camera.fov*Math.PI/180;
  const dist = radius/Math.sin(fov/2)*1.05;

  // 編集画面の初期カメラと同じく、斜め前・少し上から見る
  const dir = new THREE.Vector3(
   Math.sin(.65)*Math.sin(1.1),
   Math.cos(1.1),
   Math.cos(.65)*Math.sin(1.1)
  ).normalize();

  t.camera.position.copy(center).addScaledVector(dir,dist);
  t.camera.near = Math.max(.001,dist/100);
  t.camera.far = dist*10;
  t.camera.updateProjectionMatrix();
  t.camera.lookAt(center);

  t.renderer.render(t.scene,t.camera);
  return t.renderer.domElement.toDataURL('image/jpeg',.82);
 } catch (_) {
  return null;
 } finally {
  if (root) {
   t.scene.remove(root);
   state.engine.dispose(root);
  }
 }
}

// サムネイルがない既存プロジェクトを、描画の後で少しずつ作る
function queueThumbs() {
 if (state.thumbQueued || !state.engine) return;

 const missing = state.projects.some(p =>
  !p.thumb && !state.thumbTried.has(p.projectId)
 );
 if (!missing) return;

 state.thumbQueued = true;

 setTimeout(() => {
  state.thumbQueued = false;
  safe(fillThumbs);
 },60);
}

function fillThumbs() {
 const data = readStore();
 let changed = false;
 let count = 0;

 for (const p of data.projects) {
  if (p.thumb || state.thumbTried.has(p.projectId)) continue;
  if (count >= 6) break;

  state.thumbTried.add(p.projectId);
  count++;

  try {
   const spec = normalizeSpec(p.modelSpec);
   validateModelSpec(spec);

   const thumb = makeThumbnail(spec);

   if (thumb) {
    p.thumb = thumb;
    changed = true;
   }
  } catch (_) {}
 }

 if (!changed) return;

 try {
  writeStore(data,{silent:true}).catch(() => {});
 } catch (_) {}

 state.projects = data.projects;
 renderLibraryGrid();
}

function deleteProject(id) {
 const data = readStore();

 data.projects = data.projects.filter(p => p.projectId !== id);
 if (data.last === id) data.last = null;

 const pending = writeStore(data);
 state.projects = data.projects;

 if (state.projectId === id) {
  // 画面上のモデルは残し、未保存の扱いにする
  state.projectId = null;
  state.dirty = true;
  writeDraft();
 }

 renderPanel();
 renderLibraryGrid();
 pending.then(() => toast('ライブラリから削除しました'),() => {});
}

// ------------------------------------------------------------
// 試遊モード「歩かせてみる」
// 表示用の root だけを動かし、ModelSpec は変更しない
// ------------------------------------------------------------

const WALK_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];

function startWalk() {
 const m = state.motion;
 const r = state.runtime;

 assert(r?.root && m.tester,'3D表示が使えないため、試遊できません');

 stopMotion();

 m.walk = true;
 m.trying = true;
 m.walkLimit = modelSpan()*10;
 m.tester.reset();
 m.tester.setSpeed(0);

 state.walkStick = {x:0,y:0,id:null};
 state.walkKeys = {};

 buildWalkUI();
 invalidate();
 scrollToPreview(() => state.motion.walk);
}

// 試遊の後片付けだけを行う（入力・UI・表示用 root の位置と向き）。再生の停止は呼び出し側が行う
function endWalk() {
 const m = state.motion;
 if (!m.walk) return;

 m.walk = false;
 resetWalkInput();
 $('walkUI')?.remove();

 const r = state.runtime;

 if (r?.root) {
  r.root.position.set(0,0,0);
  r.root.rotation.set(0,0,0);
  r.root.updateMatrixWorld(true);
 }

 m.tester?.reset();
 fitCamera();
}

// 試遊を終えて元の姿勢で止める（stopMotion の中で endWalk が呼ばれる）
function stopWalk() {
 if (state.motion.walk) stopMotion();
}

// キーとスティックの入力を解除する（フォーカス喪失・非表示・終了時）
function resetWalkInput() {
 state.walkKeys = {};
 state.walkStick = {x:0,y:0,id:null};

 const knob = $('walkKnob');
 if (knob) knob.style.transform = '';
}

// 確認バーの「取り消す」: AIの回答を適用する直前のモデルと保存先へ戻す。
// 通常の履歴にも積むので、戻した後に ↶ で「戻す前」の状態へ戻れる
function restoreReviewBase() {
 const rv = state.motion.review;
 if (!rv?.base) return false;

 const b = rv.base;
 const next = clone(b.spec);

 stopMotion();
 commitSpec(next,{
  fit: next.meta.id !== state.modelSpec.meta.id,
  newSession: true
 });

 state.projectId = b.projectId;
 state.dirty = b.dirty;
 state.motion.review = null;

 writeDraft();
 renderPanel();
 return true;
}

function buildWalkUI() {
 $('walkUI')?.remove();

 const m = state.motion;
 const clips = state.modelSpec.animations || {};
 const ids = (m.kind === 'vehicle' ? ['bump'] : ['jump','attack']).filter(id => own(clips,id));

 const ui = document.createElement('div');
 ui.id = 'walkUI';
 ui.innerHTML = `
  <div id="walkStick" aria-label="移動スティック"><div id="walkKnob"></div></div>
  <div id="walkActs">
   ${ids.map(id => `
    <button data-try="${id}">${esc(STANDARD_MOTIONS.find(x => x[0] === id)?.[1] || id)}</button>
   `).join('')}
   ${own(clips,'die') ? button('tryReset','起き上がる') : ''}
   <button data-action="walkStop">終了</button>
  </div>
 `;
 $('viewport').appendChild(ui);

 const stick = $('walkStick');

 const set = e => {
  const rect = stick.getBoundingClientRect();
  let x = (e.clientX-rect.left-rect.width/2)/(rect.width/2);
  let y = (e.clientY-rect.top-rect.height/2)/(rect.height/2);
  const len = Math.hypot(x,y);

  if (len > 1) {
   x /= len;
   y /= len;
  }

  state.walkStick.x = x;
  state.walkStick.y = y;
  $('walkKnob').style.transform = 'translate('+x*40+'px,'+y*40+'px)';
 };

 const end = e => {
  e.stopPropagation();
  if (e.pointerId !== state.walkStick.id) return;

  state.walkStick = {x:0,y:0,id:null};
  $('walkKnob').style.transform = '';
 };

 stick.addEventListener('pointerdown',e => {
  e.stopPropagation();
  e.preventDefault();
  state.walkStick.id = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  set(e);
 });

 stick.addEventListener('pointermove',e => {
  e.stopPropagation();
  if (e.pointerId === state.walkStick.id) set(e);
 });

 stick.addEventListener('pointerup',end);
 stick.addEventListener('pointercancel',end);
 stick.addEventListener('lostpointercapture',end);
}

// 毎フレーム: スティック・キーの入力から速さと向きを決め、root とカメラの注視点を動かす
function updateWalk(dt) {
 const r = state.runtime;
 const m = state.motion;
 const k = state.walkKeys;

 // 倒れている間は移動しない（起き上がると再び操作できる）
 if (m.tester.dead) {
  m.tester.setSpeed(0);
  return;
 }

 let x = state.walkStick.x;
 let y = state.walkStick.y;

 if (k.a || k.arrowleft) x -= 1;
 if (k.d || k.arrowright) x += 1;
 if (k.w || k.arrowup) y -= 1;
 if (k.s || k.arrowdown) y += 1;

 const len = Math.hypot(x,y);

 if (len > 1) {
  x /= len;
  y /= len;
 }

 const mag = Math.min(1,Math.hypot(x,y));
 m.tester.setSpeed(mag*5);

 if (mag < .05 || !r?.root) return;

 // カメラから見た「右」と「奥」を基準に、スティックの向きを地面の向きに変換する
 const th = r.theta;
 const fx = -Math.sin(th);
 const fz = -Math.cos(th);
 const rx = Math.cos(th);
 const rz = -Math.sin(th);
 const dx = rx*x-fx*y;
 const dz = rz*x-fz*y;

 const o = r.root;
 const lim = m.walkLimit;
 const oldX = o.position.x;
 const oldZ = o.position.z;

 o.position.x = Math.max(-lim,Math.min(lim,oldX+dx*5*dt));
 o.position.z = Math.max(-lim,Math.min(lim,oldZ+dz*5*dt));
 o.rotation.y = Math.atan2(dx,dz);

 r.target.x += o.position.x-oldX;
 r.target.z += o.position.z-oldZ;
}

function loadGLTFExporter() {

 if (!gltfLoading) {
  gltfLoading = new Promise((ok,ng) => {
   const sc = document.createElement('script');
   sc.crossOrigin = 'anonymous';
   sc.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js';
   sc.onload = () => THREE.GLTFExporter ? ok() : ng(Error('load'));
   sc.onerror = () => ng(Error('load'));
   document.head.appendChild(sc);

   throw Error('GLB書き出しの仕組みを読み込めませんでした。インターネットにつないで、もう一度お試しください');

 }

 return gltfLoading;
}

// 保存領域の使用量（STORE で始まるキーの合計の目安）
function storageUsage() {
 let bytes = 0;

 try {
  for (let i=0;i<localStorage.length;i++) {
   const k = localStorage.key(i);
   if (k && k.startsWith(STORE)) bytes += (k.length+(localStorage.getItem(k) || '').length)*2;
  }
 } catch (_) {
  return null;
 }

 return bytes;
}

function storageMeter() {
 if (libraryBackend === 'idb') {
  refreshStorageEstimate();

  return `
   <p class="hint">
    保存先: ブラウザ内のデータベース（IndexedDB） · 使用量: <span class="storage-usage">${esc(storageEstimateText())}</span>
   </p>
  `;
 }

 const bytes = storageUsage();
 if (bytes === null) return '';

 const cap = 5*1024*1024;
 const mb = (bytes/1024/1024).toFixed(1);

 return `
  <p class="hint">保存領域の使用量: 約${mb}MB / 5MB（目安）</p>
  ${bytes > cap*.8
   ? '<p class="error">保存領域が残りわずかです。使わないモデルを削除するか、『ファイルに保存』で控えを取ってください</p>'
   : ''}
 `;
}

// ------------------------------------------------------------
// ライブラリの保存先（IndexedDB。使えないときは従来の localStorage）
// アプリ内ではメモリ上の写し（libraryData）を同期的に読み書きし、
// IndexedDB へは順番に非同期で保存する
// ------------------------------------------------------------

const LIB_DB = 'modelstudio-ai';
const LIB_OS = 'kv';
const LIB_KEY = 'library';
const LIB_LEGACY = 'legacyLocalStorage_';
// v2: プロジェクト単位のストアと、last を入れる meta レコード
const LIB_VERSION = 2;
const LIB_PS = 'projects';
const LIB_META = 'meta';
const LIB_CHANNEL = 'modelstudio-ai-library';

let libDb = null;
let libraryBackend = 'local';
let libraryData = {projects:[],last:null};
let libWriteChain = Promise.resolve();
let libChannel = null;
// このタブの未完了の書き込み数と、完了後に読み直しが必要かどうか
let libPending = 0;
let libReloadAgain = false;
// 起動時の準備が時間切れになったか（なったら後から完了しても切り替えない）
let libInitAbandoned = false;
let libInitTimedOut = false;
let storageEstimate = null;
let storageEstimateAt = 0;

function validLibrary(d) {
 return obj(d) && Array.isArray(d.projects);
}

function parseLibraryRaw(raw) {
 const data = parseJSON(raw,20000000);

 assert(validLibrary(data),'保存領域の形式が不正です');

 return data;
}

function withTimeout(p,ms) {
 return new Promise((resolve,reject) => {
  const t = setTimeout(() => reject(Error('timeout')),ms);
  p.then(
   v => {
    clearTimeout(t);
    resolve(v);
   },
   e => {
    clearTimeout(t);
    reject(e);
   }
  );
 });
}

function idbOpen() {
 return new Promise((resolve,reject) => {
  const req = indexedDB.open(LIB_DB,LIB_VERSION);

  req.onupgradeneeded = e => {
   const db = req.result;
   const tx = req.transaction;

   if (!db.objectStoreNames.contains(LIB_OS)) db.createObjectStore(LIB_OS);

   if (!db.objectStoreNames.contains(LIB_PS)) {
    const ps = db.createObjectStore(LIB_PS,{keyPath:'projectId'});

    // v1 で1件にまとめていたライブラリを、同じトランザクションでプロジェクト単位へ移す
    // 元の library レコードは削除せず、控えとして残す
    if (e.oldVersion >= 1) {
     const kv = tx.objectStore(LIB_OS);
     const get = kv.get(LIB_KEY);

     get.onsuccess = () => {
      const lib = get.result;
      if (!validLibrary(lib)) return;

      for (const p of lib.projects) {
       if (obj(p) && typeof p.projectId === 'string' && p.projectId) ps.put(p);
      }

      kv.put({last:lib.last ?? null},LIB_META);
     };
    }
   }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error || Error('IndexedDBを開けません'));
  // 古いバージョンを開いている別のタブが閉じるのを待つ（待ちすぎたら呼び出し側のタイムアウトで代替動作へ）
  req.onblocked = () => {};
 });
}

function idbRequest(mode,fn) {
 return new Promise((resolve,reject) => {
  const tx = libDb.transaction(LIB_OS,mode);
  const req = fn(tx.objectStore(LIB_OS));
  let result;

  req.onsuccess = () => {
   result = req.result;
  };
  tx.oncomplete = () => resolve(result);
  tx.onerror = () => reject(tx.error || req.error || Error('IndexedDBの処理に失敗しました'));
  tx.onabort = () => reject(tx.error || Error('IndexedDBの処理が中断されました'));
 });
}

const idbGet = key => idbRequest('readonly',s => s.get(key));
const idbPut = (key,value) => idbRequest('readwrite',s => s.put(value,key));

// projects ストアと meta レコードから、ライブラリ全体を組み立てる
function idbLoadLibrary() {
 return new Promise((resolve,reject) => {
  const tx = libDb.transaction([LIB_PS,LIB_OS],'readonly');
  const all = tx.objectStore(LIB_PS).getAll();
  const meta = tx.objectStore(LIB_OS).get(LIB_META);

  tx.oncomplete = () => resolve({
   projects: (all.result || []).filter(p => obj(p)),
   last: meta.result?.last ?? null
  });
  tx.onerror = () => reject(tx.error || Error('IndexedDBを読めません'));
  tx.onabort = () => reject(tx.error || Error('IndexedDBの読み込みが中断されました'));
 });
}

// 写し（prev）と新しいデータ（next）の差分。削除は prev にあって next に無いものだけ
function libraryDiff(prev,next) {
 const before = new Map(
  prev.projects
   .filter(p => obj(p) && typeof p.projectId === 'string' && p.projectId)
   .map(p => [p.projectId,p])
 );
 const nextIds = new Set();
 const puts = [];

 for (const p of next.projects) {
  if (!obj(p) || typeof p.projectId !== 'string' || !p.projectId) continue;

  nextIds.add(p.projectId);

  const old = before.get(p.projectId);
  if (!old || JSON.stringify(old) !== JSON.stringify(p)) puts.push(p);
 }

 const dels = [...before.keys()].filter(id => !nextIds.has(id));
 const last = (prev.last ?? null) !== (next.last ?? null) ? {last:next.last ?? null} : null;

 return {puts,dels,last};
}

// 差分を1つの読み書きトランザクションで適用する
function idbApplyDiff(diff) {
 return new Promise((resolve,reject) => {
  const tx = libDb.transaction([LIB_PS,LIB_OS],'readwrite');

  tx.oncomplete = () => resolve();
  tx.onerror = () => reject(tx.error || Error('IndexedDBに書き込めません'));
  tx.onabort = () => reject(tx.error || Error('IndexedDBへの書き込みが中断されました'));

  try {
   const ps = tx.objectStore(LIB_PS);
   diff.puts.forEach(p => ps.put(p));
   diff.dels.forEach(id => ps.delete(id));
   if (diff.last) tx.objectStore(LIB_OS).put(diff.last,LIB_META);
  } catch (e) {
   try {
    tx.abort();
   } catch (_) {}
   reject(e);
  }
 });
}

function postLibraryChange(ids) {
 try {
  libChannel?.postMessage({type:'library',ids});
 } catch (_) {}
}

// 自分の書き込みの後ろに並べて読み直す
function queueLibraryReload() {
 libWriteChain = libWriteChain.then(() => applyLibraryReload()).catch(() => {});
}

// IndexedDB から読み直して、写しと画面を合わせる
// 自分の未完了の書き込みがあるときは（force でない限り）完了後に回す
async function applyLibraryReload(force=false) {
 if (libraryBackend !== 'idb' || !libDb) return;

 if (libPending && !force) {
  libReloadAgain = true;
  return;
 }

 const data = await idbLoadLibrary();

 if (libPending && !force) {
  libReloadAgain = true;
  return;
 }

 libraryData = data;
 state.projects = clone(data.projects);

 // 編集中のプロジェクトが消えていたら、画面上のモデルは残して未保存扱いにする
 if (state.projectId && !data.projects.some(p => p.projectId === state.projectId)) {
  state.projectId = null;
  state.dirty = true;
  writeDraft();
 }

 if (!state.initialized) return;

 renderLibraryGrid();
 if (state.activeTab === 'model') renderPanel();
 else updateHeader();
}
