<!DOCTYPE html>
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#10151c">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<title>ModelStudio 2D</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#191f29;--line:#303b49;--muted:#a6b4c5;--cyan:#63d9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#edf4fc;font:14px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input:not([type=checkbox]):not([type=color]):not([type=range]){min-height:44px}
button{background:#283343;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.38;cursor:default}
.primary{background:#175d75;border-color:#327e97}
.danger{color:#ffb5b5}
input,select,textarea{background:#101721;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input[type=color]{height:44px;padding:4px}
input[type=checkbox]{width:21px;height:21px;vertical-align:middle}
input[type=range]{padding:0;accent-color:var(--cyan);min-height:32px}
textarea{resize:vertical;min-height:110px;font:13px/1.55 ui-monospace,monospace}
label{display:block;color:var(--muted);margin:10px 0 4px}
h2{font-size:19px;margin:4px 0 4px}
h3{font-size:15px;margin:14px 0 8px}
p{margin:8px 0}
.muted,small{color:var(--muted)}
body.preview-pinned{overflow:hidden}
body.preview-pinned .workspace{height:100vh;height:100dvh;overflow:hidden}
body.preview-pinned #viewport{flex:none;height:42svh;min-height:0}
body.preview-pinned #panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.workspace{display:flex;flex-direction:column}
#viewport{height:46svh;min-height:220px;position:relative;background:#202a36;overflow:hidden}
#view{display:block;width:100%;height:100%;touch-action:none}
#viewTools{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:12}
#moreMenu{position:relative}
#moreMenu>summary{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#18212df2;cursor:pointer;list-style:none}
#moreMenu>summary::-webkit-details-marker{display:none}
#moreMenu[open]>summary{border-color:var(--cyan);background:#204255}
#moreMenu .menu-sheet{position:absolute;top:calc(100% + 8px);right:0;width:min(320px,calc(100vw - 24px));max-height:calc(100dvh - 150px);overflow-y:auto;background:#191f29;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 36px #0008}
.menu-heading{font-size:12px;color:var(--muted);margin:12px 0 6px}
.menu-status{margin:0 0 10px;overflow-wrap:anywhere;font-size:13px}
.menu-check{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;color:#edf4fc;cursor:pointer}
.menu-check input{flex:none}
.menu-wide{display:block;width:100%;text-align:left}
.menu-color{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.menu-color input{width:64px}
#panel{padding:16px 16px calc(100px + env(safe-area-inset-bottom));min-width:0;overflow-wrap:anywhere}
.card{background:#1b2531b8;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card.review{border-color:var(--cyan)}
.hint{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#121b27f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:transparent;padding:8px 2px;font-size:13px;min-height:52px;white-space:nowrap}
nav button.active{background:#204255;color:#8eeaff}
nav span{display:block;font-size:17px}
#quickTools{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:4;display:flex;gap:5px}
#quickTools button{min-width:44px;min-height:44px;padding:7px;background:#18212ded}
#quickTools .quick-save{background:#175d75ed}
.workflow-head{margin-bottom:12px}
.workflow-switch{display:flex;gap:8px;margin:10px 0 14px}
.workflow-switch button{flex:1;min-height:44px}
.workflow-switch button.active{background:#204255;border-color:var(--cyan);color:#8eeaff}
.partrow{display:flex;gap:5px;margin:4px 0;align-items:center}
.partrow .pick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partrow small{margin-left:8px}
.selected{border-color:var(--cyan);background:#244654}
.toggle{width:44px;padding:5px;flex:none}
.error{border:1px solid #a85f65;background:#3c202b;color:#ffd9db;border-radius:10px;padding:10px;white-space:pre-wrap}
.success{color:#9decce}
.warnbox{border:1px solid #b98b52;background:#3a2e1c;color:#ffe2b8;border-radius:10px;padding:10px}
#error{position:fixed;top:calc(64px + env(safe-area-inset-top));left:12px;right:12px;margin:0;max-height:30dvh;overflow:auto;z-index:10}
#error[hidden]{display:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:90vw;background:#d7f8ff;color:#102733;padding:10px 18px;border-radius:12px;z-index:30;display:none}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}
.modal[hidden]{display:none}
.dialog{width:min(760px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.dialog textarea{height:40dvh}
.dialog .row{justify-content:flex-end}
.helpsteps{display:grid;gap:8px;margin:14px 0}
.helpsteps div{padding:10px;background:#25303e;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{min-height:44px;padding:6px 12px;border-radius:999px}
.nudgegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.nudgegrid button{min-height:44px;padding:6px 4px}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:6px 0}
.swatch{min-height:44px;padding:0;border-radius:10px;border:2px solid var(--line);font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.libcard{min-width:0}
.libopen{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;padding:6px;text-align:left}
.libopen img,.nothumb{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#1c2633;image-rendering:pixelated}
.nothumb{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.libopen b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libopen small{font-size:11px}
.libcard.current .libopen{border-color:var(--cyan);background:#1f3442}
.libacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:4px}
.libacts button{padding:6px 2px;font-size:12px}
#walkUI{position:absolute;inset:0;pointer-events:none;z-index:3}
#walkStick{position:absolute;left:16px;bottom:16px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}
#walkKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#63d9f5cc;pointer-events:none}
#walkActs{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#walkActs button{background:#175d75e6;min-width:92px}
#recoverBar{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;display:flex;gap:6px;align-items:center;max-width:calc(100vw - 24px);padding:8px;background:#3a2e1c;border:1px solid #b98b52;border-radius:14px}
#recoverBar button{white-space:nowrap}
#repairBar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:14;max-height:36dvh;overflow:auto}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#zoomTools{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;gap:5px;align-items:center}
#zoomTools[hidden]{display:none}
#zoomTools button{min-width:44px;min-height:44px;padding:7px;background:#18212ded}
#zoomLabel{min-width:34px;text-align:center;font-size:13px;text-shadow:0 1px 2px #000}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.5}
.thumbs{position:relative;display:flex;gap:6px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.thumbs button{flex:none;min-width:44px;min-height:44px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.thumbs canvas{display:block;image-rendering:pixelated;border-radius:4px}
@media(min-width:950px){#panel{padding-left:max(24px,calc((100vw - 1000px)/2));padding-right:max(24px,calc((100vw - 1000px)/2))}}
@media(max-width:500px){input,select,textarea{font-size:16px}}
</style>

<div id="error" class="error" role="alert" hidden></div>

<main class="workspace">
 <section id="viewport" aria-label="プレビュー">
  <canvas id="view"></canvas>
  <div id="zoomTools" role="group" aria-label="プレビューの拡大">
   <button data-action="zoomOut" aria-label="縮小">−</button>
   <span id="zoomLabel">1×</span>
   <button data-action="zoomIn" aria-label="拡大">＋</button>
  </div>
  <div id="quickTools" role="group" aria-label="編集と保存">
   <button id="undoBtn" data-action="undo" aria-label="元に戻す">↶</button>
   <button id="redoBtn" data-action="redo" aria-label="やり直す">↷</button>
   <button data-action="save" class="quick-save">保存</button>
  </div>
 </section>
 <section id="panel"></section>
</main>

<div id="viewTools">
 <details id="moreMenu">
  <summary aria-label="その他の操作と表示設定">☰ その他</summary>
  <div class="menu-sheet">
   <p id="modelTitle" class="menu-status"></p>
   <p><button data-action="library" class="menu-wide">▦ ライブラリ</button></p>
   <p><button data-tab="model" class="menu-wide">キャラ情報</button></p>
   <p class="menu-heading">ファイルとデータ</p>
   <div class="grid2">
    <button data-action="fileOpen">ファイルから開く</button>
    <button data-action="fileSave">ファイルに保存</button>
    <button data-action="json">データをコピー</button>
    <button data-action="saveAs">別名で保存</button>
   </div>
   <p class="menu-heading">表示設定</p>
   <label class="menu-check"><input type="checkbox" id="pinViewport">プレビューを上部に固定</label>
   <label class="menu-check"><input type="checkbox" id="gridToggle">方眼を表示</label>
   <label class="menu-color">背景色<input type="color" id="background" value="#202a36" aria-label="背景色"></label>
   <p class="menu-heading">ヘルプ</p>
   <button data-action="guide" class="menu-wide">? 使い方</button>
   <p class="menu-heading">開発者向け</p>
   <p><button data-action="selfTest" class="menu-wide">動作チェック</button></p>
  </div>
 </details>
</div>

<nav aria-label="制作の4工程">
 <button data-tab="ai"><span aria-hidden="true">✧</span>① つくる</button>
 <button data-tab="repair"><span aria-hidden="true">✎</span>② なおす</button>
 <button data-tab="motion"><span aria-hidden="true">▶</span>③ 動かす</button>
 <button data-tab="export"><span aria-hidden="true">↗</span>④ ゲームへ</button>
</nav>
<input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="libraryFile" accept=".json,application/json" hidden>
<input type="file" id="answerFile" accept=".json,.txt,application/json,text/plain" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden>
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div class="row" id="dialogActions"></div>
 </section>
</div>

<script>
'use strict';

// ============================================================
// 1. 定数
// ============================================================
const STORE = 'modelstudio2d.v1';
const DRAFT = STORE+'.draft';
const PREFS = STORE+'.prefs';
const LIMIT = {sizeMin:8,sizeMax:128,colors:32,parts:40,variants:16,animations:50,frames:24,bytes:1000000,history:25};
// 標準の動き [ID, 表示名, くり返し, fps, コマ数の目安]
const STANDARD = [
 ['idle','待機',true,4,4],['walk','歩く',true,8,4],['run','走る',true,12,4],['jump','ジャンプ',false,10,5],
 ['attack','攻撃',false,10,4],['hurt','やられ',false,8,3],['die','倒れる',false,6,4],['emote','喜ぶ',false,8,4]
];

// ============================================================
// 2. 共通レンダラ（外側の状態に依存しない。ゲームにも同じ関数をそのまま出力する）
// ============================================================
function createSpriteRenderer() {
 // 向きのキー: left・right・side は "side"、down・up はそのまま
 function dirKey(direction) {
  return direction === 'down' || direction === 'up' ? direction : 'side';
 }

 function drawRows(rows,palette) {
  const h = Math.max(1,rows.length);
  const w = Math.max(1,...rows.map(r => r.length));
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row,y) => {
   for (let x=0;x<row.length;x++) {
    const col = palette[row[x]];
    if (col) {
     g.fillStyle = col;
     g.fillRect(x,y,1,1);
    }
   }
  });
  return c;
 }

 // 部品の絵をオフスクリーンCanvasに描いて保持する
 function buildSprite(spec) {
  const parts = {};
  for (const id of Object.keys(spec.parts)) {
   const p = spec.parts[id];
   const variants = {};
   for (const vid of Object.keys(p.variants)) variants[vid] = drawRows(p.variants[vid],spec.palette);
   parts[id] = {id,z:p.z || 0,position:p.position,variants,effect:p.effect === true,visible:p.visible !== false};
  }
  const order = Object.keys(parts).map(id => parts[id]).sort((a,b) => a.z-b.z);
  return {size:spec.settings.size.slice(),parts,order,pose:null};
 }

 // 左上を (x,y) に合わせて描く。pose が無いときは基本の姿勢（効果部品は隠す）
 function drawSprite(ctx,sprite,x,y,o) {
  const s = o && o.scale || 1;
  const flip = !!(o && o.flipX);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x,y);
  if (flip) {
   ctx.translate(sprite.size[0]*s,0);
   ctx.scale(-1,1);
  }
  let order = sprite.order;
  if (sprite.pose) {
   order = sprite.order
    .map((part,i) => ({part,i,z:sprite.pose[part.id] && typeof sprite.pose[part.id].z === 'number' ? sprite.pose[part.id].z : part.z}))
    .sort((a,b) => a.z-b.z || a.i-b.i)
    .map(x => x.part);
  }
  for (const part of order) {
   const p = sprite.pose && sprite.pose[part.id]
    || {dx:0,dy:0,variant:'base',flipX:false,visible:part.visible && !part.effect};
   if (!p.visible) continue;
   const img = part.variants[p.variant] || part.variants.base;
   const px = (part.position[0]+p.dx)*s;
   const py = (part.position[1]+p.dy)*s;
   if (p.flipX) {
    ctx.save();
    ctx.translate(px+img.width*s,py);
    ctx.scale(-1,1);
    ctx.drawImage(img,0,0,img.width*s,img.height*s);
    ctx.restore();
   } else {
    ctx.drawImage(img,px,py,img.width*s,img.height*s);
   }
  }
  ctx.restore();
 }

 function clipTicks(c) {
  return c.frames.reduce((n,f) => n+(f.hold || 1),0);
 }

 function clipDuration(c) {
  return clipTicks(c)/(c.fps || 8);
 }

 // 動きの再生。コマごとの「ずれ・絵の差し替え・反転・表示」を sprite.pose に当てはめる
 function createAnimator(sprite,spec,opt) {
  const showEffects = !!(opt && opt.showEffects);
  const clips = spec.animations || {};
  const handlers = {};
  const uses = {};
  let cur = null;
  let dirk = spec.settings && spec.settings.view === 'topdown' ? 'down' : 'side';

  // 向き付きの動き（id_向き）があればそれ、なければ id を使う。無ければ null
  function resolve(id) {
   if (clips[id+'_'+dirk]) return id+'_'+dirk;
   return clips[id] ? id : null;
  }

  // 向きを変える。再生中なら、同じ動きを解決し直してコマ番号を引き継ぐ
  function setDirection(direction) {
   const k = dirKey(direction);
   if (k === dirk) return;
   dirk = k;
   if (cur && !cur.exact) {
    const rid = resolve(cur.id);
    if (rid && rid !== cur.rid) {
     const c = clips[rid];
     const index = Math.min(c.frames.length-1,cur.index);
     cur.rid = rid;
     cur.index = index;
     cur.tick = index ? frameEnd(c,index-1) : 0;
    }
   }
   apply();
  }

  for (const cid of Object.keys(clips)) {
   const u = uses[cid] = new Set(clips[cid].show || []);
   (clips[cid].frames || []).forEach(f => Object.keys(f.parts || {}).forEach(k => u.add(k)));
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(id,index) {
   const rid = cur && cur.id === id ? cur.rid : id;
   for (const ev of clips[rid].events || []) {
    if (ev[0] === index) emit(ev[1],id);
   }
  }

  function frameEnd(c,index) {
   let n = 0;
   for (let i=0;i<=index;i++) n += c.frames[i].hold || 1;
   return n;
  }

  function apply() {
   const pose = {};
   const c = cur ? clips[cur.rid] : null;
   const f = c ? c.frames[cur.index] : null;
   const base = spec.directions && spec.directions[dirk] && spec.directions[dirk].parts || {};
   for (const id of Object.keys(sprite.parts)) {
    const part = sprite.parts[id];
    const b = base[id] || null;
    const d = f && f.parts && f.parts[id] || null;
    let on = true;
    let variant = 'base';
    let flip = false;
    let z = part.z;
    // 基本 → 向きの指定 → コマの指定 の順に重ねる（後のものが上書き）
    for (const o of [b,d]) {
     if (!o) continue;
     if (o.visible !== undefined) on = o.visible !== false;
     if (o.variant && part.variants[o.variant]) variant = o.variant;
     if (o.flipX !== undefined) flip = !!o.flipX;
     if (typeof o.z === 'number') z = o.z;
    }
    let visible = part.visible && on;
    if (part.effect) visible = visible && (c ? uses[cur.rid].has(id) : showEffects);
    pose[id] = {
     dx: (b && b.offset ? b.offset[0] : 0)+(d && d.offset ? d.offset[0] : 0),
     dy: (b && b.offset ? b.offset[1] : 0)+(d && d.offset ? d.offset[1] : 0),
     variant,
     flipX: flip,
     visible,
     z
    };
   }
   sprite.pose = pose;
  }

  function play(id,o) {
   const exact = !!(o && o.exact);
   const rid = exact ? (clips[id] ? id : null) : resolve(id);
   if (!rid) return false;
   if (cur && cur.id === id && !(o && o.restart)) return true;
   cur = {id,rid,exact,tick:0,index:0,fresh:true,done:false};
   apply();
   return true;
  }

  function stop() {
   cur = null;
   apply();
  }

  // 指定したコマの姿勢で止めて表示する（合図は発火しない）
  function seek(id,frame,exact) {
   const rid = exact ? (clips[id] ? id : null) : resolve(id);
   if (!rid) return false;
   const c = clips[rid];
   const index = Math.min(c.frames.length-1,Math.max(0,Math.floor(Number(frame) || 0)));
   cur = {id,rid,exact:!!exact,tick:index ? frameEnd(c,index-1) : 0,index,fresh:false,done:false};
   apply();
   return true;
  }

  function update(dt,o) {
   if (!cur) return;
   const c = clips[cur.rid];
   const speed = o && o.speed != null ? o.speed : 1;
   if (cur.fresh) {
    cur.fresh = false;
    fire(cur.id,cur.index);
   }
   let t = cur.tick+Math.max(0,dt)*(c.fps || 8)*speed;
   const total = clipTicks(c);
   let guard = 0;
   while (guard++ < 500) {
    if (t < frameEnd(c,cur.index)) break;
    if (cur.index < c.frames.length-1) {
     cur.index++;
     fire(cur.id,cur.index);
    } else if (c.loop !== false) {
     t -= total;
     cur.index = 0;
     fire(cur.id,0);
    } else {
     t = total;
     cur.done = true;
     break;
    }
   }
   cur.tick = t;
   apply();
  }

  function on(name,fn) {
   (handlers[name] = handlers[name] || []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.keys(clips).map(id => ({
    id,name:clips[id].name || id,duration:clipDuration(clips[id]),loop:clips[id].loop !== false
   }));
  }

  apply();

  return {
   play,stop,seek,update,on,list,resolve,setDirection,
   get direction() { return dirk; },
   get resolved() { return cur ? cur.rid : null; },
   get playing() { return cur ? cur.id : null; },
   get frame() { return cur ? cur.index : 0; },
   get done() { return !!(cur && cur.done); }
  };
 }

 // 速さから待機・歩く・走るを選ぶ
 function pickLocomotion(clips,speed,o) {
  const walkSpeed = o && o.walkSpeed || 1.2;
  const runSpeed = o && o.runSpeed || 4;
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  if (v < walkSpeed*.04) return {id:first('idle'),rate:1};
  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }
  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。action の1回きりの動きが終わると移動の動きへ戻る（die は戻らない）
 function createController(animator,spec,opts) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;
  let hold = null;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
   hold = null;
  }

  function play(id) {
   if (id === null || id === undefined) {
    hold = null;
    loco = undefined;
    return true;
   }
   if (dead || !animator.resolve(id)) return false;
   hold = id;
   oneShot = null;
   loco = id;
   animator.play(id);
   return true;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id) {
   const rid = animator.resolve(id);
   if (dead || !rid) return false;
   animator.play(id,{restart:true});
   oneShot = {id,left:clipDuration(clips[rid])};
   loco = undefined;
   if (id === 'die') dead = true;
   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);
   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }
   const avail = {};
   for (const k of ['idle','walk','run']) if (animator.resolve(k)) avail[k] = true;
   const next = hold ? {id:hold,rate:1} : pickLocomotion(avail,speed,opts);
   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{restart:true});
    else animator.stop();
   }
   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,action,play,update,reset,
   get current() { return oneShot ? oneShot.id : loco || null; },
   get dead() { return dead; }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.update(dt); hero.draw(ctx,x,y,{scale});
 function createCharacter(spec,opts) {
  const sprite = buildSprite(spec);
  const animator = createAnimator(sprite,spec);
  const controller = createController(animator,spec,opts || {});
  let last = {x:0,y:0,scale:1};
  const topdown = !!(spec.settings && spec.settings.view === 'topdown');

  // 向き: 全方位マップは direction、横スクロールは facing
  function heading(self) {
   return topdown ? (self.direction || 'down') : (self.facing || 'right');
  }

  return {
   sprite,
   animator,
   facing: 'right',
   direction: 'down',
   setSpeed: controller.setSpeed,
   action: controller.action,
   play: controller.play,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() { return controller.current; },
   // 足元の中央を (x,y) に合わせて描く
   draw(ctx,x,y,o) {
    const s = o && o.scale || 1;
    last = {x,y,scale:s};
    const dir = heading(this);
    animator.setDirection(dir);
    drawSprite(ctx,sprite,Math.round(x-sprite.size[0]*s/2),Math.round(y-sprite.size[1]*s),{scale:s,flipX:dir === 'left'});
   },
   // 直前の draw での、取付点の画面上の座標
   getAnchor(id) {
    const a = spec.anchors && spec.anchors[id];
    if (!a) return null;
    let px = a.position[0];
    let py = a.position[1];
    const part = a.parent && sprite.parts[a.parent];
    if (part) {
     const pose = sprite.pose && sprite.pose[a.parent];
     px += part.position[0]+(pose ? pose.dx : 0);
     py += part.position[1]+(pose ? pose.dy : 0);
    }
    const W = sprite.size[0];
    const H = sprite.size[1];
    const s = last.scale;
    const fx = heading(this) === 'left' ? W-px-.5 : px+.5;
    return {x:last.x-W*s/2+fx*s,y:last.y-H*s+(py+.5)*s};
   },
   dispose() {
    animator.stop();
   }
  };
 }

 return {buildSprite,drawSprite,createAnimator,pickLocomotion,createController,createCharacter,clipDuration,dirKey};
}

// JSONの文字列の外側にある全角記号・全角スペースだけを半角に戻す（名前や説明文の日本語は変えない）
function fixOutsideStrings(t) {
 let out = '';
 let inStr = false;
 let esc1 = false;
 for (const ch of t) {
  if (inStr) {
   out += ch;
   if (esc1) esc1 = false;
   else if (ch === '\\') esc1 = true;
   else if (ch === '"') inStr = false;
  } else if (ch === '"') {
   inStr = true;
   out += ch;
  } else if (ch >= '\uFF01' && ch <= '\uFF5E') {
   out += String.fromCharCode(ch.charCodeAt(0)-0xFEE0);
  } else if (ch === '\u3000') {
   out += ' ';
  } else {
   out += ch;
  }
 }
 return out;
}

function normalizePastedText(text,fixQuotes) {
 let t = String(text ?? '').replace(/[\u200B-\u200D\uFEFF]/g,'');
 // 全角・曲線の引用符は、読み直すとき（fixQuotes）だけ半角に直す（説明文の中の引用符を壊さないため）
 if (fixQuotes) {
  t = t.replace(/[\u201C\u201D\u201E\u201F\u2033\uFF02]/g,'"').replace(/[\u2018\u2019]/g,"'");
 }
 t = t.replace(/\u00A0/g,' ').trim();
 t = t.replace(/^`{3}[A-Za-z]*\s*\n?/,'').replace(/\n?`{3}\s*$/,'').trim();
 // 説明文の途中にコードフェンスがあるときは、その中身から読む
 const fence = /`{3}[A-Za-z0-9_-]*[ \t]*\r?\n/.exec(t);
 if (fence && /^\s*[{[]/.test(t.slice(fence.index+fence[0].length))) t = t.slice(fence.index+fence[0].length).trim();
 // 操作の配列だけの回答（[{...}]）は、先頭の [ を残す
 const a = /^\[\s*\{/.test(t) ? 0 : t.indexOf('{');
 if (a > 0) t = t.slice(a);
 return fixOutsideStrings(t);
}

// 構文エラーの修復: 文字列の後ろの式・末尾のカンマ・JSONの後ろの余分な文章を取り除く
function repairJSONSyntax(t) {
 const notes = [];
 let s = t;
 const calls = /("(?:[^"\\\n]|\\.)*")\s*\.\s*[A-Za-z_$][\w$]*\s*\((?:[^()]|\([^()]*\))*\)/g;
 const s1 = s.replace(calls,'$1');
 if (s1 !== s) {
  s = s1;
  notes.push('文字列の後ろに付いた式（.replace(…) など）を取り除きました');
 }
 const s2 = s.replace(/,(\s*[}\]])/g,'$1');
 if (s2 !== s) {
  s = s2;
  notes.push('末尾の余分なカンマを取り除きました');
 }
 const end = s.lastIndexOf('}');
 if (end >= 0 && end < s.length-1) {
  s = s.slice(0,end+1);
  notes.push('JSONの後ろの余分な文章を取り除きました');
 }
 return {text:s,notes};
}

const CUT_NOTE = 'AIの回答が途中で切れていたため、最後まで書かれた項目までを読み込みました（末尾の内容が欠けている可能性があります）';

// 構文エラーの修復（強め）: 文字列の内外を見分けながら読み、よくある崩れを直す
// コメント・カンマ抜け・引用符のないキー・単一引用符・True/None・括弧の対応・途中で切れた回答
function repairJSONStructure(t) {
 const notes = new Set();
 const lit = {true:'true',false:'false',null:'null',True:'true',False:'false',None:'null',TRUE:'true',FALSE:'false',NULL:'null',undefined:'null'};
 const closer = ch => ch === '{' ? '}' : ']';
 const n = t.length;
 let out = '';
 let stack = '';
 let prev = '';
 let safe = null;
 let done = false;
 let i = 0;
 // 値の直後に、カンマなしで次の値が始まったら補う
 const value = () => {
  if (prev === 'v' && stack) {
   out += ',';
   notes.add('抜けていたカンマを補いました');
  }
 };

 while (i < n && !done) {
  const c = t[i];
  if (c === ' ' || c === '\n' || c === '\r' || c === '\t') {
   out += c;
   i++;
   continue;
  }
  if (c === '"' || c === "'") {
   let j = i+1;
   let body = '';
   let closed = false;
   while (j < n) {
    const d = t[j];
    if (d === '\\' && j+1 < n) {
     body += t[j+1] === "'" ? "'" : d+t[j+1];
     j += 2;
     continue;
    }
    if (d === c) {
     closed = true;
     j++;
     break;
    }
    if (d === '\n') {
     body += '\\n';
     notes.add('文字列の中の改行を直しました');
    } else if (d === '\t') {
     body += '\\t';
    } else if (d === '"') {
     body += '\\"';
    } else if (d !== '\r') {
     body += d;
    }
    j++;
   }
   if (!closed) break;
   value();
   if (c === "'") notes.add("引用符「'」で書かれた文字列を、半角の二重引用符に直しました");
   out += '"'+body+'"';
   i = j;
   prev = 'v';
   continue;
  }
  if (c === '/' && (t[i+1] === '/' || t[i+1] === '*')) {
   const line = t[i+1] === '/';
   const e = line ? t.indexOf('\n',i) : t.indexOf('*/',i+2);
   i = e < 0 ? n : (line ? e : e+2);
   notes.add('コメントを取り除きました');
   continue;
  }
  if (c === '{' || c === '[') {
   value();
   stack += c;
   out += c;
   prev = c;
   i++;
   continue;
  }
  if (c === '}' || c === ']') {
   i++;
   if (!stack) continue;
   if (closer(stack[stack.length-1]) !== c) {
    if (stack.length > 1 && closer(stack[stack.length-2]) === c) {
     out += closer(stack[stack.length-1]);
     stack = stack.slice(0,-1);
    }
    notes.add('括弧の対応を直しました');
   }
   out += closer(stack[stack.length-1]);
   stack = stack.slice(0,-1);
   prev = 'v';
   safe = {len:out.length,stack};
   if (!stack) done = true;
   continue;
  }
  if (c === ',') {
   i++;
   if (prev === ',' || prev === '{' || prev === '[') {
    notes.add('余分なカンマを取り除きました');
    continue;
   }
   safe = {len:out.length,stack};
   out += c;
   prev = ',';
   continue;
  }
  if (c === ':') {
   out += c;
   prev = ':';
   i++;
   continue;
  }
  if (c === '+' && /[0-9]/.test(t[i+1] || '')) {
   i++;
   notes.add('数値の前の「+」を取り除きました');
   continue;
  }
  const m = /^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/.exec(t.slice(i,i+40));
  if (m) {
   value();
   out += m[0];
   i += m[0].length;
   prev = 'v';
   continue;
  }
  const w = /^[A-Za-z_$][\w$]*/.exec(t.slice(i,i+80));
  if (w) {
   let k = i+w[0].length;
   while (k < n && (t[k] === ' ' || t[k] === '\t')) k++;
   if (t[k] === ':' && stack.endsWith('{') && (prev === '{' || prev === ',' || prev === 'v')) {
    value();
    out += '"'+w[0]+'"';
    notes.add('引用符のないキーに引用符を補いました');
    prev = 'v';
   } else if (own(lit,w[0])) {
    value();
    out += lit[w[0]];
    if (lit[w[0]] !== w[0]) notes.add('true・false・null の書き方を直しました');
    prev = 'v';
   } else {
    out += w[0];
    prev = '?';
   }
   i += w[0].length;
   continue;
  }
  out += c;
  prev = '?';
  i++;
 }

 if (!done) {
  // 途中で切れている: 最後まで書かれた項目まで戻り、閉じ括弧を補う
  if (!stack || !safe) return {text:t,notes:[]};
  out = out.slice(0,safe.len);
  for (let k=safe.stack.length-1;k>=0;k--) out += closer(safe.stack[k]);
  notes.add(CUT_NOTE);
 } else if (t.slice(i).trim()) {
  notes.add('JSONの後ろの余分な文章を取り除きました');
 }
 return {text:out,notes:[...notes]};
}

// 構文エラーの位置（0始まり）を返す。エラーが無ければ -1
function jsonErrorPos(t) {
 let i = 0;
 const fail = () => {
  throw i;
 };
 const ws = () => {
  while (i < t.length && ' \t\n\r'.includes(t[i])) i++;
 };
 const str = () => {
  i++;
  while (i < t.length) {
   const c = t[i];
   if (c === '\\') {
    i += 2;
   } else if (c === '"') {
    i++;
    return;
   } else if (c === '\n') {
    fail();
   } else {
    i++;
   }
  }
  fail();
 };
 const val = () => {
  ws();
  const c = t[i];
  if (c === '"') return str();
  if (c === '{') {
   i++;
   ws();
   if (t[i] === '}') {
    i++;
    return;
   }
   for (;;) {
    ws();
    if (t[i] !== '"') fail();
    str();
    ws();
    if (t[i] !== ':') fail();
    i++;
    val();
    ws();
    if (t[i] === ',') {
     i++;
     continue;
    }
    if (t[i] === '}') {
     i++;
     return;
    }
    fail();
   }
  }
  if (c === '[') {
   i++;
   ws();
   if (t[i] === ']') {
    i++;
    return;
   }
   for (;;) {
    val();
    ws();
    if (t[i] === ',') {
     i++;
     continue;
    }
    if (t[i] === ']') {
     i++;
     return;
    }
    fail();
   }
  }
  const m = /^(?:-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null)/.exec(t.slice(i,i+40));
  if (!m) fail();
  i += m[0].length;
 };
 try {
  val();
  ws();
  if (i < t.length) fail();
  return -1;
 } catch (e) {
  return typeof e === 'number' ? e : -1;
 }
}

function syntaxHint(text) {
 const pos = jsonErrorPos(String(text));
 if (pos < 0) return '';
 const ch = text[pos];
 const code = ch ? ch.charCodeAt(0) : 0;
 const what = !ch ? '（データの終わり）' : '（この文字: '+(code > 126 || code < 32 ? cpOf(ch) : ch)+'）';
 return '\n位置: '+(pos+1)+'文字目'+what
  + '\n抜粋: '+text.slice(Math.max(0,pos-30),pos).replace(/\s+/g,' ')+'【ここ】'+text.slice(pos,pos+30).replace(/\s+/g,' ');
}

function parseJSONWithRepair(t) {

  return parseJSON(t);

  // まず軽い修復、だめなら構造を見ながらの強い修復を試す
  const r = repairJSONSyntax(t);
  const d = repairJSONStructure(t);
  const r2 = d.text.trim().endsWith(']')
   ? {text:d.text.replace(/,(\s*[}\]])/g,'$1'),notes:[]}
   : repairJSONSyntax(d.text);
  for (const c of [r,{text:r2.text,notes:[...d.notes,...r2.notes]}]) {
   if (c.text === t) continue;
   try {
    const v = parseJSON(c.text);
    if (repairNotes) repairNotes.push(...c.notes);
    return v;
   } catch (_) {}
  }
  throw e;

}

// 絵の1文字を直す。直せないときは元の文字を返す（検証でエラーになる）
function fixRowChar(ch,pal) {
 if (ch === '.' || own(pal,ch)) return ch;
 if (ch === '_') return '.';
 if (ch === '\u3000' || ch === '\u00A0' || ch === ' ' || ch === '\t') return '.';
 const code = ch.charCodeAt(0);
 let c = ch;
 if (code >= 0xFF01 && code <= 0xFF5E) c = String.fromCharCode(code-0xFEE0);
 else if (own(FIX_CONFUSABLE,ch)) c = FIX_CONFUSABLE[ch];
 if (c === '_') return '.';
 if (c === '.' || own(pal,c)) return c;
 // 大文字と小文字の取り違え（palette に片方だけあるとき）
 const alt = c === c.toLowerCase() ? c.toUpperCase() : c.toLowerCase();
 if (alt !== c && alt.length === 1 && own(pal,alt)) return alt;

}

// 絵の行の自動修復: 透明は「_」も「.」も可。「…」・全角・見た目の同じ別文字を戻し、行の長さをそろえる
function repairSpecSymbols(s) {
 const pal = s.palette;
 let moved = null;
 if (own(pal,'_')) {
  moved = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('').find(c => !own(pal,c)) || null;
  if (moved) {
   pal[moved] = pal['_'];
   delete pal['_'];
   if (repairNotes) repairNotes.push('色の記号「_」は透明に使うため、「'+moved+'」に付け替えました');
  }
 }

 const st = {ell:0,sym:0,pad:0,cut:0,ex:[],unk:0,unkEx:[]};

 for (const p of Object.values(s.parts)) {
  if (!obj(p) || !obj(p.variants)) continue;
  for (const vid of Object.keys(p.variants)) {
   const src = p.variants[vid];
   if (!Array.isArray(src) || !src.length || !src.every(r => typeof r === 'string')) continue;

   let rows = src.map(r => {
    let t = r;
    for (const [mark,dots] of [['\u2026','...'],['\u2025','..']]) {
     if (!own(pal,mark) && t.includes(mark)) {
      st.ell += t.split(mark).length-1;
      t = t.split(mark).join(dots);
     }
    }
    let out = '';
    for (const ch of t) {
     let f = ch === '_' && moved ? moved : fixRowChar(ch,pal);
     if (f !== '.' && !own(pal,f)) {
      // どうしても直せない記号は、透明にして読み込む（読み込みの失敗を避ける）
      st.unk++;
      if (st.unkEx.length < 6 && !st.unkEx.includes(ch)) st.unkEx.push(ch);
      f = '.';
     } else if (f !== ch && ch !== '_') {
      st.sym++;
      const tag = cpOf(ch)+'→'+f;
      if (st.ex.length < 4 && !st.ex.includes(tag)) st.ex.push(tag);
     }
     out += f;
    }
    return out;
   });

   const counts = {};
   rows.forEach(r => {
    counts[r.length] = (counts[r.length] || 0)+1;
   });
   let mode = 0;
   let best = 0;
   for (const k of Object.keys(counts)) {
    if (counts[k] > best || (counts[k] === best && Number(k) > mode)) {
     best = counts[k];
     mode = Number(k);
    }
   }
   rows = rows.map(r => {
    if (r.length > mode && /^\.*$/.test(r.slice(mode))) {
     st.cut++;
     return r.slice(0,mode);
    }
    return r;
   });
   const w = Math.max(...rows.map(r => r.length));
   rows = rows.map(r => {
    if (r.length < w) {
     st.pad++;
     return r.padEnd(w,'.');
    }
    return r;
   });
   p.variants[vid] = rows;
  }
 }

 if (repairNotes) {
  if (st.unk) repairNotes.push('palette にない記号 '+st.unk+'か所（'+st.unkEx.join('、')+'）を透明にして読み込みました。絵が欠けて見える所は「なおす」で直してください');
  if (st.ell) repairNotes.push('絵の行の「…」（U+2026など）'+st.ell+'か所を、元の「.」に戻しました');
  if (st.sym) repairNotes.push('palette にない記号 '+st.sym+'か所を、見た目の同じ記号などに置き換えました（'+st.ex.join('、')+'）');
  if (st.cut) repairNotes.push('長すぎる行 '+st.cut+'行の、右端の透明部分を切りました');
  if (st.pad) repairNotes.push('長さの足りない行 '+st.pad+'行を、右側を透明で埋めてそろえました');
 }
}

// AIに渡す絵は、透明を「_」で書く（化けやすい「.」の連続を避けるため）
function toAIRows(spec) {
 const c = clone(spec);
 for (const p of Object.values(c.parts || {})) {
  for (const k of Object.keys(p.variants || {})) {
   p.variants[k] = p.variants[k].map(r => r.replace(/\./g,'_'));
  }
 }
 return c;
}

function showRepairNotes(notes) {

// ファイルから読み込む（貼り付けと同じ補正を通す）

function cleanPastedJSON(text,fixQuotes) {
 return normalizePastedText(String(text ?? ''),fixQuotes);
}

function tryParseAI(text,fixQuotes) {
 const t = cleanPastedJSON(text,fixQuotes);
 try {
  return {ok:true,value:parseJSONWithRepair(t),text:t};
 } catch (e) {
  return {ok:false,error:e,text:t};
 }
}

function parseAIJSON(text) {
 // 全角引用符は、まず変えずに読み、失敗したときだけ半角に直して読み直す
 const first = tryParseAI(text,false);
 if (first.ok) return first.value;
 const second = tryParseAI(text,true);
 if (second.ok) {
  if (repairNotes) repairNotes.push('全角・曲線の引用符を、半角の引用符に直しました');
  return second.value;
 }
 const e = second.error;
 const t = second.text;
 if (/構文エラー/.test(e.message) && t.startsWith('{') && !t.endsWith('}')) {
  throw Error('AIの回答が途中で切れている可能性があります。頼む動きの数を減らすか、AIに続きを出すよう頼んでください');

 throw e;
}

// 読み込む内容が修正データ（SPRITE_PATCH_V1 または operations を持つ）か
function looksLikePatch(text) {
 try {
  const d = parseAIJSON(text);
  return Array.isArray(d) || obj(d) && (d.format === 'SPRITE_PATCH_V1' || Array.isArray(d.operations));
 } catch (_) {
  return false;
 }
}

function validId(id) {
 return typeof id === 'string'
  && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(id)
  && !['constructor','prototype','__proto__'].includes(id);
}

function int(n,label,min,max) {
 assert(Number.isInteger(n) && n >= min && n <= max,label+': '+min+'〜'+max+'の整数が必要です');
}

function newId(base,taken) {
 if (!taken.includes(base)) return base;
 let i = 2;
 while (taken.includes(base+i)) i++;
 return base+i;
}

// ============================================================
// 5. 検証
// ============================================================
// ---- 書き方の揺れの吸収（検証の前に、意味を変えずに直せるものを直す） ----
function fixNote(m) {
 if (repairNotes) repairNotes.push(m);
}

function looseNum(v) {
 return typeof v === 'string' && v.trim() !== '' && Number.isFinite(Number(v)) ? Number(v) : v;
}

// [x,y] の組を整数にそろえる。直す所が無ければ元の値をそのまま返す
function loosePair(v,min,max) {
 let a = v;
 if (obj(a) && (own(a,'x') || own(a,'y'))) a = [a.x ?? 0,a.y ?? 0];
 if (Array.isArray(a) && a.length > 2) a = a.slice(0,2);
 if (!Array.isArray(a) || a.length !== 2) return v;
 const out = a.map(n => {
  const x = looseNum(n);
  return typeof x === 'number' && Number.isFinite(x) ? Math.max(min,Math.min(max,Math.round(x))) : n;
 });
 return a === v && out[0] === v[0] && out[1] === v[1] ? v : out;
}

// 修正データの操作の書き方（op の別名・path の形）をそろえる
function fixPatchOp(op) {
 if (!obj(op)) return op;
 const o = {...op};
 const alias = {set:'replace',update:'replace',change:'replace',modify:'replace',put:'replace',delete:'remove',del:'remove',insert:'add',create:'add',append:'add'};
 if (typeof o.op !== 'string') {
  if (typeof o.type === 'string') o.op = o.type;
  else if (typeof o.action === 'string') o.op = o.action;
 }
 if (typeof o.op === 'string') {
  const k = o.op.trim().toLowerCase();
  o.op = own(alias,k) ? alias[k] : k;
 }
 if (typeof o.path === 'string') {
  let p = o.path.trim().replace(/^#/,'').replace(/\[(\d+)\]/g,'/$1');
  if (p && !p.startsWith('/')) p = '/'+(p.includes('/') ? p : p.replace(/\./g,'/'));
  if (p.length > 1) p = p.replace(/\/+$/,'');
  o.path = p;
 }
 if (o.op !== op.op || o.path !== op.path) fixNote('修正データの操作の書き方（op・path）を直しました');
 return o;
}

function relaxSpec(s) {
 const marks = new Set();
 const mark = m => marks.add(m);
 const N_NUM = '数値や true/false の書き方（小数・文字列・範囲外など）を直しました';
 const N_REF = '存在しない部品や絵を指していた指定を取り除きました';
 const N_ADD = '不足していた項目（format・meta・size・fps・base など）を補いました';
 const N_SHAPE = '絵・コマ・合図などの書き方を、標準の形に直しました';
 const N_COLOR = '色の書き方を #rrggbb に直しました';
 const N_CLEAR = '透明として定義された色を palette から外しました（絵の中では透明として扱います）';

 const num = (o,k,min,max,round) => {
  if (!own(o,k)) return;
  let v = looseNum(o[k]);
  if (typeof v !== 'number' || !Number.isFinite(v)) return;
  if (round) v = Math.round(v);
  v = Math.max(min,Math.min(max,v));
  if (v !== o[k]) {
   o[k] = v;
   mark(N_NUM);
  }
 };
 const bool = (o,k) => {
  if (!own(o,k)) return;
  const v = o[k];
  if (v === null) {
   delete o[k];
   mark(N_NUM);
  } else if (v === 'true' || v === 'false' || v === 1 || v === 0) {
   o[k] = v === 'true' || v === 1;
   mark(N_NUM);
  }
 };
 const xy = (o,k,min,max) => {
  if (!own(o,k)) return;
  if (o[k] === null) {
   delete o[k];
   mark(N_NUM);
   return;
  }
  const q = loosePair(o[k],min,max);
  if (q !== o[k]) {
   o[k] = q;
   mark(N_NUM);
  }
 };
 const text = (o,k) => {
  if (!own(o,k)) return;
  if (o[k] === null) {
   delete o[k];
  } else if (typeof o[k] !== 'string') {
   o[k] = ['number','boolean'].includes(typeof o[k]) ? String(o[k]) : '';
   mark(N_SHAPE);
  }
 };
 const partHas = pid => typeof pid === 'string' && own(s.parts,pid) && obj(s.parts[pid]);
 const varHas = (pid,v) => typeof v === 'string' && obj(s.parts[pid].variants) && own(s.parts[pid].variants,v);

 // コマ・向きの「部品ごとの指定」を整える
 const poseParts = (holder,withZ) => {
  if (!obj(holder.parts)) {
   if (holder.parts === null || Array.isArray(holder.parts) && !holder.parts.length) {
    delete holder.parts;
    mark(N_SHAPE);
   }
   return;
  }
  let removed = false;
  for (const [pid,d] of Object.entries(holder.parts)) {
   if (!partHas(pid)) {
    delete holder.parts[pid];
    removed = true;
    mark(N_REF);
    continue;
   }
   if (!obj(d)) continue;
   xy(d,'offset',-LIMIT.sizeMax,LIMIT.sizeMax);
   bool(d,'flipX');
   bool(d,'visible');
   if (withZ) num(d,'z',-9999,9999,false);
   if (d.variant !== undefined && !varHas(pid,d.variant)) {
    delete d.variant;
    mark(N_REF);
   }
  }
  if (removed && !Object.keys(holder.parts).length) delete holder.parts;
 };

 if (s.format !== 'SPRITE_SPEC_V1') {
  s.format = 'SPRITE_SPEC_V1';
  mark(N_ADD);
 }

 // meta
 if (!obj(s.meta)) {
  s.meta = {};
  mark(N_ADD);
 }
 const meta = s.meta;
 if (!validId(meta.id)) {
  const id = String(meta.id ?? meta.name ?? '').replace(/[^A-Za-z0-9_-]/g,'_').replace(/^[^A-Za-z]+/,'').slice(0,64);
  meta.id = validId(id) ? id : 'sprite_'+Date.now().toString(36);
  mark(N_ADD);
 }
 if (typeof meta.name !== 'string' || !meta.name.trim()) {
  meta.name = meta.id;
  mark(N_ADD);
 }
 text(meta,'description');

 // palette: 透明の定義を外し、色の書き方をそろえる
 for (const k of Object.keys(s.palette)) {
  const v = s.palette[k];
  if (k === '.' || typeof v !== 'string' || /^(transparent|none|clear|)$/i.test(v.trim()) || /^#([0-9a-f]{3}0|[0-9a-f]{6}00)$/i.test(v.trim())) {
   delete s.palette[k];
   mark(N_CLEAR);
   continue;
  }
  let c = v.trim();
  if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c)) c = '#'+c;
  if (/^#[0-9a-f]{3,4}$/i.test(c)) c = '#'+c.slice(1,4).split('').map(x => x+x).join('');
  else if (/^#[0-9a-f]{8}$/i.test(c)) c = c.slice(0,7);
  if (c !== v && /^#[0-9a-f]{6}$/i.test(c)) {
   s.palette[k] = c;
   mark(N_COLOR);
  }
 }

 // parts
 for (const p of Object.values(s.parts)) {
  if (!obj(p)) continue;
  if (!obj(p.variants)) {
   const rows = Array.isArray(p.variants) || typeof p.variants === 'string' ? p.variants : (p.rows ?? p.pixels ?? p.data);
   if (Array.isArray(rows) || typeof rows === 'string') {
    p.variants = {base:rows};
    mark(N_SHAPE);
   }
  }
  if (obj(p.variants)) {
   for (const vid of Object.keys(p.variants)) {
    let rows = p.variants[vid];
    if (obj(rows) && (Array.isArray(rows.rows) || typeof rows.rows === 'string')) rows = rows.rows;
    if (typeof rows === 'string') rows = rows.split(/\r?\n/);
    if (Array.isArray(rows)) {
     if (rows.some(Array.isArray)) rows = rows.map(r => Array.isArray(r) ? r.join('') : r);
     if (!rows.length) rows = ['.'];
    }
    if (rows !== p.variants[vid]) {
     p.variants[vid] = rows;
     mark(N_SHAPE);
    }
   }
   if (!own(p.variants,'base')) {
    const first = Object.keys(p.variants).find(k => Array.isArray(p.variants[k]));
    if (first) {
     p.variants.base = p.variants[first].slice();
     mark(N_ADD);
    }
   }
  }
  text(p,'name');
  if (p.z === null) delete p.z;
  num(p,'z',-9999,9999,false);
  xy(p,'position',-LIMIT.sizeMax,LIMIT.sizeMax*2);
  bool(p,'effect');
  bool(p,'visible');
 }

 // settings
 if (!obj(s.settings)) {
  s.settings = {};
  mark(N_ADD);
 }
 const se = s.settings;
 let size = se.size;
 if (obj(size)) size = [size.width ?? size.w ?? size.x,size.height ?? size.h ?? size.y];
 size = looseNum(size);
 if (typeof size === 'number') size = [size,size];
 if (Array.isArray(size) && size.length === 2) size = size.map(v => looseNum(v));
 if (!Array.isArray(size) || size.length !== 2 || !size.every(v => typeof v === 'number' && Number.isFinite(v))) {
  // size が無いときは、部品の基本の絵が収まる大きさにする
  let w = 0;
  let h = 0;
  for (const p of Object.values(s.parts)) {
   if (!obj(p) || !obj(p.variants) || !Array.isArray(p.variants.base)) continue;
   const pos = Array.isArray(p.position) ? p.position : [0,0];
   w = Math.max(w,(Number(pos[0]) || 0)+Math.max(0,...p.variants.base.map(r => String(r).length)));
   h = Math.max(h,(Number(pos[1]) || 0)+p.variants.base.length);
  }
  size = [w || 32,h || 32];
 }
 const fixed = size.map(v => Math.max(LIMIT.sizeMin,Math.min(LIMIT.sizeMax,Math.round(v))));
 if (!Array.isArray(se.size) || se.size.length !== 2 || se.size[0] !== fixed[0] || se.size[1] !== fixed[1]) {
  se.size = fixed;
  mark(N_NUM);
 }
 if (se.view !== undefined && se.view !== 'side' && se.view !== 'topdown') {
  if (/top|4|four/i.test(String(se.view))) se.view = 'topdown';
  else delete se.view;
  mark(N_SHAPE);
 }

 // anchors
 if (Array.isArray(s.anchors) && !s.anchors.length) s.anchors = {};
 if (obj(s.anchors)) {
  for (const a of Object.values(s.anchors)) {
   if (!obj(a)) continue;
   text(a,'name');
   xy(a,'position',-LIMIT.sizeMax,LIMIT.sizeMax*2);
   if (a.position === undefined) {
    a.position = [0,0];
    mark(N_ADD);
   }
   if (a.parent != null && !partHas(a.parent)) {
    a.parent = null;
    mark(N_REF);
   }
  }
 }

 // animations
 if (Array.isArray(s.animations) && !s.animations.length) s.animations = {};
 if (obj(s.animations)) {
  for (const id of Object.keys(s.animations)) {
   if (Array.isArray(s.animations[id])) {
    s.animations[id] = {fps:8,loop:true,frames:s.animations[id]};
    mark(N_SHAPE);
   }
   const a = s.animations[id];
   if (!obj(a)) continue;
   text(a,'name');
   if (a.fps == null) {
    a.fps = 8;
    mark(N_ADD);
   }
   num(a,'fps',1,30,false);
   bool(a,'loop');
   if (!Array.isArray(a.frames)) continue;
   if (!a.frames.length) {
    a.frames = [{}];
    mark(N_ADD);
   }
   if (a.frames.length > LIMIT.frames) {
    a.frames = a.frames.slice(0,LIMIT.frames);
    mark('コマが'+LIMIT.frames+'個を超えていた動きは、'+LIMIT.frames+'個までに切りました');
   }
   a.frames.forEach((f,i) => {
    if (f == null) {
     a.frames[i] = {};
     mark(N_SHAPE);
     return;
    }
    if (!obj(f)) return;
    if (f.hold === null) delete f.hold;
    num(f,'hold',1,24,true);
    poseParts(f,false);
   });

   if (a.events === null) delete a.events;
   if (Array.isArray(a.events)) {
    const last = a.frames.length-1;
    const next = [];
    for (const raw of a.events) {
     const ev = obj(raw) ? [raw.frame ?? raw.index ?? raw.at,raw.name ?? raw.event ?? raw.id] : raw;
     if (!Array.isArray(ev) || ev.length !== 2) continue;
     let at = ev[0];
     let name = ev[1];
     if (typeof at === 'string' && typeof name === 'number') {
      const tmp = at;
      at = name;
      name = tmp;
     }
     at = looseNum(at);
     if (typeof at !== 'number' || !Number.isFinite(at) || !validId(name)) continue;
     next.push([Math.max(0,Math.min(last,Math.round(at))),name]);
    }
    if (JSON.stringify(next) !== JSON.stringify(a.events)) {
     if (next.length) a.events = next;
     else delete a.events;
     mark(N_SHAPE);
    }
   }

   if (a.show === null) delete a.show;
   if (typeof a.show === 'string') {
    a.show = [a.show];
    mark(N_SHAPE);
   }
   if (Array.isArray(a.show) && !a.show.every(pid => partHas(pid))) {
    a.show = a.show.filter(pid => partHas(pid));
    mark(N_REF);
   }
  }
 }

 // directions
 if (s.directions === null || Array.isArray(s.directions)) {
  delete s.directions;
  mark(N_SHAPE);
 }
 if (obj(s.directions)) {
  const map = {right:'side',front:'down',back:'up'};
  for (const k of Object.keys(s.directions)) {
   if (['down','up','side'].includes(k)) continue;
   const to = own(map,k) ? map[k] : null;
   if (to && !own(s.directions,to)) s.directions[to] = s.directions[k];
   delete s.directions[k];
   mark(N_SHAPE);
  }
  for (const dv of Object.values(s.directions)) {
   if (obj(dv)) poseParts(dv,true);
  }
 }

 for (const m of marks) fixNote(m);
}

function normalizeSpec(source) {
 const s = clone(source);
 guardTree(s);
 assert(obj(s),'データはObjectです');
 if (obj(s.palette) && obj(s.parts)) {
  relaxSpec(s);
  repairSpecSymbols(s);
 }
 s.anchors ??= {};
 s.animations ??= {};
 if (obj(s.meta)) s.meta.version ??= 1;
 if (obj(s.parts)) {
  for (const [id,p] of Object.entries(s.parts)) {
   if (!obj(p)) continue;
   p.name ??= id;
   p.z ??= 0;
   p.position ??= [0,0];
  }
 }
 if (obj(s.anchors)) {
  for (const [id,a] of Object.entries(s.anchors)) {
   if (!obj(a)) continue;
   a.name ??= id;
   a.parent ??= null;
  }
 }
 return s;
}

function validateSpec(s) {
 guardTree(s);
 assert(obj(s) && s.format === 'SPRITE_SPEC_V1','format: SPRITE_SPEC_V1 が必要です');

 s.settings.size.forEach(v => int(v,'キャラの大きさ（size）',LIMIT.sizeMin,LIMIT.sizeMax));

 );

 assert(obj(s.palette),'palette は「1文字の記号: 色」のObjectです');

 for (const k of ['parts','anchors','animations']) assert(obj(s[k]),k+' はIDをキーにしたObjectです');

  assert(obj(p.variants) && own(p.variants,'base'),L+': variants.base（基本の絵）が必要です');
  const vids = Object.keys(p.variants);
  assert(vids.length <= LIMIT.variants,L+': 絵は'+LIMIT.variants+'個までです');

  for (const vid of vids) {
   const rows = p.variants[vid];
   const V = L+'の絵「'+vid+'」';
   assert(validId(vid),V+': 絵のIDは英字で始まる英数字にしてください');
   assert(Array.isArray(rows) && rows.length >= 1 && rows.length <= LIMIT.sizeMax,V+': 行は1〜'+LIMIT.sizeMax+'行です');
   rows.forEach((row,y) => {
    assert(typeof row === 'string' && row.length <= LIMIT.sizeMax,V+'の'+(y+1)+'行目: '+LIMIT.sizeMax+'文字までの文字列で書いてください');
    for (let x=0;x<row.length;x++) {
     assert(row[x] === '.' || own(s.palette,row[x]),V+'の'+(y+1)+'行目: 記号「'+row[x]+'」（'+cpOf(row[x])+'）が palette にありません');

 }

 assert(Object.keys(s.anchors).length <= 40,'取付点は40個までです');
 for (const [id,a] of Object.entries(s.anchors)) {

 }

 const anims = Object.entries(s.animations);
 assert(anims.length <= LIMIT.animations,'動きは'+LIMIT.animations+'個までです');

 for (const [id,a] of anims) {
  const L = '動き「'+id+'」';
  assert(validId(id) && obj(a),L+': IDは英字で始まる英数字にしてください');

  assert(a.loop === undefined || typeof a.loop === 'boolean',L+': loop は true/false です');
  assert(
   Array.isArray(a.frames) && a.frames.length >= 1 && a.frames.length <= LIMIT.frames,
   L+': コマ（frames）は1〜'+LIMIT.frames+'個です'
  );

  a.frames.forEach((f,i) => {
   const F = L+'の'+(i+1)+'コマ目';
   assert(obj(f),F+': Objectで書いてください');
   if (f.hold !== undefined) int(f.hold,F+'の hold',1,24);
   assert(f.parts === undefined || obj(f.parts),F+': parts は部品IDをキーにしたObjectです');

   for (const [pid,d] of Object.entries(f.parts || {})) {
    assert(own(s.parts,pid),F+': 部品「'+pid+'」がありません');
    assert(obj(d),F+': 部品「'+pid+'」の指定はObjectで書いてください');
    if (d.offset !== undefined) {
     assert(Array.isArray(d.offset) && d.offset.length === 2,F+': 部品「'+pid+'」の offset は [dx,dy] です');
     d.offset.forEach(v => int(v,F+'の「'+pid+'」のずれ',-LIMIT.sizeMax,LIMIT.sizeMax));
    }
    if (d.variant !== undefined) {
     assert(
      typeof d.variant === 'string' && own(s.parts[pid].variants,d.variant),

     );
    }
    for (const k of ['flipX','visible']) {
     assert(d[k] === undefined || typeof d[k] === 'boolean',F+': 部品「'+pid+'」の '+k+' は true/false です');
    }
   }
  });

  assert(a.events === undefined || Array.isArray(a.events),L+': events は配列です');
  for (const ev of a.events || []) {
   assert(Array.isArray(ev) && ev.length === 2 && validId(ev[1]),L+': 合図は [コマ番号,"英数字の名前"] の形です');
   int(ev[0],L+'の合図のコマ番号',0,a.frames.length-1);

  assert(a.show === undefined || Array.isArray(a.show),L+': show は部品IDの配列です');
  for (const pid of a.show || []) {
   assert(typeof pid === 'string' && own(s.parts,pid),L+': show の部品「'+pid+'」がありません');
  }
 }

 if (s.directions !== undefined) {
  assert(obj(s.directions),'directions（向きごとの基本姿勢）は down・up・side をキーにしたObjectです');

  for (const [dk,dv] of Object.entries(s.directions)) {
   const D = '向き「'+dk+'」';
   assert(['down','up','side'].includes(dk),'directions に使えるのは down・up・side だけです（「'+dk+'」は使えません）');
   assert(obj(dv),D+': Objectで書いてください');
   assert(dv.parts === undefined || obj(dv.parts),D+': parts は部品IDをキーにしたObjectです');

   for (const [pid,d] of Object.entries(dv.parts || {})) {

    if (d.offset !== undefined) {

     d.offset.forEach(v => int(v,D+'の「'+pid+'」のずれ',-LIMIT.sizeMax,LIMIT.sizeMax));

    }
   }
  }
 }

 assert(JSON.stringify(s).length <= LIMIT.bytes,'データが大きすぎます');
 return true;
}

 const recolor = (rows,map) => rows.map(r => r.split('').map(c => map[c] || c).join(''));
 // 輪郭を付ける。occ があれば、ほかの部位と重なる所には輪郭を描かない（つなぎ目を隠す）

  const w = Math.max(...rows.map(r => r.length));
  const out = [];
  for (let y=-1;y<=rows.length;y++) {
   let line = '';
   for (let x=-1;x<=w;x++) {
    if (filled(rows,x,y)) line += rows[y][x];
    else if ((filled(rows,x+1,y) || filled(rows,x-1,y) || filled(rows,x,y+1) || filled(rows,x,y-1))
     && !(occ && occ(pos[0]+x,pos[1]+y))) line += 'k';
    else line += '.';
   }
   out.push(line);
  }
  return out;
 };

// 全方位マップ（4方向）のキャラか
function isTopdown(s=state.spec) {
 return !!(s.settings && s.settings.view === 'topdown');
}

function viewKey() {
 return isTopdown() ? R.dirKey(state.motion.dir) : 'side';

function dirBaseParts() {
 const d = state.spec.directions;
 const e = d && d[viewKey()];

// 32×32・4方向の勇者（ドラクエ風のデモ用ひな形・一枚絵方式）
// 絵はここで組み立てる: 形を重ねてから、シルエットの外周に輪郭（k）を自動で付ける
function hero4Spec() {
 const N = 32;
 const blank = () => Array.from({length:N},() => Array(N).fill('.'));
 const rowsOf = g => g.map(r => r.join(''));
 const put = (g,x,y,c) => {
  if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c;
 };
 const rect = (g,x,y,w,h,c) => {
  for (let j=0;j<h;j++) for (let i=0;i<w;i++) put(g,x+i,y+j,c);
 };
 const stamp = (g,x,y,rows,map) => rows.forEach((r,j) => {
  for (let i=0;i<r.length;i++) {
   if (r[i] !== '.') put(g,x+i,y+j,map && map[r[i]] || r[i]);
  }
 });
 const line = (g,x0,y0,x1,y1,c) => {
  const dx = Math.abs(x1-x0);
  const dy = -Math.abs(y1-y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx+dy;
  for (let n=0;n<200;n++) {
   put(g,x0,y0,c);
   if (x0 === x1 && y0 === y1) break;
   const e2 = 2*err;
   if (e2 >= dy) {
    err += dy;
    x0 += sx;
   }
   if (e2 <= dx) {
    err += dx;
    y0 += sy;
   }
  }
 };
 // 腕: 肩から手まで2ピクセル幅（左側を明るく）、先に2×2の手
 const arm = (g,sx,sy,hx,hy) => {
  line(g,sx,sy,hx,hy,'B');
  line(g,sx+1,sy,hx+1,hy,'b');
  rect(g,hx,hy,2,2,'s');
  put(g,hx+1,hy+1,'S');
 };
 // 剣: (hx,hy) が握り。向き (dx,dy) に、つば・刃・切っ先の順に描く
 const sword = (g,hx,hy,dx,dy,len) => {
  const px = -dy;
  const py = dx;
  put(g,hx+dx,hy+dy,'Y');
  put(g,hx+dx+px,hy+dy+py,'y');
  put(g,hx+dx-px,hy+dy-py,'y');
  for (let i=2;i<=len+1;i++) put(g,hx+dx*i,hy+dy*i,i === 2 ? 'w' : i === len+1 ? 'G' : 'g');
 };
 const outline = g => {
  const out = g.map(r => r.slice());
  for (let y=0;y<N;y++) {
   for (let x=0;x<N;x++) {
    if (g[y][x] !== '.') continue;
    const near = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
     const X = x+dx;
     const Y = y+dy;
     return X >= 0 && Y >= 0 && X < N && Y < N && g[Y][X] !== '.';
    });
    if (near) out[y][x] = 'k';
   }
  }
  return rowsOf(out);
 };

 // 正面（下向き）。pose: 'raise'（剣を掲げる）・'strike'（両手で振り下ろす）
 const front = (o={}) => {
  const g = blank();

  } else {

   } else {

  stamp(g,o.cx || 8,16+b,S_CAPE);

 })();
 const transpose = rows => Array.from({length:rows[0].length},(_,i) => rows.map(r => r[i] || '.').join(''));

 const sparkA = blank();
 star(sparkA,3,2);
 star(sparkA,26,7);

function snapshot() {

}

function remember(before) {
 state.undo.push({spec:before,projectId:state.projectId});
 if (state.undo.length > LIMIT.history) state.undo.shift();
 state.redo = [];
}

function markChanged() {
 state.dirty = true;
 updateHeader();
 scheduleDraft();
}

function fixSelection() {
 const s = state.spec;
 const sel = state.sel;
 const m = state.motion;

 if (!own(s.parts,sel.part)) sel.part = Object.keys(s.parts)[0] || null;
 if (!sel.part || !own(s.parts[sel.part].variants,sel.variant)) sel.variant = 'base';
 if (!own(s.palette,sel.color)) sel.color = Object.keys(s.palette)[0];
 if (m.playing && !own(s.animations,m.playing)) m.playing = null;

 if (m.edit) {
  const a = s.animations[m.edit.clip];
  if (!a) {
   m.edit = null;
  } else {
   m.edit.frame = Math.min(m.edit.frame,a.frames.length-1);
   if (!own(s.parts,m.edit.part)) m.edit.part = Object.keys(s.parts)[0] || null;
  }
 }
}

function rebuild() {
 const rt = state.rt;

 fixSelection();
