 rt.animator = R.createAnimator(rt.sprite,state.spec,{showEffects:true});
 rt.animator.on('*',e => {
  if (!(m.review || m.edit)) return;
  const now = Date.now();
  if (now-(state.evAt[e.event] || 0) < 2000) return;
  state.evAt[e.event] = now;
  toast('合図「'+e.event+'」',900);
 });
 rt.controller = R.createController(rt.animator,state.spec);
 rt.animator.setDirection(viewKey());

 if (m.edit) rt.animator.seek(m.edit.clip,m.edit.frame,true);
 else if (m.trying) rt.controller.setSpeed(m.walk ? 0 : m.trySpeed);
 else if (m.playing) rt.animator.play(m.playing,{exact:true});
}

function commit(next,{history=true}={}) {
 validateSpec(next);
 if (history) remember(snapshot());
 state.spec = next;
 rebuild();
 markChanged();
 renderPanel();
}

function mutate(fn) {
 const next = snapshot();
 fn(next);
 commit(next);
}

function undoRedo(redo=false) {
 const from = redo ? state.redo : state.undo;
 const to = redo ? state.undo : state.redo;
 if (!from.length) return;

 const entry = from.pop();
 to.push({spec:snapshot(),projectId:state.projectId});
 state.spec = clone(entry.spec);
 state.projectId = entry.projectId;
 state.motion.review = null;
 rebuild();
 markChanged();
 renderPanel();
}

function resetMotionUI() {
 const m = state.motion;
 m.playing = null;
 m.edit = null;
 m.trying = false;
 m.walk = false;
 m.x = 0;
 m.y = 0;
 m.dir = 'down';
 m.facing = 'right';
 $('walkUI')?.remove();
}

function replaceProject(spec,id=null,dirty=true) {
 validateSpec(spec);
 resetMotionUI();
 state.spec = spec;
 state.projectId = id;
 state.undo = [];
 state.redo = [];
 state.motion.review = null;
 state.motion.view = null;
 state.vw.zoom = 1;
 state.vw.px = 0;
 state.vw.py = 0;
 state.vw.onion = false;
 state.vw.pinch = null;
 state.vw.pan = null;
 state.vw.drag = null;
 state.vw.aim = null;
 state.restoredTitle = '';
 state.ai.queueFor = null;
 rebuild();
 state.dirty = dirty;
 writeDraft();
 updateHeader();
}

// ============================================================
// 8. プレビュー描画と、タップで塗る
// ============================================================
let lastTime = 0;

function setStillPose() {
 const sp = state.rt.sprite;
 const sel = state.sel;
 const editing = state.tab === 'parts';
 const pose = {};

 for (const id of Object.keys(sp.parts)) {
  const part = sp.parts[id];
  const b = dirBaseParts()[id] || {};
  let variant = b.variant && part.variants[b.variant] ? b.variant : 'base';
  let dx = b.offset ? b.offset[0] : 0;
  let dy = b.offset ? b.offset[1] : 0;
  let flip = !!b.flipX;
  let visible = part.visible && b.visible !== false;

  // 塗っている部品は、選んだ絵をそのままの位置で表示する（塗る位置と合わせるため）
  if (editing && id === sel.part && part.variants[sel.variant]) {
   variant = sel.variant;
   dx = 0;
   dy = 0;
   flip = false;
   visible = part.visible;
  }

  pose[id] = {
   dx,dy,variant,flipX:flip,visible,
   z: typeof b.z === 'number' ? b.z : part.z
  };
 }
 sp.pose = pose;
}

function drawPreview() {
 const c = $('view');
 const g = c.getContext('2d');
 const [W,H] = state.spec.settings.size;
 const cw = c.width;
 const ch = c.height;
 if (!cw || !ch) return;

 const m = state.motion;
 const vw = state.vw;
 const z = m.trying ? 1 : vw.zoom;
 const zt = $('zoomTools');
 if (zt && zt.hidden !== !!m.trying) zt.hidden = !!m.trying;
 const zl = $('zoomLabel');
 const zText = (Math.round(vw.zoom*10)/10)+'×';
 if (zl && zl.textContent !== zText) zl.textContent = zText;
 // 上の保存ボタン列と、下の拡大ボタンにキャラが重ならないよう、その分を除いた範囲で大きさと位置を決める
 const rc = c.getBoundingClientRect();
 const kx = rc.width ? cw/rc.width : 1;
 const qt = $('quickTools');
 const topPad = qt ? Math.max(0,Math.round((qt.getBoundingClientRect().bottom-rc.top+6)*kx)) : 0;
 const botPad = zt && !zt.hidden ? Math.max(0,Math.round((rc.bottom-zt.getBoundingClientRect().top+6)*kx)) : 0;
 const availH = Math.min(ch,Math.max(H+2,ch-topPad-botPad));
 const offY = Math.max(0,Math.min(topPad,ch-availH));
 const s = Math.max(1,Math.floor(Math.min(cw/(W+6),availH/(H+2))))*z;
 const lx = z > 1 ? Math.max(0,(W*s-cw)/2+s*3) : 0;
 const ly = z > 1 ? Math.max(0,(H*s-availH)/2+s*3) : 0;
 if (!m.trying) vw.px = Math.max(-lx,Math.min(lx,vw.px));
 if (!m.trying) vw.py = Math.max(-ly,Math.min(ly,vw.py));
 const limit = Math.max(0,(cw/s-W)/2);
 if (m.trying) m.x = Math.max(-limit,Math.min(limit,m.x));
 if (m.trying) {
  const limitY = Math.max(0,(availH/s-H)/2);
  m.y = Math.max(-limitY,Math.min(limitY,m.y));
 }

 const ox = Math.floor((cw-W*s)/2)+Math.round((m.trying ? m.x : 0)*s)+Math.round(m.trying ? 0 : vw.px);
 const oy = offY+Math.floor((availH-H*s)/2)+Math.round((m.trying && isTopdown() ? m.y : 0)*s)+Math.round(m.trying ? 0 : vw.py);
 state.rt.layout = {s,ox,oy,limit};

 g.imageSmoothingEnabled = false;
 g.fillStyle = state.bg;
 g.fillRect(0,0,cw,ch);

 // 地面の線
 if (!isTopdown()) {
  g.fillStyle = 'rgba(255,255,255,.18)';
  g.fillRect(0,oy+H*s,cw,Math.max(1,Math.floor(s/4)));
 }

 if (state.grid && !m.trying) {
  g.lineWidth = 1;
  if (s >= 6) {
   g.strokeStyle = 'rgba(255,255,255,.07)';
   g.beginPath();
   for (let i=1;i<W;i++) {
    g.moveTo(ox+i*s+.5,oy);
    g.lineTo(ox+i*s+.5,oy+H*s);
   }
   for (let i=1;i<H;i++) {
    g.moveTo(ox,oy+i*s+.5);
    g.lineTo(ox+W*s,oy+i*s+.5);
   }
   g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,.3)';
  g.strokeRect(ox+.5,oy+.5,W*s,H*s);
 }

 if (m.edit && vw.onion && m.edit.frame > 0 && !m.trying && !m.edit.play) {
  const rt = state.rt;
  const ed = m.edit;
  rt.animator.seek(ed.clip,ed.frame-1,true);
  const prevPose = rt.sprite.pose;
  rt.animator.seek(ed.clip,ed.frame,true);
  const curPose = rt.sprite.pose;
  rt.sprite.pose = prevPose;
  g.globalAlpha = .35;
  R.drawSprite(g,rt.sprite,ox,oy,{scale:s,flipX:previewFlip()});
  g.globalAlpha = 1;
  rt.sprite.pose = curPose;
 }
 R.drawSprite(g,state.rt.sprite,ox,oy,{scale:s,flipX:previewFlip()});

 // 精密モード: 狙っているマスの枠（描く座標と同じ pointerPixel の値）
 if (vw.fine && vw.aim && state.stroke && state.stroke.fine && !m.trying) {
  g.lineWidth = Math.max(2,Math.floor(s/5));
  g.strokeStyle = '#ffd24a';
  g.strokeRect(ox+vw.aim[0]*s,oy+vw.aim[1]*s,s,s);
 }

 // 手でなおす: 選んだ部品の絵の範囲
 if (state.tab === 'parts' && state.sel.part && !m.trying && !m.playing && !m.edit) {
  const p = state.spec.parts[state.sel.part];
  const rows = p.variants[state.sel.variant] || p.variants.base;
  const w = Math.max(1,...rows.map(r => r.length));
  g.strokeStyle = '#63d9f5';
  g.lineWidth = Math.max(1,Math.floor(s/6));
  g.strokeRect(ox+p.position[0]*s,oy+p.position[1]*s,w*s,rows.length*s);
 }
}

// プレビューを左右反転で描くか（全方位は左向きのとき。塗っている間は反転しない）
function previewFlip() {
 const m = state.motion;
 if (m.trying) return isTopdown() ? m.dir === 'left' : m.facing === 'left';
 return isTopdown() && m.dir === 'left' && state.tab !== 'parts';
}

function frameLoop(now) {
 requestAnimationFrame(frameLoop);
 const dt = Math.min(.1,(now-(lastTime || now))/1000);
 lastTime = now;

 const m = state.motion;
 const rt = state.rt;
 if (!rt.sprite || document.hidden) return;

 rt.animator.setDirection(viewKey());

 if (m.trying) {
  if (m.walk) updateWalk(dt);
  rt.controller.update(dt);
 } else if (m.edit) {
  // コマの編集中は seek した姿勢のまま（再生ボタンを押したときだけ進める）
  if (m.edit.play) {
   rt.animator.update(dt,{speed:1});
   if (rt.animator.done) rt.animator.seek(m.edit.clip,0,true);
  }
 } else if (m.playing) {
  rt.animator.update(dt,{speed:m.speed});
 } else {
  setStillPose();
 }

 drawPreview();
}

function resizeView() {
 const c = $('view');
 const dpr = Math.min(window.devicePixelRatio || 1,3);
 c.width = Math.max(1,Math.round(c.clientWidth*dpr));
 c.height = Math.max(1,Math.round(c.clientHeight*dpr));
 layoutBars();
}

function canPaint() {
 const m = state.motion;
 return state.tab === 'parts' && !!state.sel.part && !m.trying && !m.playing && !m.edit;
}

function pointerPixel(e) {
 const c = $('view');
 const rect = c.getBoundingClientRect();
 const L = state.rt.layout;
 if (!L) return null;
 const x = (e.clientX-rect.left)*(c.width/rect.width);
 const lift = state.vw.fine && canPaint() && state.sel.tool !== 'pick' ? 48 : 0;
 const y = (e.clientY-lift-rect.top)*(c.height/rect.height);
 return [Math.floor((x-L.ox)/L.s),Math.floor((y-L.oy)/L.s)];
}

function floodFill(rows,x,y,ch) {
 const w = Math.max(1,...rows.map(r => r.length));
 const grid = rows.map(r => r.padEnd(w,'.').split(''));
 if (y >= grid.length || x >= w) return false;
 const from = grid[y][x];
 if (from === ch) return false;

 const stack = [[x,y]];
 while (stack.length) {
  const [cx,cy] = stack.pop();
  if (cx < 0 || cy < 0 || cy >= grid.length || cx >= w || grid[cy][cx] !== from) continue;
  grid[cy][cx] = ch;
  stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
 }
 grid.forEach((r,i) => {
  rows[i] = r.join('');
 });
 return true;
}

// 選んだ部品の、選んだ絵に1ピクセル塗る（右と下は自動で広げる）
function paintAt(px,py,start) {
 const [W,H] = state.spec.settings.size;
 const p = state.spec.parts[state.sel.part];
 if (!p || px < 0 || py < 0 || px >= W || py >= H) return false;

 const tool = state.sel.tool;
 let x = px-p.position[0];
 let y = py-p.position[1];
 if ((x < 0 || y < 0) && tool !== 'erase' && tool !== 'fill') {
  if (expandPartLeftTop(p,Math.max(0,-x),Math.max(0,-y))) {
   if (state.stroke) state.stroke.wide = true;
   x = px-p.position[0];
   y = py-p.position[1];
  }
 }
 const rows = p.variants[state.sel.variant];
 const ch = tool === 'erase' ? '.' : state.sel.color;

 if (x < 0 || y < 0) {
  if (start && tool !== 'erase' && tool !== 'fill') toast('これ以上広げられません（'+LIMIT.sizeMax+'×'+LIMIT.sizeMax+'が上限です）');
  return false;
 }
 if (x >= LIMIT.sizeMax || y >= LIMIT.sizeMax) return false;

 if (tool === 'fill') return start ? floodFill(rows,x,y,ch) : false;

 if (ch === '.') {
  if (y >= rows.length || x >= rows[y].length || rows[y][x] === '.') return false;
 } else {
  const w = Math.max(1,...rows.map(r => r.length));
  while (rows.length <= y) rows.push('.'.repeat(w));
  if (rows[y].length <= x) rows[y] = rows[y].padEnd(x+1,'.');
  if (rows[y][x] === ch) return false;
 }

 rows[y] = rows[y].slice(0,x)+ch+rows[y].slice(x+1);
 return true;
}

function strokePaint(e,start) {
 const st = state.stroke;
 const pos = pointerPixel(e);
 if (!st || !pos || multiTouch()) return;
 if (st.fine && !st.armed) {
  state.vw.aim = pos;
  return;
 }
 if (pos[0] === st.lastX && pos[1] === st.lastY && !start) return;
 st.lastX = pos[0];
 st.lastY = pos[1];

 if (paintAt(pos[0],pos[1],start)) {
  st.changed = true;
  const wide = st.wide;
  st.wide = false;
  if (!refreshPartSprite(state.sel.part,wide ? null : state.sel.variant)) state.rt.sprite = R.buildSprite(state.spec);
 }
}

function bindCanvas() {
 const c = $('view');

 c.addEventListener('pointerdown',e => {
  if (!canPaint() || state.sel.tool === 'pick' || multiTouch()) return;
  e.preventDefault();
  c.setPointerCapture(e.pointerId);
  state.stroke = {id:e.pointerId,before:snapshot(),changed:false,lastX:null,lastY:null,fine:state.vw.fine && state.sel.tool !== 'pick',armed:false,dead:false};
  strokePaint(e,true);
 });

 c.addEventListener('pointermove',e => {
  if (state.stroke && state.stroke.id === e.pointerId) strokePaint(e,false);
 });

 const end = e => {
  const st = state.stroke;
  if (!st || st.id !== e.pointerId) return;
  if (st.fine && !st.dead && e.type === 'pointerup') {
   st.armed = true;
   strokePaint(e,true);
  }
  state.vw.aim = null;
  state.stroke = null;
  if (st.changed) {
   remember(st.before);
   rebuild();
   markChanged();
  }
 };

 c.addEventListener('pointerup',end);
 c.addEventListener('pointercancel',end);
}

// ============================================================
// 9. 部品の手なおし
// ============================================================
function selectedPart(s=state.spec) {
 const id = state.sel.part;
 assert(id && own(s.parts,id),'部品を選んでください');
 return s.parts[id];
}

function addPart() {
 const s = state.spec;
 assert(Object.keys(s.parts).length < LIMIT.parts,'部品は'+LIMIT.parts+'個までです');
 const id = newId('part',Object.keys(s.parts));
 const [W,H] = s.settings.size;
 const z = Math.max(0,...Object.values(s.parts).map(p => p.z))+1;

 state.sel.part = id;
 state.sel.variant = 'base';
 mutate(x => {
  x.parts[id] = {
   name:'新しい部品',z,
   position:[Math.max(0,Math.floor(W/2)-4),Math.max(0,Math.floor(H/2)-4)],
   variants:{base:Array.from({length:8},() => '........')}
  };
 });
 toast('部品を追加しました。プレビューをタップして塗れます');
}

function duplicatePart() {
 const src = selectedPart();
 const s = state.spec;
 assert(Object.keys(s.parts).length < LIMIT.parts,'部品は'+LIMIT.parts+'個までです');
 const id = newId(state.sel.part+'_copy',Object.keys(s.parts)).slice(0,64);
 const copy = clone(src);
 copy.name += ' コピー';
 copy.position = [copy.position[0]+2,copy.position[1]];

 state.sel.part = id;
 mutate(x => {
  x.parts[id] = copy;
 });
}

function deletePart() {
 const id = state.sel.part;
 selectedPart();

 askConfirm('部品「'+state.spec.parts[id].name+'」を削除しますか？動きの中の指定も消えます。',() => mutate(s => {
  delete s.parts[id];
  for (const [aid,a] of Object.entries(s.anchors)) {
   if (a.parent === id) delete s.anchors[aid];
  }
  for (const a of Object.values(s.animations)) {
   a.frames.forEach(f => {
    if (f.parts) delete f.parts[id];
   });
   if (a.show) a.show = a.show.filter(x => x !== id);
  }
 }));
}

function nudgePart(dir) {
 selectedPart();
 const id = state.sel.part;
 const i = dir[0] === 'x' ? 0 : 1;
 const d = dir[1] === '+' ? 1 : -1;
 mutate(s => {
  s.parts[id].position[i] += d;
 });
}

function togglePartVisible(id) {
 mutate(s => {
  const p = s.parts[id];
  if (p.visible === false) delete p.visible;
  else p.visible = false;
 });
}

function addVariant() {
 const p = selectedPart();
 assert(Object.keys(p.variants).length < LIMIT.variants,'1つの部品の絵は'+LIMIT.variants+'個までです');
 const id = state.sel.part;
 const from = state.sel.variant;

 askText('今の絵を複製して、新しい絵を作る','新しい絵のID（英字で始まる英数字。例: raise）','pose',value => {
  const vid = String(value).trim();
  assert(validId(vid),'絵のIDは英字で始まる英数字・_・-で入力してください');
  assert(!own(state.spec.parts[id].variants,vid),'同じIDの絵がすでにあります');
  state.sel.variant = vid;
  mutate(s => {
   s.parts[id].variants[vid] = s.parts[id].variants[from].slice();
  });
 });
}

function deleteVariant() {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;
 assert(vid !== 'base','基本の絵（base）は削除できません');

 askConfirm('絵「'+vid+'」を削除しますか？動きの中でこの絵を使っているコマは、基本の絵に戻ります。',() => {
  state.sel.variant = 'base';
  mutate(s => {
   delete s.parts[id].variants[vid];
   for (const a of Object.values(s.animations)) {
    a.frames.forEach(f => {
     const d = f.parts && f.parts[id];
     if (d && d.variant === vid) {
      delete d.variant;
      if (!Object.keys(d).length) delete f.parts[id];
     }
    });
   }
  });
 });
}

function flipVariant() {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;
 mutate(s => {
  const rows = s.parts[id].variants[vid];
  const w = Math.max(1,...rows.map(r => r.length));
  s.parts[id].variants[vid] = rows.map(r => r.padEnd(w,'.').split('').reverse().join(''));
 });
}

// 左・上は、部品のすべての絵をそろえて広げ、位置を1ずらす（絵どうしのずれを防ぐ）
function growVariant(dir) {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;

 mutate(s => {
  const p = s.parts[id];
  if (dir === 'left') {
   for (const k of Object.keys(p.variants)) p.variants[k] = p.variants[k].map(r => '.'+r);
   p.position[0]--;
  } else if (dir === 'up') {
   for (const k of Object.keys(p.variants)) {
    const w = Math.max(1,...p.variants[k].map(r => r.length));
    p.variants[k].unshift('.'.repeat(w));
   }
   p.position[1]--;
  } else if (dir === 'right') {
   const w = Math.max(1,...p.variants[vid].map(r => r.length));
   p.variants[vid] = p.variants[vid].map(r => r.padEnd(w,'.')+'.');
  } else {
   const w = Math.max(1,...p.variants[vid].map(r => r.length));
   p.variants[vid].push('.'.repeat(w));
  }
 });
}

function addColor() {
 const s = state.spec;
 assert(Object.keys(s.palette).length < LIMIT.colors,'色は'+LIMIT.colors+'色までです');
 const ch = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
  .split('').find(c => !own(s.palette,c));
 assert(ch,'使える記号がありません');
 state.sel.color = ch;
 mutate(x => {
  x.palette[ch] = '#ff8844';
 });
}

function deleteColor() {
 const s = state.spec;
 const k = state.sel.color;
 assert(Object.keys(s.palette).length > 1,'色は最低1色必要です');
 const used = Object.values(s.parts).some(p =>
  Object.values(p.variants).some(rows => rows.some(r => r.includes(k)))
 );
 assert(!used,'この色は絵で使われています。使っている所を塗り替えてから削除してください');
 mutate(x => {
  delete x.palette[k];
 });
}

// ============================================================
// 10. 動き（再生・コマの編集・試す）
// ============================================================
function motionView() {
 const v = state.motion.view;
 if (v === 'view' || v === 'make' || v === 'try') return v;
 return Object.keys(state.spec.animations).length ? 'view' : 'make';
}

function stopMotion() {
 const m = state.motion;
 m.playing = null;
 m.trying = false;
 m.walk = false;
 m.x = 0;
 m.y = 0;
 m.facing = 'right';
 $('walkUI')?.remove();
 state.rt.animator.stop();
 state.rt.controller.reset();
}

function playMotion(id) {
 const m = state.motion;
 if (m.playing === id) {
  stopMotion();
 } else {
  stopMotion();
  m.edit = null;
  assert(state.rt.animator.play(id,{restart:true,exact:true}),'動きが見つかりません: '+id);
  m.playing = id;
 }
 renderPanel();
}

function toggleEdit(id) {
 const m = state.motion;
 if (m.edit && m.edit.clip === id) {
  m.edit = null;
  state.rt.animator.stop();
 } else {
  assert(own(state.spec.animations,id),'動きが見つかりません');
  stopMotion();
  m.edit = {clip:id,frame:0,part:state.sel.part || Object.keys(state.spec.parts)[0] || null};
  state.rt.animator.seek(id,0,true);
 }
 renderPanel();
}

function editInfo(s=state.spec) {
 const ed = state.motion.edit;
 assert(ed && own(s.animations,ed.clip),'直す動きを選んでください');
 return {ed,a:s.animations[ed.clip],f:s.animations[ed.clip].frames[ed.frame]};
}

function stepFrame(dir) {
 const {ed,a} = editInfo();
 ed.frame = (ed.frame+dir+a.frames.length) % a.frames.length;
 state.rt.animator.seek(ed.clip,ed.frame,true);
 renderPanel();
}

function addFrame(dup) {
 const {ed} = editInfo();
 const i = ed.frame;
 const next = snapshot();
 const a = next.animations[ed.clip];
 assert(a.frames.length < LIMIT.frames,'コマは'+LIMIT.frames+'個までです');

 a.frames.splice(i+1,0,dup ? clone(a.frames[i]) : {});
 (a.events || []).forEach(ev => {
  if (ev[0] > i) ev[0]++;
 });

 ed.frame = i+1;
 try {
  commit(next);
 } catch (e) {
  ed.frame = i;
  throw e;
 }
}

function deleteFrame() {
 const {ed} = editInfo();
 const i = ed.frame;
 const next = snapshot();
 const a = next.animations[ed.clip];
 assert(a.frames.length > 1,'コマは最低1つ必要です');

 a.frames.splice(i,1);
 if (a.events) {
  a.events = a.events.filter(ev => ev[0] !== i);
  a.events.forEach(ev => {
   if (ev[0] > i) ev[0]--;
  });
  if (!a.events.length) delete a.events;
 }
 commit(next);
}

// 編集中のコマの、選んだ部品の指定を1項目だけ変える（基本と同じ値は書かない）
function setFramePart(key,value) {
 const {ed} = editInfo();
 assert(ed.part && own(state.spec.parts,ed.part),'部品を選んでください');

 mutate(s => {
  const f = s.animations[ed.clip].frames[ed.frame];
  f.parts = f.parts || {};
  const d = f.parts[ed.part] = f.parts[ed.part] || {};

  if (value === undefined) delete d[key];
  else d[key] = value;

  if (!Object.keys(d).length) delete f.parts[ed.part];
  if (!Object.keys(f.parts).length) delete f.parts;
 });
}

function nudgeFramePart(dir) {
 const {ed,f} = editInfo();
 assert(ed.part,'部品を選んでください');
 const cur = (f.parts && f.parts[ed.part] && f.parts[ed.part].offset || [0,0]).slice();
 cur[dir[0] === 'x' ? 0 : 1] += dir[1] === '+' ? 1 : -1;
 setFramePart('offset',cur[0] === 0 && cur[1] === 0 ? undefined : cur);
}

function resetFramePart() {
 const {ed} = editInfo();
 mutate(s => {
  const f = s.animations[ed.clip].frames[ed.frame];
  if (f.parts) {
   delete f.parts[ed.part];
   if (!Object.keys(f.parts).length) delete f.parts;
  }
 });
}

function setFrameEvent(value) {
 const {ed} = editInfo();
 const name = String(value).trim();
 assert(!name || validId(name),'合図の名前は英字で始まる英数字で入力してください（例: hit）');

 mutate(s => {
  const a = s.animations[ed.clip];
  a.events = (a.events || []).filter(ev => ev[0] !== ed.frame);
  if (name) a.events.push([ed.frame,name]);
  a.events.sort((x,y) => x[0]-y[0]);
  if (!a.events.length) delete a.events;
 });
}

function newClip() {
 askText('新しい動きを手で作る','動きID（英字で始まる英数字。例: wave）','motion',value => {
  const id = String(value).trim();
  assert(validId(id),'動きIDは英字で始まる英数字・_・-で入力してください');
  assert(!own(state.spec.animations,id),'同じIDの動きがすでにあります');
  assert(Object.keys(state.spec.animations).length < LIMIT.animations,'動きは'+LIMIT.animations+'個までです');

  stopMotion();
  state.motion.edit = {clip:id,frame:0,part:state.sel.part || Object.keys(state.spec.parts)[0] || null};
  try {
   mutate(s => {
    s.animations[id] = {name:id,fps:8,loop:true,frames:[{},{}]};
   });
  } catch (e) {
   state.motion.edit = null;
   throw e;
  }
 });
}

function startTry() {
 const m = state.motion;
 m.edit = null;
 m.playing = null;
 if (!m.trying) {
  m.trying = true;
  state.rt.controller.reset();
 }
 state.rt.controller.setSpeed(m.walk ? 0 : m.trySpeed);
}

function tryAction(id) {
 startTry();
 const c = state.rt.controller;
 if (!c.action(id)) {
  const label = (STANDARD.find(x => x[0] === id) || [])[1] || id;
  toast(c.dead
   ? '倒れています。「起き上がる」を押してください'
   : '「'+label+'」の動き（'+id+'）がまだありません。「つくる」タブで追加できます');
 }
}

function startWalk() {
 stopMotion();
 startTry();
 state.motion.walk = true;
 state.stick = {x:0,id:null};
 state.keys = {};
 buildWalkUI();
}

function buildWalkUI() {
 $('walkUI')?.remove();
 const clips = state.spec.animations;
 const ids = ['jump','attack'].filter(id => own(clips,id));

 const ui = document.createElement('div');
 ui.id = 'walkUI';
 ui.innerHTML = '<div id="walkStick" aria-label="移動スティック"><div id="walkKnob"></div></div>'
  + '<div id="walkActs">'
  + ids.map(id => '<button data-try="'+id+'">'+esc(STANDARD.find(x => x[0] === id)[1])+'</button>').join('')
  + (own(clips,'die') ? button('tryReset','起き上がる') : '')
  + button('walkStop','終了')
  + '</div>';
 $('viewport').appendChild(ui);

 const stick = $('walkStick');
 const set = e => {
  const rect = stick.getBoundingClientRect();
  const x = Math.max(-1,Math.min(1,(e.clientX-rect.left-rect.width/2)/(rect.width/2)));
  const y = isTopdown() ? Math.max(-1,Math.min(1,(e.clientY-rect.top-rect.height/2)/(rect.height/2))) : 0;
  state.stick.x = x;
  state.stick.y = y;
  $('walkKnob').style.transform = 'translate('+x*40+'px,'+y*40+'px)';
 };
 const end = e => {
  if (e.pointerId !== state.stick.id) return;
  state.stick = {x:0,id:null};
  $('walkKnob').style.transform = '';
 };

 stick.addEventListener('pointerdown',e => {
  e.preventDefault();
  state.stick.id = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  set(e);
 });
 stick.addEventListener('pointermove',e => {
  if (e.pointerId === state.stick.id) set(e);
 });
 stick.addEventListener('pointerup',end);
 stick.addEventListener('pointercancel',end);
}

function updateWalk(dt) {
 const m = state.motion;
 const k = state.keys;
 const c = state.rt.controller;

 if (c.dead) {
  c.setSpeed(0);
  return;
 }

 const top = isTopdown();
 let x = state.stick.x;
 let y = top ? (state.stick.y || 0) : 0;
 if (k.a || k.arrowleft) x -= 1;
 if (k.d || k.arrowright) x += 1;
 if (top) {
  if (k.w || k.arrowup) y -= 1;
  if (k.s || k.arrowdown) y += 1;
 }
 x = Math.max(-1,Math.min(1,x));
 y = Math.max(-1,Math.min(1,y));

 const len = Math.hypot(x,y);
 if (len > 1) {
  x /= len;
  y /= len;
 }

 const mag = Math.min(1,Math.hypot(x,y));
 c.setSpeed(mag*5);
 if (mag < .05) return;

 // 全方位は、入力の大きいほうの軸で向きを決める
 if (top) m.dir = Math.abs(x) >= Math.abs(y) ? (x < 0 ? 'left' : 'right') : (y < 0 ? 'up' : 'down');
 else m.facing = x < 0 ? 'left' : 'right';
 m.x += x*5*8*dt;
 if (top) m.y += y*5*8*dt;
}

// ============================================================
// 11. 修正データ（SPRITE_PATCH_V1）
// ============================================================
function applyPatch(source,patch) {
 guardTree(patch);
 assert(
  obj(patch) && patch.format === 'SPRITE_PATCH_V1' && Array.isArray(patch.operations),
  'SPRITE_PATCH_V1 と operations が必要です'
 );
 assert(patch.operations.length > 0 && patch.operations.length <= 500,'操作の数は1〜500です');

 const next = clone(source);

 // directions が無いデータにも /directions/向き を追加できるようにする（空のままなら最後に外す）
 if (!own(next,'directions')) next.directions = {};

 patch.operations.map(fixPatchOp).forEach((op,i) => {
  assert(
   obj(op) && ['add','replace','remove'].includes(op.op),
   '修正データの'+(i+1)+'番目の操作の種類（op）が正しくありません。add・replace・remove のどれかにするよう、AIに頼み直してください'
  );
  assert(
   typeof op.path === 'string' && op.path.startsWith('/') && !/~(?![01])/.test(op.path),
   'AIの回答で、変更する場所の書き方（path）が正しくありません。AIに「pathは / で始まる形で書いて」と頼み直してください'
  );

  const keys = op.path.slice(1).split('/').map(k => k.replace(/~1/g,'/').replace(/~0/g,'~'));

  assert(
   ['meta','settings','palette','parts','anchors','animations','directions'].includes(keys[0]),
   'AIの回答で、変更できない場所を変えようとしています（'+op.path+'）。変更できるのは meta・settings・palette・parts・anchors・animations・directions だけです'
  );
  assert(keys.every(k => k !== '' && !['__proto__','prototype','constructor'].includes(k)),'path に使えないキーがあります');

  let parent = next;
  for (const k of keys.slice(0,-1)) {
   assert(
    parent && typeof parent === 'object' && own(parent,k),
    'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のデータに合わせて直して」と頼んでください'
   );
   parent = parent[k];
  }
  assert(parent && typeof parent === 'object','変更する場所の親がObjectでも配列でもありません（'+op.path+'）');

  const key = keys[keys.length-1];
  // add と replace の取り違えは読み替える。すでに無い項目の remove は飛ばす
  if (!Array.isArray(parent)) {
   if (op.op === 'remove' && !own(parent,key)) {
    fixNote('すでに無い項目の削除（remove）は飛ばしました');
    return;
   }
   if (op.op !== 'remove' && (op.op === 'add') === own(parent,key)) {
    op = {...op,op:own(parent,key) ? 'replace' : 'add'};
    fixNote('修正データの add と replace の取り違えを読み替えました');
   }
  }
  if (op.op !== 'remove') assert(own(op,'value'),'修正データに value がありません（'+op.path+'）');

  if (Array.isArray(parent)) {
   assert(/^(0|[1-9][0-9]*)$/.test(key) || key === '-' && op.op === 'add','配列の番号が正しくありません（'+op.path+'）');
   const index = key === '-' ? parent.length : Number(key);
   assert(index >= 0 && index < (op.op === 'add' ? parent.length+1 : parent.length),'配列の番号が範囲外です（'+op.path+'）');

   if (op.op === 'add') parent.splice(index,0,clone(op.value));
   else if (op.op === 'remove') parent.splice(index,1);
   else parent[index] = clone(op.value);
  } else {
   if (op.op === 'add') {
    assert(!own(parent,key),'AIの回答で、すでにある項目を「追加（add）」しようとしています（'+op.path+'）。AIに「既存の項目は replace で書き直して」と頼んでください');
   } else {
    assert(own(parent,key),'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のデータに合わせて直して」と頼んでください');
   }
   if (op.op === 'remove') delete parent[key];
   else parent[key] = clone(op.value);
  }
 });

 if (obj(next.directions) && !Object.keys(next.directions).length) delete next.directions;

 const normalized = normalizeSpec(next);
 validateSpec(normalized);
 return normalized;
}

function isAnimOp(op) {
 return obj(op) && ['add','replace'].includes(op.op)
  && typeof op.path === 'string' && /^\/animations\/[^/]+$/.test(op.path);
}

function opId(op) {
 return String(op.path).split('/')[2];
}

// ============================================================
// 12. AIの回答の読み込み・リカバリー・確認バー
// ============================================================
function applyAIText(text) {
 try {
  repairNotes = [];
  $('repairBar')?.remove();
  const message = applyAITextCore(text);
  showRepairNotes(repairNotes);
  repairNotes = null;
  clearRecovery();
  return message;
 } catch (e) {
  // 途中で切れた回答を補って読んだ結果のエラーは、切れていることを先に伝える
  const cut = !!(repairNotes && repairNotes.includes(CUT_NOTE));
  repairNotes = null;
  const err = cut
   ? Error('AIの回答が途中で切れている可能性があります。頼む動きの数を減らすか、AIに続きを出すよう頼んでください\n（切れた所までで読み込みを試しましたが、次のエラーになりました: '+(e && e.message ? e.message : e)+'）')
   : e;
  offerRecovery(text,err);
  throw err;
 }
}

function applyAITextCore(text) {
 let data = parseAIJSON(text);
 // 書き方の揺れを吸収する: 操作の配列だけ・外側の1段の包み・operations の別名・format の書き忘れ
 if (Array.isArray(data) && data.length && data.every(x => obj(x) && typeof x.path === 'string')) {
  data = {format:'SPRITE_PATCH_V1',operations:data};
 }
 if (obj(data) && !data.format && !Array.isArray(data.operations) && !obj(data.parts)) {
  const inner = Object.values(data).filter(v => obj(v) && (
   v.format === 'SPRITE_SPEC_V1' || v.format === 'SPRITE_PATCH_V1' || Array.isArray(v.operations) || obj(v.parts) && obj(v.palette)
  ));
  if (inner.length === 1) data = inner[0];
 }
 if (obj(data) && !Array.isArray(data.operations) && !obj(data.parts)) {
  const alt = [data.ops,data.patch,data.patches,data.changes].find(Array.isArray);
  if (alt) data = {...data,operations:alt};
 }
 if (obj(data) && data.format !== 'SPRITE_SPEC_V1' && data.format !== 'SPRITE_PATCH_V1'
  && !Array.isArray(data.operations) && obj(data.parts) && obj(data.palette)) {
  data = {...data,format:'SPRITE_SPEC_V1'};
  if (repairNotes) repairNotes.push('format の書き忘れ・書き間違いを補いました');
 }
 assert(obj(data),'AIの回答がデータの形になっていません');

 const base = {spec:snapshot(),projectId:state.projectId,dirty:state.dirty};

 if (data.format === 'SPRITE_PATCH_V1' || Array.isArray(data.operations)) {
  const patch = {...data,format:'SPRITE_PATCH_V1'};
  const ops = patch.operations;
  let next = null;
  let failed = [];

  if (Array.isArray(ops) && ops.length && ops.every(isAnimOp)) {
   // 動きだけの修正データは、add と replace の取り違えを読み替える
   const present = new Set(Object.keys(state.spec.animations));
   patch.operations = ops.map(op => {
    const id = opId(op);
    const fixed = {...op,op:present.has(id) ? 'replace' : 'add'};
    present.add(id);
    return fixed;
   });

   try {
    next = applyPatch(state.spec,patch);
   } catch (e) {
    // 全体で失敗したら、動きごとに適用して成功した分だけ反映する
    let cur = state.spec;
    let ok = 0;
    for (const op of patch.operations) {
     try {
      cur = applyPatch(cur,{format:'SPRITE_PATCH_V1',operations:[op]});
      ok++;
     } catch (err) {
      failed.push({id:opId(op),reason:err.message});
     }
    }
    assert(ok,'読み込めた動きがありませんでした。\n'+failed.map(f => f.id+': '+f.reason).join('\n'));
    next = cur;
   }
  } else {
   next = applyPatch(state.spec,patch);
  }

  commit(next);

  const failedIds = failed.map(f => f.id);
  const ids = [...new Set((patch.operations || []).filter(isAnimOp).map(opId))]
   .filter(id => own(next.animations,id) && !failedIds.includes(id));

  if (ids.length) {
   markQueueLoaded(ids);
   startReview(ids,data.plan,failed,base);
   return failed.length
    ? ids.length+'件の動きを読み込みました（'+failed.length+'件は読み込めませんでした。確認バーを見てください）'
    : '動きを読み込みました。確認バーで確かめてください';
  }

  state.tab = 'repair';
  renderPanel();
  return '修正を反映しました（↶で取り消せます）';
 }

 assert(
  data.format === 'SPRITE_SPEC_V1',
  'AIの回答が「新しいキャラ」でも「修正データ」でもありません。AIの回答全体をコピーし直してください'
 );

 const s = normalizeSpec(data);
 validateSpec(s);

 resetMotionUI();
 commit(s);

 // 完全なデータは新しい未保存のキャラとして扱う（保存済みのキャラは上書きしない）
 state.projectId = null;
 state.restoredTitle = '';
 state.ai.queueFor = null;
 state.dirty = true;
 state.tab = 'repair';
 writeDraft();

 const ids = Object.keys(s.animations);
 if (ids.length) {
  startReview(ids,data.plan,[],base);
  return '新しいキャラを読み込みました（未保存です）。動きは確認バーで確かめてください';
 }

 renderPanel();
 return '新しいキャラを読み込みました（未保存です。↶で取り消せます）';
}

function createRecoveryPrompt(raw,message) {
 const max = 120000;
 const cut = raw.length > max;
 const isPatch = /SPRITE_PATCH_V1|"operations"\s*:/.test(raw);

 return 'あなたはゲーム用2Dドット絵キャラクターデータの修復担当です。'
  + '下の「読み込めなかったデータ」は、キャラ作成アプリで読み込みエラーになりました。エラーを解消した正しいデータを出力し直してください。\n'
  + '\nアプリのエラーメッセージ:\n'+message+'\n'
  + '\n修復のルール:\n'
  + '- 元のデータの内容（絵・色・動き・ID・名前）はできるだけ保ち、エラーの原因と、同じ種類の誤りを直す。\n'
  + '- 直した後、下の契約に照らして全体を見直し、ほかの違反（必須項目の欠け、存在しない部品や絵の参照、palette にない記号、上限超え、JSONの書き方の誤り）も直す。\n'
  + '- データが途中で切れている場合は、切れた部分を補って完結させる。\n'
  + '- 出力は元と同じ種類のデータ（'+(isPatch ? 'SPRITE_PATCH_V1 の修正データ' : '完全な SPRITE_SPEC_V1')+'）を、省略せず全体で出力する。\n'
  + '- 出力はJSONのみのプレーンテキスト。Markdown・コードフェンス・見出し・説明文は禁止。先頭文字は{、末尾文字は}。\n'
  + '- 文字列はすべて完成形で書く。式・関数呼び出し・コメントは禁止。絵の記号は半角ASCIIのみ。\n'
  + '\n'+schemaGuide()+'\n'
  + (isPatch ? '\n'+patchGuide()+'\n\n修正データを適用する先の、現在のキャラ:\n'+partsSummary()+'\n' : '')
  + '\n読み込めなかったデータ'+(cut ? '（長いため先頭'+max+'文字まで）' : '')+':\n'
  + (cut ? raw.slice(0,max) : raw);
}

// 動きの自動チェック
function reviewClips(ids) {
 const s = state.spec;
 const out = {};

 for (const id of ids) {
  const a = s.animations[id];
  if (!a) continue;

  const list = [];
  const loop = a.loop !== false;
  const text = a.frames.map(f => JSON.stringify(f.parts || {}));

  if (a.frames.length < 2) list.push('コマが1つだけです（動いて見えません）');
  else if (text.every(t => t === text[0])) list.push('すべてのコマが同じ姿勢です');

  if (id === 'attack' && !(a.events || []).some(ev => ev[1] === 'hit')) list.push('攻撃の合図「hit」がありません');
  if (id === 'jump' && !(a.events || []).some(ev => ev[1] === 'land')) list.push('着地の合図「land」がありません');

  if (loop && a.frames.length > 1) {
   const first = a.frames[0].parts || {};
   const last = a.frames[a.frames.length-1].parts || {};
   const far = [...new Set([...Object.keys(first),...Object.keys(last)])].filter(pid => {
    const p = first[pid] && first[pid].offset || [0,0];
    const q = last[pid] && last[pid].offset || [0,0];
    return Math.abs(p[0]-q[0]) > 4 || Math.abs(p[1]-q[1]) > 4;
   });
   if (far.length) list.push('くり返しの最後と最初で、部品が大きく飛びます: '+far.join('、'));
  }

  const loose = Object.keys(s.parts).filter(pid => {
   const p = s.parts[pid];
   return p.effect === true && !a.frames.some(f => f.parts && f.parts[pid]) && (a.show || []).includes(pid) === false;
  });
  if (!loop && /attack|fire|magic|skill/.test(id) && loose.length && !Object.keys(s.parts).some(pid =>
   s.parts[pid].effect === true && (a.frames.some(f => f.parts && f.parts[pid]) || (a.show || []).includes(pid))
  )) {
   list.push('効果部品（'+loose.join('、')+'）がありますが、この動きでは使われていません');
  }

  // 全方位マップ: 向き付きの動きは、3方向そろっているかを確かめる
  const dm = /^(.+)_(down|up|side)$/.exec(id);
  if (isTopdown(s) && dm) {
   const miss = ['down','up','side'].filter(k => k !== dm[2] && !own(s.animations,dm[1]+'_'+k));
   if (miss.length) {
    list.push(
     miss.map(k => ({down:'下向き',up:'上向き',side:'横向き'}[k])).join('・')
     +'の動きがありません（'+miss.map(k => dm[1]+'_'+k).join('・')+'）'
    );
   }
  }

  out[id] = list;
 }

 return out;
}

function startReview(ids,plan,failed=[],base=null) {
 const m = state.motion;
 const plans = {};

 if (obj(plan)) {
  for (const [k,v] of Object.entries(plan)) {
   if (typeof v === 'string') plans[k] = v.slice(0,1000);
  }
 }

 m.review = {
  ids,
  plan: typeof plan === 'string' ? plan.slice(0,2000) : '',
  plans,
  failed: failed.map(f => ({id:f.id,reason:String(f.reason).slice(0,500)})),
  report: reviewClips(ids),
  base
 };

 m.view = 'view';
 state.tab = 'motion';
 m.playing = null;
 playMotion(ids[0]);
}

function reviewBar() {
 const m = state.motion;
 const rv = m.review;
 if (!rv) return '';

 const anims = state.spec.animations;
 const ids = rv.ids.filter(id => own(anims,id));
 if (!ids.length) {
  m.review = null;
  return '';
 }

 const hasIssue = ids.some(id => (rv.report[id] || []).length) || rv.failed.length > 0;

 return `
  <div class="card review">
   <h3>AIの動きを確認</h3>
   <p class="hint">自動チェックは、コマの数・同じ姿勢の連続・合図・くり返しのつなぎ目を確認します。見た目の自然さは、再生して確かめてください。</p>
   ${rv.plan ? `<p class="hint"><b>AIの計画:</b> ${esc(rv.plan)}</p>` : ''}
   ${ids.map(id => `
    <div class="partrow">
     <button class="pick ${m.playing === id ? 'selected' : ''}" data-play="${esc(id)}">${m.playing === id ? '■' : '▶'} ${esc(anims[id].name || id)}<small>${esc(id)}</small></button>
    </div>
    ${rv.plans[id] ? `<p class="hint"><b>計画:</b> ${esc(rv.plans[id])}</p>` : ''}
    ${(rv.report[id] || []).length
     ? `<p class="error">${rv.report[id].map(esc).join('\n')}</p>`
     : '<p class="success">✓ 自動チェックでは問題を検出しませんでした</p>'}
   `).join('')}
   ${rv.failed.length ? `
    <h3>読み込めなかった動き</h3>
    <p class="error">${rv.failed.map(f => esc(f.id+': '+f.reason)).join('\n')}</p>
   ` : ''}
   <div class="row">
    ${button('reviewAccept','採用','primary')}
    ${button('reviewUndo','取り消す')}
    ${hasIssue ? button('reviewAsk','修正依頼文をコピー') : ''}
   </div>
   <p class="hint">「取り消す」は読み込む前の状態に戻します（戻した後に ↶ でやり直せます）。</p>
  </div>
 `;
}

function restoreReviewBase() {
 const rv = state.motion.review;
 assert(rv && rv.base,'読み込む前の状態が見つかりません。↶（元に戻す）を使ってください');

 resetMotionUI();
 commit(clone(rv.base.spec));
 state.projectId = rv.base.projectId;
 state.dirty = rv.base.dirty;
 state.motion.review = null;
 writeDraft();
 renderPanel();
 toast('読み込む前の状態に戻しました');
}

function schemaGuide() {
 return [
  'SpriteSpec契約: format="SPRITE_SPEC_V1"。ゲーム用の2Dドット絵キャラクターを「部品」と「コマ」で定義する。',
  'meta={name,id,version:1,description}。id は英字で始まる英数字・_・-（64文字以内）。',
  'settings={size:[幅,高さ],origin:"center-bottom",facing:"right"}。size は8〜128。キャラは右向きで描く。足元の中央が基準点。',
  'palette={"1文字の記号":"#rrggbb"}。記号は "." "_" と空白以外の1文字。最大32色。絵の中の "_" は透明（"." も可）。',
  'parts={"部品ID":{name,z,position:[x,y],variants:{"base":["行の文字列",...],"絵ID":[...]},effect,visible}}。',
  '- 絵（variants）は「1文字=1ピクセル」の行の配列。各文字は palette の記号か "_"（透明。"." も可）。base は必須。1つの部品の絵は16個まで。絵ごとに大きさが違ってよい（1〜128行、1行は128文字まで）。同じ絵の中では、すべての行を同じ文字数にそろえる。',
  '- position は絵の左上の位置。キャラの左上が原点、右が+X、下が+Y の整数。z が大きい部品ほど手前に描く。',
  '- effect:true の部品（斬撃・炎・光など）は、その部品を使う動きの再生中だけ表示される。visible:false は常に隠す。どちらも省略できる。',
  'anchors={"取付点ID":{name,parent:部品IDかnull,position:[x,y]}}。parent があれば、その部品の絵の左上からの位置。',
  'animations={"動きID":{name,fps,loop,frames:[{parts:{"部品ID":{offset:[dx,dy],variant:"絵ID",flipX:true/false,visible:true/false}},hold:コマ数}],events:[[コマ番号,"合図名"]],show:["効果部品ID"]}}。',
  '- fps は1〜30。frames は1〜24コマ。コマの parts に書かない部品は基本の状態（offset [0,0]・variant "base"・表示）になる。',
  '- hold は、そのコマを何コマ分表示するか（省略は1）。offset は整数ピクセルのずれ。回転は使えない。',
  '- 大きく形が変わる姿勢（腕を上げる・剣を振り下ろすなど）は、位置のずれではなく絵の差し替え（variant）で表す。',
  '- events のコマ番号は0始まり。合図名は英字で始まる英数字。show は、動かさずに表示だけする効果部品。',
  'settings.view は "side"（横スクロール。省略可・既定）か "topdown"（ドラクエやFFのような全方位マップ。4方向）。',
  'directions（任意）={"down":{"parts":{"部品ID":{offset,variant,flipX,visible,z}}},"up":{...},"side":{...}}。向きごとの基本姿勢。キーは down・up・side だけ。左向きは side の左右反転で表すので描かない。項目はすべて省略できる。',
  '- 姿勢の合成の順序: 基本（offset [0,0]・variant "base"・表示・部品の z）→ directions の向きの指定 → コマの指定。offset は足し算、variant・flipX・visible・z は後のもので上書き。z は描画順（大きいほど手前）で、向きごとに変えられる。',
  '- 向き別の動き: 動きIDの後ろに _down・_up・_side を付ける（例: walk_down・walk_up・walk_side）。その向きのとき、向き付きの動きがあればそれを、なければ向きなしの動き（walk）を使う。向きなしの動き（idle など）は、全方向で使えるよう、ずれ（offset）だけで作る。',
  '上限: 部品40、動き50、色32。'
 ].join('\n');
}

function patchGuide() {
 return [
  '修正データの形式: {"format":"SPRITE_PATCH_V1","plan":"変更の説明","operations":[{"op":"add|replace|remove","path":"/parts/部品ID/position/0","value":12}]}',
  '- path は / で始まるJSON Pointer。最上位は meta・settings・palette・parts・anchors・animations・directions のみ。',
  '- add は存在しないキーだけ、replace・remove は既存のキーだけに使う。配列は0始まりの番号、add のみ末尾「-」が使える。',
  '- 絵を直すときは {"op":"replace","path":"/parts/部品ID/variants/絵ID","value":[行の文字列,...]} のように、絵を丸ごと置き換える。',
  '- 部品や絵を削除・ID変更するときは、それを使っている animations のコマも合わせて直す。'
 ].join('\n');
}

function partsSummary() {
 const s = state.spec;
 const parts = Object.entries(s.parts).map(([id,p]) =>
  '- '+id+' | 名前:'+p.name+' | z:'+p.z+' | 位置:['+p.position.join(',')+'] | 絵: '
  + Object.entries(p.variants).map(([vid,rows]) =>
   vid+'（'+Math.max(1,...rows.map(r => r.length))+'×'+rows.length+'）'
  ).join(', ')
  + (p.effect === true ? ' | 効果部品' : '')
 ).join('\n') || 'なし';

 const anims = Object.entries(s.animations)
  .map(([id,a]) => id+'（'+a.frames.length+'コマ）').join(', ') || 'なし';

 return 'キャラ: '+s.meta.name+'（'+s.meta.id+'） 大きさ '+s.settings.size.join('×')+'\n'
  + '色の記号: '+Object.keys(s.palette).join(' ')+'\n'
  + '見え方（settings.view）: '+(s.settings.view === 'topdown' ? 'topdown（全方位マップ・4方向）' : 'side（横スクロール）')
  + ' / 基本姿勢（directions）のある向き: '+(Object.keys(s.directions || {}).join(', ') || 'なし')+'\n'
  + '部品一覧:\n'+parts+'\n'
  + '取付点: '+(Object.keys(s.anchors).join(', ') || 'なし')+'\n'
  + '既存の動きID: '+anims;
}

const OUTPUT_RULE = '出力はJSONのみのプレーンテキスト。Markdown・コードフェンス・見出し・説明文は禁止。先頭文字は{、末尾文字は}。文字列はすべて完成形で書く。式・関数呼び出し・コメントは禁止。絵の記号は半角ASCIIのみ。';

function itemId(it) {
 return it.id === '*' ? String(it.custom || '').trim() : it.id;
}

function newQueueItem(id='run') {
 const std = STANDARD.find(x => x[0] === id);
 return {
  id: std ? id : '*',
  custom: '',
  name: std ? std[1] : '',
  frames: std ? std[4] : 4,
  fps: std ? std[3] : 8,
  loop: std ? std[2] : false,
  note: '',
  useScript: false,
  script: '',
  loaded: false
 };
}

function ensureQueue() {
 const a = state.ai;
 const key = state.spec.meta.id;
 if (a.queueFor === key && a.queue.length) return;
 a.queueFor = key;
 const first = STANDARD.map(x => x[0]).find(id => !own(state.spec.animations,id)) || 'emote';
 a.queue = [newQueueItem(first)];
 a.qi = 0;
 a.batchNote = '';
 a.skip = {};
 a.skip = {};
}

function markQueueLoaded(ids) {
 state.ai.queue.forEach(it => {
  if (ids.includes(itemId(it))) it.loaded = true;
 });
}

function orderSection(it,i) {
 const id = itemId(it);
 const label = (i+1)+'件目';
 assert(validId(id),label+': 動きIDは英字で始まる英数字・_・-で入力してください');

 const frames = Number(it.frames);
 const fps = Number(it.fps);
 assert(Number.isInteger(frames) && frames >= 1 && frames <= LIMIT.frames,label+': コマ数は1〜'+LIMIT.frames+'で入力してください');
 assert(Number.isFinite(fps) && fps >= 1 && fps <= 30,label+': fps は1〜30で入力してください');

 const std = STANDARD.find(x => x[0] === id);
 const note = String(it.note || '').trim();
 const script = it.useScript ? String(it.script || '').trim() : '';
 const name = String(it.name || '').trim() || (std ? std[1] : id);

 assert(script || note || std || String(it.name || '').trim(),label+': 台本を使わないときは、「AIへの指示」か表示名を入力してください');

 return '\n■ '+label+': 動きID "'+id+'"（'+name+'） / コマ数の目安 '+frames+' / fps '+fps+' / loop:'+!!it.loop
  + ' / op は "'+(own(state.spec.animations,id) ? 'replace' : 'add')+'"\n'
  + (note ? 'AIへの指示（できるだけ忠実に反映する）:\n'+note.slice(0,2000)+'\n' : '')
  + (own(state.spec.animations,id)
   ? '現在の中身（作り直しの元。上の指示に合わせて直し、指示のない部分はできるだけ保つ）:\n'+JSON.stringify(state.spec.animations[id])+'\n'
   : '')
  + (script
   ? '台本（1行が1コマの姿勢。この流れどおりにコマを作る）:\n'+script.slice(0,2000)+'\n'
   : '台本: なし。動きIDの意味と上の指示から、各コマの姿勢をあなたが設計し、"plan" に書く。\n')
  + (id === 'attack' ? '- events に "hit"（当たるコマ）を入れる。\n' : '')
  + (id === 'jump' ? '- events に "land"（着地のコマ）を入れる。\n' : '')
  + (id === 'die' ? '- 最後のコマを倒れた姿勢にして、その姿勢で止まるようにする（loop:false）。\n' : '');
}

function createBatchPrompt() {
 ensureQueue();
 const q = state.ai.queue;
 const ids = q.map(itemId);
 assert(new Set(ids).size === ids.length,'注文リストで動きIDが重複しています。どちらかのIDを変えてください');

 const note = String(state.ai.batchNote || '').trim().slice(0,2000);

 return motionPromptBase(
  '\n今回作る動きは次の'+q.length+'件です。それぞれの注文どおりに作ってください。注文にない動きは作らない。\n'
  + q.map(orderSection).join('')
  + (note ? '\n全体への指示（すべての動きに共通）:\n'+note+'\n' : '')
  + (q.length > 1
   ? '\n"plan" は {"動きID":"その動きの計画"} のオブジェクトで、全'+q.length+'件について書く。'
   : '')
  + '\nすべてを1つの SPRITE_PATCH_V1 にまとめて出力すること。'
 );

function createReviewFixPrompt() {
 const rv = state.motion.review;
 assert(rv,'確認中の動きがありません');

 const anims = state.spec.animations;
 const bad = rv.ids.filter(id => own(anims,id) && (rv.report[id] || []).length);
 assert(bad.length || rv.failed.length,'直す必要のある動きはありません');

 return motionPromptBase(
  (bad.length
   ? '\n次の動きに、アプリの自動チェックで問題が見つかりました。問題を直した動きを返してください。\n'
    + bad.map(id => '\n動きID: '+id+'\n問題:\n'+rv.report[id].map(x => '- '+x).join('\n')+'\n現在の中身:\n'+JSON.stringify(anims[id])).join('\n')
   : '')
  + (rv.failed.length
   ? '\n\n次の動きは、データの誤りで読み込めませんでした。理由を直して作り直してください。\n'
    + rv.failed.map(f => '\n動きID: '+f.id+'\n理由: '+f.reason).join('\n')
   : '')
  + '\n\n各動きを {"op":"replace","path":"/animations/動きID","value":{...}} で返すこと（まだ無い動きは "add"）。IDは変えない。ほかの動きは変更しない。'
 );
}

function readStore() {
 try {
  const v = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (obj(v) && Array.isArray(v.projects)) return v;
 } catch (_) {}
 return {projects:[],last:null};
}

function writeStore(data) {
 try {
  localStorage.setItem(STORE,JSON.stringify(data));
 } catch (_) {
  throw Error('保存領域が足りないため保存できませんでした。使わないキャラを削除するか、「ファイルに保存」で控えを取ってください');
 }
 state.projects = data.projects;
}

function writeDraft() {
 if (!state.spec) return;
 try {
  localStorage.setItem(DRAFT,JSON.stringify({projectId:state.projectId,spec:state.spec,dirty:state.dirty}));
 } catch (_) {}
}

function scheduleDraft() {
 clearTimeout(state.draftTimer);
 state.draftTimer = setTimeout(writeDraft,600);
}

function makeThumb(spec) {
 try {
  const sprite = R.buildSprite(spec);
  const c = document.createElement('canvas');
  c.width = 96;
  c.height = 96;
  const g = c.getContext('2d');
  const big = Math.max(sprite.size[0],sprite.size[1]);
  // 96を超える大きさのキャラは、全体が収まるように縮めて描く
  const s = big > 96 ? 96/big : Math.max(1,Math.floor(96/big));
  g.fillStyle = '#1c2633';
  g.fillRect(0,0,96,96);
  R.drawSprite(g,sprite,Math.floor((96-sprite.size[0]*s)/2),Math.floor((96-sprite.size[1]*s)/2),{scale:s});
  return c.toDataURL('image/png');
 } catch (_) {
  return null;
 }
}

function saveProject(asNew=false) {
 const data = readStore();
 const id = asNew ? uid('project') : state.projectId || uid('project');
 const record = {
  projectId: id,
  name: state.spec.meta.name,
  spec: snapshot(),
  thumb: makeThumb(state.spec),
  updatedAt: new Date().toISOString()
 };

 const i = data.projects.findIndex(p => p.projectId === id);
 if (i < 0) data.projects.push(record);
 else data.projects[i] = record;
 data.last = id;

 writeStore(data);
 state.projectId = id;
 state.dirty = false;
 writeDraft();
 renderPanel();
 toast('「'+record.name+'」をライブラリに保存しました。大切なキャラは「ファイルに保存」でも控えを取ってください',3600);
}

function loadProject(id) {
 const data = readStore();
 const p = data.projects.find(x => x.projectId === id);
 assert(p,'キャラが見つかりません');

 const spec = normalizeSpec(p.spec);
 replaceProject(spec,id,false);
 data.last = id;
 writeStore(data);
 state.tab = 'repair';
 renderPanel();
 toast('「'+spec.meta.name+'」を開きました。「なおす」「動かす」で続きをつくれます',3200);
}

function deleteProject(id) {
 const data = readStore();
 data.projects = data.projects.filter(p => p.projectId !== id);
 if (data.last === id) data.last = null;
 writeStore(data);

 if (state.projectId === id) {
  state.projectId = null;
  state.dirty = true;
  writeDraft();
 }
 renderPanel();
 toast('ライブラリから削除しました');
}

function renameProject(id) {
 const p = state.projects.find(x => x.projectId === id);
 assert(p,'キャラが見つかりません');

 askText('名前を変更','新しい名前',p.name,value => {
  const name = String(value).trim();
  assert(name && name.length <= 100,'名前は1〜100文字で入力してください');

  const data = readStore();
  const rec = data.projects.find(x => x.projectId === id);
  assert(rec,'キャラが見つかりません');
  rec.name = name;
  rec.spec.meta.name = name;
  rec.updatedAt = new Date().toISOString();
  writeStore(data);

  if (state.projectId === id && state.spec.meta.name !== name) {
   const wasDirty = state.dirty;
   mutate(s => {
    s.meta.name = name;
   });
   state.dirty = wasDirty;
   writeDraft();
  }
  renderPanel();
  toast('名前を「'+name+'」に変更しました');
 });
}

function duplicateProject(id) {
 const data = readStore();
 const src = data.projects.find(x => x.projectId === id);
 assert(src,'キャラが見つかりません');

 const spec = normalizeSpec(src.spec);
 const name = String(src.name).slice(0,95)+'（コピー）';
 spec.meta.name = name;
 spec.meta.id = (validId(spec.meta.id) ? spec.meta.id : 'sprite').slice(0,40)+'_'+Date.now().toString(36);
 validateSpec(spec);

 data.projects.push({projectId:uid('project'),name,spec,thumb:src.thumb || null,updatedAt:new Date().toISOString()});
 writeStore(data);
 renderPanel();

}

function downloadText(text,name,type) {
 const url = URL.createObjectURL(new Blob([text],{type}));
 const a = document.createElement('a');
 a.href = url;
 a.download = name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(() => URL.revokeObjectURL(url),1000);
}

function fileBase() {
 return String(state.spec.meta.name || 'sprite').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim().slice(0,80) || 'sprite';
}

function exportLibrary() {
 const data = readStore();
 assert(data.projects.length,'書き出すキャラがありません');
 const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
 downloadText(
  JSON.stringify({format:'MODELSTUDIO2D_LIBRARY_V1',exportedAt:new Date().toISOString(),projects:data.projects}),
  'modelstudio2d_library_'+stamp+'.json','application/json'
 );
 toast(data.projects.length+'件のキャラを書き出しました');
}

function importLibrary(text) {
 const src = parseJSON(text,20000000);
 assert(
  obj(src) && src.format === 'MODELSTUDIO2D_LIBRARY_V1' && Array.isArray(src.projects),
  'ライブラリの書き出しファイル（MODELSTUDIO2D_LIBRARY_V1）を選んでください'
 );

 const data = readStore();
 let added = 0;
 let failed = 0;

 for (const p of src.projects) {
  try {
   assert(obj(p),'形式が不正です');
   const spec = normalizeSpec(p.spec);
   validateSpec(spec);
   data.projects.push({
    projectId: uid('project'),
    name: typeof p.name === 'string' && p.name.trim() ? p.name.trim().slice(0,100) : spec.meta.name,
    spec,
    thumb: makeThumb(spec),
    updatedAt: new Date().toISOString()
   });
   added++;
  } catch (_) {
   failed++;
  }
 }

 assert(added,'読み込めるキャラがありませんでした（失敗 '+failed+'件）');
 writeStore(data);
 renderPanel();
 toast(added+'件を追加しました'+(failed ? '（'+failed+'件は読み込めませんでした）' : ''),3200);
}

function restore() {
 state.projects = readStore().projects;
 let chosen = null;

 try {
  const raw = localStorage.getItem(DRAFT);
  if (raw) {
   const d = parseJSON(raw,LIMIT.bytes+4096);
   const spec = normalizeSpec(d.spec);
   validateSpec(spec);
   const saved = state.projects.find(p => p.projectId === d.projectId);
   chosen = {spec,projectId:saved ? d.projectId : null,dirty:!!d.dirty || !saved};
  }
 } catch (_) {}

 if (!chosen) {
  const st = readStore();
  const p = st.projects.find(x => x.projectId === st.last);
  if (p) {
   try {
    const spec = normalizeSpec(p.spec);
    validateSpec(spec);
    chosen = {spec,projectId:p.projectId,dirty:false};
   } catch (_) {}
  }
 }

 // 旧サンプル（32×32の戦士）が未変更のまま開かれるときは、新しいサンプルに入れ替える（保存済みのキャラはライブラリに残る）
 // サンプルの指紋（キャラIDを除いた内容）。手を加えていないサンプルかどうかの判定に使う
 const sampleSig = spec => {
  const c = clone(spec);
  if (obj(c.meta)) delete c.meta.id;
  const t = JSON.stringify(c);
  let h = 5381;
  for (let i=0;i<t.length;i++) h = ((h*33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36)+'_'+t.length;
 };
 const freshSig = sampleSig(warriorSpec());
 if (chosen && /^warrior_/.test(chosen.spec.meta.id)) {
  const sig = sampleSig(chosen.spec);
  // 指紋が保存されていない旧版からの移行は、1回だけ入れ替える
  const untouched = state.sampleSig ? sig === state.sampleSig : state.sampleVer !== 3;
  if (untouched && sig !== freshSig) {
   chosen = null;
   state.swapped = true;
  }
 }
 state.sampleSig = freshSig;

 state.restoredTitle = chosen ? chosen.spec.meta.name : '';
 if (!chosen) chosen = {spec:warriorSpec(),projectId:null,dirty:true};

 state.spec = chosen.spec;
 state.projectId = chosen.projectId;
 state.dirty = chosen.dirty;
}

function replaceGuard(fn) {
 if (state.dirty) askConfirm('未保存の変更を置き換えますか？必要なら先に「保存」してください。',fn);
 else fn();
}

function setZoom(n) {
 state.vw.zoom = n;
 if (n === 1) {
  state.vw.px = 0;
  state.vw.py = 0;
 }
 renderPanel();
}

function panView(dx,dy,reset) {
 const c = $('view');
 if (reset) {
  state.vw.px = 0;
  state.vw.py = 0;
 } else {
  state.vw.px += dx*c.width*.25;
  state.vw.py += dy*c.height*.25;
 }
}

function stepZoom(dir) {
 const steps = [1,2,4,8];
 const z = state.vw.zoom;
 if (dir > 0) return steps.find(n => n > z+.01) || 8;
 return steps.slice().reverse().find(n => n < z-.01) || 1;
}

function snapZoom() {
 const steps = [1,2,4,8];
 const z = Math.max(1,state.vw.zoom);
 let best = 1;
 for (const n of steps) {
  if (Math.abs(Math.log(n/z)) < Math.abs(Math.log(best/z))) best = n;
 }
 setZoom(best);
}

// ---- コマ編集の補助（一覧・移動・サムネイル） ----
function gotoFrame(i) {
 const {ed,a} = editInfo();
 if (ed.play) return;
 ed.frame = Math.max(0,Math.min(a.frames.length-1,i));
 state.rt.animator.seek(ed.clip,ed.frame,true);
 renderPanel();
}

function moveFrame(dir) {
 const {ed} = editInfo();
 const i = ed.frame;
 const j = i+dir;
 const next = snapshot();
 const a = next.animations[ed.clip];
 assert(j >= 0 && j < a.frames.length,dir < 0 ? '最初のコマです' : '最後のコマです');

 const tmp = a.frames[i];
 a.frames[i] = a.frames[j];
 a.frames[j] = tmp;
 if (a.events) {
  a.events.forEach(ev => {
   if (ev[0] === i) ev[0] = j;
   else if (ev[0] === j) ev[0] = i;
  });
  a.events.sort((x,y) => x[0]-y[0]);
 }

 ed.frame = j;
 try {
  commit(next);
 } catch (err) {
  ed.frame = i;
  throw err;
 }
}

function frameThumbs() {
 const ed = state.motion.edit;
 const a = ed && state.spec.animations[ed.clip];
 if (!a) return '';
 const [W,H] = state.spec.settings.size;
 const sc = Math.max(1,Math.floor(48/Math.max(W,H)));
 return '<div class="thumbs" id="thumbRow" role="group" aria-label="コマの一覧">'
  + a.frames.map((f,i) =>
   '<button data-thumb="'+i+'" class="'+(i === ed.frame ? 'selected' : '')+'" aria-label="'+(i+1)+'コマ目" aria-pressed="'+(i === ed.frame)+'">'
   + '<canvas data-tc="'+i+'" width="'+W*sc+'" height="'+H*sc+'"></canvas>'
   + '<span>'+(i+1)+((a.events || []).some(ev => ev[0] === i) ? '⚑' : '')+'</span></button>'
  ).join('')
  + '</div>';
}

function drawFrameThumbs() {
 const ed = state.motion.edit;
 const list = document.querySelectorAll('canvas[data-tc]');
 if (!ed || !list.length) return;
 const spec = state.spec;
 if (!own(spec.animations,ed.clip)) return;

 const sprite = R.buildSprite(spec);
 const anim = R.createAnimator(sprite,spec,{showEffects:false});
 anim.setDirection(viewKey());
 const [W,H] = spec.settings.size;
 const sc = Math.max(1,Math.floor(48/Math.max(W,H)));

 list.forEach(c => {
  anim.seek(ed.clip,Number(c.dataset.tc),true);
  const g = c.getContext('2d');
  g.fillStyle = state.bg;
  g.fillRect(0,0,c.width,c.height);
  R.drawSprite(g,sprite,0,0,{scale:sc,flipX:previewFlip()});
 });
}

function multiTouch() {
 return Object.keys(state.vw.ptrs).length >= 2;
}

// ---- 塗りの補助 ----
function rowsToCanvas(rows,palette) {
 const h = Math.max(1,rows.length);
 const w = Math.max(1,...rows.map(r => r.length));
 const c = document.createElement('canvas');
 c.width = w;
 c.height = h;
 const g = c.getContext('2d');
 rows.forEach((row,y) => {
  for (let x=0;x<row.length;x++) {
   const col = palette[row[x]];
   if (col) {
    g.fillStyle = col;
    g.fillRect(x,y,1,1);
   }
  }
 });
 return c;
}

// 変更した部品の絵だけを描き直す（onlyVariant が null のときは、その部品のすべての絵）
function refreshPartSprite(id,onlyVariant) {
 const sp = state.rt.sprite;
 const spec = state.spec;
 const part = sp && sp.parts[id];
 const p = spec.parts[id];
 if (!part || !p) return false;
 part.position = p.position;
 const vids = onlyVariant ? [onlyVariant] : Object.keys(p.variants);
 for (const v of vids) {
  if (!own(p.variants,v)) return false;
  part.variants[v] = rowsToCanvas(p.variants[v],spec.palette);
 }
 return true;
}

// 左・上に広げる。部品のすべての絵をそろえて広げ、位置をずらす。上限を超えるときは false
function expandPartLeftTop(p,needL,needT) {
 const vs = Object.keys(p.variants);
 for (const k of vs) {
  const rows = p.variants[k];
  const w = Math.max(1,...rows.map(r => r.length));
  if (w+needL > LIMIT.sizeMax || rows.length+needT > LIMIT.sizeMax) return false;
 }
 for (const k of vs) {
  const rows = p.variants[k];
  const w = Math.max(1,...rows.map(r => r.length));
  const pad = '.'.repeat(needL);
  const next = rows.map(r => pad+r);
  for (let i=0;i<needT;i++) next.unshift('.'.repeat(w+needL));
  p.variants[k] = next;
 }
 p.position[0] -= needL;
 p.position[1] -= needT;
 return true;
}

// スポイト: 選んだ部品を優先し、なければ手前の部品から色を拾う
function pickColorAt(e) {
 const pos = pointerPixel(e);
 if (!pos) return;
 const s = state.spec;
 const sel = state.sel;
 const key = id => id === sel.part ? 1 : 0;
 const ids = Object.keys(s.parts).sort((a,b) => key(b)-key(a) || s.parts[b].z-s.parts[a].z);

 for (const id of ids) {
  const p = s.parts[id];
  const b = dirBaseParts()[id] || {};
  const own1 = id === sel.part;
  const vid = own1 ? sel.variant : (b.variant && own(p.variants,b.variant) ? b.variant : 'base');
  const rows = p.variants[vid] || p.variants.base;
  const x = pos[0]-p.position[0]-(own1 || !b.offset ? 0 : b.offset[0]);
  const y = pos[1]-p.position[1]-(own1 || !b.offset ? 0 : b.offset[1]);
  const ch = x >= 0 && y >= 0 && rows[y] ? rows[y][x] : null;
  if (ch && ch !== '.' && own(s.palette,ch)) {
   sel.color = ch;
   sel.tool = 'pen';
   renderPanel();
   toast('色「'+ch+'」を拾いました');
   return;
  }
 }
 toast('そこには色がありません');
}

// ---- コマ編集: プレビューのドラッグ ----
function frameHit(px,py) {
 const sp = state.rt.sprite;
 const spec = state.spec;
 if (!sp || !sp.pose) return null;
 const W = spec.settings.size[0];
 const x0 = previewFlip() ? W-1-px : px;
 const list = sp.order
  .map((part,i) => ({part,i,z:sp.pose[part.id] && typeof sp.pose[part.id].z === 'number' ? sp.pose[part.id].z : part.z}))
  .sort((a,b) => a.z-b.z || a.i-b.i)
  .reverse();

 for (const {part} of list) {
  const p = sp.pose[part.id];
  if (!p || !p.visible) continue;
  const img = part.variants[p.variant] || part.variants.base;
  const lx = x0-(part.position[0]+p.dx);
  const ly = py-(part.position[1]+p.dy);
  if (lx < 0 || ly < 0 || lx >= img.width || ly >= img.height) continue;
  const rows = spec.parts[part.id].variants[p.variant] || spec.parts[part.id].variants.base;
  const fx = p.flipX ? img.width-1-lx : lx;
  const ch = rows[ly] && rows[ly][fx];
  if (ch && ch !== '.') return part.id;
 }
 return null;
}

function writeFrameOffset(f,pid,ox,oy) {
 if (ox === 0 && oy === 0) {
  if (f.parts && f.parts[pid]) {
   delete f.parts[pid].offset;
   if (!Object.keys(f.parts[pid]).length) delete f.parts[pid];
   if (!Object.keys(f.parts).length) delete f.parts;
  }
  return;
 }
 f.parts = f.parts || {};
 const d = f.parts[pid] = f.parts[pid] || {};
 d.offset = [ox,oy];
}

function startFrameDrag(e) {
 if (state.motion.edit && state.motion.edit.play) return;
 const pos = pointerPixel(e);
 if (!pos) return;
 const {ed,f} = editInfo();
 const id = frameHit(pos[0],pos[1]);
 if (!id) return;
 e.preventDefault();
 $('view').setPointerCapture(e.pointerId);
 const cur = f.parts && f.parts[id] && f.parts[id].offset || [0,0];
 state.vw.drag = {id:e.pointerId,part:id,sx:pos[0],sy:pos[1],base:cur.slice(),before:snapshot(),changed:false};
 ed.part = id;
}

function moveFrameDrag(e) {
 const d = state.vw.drag;
 const pos = pointerPixel(e);
 if (!d || !pos) return;
 const {ed} = editInfo();
 const k = previewFlip() ? -1 : 1;
 const ox = Math.max(-LIMIT.sizeMax,Math.min(LIMIT.sizeMax,d.base[0]+(pos[0]-d.sx)*k));
 const oy = Math.max(-LIMIT.sizeMax,Math.min(LIMIT.sizeMax,d.base[1]+pos[1]-d.sy));
 const f = state.spec.animations[ed.clip].frames[ed.frame];
 const cur = f.parts && f.parts[d.part] && f.parts[d.part].offset || [0,0];
 if (cur[0] === ox && cur[1] === oy) return;
 writeFrameOffset(f,d.part,ox,oy);
 d.changed = true;
 state.rt.animator.seek(ed.clip,ed.frame,true);
}

function endFrameDrag() {
 const d = state.vw.drag;
 if (!d) return;
 state.vw.drag = null;
 if (d.changed) {
  try {
   validateSpec(state.spec);
   remember(d.before);
   markChanged();
  } catch (err) {
   state.spec = d.before;
   showError(err);
  }
  rebuild();
 }
 renderPanel();
}

// 2本指のパン、スポイト、コマのドラッグ（描く処理より先に登録する）
function bindGestures() {
 const c = $('view');
 const vw = state.vw;
 const spread = () => {
  const ps = Object.values(vw.ptrs);
  return ps.length < 2 ? 1 : Math.max(1,Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y));
 };
 const centroid = () => {
  const ps = Object.values(vw.ptrs);
  return {x:ps.reduce((n,q) => n+q.x,0)/ps.length,y:ps.reduce((n,q) => n+q.y,0)/ps.length};
 };

 c.addEventListener('pointerdown',e => {
  vw.ptrs[e.pointerId] = {x:e.clientX,y:e.clientY};
  if (multiTouch()) {
   e.preventDefault();
   if (vw.drag) endFrameDrag();
   if (state.stroke) state.stroke.dead = true;
   if (state.motion.trying) return;
   vw.pan = centroid();
   vw.pinch = {d:spread(),z:vw.zoom};
   return;
  }
  const m = state.motion;
  if (m.trying || m.playing) return;
  if (canPaint() && state.sel.tool === 'pick') {
   e.preventDefault();
   safe(() => pickColorAt(e));
  } else if (m.edit) {
   safe(() => startFrameDrag(e));
  }
 });

 c.addEventListener('pointermove',e => {
  if (!vw.ptrs[e.pointerId]) return;
  vw.ptrs[e.pointerId] = {x:e.clientX,y:e.clientY};
  if (multiTouch() && vw.pan) {
   const now = centroid();
   const rect = c.getBoundingClientRect();
   const k = c.width/rect.width;
   vw.px += (now.x-vw.pan.x)*k;
   vw.py += (now.y-vw.pan.y)*k;
   vw.pan = now;
   if (vw.pinch) vw.zoom = Math.max(1,Math.min(8,vw.pinch.z*spread()/vw.pinch.d));
   return;
  }
  if (vw.drag && vw.drag.id === e.pointerId) moveFrameDrag(e);
 });

 const up = e => {
  delete vw.ptrs[e.pointerId];
  if (!multiTouch()) {
   vw.pan = null;
   if (vw.pinch) {
    vw.pinch = null;
    snapZoom();
   }
  }
  if (vw.drag && vw.drag.id === e.pointerId) endFrameDrag();
 };
 c.addEventListener('pointerup',up);
 c.addEventListener('pointercancel',up);
 window.addEventListener('blur',() => {
  vw.ptrs = {};
  if (vw.pinch) {
   vw.pinch = null;
   snapZoom();
  }
  vw.pan = null;
 });
}

// ---- PNGの書き出し ----
function canvasBlob(c) {
 return new Promise((resolve,reject) => {
  c.toBlob(b => b ? resolve(b) : reject(Error('画像を作れませんでした')),'image/png');
 });
}

function downloadBlob(blob,name) {
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(() => URL.revokeObjectURL(url),1000);
}

// いま表示している姿勢を、背景色つきで大きめに描いた画像
function previewCanvas() {
 const sp = state.rt.sprite;
 const [W,H] = state.spec.settings.size;
 const sc = Math.max(2,Math.floor(384/Math.max(W,H)));
 const pad = sc*2;
 const c = document.createElement('canvas');
 c.width = W*sc+pad*2;
 c.height = H*sc+pad*2;
 const g = c.getContext('2d');
 g.fillStyle = state.bg;
 g.fillRect(0,0,c.width,c.height);
 R.drawSprite(g,sp,pad,pad,{scale:sc,flipX:previewFlip()});
 return c;
}

function savePreviewPng() {
 return canvasBlob(previewCanvas()).then(b => {
  downloadBlob(b,fileBase()+'_preview.png');
  toast('プレビューをPNGで保存しました');
 }).catch(showError);
}

function sheetClipId() {
 const ids = Object.keys(state.spec.animations);
 return own(state.spec.animations,state.sheetClip) ? state.sheetClip : (ids[0] || null);
}

// 選んだ動きの全コマを横に並べた透明PNG（倍率1・1コマ＝キャラの大きさ）
function sheetCanvas(id) {
 const spec = state.spec;
 assert(own(spec.animations,id),'動きを選んでください');
 const [W,H] = spec.settings.size;
 const n = spec.animations[id].frames.length;
 const sprite = R.buildSprite(spec);
 const anim = R.createAnimator(sprite,spec);
 const dm = /_(down|up|side)$/.exec(id);
 if (isTopdown(spec) && dm) anim.setDirection(dm[1]);

 const c = document.createElement('canvas');
 c.width = W*n;
 c.height = H;
 const g = c.getContext('2d');
 for (let i=0;i<n;i++) {
  anim.seek(id,i,true);
  R.drawSprite(g,sprite,i*W,0,{scale:1});
 }
 return c;
}

async function copyText(text,message='コピーしました') {
 try {
  assert(navigator.clipboard && window.isSecureContext,'fallback');
  await navigator.clipboard.writeText(text);
  if (message) toast(message);
  return true;
 } catch (_) {
  const t = document.createElement('textarea');
  let ok = false;
  t.value = text;
  t.style.cssText = 'position:fixed;left:0;top:0;opacity:0';
  try {
   document.body.appendChild(t);
   t.focus();
   t.select();
   ok = document.execCommand('copy') === true;
  } catch (e) {
   ok = false;
  } finally {
   t.remove();
  }
  if (ok) {
   if (message) toast(message);
   return true;
  }
  manualCopy(text);
  return false;
 }
}

function copyPrompt(text,message='依頼文をコピーしました。ChatGPTなどに貼り付けて送信してください') {
 state.ai.lastPrompt = text;
 document.querySelectorAll('[data-action="sharePrompt"]').forEach(b => {
  b.disabled = false;
 });
 const len = text.length;
 const long = len > 20000;
 const p = copyText(text,long ? null : message);
 p.then(ok => {
  if (!ok) return;
  const n = len.toLocaleString();
  if (long) toast('依頼文をコピーしました（'+n+'文字）。大きいキャラは長くなります。直したい部品だけを伝えると短くできます',6000);
  else toast(message+'（'+n+'文字）',3600);
 });
 return p;
}

async function loadFromClipboard() {
 let text = '';
 try {
  assert(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext,'fallback');
  text = await navigator.clipboard.readText();
 } catch (_) {
  showImport();
  return;
 }

 if (!text.trim()) {
  toast('クリップボードが空です。AIの回答をコピーしてから押してください');
  return;
 }
 safe(() => toast(applyAIText(text),3200));
}

function handleClick(e) {
 const menu = $('moreMenu');
 if (menu.open && !menu.contains(e.target)) menu.open = false;

 const b = e.target.closest('button');
 if (!b) return;

 const d = b.dataset;
 if (b.closest('#moreMenu') && (d.tab || d.action)) menu.open = false;

 // ダイアログ内の「決定」は、エラーをダイアログの中に出す
 if (d.action === 'confirmText' || d.action === 'doImport') {
  actions[d.action]();
  return;
 }

 safe(() => {
  if (d.tab) {
   if (!own(GROUP,d.tab)) return;
   if (d.tab !== state.tab && state.motion.trying) stopMotion();
   state.tab = d.tab;
   renderPanel();
   scrollPanelTop();
  } else if (d.createmode) {
   state.createMode = d.createmode === 'library' ? 'library' : 'new';
   if (state.createMode === 'library') state.projects = readStore().projects;
   renderPanel();
  } else if (d.motionview) {
   if (state.motion.trying && d.motionview !== 'try') stopMotion();
   state.motion.view = ['view','make','try'].includes(d.motionview) ? d.motionview : null;
   renderPanel();
   scrollPanelTop();
  } else if (d.fixpreset !== undefined) {
   const preset = FIX_PRESETS[Number(d.fixpreset)];
   if (preset) {
    const cur = String(state.ai.request || '');
    if (!cur.includes(preset[1])) {
     state.ai.request = cur.trim() ? cur.replace(/\s+$/,'')+'\n'+preset[1] : preset[1];
    }
    renderPanel();
   }
  } else if (d.dir) {
   state.motion.dir = ['down','up','left','right'].includes(d.dir) ? d.dir : 'down';
   renderPanel();
  } else if (d.part) {
   state.sel.part = d.part;
   state.sel.variant = 'base';
   renderPanel();
  } else if (d.pvis) {
   togglePartVisible(d.pvis);
  } else if (d.tool) {
   state.sel.tool = d.tool;
   renderPanel();
  } else if (d.color) {
   state.sel.color = d.color;
   if (state.sel.tool === 'erase') state.sel.tool = 'pen';
   renderPanel();
  } else if (d.nudge) {
   nudgePart(d.nudge);
  } else if (d.grow) {
   growVariant(d.grow);
  } else if (d.play) {
   playMotion(d.play);
  } else if (d.editclip) {
   toggleEdit(d.editclip);
  } else if (d.delclip) {
   const id = d.delclip;
   askConfirm('動き「'+(state.spec.animations[id]?.name || id)+'」を削除しますか？',() => mutate(s => {
    delete s.animations[id];
   }));
  } else if (d.thumb !== undefined) {
   gotoFrame(Number(d.thumb));
  } else if (d.fstep) {
   stepFrame(Number(d.fstep));
  } else if (d.foff) {
   nudgeFramePart(d.foff);
  } else if (d.try) {
   tryAction(d.try);
  } else if (d.open) {
   const id = d.open;
   replaceGuard(() => loadProject(id));
  } else if (d.ren) {
   renameProject(d.ren);
  } else if (d.dup) {
   duplicateProject(d.dup);
  } else if (d.delproject) {
   const id = d.delproject;
   const name = state.projects.find(p => p.projectId === id)?.name || id;
   askConfirm('「'+name+'」をライブラリから削除しますか？（元に戻せません）',() => deleteProject(id));
  } else if (d.qedit !== undefined) {
   state.ai.qi = Number(d.qedit);
   renderPanel();
  } else if (d.qdel !== undefined) {
   const q = state.ai.queue;
   const i = Number(d.qdel);
   if (q.length > 1 && q[i]) {
    q.splice(i,1);
    state.ai.qi = Math.min(state.ai.qi,q.length-1);
    renderPanel();
   }
  } else if (d.newkind) {
   const kind = d.newkind;
   closeDialog();
   replaceGuard(() => {
    const fresh = kind === 'empty' ? emptySpec() : kind === 'hero4' ? hero4Spec() : warriorSpec();
    if (kind === 'empty') {
     fresh.settings.size = [dotSize(),dotSize()];
     if (state.ai.view === 'topdown') fresh.settings.view = 'topdown';
    }
    replaceProject(fresh);
    state.tab = kind === 'empty' ? 'ai' : 'repair';
    state.createMode = 'new';
    renderPanel();
    toast(kind === 'empty' ? '空のキャラを作りました' : (kind === 'hero4'
      ? '勇者のひな形を作りました。「動かす」→「試す」で4方向に歩かせ、攻撃・ジャンプ・喜ぶを試せます'
      : '戦士のひな形を作りました。「動かす」で動きを確かめられます'),3200);
   });
  } else if (actions[d.action]) {
   return actions[d.action]();
  }
 });
}

function setQueueField(el) {
 const it = state.ai.queue[state.ai.qi];
 if (!it) return;
 const key = el.dataset.q;
 if (el.type === 'checkbox') it[key] = el.checked;
 else if (el.type === 'number') it[key] = el.value === '' ? '' : Number(el.value);
 else it[key] = el.value;
 it.loaded = false;
}

function handleInput(e) {
 const el = e.target;
 const d = el.dataset;

 if (d.ai) {
  state.ai[d.ai] = el.value;
 } else if (d.q && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
  setQueueField(el);
 } else if (d.speed) {
  state.motion.speed = Number(el.value) || 1;
  if ($('speedOut')) $('speedOut').value = el.value;
 } else if (d.tryspeed) {
  state.motion.trySpeed = Number(el.value) || 0;
  if ($('trySpeedOut')) $('trySpeedOut').value = el.value;
  if (!state.motion.walk) startTry();
 }
}

 if (d.fine) {

   savePrefs();
   renderPanel();
   return;
  }
  if (d.sheet) {
   state.sheetClip = el.value;
   return;
  }
  if (d.dot) {
  state.ai.dot = Number(el.value) || 32;
  renderPanel();
  return;
 }
 if (d.view) {
  state.ai.view = el.value === 'topdown' ? 'topdown' : 'side';
  renderPanel();
  return;
 }
 if (el.id === 'pinViewport') {
  state.pin = el.checked;
  applyPin();
  savePrefs();
  return;
 }
 if (el.id === 'gridToggle') {
  state.grid = el.checked;
  savePrefs();
  return;
 }
 if (el.id === 'background') {
  state.bg = el.value;
  savePrefs();
  return;
 }
 if (el.id === 'answerFile') {
  const file = el.files && el.files[0];
  el.value = '';
  if (file) loadAnswerFile(file);
  return;
 }
 if (el.id === 'fileInput' || el.id === 'libraryFile') {
  const file = el.files && el.files[0];
  el.value = '';
  if (!file) return;
  const library = el.id === 'libraryFile';

  file.text()
   .then(text => {
    if (library) safe(() => importLibrary(text));
    else if (looksLikePatch(text)) safe(() => toast(applyAIText(text),3200));
    else replaceGuard(() => safe(() => toast(applyAIText(text),3200)));
   })
   .catch(() => showError(Error('ファイルを読み込めませんでした。JSONファイル（.json）かテキストファイル（.txt）を選んでください')));
  return;
 }

 try {
  clearError();

  if (d.meta) {
   mutate(s => {
    s.meta[d.meta] = el.value;
   });
  } else if (d.viewEdit) {
   const view = el.value === 'topdown' ? 'topdown' : 'side';
   mutate(s => {
    s.settings.view = view;
   });
  } else if (d.size !== undefined) {
   const v = Number(el.value);
   mutate(s => {
    s.settings.size[Number(d.size)] = v;
   });
  } else if (d.pedit) {
   const id = state.sel.part;
   mutate(s => {
    const p = s.parts[id];
    if (d.pedit === 'name') p.name = el.value;
    else if (d.pedit === 'z') p.z = Number(el.value);
    else if (el.checked) p.effect = true;
    else delete p.effect;
   });
  } else if (el.id === 'variantSel') {
   state.sel.variant = el.value;
   renderPanel();
  } else if (el.id === 'colorValue') {
   const k = state.sel.color;
   mutate(s => {
    s.palette[k] = el.value;
   });
  } else if (d.cedit) {
   const {ed} = editInfo();
   mutate(s => {
    const a = s.animations[ed.clip];
    if (d.cedit === 'name') a.name = el.value;
    else if (d.cedit === 'fps') a.fps = Number(el.value);
    else a.loop = el.checked;
   });
  } else if (d.fedit) {
   const {ed} = editInfo();
   if (d.fedit === 'part') {
    ed.part = el.value;
    renderPanel();
   } else if (d.fedit === 'hold') {
    const v = Number(el.value);
    mutate(s => {
     const f = s.animations[ed.clip].frames[ed.frame];
     if (v === 1) delete f.hold;
     else f.hold = v;
    });
   } else if (d.fedit === 'event') {
    setFrameEvent(el.value);
   } else if (d.fedit === 'variant') {
    setFramePart('variant',el.value === 'base' ? undefined : el.value);
   } else if (d.fedit === 'flipX') {
    setFramePart('flipX',el.checked ? true : undefined);
   } else if (d.fedit === 'visible') {
    setFramePart('visible',el.checked ? undefined : false);
   }
  } else if (d.q) {
   setQueueField(el);
   if (d.q === 'id') {
    const it = state.ai.queue[state.ai.qi];
    const std = STANDARD.find(x => x[0] === it.id);
    if (std) {
     it.name = std[1];
     it.loop = std[2];
     it.fps = std[3];
     it.frames = std[4];
    }
    // 作成済みの動きを選んだら、今の動きの値を入れる
    const made = own(state.spec.animations,it.id) ? state.spec.animations[it.id] : null;
    if (made) {
     it.name = made.name || it.id;
     it.loop = made.loop !== false;
     it.fps = made.fps;
     it.frames = made.frames.length;
    }
   }
   if (el.type === 'checkbox' || el.tagName === 'SELECT') renderPanel();
  }
 } catch (err) {
  showError(err);
  renderPanel();
 }
}

function handleKey(e) {
 if (!$('modal').hidden) {
  if (e.key === 'Escape') closeDialog();
  if (e.key === 'Enter' && e.target.id === 'dialogInput' && !e.isComposing && e.keyCode !== 229) {
   e.preventDefault();
   actions.confirmText();
  }
  return;
 }

 if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

 const k = String(e.key).toLowerCase();

 if (state.motion.walk && (isTopdown()
  ? ['a','d','w','s','arrowleft','arrowright','arrowup','arrowdown']
  : ['a','d','arrowleft','arrowright']).includes(k)) {
  e.preventDefault();
  state.keys[k] = true;
  return;
 }

 if ((e.ctrlKey || e.metaKey) && k === 'z') {
  e.preventDefault();
  safe(() => undoRedo(e.shiftKey));
 }
}

// ============================================================
// 18. 起動
// ============================================================
function init() {
 try {
  const p = JSON.parse(localStorage.getItem(PREFS) || 'null');
  if (obj(p)) {
   if (typeof p.pin === 'boolean') state.pin = p.pin;
   if (typeof p.grid === 'boolean') state.grid = p.grid;
   if (typeof p.bg === 'string' && /^#[0-9a-f]{6}$/i.test(p.bg)) state.bg = p.bg;
   if (p.intro === true) state.welcome = false;
   if (p.fine === true) state.vw.fine = true;
   state.sampleVer = p.sample;
   if (typeof p.sampleSig === 'string') state.sampleSig = p.sampleSig;
  }
 } catch (_) {}

 $('gridToggle').checked = state.grid;
 $('background').value = state.bg;
 applyPin();

 restore();
 rebuild();
 renderPanel();
 savePrefs();
 if (state.swapped) toast('サンプルの戦士を最新版に入れ替えました。保存済みのキャラはライブラリに残っています',4200);

 bindGestures();
 bindCanvas();
 new ResizeObserver(resizeView).observe($('viewport'));
 resizeView();

 document.addEventListener('click',handleClick);
 document.addEventListener('input',handleInput);
 document.addEventListener('change',handleChange);
 document.addEventListener('keydown',handleKey);
 document.addEventListener('keyup',e => {
  state.keys[String(e.key).toLowerCase()] = false;
 });
 window.addEventListener('blur',() => {
  state.keys = {};
 });
 document.addEventListener('visibilitychange',() => {
  if (document.hidden) writeDraft();
 });
 window.addEventListener('pagehide',writeDraft);

 requestAnimationFrame(frameLoop);
}

try {
 init();
} catch (e) {
 showError(Error('起動処理のエラー: '+(e && e.message ? e.message : e)));
}
