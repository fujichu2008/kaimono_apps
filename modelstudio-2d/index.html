<html lang="ja">

<title>ModelStudio 2D</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#191f29;--line:#303b49;--muted:#a6b4c5;--cyan:#63d9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#edf4fc;font:14px/1.5 system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input:not([type=checkbox]):not([type=color]):not([type=range]){min-height:44px}
button{background:#283343;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.38;cursor:default}
.primary{background:#175d75;border-color:#327e97}
.danger{color:#ffb5b5}
input,select,textarea{background:#101721;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input[type=color]{height:44px;padding:4px}
input[type=checkbox]{width:21px;height:21px;vertical-align:middle}
input[type=range]{padding:0;accent-color:var(--cyan);min-height:32px}
textarea{resize:vertical;min-height:110px;font:13px/1.55 ui-monospace,monospace}
label{display:block;color:var(--muted);margin:10px 0 4px}
h2{font-size:19px;margin:4px 0 4px}
h3{font-size:15px;margin:14px 0 8px}
p{margin:8px 0}
.muted,small{color:var(--muted)}
body.preview-pinned{overflow:hidden}
body.preview-pinned .workspace{height:100vh;height:100dvh;overflow:hidden}
body.preview-pinned #viewport{flex:none;height:42svh;min-height:0}
body.preview-pinned #panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.workspace{display:flex;flex-direction:column}
#viewport{height:46svh;min-height:220px;position:relative;background:#202a36;overflow:hidden}
#view{display:block;width:100%;height:100%;touch-action:none}
#viewTools{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:12}
#moreMenu{position:relative}
#moreMenu>summary{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#18212df2;cursor:pointer;list-style:none}
#moreMenu>summary::-webkit-details-marker{display:none}
#moreMenu[open]>summary{border-color:var(--cyan);background:#204255}
#moreMenu .menu-sheet{position:absolute;top:calc(100% + 8px);right:0;width:min(320px,calc(100vw - 24px));max-height:calc(100dvh - 150px);overflow-y:auto;background:#191f29;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 36px #0008}
.menu-heading{font-size:12px;color:var(--muted);margin:12px 0 6px}
.menu-status{margin:0 0 10px;overflow-wrap:anywhere;font-size:13px}
.menu-check{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;color:#edf4fc;cursor:pointer}
.menu-check input{flex:none}
.menu-wide{display:block;width:100%;text-align:left}
.menu-color{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.menu-color input{width:64px}
#panel{padding:16px 16px calc(100px + env(safe-area-inset-bottom));min-width:0;overflow-wrap:anywhere}
.card{background:#1b2531b8;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card.review{border-color:var(--cyan)}
.hint{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#121b27f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:transparent;padding:8px 2px;font-size:13px;min-height:52px;white-space:nowrap}
nav button.active{background:#204255;color:#8eeaff}
nav span{display:block;font-size:17px}
#quickTools{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:4;display:flex;gap:5px}
#quickTools button{min-width:44px;min-height:44px;padding:7px;background:#18212ded}
#quickTools .quick-save{background:#175d75ed}
.workflow-head{margin-bottom:12px}
.workflow-switch{display:flex;gap:8px;margin:10px 0 14px}
.workflow-switch button{flex:1;min-height:44px}
.workflow-switch button.active{background:#204255;border-color:var(--cyan);color:#8eeaff}
.partrow{display:flex;gap:5px;margin:4px 0;align-items:center}
.partrow .pick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partrow small{margin-left:8px}
.selected{border-color:var(--cyan);background:#244654}
.toggle{width:44px;padding:5px;flex:none}
.error{border:1px solid #a85f65;background:#3c202b;color:#ffd9db;border-radius:10px;padding:10px;white-space:pre-wrap}
.success{color:#9decce}
.warnbox{border:1px solid #b98b52;background:#3a2e1c;color:#ffe2b8;border-radius:10px;padding:10px}
#error{position:fixed;top:calc(64px + env(safe-area-inset-top));left:12px;right:12px;margin:0;max-height:30dvh;overflow:auto;z-index:10}
#error[hidden]{display:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:90vw;background:#d7f8ff;color:#102733;padding:10px 18px;border-radius:12px;z-index:30;display:none}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}
.modal[hidden]{display:none}
.dialog{width:min(760px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.dialog textarea{height:40dvh}
.dialog .row{justify-content:flex-end}
.helpsteps{display:grid;gap:8px;margin:14px 0}
.helpsteps div{padding:10px;background:#25303e;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{min-height:44px;padding:6px 12px;border-radius:999px}
.nudgegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.nudgegrid button{min-height:44px;padding:6px 4px}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:6px 0}
.swatch{min-height:44px;padding:0;border-radius:10px;border:2px solid var(--line);font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.libcard{min-width:0}
.libopen{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;padding:6px;text-align:left}
.libopen img,.nothumb{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#1c2633;image-rendering:pixelated}
.nothumb{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.libopen b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libopen small{font-size:11px}
.libcard.current .libopen{border-color:var(--cyan);background:#1f3442}
.libacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:4px}
.libacts button{padding:6px 2px;font-size:12px}
#walkUI{position:absolute;inset:0;pointer-events:none;z-index:3}
#walkStick{position:absolute;left:16px;bottom:16px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}
#walkKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#63d9f5cc;pointer-events:none}
#walkActs{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#walkActs button{background:#175d75e6;min-width:92px}
#recoverBar{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;display:flex;gap:6px;align-items:center;max-width:calc(100vw - 24px);padding:8px;background:#3a2e1c;border:1px solid #b98b52;border-radius:14px}
#recoverBar button{white-space:nowrap}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(min-width:950px){#panel{padding-left:max(24px,calc((100vw - 1000px)/2));padding-right:max(24px,calc((100vw - 1000px)/2))}}
@media(max-width:500px){input,select,textarea{font-size:16px}}

<body>
<div id="error" class="error" role="alert" hidden></div>

<main class="workspace">
 <section id="viewport" aria-label="プレビュー">
  <canvas id="view"></canvas>
  <div id="quickTools" role="group" aria-label="編集と保存">
   <button id="undoBtn" data-action="undo" aria-label="元に戻す">↶</button>
   <button id="redoBtn" data-action="redo" aria-label="やり直す">↷</button>
   <button data-action="save" class="quick-save">保存</button>
  </div>
 </section>
 <section id="panel"></section>
</main>

<div id="viewTools">
 <details id="moreMenu">
  <summary aria-label="その他の操作と表示設定">☰ その他</summary>
  <div class="menu-sheet">
   <p id="modelTitle" class="menu-status"></p>
   <p><button data-action="library" class="menu-wide">▦ ライブラリ</button></p>
   <p><button data-tab="model" class="menu-wide">キャラ情報</button></p>
   <p class="menu-heading">ファイルとデータ</p>
   <div class="grid2">
    <button data-action="fileOpen">ファイルから開く</button>
    <button data-action="fileSave">ファイルに保存</button>
    <button data-action="json">データをコピー</button>
    <button data-action="saveAs">別名で保存</button>
   </div>
   <p class="menu-heading">表示設定</p>
   <label class="menu-check"><input type="checkbox" id="pinViewport">プレビューを上部に固定</label>
   <label class="menu-check"><input type="checkbox" id="gridToggle">方眼を表示</label>
   <label class="menu-color">背景色<input type="color" id="background" value="#202a36" aria-label="背景色"></label>
   <p class="menu-heading">動作チェック</p>

   <p class="menu-heading">ヘルプ</p>

 </details>
</div>

<nav aria-label="制作の4工程">
 <button data-tab="ai"><span aria-hidden="true">✧</span>① つくる</button>
 <button data-tab="repair"><span aria-hidden="true">✎</span>② なおす</button>
 <button data-tab="motion"><span aria-hidden="true">▶</span>③ 動かす</button>
 <button data-tab="export"><span aria-hidden="true">↗</span>④ ゲームへ</button>
</nav>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<input type="file" id="libraryFile" accept=".json,application/json" hidden>

<div id="modal" class="modal" hidden>
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div class="row" id="dialogActions"></div>
 </section>

<script>
'use strict';

// ============================================================
// 1. 定数
// ============================================================
const STORE = 'modelstudio2d.v1';
const DRAFT = STORE+'.draft';
const PREFS = STORE+'.prefs';
const LIMIT = {sizeMin:8,sizeMax:64,colors:32,parts:40,variants:16,animations:50,frames:24,bytes:1000000,history:25};
// 標準の動き [ID, 表示名, くり返し, fps, コマ数の目安]
const STANDARD = [
 ['idle','待機',true,4,4],['walk','歩く',true,8,4],['run','走る',true,12,4],['jump','ジャンプ',false,10,5],
 ['attack','攻撃',false,10,4],['hurt','やられ',false,8,3],['die','倒れる',false,6,4],['emote','喜ぶ',false,8,4]
];

// ============================================================
// 2. 共通レンダラ（外側の状態に依存しない。ゲームにも同じ関数をそのまま出力する）
// ============================================================
function createSpriteRenderer() {
 // 向きのキー: left・right・side は "side"、down・up はそのまま
 function dirKey(direction) {
  return direction === 'down' || direction === 'up' ? direction : 'side';
 }

 function drawRows(rows,palette) {
  const h = Math.max(1,rows.length);
  const w = Math.max(1,...rows.map(r => r.length));
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row,y) => {
   for (let x=0;x<row.length;x++) {
    const col = palette[row[x]];
    if (col) {
     g.fillStyle = col;
     g.fillRect(x,y,1,1);
    }
   }
  });
  return c;
 }

 // 部品の絵をオフスクリーンCanvasに描いて保持する
 function buildSprite(spec) {
  const parts = {};
  for (const id of Object.keys(spec.parts)) {
   const p = spec.parts[id];
   const variants = {};
   for (const vid of Object.keys(p.variants)) variants[vid] = drawRows(p.variants[vid],spec.palette);
   parts[id] = {id,z:p.z || 0,position:p.position,variants,effect:p.effect === true,visible:p.visible !== false};
  }
  const order = Object.keys(parts).map(id => parts[id]).sort((a,b) => a.z-b.z);
  return {size:spec.settings.size.slice(),parts,order,pose:null};
 }

 // 左上を (x,y) に合わせて描く。pose が無いときは基本の姿勢（効果部品は隠す）
 function drawSprite(ctx,sprite,x,y,o) {
  const s = o && o.scale || 1;
  const flip = !!(o && o.flipX);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x,y);
  if (flip) {
   ctx.translate(sprite.size[0]*s,0);
   ctx.scale(-1,1);
  }
  let order = sprite.order;
  if (sprite.pose) {
   order = sprite.order
    .map((part,i) => ({part,i,z:sprite.pose[part.id] && typeof sprite.pose[part.id].z === 'number' ? sprite.pose[part.id].z : part.z}))
    .sort((a,b) => a.z-b.z || a.i-b.i)
    .map(x => x.part);
  }
  for (const part of order) {
   const p = sprite.pose && sprite.pose[part.id]
    || {dx:0,dy:0,variant:'base',flipX:false,visible:part.visible && !part.effect};
   if (!p.visible) continue;
   const img = part.variants[p.variant] || part.variants.base;
   const px = (part.position[0]+p.dx)*s;
   const py = (part.position[1]+p.dy)*s;
   if (p.flipX) {
    ctx.save();
    ctx.translate(px+img.width*s,py);
    ctx.scale(-1,1);
    ctx.drawImage(img,0,0,img.width*s,img.height*s);
    ctx.restore();
   } else {
    ctx.drawImage(img,px,py,img.width*s,img.height*s);
   }
  }
  ctx.restore();
 }

 function clipTicks(c) {
  return c.frames.reduce((n,f) => n+(f.hold || 1),0);
 }

 function clipDuration(c) {
  return clipTicks(c)/(c.fps || 8);
 }

 // 動きの再生。コマごとの「ずれ・絵の差し替え・反転・表示」を sprite.pose に当てはめる
 function createAnimator(sprite,spec,opt) {
  const showEffects = !!(opt && opt.showEffects);
  const clips = spec.animations || {};
  const handlers = {};
  const uses = {};
  let cur = null;
  let dirk = spec.settings && spec.settings.view === 'topdown' ? 'down' : 'side';

  // 向き付きの動き（id_向き）があればそれ、なければ id を使う。無ければ null
  function resolve(id) {
   if (clips[id+'_'+dirk]) return id+'_'+dirk;
   return clips[id] ? id : null;
  }

  // 向きを変える。再生中なら、同じ動きを解決し直してコマ番号を引き継ぐ
  function setDirection(direction) {
   const k = dirKey(direction);
   if (k === dirk) return;
   dirk = k;
   if (cur && !cur.exact) {
    const rid = resolve(cur.id);
    if (rid && rid !== cur.rid) {
     const c = clips[rid];
     const index = Math.min(c.frames.length-1,cur.index);
     cur.rid = rid;
     cur.index = index;
     cur.tick = index ? frameEnd(c,index-1) : 0;
    }
   }
   apply();
  }

  for (const cid of Object.keys(clips)) {
   const u = uses[cid] = new Set(clips[cid].show || []);
   (clips[cid].frames || []).forEach(f => Object.keys(f.parts || {}).forEach(k => u.add(k)));
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(id,index) {
   const rid = cur && cur.id === id ? cur.rid : id;
   for (const ev of clips[rid].events || []) {
    if (ev[0] === index) emit(ev[1],id);
   }
  }

  function frameEnd(c,index) {
   let n = 0;
   for (let i=0;i<=index;i++) n += c.frames[i].hold || 1;
   return n;
  }

  function apply() {
   const pose = {};
   const c = cur ? clips[cur.rid] : null;
   const f = c ? c.frames[cur.index] : null;
   const base = spec.directions && spec.directions[dirk] && spec.directions[dirk].parts || {};
   for (const id of Object.keys(sprite.parts)) {
    const part = sprite.parts[id];
    const b = base[id] || null;
    const d = f && f.parts && f.parts[id] || null;
    let on = true;
    let variant = 'base';
    let flip = false;
    let z = part.z;
    // 基本 → 向きの指定 → コマの指定 の順に重ねる（後のものが上書き）
    for (const o of [b,d]) {
     if (!o) continue;
     if (o.visible !== undefined) on = o.visible !== false;
     if (o.variant && part.variants[o.variant]) variant = o.variant;
     if (o.flipX !== undefined) flip = !!o.flipX;
     if (typeof o.z === 'number') z = o.z;
    }
    let visible = part.visible && on;
    if (part.effect) visible = visible && (c ? uses[cur.rid].has(id) : showEffects);
    pose[id] = {
     dx: (b && b.offset ? b.offset[0] : 0)+(d && d.offset ? d.offset[0] : 0),
     dy: (b && b.offset ? b.offset[1] : 0)+(d && d.offset ? d.offset[1] : 0),
     variant,
     flipX: flip,
     visible,
     z
    };
   }
   sprite.pose = pose;
  }

  function play(id,o) {
   const exact = !!(o && o.exact);
   const rid = exact ? (clips[id] ? id : null) : resolve(id);
   if (!rid) return false;
   if (cur && cur.id === id && !(o && o.restart)) return true;
   cur = {id,rid,exact,tick:0,index:0,fresh:true,done:false};
   apply();
   return true;
  }

  function stop() {
   cur = null;
   apply();
  }

  // 指定したコマの姿勢で止めて表示する（合図は発火しない）
  function seek(id,frame,exact) {
   const rid = exact ? (clips[id] ? id : null) : resolve(id);
   if (!rid) return false;
   const c = clips[rid];
   const index = Math.min(c.frames.length-1,Math.max(0,Math.floor(Number(frame) || 0)));
   cur = {id,rid,exact:!!exact,tick:index ? frameEnd(c,index-1) : 0,index,fresh:false,done:false};
   apply();
   return true;
  }

  function update(dt,o) {
   if (!cur) return;
   const c = clips[cur.rid];
   const speed = o && o.speed != null ? o.speed : 1;
   if (cur.fresh) {
    cur.fresh = false;
    fire(cur.id,cur.index);
   }
   let t = cur.tick+Math.max(0,dt)*(c.fps || 8)*speed;
   const total = clipTicks(c);
   let guard = 0;
   while (guard++ < 500) {
    if (t < frameEnd(c,cur.index)) break;
    if (cur.index < c.frames.length-1) {
     cur.index++;
     fire(cur.id,cur.index);
    } else if (c.loop !== false) {
     t -= total;
     cur.index = 0;
     fire(cur.id,0);
    } else {
     t = total;
     cur.done = true;
     break;
    }
   }
   cur.tick = t;
   apply();
  }

  function on(name,fn) {
   (handlers[name] = handlers[name] || []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.keys(clips).map(id => ({
    id,name:clips[id].name || id,duration:clipDuration(clips[id]),loop:clips[id].loop !== false
   }));
  }

  apply();

  return {
   play,stop,seek,update,on,list,resolve,setDirection,
   get direction() { return dirk; },
   get resolved() { return cur ? cur.rid : null; },
   get playing() { return cur ? cur.id : null; },
   get frame() { return cur ? cur.index : 0; },
   get done() { return !!(cur && cur.done); }
  };
 }

 // 速さから待機・歩く・走るを選ぶ
 function pickLocomotion(clips,speed,o) {
  const walkSpeed = o && o.walkSpeed || 1.2;
  const runSpeed = o && o.runSpeed || 4;
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  if (v < walkSpeed*.04) return {id:first('idle'),rate:1};
  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }
  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。action の1回きりの動きが終わると移動の動きへ戻る（die は戻らない）
 function createController(animator,spec,opts) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;
  let hold = null;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
   hold = null;
  }

  function play(id) {
   if (id === null || id === undefined) {
    hold = null;
    loco = undefined;
    return true;
   }
   if (dead || !animator.resolve(id)) return false;
   hold = id;
   oneShot = null;
   loco = id;
   animator.play(id);
   return true;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id) {
   const rid = animator.resolve(id);
   if (dead || !rid) return false;
   animator.play(id,{restart:true});
   oneShot = {id,left:clipDuration(clips[rid])};
   loco = undefined;
   if (id === 'die') dead = true;
   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);
   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }
   const avail = {};
   for (const k of ['idle','walk','run']) if (animator.resolve(k)) avail[k] = true;
   const next = hold ? {id:hold,rate:1} : pickLocomotion(avail,speed,opts);
   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{restart:true});
    else animator.stop();
   }
   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,action,play,update,reset,
   get current() { return oneShot ? oneShot.id : loco || null; },
   get dead() { return dead; }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.update(dt); hero.draw(ctx,x,y,{scale});
 function createCharacter(spec,opts) {
  const sprite = buildSprite(spec);
  const animator = createAnimator(sprite,spec);
  const controller = createController(animator,spec,opts || {});
  let last = {x:0,y:0,scale:1};
  const topdown = !!(spec.settings && spec.settings.view === 'topdown');

  // 向き: 全方位マップは direction、横スクロールは facing
  function heading(self) {
   return topdown ? (self.direction || 'down') : (self.facing || 'right');
  }

  return {
   sprite,
   animator,
   facing: 'right',
   direction: 'down',
   setSpeed: controller.setSpeed,
   action: controller.action,
   play: controller.play,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() { return controller.current; },
   // 足元の中央を (x,y) に合わせて描く
   draw(ctx,x,y,o) {
    const s = o && o.scale || 1;
    last = {x,y,scale:s};
    const dir = heading(this);
    animator.setDirection(dir);
    drawSprite(ctx,sprite,Math.round(x-sprite.size[0]*s/2),Math.round(y-sprite.size[1]*s),{scale:s,flipX:dir === 'left'});
   },
   // 直前の draw での、取付点の画面上の座標
   getAnchor(id) {
    const a = spec.anchors && spec.anchors[id];
    if (!a) return null;
    let px = a.position[0];
    let py = a.position[1];
    const part = a.parent && sprite.parts[a.parent];
    if (part) {
     const pose = sprite.pose && sprite.pose[a.parent];
     px += part.position[0]+(pose ? pose.dx : 0);
     py += part.position[1]+(pose ? pose.dy : 0);
    }
    const W = sprite.size[0];
    const H = sprite.size[1];
    const s = last.scale;
    const fx = heading(this) === 'left' ? W-px-.5 : px+.5;
    return {x:last.x-W*s/2+fx*s,y:last.y-H*s+(py+.5)*s};
   },
   dispose() {
    animator.stop();
   }
  };
 }

 return {buildSprite,drawSprite,createAnimator,pickLocomotion,createController,createCharacter,clipDuration,dirKey};
}

function assert(test,message) {
 if (!test) throw Error(message);
}

function showError(e) {
 $('error').textContent = e && e.message ? e.message : String(e);
 $('error').hidden = false;
}

function clearError() {
 $('error').hidden = true;
}

function safe(fn) {
 try {
  clearError();
  return fn();
 } catch (e) {
  showError(e);
  return null;
 }
}

function toast(message,ms=2400) {
 $('toast').textContent = message;
 $('toast').style.display = 'block';
 clearTimeout(state.toastTimer);
 state.toastTimer = setTimeout(() => {
  $('toast').style.display = 'none';
 },ms);
}

function guardTree(v,depth=0) {
 assert(depth < 40,'JSONの入れ子が深すぎます');
 if (v && typeof v === 'object') {
  for (const k of Object.keys(v)) {
   assert(!['__proto__','constructor','prototype'].includes(k),'禁止キー: '+k);
   guardTree(v[k],depth+1);
  }
 } else if (typeof v === 'number') {
  assert(Number.isFinite(v),'有限の数値が必要です');
 }
}

function parseJSON(text,max=LIMIT.bytes) {
 assert(text.length <= max,'データが大きすぎます');
 let v;
 try {
  v = JSON.parse(text);
 } catch (e) {
  throw Error('データの書き方に誤りがあります（JSON構文エラー）: '+e.message);
 }
 guardTree(v);
 return v;
}

function cleanPastedJSON(text) {
 return String(text ?? '')
  .replace(/^\uFEFF/,'')
  .replace(/[\u201C\u201D\u201E\u201F\u2033\uFF02]/g,'"')
  .replace(/\u00A0/g,' ')
  .trim()
  .replace(/^`{3}[A-Za-z]*\s*\n?/,'')
  .replace(/\n?`{3}\s*$/,'')
  .trim();
}

function parseAIJSON(text) {
 const t = cleanPastedJSON(text);
 try {
  return parseJSON(t);
 } catch (e) {
  if (/構文エラー/.test(e.message) && t.startsWith('{') && !t.endsWith('}')) {
   throw Error('AIの回答が途中で切れている可能性があります。頼む動きの数を減らすか、AIに続きを出すよう頼んでください');
  }
  throw e;
 }
}

function validId(id) {
 return typeof id === 'string'
  && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(id)
  && !['constructor','prototype','__proto__'].includes(id);
}

function int(n,label,min,max) {
 assert(Number.isInteger(n) && n >= min && n <= max,label+': '+min+'〜'+max+'の整数が必要です');
}

function newId(base,taken) {
 if (!taken.includes(base)) return base;
 let i = 2;
 while (taken.includes(base+i)) i++;
 return base+i;
}

function normalizeSpec(source) {
 const s = clone(source);
 guardTree(s);
 assert(obj(s),'データはObjectです');
 s.anchors ??= {};
 s.animations ??= {};
 if (obj(s.meta)) s.meta.version ??= 1;
 if (obj(s.parts)) {
  for (const [id,p] of Object.entries(s.parts)) {
   if (!obj(p)) continue;
   p.name ??= id;
   p.z ??= 0;
   p.position ??= [0,0];
  }
 }
 if (obj(s.anchors)) {
  for (const [id,a] of Object.entries(s.anchors)) {
   if (!obj(a)) continue;
   a.name ??= id;
   a.parent ??= null;
  }
 }
 return s;
}

function validateSpec(s) {
 guardTree(s);
 assert(obj(s) && s.format === 'SPRITE_SPEC_V1','format: SPRITE_SPEC_V1 が必要です');
 assert(
  obj(s.meta) && typeof s.meta.name === 'string' && s.meta.name.trim() && validId(s.meta.id),
  'meta.name と、英字で始まる英数字の meta.id が必要です'
 );
 assert(s.meta.description === undefined || typeof s.meta.description === 'string','description は文字列です');
 assert(
  obj(s.settings) && Array.isArray(s.settings.size) && s.settings.size.length === 2,
  'settings.size は [幅,高さ] で書いてください'
 );
 s.settings.size.forEach(v => int(v,'キャラの大きさ（size）',LIMIT.sizeMin,LIMIT.sizeMax));
 assert(
  s.settings.view === undefined || ['side','topdown'].includes(s.settings.view),
  'settings.view は "side"（横スクロール）か "topdown"（全方位マップ）にしてください'
 );

 assert(obj(s.palette),'palette は「1文字の記号: 色」のObjectです');
 const colors = Object.keys(s.palette);
 assert(colors.length >= 1 && colors.length <= LIMIT.colors,'色は1〜'+LIMIT.colors+'色です');
 for (const k of colors) {
  assert(k.length === 1 && k !== '.' && !/\s/.test(k),'色の記号「'+k+'」は使えません。"." と空白以外の1文字にしてください');
  assert(typeof s.palette[k] === 'string' && /^#[0-9a-f]{6}$/i.test(s.palette[k]),'色「'+k+'」は #rrggbb の形で書いてください');
 }

 for (const k of ['parts','anchors','animations']) assert(obj(s[k]),k+' はIDをキーにしたObjectです');
 assert(Object.keys(s.parts).length <= LIMIT.parts,'部品は'+LIMIT.parts+'個までです');

 for (const [id,p] of Object.entries(s.parts)) {
  const L = '部品「'+id+'」';
  assert(validId(id) && obj(p),L+': IDは英字で始まる英数字にしてください');
  assert(typeof p.name === 'string',L+': name（名前）が必要です');
  assert(typeof p.z === 'number' && Number.isFinite(p.z),L+': z（描画順）は数値です');
  assert(Array.isArray(p.position) && p.position.length === 2,L+': position は [x,y] で書いてください');
  p.position.forEach(v => int(v,L+'の位置',-64,128));
  assert(p.effect === undefined || typeof p.effect === 'boolean',L+': effect は true/false です');
  assert(p.visible === undefined || typeof p.visible === 'boolean',L+': visible は true/false です');
  assert(obj(p.variants) && own(p.variants,'base'),L+': variants.base（基本の絵）が必要です');
  const vids = Object.keys(p.variants);
  assert(vids.length <= LIMIT.variants,L+': 絵は'+LIMIT.variants+'個までです');

  for (const vid of vids) {
   const rows = p.variants[vid];
   const V = L+'の絵「'+vid+'」';
   assert(validId(vid),V+': 絵のIDは英字で始まる英数字にしてください');
   assert(Array.isArray(rows) && rows.length >= 1 && rows.length <= 64,V+': 行は1〜64行です');
   rows.forEach((row,y) => {
    assert(typeof row === 'string' && row.length <= 64,V+'の'+(y+1)+'行目: 64文字までの文字列で書いてください');
    for (let x=0;x<row.length;x++) {
     assert(row[x] === '.' || own(s.palette,row[x]),V+'の'+(y+1)+'行目: 記号「'+row[x]+'」が palette にありません');
    }
   });
  }
 }

 assert(Object.keys(s.anchors).length <= 40,'取付点は40個までです');
 for (const [id,a] of Object.entries(s.anchors)) {
  const L = '取付点「'+id+'」';
  assert(validId(id) && obj(a) && typeof a.name === 'string',L+': IDと name を確認してください');
  assert(a.parent === null || typeof a.parent === 'string' && own(s.parts,a.parent),L+': 付ける部品（parent）が見つかりません');
  assert(Array.isArray(a.position) && a.position.length === 2,L+': position は [x,y] で書いてください');
  a.position.forEach(v => int(v,L+'の位置',-64,128));
 }

 const anims = Object.entries(s.animations);
 assert(anims.length <= LIMIT.animations,'動きは'+LIMIT.animations+'個までです');

 for (const [id,a] of anims) {
  const L = '動き「'+id+'」';
  assert(validId(id) && obj(a),L+': IDは英字で始まる英数字にしてください');
  assert(a.name === undefined || typeof a.name === 'string',L+': name は文字列です');
  assert(typeof a.fps === 'number' && a.fps >= 1 && a.fps <= 30,L+': fps は1〜30の数値です');
  assert(a.loop === undefined || typeof a.loop === 'boolean',L+': loop は true/false です');
  assert(
   Array.isArray(a.frames) && a.frames.length >= 1 && a.frames.length <= LIMIT.frames,
   L+': コマ（frames）は1〜'+LIMIT.frames+'個です'
  );

  a.frames.forEach((f,i) => {
   const F = L+'の'+(i+1)+'コマ目';
   assert(obj(f),F+': Objectで書いてください');
   if (f.hold !== undefined) int(f.hold,F+'の hold',1,24);
   assert(f.parts === undefined || obj(f.parts),F+': parts は部品IDをキーにしたObjectです');

   for (const [pid,d] of Object.entries(f.parts || {})) {
    assert(own(s.parts,pid),F+': 部品「'+pid+'」がありません');
    assert(obj(d),F+': 部品「'+pid+'」の指定はObjectで書いてください');
    if (d.offset !== undefined) {
     assert(Array.isArray(d.offset) && d.offset.length === 2,F+': 部品「'+pid+'」の offset は [dx,dy] です');
     d.offset.forEach(v => int(v,F+'の「'+pid+'」のずれ',-64,64));
    }
    if (d.variant !== undefined) {
     assert(
      typeof d.variant === 'string' && own(s.parts[pid].variants,d.variant),
      F+': 部品「'+pid+'」に絵「'+d.variant+'」がありません'
     );
    }
    for (const k of ['flipX','visible']) {
     assert(d[k] === undefined || typeof d[k] === 'boolean',F+': 部品「'+pid+'」の '+k+' は true/false です');
    }
   }
  });

  assert(a.events === undefined || Array.isArray(a.events),L+': events は配列です');
  for (const ev of a.events || []) {
   assert(Array.isArray(ev) && ev.length === 2 && validId(ev[1]),L+': 合図は [コマ番号,"英数字の名前"] の形です');
   int(ev[0],L+'の合図のコマ番号',0,a.frames.length-1);
  }

  assert(a.show === undefined || Array.isArray(a.show),L+': show は部品IDの配列です');
  for (const pid of a.show || []) {
   assert(typeof pid === 'string' && own(s.parts,pid),L+': show の部品「'+pid+'」がありません');
  }
 }

 if (s.directions !== undefined) {
  assert(obj(s.directions),'directions（向きごとの基本姿勢）は down・up・side をキーにしたObjectです');

  for (const [dk,dv] of Object.entries(s.directions)) {
   const D = '向き「'+dk+'」';
   assert(['down','up','side'].includes(dk),'directions に使えるのは down・up・side だけです（「'+dk+'」は使えません）');
   assert(obj(dv),D+': Objectで書いてください');
   assert(dv.parts === undefined || obj(dv.parts),D+': parts は部品IDをキーにしたObjectです');

   for (const [pid,d] of Object.entries(dv.parts || {})) {
    assert(own(s.parts,pid),D+': 部品「'+pid+'」がありません');
    assert(obj(d),D+': 部品「'+pid+'」の指定はObjectで書いてください');
    if (d.offset !== undefined) {
     assert(Array.isArray(d.offset) && d.offset.length === 2,D+': 部品「'+pid+'」の offset は [dx,dy] です');
     d.offset.forEach(v => int(v,D+'の「'+pid+'」のずれ',-64,64));
    }
    if (d.variant !== undefined) {
     assert(typeof d.variant === 'string' && own(s.parts[pid].variants,d.variant),D+': 部品「'+pid+'」に絵「'+d.variant+'」がありません');
    }
    assert(d.z === undefined || typeof d.z === 'number' && Number.isFinite(d.z),D+': 部品「'+pid+'」の z は数値です');
    for (const k of ['flipX','visible']) {
     assert(d[k] === undefined || typeof d[k] === 'boolean',D+': 部品「'+pid+'」の '+k+' は true/false です');
    }
   }
  }
 }

 assert(JSON.stringify(s).length <= LIMIT.bytes,'データが大きすぎます');
 return true;
}

// 全方位マップ（4方向）のキャラか
function isTopdown(s=state.spec) {
 return !!(s.settings && s.settings.view === 'topdown');
}

// いま表示している向きのキー（down・up・side）
function viewKey() {
 return isTopdown() ? R.dirKey(state.motion.dir) : 'side';
}

function dirBaseParts() {
 const d = state.spec.directions;
 const e = d && d[viewKey()];
 return e && e.parts || {};
}

function snapshot() {
 return clone(state.spec);
}

function remember(before) {
 state.undo.push({spec:before,projectId:state.projectId});
 if (state.undo.length > LIMIT.history) state.undo.shift();
 state.redo = [];
}

function markChanged() {
 state.dirty = true;
 updateHeader();
 scheduleDraft();
}

function fixSelection() {
 const s = state.spec;
 const sel = state.sel;
 const m = state.motion;

 if (!own(s.parts,sel.part)) sel.part = Object.keys(s.parts)[0] || null;
 if (!sel.part || !own(s.parts[sel.part].variants,sel.variant)) sel.variant = 'base';
 if (!own(s.palette,sel.color)) sel.color = Object.keys(s.palette)[0];
 if (m.playing && !own(s.animations,m.playing)) m.playing = null;

 if (m.edit) {
  const a = s.animations[m.edit.clip];
  if (!a) {
   m.edit = null;
  } else {
   m.edit.frame = Math.min(m.edit.frame,a.frames.length-1);
   if (!own(s.parts,m.edit.part)) m.edit.part = Object.keys(s.parts)[0] || null;
  }
 }
}

// データから描画用のスプライトと再生役を作り直す
function rebuild() {
 const rt = state.rt;
 const m = state.motion;

 fixSelection();
 rt.sprite = R.buildSprite(state.spec);
 rt.animator = R.createAnimator(rt.sprite,state.spec,{showEffects:true});
 rt.animator.on('*',e => toast('合図「'+e.event+'」',900));
 rt.controller = R.createController(rt.animator,state.spec);
 rt.animator.setDirection(viewKey());

 if (m.edit) rt.animator.seek(m.edit.clip,m.edit.frame,true);
 else if (m.trying) rt.controller.setSpeed(m.walk ? 0 : m.trySpeed);
 else if (m.playing) rt.animator.play(m.playing,{exact:true});
}

function commit(next,{history=true}={}) {
 validateSpec(next);
 if (history) remember(snapshot());
 state.spec = next;
 rebuild();
 markChanged();
 renderPanel();
}

function mutate(fn) {
 const next = snapshot();
 fn(next);
 commit(next);
}

function undoRedo(redo=false) {
 const from = redo ? state.redo : state.undo;
 const to = redo ? state.undo : state.redo;
 if (!from.length) return;

 const entry = from.pop();
 to.push({spec:snapshot(),projectId:state.projectId});
 state.spec = clone(entry.spec);
 state.projectId = entry.projectId;
 state.motion.review = null;
 rebuild();
 markChanged();
 renderPanel();
}

function resetMotionUI() {
 const m = state.motion;
 m.playing = null;
 m.edit = null;
 m.trying = false;
 m.walk = false;
 m.x = 0;
 m.y = 0;
 m.dir = 'down';
 m.facing = 'right';
 $('walkUI')?.remove();
}

function replaceProject(spec,id=null,dirty=true) {
 validateSpec(spec);
 resetMotionUI();
 state.spec = spec;
 state.projectId = id;
 state.undo = [];
 state.redo = [];
 state.motion.review = null;
 state.motion.view = null;
 state.restoredTitle = '';
 state.ai.queueFor = null;
 rebuild();
 state.dirty = dirty;
 writeDraft();
 updateHeader();
}

// ============================================================
// 8. プレビュー描画と、タップで塗る
// ============================================================
let lastTime = 0;

function setStillPose() {
 const sp = state.rt.sprite;
 const sel = state.sel;
 const editing = state.tab === 'parts';
 const pose = {};

 for (const id of Object.keys(sp.parts)) {
  const part = sp.parts[id];
  const b = dirBaseParts()[id] || {};
  let variant = b.variant && part.variants[b.variant] ? b.variant : 'base';
  let dx = b.offset ? b.offset[0] : 0;
  let dy = b.offset ? b.offset[1] : 0;
  let flip = !!b.flipX;
  let visible = part.visible && b.visible !== false;

  // 塗っている部品は、選んだ絵をそのままの位置で表示する（塗る位置と合わせるため）
  if (editing && id === sel.part && part.variants[sel.variant]) {
   variant = sel.variant;
   dx = 0;
   dy = 0;
   flip = false;
   visible = part.visible;
  }

  pose[id] = {
   dx,dy,variant,flipX:flip,visible,
   z: typeof b.z === 'number' ? b.z : part.z
  };
 }
 sp.pose = pose;
}

function drawPreview() {
 const c = $('view');
 const g = c.getContext('2d');
 const [W,H] = state.spec.settings.size;
 const cw = c.width;
 const ch = c.height;
 if (!cw || !ch) return;

 const m = state.motion;
 const s = Math.max(1,Math.floor(Math.min(cw/(W+6),ch/(H+8))));
 const limit = Math.max(0,(cw/s-W)/2);
 if (m.trying) m.x = Math.max(-limit,Math.min(limit,m.x));
 if (m.trying) {
  const limitY = Math.max(0,(ch/s-H)/2);
  m.y = Math.max(-limitY,Math.min(limitY,m.y));
 }

 const ox = Math.floor((cw-W*s)/2)+Math.round((m.trying ? m.x : 0)*s);
 const oy = Math.floor((ch-H*s)/2)+Math.round((m.trying && isTopdown() ? m.y : 0)*s);
 state.rt.layout = {s,ox,oy,limit};

 g.imageSmoothingEnabled = false;
 g.fillStyle = state.bg;
 g.fillRect(0,0,cw,ch);

 // 地面の線
 if (!isTopdown()) {
  g.fillStyle = 'rgba(255,255,255,.18)';
  g.fillRect(0,oy+H*s,cw,Math.max(1,Math.floor(s/4)));
 }

 if (state.grid && !m.trying) {
  g.lineWidth = 1;
  if (s >= 6) {
   g.strokeStyle = 'rgba(255,255,255,.07)';
   g.beginPath();
   for (let i=1;i<W;i++) {
    g.moveTo(ox+i*s+.5,oy);
    g.lineTo(ox+i*s+.5,oy+H*s);
   }
   for (let i=1;i<H;i++) {
    g.moveTo(ox,oy+i*s+.5);
    g.lineTo(ox+W*s,oy+i*s+.5);
   }
   g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,.3)';
  g.strokeRect(ox+.5,oy+.5,W*s,H*s);
 }

 R.drawSprite(g,state.rt.sprite,ox,oy,{scale:s,flipX:previewFlip()});

 // 手でなおす: 選んだ部品の絵の範囲
 if (state.tab === 'parts' && state.sel.part && !m.trying && !m.playing && !m.edit) {
  const p = state.spec.parts[state.sel.part];
  const rows = p.variants[state.sel.variant] || p.variants.base;
  const w = Math.max(1,...rows.map(r => r.length));
  g.strokeStyle = '#63d9f5';
  g.lineWidth = Math.max(1,Math.floor(s/6));
  g.strokeRect(ox+p.position[0]*s,oy+p.position[1]*s,w*s,rows.length*s);
 }
}

// プレビューを左右反転で描くか（全方位は左向きのとき。塗っている間は反転しない）
function previewFlip() {
 const m = state.motion;
 if (m.trying) return isTopdown() ? m.dir === 'left' : m.facing === 'left';
 return isTopdown() && m.dir === 'left' && state.tab !== 'parts';
}

function frameLoop(now) {
 requestAnimationFrame(frameLoop);
 const dt = Math.min(.1,(now-(lastTime || now))/1000);
 lastTime = now;

 const m = state.motion;
 const rt = state.rt;
 if (!rt.sprite || document.hidden) return;

 rt.animator.setDirection(viewKey());

 if (m.trying) {
  if (m.walk) updateWalk(dt);
  rt.controller.update(dt);
 } else if (m.edit) {
  // コマの編集中は seek した姿勢のまま
 } else if (m.playing) {
  rt.animator.update(dt,{speed:m.speed});
 } else {
  setStillPose();
 }

 drawPreview();
}

function resizeView() {
 const c = $('view');
 const dpr = Math.min(window.devicePixelRatio || 1,3);
 c.width = Math.max(1,Math.round(c.clientWidth*dpr));
 c.height = Math.max(1,Math.round(c.clientHeight*dpr));
}

function canPaint() {
 const m = state.motion;
 return state.tab === 'parts' && !!state.sel.part && !m.trying && !m.playing && !m.edit;
}

function pointerPixel(e) {
 const c = $('view');
 const rect = c.getBoundingClientRect();
 const L = state.rt.layout;
 if (!L) return null;
 const x = (e.clientX-rect.left)*(c.width/rect.width);
 const y = (e.clientY-rect.top)*(c.height/rect.height);
 return [Math.floor((x-L.ox)/L.s),Math.floor((y-L.oy)/L.s)];
}

function floodFill(rows,x,y,ch) {
 const w = Math.max(1,...rows.map(r => r.length));
 const grid = rows.map(r => r.padEnd(w,'.').split(''));
 if (y >= grid.length || x >= w) return false;
 const from = grid[y][x];
 if (from === ch) return false;

 const stack = [[x,y]];
 while (stack.length) {
  const [cx,cy] = stack.pop();
  if (cx < 0 || cy < 0 || cy >= grid.length || cx >= w || grid[cy][cx] !== from) continue;
  grid[cy][cx] = ch;
  stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
 }
 grid.forEach((r,i) => {
  rows[i] = r.join('');
 });
 return true;
}

// 選んだ部品の、選んだ絵に1ピクセル塗る（右と下は自動で広げる）
function paintAt(px,py,start) {
 const [W,H] = state.spec.settings.size;
 const p = state.spec.parts[state.sel.part];
 if (!p || px < 0 || py < 0 || px >= W || py >= H) return false;

 const rows = p.variants[state.sel.variant];
 const x = px-p.position[0];
 const y = py-p.position[1];
 const tool = state.sel.tool;
 const ch = tool === 'erase' ? '.' : state.sel.color;

 if (x < 0 || y < 0) {
  if (start) toast('絵の左か上の外側です。「絵を広げる」で広げてから塗ってください');
  return false;
 }
 if (x >= 64 || y >= 64) return false;

 if (tool === 'fill') return start ? floodFill(rows,x,y,ch) : false;

 if (ch === '.') {
  if (y >= rows.length || x >= rows[y].length || rows[y][x] === '.') return false;
 } else {
  const w = Math.max(1,...rows.map(r => r.length));
  while (rows.length <= y) rows.push('.'.repeat(w));
  if (rows[y].length <= x) rows[y] = rows[y].padEnd(x+1,'.');
  if (rows[y][x] === ch) return false;
 }

 rows[y] = rows[y].slice(0,x)+ch+rows[y].slice(x+1);
 return true;
}

function strokePaint(e,start) {
 const st = state.stroke;
 const pos = pointerPixel(e);
 if (!st || !pos) return;
 if (pos[0] === st.lastX && pos[1] === st.lastY && !start) return;
 st.lastX = pos[0];
 st.lastY = pos[1];

 if (paintAt(pos[0],pos[1],start)) {
  st.changed = true;
  state.rt.sprite = R.buildSprite(state.spec);
 }
}

function bindCanvas() {
 const c = $('view');

 c.addEventListener('pointerdown',e => {
  if (!canPaint()) return;
  e.preventDefault();
  c.setPointerCapture(e.pointerId);
  state.stroke = {id:e.pointerId,before:snapshot(),changed:false,lastX:null,lastY:null};
  strokePaint(e,true);
 });

 c.addEventListener('pointermove',e => {
  if (state.stroke && state.stroke.id === e.pointerId) strokePaint(e,false);
 });

 const end = e => {
  const st = state.stroke;
  if (!st || st.id !== e.pointerId) return;
  state.stroke = null;
  if (st.changed) {
   remember(st.before);
   rebuild();
   markChanged();
  }
 };

 c.addEventListener('pointerup',end);
 c.addEventListener('pointercancel',end);
}

// ============================================================
// 9. 部品の手なおし
// ============================================================
function selectedPart(s=state.spec) {
 const id = state.sel.part;
 assert(id && own(s.parts,id),'部品を選んでください');
 return s.parts[id];
}

function addPart() {
 const s = state.spec;
 assert(Object.keys(s.parts).length < LIMIT.parts,'部品は'+LIMIT.parts+'個までです');
 const id = newId('part',Object.keys(s.parts));
 const [W,H] = s.settings.size;
 const z = Math.max(0,...Object.values(s.parts).map(p => p.z))+1;

 state.sel.part = id;
 state.sel.variant = 'base';
 mutate(x => {
  x.parts[id] = {
   name:'新しい部品',z,
   position:[Math.max(0,Math.floor(W/2)-4),Math.max(0,Math.floor(H/2)-4)],
   variants:{base:Array.from({length:8},() => '........')}
  };
 });
 toast('部品を追加しました。プレビューをタップして塗れます');
}

function duplicatePart() {
 const src = selectedPart();
 const s = state.spec;
 assert(Object.keys(s.parts).length < LIMIT.parts,'部品は'+LIMIT.parts+'個までです');
 const id = newId(state.sel.part+'_copy',Object.keys(s.parts)).slice(0,64);
 const copy = clone(src);
 copy.name += ' コピー';
 copy.position = [copy.position[0]+2,copy.position[1]];

 state.sel.part = id;
 mutate(x => {
  x.parts[id] = copy;
 });
}

function deletePart() {
 const id = state.sel.part;
 selectedPart();

 askConfirm('部品「'+state.spec.parts[id].name+'」を削除しますか？動きの中の指定も消えます。',() => mutate(s => {
  delete s.parts[id];
  for (const [aid,a] of Object.entries(s.anchors)) {
   if (a.parent === id) delete s.anchors[aid];
  }
  for (const a of Object.values(s.animations)) {
   a.frames.forEach(f => {
    if (f.parts) delete f.parts[id];
   });
   if (a.show) a.show = a.show.filter(x => x !== id);
  }
 }));
}

function nudgePart(dir) {
 selectedPart();
 const id = state.sel.part;
 const i = dir[0] === 'x' ? 0 : 1;
 const d = dir[1] === '+' ? 1 : -1;
 mutate(s => {
  s.parts[id].position[i] += d;
 });
}

function togglePartVisible(id) {
 mutate(s => {
  const p = s.parts[id];
  if (p.visible === false) delete p.visible;
  else p.visible = false;
 });
}

function addVariant() {
 const p = selectedPart();
 assert(Object.keys(p.variants).length < LIMIT.variants,'1つの部品の絵は'+LIMIT.variants+'個までです');
 const id = state.sel.part;
 const from = state.sel.variant;

 askText('今の絵を複製して、新しい絵を作る','新しい絵のID（英字で始まる英数字。例: raise）','pose',value => {
  const vid = String(value).trim();
  assert(validId(vid),'絵のIDは英字で始まる英数字・_・-で入力してください');
  assert(!own(state.spec.parts[id].variants,vid),'同じIDの絵がすでにあります');
  state.sel.variant = vid;
  mutate(s => {
   s.parts[id].variants[vid] = s.parts[id].variants[from].slice();
  });
 });
}

function deleteVariant() {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;
 assert(vid !== 'base','基本の絵（base）は削除できません');

 askConfirm('絵「'+vid+'」を削除しますか？動きの中でこの絵を使っているコマは、基本の絵に戻ります。',() => {
  state.sel.variant = 'base';
  mutate(s => {
   delete s.parts[id].variants[vid];
   for (const a of Object.values(s.animations)) {
    a.frames.forEach(f => {
     const d = f.parts && f.parts[id];
     if (d && d.variant === vid) {
      delete d.variant;
      if (!Object.keys(d).length) delete f.parts[id];
     }
    });
   }
  });
 });
}

function flipVariant() {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;
 mutate(s => {
  const rows = s.parts[id].variants[vid];
  const w = Math.max(1,...rows.map(r => r.length));
  s.parts[id].variants[vid] = rows.map(r => r.padEnd(w,'.').split('').reverse().join(''));
 });
}

// 左・上は、部品のすべての絵をそろえて広げ、位置を1ずらす（絵どうしのずれを防ぐ）
function growVariant(dir) {
 selectedPart();
 const id = state.sel.part;
 const vid = state.sel.variant;

 mutate(s => {
  const p = s.parts[id];
  if (dir === 'left') {
   for (const k of Object.keys(p.variants)) p.variants[k] = p.variants[k].map(r => '.'+r);
   p.position[0]--;
  } else if (dir === 'up') {
   for (const k of Object.keys(p.variants)) {
    const w = Math.max(1,...p.variants[k].map(r => r.length));
    p.variants[k].unshift('.'.repeat(w));
   }
   p.position[1]--;
  } else if (dir === 'right') {
   const w = Math.max(1,...p.variants[vid].map(r => r.length));
   p.variants[vid] = p.variants[vid].map(r => r.padEnd(w,'.')+'.');
  } else {
   const w = Math.max(1,...p.variants[vid].map(r => r.length));
   p.variants[vid].push('.'.repeat(w));
  }
 });
}

function addColor() {
 const s = state.spec;
 assert(Object.keys(s.palette).length < LIMIT.colors,'色は'+LIMIT.colors+'色までです');
 const ch = 'abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
  .split('').find(c => !own(s.palette,c));
 assert(ch,'使える記号がありません');
 state.sel.color = ch;
 mutate(x => {
  x.palette[ch] = '#ff8844';
 });
}

function deleteColor() {
 const s = state.spec;
 const k = state.sel.color;
 assert(Object.keys(s.palette).length > 1,'色は最低1色必要です');
 const used = Object.values(s.parts).some(p =>
  Object.values(p.variants).some(rows => rows.some(r => r.includes(k)))
 );
 assert(!used,'この色は絵で使われています。使っている所を塗り替えてから削除してください');
 mutate(x => {
  delete x.palette[k];
 });
}

// ============================================================
// 10. 動き（再生・コマの編集・試す）
// ============================================================
function motionView() {
 const v = state.motion.view;
 if (v === 'view' || v === 'make' || v === 'try') return v;
 return Object.keys(state.spec.animations).length ? 'view' : 'make';
}

function stopMotion() {
 const m = state.motion;
 m.playing = null;
 m.trying = false;
 m.walk = false;
 m.x = 0;
 m.y = 0;
 m.facing = 'right';
 $('walkUI')?.remove();
 state.rt.animator.stop();
 state.rt.controller.reset();
}

function playMotion(id) {
 const m = state.motion;
 if (m.playing === id) {
  stopMotion();
 } else {
  stopMotion();
  m.edit = null;
  assert(state.rt.animator.play(id,{restart:true,exact:true}),'動きが見つかりません: '+id);
  m.playing = id;
 }
 renderPanel();
}

function toggleEdit(id) {
 const m = state.motion;
 if (m.edit && m.edit.clip === id) {
  m.edit = null;
  state.rt.animator.stop();
 } else {
  assert(own(state.spec.animations,id),'動きが見つかりません');
  stopMotion();
  m.edit = {clip:id,frame:0,part:state.sel.part || Object.keys(state.spec.parts)[0] || null};
  state.rt.animator.seek(id,0,true);
 }
 renderPanel();
}

function editInfo(s=state.spec) {
 const ed = state.motion.edit;
 assert(ed && own(s.animations,ed.clip),'直す動きを選んでください');
 return {ed,a:s.animations[ed.clip],f:s.animations[ed.clip].frames[ed.frame]};
}

function stepFrame(dir) {
 const {ed,a} = editInfo();
 ed.frame = (ed.frame+dir+a.frames.length) % a.frames.length;
 state.rt.animator.seek(ed.clip,ed.frame,true);
 renderPanel();
}

function addFrame(dup) {
 const {ed} = editInfo();
 const i = ed.frame;
 const next = snapshot();
 const a = next.animations[ed.clip];
 assert(a.frames.length < LIMIT.frames,'コマは'+LIMIT.frames+'個までです');

 a.frames.splice(i+1,0,dup ? clone(a.frames[i]) : {});
 (a.events || []).forEach(ev => {
  if (ev[0] > i) ev[0]++;
 });

 ed.frame = i+1;
 try {
  commit(next);
 } catch (e) {
  ed.frame = i;
  throw e;
 }
}

function deleteFrame() {
 const {ed} = editInfo();
 const i = ed.frame;
 const next = snapshot();
 const a = next.animations[ed.clip];
 assert(a.frames.length > 1,'コマは最低1つ必要です');

 a.frames.splice(i,1);
 if (a.events) {
  a.events = a.events.filter(ev => ev[0] !== i);
  a.events.forEach(ev => {
   if (ev[0] > i) ev[0]--;
  });
  if (!a.events.length) delete a.events;
 }
 commit(next);
}

// 編集中のコマの、選んだ部品の指定を1項目だけ変える（基本と同じ値は書かない）
function setFramePart(key,value) {
 const {ed} = editInfo();
 assert(ed.part && own(state.spec.parts,ed.part),'部品を選んでください');

 mutate(s => {
  const f = s.animations[ed.clip].frames[ed.frame];
  f.parts = f.parts || {};
  const d = f.parts[ed.part] = f.parts[ed.part] || {};

  if (value === undefined) delete d[key];
  else d[key] = value;

  if (!Object.keys(d).length) delete f.parts[ed.part];
  if (!Object.keys(f.parts).length) delete f.parts;
 });
}

function nudgeFramePart(dir) {
 const {ed,f} = editInfo();
 assert(ed.part,'部品を選んでください');
 const cur = (f.parts && f.parts[ed.part] && f.parts[ed.part].offset || [0,0]).slice();
 cur[dir[0] === 'x' ? 0 : 1] += dir[1] === '+' ? 1 : -1;
 setFramePart('offset',cur[0] === 0 && cur[1] === 0 ? undefined : cur);
}

function resetFramePart() {
 const {ed} = editInfo();
 mutate(s => {
  const f = s.animations[ed.clip].frames[ed.frame];
  if (f.parts) {
   delete f.parts[ed.part];
   if (!Object.keys(f.parts).length) delete f.parts;
  }
 });
}

function setFrameEvent(value) {
 const {ed} = editInfo();
 const name = String(value).trim();
 assert(!name || validId(name),'合図の名前は英字で始まる英数字で入力してください（例: hit）');

 mutate(s => {
  const a = s.animations[ed.clip];
  a.events = (a.events || []).filter(ev => ev[0] !== ed.frame);
  if (name) a.events.push([ed.frame,name]);
  a.events.sort((x,y) => x[0]-y[0]);
  if (!a.events.length) delete a.events;
 });
}

function newClip() {
 askText('新しい動きを手で作る','動きID（英字で始まる英数字。例: wave）','motion',value => {
  const id = String(value).trim();
  assert(validId(id),'動きIDは英字で始まる英数字・_・-で入力してください');
  assert(!own(state.spec.animations,id),'同じIDの動きがすでにあります');
  assert(Object.keys(state.spec.animations).length < LIMIT.animations,'動きは'+LIMIT.animations+'個までです');

  stopMotion();
  state.motion.edit = {clip:id,frame:0,part:state.sel.part || Object.keys(state.spec.parts)[0] || null};
  try {
   mutate(s => {
    s.animations[id] = {name:id,fps:8,loop:true,frames:[{},{}]};
   });
  } catch (e) {
   state.motion.edit = null;
   throw e;
  }
 });
}

function startTry() {
 const m = state.motion;
 m.edit = null;
 m.playing = null;
 if (!m.trying) {
  m.trying = true;
  state.rt.controller.reset();
 }
 state.rt.controller.setSpeed(m.walk ? 0 : m.trySpeed);
}

function tryAction(id) {
 startTry();
 const c = state.rt.controller;
 if (!c.action(id)) {
  const label = (STANDARD.find(x => x[0] === id) || [])[1] || id;
  toast(c.dead
   ? '倒れています。「起き上がる」を押してください'
   : '「'+label+'」の動き（'+id+'）がまだありません。「つくる」タブで追加できます');
 }
}

function startWalk() {
 stopMotion();
 startTry();
 state.motion.walk = true;
 state.stick = {x:0,id:null};
 state.keys = {};
 buildWalkUI();
}

function buildWalkUI() {
 $('walkUI')?.remove();
 const clips = state.spec.animations;
 const ids = ['jump','attack'].filter(id => own(clips,id));

 const ui = document.createElement('div');
 ui.id = 'walkUI';
 ui.innerHTML = '<div id="walkStick" aria-label="移動スティック"><div id="walkKnob"></div></div>'
  + '<div id="walkActs">'
  + ids.map(id => '<button data-try="'+id+'">'+esc(STANDARD.find(x => x[0] === id)[1])+'</button>').join('')
  + (own(clips,'die') ? button('tryReset','起き上がる') : '')
  + button('walkStop','終了')
  + '</div>';
 $('viewport').appendChild(ui);

 const stick = $('walkStick');
 const set = e => {
  const rect = stick.getBoundingClientRect();
  const x = Math.max(-1,Math.min(1,(e.clientX-rect.left-rect.width/2)/(rect.width/2)));
  const y = isTopdown() ? Math.max(-1,Math.min(1,(e.clientY-rect.top-rect.height/2)/(rect.height/2))) : 0;
  state.stick.x = x;
  state.stick.y = y;
  $('walkKnob').style.transform = 'translate('+x*40+'px,'+y*40+'px)';
 };
 const end = e => {
  if (e.pointerId !== state.stick.id) return;
  state.stick = {x:0,id:null};
  $('walkKnob').style.transform = '';
 };

 stick.addEventListener('pointerdown',e => {
  e.preventDefault();
  state.stick.id = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  set(e);
 });
 stick.addEventListener('pointermove',e => {
  if (e.pointerId === state.stick.id) set(e);
 });
 stick.addEventListener('pointerup',end);
 stick.addEventListener('pointercancel',end);
}

function updateWalk(dt) {
 const m = state.motion;
 const k = state.keys;
 const c = state.rt.controller;

 if (c.dead) {
  c.setSpeed(0);
  return;
 }

 const top = isTopdown();
 let x = state.stick.x;
 let y = top ? (state.stick.y || 0) : 0;
 if (k.a || k.arrowleft) x -= 1;
 if (k.d || k.arrowright) x += 1;
 if (top) {
  if (k.w || k.arrowup) y -= 1;
  if (k.s || k.arrowdown) y += 1;
 }
 x = Math.max(-1,Math.min(1,x));
 y = Math.max(-1,Math.min(1,y));

 const len = Math.hypot(x,y);
 if (len > 1) {
  x /= len;
  y /= len;
 }

 const mag = Math.min(1,Math.hypot(x,y));
 c.setSpeed(mag*5);
 if (mag < .05) return;

 // 全方位は、入力の大きいほうの軸で向きを決める
 if (top) m.dir = Math.abs(x) >= Math.abs(y) ? (x < 0 ? 'left' : 'right') : (y < 0 ? 'up' : 'down');
 else m.facing = x < 0 ? 'left' : 'right';
 m.x += x*5*8*dt;
 if (top) m.y += y*5*8*dt;
}

// ============================================================
// 11. 修正データ（SPRITE_PATCH_V1）
// ============================================================
function applyPatch(source,patch) {
 guardTree(patch);
 assert(
  obj(patch) && patch.format === 'SPRITE_PATCH_V1' && Array.isArray(patch.operations),
  'SPRITE_PATCH_V1 と operations が必要です'
 );
 assert(patch.operations.length > 0 && patch.operations.length <= 500,'操作の数は1〜500です');

 const next = clone(source);

 // directions が無いデータにも /directions/向き を追加できるようにする（空のままなら最後に外す）
 if (!own(next,'directions')) next.directions = {};

 patch.operations.forEach((op,i) => {
  assert(
   obj(op) && ['add','replace','remove'].includes(op.op),
   '修正データの'+(i+1)+'番目の操作の種類（op）が正しくありません。add・replace・remove のどれかにするよう、AIに頼み直してください'
  );
  assert(
   typeof op.path === 'string' && op.path.startsWith('/') && !/~(?![01])/.test(op.path),
   'AIの回答で、変更する場所の書き方（path）が正しくありません。AIに「pathは / で始まる形で書いて」と頼み直してください'
  );

  const keys = op.path.slice(1).split('/').map(k => k.replace(/~1/g,'/').replace(/~0/g,'~'));

  assert(
   ['meta','settings','palette','parts','anchors','animations','directions'].includes(keys[0]),
   'AIの回答で、変更できない場所を変えようとしています（'+op.path+'）。変更できるのは meta・settings・palette・parts・anchors・animations・directions だけです'
  );
  assert(keys.every(k => k !== '' && !['__proto__','prototype','constructor'].includes(k)),'path に使えないキーがあります');

  let parent = next;
  for (const k of keys.slice(0,-1)) {
   assert(
    parent && typeof parent === 'object' && own(parent,k),
    'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のデータに合わせて直して」と頼んでください'
   );
   parent = parent[k];
  }
  assert(parent && typeof parent === 'object','変更する場所の親がObjectでも配列でもありません（'+op.path+'）');

  const key = keys[keys.length-1];
  if (op.op !== 'remove') assert(own(op,'value'),'修正データに value がありません（'+op.path+'）');

  if (Array.isArray(parent)) {
   assert(/^(0|[1-9][0-9]*)$/.test(key) || key === '-' && op.op === 'add','配列の番号が正しくありません（'+op.path+'）');
   const index = key === '-' ? parent.length : Number(key);
   assert(index >= 0 && index < (op.op === 'add' ? parent.length+1 : parent.length),'配列の番号が範囲外です（'+op.path+'）');

   if (op.op === 'add') parent.splice(index,0,clone(op.value));
   else if (op.op === 'remove') parent.splice(index,1);
   else parent[index] = clone(op.value);
  } else {
   if (op.op === 'add') {
    assert(!own(parent,key),'AIの回答で、すでにある項目を「追加（add）」しようとしています（'+op.path+'）。AIに「既存の項目は replace で書き直して」と頼んでください');
   } else {
    assert(own(parent,key),'AIの回答で、存在しない場所を変更しようとしています（'+op.path+'）。AIに「今のデータに合わせて直して」と頼んでください');
   }
   if (op.op === 'remove') delete parent[key];
   else parent[key] = clone(op.value);
  }
 });

 if (obj(next.directions) && !Object.keys(next.directions).length) delete next.directions;

 const normalized = normalizeSpec(next);
 validateSpec(normalized);
 return normalized;
}

function isAnimOp(op) {
 return obj(op) && ['add','replace'].includes(op.op)
  && typeof op.path === 'string' && /^\/animations\/[^/]+$/.test(op.path);
}

function opId(op) {
 return String(op.path).split('/')[2];
}

// ============================================================
// 12. AIの回答の読み込み・リカバリー・確認バー
// ============================================================
function applyAIText(text) {
 try {
  const message = applyAITextCore(text);
  clearRecovery();
  return message;
 } catch (e) {
  offerRecovery(text,e);
  throw e;
 }
}

function applyAITextCore(text) {
 const data = parseAIJSON(text);
 assert(obj(data),'AIの回答がデータの形になっていません');

 const base = {spec:snapshot(),projectId:state.projectId,dirty:state.dirty};

 if (data.format === 'SPRITE_PATCH_V1' || Array.isArray(data.operations)) {
  const patch = {...data,format:'SPRITE_PATCH_V1'};
  const ops = patch.operations;
  let next = null;
  let failed = [];

  if (Array.isArray(ops) && ops.length && ops.every(isAnimOp)) {
   // 動きだけの修正データは、add と replace の取り違えを読み替える
   const present = new Set(Object.keys(state.spec.animations));
   patch.operations = ops.map(op => {
    const id = opId(op);
    const fixed = {...op,op:present.has(id) ? 'replace' : 'add'};
    present.add(id);
    return fixed;
   });

   try {
    next = applyPatch(state.spec,patch);
   } catch (e) {
    // 全体で失敗したら、動きごとに適用して成功した分だけ反映する
    let cur = state.spec;
    let ok = 0;
    for (const op of patch.operations) {
     try {
      cur = applyPatch(cur,{format:'SPRITE_PATCH_V1',operations:[op]});
      ok++;
     } catch (err) {
      failed.push({id:opId(op),reason:err.message});
     }
    }
    assert(ok,'読み込めた動きがありませんでした。\n'+failed.map(f => f.id+': '+f.reason).join('\n'));
    next = cur;
   }
  } else {
   next = applyPatch(state.spec,patch);
  }

  commit(next);

  const failedIds = failed.map(f => f.id);
  const ids = [...new Set((patch.operations || []).filter(isAnimOp).map(opId))]
   .filter(id => own(next.animations,id) && !failedIds.includes(id));

  if (ids.length) {
   markQueueLoaded(ids);
   startReview(ids,data.plan,failed,base);
   return failed.length
    ? ids.length+'件の動きを読み込みました（'+failed.length+'件は読み込めませんでした。確認バーを見てください）'
    : '動きを読み込みました。確認バーで確かめてください';
  }

  state.tab = 'repair';
  renderPanel();
  return '修正を反映しました（↶で取り消せます）';
 }

 assert(
  data.format === 'SPRITE_SPEC_V1',
  'AIの回答が「新しいキャラ」でも「修正データ」でもありません。AIの回答全体をコピーし直してください'
 );

 const s = normalizeSpec(data);
 validateSpec(s);

 resetMotionUI();
 commit(s);

 // 完全なデータは新しい未保存のキャラとして扱う（保存済みのキャラは上書きしない）
 state.projectId = null;
 state.restoredTitle = '';
 state.ai.queueFor = null;
 state.dirty = true;
 state.tab = 'repair';
 writeDraft();

 const ids = Object.keys(s.animations);
 if (ids.length) {
  startReview(ids,data.plan,[],base);
  return '新しいキャラを読み込みました（未保存です）。動きは確認バーで確かめてください';
 }

 renderPanel();
 return '新しいキャラを読み込みました（未保存です。↶で取り消せます）';
}

function recoveryButton() {
 return button('recoverCopy','🛟 リカバリー依頼文をコピー','primary');
}

function clearRecovery() {
 state.ai.recovery = null;
 $('recoverBar')?.remove();
}

function offerRecovery(text,e) {
 try {
  const raw = String(text ?? '');
  if (!raw.includes('{')) return;

  state.ai.recovery = {prompt:createRecoveryPrompt(raw,String(e && e.message ? e.message : e).slice(0,2000))};

  $('recoverBar')?.remove();
  const bar = document.createElement('div');
  bar.id = 'recoverBar';
  bar.setAttribute('role','alert');
  bar.innerHTML = recoveryButton()+'<button data-action="recoverClose" aria-label="リカバリーの案内を閉じる">✕</button>';
  document.body.appendChild(bar);
 } catch (_) {}
}

function createRecoveryPrompt(raw,message) {
 const max = 120000;
 const cut = raw.length > max;
 const isPatch = /SPRITE_PATCH_V1|"operations"\s*:/.test(raw);

 return 'あなたはゲーム用2Dドット絵キャラクターデータの修復担当です。'
  + '下の「読み込めなかったデータ」は、キャラ作成アプリで読み込みエラーになりました。エラーを解消した正しいデータを出力し直してください。\n'
  + '\nアプリのエラーメッセージ:\n'+message+'\n'
  + '\n修復のルール:\n'
  + '- 元のデータの内容（絵・色・動き・ID・名前）はできるだけ保ち、エラーの原因と、同じ種類の誤りを直す。\n'
  + '- 直した後、下の契約に照らして全体を見直し、ほかの違反（必須項目の欠け、存在しない部品や絵の参照、palette にない記号、上限超え、JSONの書き方の誤り）も直す。\n'
  + '- データが途中で切れている場合は、切れた部分を補って完結させる。\n'
  + '- 出力は元と同じ種類のデータ（'+(isPatch ? 'SPRITE_PATCH_V1 の修正データ' : '完全な SPRITE_SPEC_V1')+'）を、省略せず全体で出力する。\n'
  + '- 出力はJSONのみのプレーンテキスト。Markdown・コードフェンス・見出し・説明文は禁止。先頭文字は{、末尾文字は}。\n'
  + '\n'+schemaGuide()+'\n'
  + (isPatch ? '\n'+patchGuide()+'\n\n修正データを適用する先の、現在のキャラ:\n'+partsSummary()+'\n' : '')
  + '\n読み込めなかったデータ'+(cut ? '（長いため先頭'+max+'文字まで）' : '')+':\n'
  + (cut ? raw.slice(0,max) : raw);
}

// 動きの自動チェック
function reviewClips(ids) {
 const s = state.spec;
 const out = {};

 for (const id of ids) {
  const a = s.animations[id];
  if (!a) continue;

  const list = [];
  const loop = a.loop !== false;
  const text = a.frames.map(f => JSON.stringify(f.parts || {}));

  if (a.frames.length < 2) list.push('コマが1つだけです（動いて見えません）');
  else if (text.every(t => t === text[0])) list.push('すべてのコマが同じ姿勢です');

  if (id === 'attack' && !(a.events || []).some(ev => ev[1] === 'hit')) list.push('攻撃の合図「hit」がありません');
  if (id === 'jump' && !(a.events || []).some(ev => ev[1] === 'land')) list.push('着地の合図「land」がありません');

  if (loop && a.frames.length > 1) {
   const first = a.frames[0].parts || {};
   const last = a.frames[a.frames.length-1].parts || {};
   const far = [...new Set([...Object.keys(first),...Object.keys(last)])].filter(pid => {
    const p = first[pid] && first[pid].offset || [0,0];
    const q = last[pid] && last[pid].offset || [0,0];
    return Math.abs(p[0]-q[0]) > 4 || Math.abs(p[1]-q[1]) > 4;
   });
   if (far.length) list.push('くり返しの最後と最初で、部品が大きく飛びます: '+far.join('、'));
  }

  const loose = Object.keys(s.parts).filter(pid => {
   const p = s.parts[pid];
   return p.effect === true && !a.frames.some(f => f.parts && f.parts[pid]) && (a.show || []).includes(pid) === false;
  });
  if (!loop && /attack|fire|magic|skill/.test(id) && loose.length && !Object.keys(s.parts).some(pid =>
   s.parts[pid].effect === true && (a.frames.some(f => f.parts && f.parts[pid]) || (a.show || []).includes(pid))
  )) {
   list.push('効果部品（'+loose.join('、')+'）がありますが、この動きでは使われていません');
  }

  // 全方位マップ: 向き付きの動きは、3方向そろっているかを確かめる
  const dm = /^(.+)_(down|up|side)$/.exec(id);
  if (isTopdown(s) && dm) {
   const miss = ['down','up','side'].filter(k => k !== dm[2] && !own(s.animations,dm[1]+'_'+k));
   if (miss.length) {
    list.push(
     miss.map(k => ({down:'下向き',up:'上向き',side:'横向き'}[k])).join('・')
     +'の動きがありません（'+miss.map(k => dm[1]+'_'+k).join('・')+'）'
    );
   }
  }

  out[id] = list;
 }

 return out;
}

function startReview(ids,plan,failed=[],base=null) {
 const m = state.motion;
 const plans = {};

 if (obj(plan)) {
  for (const [k,v] of Object.entries(plan)) {
   if (typeof v === 'string') plans[k] = v.slice(0,1000);
  }
 }

 m.review = {
  ids,
  plan: typeof plan === 'string' ? plan.slice(0,2000) : '',
  plans,
  failed: failed.map(f => ({id:f.id,reason:String(f.reason).slice(0,500)})),
  report: reviewClips(ids),
  base
 };

 m.view = 'view';
 state.tab = 'motion';
 m.playing = null;
 playMotion(ids[0]);
}

function reviewBar() {
 const m = state.motion;
 const rv = m.review;
 if (!rv) return '';

 const anims = state.spec.animations;
 const ids = rv.ids.filter(id => own(anims,id));
 if (!ids.length) {
  m.review = null;
  return '';
 }

 const hasIssue = ids.some(id => (rv.report[id] || []).length) || rv.failed.length > 0;

 return `
  <div class="card review">
   <h3>AIの動きを確認</h3>
   <p class="hint">自動チェックは、コマの数・同じ姿勢の連続・合図・くり返しのつなぎ目を確認します。見た目の自然さは、再生して確かめてください。</p>
   ${rv.plan ? `<p class="hint"><b>AIの計画:</b> ${esc(rv.plan)}</p>` : ''}
   ${ids.map(id => `
    <div class="partrow">
     <button class="pick ${m.playing === id ? 'selected' : ''}" data-play="${esc(id)}">${m.playing === id ? '■' : '▶'} ${esc(anims[id].name || id)}<small>${esc(id)}</small></button>
    </div>
    ${rv.plans[id] ? `<p class="hint"><b>計画:</b> ${esc(rv.plans[id])}</p>` : ''}
    ${(rv.report[id] || []).length
     ? `<p class="error">${rv.report[id].map(esc).join('\n')}</p>`
     : '<p class="success">✓ 自動チェックでは問題を検出しませんでした</p>'}
   `).join('')}
   ${rv.failed.length ? `
    <h3>読み込めなかった動き</h3>
    <p class="error">${rv.failed.map(f => esc(f.id+': '+f.reason)).join('\n')}</p>
   ` : ''}
   <div class="row">
    ${button('reviewAccept','採用','primary')}

    ${hasIssue ? button('reviewAsk','修正依頼文をコピー') : ''}
   </div>

function schemaGuide() {
 return [
  'SpriteSpec契約: format="SPRITE_SPEC_V1"。ゲーム用の2Dドット絵キャラクターを「部品」と「コマ」で定義する。',
  'meta={name,id,version:1,description}。id は英字で始まる英数字・_・-（64文字以内）。',
  'settings={size:[幅,高さ],origin:"center-bottom",facing:"right"}。size は8〜64。キャラは右向きで描く。足元の中央が基準点。',
  'palette={"1文字の記号":"#rrggbb"}。記号は "." と空白以外の1文字。最大32色。絵の中の "." は透明。',
  'parts={"部品ID":{name,z,position:[x,y],variants:{"base":["行の文字列",...],"絵ID":[...]},effect,visible}}。',
  '- 絵（variants）は「1文字=1ピクセル」の行の配列。各文字は palette の記号か "."。base は必須。1つの部品の絵は16個まで。絵ごとに大きさが違ってよい（1〜64行、1行は64文字まで）。同じ絵の中では、すべての行を同じ文字数にそろえる。',
  '- position は絵の左上の位置。キャラの左上が原点、右が+X、下が+Y の整数。z が大きい部品ほど手前に描く。',
  '- effect:true の部品（斬撃・炎・光など）は、その部品を使う動きの再生中だけ表示される。visible:false は常に隠す。どちらも省略できる。',
  'anchors={"取付点ID":{name,parent:部品IDかnull,position:[x,y]}}。parent があれば、その部品の絵の左上からの位置。',
  'animations={"動きID":{name,fps,loop,frames:[{parts:{"部品ID":{offset:[dx,dy],variant:"絵ID",flipX:true/false,visible:true/false}},hold:コマ数}],events:[[コマ番号,"合図名"]],show:["効果部品ID"]}}。',
  '- fps は1〜30。frames は1〜24コマ。コマの parts に書かない部品は基本の状態（offset [0,0]・variant "base"・表示）になる。',
  '- hold は、そのコマを何コマ分表示するか（省略は1）。offset は整数ピクセルのずれ。回転は使えない。',
  '- 大きく形が変わる姿勢（腕を上げる・剣を振り下ろすなど）は、位置のずれではなく絵の差し替え（variant）で表す。',
  '- events のコマ番号は0始まり。合図名は英字で始まる英数字。show は、動かさずに表示だけする効果部品。',
  'settings.view は "side"（横スクロール。省略可・既定）か "topdown"（ドラクエやFFのような全方位マップ。4方向）。',
  'directions（任意）={"down":{"parts":{"部品ID":{offset,variant,flipX,visible,z}}},"up":{...},"side":{...}}。向きごとの基本姿勢。キーは down・up・side だけ。左向きは side の左右反転で表すので描かない。項目はすべて省略できる。',
  '- 姿勢の合成の順序: 基本（offset [0,0]・variant "base"・表示・部品の z）→ directions の向きの指定 → コマの指定。offset は足し算、variant・flipX・visible・z は後のもので上書き。z は描画順（大きいほど手前）で、向きごとに変えられる。',
  '- 向き別の動き: 動きIDの後ろに _down・_up・_side を付ける（例: walk_down・walk_up・walk_side）。その向きのとき、向き付きの動きがあればそれを、なければ向きなしの動き（walk）を使う。向きなしの動き（idle など）は、全方向で使えるよう、ずれ（offset）だけで作る。',
  '上限: 部品40、動き50、色32。'
 ].join('\n');
}

function patchGuide() {
 return [
  '修正データの形式: {"format":"SPRITE_PATCH_V1","plan":"変更の説明","operations":[{"op":"add|replace|remove","path":"/parts/部品ID/position/0","value":12}]}',
  '- path は / で始まるJSON Pointer。最上位は meta・settings・palette・parts・anchors・animations・directions のみ。',
  '- add は存在しないキーだけ、replace・remove は既存のキーだけに使う。配列は0始まりの番号、add のみ末尾「-」が使える。',
  '- 絵を直すときは {"op":"replace","path":"/parts/部品ID/variants/絵ID","value":[行の文字列,...]} のように、絵を丸ごと置き換える。',
  '- 部品や絵を削除・ID変更するときは、それを使っている animations のコマも合わせて直す。'
 ].join('\n');
}

function partsSummary() {
 const s = state.spec;
 const parts = Object.entries(s.parts).map(([id,p]) =>
  '- '+id+' | 名前:'+p.name+' | z:'+p.z+' | 位置:['+p.position.join(',')+'] | 絵: '
  + Object.entries(p.variants).map(([vid,rows]) =>
   vid+'（'+Math.max(1,...rows.map(r => r.length))+'×'+rows.length+'）'
  ).join(', ')
  + (p.effect === true ? ' | 効果部品' : '')
 ).join('\n') || 'なし';

 const anims = Object.entries(s.animations)
  .map(([id,a]) => id+'（'+a.frames.length+'コマ）').join(', ') || 'なし';

 return 'キャラ: '+s.meta.name+'（'+s.meta.id+'） 大きさ '+s.settings.size.join('×')+'\n'
  + '色の記号: '+Object.keys(s.palette).join(' ')+'\n'
  + '見え方（settings.view）: '+(s.settings.view === 'topdown' ? 'topdown（全方位マップ・4方向）' : 'side（横スクロール）')
  + ' / 基本姿勢（directions）のある向き: '+(Object.keys(s.directions || {}).join(', ') || 'なし')+'\n'
  + '部品一覧:\n'+parts+'\n'
  + '取付点: '+(Object.keys(s.anchors).join(', ') || 'なし')+'\n'
  + '既存の動きID: '+anims;
}

function itemId(it) {
 return it.id === '*' ? String(it.custom || '').trim() : it.id;
}

function newQueueItem(id='run') {
 const std = STANDARD.find(x => x[0] === id);
 return {
  id: std ? id : '*',
  custom: '',
  name: std ? std[1] : '',
  frames: std ? std[4] : 4,
  fps: std ? std[3] : 8,
  loop: std ? std[2] : false,
  note: '',
  useScript: false,
  script: '',
  loaded: false
 };
}

function ensureQueue() {
 const a = state.ai;
 const key = state.spec.meta.id;
 if (a.queueFor === key && a.queue.length) return;
 a.queueFor = key;
 const first = STANDARD.map(x => x[0]).find(id => !own(state.spec.animations,id)) || 'emote';
 a.queue = [newQueueItem(first)];
 a.qi = 0;
 a.batchNote = '';
}

function markQueueLoaded(ids) {
 state.ai.queue.forEach(it => {
  if (ids.includes(itemId(it))) it.loaded = true;
 });
}

 const id = itemId(it);
 const label = (i+1)+'件目';
 assert(validId(id),label+': 動きIDは英字で始まる英数字・_・-で入力してください');

 const frames = Number(it.frames);
 const fps = Number(it.fps);
 assert(Number.isInteger(frames) && frames >= 1 && frames <= LIMIT.frames,label+': コマ数は1〜'+LIMIT.frames+'で入力してください');
 assert(Number.isFinite(fps) && fps >= 1 && fps <= 30,label+': fps は1〜30で入力してください');

 const std = STANDARD.find(x => x[0] === id);
 const note = String(it.note || '').trim();
 const script = it.useScript ? String(it.script || '').trim() : '';
 const name = String(it.name || '').trim() || (std ? std[1] : id);

 assert(script || note || std || String(it.name || '').trim(),label+': 台本を使わないときは、「AIへの指示」か表示名を入力してください');

 return '\n■ '+label+': 動きID "'+id+'"（'+name+'） / コマ数の目安 '+frames+' / fps '+fps+' / loop:'+!!it.loop
  + ' / op は "'+(own(state.spec.animations,id) ? 'replace' : 'add')+'"\n'
  + (note ? 'AIへの指示（できるだけ忠実に反映する）:\n'+note.slice(0,2000)+'\n' : '')
  + (script
   ? '台本（1行が1コマの姿勢。この流れどおりにコマを作る）:\n'+script.slice(0,2000)+'\n'
   : '台本: なし。動きIDの意味と上の指示から、各コマの姿勢をあなたが設計し、"plan" に書く。\n')
  + (id === 'attack' ? '- events に "hit"（当たるコマ）を入れる。\n' : '')
  + (id === 'jump' ? '- events に "land"（着地のコマ）を入れる。\n' : '')
  + (id === 'die' ? '- 最後のコマを倒れた姿勢にして、その姿勢で止まるようにする（loop:false）。\n' : '');
}

function createBatchPrompt() {
 ensureQueue();
 const q = state.ai.queue;
 const ids = q.map(itemId);
 assert(new Set(ids).size === ids.length,'注文リストで動きIDが重複しています。どちらかのIDを変えてください');

 const note = String(state.ai.batchNote || '').trim().slice(0,2000);

 return motionPromptBase(
  '\n今回作る動きは次の'+q.length+'件です。それぞれの注文どおりに作ってください。注文にない動きは作らない。\n'
  + q.map(orderSection).join('')
  + (note ? '\n全体への指示（すべての動きに共通）:\n'+note+'\n' : '')
  + (q.length > 1
   ? '\n"plan" は {"動きID":"その動きの計画"} のオブジェクトで、全'+q.length+'件について書く。'
   : '')
  + '\nすべてを1つの SPRITE_PATCH_V1 にまとめて出力すること。'
 );
}

function createReviewFixPrompt() {
 const rv = state.motion.review;
 assert(rv,'確認中の動きがありません');

 const anims = state.spec.animations;
 const bad = rv.ids.filter(id => own(anims,id) && (rv.report[id] || []).length);
 assert(bad.length || rv.failed.length,'直す必要のある動きはありません');

 return motionPromptBase(
  (bad.length
   ? '\n次の動きに、アプリの自動チェックで問題が見つかりました。問題を直した動きを返してください。\n'
    + bad.map(id => '\n動きID: '+id+'\n問題:\n'+rv.report[id].map(x => '- '+x).join('\n')+'\n現在の中身:\n'+JSON.stringify(anims[id])).join('\n')
   : '')
  + (rv.failed.length
   ? '\n\n次の動きは、データの誤りで読み込めませんでした。理由を直して作り直してください。\n'

   : '')
  + '\n\n各動きを {"op":"replace","path":"/animations/動きID","value":{...}} で返すこと（まだ無い動きは "add"）。IDは変えない。ほかの動きは変更しない。'

}

// ============================================================
// 14. 保存（ライブラリ・一時保存・ファイル）
// ============================================================
function readStore() {
 try {
  const v = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (obj(v) && Array.isArray(v.projects)) return v;
 } catch (_) {}
 return {projects:[],last:null};
}

function writeStore(data) {
 try {
  localStorage.setItem(STORE,JSON.stringify(data));
 } catch (_) {
  throw Error('保存領域が足りないため保存できませんでした。使わないキャラを削除するか、「ファイルに保存」で控えを取ってください');
 }
 state.projects = data.projects;
}

function writeDraft() {
 if (!state.spec) return;
 try {
  localStorage.setItem(DRAFT,JSON.stringify({projectId:state.projectId,spec:state.spec,dirty:state.dirty}));
 } catch (_) {}
}

function scheduleDraft() {
 clearTimeout(state.draftTimer);
 state.draftTimer = setTimeout(writeDraft,600);
}

function makeThumb(spec) {
 try {
  const sprite = R.buildSprite(spec);
  const c = document.createElement('canvas');
  c.width = 96;
  c.height = 96;
  const g = c.getContext('2d');
  const s = Math.max(1,Math.floor(96/Math.max(sprite.size[0],sprite.size[1])));
  g.fillStyle = '#1c2633';
  g.fillRect(0,0,96,96);
  R.drawSprite(g,sprite,Math.floor((96-sprite.size[0]*s)/2),Math.floor((96-sprite.size[1]*s)/2),{scale:s});
  return c.toDataURL('image/png');
 } catch (_) {
  return null;
 }
}

function saveProject(asNew=false) {
 const data = readStore();
 const id = asNew ? uid('project') : state.projectId || uid('project');
 const record = {
  projectId: id,
  name: state.spec.meta.name,
  spec: snapshot(),
  thumb: makeThumb(state.spec),
  updatedAt: new Date().toISOString()
 };

 const i = data.projects.findIndex(p => p.projectId === id);
 if (i < 0) data.projects.push(record);
 else data.projects[i] = record;
 data.last = id;

 writeStore(data);
 state.projectId = id;
 state.dirty = false;
 writeDraft();
 renderPanel();
 toast('「'+record.name+'」をライブラリに保存しました。大切なキャラは「ファイルに保存」でも控えを取ってください',3600);
}

function loadProject(id) {
 const data = readStore();
 const p = data.projects.find(x => x.projectId === id);
 assert(p,'キャラが見つかりません');

 const spec = normalizeSpec(p.spec);
 replaceProject(spec,id,false);
 data.last = id;
 writeStore(data);
 state.tab = 'repair';
 renderPanel();
 toast('「'+spec.meta.name+'」を開きました。「なおす」「動かす」で続きをつくれます',3200);
}

function deleteProject(id) {
 const data = readStore();
 data.projects = data.projects.filter(p => p.projectId !== id);
 if (data.last === id) data.last = null;
 writeStore(data);

 if (state.projectId === id) {
  state.projectId = null;
  state.dirty = true;
  writeDraft();
 }
 renderPanel();
 toast('ライブラリから削除しました');
}

function renameProject(id) {
 const p = state.projects.find(x => x.projectId === id);
 assert(p,'キャラが見つかりません');

 askText('名前を変更','新しい名前',p.name,value => {
  const name = String(value).trim();
  assert(name && name.length <= 100,'名前は1〜100文字で入力してください');

  const data = readStore();
  const rec = data.projects.find(x => x.projectId === id);
  assert(rec,'キャラが見つかりません');
  rec.name = name;
  rec.spec.meta.name = name;
  rec.updatedAt = new Date().toISOString();
  writeStore(data);

  if (state.projectId === id && state.spec.meta.name !== name) {
   const wasDirty = state.dirty;
   mutate(s => {
    s.meta.name = name;
   });
   state.dirty = wasDirty;
   writeDraft();
  }
  renderPanel();
  toast('名前を「'+name+'」に変更しました');
 });
}

function duplicateProject(id) {
 const data = readStore();
 const src = data.projects.find(x => x.projectId === id);
 assert(src,'キャラが見つかりません');

 const spec = normalizeSpec(src.spec);
 const name = String(src.name).slice(0,95)+'（コピー）';
 spec.meta.name = name;
 spec.meta.id = (validId(spec.meta.id) ? spec.meta.id : 'sprite').slice(0,40)+'_'+Date.now().toString(36);
 validateSpec(spec);

 data.projects.push({projectId:uid('project'),name,spec,thumb:src.thumb || null,updatedAt:new Date().toISOString()});
 writeStore(data);
 renderPanel();
 toast('「'+name+'」を作りました');
}

function downloadText(text,name,type) {
 const url = URL.createObjectURL(new Blob([text],{type}));
 const a = document.createElement('a');
 a.href = url;
 a.download = name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(() => URL.revokeObjectURL(url),1000);
}

function fileBase() {
 return String(state.spec.meta.name || 'sprite').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim().slice(0,80) || 'sprite';
}

function exportLibrary() {
 const data = readStore();
 assert(data.projects.length,'書き出すキャラがありません');
 const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
 downloadText(
  JSON.stringify({format:'MODELSTUDIO2D_LIBRARY_V1',exportedAt:new Date().toISOString(),projects:data.projects}),
  'modelstudio2d_library_'+stamp+'.json','application/json'
 );
 toast(data.projects.length+'件のキャラを書き出しました');
}

function importLibrary(text) {
 const src = parseJSON(text,20000000);
 assert(
  obj(src) && src.format === 'MODELSTUDIO2D_LIBRARY_V1' && Array.isArray(src.projects),
  'ライブラリの書き出しファイル（MODELSTUDIO2D_LIBRARY_V1）を選んでください'
 );

 const data = readStore();
 let added = 0;
 let failed = 0;

 for (const p of src.projects) {
  try {
   assert(obj(p),'形式が不正です');
   const spec = normalizeSpec(p.spec);
   validateSpec(spec);
   data.projects.push({
    projectId: uid('project'),
    name: typeof p.name === 'string' && p.name.trim() ? p.name.trim().slice(0,100) : spec.meta.name,
    spec,
    thumb: makeThumb(spec),
    updatedAt: new Date().toISOString()
   });
   added++;
  } catch (_) {
   failed++;
  }
 }

 assert(added,'読み込めるキャラがありませんでした（失敗 '+failed+'件）');
 writeStore(data);
 renderPanel();
 toast(added+'件を追加しました'+(failed ? '（'+failed+'件は読み込めませんでした）' : ''),3200);
}

function restore() {
 state.projects = readStore().projects;
 let chosen = null;

 try {
  const raw = localStorage.getItem(DRAFT);
  if (raw) {
   const d = parseJSON(raw,LIMIT.bytes+4096);
   const spec = normalizeSpec(d.spec);
   validateSpec(spec);
   const saved = state.projects.find(p => p.projectId === d.projectId);
   chosen = {spec,projectId:saved ? d.projectId : null,dirty:!!d.dirty || !saved};
  }
 } catch (_) {}

 if (!chosen) {
  const st = readStore();
  const p = st.projects.find(x => x.projectId === st.last);
  if (p) {
   try {
    const spec = normalizeSpec(p.spec);
    validateSpec(spec);
    chosen = {spec,projectId:p.projectId,dirty:false};
   } catch (_) {}
  }
 }

 state.restoredTitle = chosen ? chosen.spec.meta.name : '';
 if (!chosen) chosen = {spec:warriorSpec(),projectId:null,dirty:true};

 state.spec = chosen.spec;
 state.projectId = chosen.projectId;
 state.dirty = chosen.dirty;
}

function replaceGuard(fn) {
 if (state.dirty) askConfirm('未保存の変更を置き換えますか？必要なら先に「保存」してください。',fn);
 else fn();
}
