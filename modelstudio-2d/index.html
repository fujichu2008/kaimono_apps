  ' ctx.fillRect(0,ground,W,H-ground);',
  ' hero.draw(ctx,x,ground,{scale});',
  '}',
  'requestAnimationFrame(loop);'
 ].join('\n');

 // 全方位マップ用: 上下左右に歩かせる
 const demoTop = [
  'const SpriteRenderer = createSpriteRenderer();',
  'const hero = SpriteRenderer.createCharacter(SPRITE_DATA);',
  'const canvas = document.getElementById("game");',
  'const ctx = canvas.getContext("2d");',
  'let W = 0, H = 0, scale = 3, x = 0, y = 0;',
  'function resize(){ const d = Math.min(devicePixelRatio || 1,3); canvas.width = Math.round(innerWidth*d); canvas.height = Math.round(innerHeight*d); W = canvas.width; H = canvas.height; scale = Math.max(2,Math.floor(Math.min(W,H)/(SPRITE_DATA.settings.size[1]*5))); if (!x) { x = W/2; y = H*.6; } }',
  'addEventListener("resize",resize);',
  'resize();',
  'const keys = {};',
  'addEventListener("keydown",e => { keys[e.key.toLowerCase()] = true; });',
  'addEventListener("keyup",e => { keys[e.key.toLowerCase()] = false; });',
  'const stick = document.getElementById("stick");',
  'const knob = document.getElementById("knob");',
  'let sx = 0, sy = 0, sid = null;',
  'function setStick(e){ const r = stick.getBoundingClientRect(); sx = Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2))); sy = Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2))); knob.style.transform = "translate(" + sx*40 + "px," + sy*40 + "px)"; }',
  'function endStick(){ sid = null; sx = 0; sy = 0; knob.style.transform = ""; }',
  'stick.addEventListener("pointerdown",e => { sid = e.pointerId; stick.setPointerCapture(sid); setStick(e); });',
  'stick.addEventListener("pointermove",e => { if (e.pointerId === sid) setStick(e); });',
  'stick.addEventListener("pointerup",endStick);',
  'stick.addEventListener("pointercancel",endStick);',
  'addEventListener("blur",() => { for (const k in keys) keys[k] = false; endStick(); });',
  'document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click",() => { if (b.dataset.act === "reset") hero.reset(); else hero.action(b.dataset.act); }));',
  'document.querySelectorAll("[data-hold]").forEach(b => b.addEventListener("click",() => { hero.play(hero.current === b.dataset.hold ? null : b.dataset.hold); }));',
  'let last = 0;',
  'function loop(now){',
  ' requestAnimationFrame(loop);',
  ' const dt = Math.min(.1,(now-(last || now))/1000);',
  ' last = now;',
  ' let vx = sx, vy = sy;',
  ' if (keys.a || keys.arrowleft) vx -= 1;',
  ' if (keys.d || keys.arrowright) vx += 1;',
  ' if (keys.w || keys.arrowup) vy -= 1;',
  ' if (keys.s || keys.arrowdown) vy += 1;',
  ' const l = Math.hypot(vx,vy);',
  ' if (l > 1) { vx /= l; vy /= l; }',
  ' const down = hero.current === "die";',
  ' const mag = down ? 0 : Math.min(1,Math.hypot(vx,vy));',
  ' hero.setSpeed(mag*5);',
  ' if (mag > .05) {',
  '  hero.direction = Math.abs(vx) >= Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");',
  '  const sp = 5*8*scale*dt;',
  '  x = Math.max(20,Math.min(W-20,x+vx*sp));',
  '  y = Math.max(H*.15,Math.min(H-20,y+vy*sp));',
  ' }',
  ' hero.update(dt);',
  ' ctx.fillStyle = "#2b3a4a";',
  ' ctx.fillRect(0,0,W,H);',
  ' hero.draw(ctx,x,y,{scale});',
  '}',
  'requestAnimationFrame(loop);'
 ].join('\n');

 const demo = top ? demoTop : demoSide;

 return [
  '<!DOCTYPE html>',
  '<html lang="ja">',
  '<head>',
  '<meta charset="UTF-8">',
  '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">',
  '<title>'+esc(s.meta.name)+' - 動作確認</title>',
  '<style>',
  'html,body{margin:0;height:100%;overflow:hidden;background:#1c2633;font:14px system-ui,sans-serif;color:#edf4fc}',
  '#game{display:block;width:100%;height:100%;touch-action:none}',
  '#info{position:fixed;left:12px;right:12px;top:10px;text-shadow:0 1px 3px #000}',
  '#stick{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;touch-action:none}',
  '#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#63d9f5cc;pointer-events:none}',
  '#acts{position:fixed;right:16px;bottom:24px;display:flex;flex-direction:column;gap:8px}',
  '#acts button{min-width:96px;min-height:48px;border-radius:12px;border:1px solid #63d9f5;background:#175d75;color:#fff;font:inherit}',
  '</style>',
  '</head>',
  '<body>',
  '<canvas id="game"></canvas>',
  '<div id="info">'+esc(s.meta.name)+' · 左下のスティック（PCは '+(top ? 'W/A/S/D・矢印キー' : 'A/D・左右の矢印キー')+'）で移動</div>',
  '<div id="stick"><div id="knob"></div></div>',
  '<div id="acts">'+buttons+'</div>',
  '<script>',
  createSpriteRenderer.toString(),
  'const SPRITE_DATA = '+dataLiteral()+';',
  demo,
  '<\/script>',
  '</body>',
  '</html>'
 ].join('\n');
}

function button(action,text,cls='') {
 return `<button data-action="${action}" class="${cls}">${text}</button>`;
}

function field(label,attrs,value,type='text') {
 return `<label>${esc(label)}<input type="${type}" ${attrs} value="${esc(value)}"></label>`;
}

function options(items,current) {
 return items.map(([v,t]) => `<option value="${esc(v)}" ${v === current ? 'selected' : ''}>${esc(t)}</option>`).join('');
}

function selectField(label,attrs,items,value) {
 return `<label>${esc(label)}<select ${attrs}>${options(items,value)}</select></label>`;
}

 const a = state.ai;
 const it = a.queue[a.qi] || a.queue[0];

async function copyText(text,message='コピーしました') {
 try {
  assert(navigator.clipboard && window.isSecureContext,'fallback');
  await navigator.clipboard.writeText(text);
  if (message) toast(message);
  return true;
 } catch (_) {
  const t = document.createElement('textarea');
  let ok = false;
  t.value = text;
  t.style.cssText = 'position:fixed;left:0;top:0;opacity:0';
  try {
   document.body.appendChild(t);
   t.focus();
   t.select();
   ok = document.execCommand('copy') === true;
  } catch (e) {
   ok = false;
  } finally {
   t.remove();
  }
  if (ok) {
   if (message) toast(message);
   return true;
  }
  manualCopy(text);
  return false;
 }
}

function copyPrompt(text,message='依頼文をコピーしました。ChatGPTなどに貼り付けて送信してください') {
 state.ai.lastPrompt = text;
 document.querySelectorAll('[data-action="sharePrompt"]').forEach(b => {
  b.disabled = false;
 });
 return copyText(text,message);
}

async function loadFromClipboard() {
 let text = '';
 try {
  assert(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext,'fallback');
  text = await navigator.clipboard.readText();
 } catch (_) {
  showImport();
  return;
 }

 if (!text.trim()) {
  toast('クリップボードが空です。AIの回答をコピーしてから押してください');
  return;
 }
 safe(() => toast(applyAIText(text),3200));
}

// ---- 動作チェック ----
function selfTest() {
 const rows = [];
 const run = (label,fn) => {
  try {
   const r = fn();
   rows.push([label,'ok',typeof r === 'string' ? r : '']);
  } catch (e) {
   rows.push([label,'ng',e && e.message ? e.message : String(e)]);
  }
 };

 const spec = warriorSpec();

 run('① データの検証',() => {
  validateSpec(spec);
  return '部品 '+Object.keys(spec.parts).length+'個・動き '+Object.keys(spec.animations).length+'個';
 });

 run('② スプライトの構築と描画',() => {
  const sprite = R.buildSprite(spec);
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 64;
  R.drawSprite(c.getContext('2d'),sprite,0,0,{scale:2});
  assert(sprite.order.length === Object.keys(spec.parts).length,'部品の数が合いません');
  return '構築・描画できました';
 });

 run('③ 動きの再生と合図',() => {
  const sprite = R.buildSprite(spec);
  const anim = R.createAnimator(sprite,spec);
  let hit = 0;
  anim.on('hit',() => hit++);
  for (const id of Object.keys(spec.animations)) {
   assert(anim.play(id,{restart:true}),'再生できません: '+id);
   for (let i=0;i<40;i++) anim.update(1/30);
  }
  assert(hit >= 1,'攻撃の合図 hit が届きませんでした');
  return '5つの動きを再生し、hit を受け取りました';
 });

 run('④ キャラの切り替え（待機→歩く→攻撃）',() => {
  const hero = R.createCharacter(spec);
  hero.update(.1);
  assert(hero.current === 'idle','待機になりません');
  hero.setSpeed(2);
  hero.update(.1);
  assert(hero.current === 'walk','歩くになりません');
  assert(hero.action('attack') && hero.current === 'attack','攻撃になりません');
  for (let i=0;i<60;i++) hero.update(1/30);
  assert(hero.current === 'walk','攻撃の後に歩くへ戻りません');
  return '自動の切り替えを確認しました';
 });

 run('⑤ JSONの往復',() => {
  const back = normalizeSpec(parseJSON(JSON.stringify(spec)));
  validateSpec(back);
  assert(JSON.stringify(back) === JSON.stringify(spec),'往復後に内容が変わりました');
  return '内容が一致しました';
 });

 run('⑥ 修正データの適用',() => {
  const before = JSON.stringify(spec);
  const next = applyPatch(spec,{
   format:'SPRITE_PATCH_V1',
   operations:[{op:'replace',path:'/meta/description',value:'動作チェック'}]
  });
  assert(next.meta.description === '動作チェック','修正が反映されませんでした');
  assert(JSON.stringify(spec) === before,'適用前のデータが書き換わりました');
  return '適用でき、元のデータは変わりませんでした';
 });

 run('⑦ 4方向の歩き（勇者）',() => {
  const hs = hero4Spec();
  validateSpec(hs);

  const hero = R.createCharacter(hs);
  const g = document.createElement('canvas').getContext('2d');
  const want = {down:'walk_down',up:'walk_up',left:'walk_side'};

  for (const dir of ['down','up','left']) {
   hero.direction = dir;
   hero.setSpeed(2);
   hero.update(.1);
   hero.draw(g,8,16,{scale:1});
   assert(
    hero.animator.resolved === want[dir],
    '向き「'+dir+'」で '+want[dir]+' になりません（'+hero.animator.resolved+'）'
   );
   assert(hero.current === 'walk','向き「'+dir+'」で、歩く（walk）のままになりません（'+hero.current+'）');
  }
  return '下・上・左で、向き別の歩きに切り替わりました';
 });

 const ng = rows.filter(r => r[1] === 'ng').length;

 openDialog(
  '動作チェックの結果',
  `<p class="${ng ? 'error' : 'success'}">${ng ? ng+'件の項目で問題が見つかりました。' : '問題は見つかりませんでした。'}</p>
   ${rows.map(([label,status,note]) => `
    <p class="${status === 'ng' ? 'error' : 'success'}">${status === 'ok' ? '✓' : '✕'} ${esc(label)}${note ? '<br><small>'+esc(note)+'</small>' : ''}</p>
   `).join('')}
   <p class="hint">一時のひな形だけで確かめました。いま編集中のキャラや保存データには触れていません。</p>`,
  button('close','閉じる','primary')
 );
}

 recoverClose: clearRecovery,

 promptNew: () => copyPrompt(createAIPrompt('new')),
 promptEdit: () => copyPrompt(createAIPrompt('edit')),
 promptBatch: () => copyPrompt(createBatchPrompt()),
 sharePrompt: () => {
  assert(state.ai.lastPrompt,'先に依頼文をコピーしてください');
  navigator.share({text:state.ai.lastPrompt}).catch(e => {
   if (e && e.name !== 'AbortError') toast('共有できませんでした。コピー済みの依頼文をAIアプリに貼り付けてください');
  });
 },

 addPart,
 dupPart: duplicatePart,
 delPart: deletePart,
 addVariant,
 delVariant: deleteVariant,
 flipVariant,
 addColor,
 delColor: deleteColor,

 stopMotion: () => {
  stopMotion();
  renderPanel();
 },
 newClip,
 editClose: () => {
  state.motion.edit = null;
  state.rt.animator.stop();
  renderPanel();
 },
 frameAdd: () => addFrame(false),
 frameDup: () => addFrame(true),
 frameDel: deleteFrame,
 frameReset: resetFramePart,

 walkToggle: () => {
  if (state.motion.walk) stopMotion();
  else startWalk();
  renderPanel();
 },
 walkStop: () => {
  stopMotion();
  renderPanel();
 },
 tryReset: () => {
  startTry();
  state.rt.controller.reset();
 },

 queueAdd: () => {
  ensureQueue();
  const q = state.ai.queue;
  assert(q.length < 12,'注文リストは12件までです');
  const have = q.map(itemId);
  q.push(newQueueItem(STANDARD.map(x => x[0]).find(id => !have.includes(id)) || '*'));
  state.ai.qi = q.length-1;
  renderPanel();
 },
 queueStandard: () => {
  ensureQueue();
  const q = state.ai.queue;
  const have = q.map(itemId);
  const add = ['idle','walk','run','jump','attack','hurt','die']
   .filter(id => !have.includes(id) && !own(state.spec.animations,id));
  if (!add.length) {
   toast('標準の動きは、すべて注文リストかキャラにあります');
   return;
  }
  assert(q.length+add.length <= 12,'注文リストは12件までです');
  add.forEach(id => q.push(newQueueItem(id)));
  renderPanel();
  toast(add.length+'件を注文リストに追加しました');
 },

 reviewAccept: () => {
  state.motion.review = null;
  renderPanel();
  toast('動きを採用しました');
 },
 reviewUndo: restoreReviewBase,
 reviewAsk: () => copyPrompt(createReviewFixPrompt(),'直してもらう依頼文をコピーしました。ChatGPTなどに貼り付けて送信してください'),

 bundle: () => copyText(bundleText(),'コピーしました。AIへの指示に、ゲームのコードまたは作りたいゲームの説明と一緒に貼り付けてください'),
 bundleData: () => copyText(bundleDataText(),'データだけをコピーしました。AIへの指示に、ゲームのコードと一緒に貼り付けてください'),
 demoHtml: () => {
  downloadText(demoHtmlText(),fileBase()+'_demo.html','text/html');
  toast('確認用のHTMLを保存しました。開くとキャラを歩かせられます',3200);
 },

 close: closeDialog,
 confirm: () => {
  const fn = state.modalAction;
  closeDialog();
  if (fn) safe(fn);
 },
 confirmText: () => {
  try {
   const fn = state.modalAction;
   if (fn) fn();
   closeDialog();
  } catch (e) {
   const box = $('dialogError');
   if (box) {
    box.hidden = false;
    box.textContent = e.message;
   } else {
    showError(e);
   }
  }
 },
 selectCopy: () => $('copyText').select()
};

function handleClick(e) {
 const menu = $('moreMenu');
 if (menu.open && !menu.contains(e.target)) menu.open = false;

 const b = e.target.closest('button');
 if (!b) return;

 const d = b.dataset;
 if (b.closest('#moreMenu') && (d.tab || d.action)) menu.open = false;

 // ダイアログ内の「決定」は、エラーをダイアログの中に出す
 if (d.action === 'confirmText' || d.action === 'doImport') {
  actions[d.action]();
  return;
 }

 safe(() => {
  if (d.tab) {
   if (!own(GROUP,d.tab)) return;
   if (d.tab !== state.tab && state.motion.trying) stopMotion();
   state.tab = d.tab;
   renderPanel();
   scrollPanelTop();
  } else if (d.createmode) {
   state.createMode = d.createmode === 'library' ? 'library' : 'new';
   if (state.createMode === 'library') state.projects = readStore().projects;
   renderPanel();
  } else if (d.motionview) {
   if (state.motion.trying && d.motionview !== 'try') stopMotion();
   state.motion.view = ['view','make','try'].includes(d.motionview) ? d.motionview : null;
   renderPanel();
   scrollPanelTop();
  } else if (d.dir) {
   state.motion.dir = ['down','up','left','right'].includes(d.dir) ? d.dir : 'down';
   renderPanel();
  } else if (d.part) {
   state.sel.part = d.part;
   state.sel.variant = 'base';
   renderPanel();
  } else if (d.pvis) {
   togglePartVisible(d.pvis);
  } else if (d.tool) {
   state.sel.tool = d.tool;
   renderPanel();
  } else if (d.color) {
   state.sel.color = d.color;
   if (state.sel.tool === 'erase') state.sel.tool = 'pen';
   renderPanel();
  } else if (d.nudge) {
   nudgePart(d.nudge);
  } else if (d.grow) {
   growVariant(d.grow);
  } else if (d.play) {
   playMotion(d.play);
  } else if (d.editclip) {
   toggleEdit(d.editclip);
  } else if (d.delclip) {
   const id = d.delclip;
   askConfirm('動き「'+(state.spec.animations[id]?.name || id)+'」を削除しますか？',() => mutate(s => {
    delete s.animations[id];
   }));
  } else if (d.fstep) {
   stepFrame(Number(d.fstep));
  } else if (d.foff) {
   nudgeFramePart(d.foff);
  } else if (d.try) {
   tryAction(d.try);
  } else if (d.open) {
   const id = d.open;
   replaceGuard(() => loadProject(id));
  } else if (d.ren) {
   renameProject(d.ren);
  } else if (d.dup) {
   duplicateProject(d.dup);
  } else if (d.delproject) {
   const id = d.delproject;
   const name = state.projects.find(p => p.projectId === id)?.name || id;
   askConfirm('「'+name+'」をライブラリから削除しますか？（元に戻せません）',() => deleteProject(id));
  } else if (d.qedit !== undefined) {
   state.ai.qi = Number(d.qedit);
   renderPanel();
  } else if (d.qdel !== undefined) {
   const q = state.ai.queue;
   const i = Number(d.qdel);
   if (q.length > 1 && q[i]) {
    q.splice(i,1);
    state.ai.qi = Math.min(state.ai.qi,q.length-1);
    renderPanel();
   }
  } else if (d.newkind) {
   const kind = d.newkind;
   closeDialog();
   replaceGuard(() => {
    const fresh = kind === 'empty' ? emptySpec() : kind === 'hero4' ? hero4Spec() : warriorSpec();
    if (kind === 'empty') {
     fresh.settings.size = [dotSize(),dotSize()];
     if (state.ai.view === 'topdown') fresh.settings.view = 'topdown';
    }
    replaceProject(fresh);
    state.tab = kind === 'empty' ? 'ai' : 'repair';
    state.createMode = 'new';
    renderPanel();
    toast(kind === 'empty' ? '空のキャラを作りました' : (kind === 'hero4'
      ? '勇者のひな形を作りました。「動かす」で向きを切り替えて、4方向の歩きを確かめられます'
      : '戦士のひな形を作りました。「動かす」で動きを確かめられます'),3200);
   });
  } else if (actions[d.action]) {
   return actions[d.action]();
  }
 });
}

function setQueueField(el) {
 const it = state.ai.queue[state.ai.qi];
 if (!it) return;
 const key = el.dataset.q;
 if (el.type === 'checkbox') it[key] = el.checked;
 else if (el.type === 'number') it[key] = el.value === '' ? '' : Number(el.value);
 else it[key] = el.value;
 it.loaded = false;
}

function handleInput(e) {
 const el = e.target;
 const d = el.dataset;

 if (d.ai) {
  state.ai[d.ai] = el.value;
 } else if (d.q && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
  setQueueField(el);
 } else if (d.speed) {
  state.motion.speed = Number(el.value) || 1;
  if ($('speedOut')) $('speedOut').value = el.value;
 } else if (d.tryspeed) {
  state.motion.trySpeed = Number(el.value) || 0;
  if ($('trySpeedOut')) $('trySpeedOut').value = el.value;
  if (!state.motion.walk) startTry();
 }
}

function handleChange(e) {
 const el = e.target;
 const d = el.dataset;

 if (d.dot) {
  state.ai.dot = Number(el.value) || 32;
  renderPanel();
  return;
 }
 if (d.view) {
  state.ai.view = el.value === 'topdown' ? 'topdown' : 'side';
  renderPanel();
  return;
 }
 if (el.id === 'pinViewport') {
  state.pin = el.checked;
  applyPin();
  savePrefs();
  return;
 }
 if (el.id === 'gridToggle') {
  state.grid = el.checked;
  savePrefs();
  return;
 }
 if (el.id === 'background') {
  state.bg = el.value;
  savePrefs();
  return;
 }
 if (el.id === 'fileInput' || el.id === 'libraryFile') {
  const file = el.files && el.files[0];
  el.value = '';
  if (!file) return;
  const library = el.id === 'libraryFile';

  file.text()
   .then(text => {
    if (library) safe(() => importLibrary(text));
    else replaceGuard(() => safe(() => toast(applyAIText(text),3200)));
   })
   .catch(() => showError(Error('ファイルを読み込めませんでした。JSONファイル（.json）を選んでください')));
  return;
 }

 try {
  clearError();

  if (d.meta) {
   mutate(s => {
    s.meta[d.meta] = el.value;
   });
  } else if (d.viewEdit) {
   const view = el.value === 'topdown' ? 'topdown' : 'side';
   mutate(s => {
    s.settings.view = view;
   });
  } else if (d.size !== undefined) {
   const v = Number(el.value);
   mutate(s => {
    s.settings.size[Number(d.size)] = v;
   });
  } else if (d.pedit) {
   const id = state.sel.part;
   mutate(s => {
    const p = s.parts[id];
    if (d.pedit === 'name') p.name = el.value;
    else if (d.pedit === 'z') p.z = Number(el.value);
    else if (el.checked) p.effect = true;
    else delete p.effect;
   });
  } else if (el.id === 'variantSel') {
   state.sel.variant = el.value;
   renderPanel();
  } else if (el.id === 'colorValue') {
   const k = state.sel.color;
   mutate(s => {
    s.palette[k] = el.value;
   });
  } else if (d.cedit) {
   const {ed} = editInfo();
   mutate(s => {
    const a = s.animations[ed.clip];
    if (d.cedit === 'name') a.name = el.value;
    else if (d.cedit === 'fps') a.fps = Number(el.value);
    else a.loop = el.checked;
   });
  } else if (d.fedit) {
   const {ed} = editInfo();
   if (d.fedit === 'part') {
    ed.part = el.value;
    renderPanel();
   } else if (d.fedit === 'hold') {
    const v = Number(el.value);
    mutate(s => {
     const f = s.animations[ed.clip].frames[ed.frame];
     if (v === 1) delete f.hold;
     else f.hold = v;
    });
   } else if (d.fedit === 'event') {
    setFrameEvent(el.value);
   } else if (d.fedit === 'variant') {
    setFramePart('variant',el.value === 'base' ? undefined : el.value);
   } else if (d.fedit === 'flipX') {
    setFramePart('flipX',el.checked ? true : undefined);
   } else if (d.fedit === 'visible') {
    setFramePart('visible',el.checked ? undefined : false);
   }
  } else if (d.q) {
   setQueueField(el);
   if (d.q === 'id') {
    const it = state.ai.queue[state.ai.qi];
    const std = STANDARD.find(x => x[0] === it.id);
    if (std) {
     it.name = std[1];
     it.loop = std[2];
     it.fps = std[3];
     it.frames = std[4];
    }
   }
   if (el.type === 'checkbox' || el.tagName === 'SELECT') renderPanel();
  }
 } catch (err) {
  showError(err);
  renderPanel();
 }
}

function handleKey(e) {
 if (!$('modal').hidden) {
  if (e.key === 'Escape') closeDialog();
  if (e.key === 'Enter' && e.target.id === 'dialogInput' && !e.isComposing && e.keyCode !== 229) {
   e.preventDefault();
   actions.confirmText();
  }
  return;
 }

 if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

 const k = String(e.key).toLowerCase();

 if (state.motion.walk && (isTopdown()
  ? ['a','d','w','s','arrowleft','arrowright','arrowup','arrowdown']
  : ['a','d','arrowleft','arrowright']).includes(k)) {
  e.preventDefault();
  state.keys[k] = true;
  return;
 }

 if ((e.ctrlKey || e.metaKey) && k === 'z') {
  e.preventDefault();
  safe(() => undoRedo(e.shiftKey));
 }
}

// ============================================================
// 18. 起動
// ============================================================
function init() {
 try {
  const p = JSON.parse(localStorage.getItem(PREFS) || 'null');
  if (obj(p)) {
   if (typeof p.pin === 'boolean') state.pin = p.pin;
   if (typeof p.grid === 'boolean') state.grid = p.grid;
   if (typeof p.bg === 'string' && /^#[0-9a-f]{6}$/i.test(p.bg)) state.bg = p.bg;
  }
 } catch (_) {}

 $('gridToggle').checked = state.grid;
 $('background').value = state.bg;
 applyPin();

 restore();
 rebuild();
 renderPanel();

 bindCanvas();
 new ResizeObserver(resizeView).observe($('viewport'));
 resizeView();

 document.addEventListener('click',handleClick);
 document.addEventListener('input',handleInput);
 document.addEventListener('change',handleChange);
 document.addEventListener('keydown',handleKey);
 document.addEventListener('keyup',e => {
  state.keys[String(e.key).toLowerCase()] = false;
 });
 window.addEventListener('blur',() => {
  state.keys = {};
 });
 document.addEventListener('visibilitychange',() => {
  if (document.hidden) writeDraft();
 });
 window.addEventListener('pagehide',writeDraft);

 requestAnimationFrame(frameLoop);
}

try {
 init();
} catch (e) {
 showError(Error('起動処理のエラー: '+(e && e.message ? e.message : e)));
}
