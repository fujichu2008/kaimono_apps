  }

  /*
   * 再生開始・再開。
   *
   * 一時停止からの復帰ではresumeを使用し、
   * 曲の先頭へ戻さない。
   */
  function start() {
    if (!ready || !synth || playing) return;

    // 同一セッション内の再生失敗回数を制限する。
    // 待機期間中は何もせず、ログも出力しない。
    if (!canAttemptPlayback()) return;

    const ac = getContext();

    if (!ac) return;

    if (ac.state !== 'running') {
      // suspended / interrupted は再生失敗として数えない。
      // AudioContextの復旧は既存のユーザー操作処理に任せる。
      return;
    }

    try {
      const wasPaused = paused;

      if (wasPaused) {
        synth.resume();

        startedAt =
          ac.currentTime - position;
      } else {
        synth.start();

        startedAt = ac.currentTime;
        position = 0;
      }

      playing = true;
      paused = false;

      console.info(
        'SharedBGMPlayer: 再生開始',
        {
          track: currentKey,
          resumed: wasPaused,
          duration: duration
        }
      );
    } catch (error) {
      // 同じエラーを毎フレーム報告しない。
      // 次回の試行可否と待機時間は共通処理で管理する。
      recordPlaybackFailure(
        'start',
        error
      );
    }
  }

  /*
   * 一時停止。
   *
   * 再生位置を保持する。
   */
  function pause() {
    if (!playing || !synth || !ready) {
      return;
    }

    const ac = getContext();

    try {
      position = ac
        ? Math.max(
            0,
            Math.min(
              duration,
              ac.currentTime - startedAt
            )
          )
        : 0;

      synth.pause();

      playing = false;
      paused = true;
    } catch (error) {
      reportError('一時停止失敗', error);
    }
  }

  /*
   * 楽曲終端でのループ。
   *
   * ABC記譜の32小節を固定時間で推測せず、
   * abcjsが生成した音源の実時間を使用する。
   */
  function updateLoop() {
    if (!playing || !ready || !synth) {
      return;
    }

    const ac = getContext();

    if (!ac || ac.state !== 'running') {
      return;
    }

    if (
      duration <= 0 ||
      ac.currentTime - startedAt < duration
    ) {
      return;
    }

    // ループ処理でも、再生開始と同じ失敗回数制限を使う。
    if (!canAttemptPlayback()) return;

    try {
      synth.stop();
      synth.start();

      startedAt = ac.currentTime;
      position = 0;
      paused = false;
      playing = true;

      // 1周の再生と次周の開始に成功したため、
      // 過去の一時的な再生失敗を解消する。
      resetPlaybackFailures();
    } catch (error) {
      // ループ開始失敗時は、次のフレームでの
      // 無制限な再実行を防止する。
      recordPlaybackFailure(
        'loop',
        error
      );
    }
  }

  /*
   * BGMDirectorから呼び出される更新処理。
   *
   * 毎フレームの楽曲判定は行わない。
   * 引数で指定された曲だけを管理する。
   */
  function update(key) {
    if (!key) {
      stop(true);
      return;
    }

    if (currentKey !== key) {
      select(key);
    }

    if (!canRetry(key)) return;

    if (!ready) {
      prepare(key);
      return;
    }

    if (!playing) {
      start();
      return;
    }

    updateLoop();
  }

  /*
   * 停止インターフェース。
   *
   * reset=true:
   *   曲の切替・タイトル復帰など。
   *
   * reset=false:
   *   ゲームの一時停止。
   */
  function stop(resetPosition = false) {
    if (resetPosition) {
      reset();
      return;
    }

    pause();
  }

  return {
    update,
    stop
  };
})();

    if (current) {
      stopCurrent(true);
    }

    // 引き継がない。
    // 同一セッション内の連続エラー防止は維持する。
    if (next) {
      faults.delete(next);
    }

    current = next;
    paused = false;
  }

  /*
   * 一時停止中は、選択中の曲のみ停止する。
   * 曲の選択自体は維持する。
   */
  function pauseCurrent() {
    if (paused) return;

    if (current) {
      stopCurrent(false);
    }

    paused = true;
  }

  /*
   * ゲームのメインループから1回だけ呼び出す。
   *
   * 各曲のupdate()を個別に呼ばず、
   * 選択された1曲だけを更新する。
   */
  function update() {
    // 一時停止中は選択中の楽曲を保持する。
    // phaseの表記揺れに対応するが、
    // ゲーム状態の正本は変更しない。
    if (
      G.phase === 'pause' ||
      G.phase === 'paused'
    ) {
      pauseCurrent();
      return;
    }

    const next = selectTrack();

    if (next !== current) {
      changeTrack(next);
    }

    // ポーズから復帰したときは、
    // 既存BGM側のresume処理に再開を任せる。
    if (paused) {
      paused = false;
    }

    if (!current) return;

    if (faults.has(current)) return;

    if (!TRACKS[current]) return;

    try {
      SharedBGMPlayer.update(current);
    } catch (error) {
      console.error(
        'BGMDirector: BGM更新失敗',
        current,
        error
      );

      faults.add(current);
      stopCurrent(true);
    }
  }

  /*
   * タイトル復帰等で明示的に全停止したい場合の
   * インターフェース。
   *
   * 現段階ではゲーム側に新たな呼び出しを追加せず、
   * 既存のG.phaseによる自動判定を使用する。
   */
  function stop() {
    changeTrack(null);
    paused = false;
  }

  return {
    update,
    stop
  };
})();

const Game = {

    if (full) { G.clockSec = 0; G.cp = { x: st.start.x, z: st.start.z }; G.maxZ = 0; G.bossDown = false; G.spawned = st.spawns.map(() => false); World.buildDynamic(); Player.batt = 0; }
    else G.spawned = st.spawns.map((s, i) => !!G.spawned[i] && s.at < G.cp.z - 6);
    G.lock = null; G.bossTriggered = false; G.overT = -1; G.shake = 0; G.hitstop = 0;
    // 打刻地点からの再開では、拾ったゴルフクラブを持ち越す。
    const keepWeapon = full ? null : Player.weapon;

    if (keepWeapon) Player.setWeapon(keepWeapon);
    fireEvent('retry');
  },
  begin() {
    this.reset(true);
    setPhase('play');
    fireEvent('stageStart');

    // ユーザーの開始操作からBGMの音声再生を有効化。

    // 既存の開始イベントは維持し、導入台詞を優先して要求する。
    if (G.stage.id === 1) {

  },
  pause() { if (G.phase !== 'play') return; Player.endPedal(); setPhase('pause'); UI.overlay('pause'); fireEvent('pause'); },

  over() { Player.endPedal(); setPhase('over'); UI.overlay('over'); },
  retry() { this.reset(false); setPhase('play'); fireEvent('stageStart'); },
  clear() {

    Player.endPedal(); Save.store();

  },
  next() {

  },
  toTitle() { if (G.stageIndex !== 0) this.loadStage(0); else this.reset(true); setPhase('title'); UI.showBest(); fireEvent('title'); },
  // 出現・打刻・ボス戦・ゴールの判定
  progress(dt) {
    const st = G.stage, P = Player, b = st.boss;

          // ボス戦中はカラスを新規出現させない。
          // 通常区間やボス撃破後の既存スポーン仕様は維持する。
          if (e[0] === 'crow' && G.bossTriggered && !G.bossDown) return;
          Enemies.spawn(e[0], e[1], e[2]);

      }

      if (c.done || P.z < c.z || !P.grounded) continue;
      c.done = true; c.lampMat.color.setHex(0x40ff70);
      if (c.z + 1 > G.cp.z) { G.cp = { x: clamp(P.x, -5, 5), z: c.z + 1 }; P.hp = Math.min(CONFIG.player.hp, P.hp + CONFIG.checkpointHeal); fireEvent('checkpoint'); }
    }

  }
};

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), _ct = new THREE.Vector3(), _cl = new THREE.Vector3();

function titleCam(pos, look) { pos.set(Player.x - 3.5 + Math.sin(G.time * 0.13) * 0.5, 1.5, Player.z + 5); look.set(Player.x + 2, 1.3, Player.z - 1.2); }
function updateCamera(dt) {
  const P = Player, port = window.innerHeight > window.innerWidth;
  if (G.phase === 'title') titleCam(_ct, _cl);
  else if (P.bike) {
    const b = P.bike, side = -Math.sign(b.x * Math.cos(b.ry) || 1);
    _ct.set(side * (port ? 3.2 : 2.6), 1.45, 0.9);
    _cl.set(0, 0.43, -0.15);
    b.g.localToWorld(_ct);
    b.g.localToWorld(_cl);
  } else {
    let D = port ? 9 : 7.2, H = port ? 6.4 : 4.3; const ahead = port ? 4.5 : 5;
    if (Boss.active) { D += 2.6; H += 2.4; }
    if (P.truck && P.truck.kind === 'bus') { D += P.truck.train ? 7 : 4; H += P.truck.train ? 3.5 : 2.5; }   // バス・電車の運転中は引きで見せる
    const distance = Math.hypot(D, H - 1.2) * Input.zoom;
    const elevation = Math.atan2(H - 1.2, D) + Input.pitch;
    D = distance * Math.cos(elevation);
    H = 1.2 + distance * Math.sin(elevation);
    const cos = Math.cos(Input.orbit), sin = Math.sin(Input.orbit);
    const cx = -P.x * 0.2, lx = -P.x * 0.15;
    _ct.set(P.x + cx * cos - D * sin, H + P.floorY, P.z - D * cos - cx * sin);
    _cl.set(P.x + lx * cos + ahead * sin, 1.2 + P.floorY, P.z + ahead * cos - lx * sin);
  }
  const k = 1 - Math.exp(-dt * (G.phase === 'title' ? 1.5 : 5));
  camPos.lerp(_ct, k); camLook.lerp(_cl, k); camera.position.copy(camPos);
  if (G.shake > 0) { G.shake = Math.max(0, G.shake - dt * 1.6); const s = G.shake * G.shake * 0.9; camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s; }
  camera.lookAt(camLook);
  camera.updateMatrixWorld();
  cameraHeading = Math.atan2(camLook.x - camera.position.x, camLook.z - camera.position.z);
  sun.target.position.set(P.x, 0, P.z + 4); sun.position.copy(sun.target.position).add(SUN_OFFSET); sun.target.updateMatrixWorld();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.render.pixelRatio)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = h > w ? 68 : 55; camera.updateProjectionMatrix();
  PT_SCALE.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
}
function step(raw) {
  let dt = raw;
  Input.poll();
  if (G.phase === 'play' && !Player.bike && Input.take('use')) Player.startPedal();
  const pedaling = G.phase === 'play' && !!Player.bike;
  if (G.phase !== 'pause' && !pedaling) { G.time += raw; World.timeU.value = G.time; }
  if (pedaling) {
    G.clockSec += raw * (G.stage.clockRate || CONFIG.clock.rate);
    Player.updatePedal(raw);
  } else if (G.phase === 'play') {
    if (G.hitstop > 0) { G.hitstop -= raw; dt *= 0.08; }
    G.clockSec += dt * (G.stage.clockRate || CONFIG.clock.rate);   // ステージ4は実時間（始業9:00までの10分）
    Player.update(dt); Enemies.update(dt); Shots.update(dt); Boss.update(dt); Combat.update(dt); Seal.update(dt); World.update(dt); Game.progress(dt);
    Talk.update(dt);
    Allies.update(dt);
    Tips.update(dt);
    Pawahara.update(dt);
  } else if (G.phase === 'title') { Player.hero.setSpeed(0); Player.hero.update(dt); Player.sync(); }
  if (G.phase === 'ending') Ending.update(raw);
  Sfx.watch();
  BGMDirector.update();
  Sky.update(raw, G.phase === 'title' ? 0 : clamp(G.maxZ / G.stage.goalZ, 0, 1));
  updateCamera(raw);
  if (G.phase !== 'pause' && !pedaling) { FX.update(dt); Barks.update(dt); }

let lastTs = 0;
function frame(ts) { requestAnimationFrame(frame); const raw = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000 || 0.016)); lastTs = ts; step(raw); }

function boot() {
  initColors(); initAssets(); Sky.init(); Combat.init(); Player.init(); UI.init(); Input.init(); Save.load();
  Game.loadStage(0); setPhase('title'); UI.showBest(); fireEvent('title');
  resize(); titleCam(camPos, camLook);
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) Game.pause(); });
  requestAnimationFrame(frame);
}
boot();
</script>

<script>
/* 視点ジョグ：既存の移動・アクション入力とは独立 */
(function(){
  'use strict';

  const jog = document.getElementById('cameraJog');
  const thumb = document.getElementById('cameraJogThumb');
  if(!jog || !thumb) return;

  const state = {
    pointerId:null,
    x:0,
    y:0,
    yaw:0,
    pitch:0,
    maxRadius:30,
    yawSpeed:1.85,
    pitchSpeed:1.15,
    minPitch:-0.65,
    maxPitch:0.65
  };

  function setJogPosition(clientX,clientY){
    const r=jog.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    const dx=clientX-cx;
    const dy=clientY-cy;
    const length=Math.hypot(dx,dy);
    const factor=length>state.maxRadius?state.maxRadius/length:1;

    const px=dx*factor;
    const py=dy*factor;

    state.x=px/state.maxRadius;
    state.y=py/state.maxRadius;

    thumb.style.transform='translate('+px+'px,'+py+'px)';
  }

  function resetJog(){
    state.pointerId=null;
    state.x=0;
    state.y=0;
    thumb.style.transform='translate(0,0)';
    jog.classList.remove('active');
  }

  jog.addEventListener('pointerdown',function(e){
    if(state.pointerId!==null) return;
    e.preventDefault();
    e.stopPropagation();

    state.pointerId=e.pointerId;
    jog.classList.add('active');

    try{jog.setPointerCapture(e.pointerId);}catch(_){}

    setJogPosition(e.clientX,e.clientY);
  });

  jog.addEventListener('pointermove',function(e){
    if(e.pointerId!==state.pointerId) return;
    e.preventDefault();
    e.stopPropagation();
    setJogPosition(e.clientX,e.clientY);
  });

  function endJog(e){
    if(e.pointerId!==state.pointerId) return;
    e.preventDefault();
    e.stopPropagation();
    resetJog();
  }

  jog.addEventListener('pointerup',endJog);
  jog.addEventListener('pointercancel',endJog);
  jog.addEventListener('lostpointercapture',function(e){
    if(e.pointerId===state.pointerId) resetJog();
  });

  /*
   * カメラ更新は既存関数を残し、その結果に視点オフセットを加える。
   * ゲーム内の移動入力やカメラ追従計算は変更しない。
   */
  if(typeof updateCamera!=='function' ||
     typeof camera==='undefined' ||
     typeof camLook==='undefined'){
    console.warn('視点ジョグ: 既存カメラ処理を参照できません');
    return;
  }

  const originalUpdateCamera=updateCamera;
  const offset=new THREE.Vector3();
  const spherical=new THREE.Spherical();

  updateCamera=function(dt){
    originalUpdateCamera(dt);

    if(G && G.phase!=='play') return;

    const step=Math.min(Math.max(dt||0,0),.05);

    if(Math.abs(state.x)>.08){
      state.yaw+=state.x*state.yawSpeed*step;
    }
    if(Math.abs(state.y)>.08){
      state.pitch=Math.max(
        state.minPitch,
        Math.min(state.maxPitch,state.pitch-state.y*state.pitchSpeed*step)
      );
    }

    offset.copy(camera.position).sub(camLook);

    if(offset.lengthSq()<.0001) return;

    spherical.setFromVector3(offset);

    spherical.theta+=state.yaw;
    spherical.phi=Math.max(
      .18,
      Math.min(Math.PI-.18,spherical.phi-state.pitch)
    );

    offset.setFromSpherical(spherical);
    camera.position.copy(camLook).add(offset);
    camera.lookAt(camLook);
  };
})();
</script>
