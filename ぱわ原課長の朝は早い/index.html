    Shots.refute(P.x + Math.sin(P.face) * 1.2, P.z + Math.cos(P.face) * 1.2, w ? 1.8 : 1.2);

    this.eachTarget(t => {
      if (done.has(t.owner) || (t.y || 0) - P.floorY > height || P.floorY - (t.y || 0) > 1.5) return;
      const dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz) || 0.001;
      if (d > range + t.r || (d > 0.7 && Math.abs(angDiff(Math.atan2(dx, dz), P.face)) > arc)) return;
      done.add(t.owner); t.hit(dmg * power, dx / d, dz / d, push * power); hit = true;
      if (w && t.def) Enemies.stun(t, w.stun);
      FX.emit(t.x, 1.1, t.z, { n: w ? 16 : 10, color: w ? '#e8f4ff' : '#ffe2a8', speed: w ? 7 : 5, life: 0.3, size: 0.3 });
    });
    if (w && w.stamp) { // 決裁鎚：前方に印を押す。3撃目ごとに一括承認（広範囲）
      P.stampN = (P.stampN || 0) + 1;
      const big = P.stampN % 3 === 0;
      Seal.press(P.x + Math.sin(P.face) * 1.8, P.z + Math.cos(P.face) * 1.8, big);
      if (big) Barks.say(P.hero.anchor('head_top'), '一括承認ッ！', 'rage', 1.0);
    }
    if (w) { // クラブの軌跡と掛け声
      FX.emit(P.x + Math.sin(P.face) * 1.8, 0.9, P.z + Math.cos(P.face) * 1.8, { n: 12, color: '#cfe6ff', speed: 4, life: 0.25, size: 0.22, spread: 1.6, g: 0 });
      if (hit && Math.random() < 0.35) Barks.say(P.hero.anchor('head_top'), pick(w.lines ? LINES[w.lines] : LINES.golfHit), 'rage', 0.8);
    }

    let hitVending = false;
    for (const v of World.vendings) {
      const dx = v.x - P.x, dz = v.z - P.z;
      if (Math.hypot(dx, dz) < c.attackRange + 0.6 && Math.abs(angDiff(Math.atan2(dx, dz), P.face)) < 1.5) {
        World.hitVending(v);
        hitVending = true;
      }
    }

    // 攻撃の命中・空振りに関係なく1回分を消費。
    // 自販機を叩いた場合も同じ鞄攻撃として扱う。
    P.consumePowerAttack();

    if (hit) P.rage = Math.min(c.rageMax, P.rage + CONFIG.rage.onHit);
    if (hit || hitVending) { G.hitstop = Math.max(G.hitstop, 0.05); G.shake = Math.max(G.shake, 0.15); }
  },
  stomp() {
    const P = Player, cfg = CONFIG.jump;
    if (P.floorY > 1) return;   // 高所での着地は地上の敵を踏まない
    for (const e of Enemies.list) {
      if (e.dead || e.st === 'air' || !World.onGround(e.x, e.z)) continue;
      const groundedCrow = (e.st === 'grounded' || e.st === 'stunned') && e.y < 0.75;
      if (e.def.fly ? !groundedCrow : e.y > 0.12) continue;
      const dx = e.x - P.x, dz = e.z - P.z;
      const d = Math.hypot(dx, dz);
      if (d > cfg.radius) continue;
      e.hit(cfg.damage, dx / (d || 1), dz / (d || 1), 4);
    }
    FX.emit(P.x, 0.12, P.z, { n: 18, color: '#d9ecff', speed: 4, life: 0.42, size: 0.24, spread: cfg.radius });
    G.shake = Math.max(G.shake, 0.16);
  },
  wave(lv) {
    const P = Player, s = CONFIG.shout[lv], w = this.waves.find(q => !q.alive); if (!w) return;
    w.alive = true; w.dx = Math.sin(P.face); w.dz = Math.cos(P.face); w.x = P.x + w.dx * 0.35; w.z = P.z + w.dz * 0.35; w.d = 0; w.lv = lv; w.s = s; w.hit.clear();
    w.fxOnly = false; w.vis = 0; w.m.material.color.set(s.color); w.m.rotation.set(0, P.face, 0); w.m.visible = true;
    w.mic = P.mic > 0 ? CONFIG.mic.scale : 1;   // カラオケのマイクで音波が太くなる
    if (lv === 3) G.shake = Math.max(G.shake, 0.25);
  },
  kaatsu() { // 短押しの「喝ッ！」: 前方扇形の即時判定。空中の敵も叩き落として気絶させる
    const P = Player, T = CONFIG.shout.tap, done = new Set(), k = P.mic > 0 ? CONFIG.mic.scale : 1;   // k: カラオケのマイクで範囲拡大
    // 一喝で横文字ごと論破する。
    Shots.refute(P.x + Math.sin(P.face) * 2, P.z + Math.cos(P.face) * 2, T.range * k);
    this.eachTarget(t => {
      if (done.has(t.owner) || (t.y || 0) > T.height || P.floorY - (t.y || 0) > 2) return;
      const dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz) || 0.001;
      if (d > T.range * k + t.r) return;
      if (d > 1.8 && Math.abs(angDiff(Math.atan2(dx, dz), P.face)) > T.arc) return;
      done.add(t.owner); t.hit(T.dmg, dx / d, dz / d, T.push);
      if (t.onShout) t.onShout();   // 喝に反応する敵（内木の「結論」など）
      if (t.def) Enemies.stun(t, T.stun);
      FX.emit(t.x, (t.y || 0) + 0.8, t.z, { n: 8, color: '#ffd9a0', speed: 4, life: 0.35, size: 0.3 });
    });
    for (const b of World.barricades) { const bz = b.z - P.z; if (b.alive && bz > -0.5 && bz < 3 && Math.cos(P.face) > 0) World.hitBarricade(b, 1); }
    const w = this.waves.find(q => !q.alive);
    if (w) { // 見た目専用の広がるリング（ダメージなし）
      w.alive = true; w.fxOnly = true; w.vis = 0; w.x = P.x; w.z = P.z;
      w.m.material.color.set('#ffd9a0'); w.m.rotation.set(Math.PI / 2, 0, 0); w.m.position.set(P.x, 0.5, P.z); w.m.scale.setScalar(0.05); w.m.visible = true;
    }
    FX.emit(P.x + Math.sin(P.face) * 1.5, 1.2, P.z + Math.cos(P.face) * 1.5, { n: 14, color: '#ffd9a0', speed: 6, life: 0.4, size: 0.35 });
    G.shake = Math.max(G.shake, 0.2);
    Barks.say(P.hero.anchor('head_top'), '喝ッ！', 'rage', 0.9);
  },
  blast() { // 罵倒Lv3の発射時: 課長の周囲へ衝撃波（ダメージ＋気絶）
    const P = Player, s = CONFIG.shout[3], done = new Set();
    this.eachTarget(t => {
      if (done.has(t.owner) || (t.y || 0) > 4.2) return;
      const dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz) || 0.001;
      if (d > s.blastR + t.r) return;
      done.add(t.owner); t.hit(s.blastDmg, dx / d, dz / d, 6);
      if (t.def) Enemies.stun(t, s.stun);
    });
    FX.emit(P.x, 0.5, P.z, { n: 36, color: '#ff8a4a', speed: 9, life: 0.6, size: 0.4, spread: 1 });
    G.shake = Math.max(G.shake, 0.4);
  },
  bolt(t) {
    const P = Player, b = this.bolts.find(q => !q.alive); if (!b) return;
    b.alive = true; b.t = t; b.x = P.x; b.y = 1.1; b.z = P.z; b.life = 1.5; b.m.visible = true;
  },
  update(dt) {
    this.updateThrown(dt);
    for (const w of this.waves) {
      if (!w.alive) continue;
      if (w.fxOnly) { // 喝ッ！の見た目専用リング（0.2秒で半径いっぱいまで広がる）
        w.vis += dt; const kk = Math.min(1, w.vis / 0.2);
        w.m.position.set(w.x, 0.5, w.z); w.m.scale.setScalar(Math.max(0.05, CONFIG.shout.tap.range * kk)); w.m.material.opacity = (1 - kk) * 0.85;
        if (kk >= 1) { w.alive = false; w.fxOnly = false; w.m.visible = false; }
        continue;
      }
      const s = w.s;
      const oldX = w.x, oldZ = w.z;

      // 射程を越えて進まないよう、最終フレームの移動量を制限する。
      const step = Math.min(s.speed * dt, Math.max(0, s.range - w.d));
      w.x += w.dx * step;
      w.z += w.dz * step;
      w.d += step;

      const k = Math.min(1, w.d / s.range);
      const r = s.radius * (0.4 + 0.6 * k) * (w.mic || 1);
      let dead = k >= 1;
      let stoppedByEnemy = false;

      this.eachTarget(t => {
        if (stoppedByEnemy ||
            w.hit.has(t.owner) ||
            (t.y || 0) > 4.2 ||
            Math.hypot(t.x - w.x, t.z - w.z) > r + t.r) return;

        w.hit.add(t.owner);
        t.hit(s.dmg, w.dx, w.dz, s.push);
        if (t.onShout) t.onShout();

        if (t.def && s.stun) Enemies.stun(t, s.stun);

        FX.emit(t.x, 1.2, t.z, {
          n: 8, color: s.color,
          speed: 4, life: 0.35, size: 0.3
        });

        if (!s.pierce) {
          stoppedByEnemy = true;
          dead = true;
        }
      });

      // 音波の移動線分とバリケードの矩形を判定する。
      // 音波の半径を考慮し、フレーム間のすり抜けを防止する。
      // 敵で消滅した非貫通音波はバリケードまで届かない。
      if (!stoppedByEnemy && step > 0) {
        for (const b of World.barricades) {
          if (!b.alive || !b.c.active || w.hit.has(b)) continue;

          const c = b.c;

          // バリケードの当たり判定を音波の半径だけ拡張。
          const minX = c.x0 - r;
          const maxX = c.x1 + r;
          const minZ = c.z0 - r;
          const maxZ = c.z1 + r;

          const vx = w.x - oldX;
          const vz = w.z - oldZ;

          let enter = 0;
          let exit = 1;

          // X方向のスラブ判定。
          if (Math.abs(vx) < 1e-8) {
            if (oldX < minX || oldX > maxX) continue;
          } else {
            const a = (minX - oldX) / vx;
            const bb = (maxX - oldX) / vx;
            enter = Math.max(enter, Math.min(a, bb));
            exit = Math.min(exit, Math.max(a, bb));
          }

          // Z方向のスラブ判定。
          if (Math.abs(vz) < 1e-8) {
            if (oldZ < minZ || oldZ > maxZ) continue;
          } else {
            const a = (minZ - oldZ) / vz;
            const bb = (maxZ - oldZ) / vz;
            enter = Math.max(enter, Math.min(a, bb));
            exit = Math.min(exit, Math.max(a, bb));
          }

          if (enter > exit || exit < 0 || enter > 1) continue;

          // 命中位置で音波を止める。
          const hitT = clamp(enter, 0, 1);
          w.x = oldX + vx * hitT;
          w.z = oldZ + vz * hitT;
          w.d -= step * (1 - hitT);

          w.hit.add(b);
          World.hitBarricade(b, w.lv);

          dead = true;
          break;
        }
      }

      w.m.position.set(w.x, w.y, w.z);
      w.m.scale.setScalar(r);
      w.m.material.opacity = (1 - k * 0.8) * 0.9;

      if (dead) {
        w.alive = false;
        w.m.visible = false;
      }
    }
    for (const b of this.bolts) {
      if (!b.alive) continue;
      const t = b.t; b.life -= dt;
      if (t.dead || b.life <= 0) { b.alive = false; b.m.visible = false; continue; }
      const dx = t.x - b.x, dy = (t.y || 0) + 0.8 - b.y, dz = t.z - b.z, d = Math.hypot(dx, dy, dz) || 0.001, step = 26 * dt;
      if (d <= step + 0.4) {
        t.hit(CONFIG.phone.boltDmg, dx / d, dz / d, 2); FX.emit(t.x, (t.y || 0) + 0.8, t.z, { n: 8, color: '#7df0ff', speed: 4, life: 0.3, size: 0.28 });
        b.alive = false; b.m.visible = false;
      } else { b.x += dx / d * step; b.y += dy / d * step; b.z += dz / d * step; b.m.position.set(b.x, b.y, b.z); FX.emit(b.x, b.y, b.z, { n: 1, color: '#7df0ff', speed: 0.4, life: 0.25, size: 0.2, g: 0 }); }
    }
  },
  clear() {
    this.waves.forEach(w => { w.alive = false; w.m.visible = false; });
    this.bolts.forEach(b => { b.alive = false; b.m.visible = false; });
    this.thrown.forEach(q => this.removeThrown(q));
    this.thrown.length = 0;
  }
};

/* ---- 決裁鎚の印（地面に押す「却下」「一括承認」） ---- */
const Seal = {
  list: [], geo: null, mats: {},
  mat(big) {
    const key = big ? 'all' : 'no';
    if (!this.mats[key]) {
      const S = 256, c = makeCanvas(S, S), g = c.getContext('2d');
      g.strokeStyle = '#e02818'; g.fillStyle = '#e02818'; g.lineWidth = 14;
      g.beginPath(); g.arc(128, 128, 112, 0, 6.3); g.stroke();
      g.font = '700 ' + (big ? 64 : 92) + 'px ' + MINCHO; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(big ? '一括' : '却', 128, big ? 92 : 88); g.fillText(big ? '承認' : '下', 128, big ? 170 : 176);
      this.mats[key] = new THREE.MeshBasicMaterial({ map: canvasTex(c, false), transparent: true, depthWrite: false, side: THREE.DoubleSide });
    }
    return this.mats[key];
  },
  press(x, z, big) {
    const P = Player, w = CONFIG.weapons.hammer, R = big ? w.bigR : w.stampR, dmg = (big ? w.bigDmg : w.stampDmg) * P.powerMultiplier, done = new Set();
    Combat.eachTarget(t => {
      if (done.has(t.owner) || (t.y || 0) - P.floorY > 2.5) return;
      const dx = t.x - x, dz = t.z - z, d = Math.hypot(dx, dz);
      if (d > R + t.r) return;
      done.add(t.owner); t.hit(dmg, dx / (d || 1), dz / (d || 1), 5);
      if (t.def) Enemies.stun(t, w.freeze);   // 決裁待ちで固まる
    });
    if (!this.geo) this.geo = new THREE.PlaneGeometry(1, 1);
    const m = new THREE.Mesh(this.geo, this.mat(big).clone());
    m.rotation.x = -Math.PI / 2; m.rotation.z = Math.random() * 0.6 - 0.3; m.position.set(x, 0.05 + P.floorY, z); m.scale.set(R * 2, R * 2, 1);
    scene.add(m); this.list.push({ m, t: 0 });
    FX.emit(x, 0.3 + P.floorY, z, { n: big ? 40 : 18, color: '#ff5040', speed: big ? 8 : 5, life: 0.5, size: 0.35, spread: 1 });
    G.shake = Math.max(G.shake, big ? 0.5 : 0.25); G.hitstop = Math.max(G.hitstop, 0.05);
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const q = this.list[i]; q.t += dt;
      q.m.material.opacity = Math.max(0, 1 - Math.max(0, q.t - 0.8) / 0.8);
      if (q.t > 1.6) { scene.remove(q.m); q.m.material.dispose(); this.list.splice(i, 1); }
    }
  },
  clear() { this.list.forEach(q => { scene.remove(q.m); q.m.material.dispose(); }); this.list.length = 0; }
};

/* ---- 管理職アクション：強敵の硬直・気絶中に、近くの物を使って決める ---- */
const Heat = {
  target() {
    const P = Player, c = CONFIG.heat;
    if (P.state !== 'free' && P.state !== 'attack') return null;
    return Enemies.list.find(e => !e.dead && e.def.heat && !(e.heatUntil > G.time) &&
      Math.hypot(e.x - P.x, e.z - P.z) < c.reach && (e.st === 'recover' || e.stunT > 0)) || null;
  },
  prop() {
    const P = Player, c = CONFIG.heat;
    const v = World.vendings.find(q => Math.hypot(q.x - P.x, q.z - P.z) < c.objReach);
    if (v) return { name: '自販機落とし', mul: 1.5, v };
    if (World.bikes.some(q => Math.hypot(q.x - P.x, q.z - P.z) < c.objReach)) return { name: '放置自転車スイング', mul: 1.3 };
    if (P.throwStock.length) return { name: CONFIG.throw.types[P.throwStock[0]].name + '叩きつけ', mul: 1.0, stock: true };
    return null;
  },
  ready() { return !!(this.target() && this.prop()); },
  tryFinish() {
    const t = this.target(), p = t && this.prop();
    if (!p) return false;
    const P = Player, c = CONFIG.heat, dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz) || 1;
    if (p.stock) P.throwStock.shift();
    if (p.v) p.v.shake = 0.6;
    P.face = Math.atan2(dx, dz);
    t.heatUntil = G.time + c.lock;
    Enemies.damage(t, c.dmg * p.mul * P.powerMultiplier, dx / d, dz / d, 10);
    G.hitstop = Math.max(G.hitstop, 0.25); G.shake = Math.max(G.shake, 0.8);
    FX.emit(t.x, 1.2, t.z, { n: 50, color: '#ffb040', speed: 9, life: 0.8, size: 0.4, spread: 1.5 });
    Barks.say(P.hero.anchor('head_top'), '管理職アクション！ ' + p.name + '！', 'rage', 1.6);
    return true;
  }
};

/* ============================================================
 * 12. 課長（プレイヤー）
 * ============================================================ */
const Player = {
  hero: null, obj: null, light: null, phoneMat: null, ring: null,
  x: 0, z: 0, y: 0, vy: 0, face: 0, kx: 0, kz: 0,
  hp: 100, rage: 60, batt: 0,
  state: 'free', st: 0,                      // free / attack / throw / shout / shoutRecover / jump / land / pedal / hurt / dead
  jumpT: -1, pedalAngle: 0, powerHits: 0, truck: null,
  weapon: null, club: null, drunk: 0,        // 近接武器（null=鞄）・手に持つクラブ・ほろ酔い残り秒
  floorY: 0, dropV: 0, onRails: false,       // 立体の上での足元の高さ・落下速度・手すりのある面か
  // 激怒強化（回数制）とほろ酔い（時間制）は重ねがけできる。
  get powerMultiplier() { return (this.powerHits > 0 ? CONFIG.power.multiplier : 1) * (this.drunk > 0 ? CONFIG.drunk.power : 1); },
  // 強化回数を消費するのは実際に攻撃が成立したタイミングだけ。
  // 最後の1回の攻撃にも強化倍率を適用してから呼び出す。
  consumePowerAttack() {
    if (this.powerHits > 0) this.powerHits--;
  },
  throwStock: [],                           // 拾った順に格納する投擲物の所持品
  throwCD: 0,
  shoutT: 0, shoutLv: 0, shoutLock: false,
  inv: 0, slow: 0, boost: 0, ai: false, aiT: 0, aiBark: 0,
  dead: false, falling: false, safe: { x: 0, z: 2 }, bike: null,

  init() {
    const h = this.hero = ModelRenderer.createCharacter(MODEL_DATA_SALARYMAN_GLASSES_SUIT);
    this.obj = h.object; scene.add(this.obj);
    this.light = new THREE.PointLight(0xfff0d8, 0.75, 11, 2); this.light.position.set(0, 1.7, 0.5); this.obj.add(this.light);
    this.phoneMat = new THREE.MeshBasicMaterial({ color: 0x2a3a44 });
    mk(h.anchor('hand_L_grip'), GEO.box, this.phoneMat, [0, 0, 0.02], [0.075, 0.15, 0.012]).castShadow = false;
    this.ring = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({ color: 0x7df0ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.ring.rotation.x = Math.PI / 2; this.ring.position.y = 0.08; this.ring.scale.setScalar(1.3); this.ring.visible = false; this.obj.add(this.ring);
    h.on('hit', () => { if (h.current() === 'attack' && this.state === 'attack') Combat.melee(); });
    h.on('down', () => { G.overT = 0.8; });
  },
  reset(x, z) {
    const c = CONFIG.player;
    Input.clearAttack();
    this.x = x; this.z = z; this.y = 0; this.vy = 0; this.face = 0; this.kx = this.kz = 0;
    this.hp = c.hp; this.rage = CONFIG.rage.start; this.state = 'free'; this.st = 0; this.throwCD = 0; this.throwStock = []; this.shoutT = 0; this.shoutLv = 0; this.shoutLock = false; this.tapCD = 0;
    this.inv = 1.2; this.slow = 0; this.boost = 0; this.dead = false; this.falling = false; this.safe = { x, z }; this.bike = null;
    this.jumpT = -1; this.pedalAngle = 0; this.powerHits = 0;
    this.drunk = 0; this.mic = 0; this.setWeapon(null);
    this.floorY = 0; this.dropV = 0; this.onRails = false;
    if (this.truck) {
      this.truck.x = 0;
      this.truck.z = this.truck.barrier.z - (this.truck.homeOff || 9);
      this.truck.g.position.set(0, 0, this.truck.z);
      this.truck.g.rotation.y = this.truck.face = 0;
    }
    this.truck = null;
    this.setAI(false); this.hero.setSpeed(0); this.hero.stop(); this.hero.action('idle'); this.hero.stop(); this.sync();
  },
  sync() {
    this.obj.position.set(this.x, this.y + (this.floorY || 0), this.z); this.obj.rotation.y = this.face;
    this.obj.rotation.z = this.drunk > 0 ? Math.sin(G.time * 2.1) * 0.1 : 0;   // 千鳥足の揺れ
    this.obj.visible = this.dead || this.inv <= 0 || Math.floor(this.inv * 18) % 2 === 1;
  },
  get grounded() { return !this.falling && this.jumpT < 0; },
  nearBike() {
    return World.bikes.find(b => b.left > 0 && Math.hypot(b.x - this.x, b.z - this.z) < CONFIG.bike.reach) || null;
  },

      if (P.state === 'shout') {
        P.shoutT += dt; let lv = 1; for (let i = 3; i > 1; i--) if (P.shoutT >= CONFIG.shout[i].after) { lv = i; break; }
        if (lv !== P.shoutLv) { P.shoutLv = lv; if (lv > 1) { h.action(CONFIG.shout[lv].anim); Barks.say(h.anchor('head_top'), pick(LINES.shout[lv]), 'rage', 1.3); } }
      }
    } else if (P.state === 'shout') P.releaseShout();
    if (!Input.shout) P.shoutLock = false;

    // ストックした落下物を拾った順に投げる。
    // 近くに落下物がなくても投擲可能。
    // 鞄のモーションを再利用するが、近接攻撃判定は発生させない。
    if (Input.take('throw') && P.state === 'free' && P.throwCD <= 0 && P.throwStock.length > 0) {
      const type = P.throwStock[0];
      if (Combat.throwItem(type)) {
        // 投擲物には生成時点の強化倍率が保存されている。
        // 消費は投擲成功後に行うため、最後の1発も強化される。
        P.consumePowerAttack();
        P.throwStock.shift();
        P.state = 'throw';
        P.st = CONFIG.throw.cooldown;
        P.throwCD = CONFIG.throw.cooldown;
        h.action('attack');
      }
    }

    // 通常入力と予約入力は同じ攻撃開始処理へ渡す。
    // 予約は１件だけ消費し、硬直やアニメーションは短縮しない。
    const attackRequested = Input.take('attack') || Input.attackQueued;
    if (P.state === 'free') {
      Input.attackQueued = false;
      if (attackRequested) {
        P.state = 'attack'; P.st = 0.62; h.action('attack');
        if (!moveIn) { const t = Combat.nearest(P.x, P.z, 4.5); if (t) P.face = Math.atan2(t.x - P.x, t.z - P.z); }
      }
    } else if (P.state !== 'attack' && P.state !== 'shoutRecover') {
      Input.clearAttack();
    }

    const ox = P.x, oz = P.z;
    // 移動・向き
    let sp = 0;
    if (P.state !== 'hurt') {
      if (moveIn) {
        P.face = angLerp(P.face, Math.atan2(mx, mz), Math.min(1, dt * (P.state === 'shout' ? 4.5 : 14)));
        if (P.state === 'free' || P.state === 'jump') sp = mag < 0.6 ? c.walk : c.run; else if (P.state === 'attack' || P.state === 'throw') sp = c.run * 0.3; else if (P.state === 'shout') sp = c.run * 0.5;
        if (P.slow > 0) sp *= 0.45; if (P.boost > 0) sp *= 1.3; if (P.drunk > 0) sp *= CONFIG.drunk.speed;
        P.x += mx / mag * sp * dt; P.z += mz / mag * sp * dt;
      } else if (P.state === 'shout') { const t = Combat.nearest(P.x, P.z, 12); if (t) P.face = angLerp(P.face, Math.atan2(t.x - P.x, t.z - P.z), Math.min(1, dt * 10)); }
    }
    const k = Math.exp(-7 * dt); P.x += P.kx * dt; P.z += P.kz * dt; P.kx *= k; P.kz *= k;
    World.collide(P, c.radius);
    const hw = World.halfWidthAt(P.z) - c.radius; P.x = clamp(P.x, -hw, hw);
    P.z = G.lock ? clamp(P.z, G.lock.z0, G.lock.z1) : clamp(P.z, -18, G.stage.goalZ + 6);
    // 立体（階段・デッキ・ランプ）：高すぎる段差は壁、手すりのある面からは落ちない。軸ごとに試して壁沿いに滑らせる
    // 手すりで止めるのは「段差として降りられない高さ」へ落ちる時だけ（階段の下端から地面へは降りられる）
    const okAt = (x, z) => { const g = World.groundAt(x, z, P.floorY); return !(g.blocked || (P.onRails && g.y < P.floorY - 0.65 && P.jumpT < 0)); };
    if (!okAt(P.x, P.z)) { if (okAt(P.x, oz)) P.z = oz; else if (okAt(ox, P.z)) P.x = ox; else { P.x = ox; P.z = oz; } }
    const gnd = World.groundAt(P.x, P.z, P.floorY);
    P.onRails = gnd.rails;
    if (gnd.y >= P.floorY - 0.05) { P.floorY = gnd.y; P.dropV = 0; }
    else {
      P.dropV += 24 * dt; P.floorY = Math.max(gnd.y, P.floorY - P.dropV * dt);
      if (P.floorY <= gnd.y) {
        if (P.dropV > 9) FX.emit(P.x, gnd.y + 0.1, P.z, { n: 12, color: '#c9c0b0', speed: 3, life: 0.4, size: 0.25 });
        P.dropV = 0;
      }
    }
    const floor = World.onGround(P.x, P.z);
    if (P.jumpT >= 0) {
      const cfg = CONFIG.jump;
      P.jumpT += dt;
      const k = Math.min(1, P.jumpT / cfg.duration);
      P.y = 4 * cfg.height * k * (1 - k);
      if (k >= 1) {
        P.jumpT = -1;
        if (floor) {
          Combat.stomp();
          if (P.state !== 'hurt') { P.state = 'land'; P.st = cfg.recovery; }
        } else {
          P.vy = -4 * cfg.height / cfg.duration;
        }
      }
    }
    if (P.grounded && !floor) {
      if (P.state === 'shout') P.endShout();
      Input.clearAttack();
      P.state = 'free';
      P.falling = true;
    } else if (P.grounded && World.onGround(P.x - 0.9, P.z) && World.onGround(P.x + 0.9, P.z) &&
               World.onGround(P.x, P.z - 0.9) && World.onGround(P.x, P.z + 0.9)) {
      P.safe.x = P.x;
      P.safe.z = P.z;
    }
    h.setSpeed(P.state === 'free' ? sp : 0); h.update(dt); P.sync();
  }
};

/* ============================================================
 * 13. 入力（タッチ・キーボード）
 *     画面の右 = ワールドの -x（カメラが +z を向くため）
 * ============================================================ */
const Input = {
  mx: 0, mz: 0, shout: false, tShout: false, stickId: null, keys: {}, _p: {},
  orbit: 0, zoom: 1, pitch: 0, pedalId: null, pedalDelta: 0,
  attackQueued: false,
  clearAttack() {
    this.attackQueued = false;
    this._p.attack = false;
  },
  requestAttack() {
    const P = Player;
    if (G.phase !== 'play' || P.dead || P.falling || P.truck || P.bike) return;

    if (P.state === 'free') {
      this._p.attack = true;
    } else if ((P.state === 'attack' || P.state === 'shoutRecover') &&
               P.st > 0 && P.st <= 0.15) {
      // 入力イベント時点の残り硬直で受付を判定する。
      // 真偽値１件なので、連打しても予約数は増えない。
      this.attackQueued = true;
    }
  },
  clear() {
    this.clearAttack();
    this.releasePointers();
    this.keys = {};
    this._p = {};
    this.mx = this.mz = 0;
    this.shout = this.tShout = false;
    if (Player.state === 'shout') {
      Player.endShout();
      Player.shoutLock = true;
    }
  },
  take(k) { const v = this._p[k]; this._p[k] = false; return !!v; },
  poll() {
    const k = this.keys;
    if (this.stickId == null) { this.mx = (k.left ? 1 : 0) - (k.right ? 1 : 0); this.mz = (k.up ? 1 : 0) - (k.down ? 1 : 0); }
    this.shout = this.tShout || !!k.shout;
  },
  init() {
    const zone = $('stickZone'), stick = $('stick'), knob = $('knob'), R = 52;

    // 固定位置のジョイスティック。タッチ開始位置へ移動させない。
    const moveStick = e => {
      const r = stick.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;

      let dx = e.clientX - cx;
      let dy = e.clientY - cy;

      const length = Math.hypot(dx, dy);

      if (length > R) {
        dx *= R / length;
        dy *= R / length;
      }

      knob.style.transform =
        'translate(' + dx + 'px,' + dy + 'px)';

      // 既存の移動方向の符号を維持する。
      this.mx = -dx / R;
      this.mz = -dy / R;
    };

    const resetStick = () => {
      this.stickId = null;
      this.mx = 0;
      this.mz = 0;
      knob.style.transform = '';
    };

    const end = e => {
      if (e.pointerId !== this.stickId) return;
      resetStick();
    };

    zone.addEventListener('pointerdown', e => {
      if (this.stickId != null ||
          G.phase !== 'play' ||
          Player.bike ||
          Player.dead) return;

      this.stickId = e.pointerId;

      moveStick(e);

      try {
        zone.setPointerCapture(e.pointerId);
      } catch (err) {
        // Pointer Capture非対応端末では通常のイベントを利用。
      }

      e.preventDefault();
      e.stopPropagation();
    });

    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== this.stickId) return;

      moveStick(e);
      e.preventDefault();
      e.stopPropagation();
    });

    for (const name of [
      'pointerup',
      'pointercancel',
      'lostpointercapture'
    ]) {
      zone.addEventListener(name, end);
    }
    const hold = (id, flag) => {
      const el = $(id);
      let activePointer = null;

      const finish = (e, cancelled) => {
        if (activePointer == null) return;
        if (e && e.pointerId !== activePointer) return;

        const pointer = activePointer;
        activePointer = null;
        this[flag] = false;
        el.classList.remove('down');
        if (el.hasPointerCapture(pointer)) el.releasePointerCapture(pointer);

        // キャンセル時はチャージ攻撃を発動させない。
        // 正常なpointerupでは従来どおり次の更新で発動する。
        if (cancelled && flag === 'tShout' && Player.state === 'shout') {
          Player.endShout();
          Player.shoutLock = true;
        }
      };

      el.addEventListener('pointerdown', e => {
        if (activePointer != null || G.phase !== 'play' || Player.bike) return;

        activePointer = e.pointerId;
        this[flag] = true;
        el.classList.add('down');

        try {
          el.setPointerCapture(e.pointerId);
        } catch (err) {
          // Pointer Capture非対応時も操作は継続する。
        }

        e.preventDefault();
      });

      el.addEventListener('pointerup', e => finish(e, false));
      el.addEventListener('pointercancel', e => finish(e, true));
      el.addEventListener('lostpointercapture', e => finish(e, true));

      return () => finish(null, true);
    };
    const tap = (id, name) => $(id).addEventListener('pointerdown', e => {
      if (G.phase !== 'play' || Player.bike) return;
      if (name === 'attack') this.requestAttack();
      else this._p[name] = true;
      e.preventDefault();
    });
    const cancelShout = hold('btnShout', 'tShout');
    tap('btnUse', 'use'); tap('btnAtk', 'attack'); tap('btnAI', 'ai'); tap('btnThrow', 'throw'); tap('btnJump', 'jump');

    const dial = $('pedalDial'), orbitPoints = new Map();
    let dialAngle = null;
    const capture = (el, id) => {
      try { el.setPointerCapture(id); } catch (err) { /* 捕捉できる端末でのみ使用 */ }
    };
    const release = (el, id) => {
      if (id != null && el.hasPointerCapture(id)) el.releasePointerCapture(id);
    };
    const dialPosition = e => {
      const r = dial.getBoundingClientRect();
      const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      const radius = Math.hypot(x, y) / (r.width / 2 || 1);
      const cfg = CONFIG.bike;
      return radius >= cfg.dialInner && radius <= cfg.dialOuter ? Math.atan2(y, x) : null;
    };
    dial.addEventListener('pointerdown', e => {
      if (!Player.bike || this.pedalId != null) return;
      this.pedalId = e.pointerId;
      dialAngle = dialPosition(e);
      capture(dial, e.pointerId);
      e.preventDefault();
    });
    dial.addEventListener('pointermove', e => {
      if (!Player.bike || e.pointerId !== this.pedalId) return;
      const angle = dialPosition(e);
      if (angle != null && dialAngle != null) {
        const delta = angDiff(angle, dialAngle);
        if (Math.abs(delta) <= CONFIG.bike.maxSampleAngle) this.pedalDelta += delta;
      }
      dialAngle = angle;
    });
    const resetDial = cancelled => {
      const id = this.pedalId;
      this.pedalId = null;
      dialAngle = null;
      if (cancelled) this.pedalDelta = 0;
      release(dial, id);
    };
    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      dial.addEventListener(name, e => {
        if (e.pointerId === this.pedalId) resetDial(name !== 'pointerup');
      });
    }

    // ゲーム画面のドラッグで視点を回し、2本指では距離を変更。
    // 移動ジョイスティックとアクションボタンは既存の専用領域を使用する。
    const orbitSpan = () => {
      if (orbitPoints.size !== 2) return null;

      const [a, b] = orbitPoints.values();
      return Math.hypot(b.x - a.x, b.y - a.y);
    };

    let previousSpan = null;

    const resetOrbit = () => {
      const ids = Array.from(orbitPoints.keys());
      orbitPoints.clear();
      previousSpan = null;

      for (const id of ids) release(canvas, id);
    };

    canvas.addEventListener('pointerdown', e => {
      if (G.phase !== 'play' ||
          Player.bike ||
          Player.dead ||
          e.pointerType !== 'touch' ||
          orbitPoints.size >= 2) return;

      orbitPoints.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      // 2本指になった瞬間の距離を基準にする。
      if (orbitPoints.size === 2) {
        previousSpan = orbitSpan();
      }

      capture(canvas, e.pointerId);
      e.preventDefault();
    });

    canvas.addEventListener('pointermove', e => {
      const p = orbitPoints.get(e.pointerId);
      if (!p) return;

      if (G.phase !== 'play' ||
          Player.bike ||
          Player.dead) {
        resetOrbit();
        return;
      }

      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;

      p.x = e.clientX;
      p.y = e.clientY;

      const cfg = CONFIG.orbit;

      if (orbitPoints.size === 1) {
        // 1本指：カメラを上下左右へ回す。
        this.orbit = angDiff(
          this.orbit - dx * cfg.dragYaw,
          0
        );

        this.pitch = clamp(
          this.pitch - dy * cfg.dragPitch,
          cfg.pitchMin,
          cfg.pitchMax
        );
      } else if (orbitPoints.size === 2) {
        // 2本指：距離の変化だけを使う。
        // 以前のひねり角度による回転は行わない。
        const span = orbitSpan();

        if (previousSpan !== null &&
            span >= cfg.minSpan &&
            previousSpan >= cfg.minSpan) {
          this.zoom = clamp(
            this.zoom * previousSpan / span,
            cfg.zoomMin,
            cfg.zoomMax
          );
        }

        previousSpan = span;
      }

      e.preventDefault();
    });

    const endOrbitPointer = e => {
      if (!orbitPoints.has(e.pointerId)) return;

      orbitPoints.delete(e.pointerId);
      release(canvas, e.pointerId);

      // 2本指から1本指に戻る場合も、
      // 残った指の現在位置を起点として継続する。
      previousSpan = null;

      if (orbitPoints.size === 2) {
        previousSpan = orbitSpan();
      }
    };

    for (const name of [
      'pointerup',
      'pointercancel',
      'lostpointercapture'
    ]) {
      canvas.addEventListener(name, endOrbitPointer);
    }
    this.releasePointers = () => {
      const id = this.stickId;
      this.stickId = null;
      this.mx = 0;
      this.mz = 0;
      knob.style.transform = '';
      release(zone, id);
      cancelShout();
      resetDial(true);
      resetOrbit();
    };
    const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', k: 'shout', e: 'use' };
    window.addEventListener('keydown', e => {
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (!e.repeat && (key === 'p' || key === 'Escape')) {
        if (G.phase === 'play') Game.pause();
        else if (G.phase === 'pause') Game.resume();
        return;
      }
      if (G.phase !== 'play' || (Player.bike && key !== 'e')) return;
      const action = map[key];
      if (action) {
        if (!e.repeat || this.keys[action]) this.keys[action] = true;
        if (!e.repeat && key === 'e' && !Player.bike) this._p.use = true;
        e.preventDefault();
      } else if (!e.repeat && (key === 'j' || key === ' ')) { this.requestAttack(); e.preventDefault(); }
      else if (!e.repeat && key === 'l') this._p.ai = true;
      else if (!e.repeat && key === 'i') { this._p.throw = true; e.preventDefault(); }
      else if (!e.repeat && key === 'u') { this._p.jump = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', e => { const key = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (map[key]) this.keys[map[key]] = false; });
    window.addEventListener('blur', () => Player.endPedal());
    document.addEventListener('contextmenu', e => e.preventDefault());
  }
};

/* ============================================================
 * 14. 画面表示（HUD・オーバーレイ）
 * ============================================================ */
const UI = {
  el: {}, c: {}, flashV: 0, ovAction: null, ovAction2: null,
  pickupTimer: null,
  init() {
    ['hpFill', 'rageFill', 'battFill', 'clockTxt', 'routeDot', 'bossBar', 'bossFill', 'bossName', 'stamp', 'flash', 'aiTint', 'btnUse', 'btnAI', 'btnShout', 'btnThrow', 'barrierHint', 'barrierTitle', 'barrierGuide', 'barrierRage', 'barrierHPFill', 'barrierHPText', 'ovBig', 'ovSub', 'ovBtn', 'ovBtn2', 'best'].forEach(k => { this.el[k] = $(k); });
    $('btnStart').addEventListener('click', () => Game.begin());

    // 旧試験用ボタンを撤去。
    // ステージ直接開始の操作は、以下の共通メニューへ統合する。
    for (const id of [
      'btnStage2Test',

      </button>
      <div id="stageSelectMenu"
           class="hidden"
           aria-label="開始ステージを選択"></div>
    `;

    document.body.appendChild(stageSelector);

    const stageSelectButton =
      stageSelector.querySelector('#btnStageSelect');

    const stageSelectMenu =
      stageSelector.querySelector('#stageSelectMenu');

    // 既存CSSへの影響を防ぐため、
    // ステージ選択UIの装飾だけを独立して定義する。
    const stageSelectorStyle = document.createElement('style');
    stageSelectorStyle.textContent = `

      }

      body[data-phase="title"] #stageSelector {
        display: block;
      }

      #btnStageSelect {
        min-height: 44px;
        padding: 10px 15px;
        border: 1px solid rgba(220, 230, 240, .45);
        border-radius: 10px;
        color: #f1f5fa;
        background: rgba(15, 24, 37, .88);
        font: inherit;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      #stageSelectMenu {

        padding: 8px;

      }

        display: none;
      }

      #stageSelectMenu button {
        display: block;
        width: 100%;
        min-height: 48px;
        margin: 0;
        padding: 10px 12px;
        border: 0;
        border-bottom: 1px solid rgba(220, 230, 240, .12);
        border-radius: 5px;

        font-size: 13px;

        cursor: pointer;
        touch-action: manipulation;
      }

        border-bottom: 0;
      }

      #stageSelectMenu button:active {
        background: rgba(100, 160, 210, .25);
      }

    document.head.appendChild(stageSelectorStyle);

    const closeStageSelectMenu = () => {
      stageSelectMenu.classList.add('hidden');
      stageSelectButton.setAttribute('aria-expanded', 'false');
    };

    // 開始処理を一元化し、旧試験用ボタンと同じ
    // 初期武器・ステージ開始イベントを維持する。
    const startSelectedStage = index => {
      if (G.phase !== 'title') return;

      const stage = STAGES[index];
      if (!stage) return;

      const cleared =
        Save.data && Array.isArray(Save.data.cleared)
          ? Save.data.cleared
          : [];

      const unlocked =
        TEMP_UNLOCK_ALL_STAGES ||
        index === 0 ||
        cleared.includes(stage.id);

      if (!unlocked) return;

      closeStageSelectMenu();

      // iPhoneのユーザー操作中に共用AudioContextを有効化する。
      Stage1BGM_0430.unlockAudio();

      Game.loadStage(index);

      if (index === 2) {
        Player.setWeapon('golf');
      } else if (index === 3) {
        Player.setWeapon('hammer');
      }

      setPhase('play');
      fireEvent('stageStart');

      // ステージ1を直接選んだ場合も、

      }
    };

    // メニューを開くたびに最新のクリア履歴を参照。
    // セーブデータの形式や更新処理は変更しない。
    const buildStageSelectMenu = () => {
      stageSelectMenu.replaceChildren();

      const cleared =
        Save.data && Array.isArray(Save.data.cleared)
          ? Save.data.cleared
          : [];

      STAGES.forEach((stage, index) => {
        const unlocked =
          TEMP_UNLOCK_ALL_STAGES ||
          index === 0 ||
          cleared.includes(stage.id);

        const button = document.createElement('button');
        button.type = 'button';

        const stageName =
          stage.title || stage.name || '';

        button.textContent =
          'ステージ' + stage.id +
          (stageName ? '　' + stageName : '') +
          (unlocked ? '' : '　🔒');

        button.disabled = !unlocked;

        button.addEventListener('click', () => {
          startSelectedStage(index);
        });

        stageSelectMenu.appendChild(button);
      });
    };

    stageSelectButton.addEventListener('click', () => {
      if (G.phase !== 'title') return;

      if (!stageSelectMenu.classList.contains('hidden')) {
        closeStageSelectMenu();
        return;
      }

      buildStageSelectMenu();
      stageSelectMenu.classList.remove('hidden');
      stageSelectButton.setAttribute('aria-expanded', 'true');
    });
    // エンディング：タップで会話を送る／最後にタイトルへ
    $('ending').addEventListener('pointerdown', () => Ending.tap());
    $('endBtn').addEventListener('click', () => Game.toTitle());
    $('btnPause').addEventListener('click', () => Game.pause());
    for (const id of ['pedalPanel', 'pedalNeedle', 'pedalCharge']) this.el[id] = $(id);
    $('btnPedalBack').addEventListener('click', () => { if (Player.bike) Player.endPedal(); });
    this.el.ovBtn.addEventListener('click', () => { if (this.ovAction) this.ovAction(); });
    this.el.ovBtn2.addEventListener('click', () => { if (this.ovAction2) this.ovAction2(); });
  },
  showBest() { const b = Save.data.best[G.stage.id]; this.el.best.textContent = b == null ? '' : '最速 ' + clockText(b); },
  showPickup(type) {
    const item = CONFIG.items[type];
    if (!item || !(item.power || item.weapon || item.mic || item.flag)) return;

    const el = $('pickupToast');
    $('pickupName').textContent = item.name;
    $('pickupEffect').textContent = item.power ? '激怒強化 ×' + CONFIG.power.attacks + '回' : item.effect;
    el.style.setProperty('--pickup-color', item.color);

    // 連続取得では古い通知の終了予約を取り消し、
    // 新しいアイテム名でアニメーションを最初から再生する。
    if (this.pickupTimer !== null) clearTimeout(this.pickupTimer);
    el.classList.remove('hidden', 'show');
    void el.offsetWidth;
    el.classList.add('show');
    this.pickupTimer = setTimeout(() => {
      el.classList.add('hidden');
      el.classList.remove('show');
      this.pickupTimer = null;
    }, 2400);
  },
  // ボス戦の途中でボス名を切り替える（体力ゲージは Boss.ratio() に従う）
  setBossName(name) { this.el.bossName.textContent = name; },
  // 判子の演出（打刻と同じ表示を任意の文字で）
  showStamp(text) {
    const s = this.el.stamp;
    s.textContent = text; s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
    Sfx.play('chime');   // 始業チャイム
  },
  // 強敵の名乗り（字幕カード）
  showNameCard(sub, name) {
    const el = $('nameCard');
    $('nameCardSub').textContent = sub; $('nameCardName').textContent = name;
    if (this.nameTimer) clearTimeout(this.nameTimer);
    el.classList.remove('hidden', 'show'); void el.offsetWidth; el.classList.add('show');
    this.nameTimer = setTimeout(() => { el.classList.add('hidden'); el.classList.remove('show'); this.nameTimer = null; }, 3000);
  },
  clearPickup() {
    if (this.pickupTimer !== null) clearTimeout(this.pickupTimer);
    this.pickupTimer = null;
    const el = $('pickupToast');
    el.classList.add('hidden');
    el.classList.remove('show');
  },
  overlay(kind) {
    const e = this.el, home = () => Game.toTitle();
    e.ovBtn2.classList.remove('hidden'); e.ovBtn2.textContent = '退勤'; this.ovAction2 = home;
    if (kind === 'pause') { e.ovBig.textContent = '休憩'; e.ovSub.textContent = ''; e.ovBtn.textContent = '再開'; this.ovAction = () => Game.resume(); }
    else if (kind === 'over') { e.ovBig.textContent = '欠勤'; e.ovSub.textContent = clockText(G.clockSec); e.ovBtn.textContent = '再出社'; this.ovAction = () => Game.retry(); }
    else { e.ovBig.textContent = G.stage.clearText; e.ovSub.textContent = clockText(G.clockSec); e.ovBtn.textContent = 'つづく'; this.ovAction = () => Game.next(); e.ovBtn2.classList.add('hidden'); }
  },
  onEvent(name, arg) {
    const e = this.el;
    switch (name) {
      case 'bossStart': e.bossName.textContent = arg.name; e.bossBar.classList.remove('hidden'); break;
      case 'bossDown': case 'title': case 'retry': e.bossBar.classList.add('hidden'); break;
      case 'checkpoint': e.stamp.textContent = '打刻 ' + clockText(G.clockSec); e.stamp.classList.remove('on'); void e.stamp.offsetWidth; e.stamp.classList.add('on'); break;
      case 'aiOn': e.aiTint.style.opacity = 1; break;
      case 'aiOff': e.aiTint.style.opacity = 0; break;
      case 'hurt': this.flashV = 1; break;
    }
  },
  update() {
    const P = Player, e = this.el, c = this.c;
    const set = (key, v, fn) => { if (c[key] !== v) { c[key] = v; fn(v); } };
    set('hp', Math.round(P.hp), v => { e.hpFill.style.transform = 'scaleX(' + v / CONFIG.player.hp + ')'; });
    set('rage', Math.round(P.rage), v => { e.rageFill.style.transform = 'scaleX(' + v / CONFIG.player.rageMax + ')'; });
    set('powerHits', P.powerHits, v => {
      const el = $('powerCount');
      el.classList.toggle('hidden', v <= 0);
      if (v > 0) el.textContent = '激怒強化 残り' + v + '回';
    });
    set('drunk', Math.ceil(P.drunk), v => {
      const el = $('drunkCount');
      el.classList.toggle('hidden', v <= 0);
      if (v > 0) el.textContent = 'ほろ酔い 残り' + v + '秒';
      document.body.dataset.drunk = String(v > 0);
    });
    set('mic', Math.ceil(P.mic || 0), v => {
      const el = $('micCount');
      el.classList.toggle('hidden', v <= 0);
      if (v > 0) el.textContent = 'マイク 残り' + v + '秒';
    });
    set('batt', Math.round(P.batt), v => { e.battFill.style.width = v + '%'; });
    set('clock', clockText(G.clockSec), v => { e.clockTxt.textContent = v; });
    set('route', Math.round(clamp(P.z / G.stage.goalZ, 0, 1) * 100), v => { e.routeDot.style.left = v + '%'; });
    const pedaling = G.phase === 'play' && !!P.bike;
    set('pedaling', pedaling, v => {
      document.body.dataset.pedaling = String(v);
      e.pedalPanel.classList.toggle('hidden', !v);
    });
    if (pedaling) {
      set('pedalCharge', Math.floor(P.batt), v => { e.pedalCharge.textContent = v + '%'; });
      set('pedalAngle', P.bike.crank.rotation.x, v => { e.pedalNeedle.style.transform = 'rotate(' + v + 'rad)'; });
    }
    // ボタンの表示可否は既存のプレイヤー状態から算出する。
    // ゲーム状態を増やさず、使用できない操作だけを隠す。
    const operational = G.phase === 'play' && !P.dead && !P.falling && !P.bike;
    const free = operational && P.state === 'free' && !P.truck;
    const truck = P.nearTruck();

    // 乗降はトラック操作中も可能。
    // 発電はボス戦・AI使用中・危険な敵の接近時には表示しない。
    const bike = free && P.grounded && !P.ai && P.batt < 100 &&
      !Boss.active && !!P.nearBike() &&
      !Enemies.list.some(enemy =>
        !enemy.dead &&
        Math.hypot(enemy.x - P.x, enemy.z - P.z) < CONFIG.bike.dangerRange
      );
    const canUse = operational &&
      (P.truck ? !(P.truck.kind === 'bus' && P.truck.rampage) : (free && P.grounded && (!!truck || bike)));

    set('use', canUse, v => {
      e.btnUse.classList.toggle('hidden', !v);
    });
    set('useLabel', P.truck ? '降' : truck ? '乗' : '漕', v => {
      e.btnUse.textContent = v;
      e.btnUse.setAttribute('aria-label',
        v === '乗' ? '軽トラに乗る' :
        v === '降' ? '軽トラから降りる' : '漕ぐ');
    });

    // 鞄・喝は最下段の固定位置で表示。
    // 長押し中の喝は、充電段階が変わっても消さない。
    const attackVisible = operational && !P.truck;
    const shoutVisible = free &&
      P.rage >= CONFIG.shout.tap.cost ||
      (operational && !P.truck && P.state === 'shout');
    const jumpVisible = free && P.grounded &&
      World.onGround(P.x, P.z);

    set('attackVisible', attackVisible, v => {
      $('btnAtk').classList.toggle('hidden', !v);
    });
    set('attackReady', free, v => {
      // 薄く表示してもタッチ領域は維持し、硬直末尾の予約を受け付ける。
      $('btnAtk').style.opacity = v ? '' : '0.4';
    });
    set('weaponLabel', P.weapon === 'hammer' ? '印' : P.weapon ? '打' : '鞄', v => {
      $('btnAtk').textContent = v;
      $('btnAtk').setAttribute('aria-label', v === '印' ? '決裁鎚で印を押す' : v === '打' ? 'ゴルフクラブで打つ' : '鞄');
    });
    // 強敵の隙に近くの物があれば、管理職アクションの合図として攻撃ボタンを光らせる
    set('heat', free && (Heat.ready() || Allies.unanimousReady()), v => { $('btnAtk').classList.toggle('heat', v); });
    set('shoutVisible', shoutVisible, v => {
      e.btnShout.classList.toggle('hidden', !v);
    });
    set('jumpVisible', jumpVisible, v => {
      $('btnJump').classList.toggle('hidden', !v);
    });

    // 投擲はストックがあり、クールダウンが終わった時だけ表示。
    const throwCount = P.throwStock.length;
    const throwReady = free && P.throwCD <= 0 && throwCount > 0;
    set('throw', throwReady, v => {
      e.btnThrow.className = v ? 'pb ready' : 'pb off hidden';
    });
    set('throwCount', throwCount, v => {
      $('throwCount').textContent = v;
    });
    set('throwType', throwCount > 0 ? P.throwStock[0] : '', v => {
      const name = v ? CONFIG.throw.types[v].name : '';
      e.btnThrow.title = v
        ? name + 'を投げる（残り' + P.throwStock.length + '個）'
        : '投げるものを拾ってください';
      e.btnThrow.setAttribute('aria-label',
        v ? name + 'を投げる' : '投げるものがありません');
    });

    // AIは起動可能な残量がある場合、または使用中だけ表示。
    // classNameの更新時にも非表示状態を保持する。
    const aiVisible = operational &&
      (P.ai || P.batt >= CONFIG.phone.minStart);
    const aiClass = P.ai ? 'pb on' : 'pb';
    set('ai', aiClass + (aiVisible ? '' : ' hidden'), v => {
      e.btnAI.className = v;
    });

    set('lv', P.state === 'shout' ? P.shoutLv : 0, v => {
      e.btnShout.dataset.lv = v;
    });

    // バリケード攻略HUD。
    // 表示対象は接近中の未破壊バリケード1つだけ。
    // 判定・耐久力の正本はWorld.barricadesに置く。
    let nearBarrier = null;
    let nearDist = 14;

    if (G.phase === 'play' && !P.dead && !P.falling) {
      for (const b of World.barricades) {
        if (!b.alive) continue;

        const dz = b.z - P.z;

        // 基本的に進行方向にあるバリケードのみ案内する。
        if (dz < -2 || dz > nearDist) continue;

        nearDist = dz;
        nearBarrier = b;
      }
    }

    const barrierVisible = !!nearBarrier;

    set('barrierVisible', barrierVisible, v => {
      e.barrierHint.classList.toggle('hidden', !v);
    });

    if (nearBarrier) {
      const b = nearBarrier;
      const title = '廃車のバリケード';
      const vName = b.vehicle === 'train' ? '山手線' : b.vehicle === 'bus' ? 'バス' : '軽トラ';
      const guide = P.truck ? (b.vehicle === 'bus' || b.vehicle === 'train' ? '加速して突っ込め！' : '前進して突破！') : '光る' + vName + 'で突破 · 乗／E';
      const rageText = P.truck ? '突破すると' + vName + 'は壊れます' : vName + 'を運転して体当たり';

      const hp = Math.max(0, Math.ceil(b.hp));
      const hpText = '耐久力 ' + hp + ' / 100';

      set('barrierTitle', title, v => {
        e.barrierTitle.textContent = v;
      });

      set('barrierGuide', guide, v => {
        e.barrierGuide.textContent = v;
      });

      set('barrierRage', rageText, v => {
        e.barrierRage.textContent = v;
      });

      set('barrierHP', hp, v => {
        e.barrierHPFill.style.transform =
          'scaleX(' + clamp(v / 100, 0, 1) + ')';
        e.barrierHPText.textContent = '耐久力 ' + v + ' / 100';
      });
    }

    // 迷惑系YouTuberの配信状態（近くにいる間だけ表示）
    const yt = Live.find();
    const ytShow = G.phase === 'play' && !!yt && Math.hypot(yt.x - P.x, yt.z - P.z) < 30;
    set('liveShow', ytShow, v => { $('liveBar').classList.toggle('hidden', !v); });
    if (ytShow) set('liveText', yt.live ? '● LIVE　同接 ' + Math.floor(yt.viewers).toLocaleString() + '人' : '配信停止（BAN）', v => {
      $('liveBar').textContent = v; $('liveBar').classList.toggle('off', !yt.live);
    });
    if (Boss.active) set('boss', Math.round(Boss.ratio() * 200), v => { e.bossFill.style.transform = 'scaleX(' + v / 200 + ')'; });
    if (this.flashV > 0 || c.flash !== 0) { this.flashV = Math.max(0, this.flashV - 0.035); set('flash', this.flashV, v => { e.flash.style.opacity = v; }); }
  }
};

  // ABC音名をMIDI音高へ変換。
  // 大文字C=中央ド、小文字c=その1オクターブ上。
  function pitchToMidi(token, accidentals) {
    const match = /^([\^_=]*)([A-Ga-g])([,']*)/.exec(token);
    if (!match) return null;

    const prefix = match[1];
    const letter = match[2];
    const octaveMarks = match[3];
    const upper = letter.toUpperCase();

    const semitone = {
      C: 0, D: 2, E: 4, F: 5,
      G: 7, A: 9, B: 11
    }[upper];

    let octave = letter === upper ? 4 : 5;

    for (const mark of octaveMarks) {
      if (mark === ',') octave--;
      else if (mark === "'") octave++;
    }

    const accidentalKey = letter + octaveMarks;

    if (prefix) {
      const sharp = (prefix.match(/\^/g) || []).length;
      const flat = (prefix.match(/_/g) || []).length;
      accidentals[accidentalKey] = sharp - flat;
      if (prefix.includes('=')) accidentals[accidentalKey] = 0;
    }

    const alteration = accidentals[accidentalKey] || 0;
    return (octave + 1) * 12 + semitone + alteration;
  }

  function noteLength(token) {
    const match = /(\d+)?(?:\/(\d+))?$/.exec(token);
    if (!match) return 1;
    const numerator = match[1] ? Number(match[1]) : 1;
    const denominator = match[2] ? Number(match[2]) : 1;
    return numerator / denominator;
  }

  function parseVoice(source, instrument) {
    const events = [];
    let beat = 0;

    // 小節単位で臨時記号をリセットする。
    const bars = source.trim().split('|');

    for (const bar of bars) {
      const accidentals = Object.create(null);
      const tokens = bar.match(
        /\[[^\]]+\]|[\^_=]*[A-Ga-gz][,']*\d*(?:\/\d+)?/g
      ) || [];

      for (const token of tokens) {
        if (token[0] === '[') {
          const parts = token.slice(1, -1).match(
            /[\^_=]*[A-Ga-g][,']*\d*(?:\/\d+)?/g
          ) || [];

          let chordLength = 0;
          const pitches = [];

          for (const part of parts) {
            const length = noteLength(part);
            chordLength = Math.max(chordLength, length);
            const midi = pitchToMidi(part, accidentals);

            if (midi !== null) {
              pitches.push({ midi, length });
            }
          }

          for (const note of pitches) {
            events.push({
              time: beat,
              duration: note.length,
              midi: note.midi,
              instrument
            });
          }

          beat += chordLength;
        } else {
          const length = noteLength(token);

          if (!token.includes('z')) {
            const midi = pitchToMidi(token, accidentals);

            if (midi !== null) {
              events.push({
                time: beat,
                duration: length,
                midi,
                instrument
              });
            }
          }

          beat += length;
        }
      }
    }

    if (Math.abs(beat - LOOP_EIGHTHS) > 0.001) {
      console.warn(
        'Stage1BGM: 楽譜の長さが一致しません',
        instrument,
        beat,
        LOOP_EIGHTHS
      );
    }

    return events;

    const events = [];

    for (const voice of SCORE) {
      events.push(...parseVoice(voice.notes, voice.name));

    events.sort((a, b) => a.time - b.time);
    return events;
  }

  function frequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);

  function instrumentSettings(name) {
    switch (name) {
      case 'Oboe':

          wave: 'sawtooth', volume: 0.21,
          attack: 0.065, release: 0.13,
          gate: 0.91, cutoff: 1550

      case 'Flute':

          attack: 0.09, release: 0.15,
          gate: 0.91, cutoff: 8000

      case 'ElectricPiano':

          attack: 0.007, release: 0.12,
          gate: 0.8, cutoff: 2600
        };
      case 'Vibraphone':

          attack: 0.008, release: 0.5,
          gate: 0.88, cutoff: 7500
        };
      case 'TremoloStrings':

          wave: 'sawtooth', volume: 0.075,
          attack: 0.24, release: 0.22,
          gate: 0.96, cutoff: 1150
        };
      case 'PizzicatoStrings':
        return {
          wave: 'triangle', volume: 0.14,
          attack: 0.006, release: 0.065,
          gate: 0.5, cutoff: 1600
        };
      case 'AcousticBass':
        return {
          wave: 'triangle', volume: 0.22,
          attack: 0.009, release: 0.09,
          gate: 0.82, cutoff: 650
        };
      case 'Timpani':
        return {
          wave: 'sine', volume: 0.32,
          attack: 0.005, release: 0.17,
          gate: 0.72, cutoff: 550
        };
      default:
        return {
          wave: 'sine', volume: 0.1,
          attack: 0.02, release: 0.1,
          gate: 0.9, cutoff: 3000
        };
    }
  }

  function playNote(event, when) {
    if (!context || !master) return;

    const cfg = instrumentSettings(event.instrument);
    const noteSeconds = event.duration * EIGHTH;
    const audible = Math.max(0.045, noteSeconds * cfg.gate);
    const end = when + audible;
    const release = Math.max(0.025, cfg.release);

    const oscillator = context.createOscillator();
    const envelope = context.createGain();
    const filter = context.createBiquadFilter();

    oscillator.type = cfg.wave;

    const hz = Math.max(30, frequency(event.midi));
    oscillator.frequency.setValueAtTime(hz, when);

    if (event.instrument === 'Timpani') {
      oscillator.frequency.setValueAtTime(hz * 1.25, when);
      oscillator.frequency.exponentialRampToValueAtTime(
        hz, when + Math.min(0.12, audible * 0.45)
      );
    }

    filter.type = 'lowpass';
    filter.frequency.value = cfg.cutoff;
    filter.Q.value = 0.5;

    envelope.gain.setValueAtTime(0.0001, when);

    const attack = Math.min(cfg.attack, audible * 0.45);
    const peakAt = when + Math.max(0.003, attack);

    envelope.gain.linearRampToValueAtTime(
      cfg.volume, peakAt
    );

    if (
      event.instrument === 'ElectricPiano' ||
      event.instrument === 'PizzicatoStrings' ||
      event.instrument === 'AcousticBass' ||
      event.instrument === 'Timpani'
    ) {
      envelope.gain.exponentialRampToValueAtTime(
        Math.max(0.00015, cfg.volume * 0.2),
        Math.max(peakAt + 0.01, end)
      );
    } else {
      envelope.gain.setValueAtTime(
        cfg.volume * 0.78,
        Math.max(peakAt + 0.001, end)
      );
    }

    envelope.gain.exponentialRampToValueAtTime(
      0.0001,
      end + release
    );

    oscillator.connect(filter);
    filter.connect(envelope);
    envelope.connect(master);

    oscillator.start(when);
    oscillator.stop(end + release + 0.015);

    const item = { oscillator, envelope, filter };
    active.push(item);

      item.filter.disconnect();
      item.envelope.disconnect();

  let abcLoading = null;

  let abcStartedAt = 0;
  let abcPaused = false;

      'T:0430_Route15_Dawn_Foreboding',
      'M:4/4',

      'Q:1/4=116',
      'K:Em'

        voice.name === 'Timpani'

      return [
        'V:' + (index + 1) +
          ' name="' + voice.name + '"' +
          ' clef=' + clef,
        '%%MIDI program ' + voice.program,

      .catch(error => {

        abcStartedAt = context.currentTime;
        position = 0;
        abcPaused = false;
      } catch (error) {

          G.stage.id !== 1 ||
          G.bossTriggered ||
          G.phase === 'title' ||
          G.phase === 'clear' ||
          G.phase === 'over' ||
          G.phase === 'ending';

        abcPaused &&
        (
          !G.stage ||
          G.stage.id !== 1 ||
          G.bossTriggered ||
          G.phase === 'title' ||
          G.phase === 'clear' ||
          G.phase === 'over' ||
          G.phase === 'ending'
        )
      ) {
        stop(true);
      }

      return;
    }

    if (!abcReady) return;

    if (!playing) start();

    schedule();

    update,
    stop,
    loadLibrary: loadAbcjs,
    getAudioContext: () => context,
    getAbc: buildAbc,
    unlockAudio: () => {

          console.warn('BGM: AudioContext再開失敗', error);

    return (
      !isStage2() ||
      G.bossTriggered ||
      G.phase === 'title' ||
      G.phase === 'over' ||
      G.phase === 'clear' ||
      G.phase === 'ending'
    );
  }

  function prepare() {

          throw new Error('abcjs音声再生に非対応');

        const visualObjects =
          ABCJS.renderAbc('*', buildAbc());

        if (!visualObjects || !visualObjects[0]) {
          throw new Error('ステージ2の楽譜を解析できません');
        }

        const nextSynth =
          new ABCJS.synth.CreateSynth();

        return nextSynth.init({
          audioContext: ac,
          visualObj: visualObjects[0],
          options: {
            soundFontVolumeMultiplier: 0.65,
            chordsOff: true
          }
        }).then(() => {
          return nextSynth.prime();
        }).then(result => ({
          nextSynth,
          result
        }));
      })
      .then(({ nextSynth, result }) => {
        synth = nextSynth;
        duration =
          result.duration || FALLBACK_DURATION;

        ready = true;
        playing = false;
        paused = false;
        position = 0;

        console.info(
          'Stage2BGM: 音源準備完了',
          duration
        );
      })
      .catch(error => {
        failed = true;

        console.warn(
          'Stage2BGM: 音源準備失敗',
          error
        );
      })
      .finally(() => {
        loading = false;
      });
  }

  function start() {
    if (!ready || !synth || playing) return;

    const ac = getContext();

    if (!ac || ac.state !== 'running') return;

    try {
      if (paused) {
        synth.resume();
        startedAt = ac.currentTime - position;
      } else {
        synth.start();
        startedAt = ac.currentTime;
        position = 0;
      }

      playing = true;
      paused = false;
    } catch (error) {
      console.warn(
        'Stage2BGM: 再生開始失敗',
        error
      );
    }
  }

  function stop(reset = false) {
    if (!synth || !ready) {
      playing = false;
      paused = false;

      if (reset) position = 0;

      return;
    }

    try {
      if (reset) {
        synth.stop();
        position = 0;
        paused = false;
      } else if (playing) {
        const ac = getContext();

        position = ac
          ? Math.max(0, ac.currentTime - startedAt)
          : 0;

        synth.pause();
        paused = true;
      }
    } catch (error) {
      console.warn(
        'Stage2BGM: 停止失敗',
        error
      );
    }

    playing = false;
  }

  function update() {
    if (!isAllowed()) {
      const reset = shouldReset();

      if (playing || (paused && reset)) {
        stop(reset);
      }

      return;
    }

    if (!ready) {
      prepare();
      return;
    }

    if (!playing) {
      start();
      return;
    }

    const ac = getContext();

    if (!ac || ac.state !== 'running') return;

    // ABC楽譜の32小節を最後まで演奏してからループ。
    if (
      duration > 0 &&
      ac.currentTime - startedAt >= duration
    ) {
      try {
        synth.stop();
        synth.start();

        startedAt = ac.currentTime;
        position = 0;
        paused = false;
      } catch (error) {
        console.warn(
          'Stage2BGM: ループ再生失敗',
          error
        );

        playing = false;
      }
    }
  }

  return {
    update,
    stop,
    getAbc: buildAbc
  };
})();

      G.phase === 'over' ||
      G.phase === 'clear' ||
      G.phase === 'ending'

      'L:1/8',
      'Q:1/4=168',

      );

  function isAllowed() {
    return (

      G.stage &&
      G.stage.id === 3 &&
      G.bossTriggered &&
      !G.bossDown &&
      Boss.active
    );
  }

  function shouldReset() {
    return (
      !G.stage ||
      G.stage.id !== 3 ||
      !G.bossTriggered ||
      G.bossDown ||
      G.phase === 'title' ||
      G.phase === 'over' ||
      G.phase === 'clear' ||
      G.phase === 'ending'
    );
  }

  // abcjsに渡すABC楽譜を生成。
  // 楽譜データはSCOREに集約する。
  function buildAbc() {
    const lines = [
      'X:1',
      'T:' + TITLE,
      'M:4/4',
      'L:1/8',
      'Q:1/4=' + TEMPO,
      'K:Am'
    ];

    SCORE.forEach((voice, index) => {
      lines.push(
        'V:' + (index + 1) +
        ' name="' + voice.name + '"' +
        ' clef=' + voice.clef
      );

      lines.push(
        '%%MIDI program ' + voice.program
      );

      // 反復記号はJavaScript側のループ処理へ集約。
      lines.push(voice.notes.trim());
    });

    return lines.join('\n');
  }

  // ボス戦に入ったときだけ音源を準備する。
  // 既存のabcjsとAudioContextを再利用。
  function prepare() {
    if (ready || loading || failed) return;

    const ac = getContext();
    if (!ac) return;

    loading = true;

    Stage1BGM_0430.loadLibrary()
      .then(ABCJS => {
        if (!ABCJS.synth.supportsAudio()) {
          throw new Error(
            'abcjsの音声再生に非対応'
          );
        }

        const visualObjects =
          ABCJS.renderAbc('*', buildAbc());

        if (!visualObjects || !visualObjects[0]) {
          throw new Error(
            'ステージ3ボス楽譜の解析に失敗しました'
          );
        }

        const nextSynth =
          new ABCJS.synth.CreateSynth();

        return nextSynth.init({
          audioContext: ac,
          visualObj: visualObjects[0],
          options: {
            soundFontVolumeMultiplier: 0.65,
            chordsOff: true
          }
        })
        .then(() => nextSynth.prime())
        .then(result => ({
          nextSynth,
          result
        }));
      })
      .then(({ nextSynth, result }) => {
        synth = nextSynth;

        duration =
          result.duration || FALLBACK_DURATION;

        ready = true;
        playing = false;
        paused = false;
        position = 0;

        console.info(
          'Stage3BossBGM: 音源準備完了',
          duration
        );
      })
      .catch(error => {
        failed = true;

        console.warn(
          'Stage3BossBGM: 音源準備失敗',
          error
        );
      })
      .finally(() => {
        loading = false;
      });
  }

  function start() {
    if (!ready || !synth || playing) return;

    const ac = getContext();

    if (!ac || ac.state !== 'running') return;

    try {
      if (paused) {
        synth.resume();

        startedAt =
          ac.currentTime - position;
      } else {
        synth.start();

        startedAt = ac.currentTime;
        position = 0;
      }

      playing = true;
      paused = false;
    } catch (error) {
      console.warn(
        'Stage3BossBGM: 再生開始失敗',
        error
      );
    }
  }

  function stop(reset = false) {
    if (!synth || !ready) {
      playing = false;
      paused = false;

      if (reset) position = 0;

      return;
    }

    try {
      if (reset) {
        synth.stop();

        position = 0;
        paused = false;
      } else if (playing) {
        const ac = getContext();

        position = ac
          ? Math.max(
              0,
              ac.currentTime - startedAt
            )
          : 0;

        synth.pause();
        paused = true;
      }
    } catch (error) {
      console.warn(
        'Stage3BossBGM: 停止失敗',
        error
      );
    }

    playing = false;
  }

  function update() {
    if (!isAllowed()) {
      const reset = shouldReset();

      if (playing || (paused && reset)) {
        stop(reset);
      }

      return;
    }

    if (!ready) {
      prepare();
      return;
    }

    if (!playing) {
      start();
      return;
    }

    const ac = getContext();

    if (!ac || ac.state !== 'running') {
      return;
    }

    // 32小節・約47.4秒をループ再生。
    // 時間の基準は共用AudioContext。
    if (
      duration > 0 &&
      ac.currentTime - startedAt >= duration
    ) {
      try {
        synth.stop();
        synth.start();

        startedAt = ac.currentTime;
        position = 0;
        paused = false;
      } catch (error) {
        console.warn(
          'Stage3BossBGM: ループ再生失敗',
          error
        );

        playing = false;
      }
    }
  }

  return {
    update,
    stop,
    getAbc: buildAbc
  };
})();

      G.stage.id !== 4 ||
      !G.bossTriggered ||
      G.bossDown ||
      G.phase === 'title' ||
      G.phase === 'over' ||
      G.phase === 'clear' ||
      G.phase === 'ending'
    );
  }

  function buildAbc() {
    const lines = [
      'X:1',
      'T:' + TITLE,
      'M:4/4',
      'L:1/8',
      'Q:1/4=' + TEMPO,
      'K:Bm'
    ];

        ' name="' + voice.name + '"' +
        ' clef=' + voice.clef
      );

        '%%MIDI program ' + voice.program
      );

      // 反復は再生制御側に集約する。
      lines.push(voice.notes.trim());
    });

  }

    if (ready || loading || failed) return;

    const ac = getContext();
    if (!ac) return;

      .then(ABCJS => {
        if (!ABCJS.synth.supportsAudio()) {

            'abcjsの音声再生に非対応'
          );
        }

          ABCJS.renderAbc('*', buildAbc());

          );
        }

          new ABCJS.synth.CreateSynth();

          visualObj: visualObjects[0],
          options: {
            soundFontVolumeMultiplier: 0.65,
            chordsOff: true
          }
        })
        .then(() => nextSynth.prime())
        .then(result => ({
          nextSynth,
          result
        }));
      })
      .then(({ nextSynth, result }) => {
        synth = nextSynth;

        duration =
          result.duration || FALLBACK_DURATION;

        ready = true;
        playing = false;
        paused = false;
        position = 0;

        console.info(
          'Stage4BossBGM: 音源準備完了',
          duration
        );
      })
      .catch(error => {

          'Stage4BossBGM: 音源準備失敗',
          error
        );
      })
      .finally(() => {

      });

    const ac = getContext();
    if (!ac || ac.state !== 'running') return;

        startedAt = ac.currentTime;
        position = 0;
      }

      playing = true;
      paused = false;
    } catch (error) {
      console.warn(
        'Stage4BossBGM: 再生開始失敗',
        error
      );
    }
  }

      paused = false;

      return;
    }

    try {
      if (reset) {
        synth.stop();
        position = 0;
        paused = false;
      } else if (playing) {
        const ac = getContext();

        position = ac
          ? Math.max(0, ac.currentTime - startedAt)

        paused = true;
      }
    } catch (error) {
      console.warn(
        'Stage4BossBGM: 停止失敗',
        error
      );
    }

    playing = false;
  }

  function update() {
    if (!isAllowed()) {
      const reset = shouldReset();

      if (playing || (paused && reset)) {
        stop(reset);
      }

      return;
    }

    if (!ready) {
      prepare();
      return;
    }

    if (!playing) {
      start();
      return;
    }

    const ac = getContext();
    if (!ac || ac.state !== 'running') return;

    // 楽曲終端でループする。
    // ボスの段階変化による再起動は行わない。
    if (
      duration > 0 &&
      ac.currentTime - startedAt >= duration
    ) {
      try {
        synth.stop();
        synth.start();

        startedAt = ac.currentTime;
        position = 0;
        paused = false;
      } catch (error) {
        console.warn(
          'Stage4BossBGM: ループ再生失敗',
          error
        );

        playing = false;
      }
    }
  }

  return {
    update,
    stop,
    getAbc: buildAbc
  };
})();

/* ============================================================
 * BGMDirector
 *
 * BGM選択・切替の唯一の管理者。
 *
 * 第1フェーズ：
 * ・再生対象を一元判定
 * ・通常曲とボス曲の排他制御
 * ・一時停止・再開時の演奏状態維持
 * ・ステージ移行・死亡・エンディングへの対応
 *
 * 各楽曲のABCデータと音声合成処理は変更しない。
 * ============================================================ */
/* ============================================================
 * SharedBGMPlayer
 *
 * 8曲共通のabcjs再生エンジン。
 *
 * 責務：
 * ・ABC楽譜からの音源生成
 * ・非同期読み込みの競合防止
 * ・シンセサイザーの一元管理
 * ・再生、一時停止、再開、停止
 * ・楽曲終端でのループ
 *
 * 楽曲選択はBGMDirectorが担当する。
 * ============================================================ */
const SharedBGMPlayer = (() => {
  'use strict';

  const TRACKS = Object.freeze({
    stage1: Stage1BGM_0430,
    boss1: Stage1BossBGM,
    stage2: Stage2BGM,
    boss2: Stage2BossBGM,
    stage3: Stage3BGM,
    boss3: Stage3BossBGM,
    boss4: Stage4BossBGM,
    ending: EndingBGM
  });

  const AUDIO_OPTIONS = Object.freeze({
    soundFontVolumeMultiplier: 0.65,
    chordsOff: true
  });

  let currentKey = null;
  let synth = null;

  let ready = false;
  let loading = false;
  let playing = false;
  let paused = false;

  let duration = 0;
  let startedAt = 0;
  let position = 0;

  // 非同期処理の世代番号。
  // 曲が切り替わるたびに更新する。
  let generation = 0;

  // 初期化失敗後の再試行管理。
  // 毎フレームの無制限な再試行は行わない。
  let failedKey = null;
  let failedAt = 0;
  const RETRY_INTERVAL_MS = 10000;

  // 音源生成の失敗とは独立して、再生中のエラーを管理する。
  // 状態はSharedBGMPlayer内に閉じ込める。
  const MAX_PLAYBACK_FAILURES = 3;
  const PLAYBACK_RETRY_INTERVAL_MS = 3000;

  let playbackFailures = 0;
  let nextPlaybackRetryAt = 0;
  let playbackBlocked = false;

  function resetPlaybackFailures() {
    playbackFailures = 0;
    nextPlaybackRetryAt = 0;
    playbackBlocked = false;
  }

  function canAttemptPlayback() {
    if (playbackBlocked) return false;

    return performance.now() >= nextPlaybackRetryAt;
  }

  function recordPlaybackFailure(operation, error) {
    playing = false;

    playbackFailures++;

    const attempts = playbackFailures;

    console.warn(
      'SharedBGMPlayer: 再生処理失敗',
      {
        track: currentKey,
        operation: operation,
        attempt: attempts,
        maxAttempts: MAX_PLAYBACK_FAILURES,
        error: error
      }
    );

    if (attempts >= MAX_PLAYBACK_FAILURES) {
      playbackBlocked = true;
      nextPlaybackRetryAt = Infinity;

      console.warn(
        'SharedBGMPlayer: この再生セッションの再試行を停止',
        {
          track: currentKey,
          failures: attempts
        }
      );

      return;
    }

    const delay =
      PLAYBACK_RETRY_INTERVAL_MS * attempts;

    nextPlaybackRetryAt =
      performance.now() + delay;

    console.info(
      'SharedBGMPlayer: 再生再試行を予約',
      {
        track: currentKey,
        retryAfterMs: delay,
        nextAttempt: attempts + 1
      }
    );
  }

  function canRetry(key) {
    if (failedKey !== key) return true;

    const elapsed = performance.now() - failedAt;

    if (elapsed < RETRY_INTERVAL_MS) {
      return false;
    }

    failedKey = null;
    failedAt = 0;

    console.info(
      'SharedBGMPlayer: 音源準備を再試行',
      key
    );

    return true;
  }

  function getContext() {
    return Stage1BGM_0430.getAudioContext();
  }

  // iPhone SafariではAudioContextが中断されることがある。
  // 画面操作を契機に、既存Contextの再開だけを試みる。
  // 音源の再生成や楽曲変更は行わない。
  let resumePending = false;

  function resumeAudioOnGesture() {
    if (!currentKey) return;

    const ac = getContext();

    if (
      !ac ||
      ac.state === 'running' ||
      ac.state === 'closed' ||
      resumePending
    ) {
      return;
    }

    resumePending = true;

    // Safariのユーザー操作制限に対応するため、
    // Promiseのコールバックを経由せず、
    // イベントハンドラ内で直接resume()を呼ぶ。
    let result;

    try {
      result = ac.resume();
    } catch (error) {
      resumePending = false;

      console.warn(
        'SharedBGMPlayer: AudioContext再開失敗',
        error
      );

      return;
    }

    Promise.resolve(result)
      .then(() => {
        if (ac.state === 'running') {
          console.info(
            'SharedBGMPlayer: AudioContext再開'
          );
        } else {
          console.info(
            'SharedBGMPlayer: AudioContext再開待機',
            ac.state
          );
        }
      })
      .catch(error => {
        console.warn(
          'SharedBGMPlayer: AudioContext再開失敗',
          error
        );
      })
      .finally(() => {
        resumePending = false;
      });
  }

  // イベント登録はこの共通モジュール内で一度だけ行う。
  window.addEventListener(
    'pointerdown',
    resumeAudioOnGesture,
    { passive: true }
  );

  window.addEventListener(
    'touchstart',
    resumeAudioOnGesture,
    { passive: true }
  );

  window.addEventListener(
    'keydown',
    resumeAudioOnGesture
  );

  function reportError(message, error) {
    console.warn(
      'SharedBGMPlayer: ' + message,
      error
    );
  }

  function disposeSynth(target) {
    if (!target) return;

    try {
      target.stop();
    } catch (error) {
      reportError('音源停止失敗', error);
    }
  }

  /*
   * 楽曲データを取得する。
   *
   * 既存のABC楽譜は一切変更しない。
   * ステージ1の旧反復記号のみ、
   * 共通ループ管理と重複しないよう除去する。
   */
  function getAbc(key) {
    const track = TRACKS[key];

    if (
      !track ||
      typeof track.getAbc !== 'function'
    ) {
      throw new Error(
        'ABC楽譜を取得できません: ' + key
      );
    }

    const abc = track.getAbc();

    if (typeof abc !== 'string' || !abc.trim()) {
      throw new Error(
        'ABC楽譜が空です: ' + key
      );
    }

    if (key === 'stage1') {
      return abc
        .replace(/\|:/g, '|')
        .replace(/:\|/g, '|');
    }

    return abc;
  }

  /*
   * 曲変更時の完全リセット。
   *
   * 非同期準備中の処理も世代番号で無効化する。
   */
  function reset() {
    generation++;

    disposeSynth(synth);

    synth = null;
    currentKey = null;

    ready = false;
    loading = false;
    playing = false;
    paused = false;

    duration = 0;
    startedAt = 0;
    position = 0;

    // ステージ移行・曲変更・再挑戦などによる
    // 新しい再生セッションでは過去の再生失敗を引き継がない。
    resetPlaybackFailures();
  }

  /*
   * abcjsの音源準備。
   *
   * 同時に複数の楽曲を読み込まない。
   * 読み込み完了時に世代番号を確認する。
   */
  function prepare(key) {
    if (loading || ready || !key) return;
    if (!canRetry(key)) return;

    const ac = getContext();

    if (!ac) return;

    loading = true;

    const token = ++generation;

    let nextSynth = null;

    Promise.resolve()
      .then(() => Stage1BGM_0430.loadLibrary())
      .then(ABCJS => {
        if (generation !== token) return null;

        if (!ABCJS.synth.supportsAudio()) {
          throw new Error(
            'abcjsの音声再生に非対応'
          );
        }

        const abc = getAbc(key);

        // ABC楽譜の基本構造を確認。
        // 楽曲データや音符は変更しない。
        const voiceMatches =
          abc.match(/^V:\s*\S+/gm) || [];

        const midiMatches =
          abc.match(/^%%MIDI program\s+\d+/gm) || [];

        // 声部定義の書式には複数の形式があるため、
        // 正規表現による確認だけで演奏を禁止しない。
        // 実際の解析可否はabcjsへ委ねる。
        if (
          voiceMatches.length !== 8 ||
          midiMatches.length !== 8
        ) {
          console.warn(
            'SharedBGMPlayer: ABC声部構成を確認してください',
            {
              track: key,
              voices: voiceMatches.length,
              midiPrograms: midiMatches.length
            }
          );
        }

        const voiceIds = voiceMatches.map(
          line => line.replace(/^V:\s*/, '').trim()
            .split(/\s+/)[0]
        );

        if (
          new Set(voiceIds).size !== voiceIds.length
        ) {
          console.warn(
            'SharedBGMPlayer: ABC声部IDに重複があります',
            key
          );
        }

        const visuals =
          ABCJS.renderAbc('*', abc);

        if (!visuals || !visuals[0]) {
          throw new Error(
            'ABC楽譜の解析に失敗: ' + key
          );
        }

        const visualObj = visuals[0];

        // 実際の音声生成前に楽譜の情報を記録する。
        // 演奏品質の判定は実機で行う。
        console.info(
          'SharedBGMPlayer: ABC解析完了',
          {
            track: key,
            voices: voiceIds,
            midiPrograms: midiMatches.map(
              line => Number(
                line.replace(
                  /^%%MIDI program\s+/,
                  ''
                )
              )
            ),
            bpm:
              typeof visualObj.getBpm === 'function'
                ? visualObj.getBpm()
                : null
          }
        );

        nextSynth =
          new ABCJS.synth.CreateSynth();

        return nextSynth.init({
          audioContext: ac,
          visualObj: visuals[0],
          options: AUDIO_OPTIONS
        }).then(() => {
          if (generation !== token) {
            return null;
          }

          return nextSynth.prime();
        });
      })
      .then(result => {
        if (generation !== token) {
          disposeSynth(nextSynth);
          return;
        }

        if (!result || !nextSynth) {
          throw new Error(
            '音源の生成結果がありません'
          );
        }

        const actualDuration =
          Number(result.duration);

        if (
          !Number.isFinite(actualDuration) ||
          actualDuration <= 0
        ) {
          throw new Error(
            '演奏時間を取得できません: ' + key
          );
        }

        synth = nextSynth;
        duration = actualDuration;

        ready = true;
        loading = false;
        playing = false;
        paused = false;

        position = 0;
        startedAt = 0;

        console.info(
          'SharedBGMPlayer: 準備完了',
          key,
          duration
        );
      })
      .catch(error => {
        if (generation !== token) {
          disposeSynth(nextSynth);
          return;
        }

        disposeSynth(nextSynth);

        synth = null;
        ready = false;
        loading = false;
        playing = false;
        paused = false;

        failedKey = key;
        failedAt = performance.now();

        reportError(
          '音源準備失敗: ' + key,
          error
        );

        console.info(
          'SharedBGMPlayer: 再試行待機',
          {
            track: key,
            retryAfterMs: RETRY_INTERVAL_MS

  }

  /*
   * 新しい曲へ切り替える。
   *
   * 現在の音源を完全停止してから
   * 次の曲の準備を開始する。
   */
  function select(key) {
    if (currentKey === key) return;

    reset();

    currentKey = key;

    if (failedKey !== key) {
