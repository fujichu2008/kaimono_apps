<title>ぱわ原課長の朝は早い</title>
<!--
【実装内容】
・新規作成: 3Dアクション「ぱわ原課長の朝は早い」ステージ1（横浜の自宅 → 第一京浜 → 鶴見川橋 → 川崎 → 六郷橋）。
・ボス「多摩川ノ主（巨大アリゲーターガー）」を倒すと多摩川を渡れる。雑魚: 巨大カラス / 野犬 / イノシシ / 客引き / 自販機ミミック。
・攻撃: 鞄（近接）/ 喝（長押しで 罵倒1→2→3 に昇格、怒ゲージ消費。カラスやバリケードに有効）。
・ギミック: 放置自転車のペダルを回してスマホ充電 → ローカルLLM(AI)が自動迎撃・敵の減速・被ダメ半減 / 自販機を叩くと回復ドリンク /
  タイムレコーダー打刻(中間地点) / 瓦礫バリケード(罵倒2・3で破壊) / 崩落した橋(落下あり、敵も落とせる) / 進行に合わせて夜明けが進む空。
・操作: 左ドラッグで移動、右下の鞄・喝・投・跳・AI・漕で行動。画面上部の背景を二本指でひねると視点回転。PCは WASD/矢印、J/Space、K、I、U、L、E、P/Esc。
・喝（新仕様）: 短押し=「喝ッ！」（前方扇形・空中の敵も叩き落として気絶）/ 長押しして離す=罵倒Lv2(0.6秒)・Lv3(1.4秒)の音波を1発（命中で気絶付与、Lv3は周囲にも衝撃）。怒ゲージは発動時に一度だけ消費。
・巨大カラス（新仕様）: 予兆「カァッ」(0.6秒) → 記憶した地点へ直線急降下(追尾なし) → 外れると地面に刺さって1.4秒もがく(鞄が届く隙)。被弾すると気絶して地面へ落ちる。同時に急降下するのは1羽まで。

【制約条件】
・Three.js r128 をCDNから読み込む（ハムスケ大冒険と同じ版）。オフラインでは起動しない。
・createModelRenderer は本ゲームに既存定義が無いため、MODEL_SPEC_V1 互換の最小実装を1つだけ同梱した（「3. モデル表示」区画）。
  ModelStudio 正式版へ差し替える場合はこの区画を丸ごと置換する。ゲーム側が追加で使うのは stop() / anchor(id) / current() の3つ。
・モデルデータ MODEL_DATA_SALARYMAN_GLASSES_SUIT は受領したまま無変更。客引きは同データの色替え・部品非表示で生成。
・音声は未実装（指示どおり abcjs / AudioContext / 空関数は入れていない）。接続点は fireEvent(name) と setPhase(phase) の2か所のみ。
・ステージ追加は STAGES へデータを足す。新しい見た目が要る時だけ LANDMARKS / ENEMY_BUILD / BOSS_TYPES に関数を足す。

【改善提案】
・BGM: fireEvent の title / stageStart / bossStart / bossDown / clear / playerDown / pause / resume に playBgm(trackId) を対応させる。
・ステージ2（多摩川〜渋谷方面）、ステージ3（歌舞伎町）、CEO戦。ボス撃破ごとに罵倒スキルを解放する成長要素。
・実機で重い場合は CONFIG.render.pixelRatio と shadow を下げる。
-->

#pedalNeedle{position:absolute;inset:4px;border-radius:50%;pointer-events:none}
#pedalNeedle::before{content:"";position:absolute;top:2px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#e8f9ff}
#btnPedalBack{pointer-events:auto;min-width:92px;min-height:44px;border:1px solid #7df0ff;
  border-radius:8px;background:rgba(7,22,29,.86)}
body[data-pedaling="true"] :is(#pad,#stickZone,#barrierHint,#barks){display:none}

/* ---- オーバーレイ ---- */
#overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,7,13,.62)}
body[data-phase="pause"] #overlay,body[data-phase="over"] #overlay,body[data-phase="clear"] #overlay{display:flex}
#ovBig{font-size:clamp(40px,11vw,76px);font-weight:600;letter-spacing:.3em;margin-right:-.3em}
body[data-phase="over"] #ovBig{color:var(--shu)}
#ovSub{font-size:22px;letter-spacing:.15em;font-variant-numeric:tabular-nums;min-height:1em}
.ob{min-width:150px;padding:12px 22px;border:1px solid rgba(236,231,216,.7);font-size:18px;letter-spacing:.3em;background:rgba(0,0,0,.3)}
.ob:active{background:rgba(236,231,216,.2)}

/* ---- エンディング（会話劇 → 字幕ロール → 翌朝のオチ → 完） ---- */
#ending{position:fixed;inset:0;display:none;z-index:40;color:#f4efe0;overflow:hidden;pointer-events:auto}
body[data-phase="ending"] #ending{display:block}
#ending.talk{background:linear-gradient(180deg,rgba(5,7,13,0) 45%,rgba(5,7,13,.85))}
#ending.roll{background:linear-gradient(180deg,#2a3c6a 0%,#e8956a 62%,#ffd9a0 100%)}
#ending.dark{background:#05070d}
#endCaption{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(18px,5vw,26px);letter-spacing:.3em;white-space:nowrap;text-shadow:0 2px 8px #000}
#endBox{position:absolute;left:50%;bottom:max(8vh,calc(env(safe-area-inset-bottom) + 30px));transform:translateX(-50%);width:min(92vw,560px);
  padding:14px 18px 10px;border:1px solid rgba(236,231,216,.5);border-radius:10px;background:rgba(8,10,16,.84)}
#endName{font-size:13px;letter-spacing:.2em;color:#e8c36a;margin-bottom:6px}
#endText{font-size:clamp(17px,4.6vw,22px);line-height:1.6}
#endHint{display:block;margin-top:6px;text-align:right;font-size:11px;opacity:.55;letter-spacing:.15em}
#endRoll{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:clamp(15px,4vw,19px);line-height:2;letter-spacing:.15em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#endRoll.run{animation:endRoll 16s linear forwards}
#endRoll b{display:block;font-size:12px;letter-spacing:.3em;opacity:.8;font-weight:400}
@keyframes endRoll{from{transform:translateY(0)}to{transform:translateY(calc(-100% - 100vh))}}
#endStamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg);padding:8px 26px;border:5px solid var(--shu);color:var(--shu);
  font-size:64px;font-weight:700;opacity:0;background:rgba(8,10,16,.35)}
#endStamp.on{animation:endStamp .9s ease-out forwards}
@keyframes endStamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
#endBtn{position:absolute;left:50%;bottom:max(8vh,calc(env(safe-area-inset-bottom) + 30px));transform:translateX(-50%)}

/* ---- 初回だけの操作ガイド・掛け合いの字幕（プレイ中だけ表示） ---- */
#tipBar{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 108px);transform:translate(-50%,-8px);max-width:92vw;
  padding:8px 16px;border-radius:999px;background:rgba(216,67,43,.92);color:#fff;font-weight:700;font-size:clamp(14px,3.8vw,18px);
  text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#tipBar.on{opacity:1;transform:translate(-50%,0)}
#talkBar{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 150px);transform:translateX(-50%);width:min(92vw,560px);
  padding:6px 14px;border-radius:8px;background:rgba(8,10,16,.72);color:#f4efe0;font-size:clamp(14px,3.8vw,17px);line-height:1.5;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:24}
#talkBar.on{opacity:1}
#talkName{color:#e8c36a;font-size:12px;letter-spacing:.15em;margin-right:8px}
body:not([data-phase="play"]) #tipBar,body:not([data-phase="play"]) #talkBar{display:none}
</style>
</head>

const FX = (function () {
  const N = 520, ps = [], pos = new Float32Array(N * 3), col = new Float32Array(N * 4), size = new Float32Array(N);
  for (let i = 0; i < N; i++) ps.push({ l: 0, m: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, g: 0, c: WHITE, s: 0 });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 4));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uScale: PT_SCALE }, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
    vertexShader: 'attribute float aSize;attribute vec4 aColor;varying vec4 vC;uniform float uScale;void main(){vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale/max(-mv.z,0.1);gl_Position=projectionMatrix*mv;}',
    fragmentShader: 'varying vec4 vC;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.05,d);gl_FragColor=vec4(vC.rgb*a*vC.a,1.0);}'
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  let cursor = 0;
  const C = {};
  return {
    color(hex) { return C[hex] || (C[hex] = LC(hex)); },
    // o: {n,color,speed,life,size,g,spread,up}
    emit(x, y, z, o) {
      const n = o.n || 8, c = typeof o.color === 'string' ? this.color(o.color) : o.color;
      for (let k = 0; k < n; k++) {
        const p = ps[cursor]; cursor = (cursor + 1) % N;
        const a = Math.random() * 6.283, sp = (o.speed || 3) * (0.35 + Math.random() * 0.8), sr = o.spread || 0;
        p.x = x + (Math.random() - 0.5) * sr; p.y = y + (Math.random() - 0.5) * sr * 0.5; p.z = z + (Math.random() - 0.5) * sr;
        p.vx = Math.cos(a) * sp; p.vz = Math.sin(a) * sp; p.vy = (Math.random() * 0.9 + 0.2) * sp * (o.up == null ? 1 : o.up);
        p.l = p.m = (o.life || 0.6) * (0.6 + Math.random() * 0.7); p.g = o.g == null ? 9 : o.g; p.c = c; p.s = (o.size || 0.25) * (0.6 + Math.random() * 0.8);
      }
    },
    update(dt) {
      for (let i = 0; i < N; i++) {
        const p = ps[i];
        if (p.l > 0) {
          p.l -= dt; p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          const a = Math.max(0, p.l / p.m);
          pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
          col[i * 4] = p.c.r; col[i * 4 + 1] = p.c.g; col[i * 4 + 2] = p.c.b; col[i * 4 + 3] = a; size[i] = p.s;
        } else size[i] = 0;

    }

})();

// 呂律が回らない話し方へ変換（ほろ酔い中の課長の吹き出し用）
function slur(text) {
  const map = { 'す': 'しゅ', 'さ': 'しゃ', 'そ': 'しょ', 'せ': 'しぇ', 'ら': 'りゃ', 'る': 'りゅ', 'れ': 'りぇ', 'ろ': 'りょ', 'だ': 'ら' };
  let out = '';
  for (const ch of text) out += map[ch] && Math.random() < 0.6 ? map[ch] : ch;
  out = out.replace(/[。！]$/, '');
  return out + (Math.random() < 0.5 ? '〜ひっく' : 'ぅ〜');
}

const Barks = (function () {
  const host = $('barks'), pool = [];
  for (let i = 0; i < 6; i++) { const el = document.createElement('div'); el.className = 'bark'; host.appendChild(el); pool.push({ el, t: 0, obj: null, v: new THREE.Vector3() }); }
  return {
    say(obj, text, cls, dur, priority = false) {
      if (!obj) return;
      if (Player.drunk > 0 && Player.hero && obj === Player.hero.anchor('head_top')) text = slur(text);
      const current = pool.find(q => q.obj === obj && q.t > 0);
      // 露出通知を表示している間も、Talkの字幕帯は通常どおり進む。
      if (current && current.priority && !priority) return;
      const b = current || pool.find(q => q.t <= 0) || pool.find(q => !q.priority);
      if (!b) return;
      b.priority = priority;
      b.obj = obj; b.t = dur || 1.4; b.el.textContent = text; b.el.className = 'bark ' + (cls || ''); b.el.style.display = 'block';
    },
    clear() { pool.forEach(b => { b.t = 0; b.el.style.display = 'none'; }); },
    busy(obj) { return pool.some(b => b.obj === obj && b.t > 0); },
    update(dt) {
      for (const b of pool) {
        if (b.t <= 0) continue;
        b.t -= dt;
        if (b.t <= 0) { b.el.style.display = 'none'; continue; }
        b.obj.getWorldPosition(b.v); b.v.project(camera);
        if (b.v.z > 1) { b.el.style.opacity = 0; continue; }
        b.el.style.opacity = Math.min(1, b.t * 3);
        b.el.style.transform = 'translate(-50%,-110%) translate(' + ((b.v.x * 0.5 + 0.5) * window.innerWidth).toFixed(1) + 'px,' + ((-b.v.y * 0.5 + 0.5) * window.innerHeight).toFixed(1) + 'px)';
      }
    }
  };
})();

/* ============================================================
 * 7. ワールド（街の生成・当たり判定・置き物）
 *    ZONES: 区間の種類ごとの街並み / LANDMARKS: 名所 / make〜: 動く置き物
 * ============================================================ */
const Pawahara = {
  time: 0, next: 0, lastAt: -Infinity, lastText: '',
  previous: {}, encounters: {}, hints: {}, pending: null,
  reset() {
    this.time = 0;
    this.next = 0;
    this.lastAt = -Infinity;
    this.lastText = '';
    this.previous = {};
    this.encounters = {};
    this.hints = {};
    this.spots = {};
    this.pending = null;
  },
  // 平常時のぼやき。酔っている時は酔いの独り言、ステージ専用のぼやきも混ぜる。
  grumbleKey() {
    if (Player.truck && Player.truck.rampage) return Player.truck.train ? 'trainRampage' : 'busRampage';
    if (Player.drunk > 0 && Math.random() < 0.6) return 'drunkTalk';
    if (Flags.count() >= 3 && Math.random() < 0.25) return 'bondGrumble';   // 部下の本音を知った課長
    const k = G.stage && G.stage.lineKeys && G.stage.lineKeys.grumble;
    return k && Math.random() < 0.55 ? k : 'grumble';
  },
  request(key, priority = 1) {
    if (!LINES.pawahara[key]) return;
    if (this.pending && this.pending.priority > priority) return;
    this.pending = {
      key, priority, expires: this.time + CONFIG.chatter.pendingLife
    };
  },
  onEvent(name) {
    if (name === 'retry' || name === 'title' || name === 'playerDown') {
      this.reset();
      return;
    }
    const map = G.stage && G.stage.lineKeys, key = (map && map[name]) || name;
    if (LINES.pawahara[key]) this.request(key, 2);
  },
  update(dt) {
    const P = Player, cfg = CONFIG.chatter;
    if (G.phase !== 'play') return;
    this.time += dt;
    if (this.pending && this.pending.expires < this.time) this.pending = null;
    if (P.dead || P.falling || P.bike) return;

    // 名所に差しかかったら、その場所ならではの独り言を予約する。
    // 再開時などで既に通り過ぎた地点は、黙って既読にする。
    for (const s of G.stage.talks || []) {
      if (this.spots[s.z] || P.z < s.z) continue;
      this.spots[s.z] = true;
      if (P.z - s.z < 12) { this.request(s.key, 2); break; }
    }

    // 難敵に近づいたら、まず観察の独り言を予約する。
    // 一段階目を実際に話してから数秒後、対策の独り言を予約する。
    // アイテム取得など優先度3の台詞は上書きしない。
    if (!this.pending || this.pending.priority < 2) {
      for (const e of Enemies.list) {
        if (e.dead || e.st === 'dormant') continue;
        const rule = ENEMY_HINTS[e.type];
        if (!rule) continue;

        const progress = this.hints[e.type] || { step: 0, next: 0 };
        if (progress.step >= rule.lines.length || this.time < progress.next) continue;
        if (Math.hypot(e.x - P.x, e.z - P.z) > rule.range) continue;

        this.request(rule.lines[progress.step], 2);
        break;
      }
    }

    if (!this.pending && this.time >= this.next) {
      let nearest = null, distance = cfg.encounterRange;
      for (const e of Enemies.list) {
        if (e.dead || e.st === 'dormant' || !LINES.pawahara[e.type]) continue;
        if (this.time < (this.encounters[e.type] || 0)) continue;
        const d = Math.hypot(e.x - P.x, e.z - P.z);
        if (d < distance) { nearest = e; distance = d; }
      }
      if (nearest) {
        this.encounters[nearest.type] = this.time + cfg.encounterGap;
        this.request(nearest.type);
      } else if (!Boss.active) {
        // 敵との遭遇がない時は、課長の日常的な愚痴やぼやきを流す。
        // ボス戦中は通常の独り言を抑え、戦闘の台詞を優先する。
        this.request(this.grumbleKey());
      }
    }

    const pending = this.pending;
    if (!pending || P.state === 'shout' || P.state === 'shoutRecover') return;
    if (pending.priority < 2 && this.time < this.next) return;
    if (this.time - this.lastAt < cfg.urgentGap) return;
    const anchor = P.hero.anchor('head_top');
    // 喝・ボス予兆・拾得表示が終わってから呟く。
    if (Barks.busy(anchor)) return;

    let key = pending.key;
    if (pending.priority === 1 && Math.random() < cfg.catchphraseChance) {
      // 複数の決め台詞から選択し、同じ一言への偏りを抑える。
      key = 'catchphrase';
    }
    const lines = LINES.pawahara[key];
    let choices = lines.filter(line => line !== this.previous[key] && line !== this.lastText);
    if (!choices.length) choices = lines;
    const text = pick(choices);
    this.previous[key] = text;
    this.lastText = text;
    this.lastAt = this.time;
    this.next = this.time + cfg.gap + Math.random() * cfg.jitter;
    this.pending = null;

    // つぶやいた段階だけを進める。
    // 表示待ちの台詞が他イベントで消えても、ヒントを飛ばさない。
    let isHint = false;
    for (const type in ENEMY_HINTS) {
      const rule = ENEMY_HINTS[type];
      const index = rule.lines.indexOf(key);
      if (index < 0) continue;
      this.hints[type] = {
        step: index + 1,
        next: this.time + rule.delay
      };
      isHint = true;
      break;
    }

    Barks.say(anchor, text, isHint ? 'hint' : 'rage',
      isHint ? 2.8 : cfg.duration);
  }
};

const CHUNK = 70, BLUE = '#1d4fa6', MINCHO = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
const World = {
  root: null, dyn: null, builders: {}, colliders: [], zones: [], stage: null,
  vendings: [], bikes: [], checkpoints: [], barricades: [], pickups: [], throwables: [], flares: [],
  grassMat: null, flyMat: null, timeU: { value: 0 },

  b(key, z) { const k = key + '|' + Math.floor(z / CHUNK); return this.builders[k] || (this.builders[k] = new GeoBuilder()); },
  zoneAt(z) { for (const zn of this.zones) if (z >= zn.z0 && z < zn.z1) return zn; return null; },
  onGround(x, z) {

  halfWidthAt(z) { const zn = this.zoneAt(z); return (zn && zn.halfWidth) || this.stage.halfWidth; },
  addCollider(x0, x1, z0, z1) { const c = { x0, x1, z0, z1, active: true }; this.colliders.push(c); return c; },
  // 歩ける立体（階段・デッキ・ランプ）。y0→y1 は z0→z1 方向の傾き。

  surfTop(s, z) { return lerp(s.y0, s.y1, clamp((z - s.z0) / ((s.z1 - s.z0) || 1), 0, 1)); },
  groundAt(x, z, curY) {

    for (const s of this.surfaces) {
      if (x < s.x0 || x > s.x1 || z < s.z0 || z > s.z1) continue;
      const top = this.surfTop(s, z);
      if (top <= curY + 0.65) { if (top >= y) { y = top; rails = !!s.rails; } }
      else if (!s.under || curY > top - 2.6) blocked = true;   // 高すぎる段差は壁
    }
    return { y, blocked, rails };
  },
  // 円(o.x,o.z,r)を障害物から押し出す。押されたら true
  collide(o, r, onHit) {
    let hit = false;
    for (const c of this.colliders) {
      if (!c.active || o.z < c.z0 - r || o.z > c.z1 + r || o.x < c.x0 - r || o.x > c.x1 + r) continue;
      // 高さ付きの障害物：高所にいる時は下の柱を無視し、高架上の物は地上では無視する
      const fy = o.floorY || 0;
      if ((c.h != null && fy >= c.h - 0.3) || (c.y0 != null && fy < c.y0 - 0.5) || (c.noPlayer && o === Player)) continue;
      const cx = clamp(o.x, c.x0, c.x1), cz = clamp(o.z, c.z0, c.z1), dx = o.x - cx, dz = o.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;

      if (d2 > 1e-8) { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.z = cz + dz / d * r; }
      else {
        const l = o.x - c.x0, rr = c.x1 - o.x, f = o.z - c.z0, bk = c.z1 - o.z, m = Math.min(l, rr, f, bk);
        if (m === l) o.x = c.x0 - r; else if (m === rr) o.x = c.x1 + r; else if (m === f) o.z = c.z0 - r; else o.z = c.z1 + r;
      }

  build(stage) {
    if (this.root) {
      scene.remove(this.root); const shared = Object.values(GEO);
      this.root.traverse(o => {
        if (o.geometry && shared.indexOf(o.geometry) < 0) o.geometry.dispose();
        // ステージ固有の看板・広告などの素材を解放する。

    this.propertyAgent = null;
    const rng = mulberry(stage.seed);
    stage.zones.forEach(zn => ZONES[zn.kind](zn, stage, rng));
    stage.landmarks.forEach(l => LANDMARKS[l.type](l, stage, rng));

      const key = k.split('|')[0], m = new THREE.Mesh(this.builders[k].build(), MAT[key]);
      m.receiveShadow = true; m.castShadow = key !== 'road' && key !== 'ground' && key !== 'ivy' && key !== 'paving' && key !== 'lattice' && key !== 'neon' && key !== 'carpet';
      this.root.add(m);

  },

  // 壊れる・減る置き物だけを作り直す（最初からやり直す時に呼ぶ）

  dropThrowable(type, x, z) {

    const g = makeThrowable(type);
    g.position.set(x, 0.24, z);
    g.rotation.y = Math.random() * Math.PI * 2;
    this.dyn.add(g);
    this.throwables.push({ type, x, z, g });
  },
  nearestThrowable(x, z, range) {

  },
  takeThrowable(item) {

    return true;

  dropItem(type, x, z, y) {

    const g = makePickup(type); g.position.set(x, 0.7 + y, z); this.dyn.add(g);
    this.pickups.push({ type, x, z, y, g, t: Math.random() * 6 });
  },
  hitVending(v) {
    v.shake = 0.45; FX.emit(v.x, 1.2, v.z, { n: 8, color: '#ffd9a0', speed: 3, life: 0.4, size: 0.2 });
    if (v.left <= 0) return;
    v.left--;
    const spot = { x: v.x - Math.sign(v.x) * 1.8, z: v.z };
    this.collide(spot, 0.5);
    this.dropItem(v.beer ? 'beer' : 'vendingEnergy', spot.x, spot.z);
  },
  hitBarricade(b, lv) {

    const effective = true;
    const damage = b.hp;

    b.hp = Math.max(0, b.hp - damage);
    b.shake = effective ? 0.65 : 0.25;

    FX.emit(0, 1.5, b.z - 1.4, {
      n: effective ? 28 : 12,
      color: effective ? '#ffb070' : '#8a8a8a',
      speed: effective ? 7 : 3.5,
      life: 0.55,
      size: 0.3,
      spread: 12
    });

    if (b.hp > 0) {
      const msg = effective
        ? '効いている！ あと' + Math.ceil(b.hp / 55) + '撃！'
        : 'もっと溜めろ！ Lv' + b.need + 'が必要！';

      Barks.say(Player.hero.anchor('head_top'),
        msg, 'rage', 1.25);

      if (effective) {
        G.shake = Math.max(G.shake, 0.23);
        G.hitstop = Math.max(G.hitstop, 0.045);
      }

      return true;
    }

    // HPが0になった時点で見た目と当たり判定を同時に無効化する。
    b.alive = false;
    b.hp = 0;
    b.c.active = false;
    b.g.visible = false;
    b.shake = 0;

    G.shake = Math.max(G.shake, 0.7);
    G.hitstop = Math.max(G.hitstop, 0.09);

    FX.emit(0, 1.2, b.z, {
      n: 70, color: '#c9b8a0',
      speed: 9, life: 1.1,
      size: 0.45, spread: 15
    });

    FX.emit(0, 1.2, b.z, {
      n: 30, color: '#6f9a48',
      speed: 7, life: 1.3,
      size: 0.35, spread: 15, g: 4
    });

    Barks.say(Player.hero.anchor('head_top'),
      '突破成功！', 'rage', 1.6);
    Pawahara.request('truckBreak', 2);

    return true;
  },

  updateBikeLamp(b, dt) {
    b.glow = Math.max(0, b.glow - dt * 2.5);
    b.lampMat.emissive.setRGB(b.glow * 0.55, b.glow * 0.9, b.glow);
  },

  update(dt) {
    const P = Player, t = G.time;
    const canPickUp = !P.dead && P.grounded && !P.truck;
    for (const t of this.trucks || []) {
      t.glow.visible = !t.broken && P.truck !== t;
      t.glow.material.opacity = 0.35 + Math.sin(G.time * 2.5) * 0.15;
    }
    const a = this.propertyAgent;
    if (a && !a.said && !P.dead && Math.hypot(P.x - a.x, P.z - a.z) < a.reach) {
      a.said = true;
      a.hero.object.rotation.y = Math.atan2(P.x - a.x, P.z - a.z);
      Barks.say(a.hero.anchor('head_top'), a.line, 'tout', 2.5);
    }
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i]; p.t += dt; p.g.position.y = 0.7 + (p.y || 0) + Math.sin(p.t * 3) * 0.12; p.g.rotation.y += dt * 2;
      if (canPickUp && Math.abs(P.floorY - (p.y || 0)) < 1.5 && Math.hypot(P.x - p.x, P.z - p.z) < 1.15 && P.takeItem(p.type)) {
        const color = CONFIG.items[p.type].color || (p.type === 'coffee' ? '#ffd08a' : '#b4ff8a');
        FX.emit(p.x, 1, p.z, { n: 14, color, speed: 3, life: 0.6, size: 0.25, g: -2 });
        this.dyn.remove(p.g); this.pickups.splice(i, 1);
      }
    }
    // 道路の落下物は接近すると自動回収し、投擲ストックへ加える。
    // 回収した物体だけをワールドから取り除く。
    if (canPickUp && P.floorY < 1 && P.throwStock.length < CONFIG.throw.stockMax) {
      for (let i = this.throwables.length - 1; i >= 0; i--) {
        if (P.throwStock.length >= CONFIG.throw.stockMax) break;
        const item = this.throwables[i];
        if (Math.hypot(P.x - item.x, P.z - item.z) >= CONFIG.throw.pickupRange) continue;
        if (!P.takeThrowable(item.type)) break;
        if (!this.takeThrowable(item)) {
          P.throwStock.pop();
          continue;
        }
        FX.emit(item.x, 0.45, item.z, {
          n: 9, color: CONFIG.throw.types[item.type].color,
          speed: 2.5, life: 0.45, size: 0.18, g: -1
        });
        Barks.say(P.hero.anchor('head_top'),
          CONFIG.throw.types[item.type].name + ' ×' + P.throwStock.length,
          '', 0.7);
      }
    }
    for (const v of this.vendings) if (v.shake > 0) { v.shake = Math.max(0, v.shake - dt); v.g.rotation.z = Math.sin(v.shake * 50) * 0.14 * v.shake; }
    for (const b of this.barricades) if (b.shake > 0) { b.shake = Math.max(0, b.shake - dt); b.g.position.x = Math.sin(b.shake * 60) * 0.25 * b.shake; }
    for (const b of this.bikes) this.updateBikeLamp(b, dt);
    for (const s of this.flares) s.scale.set(16 + Math.sin(t * 9) * 2 + Math.sin(t * 23), 22 + Math.sin(t * 13) * 3, 1);
    // 高層建築の航空障害灯（共有素材を一括で点滅）
    if (MAT.beacon) MAT.beacon.opacity = Math.sin(t * 2.6) > 0.35 ? 1 : 0.12;
    // バスに跳ね飛ばされた廃車
    for (const s of this.smash || []) {
      if (!s.fly || !s.g.visible) continue;
      s.t += dt; s.vy -= 22 * dt; s.x += s.vx * dt; s.z += s.vz * dt;
      s.g.position.set(s.x, Math.max(0, s.g.position.y + s.vy * dt), s.z);
      s.g.rotation.x += s.spin * dt; s.g.rotation.z += s.spin * 0.6 * dt;
      if (s.t > 2.4) s.g.visible = false;
    }
  }
};

/* ---- 街の部品 ---- */
function reserved(stage, z, m) {

  if (stage.clearRoad && stage.clearRoad.some(r => z > r[0] && z < r[1])) return true;
  const near = a => a.some(o => Math.abs((Array.isArray(o) ? o[2] : o.z) - z) < m);
  return near(stage.checkpoints) || near(stage.barricades) || near(stage.pickups) || near(stage.bikes) || near(stage.vendings) ||
    stage.landmarks.some(l => (l.type === 'arch' || l.type === 'footbridge') && Math.abs(l.z - z) < m);
}
function groundStrip(z0, z1) {

    World.b('ground', zm).top(9, 110, 0, z, zb, 17, (zb - z) / 6, WHITE, 0, -zb / 6);
    World.b('ground', zm).top(-110, -9, 0, z, zb, 17, (zb - z) / 6, WHITE, 0, -zb / 6);
  }
}
function tree(x, z, s, rng) {

  part(B, P, GEO.cylT, [0, 2.1, 0], [0.55, 4.2, 0.55], COL.bark);
  for (let i = 0; i < n; i++) part(B, P, GEO.sphLo, [(rng() - 0.5) * 2.6, 4 + rng() * 2.8, (rng() - 0.5) * 2.6], [2.2 + rng() * 1.8, 1.7 + rng() * 1.3, 2.2 + rng() * 1.8], pick(COL.leaf, rng()));
}
function gableRoof(x0, x1, h, z0, z1, rise, col, wallCol, zm) {
  const R = World.b('roof', zm), W = World.b('matte', zm), zc = (z0 + z1) / 2, hr = h + rise, uw = (x1 - x0) / 3, uh = (z1 - z0) / 6;
  R.quad([x1, h, z0], [x0, h, z0], [x0, hr, zc], [x1, hr, zc], uw, uh, col, col);
  R.quad([x0, h, z1], [x1, h, z1], [x1, hr, zc], [x0, hr, zc], uw, uh, col, col);
  W.quad([x0 + 0.5, h, z0 + 0.4], [x0 + 0.5, h, z1 - 0.4], [x0 + 0.5, hr - 0.2, zc], [x0 + 0.5, hr - 0.2, zc], 1, 1, wallCol, wallCol);
  W.quad([x1 - 0.5, h, z1 - 0.4], [x1 - 0.5, h, z0 + 0.4], [x1 - 0.5, hr - 0.2, zc], [x1 - 0.5, hr - 0.2, zc], 1, 1, wallCol, wallCol);
}
function house(side, z0, z1, rng) {
  const d = 7.5 + rng() * 2.5, near = side * (11.6 + rng() * 1.6), xa = side > 0 ? near : near - d, xb = side > 0 ? near + d : near, h = 5.4 + rng() * 1.2, zm = (z0 + z1) / 2;
  const tint = LC(pick(['#d8d0c0', '#c9c2b4', '#b9c0c4', '#d2c4b0', '#bdb7a6'], rng())), lo = tint.clone().multiplyScalar(0.55).lerp(COL.moss, 0.35);
  World.b('house', zm).wallBox(xa, xb, 0, h, z0, z1, 4, 3, lo, tint);
  gableRoof(xa - 0.5, xb + 0.5, h, z0 - 0.4, z1 + 0.4, 2 + rng() * 0.8, pick(COL.roofTile, rng()), tint, zm);

function building(side, near, z0, z1, d, h, rng, back) {
  const xa = side > 0 ? near : near - d, xb = side > 0 ? near + d : near, zm = (z0 + z1) / 2, key = pick(['facadeA', 'facadeB', 'facadeC'], rng());
  const g = 0.72 + rng() * 0.28, tint = new THREE.Color(g, g * (0.96 + rng() * 0.06), g * (0.94 + rng() * 0.1)), lo = tint.clone().multiplyScalar(0.5).lerp(COL.moss, 0.3);
  const hh = Math.max(2, Math.round(h / 3.4)) * 3.4;
  World.b(key, zm).wallBox(xa, xb, 0, hh, z0, z1, 8, 6.8, lo, tint);
  World.b('roof', zm).top(xa, xb, hh, z0, z1, (xb - xa) / 5, (z1 - z0) / 5, COL.roof);
  if (back) return;

  if (rng() < 0.6) part(M, null, GEO.cyl, [lerp(xa, xb, 0.3 + rng() * 0.4), hh + 1.1, lerp(z0, z1, 0.3 + rng() * 0.4)], [2, 2.2, 2], COL.concrete);
  if (rng() < 0.5) part(M, null, GEO.sphLo, [side > 0 ? xa + 1 : xb - 1, hh + 0.4, lerp(z0, z1, rng())], [3 + rng() * 2, 1.6 + rng(), 3 + rng() * 2], pick(COL.leaf, rng()));
  const fx = side > 0 ? xa - 0.07 : xb + 0.07, n = 1 + ((rng() * 3) | 0);

    const za = lerp(z0, z1, rng() * 0.6), zb = Math.min(z1, za + 2.5 + rng() * 7), ih = Math.min(hh, 3 + rng() * hh * 0.75), uo = rng();
    if (side > 0) I.quad([fx, 0, za], [fx, 0, zb], [fx, ih, zb], [fx, ih, za], (zb - za) / 4, ih / 4, COL.ivyLo, COL.ivyHi, uo, 0);
    else I.quad([fx, 0, zb], [fx, 0, za], [fx, ih, za], [fx, ih, zb], (zb - za) / 4, ih / 4, COL.ivyLo, COL.ivyHi, uo, 0);
  }
  if (rng() < 0.45) {
    const xw = lerp(xa, xb, rng() * 0.5), xe = Math.min(xb, xw + 3 + rng() * 6), ih = Math.min(hh, 4 + rng() * hh * 0.6);
    I.quad([xe, 0, z0 - 0.07], [xw, 0, z0 - 0.07], [xw, ih, z0 - 0.07], [xe, ih, z0 - 0.07], (xe - xw) / 4, ih / 4, COL.ivyLo, COL.ivyHi, rng(), 0);
  }
  if (hh > 9 && rng() < 0.55) part(M, null, GEO.box, [side > 0 ? xa - 0.6 : xb + 0.6, 5 + rng() * 3, lerp(z0, z1, 0.2 + rng() * 0.6)], [1.0, 3.2 + rng() * 2, 0.25], pick(COL.car, rng()));
}
function carParts(B, G2, P, col, kind, rng) {

    part(B, P, GEO.box, [0, 1.75, 0], [2.5, 2.7, 10.4], col); part(G2, P, GEO.box, [0, 2.25, 0], [2.54, 0.95, 9.7], COL.glass);
    part(B, P, GEO.box, [0, 0.75, 0], [2.52, 0.25, 10.42], COL.white);

    part(B, P, GEO.sphLo, [(rng() - 0.5) * 1.5, 3.15, (rng() - 0.5) * 6], [2.2, 0.5, 3.4], COL.moss);

    part(B, P, GEO.box, [0, 1.43, -0.25], [1.62, 0.07, 2.1], col); part(B, P, GEO.box, [0, 0.5, 2.16], [1.5, 0.2, 0.06], COL.dark);
    [[-0.86, 1.35], [0.86, 1.35], [-0.86, -1.4], [0.86, -1.4]].forEach((w, i) => part(B, P, GEO.cyl, [w[0], flat && i < 2 ? 0.26 : 0.33, w[1]], [0.66, 0.24, 0.66], COL.tire, [0, 0, 1.5708]));
    if (rng() < 0.6) part(B, P, GEO.sphLo, [(rng() - 0.5) * 0.8, 0.98, 1.3 + (rng() - 0.5) * 0.6], [1.3, 0.25, 1.2], COL.moss);
  }
}
function scatterCars(stage, rng) {
  const lanes = [-5.1, -1.8, 1.8, 5.1];
  stage.zones.forEach(zn => {
    if (zn.kind === 'river' || zn.kind === 'office') return;   // 川・屋内には放置車両を置かない
    const res = zn.kind === 'residential';
    for (let z = Math.max(zn.z0, 14) + rng() * 8; z < Math.min(zn.z1, stage.goalZ + 40) - 6; z += res ? (24 + rng() * 22) : (10 + rng() * 10)) {
      if (reserved(stage, z, 7)) continue;
      const bus = !res && rng() < 0.14, x = res ? (rng() < 0.5 ? 7.2 : -7.2) : pick(lanes, rng()) + (rng() - 0.5) * 0.8;
      const ry = (bus ? (rng() - 0.5) * 0.5 : (rng() < 0.2 ? 1.2 + rng() * 0.8 : (rng() - 0.5) * 0.5)) + (rng() < 0.5 ? Math.PI : 0);
      const L = bus ? 10.4 : 4.3, W = bus ? 2.5 : 1.8, ex = (Math.abs(Math.sin(ry)) * L + Math.abs(Math.cos(ry)) * W) / 2, ez = (Math.abs(Math.cos(ry)) * L + Math.abs(Math.sin(ry)) * W) / 2;
      if (World.colliders.some(c => x - ex < c.x1 + 1.1 && x + ex > c.x0 - 1.1 && z - ez < c.z1 + 1.1 && z + ez > c.z0 - 1.1)) continue;
      carParts(World.b('matte', z), World.b('gloss', z), M4(x, 0, z, ry), pick(COL.car, rng()), bus ? 'bus' : 'car', rng);
      World.addCollider(x - ex, x + ex, z - ez, z + ez).kind = 'vehicle';

}

          if (Math.hypot(P.x - m.x, P.z - m.z) < c.bombR && P.floorY < 2) P.damage(c.bombDmg, m.x, m.z, 6);
          scene.remove(m.s); e.mines.splice(i, 1);
        }
      }
      e.face = angLerp(e.face, toP, Math.min(1, dt * 5));
      switch (e.st) {
        case 'wait':
          e.dmgMul = 0; ch.setSpeed(0);
          if (d < c.notice && !P.dead) {
            e.st = 'intro'; e.t = 0; e.lock = true;
            G.lock = { z0: e.z - c.arenaBack, z1: e.z + c.arenaFront };

            Talk.play(LINES.damemuraTalk.intro, head);
          }
          break;
        case 'intro':
          e.dmgMul = 0; ch.setSpeed(0);
          if (e.t > c.introTime) { e.st = 'idle'; e.t = 0; e.cd = 1; }
          break;
        case 'recover': // 正体が見えている（気絶・管理職アクションが通る）
          ch.setSpeed(0);
          e.updateExposure(dt);
          break;
        case 'wind': // 予兆 → 攻撃
          ch.setSpeed(0);
          if (e.t > c.wind) {
            if (e.next === 'someone') { // 誰かがやります：出どころの分からない言葉が四方から飛んでくる
              const n = e.hp < e.def.hp * 0.5 ? 6 : 4;
              for (let i = 0; i < n; i++) {
                const a = Math.random() * 6.283, sx = clamp(P.x + Math.sin(a) * 9, -9, 9), sz = P.z + Math.cos(a) * 9;
                const ux = P.x - sx, uz = P.z - sz, ul = Math.hypot(ux, uz) || 1;
                Shots.fire(sx, 1.2, sz, ux / ul, uz / ul, { word: pick(LINES.damemuraShot), speed: 8, dmg: c.shotDmg, life: 2.4 });
              }
            } else { // なる早：いつ爆発するか分からない時限爆弾
              for (let i = 0; i < 3; i++) {
                const a = Math.random() * 6.283, r = i ? 1.5 + Math.random() * 1.5 : 0;
                const mx = clamp(P.x + Math.cos(a) * r, -8, 8), mz = P.z + Math.sin(a) * r, s = new THREE.Sprite(MAT.asapBomb);
                s.position.set(mx, 0.3 + P.floorY, mz); s.scale.setScalar(0.5); scene.add(s);
                e.mines.push({ s, x: mx, z: mz, t: 0, fuse: 1 + Math.random() * 2 });
              }
            }
            e.st = 'idle'; e.t = 0; e.cd = c.cd * (e.hp < e.def.hp * 0.5 ? 0.7 : 1);
          }
          break;
        default: { // idle：霧の中をうろつく
          if (!e.hidden) { e.st = 'recover'; break; }
          e.dmgMul = 0;
          e.move -= dt;
          if (e.move <= 0) {
            e.move = 1.5 + Math.random() * 1.5;
            e.tx = clamp(P.x + (Math.random() - 0.5) * 12, -8, 8);
            e.tz = P.z + (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 4);
          }
          const mx = e.tx - e.x, mz = e.tz - e.z, md = Math.hypot(mx, mz);
          if (md > 0.3) { e.x += mx / md * e.def.speed * dt; e.z += mz / md * e.def.speed * dt; ch.setSpeed(e.def.speed); } else ch.setSpeed(0);
          if (Math.random() < 0.08) FX.emit(e.x, 1, e.z, { n: 1, color: '#c8d0d8', speed: 0.6, life: 1.2, size: 0.9, g: -0.3, spread: 1.5 });
          if (d < c.fogR) P.slow = Math.max(P.slow, 0.3);   // 「おおむね順調」の霧で足が鈍る
          if (e.cd <= 0 && !P.dead) {
            e.st = 'wind'; e.t = 0; e.next = pick(['someone', 'asap']);
            Barks.say(head, e.next === 'someone' ? '誰かがやります！' : 'なる早で！', 'tout', 1.0);
          }
        }
      }
      // 体力の節目ごとに、恨みの応報を1往復
      for (const [k, th] of [['p75', 0.75], ['p50', 0.5], ['p25', 0.25]]) {
        if (!e.said[k] && e.hp < e.def.hp * th) { e.said[k] = true; Talk.play(LINES.damemuraTalk[k], head); }
      }
    }
  },
  uchiki: { // 内木のリベンジ：パワポ要塞（スライドの盾）にこもって資料を飛ばす。喝で「結論」を暴くと要塞が崩れる
    init(e) {
      const c = CONFIG.uchiki;
      e.st = 'wait'; e.cd = 1.5; e.shield = true; e.expose = 0; e.lock = false; e.said = {}; e.mines = []; e.strafe = 1; e.dmgMul = 0;
      e.clearMines = () => { e.mines.forEach(m => scene.remove(m.s)); e.mines.length = 0; };
      e.onRemove = () => e.clearMines();
      e.updateExposure = dt => {
        if (e.st !== 'recover') return;
        const before = e.expose;
        e.expose = Math.max(0, before - dt);
        if (before > 1 && e.expose <= 1 && e.expose > 0) {
          FX.emit(e.x, 1.5, e.z, { n: 14, color: '#ffffff', speed: 2, life: 0.65, size: 0.3, spread: 1.5, g: -2 });
        }
        if (e.expose > 0) return;
        e.shield = true; e.dmgMul = c.dmgShield; e.setSlides(true); e.st = 'idle'; e.t = 0; e.cd = 1;
        Barks.say(e.char.anchor('head_top'), '再提出します！', 'tout', 1.4);
      };
      e.onShout = () => { // 喝で結論スライドを暴く → 要塞崩壊
        if (e.dead || !e.shield || e.st === 'wait' || e.st === 'intro') return;
        e.shield = false; e.expose = c.exposeTime; e.st = 'recover'; e.t = 0; e.dmgMul = c.dmgExposed;
        e.setSlides(false);
        FX.emit(e.x, 1.6, e.z, { n: 40, color: '#ffffff', speed: 7, life: 0.8, size: 0.3, spread: 1.5 });
        G.shake = Math.max(G.shake, 0.4);
        const head = e.char.anchor('head_top');
        Barks.say(head, '要塞崩壊！ 今だ', 'hint', 1.6, true);
        Talk.play(LINES.uchikiTalk.expose, head);
      };
      e.onDeath = () => {
        if (e.lock) { G.lock = null; e.lock = false; }
        e.clearMines(); e.setSlides(false);
        e.obj.rotation.x = 0.45;   // がっくりとうなだれる
        Talk.play(LINES.uchikiTalk.down, e.char.anchor('head_top'));
        Pawahara.request('uchikiDown', 2);
        World.dropItem('uchikiCoffee', clamp(e.x, -4, 4), e.z - 1.5);   // 加勢フラグ：缶コーヒーを置いていく
      };
    },
    update(e, dt) {
      const P = Player, c = CONFIG.uchiki, head = e.char.anchor('head_top'), dx = P.x - e.x, dz = P.z - e.z, d = Math.hypot(dx, dz) || 1, toP = Math.atan2(dx, dz);
      e.moving = false;
      // フォント爆撃の地雷（時間が来たら爆発）
      for (let i = e.mines.length - 1; i >= 0; i--) {
        const m = e.mines[i]; m.t += dt;
        m.s.scale.setScalar(0.6 + 0.4 * Math.sin(m.t * 18));
        if (m.t > c.mineTime) {
          FX.emit(m.x, 0.4, m.z, { n: 18, color: '#ff4a3a', speed: 5, life: 0.5, size: 0.3 });
          if (Math.hypot(P.x - m.x, P.z - m.z) < c.mineR && P.floorY < 2) P.damage(c.mineDmg, m.x, m.z, 6);
          scene.remove(m.s); e.mines.splice(i, 1);
        }
      }
      e.face = angLerp(e.face, toP, Math.min(1, dt * 5));
      switch (e.st) {
        case 'wait':
          e.dmgMul = 0;
          if (d < c.notice && !P.dead) {
            e.st = 'intro'; e.t = 0; e.lock = true;
            G.lock = { z0: e.z - c.arenaBack, z1: e.z + c.arenaFront };
            UI.showNameCard('リベンジ　不出来なパワポ', '内木');
            Talk.play(LINES.uchikiTalk.intro, head);
          }
          break;
        case 'intro':
          e.dmgMul = 0;
          if (e.t > c.introTime) { e.st = 'idle'; e.t = 0; e.dmgMul = c.dmgShield; e.cd = 1; }
          break;
        case 'recover': // 要塞が崩れて丸見え（気絶・管理職アクションが通る）
          e.updateExposure(dt);
          break;
        case 'wind': // 予兆（スライドが速く回る）→ 攻撃
          if (e.t > c.wind) {
            if (e.next === 'slides') { // スライド300枚：扇状の資料の弾
              const n = e.hp < e.def.hp * 0.5 ? 7 : 5;
              for (let i = 0; i < n; i++) {
                const a = toP + (i - (n - 1) / 2) * 0.24;
                Shots.fire(e.x + Math.sin(a) * 0.7, 1.3, e.z + Math.cos(a) * 0.7, Math.sin(a), Math.cos(a), { word: pick(LINES.uchikiSlide), speed: 9, dmg: c.slideDmg });
              }
            } else if (e.next === 'wipe') { // ワイプ遷移：横一列のスライドの壁。1か所だけすき間がある（ジャンプでもかわせる）
              const sx = Math.cos(toP), sz = -Math.sin(toP), gap = ((Math.random() * 7) | 0) - 3;
              for (let i = -4; i <= 4; i++) {
                if (i === gap || i === gap + 1) continue;
                Shots.fire(e.x + sx * i * 1.1 + Math.sin(toP) * 0.8, 1.0, e.z + sz * i * 1.1 + Math.cos(toP) * 0.8, Math.sin(toP), Math.cos(toP), { word: 'ワイプ', speed: 8, dmg: c.wipeDmg, life: 3 });
              }
            } else { // フォント爆撃：課長の足元の周りに極小文字の地雷を置く
              for (let i = 0; i < 3; i++) {
                const a = Math.random() * 6.283, r = i ? 1.6 + Math.random() : 0;
                const mx = clamp(P.x + Math.cos(a) * r, -8, 8), mz = P.z + Math.sin(a) * r, s = new THREE.Sprite(MAT.fontBomb);
                s.position.set(mx, 0.3 + P.floorY, mz); s.scale.setScalar(0.6); scene.add(s);
                e.mines.push({ s, x: mx, z: mz, t: 0 });
              }
            }
            e.st = 'idle'; e.t = 0; e.cd = c.cd * (e.hp < e.def.hp * 0.5 ? 0.7 : 1);
          }
          break;
        default: { // idle：間合いを保って回り込む（要塞が崩れている間は丸見えのまま）
          if (!e.shield) { e.st = 'recover'; break; }
          let mvx, mvz;
          if (d > 9) { mvx = dx / d; mvz = dz / d; }
          else if (d < 5) { mvx = -dx / d; mvz = -dz / d; }
          else { mvx = -dz / d * e.strafe * 0.7; mvz = dx / d * e.strafe * 0.7; if (Math.random() < dt * 0.4) e.strafe = -e.strafe; }
          e.x += mvx * e.def.speed * dt; e.z += mvz * e.def.speed * dt; e.moving = true;
          if (e.cd <= 0 && !P.dead) {
            e.st = 'wind'; e.t = 0; e.next = pick(['slides', 'wipe', 'bomb']);
            Barks.say(head, { slides: 'スライド300枚、いきます！', wipe: 'ワイプ遷移！', bomb: 'フォント爆撃！' }[e.next], 'tout', 1.0);
          }
        }
      }
      // 体力の節目ごとに、恨みの応報を1往復
      for (const [k, th] of [['p75', 0.75], ['p50', 0.5], ['p25', 0.25]]) {
        if (!e.said[k] && e.hp < e.def.hp * th) { e.said[k] = true; Talk.play(LINES.uchikiTalk[k], head); }
      }
    }
  },
  yakuza: { // 若頭：名乗りを上げて通路を閉じ、タイマン。突進の後は隙だらけ。体力半分で上着を脱いで本気になる
    init(e) {
      e.st = 'wait'; e.cd = 1; e.say = 3; e.phase = 1; e.saidGap = false; e.lock = false;

          if (d < c.notice && !P.dead) {

            Barks.say(head, 'カタギが、朝っぱらから何の用じゃ', 'tout', 2.2);

          if (e.t > 0.65) { e.st = 'idle'; e.t = 0; e.cd = c.jabCd / fast; }

        case 'rushWind': // 足元に赤い予兆線を出してから一直線に突っ込む
          ch.setSpeed(0); e.face = angLerp(e.face, toP, Math.min(1, dt * 5));
          if (Math.random() < 0.6) { const k = 1 + Math.random() * 6; FX.emit(e.x + Math.sin(e.face) * k, 0.15, e.z + Math.cos(e.face) * k, { n: 1, color: '#ff4422', speed: 0.5, life: 0.3, size: 0.3, g: 0 }); }
          if (e.t > c.rushWind / fast) { e.st = 'rush'; e.t = 0; e.lx = Math.sin(e.face); e.lz = Math.cos(e.face); e.hitDone = false; Barks.say(head, 'オラァ！', 'rage', 0.8); }
          break;
        case 'rush':
          e.x += e.lx * c.rushSpeed * dt; e.z += e.lz * c.rushSpeed * dt; ch.setSpeed(8);
          if (!e.hitDone && d < 1.6) { e.hitDone = true; P.damage(c.rushDmg, e.x, e.z, 12); }
          if (e.t > c.rushTime || (e.bumped && e.t > 0.1)) {
            e.st = 'recover'; e.t = 0; ch.setSpeed(0); ch.action('hurt');

          }
          break;
        case 'quakeWind': // 踏み込みの衝撃波（赤い円が予兆）
          ch.setSpeed(0); e.ring.visible = true; e.ring.scale.setScalar(c.quakeR / 1.12); e.ring.material.opacity = 0.3 + 0.3 * Math.sin(e.t * 14);

          if (e.cd <= 0 && !P.dead) {

            else if (d < 2.8) { e.st = 'jabWind'; e.t = 0; }
            else if (d < 12) { e.st = 'rushWind'; e.t = 0; }
          }
          if (e.say <= 0 && d < 10) { e.say = 5 + Math.random() * 3; Barks.say(head, pick(LINES.yakuza), 'tout', 1.8); }
      }
    }
  },
  host: { // 付きまとって殴り、時々シャンパンコールで周りの敵を盛り上げる（コール中は無防備）

  youtuber: { // 迷惑系配信者：間合いを保って煽り、自撮り棒で殴り、コメントを飛ばす。同接が増えるほど強い
    init(e) {
      const c = CONFIG.youtuber;

      }
      if (e.live) {
        e.viewers = Math.min(c.maxViewers, e.viewers + dt * (c.passive + e.viewers * 0.01));

const Enemies = {
  list: [],
  spawn(type, x, z) {

  },
  damage(e, dmg, nx, nz, push) {

    e.hp -= dmg; e.kx = nx * push; e.kz = nz * push; e.pop = 1;
    if (e.hp <= 0) {

      if (e.onDeath) e.onDeath();   // 強敵の撃破時の後始末（通路の解放・アイテムなど）
      FX.emit(e.x, e.y + 0.8, e.z, { n: 18, color: e.type === 'crow' ? '#5a5f78' : '#c9b8a0', speed: 4.5, life: 0.7, size: 0.3 });
      if (e.char) e.char.action('die');
      if (Math.random() < e.def.drop && World.onGround(e.x, e.z)) World.dropItem(Math.random() < 0.7 ? 'coffee' : 'energy', e.x, e.z);
    } else if (e.onHit) e.onHit();
  },
  stun(e, sec) { // 気絶: 一定時間AIを止める。飛行敵は地面へ落ちる（mimicの休眠中は対象外）

    if (e.def.heavy && e.st !== 'recover') return;   // 強敵は振り抜いた直後の硬直中だけ気絶する
    e.stunT = Math.max(e.stunT || 0, sec);

  remove(e) {

    const i = this.list.indexOf(e); if (i >= 0) this.list.splice(i, 1);
  },
  clear() { while (this.list.length) this.remove(this.list[0]); },
  update(dt) {
    const P = Player, edt = P.ai ? dt * CONFIG.phone.enemySlow : dt, L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {

        else {
          e.obj.rotation.z = Math.min(1, e.t / 0.25) * 1.45; e.obj.position.y = Math.max(0, e.obj.position.y - dt * 8);

      }
      if (e.stunT > 0) { // 気絶中も内木・駄目村の露出時間は進む

          for (let j = 0; j < i; j++) { const o = L[j]; if (o.dead || o.def.fly) continue; const dx = e.x - o.x, dz = e.z - o.z, d = Math.hypot(dx, dz), m = e.r + o.r; if (d < m && d > 0.001) { const p = (m - d) / d * 0.5; e.x += dx * p; e.z += dz * p; if (o.st !== 'dormant') { o.x -= dx * p; o.z -= dz * p; } } }
          const dx = e.x - P.x, dz = e.z - P.z, d = Math.hypot(dx, dz), m = e.r + 0.3; if (d < m && d > 0.001 && e.y < 0.5) { e.x += dx / d * (m - d); e.z += dz / d * (m - d); }

        // 他の敵・プレイヤーの既存の押し出し仕様には加えない。
        if (e.type === 'boar' && e.st === 'rush') {

            } else {

/* ---- 敵の飛び道具（コンサルの横文字） ---- */
const Shots = {
  list: [], mats: {},
  mat(word) {
    return this.mats[word] || (this.mats[word] = new THREE.SpriteMaterial({
      map: signTex({ w: 256, h: 96, bg: '#0e2a3a', fg: '#9ff0ff', border: '#9ff0ff', lines: [{ t: word, size: 40, y: 50 }] }),
      transparent: true, depthWrite: false
    }));
  },
  fire(x, y, z, dx, dz, o) {
    const s = new THREE.Sprite(this.mat(o.word)); s.scale.set(1.5, 0.56, 1); s.position.set(x, y, z); scene.add(s);
    this.list.push({ s, x, y, z, dx, dz, sp: o.speed, dmg: o.dmg, life: o.life || 2.4 });
  },
  pop(i) {
    const q = this.list[i];
    FX.emit(q.x, q.y, q.z, { n: 8, color: '#9ff0ff', speed: 3, life: 0.35, size: 0.22 });
    scene.remove(q.s); this.list.splice(i, 1);
  },
  update(dt) {
    const P = Player, edt = P.ai ? dt * CONFIG.phone.enemySlow : dt;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const q = this.list[i];
      q.life -= edt; q.x += q.dx * q.sp * edt; q.z += q.dz * q.sp * edt;
      q.s.position.set(q.x, q.y + Math.sin(q.life * 9) * 0.06, q.z);
      let dead = q.life <= 0;
      // ジャンプ中（足元が高い時）は頭の下をくぐらせてかわせる。
      if (!dead && !P.dead && Math.hypot(P.x - q.x, P.z - q.z) < 0.7 && P.y < 0.55) { P.damage(q.dmg, q.x, q.z, 3); dead = true; }

  // 喝・鞄・クラブで論破：範囲内の弾を消す

};

/* ---- 迷惑系YouTuberの配信（課長の喝・罵倒で同接が増える） ---- */

/* ---- 掛け合い（敵と課長が交互にしゃべる。['u'|'k', 台詞] の列。k は課長、それ以外は相手） ---- */
const Talk = {

    if (this.barT > 0) { this.barT -= dt; if (this.barT <= 0) $('talkBar').classList.remove('on'); }

    if (!this.q.length || this.t > 0) return;
    const m = this.q.shift();
    const anchor = m.who === 'k' ? Player.hero.anchor('head_top') : m.owner;
    if (anchor) Barks.say(anchor, m.text, m.who === 'k' ? 'rage' : 'tout', this.gap);
    // 画面上部の字幕帯にも出す（戦闘中でも読めるように）
    $('talkName').textContent = m.who === 'k' ? '課長' : (LINES.talkNames[m.who] || '');
    $('talkText').textContent = m.text;

/* ---- 加勢フラグ（ラスボス戦で内木・駄目村が加勢する強さに使う）。ステージ2の読み込み時に数え直す ---- */
const Flags = {
  got: {},
  reset() { this.got = {}; },
  add(kind) { this.got[kind] = (this.got[kind] || 0) + 1; },
  of(kind) { return this.got[kind] || 0; },
  count() { let n = 0; for (const k in this.got) n += this.got[k]; return n; }
};

/* ---- 加勢（ラスボス第二形態で内木・駄目村が駆けつける。攻撃は受けない。Game.reset で消す） ---- */
/* ---- エンディング（ステージ4クリア後：会話劇 → 字幕ロール → 翌朝のオチ → 完 → タイトルへ） ---- */
const Ending = {
  steps: [], i: -1, wait: 0,
  start() {
    const n = Flags.count(), L = LINES.ending;

    this.steps = [

      { mode: 'dark', caption: '翌朝 4:30　ぱわ原家', dur: 2.6 },

    this.next();
  },
  next() {
    this.i++;
    const s = this.steps[this.i], box = $('endBox');
    if (!s) return;
    if (s.mode) { // 背景の切り替え
      $('ending').className = s.mode; box.classList.add('hidden');
      $('endCaption').textContent = s.caption || '';
      const r = $('endRoll');
      r.classList.remove('run');
      if (s.mode === 'roll') { r.innerHTML = this.credits(); void r.offsetWidth; r.classList.add('run'); }
      this.wait = s.dur || 0;
    } else if (s.say) { // 会話（自動で進む。タップで送れる）

  const o = ch.object; o.scale.setScalar(1.35); scene.add(o);
  const head = ch.anchor('head_top');
  const B = { x: 0, z: A[1] - 6, face: Math.PI, hp: def.hp, st: 'intro', t: 0, cd: 1.5, done: false, phase: 1, n: 0, wait: 1,
              summonT: 0, sepiaT: 0, awakenT: 0, awoke: false, said: {} };
  const circle = { x: B.x, z: B.z, y: 0, r: 0.9, owner: B, hit: d => damage(d) };
  const set = s => { B.st = s; B.t = 0; B.done = false; };
  const toTired = w => { B.wait = w; set('tired'); };
  const sepia = on => { document.body.dataset.sepia = on ? 'true' : 'false'; };
  ch.on('hit', () => { const P = Player; if (B.st === 'swing' && Math.hypot(P.x - B.x, P.z - B.z) < 2.8) P.damage(c.swingDmg, B.x, B.z, 10); });
  function damage(d) {
    if (B.st === 'intro' || B.st === 'dying' || B.st === 'gone') return;
    B.hp -= d;
    if (B.hp <= 0) {
      B.hp = 0; set('dying'); ch.action('die'); G.shake = 0.9; G.hitstop = 0.3; sepia(false); B.sepiaT = 0;
      for (const e of Enemies.list.slice()) if (e.type === 'zombie' && !e.dead) Enemies.damage(e, 999, 0, 0, 0);
      Talk.play(LINES.buchoTalk.down, head);
    }
  }
  function awaken() { // 部下を馬鹿にされた課長の覚醒（部下との絆の数だけ強化が長く続く）
    const P = Player;
    P.rage = CONFIG.player.rageMax;
    P.powerHits = CONFIG.power.attacks + Flags.count() * 2;
    P.hp = Math.min(CONFIG.player.hp, P.hp + 30);
    FX.emit(P.x, 1.2, P.z, { n: 60, color: '#ff8a3a', speed: 8, life: 1, size: 0.4, spread: 1 });
    G.shake = Math.max(G.shake, 0.6);
  }
  function choose(d) {
    B.n = 0;
    if (B.phase === 2 && B.summonT <= 0 && Enemies.list.filter(e => e.type === 'zombie' && !e.dead).length < 3) {
      B.summonT = c.summonEvery; set('summon'); ch.action('Batou3'); Barks.say(head, '全社朝礼を始める！', 'rage', 1.4); return;
    }
    if (d < 3.2) { set('swingWind'); Barks.say(head, pick(LINES.buchoSwing), 'tout', 1.0); return; }
    const r = Math.random();
    if (r < 0.32) { set('tsume'); ch.action('Batou2'); Barks.say(head, '詰めるぞ。', 'tout', 1.0); }
    else if (r < 0.62) { set('numbers'); ch.action('Batou1'); Barks.say(head, '数字で説明しろ！', 'rage', 1.2); }
    else if (r < 0.82) { set('nostalgia'); ch.action('Batou1'); }
    else { set('review'); ch.action('Batou2'); Barks.say(head, '評価面談の時間だ。', 'tout', 1.2); }
  }
  return {
    ratio() { return B.hp / def.hp; },
    eachCircle(fn) { if (B.st === 'intro' || B.st === 'dying' || B.st === 'gone') return; fn(circle); },
    dispose() {
      scene.remove(o); sepia(false);
      const shared = Object.values(GEO);
      o.traverse(m => { if (m.geometry && shared.indexOf(m.geometry) < 0) m.geometry.dispose(); });
    },
    update(dt) {
      const P = Player; if (B.st === 'gone') return;
      B.t += dt; B.cd -= dt; B.summonT -= dt;
      if (B.sepiaT > 0) { B.sepiaT -= dt; P.slow = Math.max(P.slow, 0.2); if (B.sepiaT <= 0) sepia(false); }
      const dx = P.x - B.x, dz = P.z - B.z, d = Math.hypot(dx, dz) || 1, toP = Math.atan2(dx, dz);
      let sp = 0;
      switch (B.st) {
        case 'intro':
          if (!B.done) { B.done = true; UI.showNameCard('営業本部 部長', '鬼頭 権三'); Talk.play(LINES.buchoTalk.intro, head); }
          B.face = angLerp(B.face, toP, Math.min(1, dt * 3));
          if (B.t > c.introTime) { set('idle'); B.cd = 1; }
          break;
        case 'idle':
          B.face = angLerp(B.face, toP, Math.min(1, dt * 4));
          if (d > 3) { sp = c.walk * (B.phase === 2 ? 1.3 : 1); B.x += dx / d * sp * dt; B.z += dz / d * sp * dt; }
          if (B.cd <= 0 && !P.dead) choose(d);
          break;
        case 'swingWind':
          B.face = angLerp(B.face, toP, Math.min(1, dt * 6));
          if (B.t > c.swingWind) { set('swing'); ch.action('attack'); }
          break;
        case 'swing':
          if (B.t > 0.7) toTired(c.tired * 0.6);
          break;
        case 'tsume': // 詰め：質問を狙い撃ちで連射
          B.face = angLerp(B.face, toP, Math.min(1, dt * 8));
          if (B.n < c.tsumeN && B.t > 0.3 + B.n * c.tsumeGap) {
            const a = toP + (Math.random() - 0.5) * 0.1;
            Shots.fire(B.x + Math.sin(a), 1.6, B.z + Math.cos(a), Math.sin(a), Math.cos(a), { word: LINES.buchoTsume[B.n % LINES.buchoTsume.length], speed: 11, dmg: c.tsumeDmg });
            B.n++;
          }
          if (B.n >= c.tsumeN && B.t > 0.7 + c.tsumeN * c.tsumeGap) { ch.stop(); toTired(c.tired); }
          break;
        case 'numbers': // 数字で説明しろ：数字の扇状の弾幕
          if (!B.done && B.t > 0.6) {
            B.done = true;
            const n = B.phase === 2 ? 9 : 7;
            for (let i = 0; i < n; i++) {
              const a = toP + (i - (n - 1) / 2) * 0.2;
              Shots.fire(B.x + Math.sin(a), 1.4, B.z + Math.cos(a), Math.sin(a), Math.cos(a), { word: pick(LINES.buchoNumbers), speed: 9, dmg: c.numDmg });
            }
          }
          if (B.t > 1.2) { ch.stop(); toTired(c.tired); }
          break;
        case 'nostalgia': // 俺の若い頃は：画面がセピア色になり、課長の動きが鈍る
          if (!B.done && B.t > 0.8) { B.done = true; B.sepiaT = c.sepiaTime; sepia(true); Barks.say(head, '俺の若い頃はなぁ……', 'tout', 2.4); }
          if (B.t > 2.2) { ch.stop(); toTired(c.tired); }
          break;
        case 'review': // 評価面談：怒ゲージを奪う
          if (!B.done && B.t > 1.0) {
            B.done = true; P.rage = 0; G.shake = Math.max(G.shake, 0.3);
            Barks.say(P.hero.anchor('head_top'), '評価：C（期待以下）……だと！？', 'rage', 2);
          }
          if (B.t > 1.8) { ch.stop(); toTired(c.tired); }
          break;
        case 'summon': // 全社朝礼：社員を呼び出す
          if (!B.done && B.t > 0.8) {
            B.done = true;
            for (let i = 0; i < 3; i++) {
              const e = Enemies.spawn('zombie', clamp(B.x + (i - 1) * 3, -HW + 1, HW - 1), clamp(B.z - 3, A[0] + 2, A[1] - 2));
              e.cd = 1;
            }
          }
          if (B.t > 1.6) { ch.stop(); toTired(c.tired * 0.6); }
          break;
        case 'tired':
          if (B.t > B.wait) { set('idle'); B.cd = (B.phase === 2 ? 0.6 : 1.0) + Math.random() * 0.4; }
          break;
        case 'dying':
          if (B.t > 2.0 && !B.done) { B.done = true; Boss.finish(); }
          if (B.t > 4) { o.visible = false; set('gone'); }
          break;
      }
      // 体力半分：第2形態（全社朝礼）。部下を馬鹿にされた課長が、言い返した直後に覚醒する
      if (B.phase === 1 && B.hp < def.hp * 0.5 && B.st !== 'dying') { B.phase = 2; B.awakenT = 4.8; Talk.play(LINES.buchoTalk.rage, head); }
      if (B.awakenT > 0) { B.awakenT -= dt; if (B.awakenT <= 0 && !B.awoke) { B.awoke = true; awaken(); } }
      for (const [k, th] of [['p75', 0.75], ['p25', 0.25]]) {
        if (!B.said[k] && B.hp > 0 && B.hp < def.hp * th) { B.said[k] = true; Talk.play(LINES.buchoTalk[k], head); }
      }
      B.x = clamp(B.x, -HW + 1, HW - 1); B.z = clamp(B.z, A[0] + 2, A[1] - 2);
      // 見た目・当たり判定・課長の押し出し
      ch.setSpeed(sp); ch.update(dt);
      o.position.set(B.x, 0, B.z); o.rotation.y = B.face;
      circle.x = B.x; circle.z = B.z;
      if (B.st !== 'dying' && B.st !== 'gone' && !P.falling) {
        const ox = P.x - B.x, oz = P.z - B.z, od = Math.hypot(ox, oz), m = circle.r + 0.3;
        if (od < m && od > 0.001) { P.x += ox / od * (m - od); P.z += oz / od * (m - od); }
        if (G.lock) {
          const hw = World.halfWidthAt(P.z) - CONFIG.player.radius;
          P.x = clamp(P.x, -hw, hw); P.z = clamp(P.z, G.lock.z0, G.lock.z1);
        }
      }
    }
  };
}
/* ラスボス CEO（ボス1つで3段構え）
   A: CEO（中期経営計画・選択と集中・社員指針の唱和・押し出し）→ 体力60%で退避
   B: 経理部長（経費精算差し戻し・予算凍結・領収書の宛名違い）→ 撃破で去る
   C: 始業9:00と同時にCEO第二形態（早期退職募集・人的資本経営・株主総会・重機の踏み込み）
   加勢（内木・駄目村）用に、段階・第二形態の経過秒数・弱点の印・硬直中かどうかを外から使えるようにする */
function createCeoBoss(def) {
  const c = CONFIG.ceo, A = def.arena, HW = def.halfWidth, T = LINES.ceoTalk;
  const man = (colors, scale) => {
    const ch = ModelRenderer.createCharacter(MODEL_DATA_SALARYMAN_GLASSES_SUIT, { colors, hide: ['briefcase'] });
    ch.object.scale.setScalar(scale); scene.add(ch.object); return ch;
  };
  const ceo = man({ suit: '#1a2238', suit_lapel: '#111828', tie: '#d8b04a', shirt: '#f6f4ee', hair: '#c8c8cc', glasses_frame: '#d8b04a' }, 1.25);
  const acct = man({ suit: '#7a7468', suit_lapel: '#6a645a', tie: '#4a4a4a', shirt: '#e8e4da', hair: '#d8d4cc' }, 0.95);
  acct.object.visible = false;
  mk(acct.anchor('hand_L_grip'), GEO.box, PM('#2a2a2e'), [0, 0.02, 0.06], [0.14, 0.2, 0.03], [-0.6, 0, 0]);   // 電卓
  const ceoHead = ceo.anchor('head_top'), acctHead = acct.anchor('head_top');
  // 経営者用重機スーツ（第二形態）：履帯・黄色い胴・油圧の腕と爪・ガラスの操縦席・胸の制御核
  const mech = (() => {
    const g = new THREE.Group(), yel = PM('#e0a820', { shininess: 40 }), dark = PM('#2a2c30', { shininess: 30 }), steel = PM('#9aa0a8', { shininess: 80 });
    mk(g, GEO.box, dark, [0, 0.5, 0], [3.2, 1.0, 3.6]);
    [-1, 1].forEach(s => mk(g, GEO.box, PM('#141416'), [s * 1.7, 0.55, 0], [0.7, 1.1, 4.0]));
    mk(g, GEO.box, yel, [0, 2.2, 0], [3.0, 2.4, 2.6]);
    mk(g, GEO.box, dark, [0, 2.2, 1.31], [2.6, 0.3, 0.04]);
    const arms = [-1, 1].map(s => {
      const sh = new THREE.Group(); sh.position.set(s * 1.9, 3.0, 0.2); g.add(sh);
      mk(sh, GEO.box, yel, [0, -0.9, 0.4], [0.7, 1.8, 0.7]);
      mk(sh, GEO.cyl, steel, [s * 0.3, -0.9, 0.8], [0.18, 1.6, 0.18]);
      const claw = new THREE.Group(); claw.position.set(0, -1.9, 0.6); sh.add(claw);
      [-1, 1].forEach(k => mk(claw, GEO.box, steel, [k * 0.25, -0.35, 0.2], [0.15, 0.7, 0.3], [0, 0, k * 0.3]));
      return sh;
    });
    mk(g, GEO.sph, PM('#22303c', { shininess: 90, transparent: true, opacity: 0.45 }), [0, 4.0, 0.2], [2.0, 1.6, 2.0]);
    mk(g, GEO.cyl, PM('#ff4020', { emissive: LC('#601008') }), [0, 3.2, 1.32], [0.6, 0.08, 0.6], [Math.PI / 2, 0, 0]);
    g.visible = false; scene.add(g);
    return { g, arms };
  })();
  const owned = [];
  const disc = (hex, op) => {
    const m = new THREE.Mesh(GEO.disc, new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.visible = false; scene.add(m); owned.push(m); return m;
  };
  const marks = [0, 1, 2, 3, 4].map(() => ({ m: disc(0xff3a20, 0.5), x: 0, z: 0, on: false }));
  const ring = disc(0xff4422, 0.4), ice = disc(0x7fd8ff, 0.45);
  // 選択と集中で迫るパーティション
  const wallGeo = new THREE.BoxGeometry(0.4, 3.4, A[1] - A[0]), wallMat = PM('#c4ccd0');
  const walls = [-1, 1].map(s => { const m = new THREE.Mesh(wallGeo, wallMat); m.visible = false; m.position.set(s * HW, 1.7, (A[0] + A[1]) / 2); scene.add(m); return m; });

  const B = { phase: 'A', st: 'intro', t: 0, cd: 1.5, x: 0, z: A[1] - 8, face: Math.PI, hp: def.hp, ahp: c.acctHp, done: false, n: 0, wait: 1,
              said: {}, weakT: 0, phaseT: 0, focusT: 0, hwNow: HW, shields: [], clock0: G.clockSec, clockSet: false, side: 0, hitWin: false, fx: 0, fz: 0 };
  const INV = { intro: 1, retreat: 1, acctIntro: 1, acctDown: 1, transform: 1, dying: 1, gone: 1 };
  const circle = { x: B.x, z: B.z, y: 0, r: 0.8, owner: B, hit: d => damage(d) };
  const set = s => { B.st = s; B.t = 0; B.done = false; B.n = 0; };
  const toTired = w => { B.wait = w; set('tired'); };
  ceo.on('hit', () => { const P = Player; if (B.st === 'push' && Math.hypot(P.x - B.x, P.z - B.z) < 2.6) P.damage(c.pushDmg, B.x, B.z, 14); });
  function clearHazards() {
    marks.forEach(q => { q.on = false; q.m.visible = false; });
    ring.visible = false; ice.visible = false; B.focusT = 0;
  }
  function damage(d) {
    if (INV[B.st]) return;
    if (B.phase === 'B') {
      B.ahp -= d;
      if (B.ahp <= 0) { B.ahp = 0; clearHazards(); set('acctDown'); Talk.play(T.acctDown, acctHead); }
      return;
    }
    if (B.phase === 'C') {
      d *= c.armorC;
      if (B.shields.some(e => !e.dead)) d *= 0.25;   // 人的資本（社員の盾）が残っている間は硬い
      if (B.weakT > 0) d *= c.weakMul;               // 駄目村が弱点に印をつけている間は大ダメージ
    }
    B.hp -= d;
    if (B.phase === 'A' && B.hp <= def.hp * c.retreatAt) {
      B.hp = def.hp * c.retreatAt; clearHazards(); set('retreat'); Talk.play(T.retreat, ceoHead); return;
    }
    if (B.hp <= 0) {
      B.hp = 0; clearHazards(); set('dying'); G.shake = 1; G.hitstop = 0.3;
      for (const e of B.shields) if (!e.dead) Enemies.damage(e, 999, 0, 0, 0);
      Talk.play(T.down, ceoHead);
    }
  }
  function choose(d) {
    const r = Math.random();
    if (B.phase === 'A') {
      if (d < 3) { set('pushWind'); return; }
      if (r < 0.4) set('plan'); else if (r < 0.7 && B.focusT <= 0) set('focus'); else set('creed');
    } else if (B.phase === 'B') {
      if (r < 0.35) set('refund'); else if (r < 0.7) set('freeze'); else set('receipt');
    } else {
      if (d < 4) { set('stompWind'); return; }
      if (r < 0.28) set('pull');
      else if (r < 0.5 && !B.shields.some(e => !e.dead)) set('capital');
      else if (r < 0.8) set('meeting');
      else set('plan');
    }
  }

  return {
    ratio() { return B.phase === 'B' ? B.ahp / c.acctHp : B.hp / def.hp; },
    eachCircle(fn) { if (INV[B.st]) return; fn(circle); },
    // 加勢（内木・駄目村）から使う入口
    phase() { return B.phase; },
    phaseTime() { return B.phaseT; },
    isTired() { return B.phase === 'C' && B.st === 'tired'; },
    markWeak(sec) { B.weakT = Math.max(B.weakT, sec); },
    weakLeft() { return B.weakT; },
    pos() { return { x: B.x, z: B.z }; },
    hitRaw(d) { damage(d); },
    dispose() {
      clearHazards();
      const shared = Object.values(GEO);
      [ceo.object, acct.object, mech.g].forEach(o => {
        if (o.parent) o.parent.remove(o);
        o.traverse(m => { if (m.geometry && shared.indexOf(m.geometry) < 0) m.geometry.dispose(); });
      });
      owned.forEach(m => { scene.remove(m); m.material.dispose(); });
      walls.forEach(m => scene.remove(m)); wallGeo.dispose();
      if (B.clockSet) G.clockSec = B.clock0;   // やり直し時は、9:00に進めた時計をボス戦開始時へ戻す
    },
    update(dt) {
      const P = Player; if (B.st === 'gone') return;
      B.t += dt; B.cd -= dt;
      if (B.weakT > 0) B.weakT -= dt;
      if (B.phase === 'C') B.phaseT += dt;
      const head = B.phase === 'B' ? acctHead : ceoHead;
      const dx = P.x - B.x, dz = P.z - B.z, d = Math.hypot(dx, dz) || 1, toP = Math.atan2(dx, dz);
      let sp = 0;
      switch (B.st) {
        case 'intro':
          if (!B.done) { B.done = true; UI.showNameCard('代表取締役CEO', '天上院 統'); Talk.play(T.intro, ceoHead); }
          B.face = angLerp(B.face, toP, Math.min(1, dt * 3));
          if (B.t > c.introTime) { set('idle'); B.cd = 1; }

        case 'idle': {
          B.face = angLerp(B.face, toP, Math.min(1, dt * 4));
          const walk = B.phase === 'A' ? c.walkA : B.phase === 'B' ? c.walkB : c.walkC;
          if (B.phase === 'B') { // 経理部長は間合いを保つ
            if (d < 5) { sp = walk; B.x -= dx / d * sp * dt; B.z -= dz / d * sp * dt; }
            else if (d > 9) { sp = walk; B.x += dx / d * sp * dt; B.z += dz / d * sp * dt; }
          } else if (d > 3) { sp = walk; B.x += dx / d * sp * dt; B.z += dz / d * sp * dt; }
          if (B.cd <= 0 && !P.dead) choose(d);
          break;
        }
        case 'tired':
          if (B.t > B.wait) { set('idle'); B.cd = (B.phase === 'C' ? 0.6 : 1.0) + Math.random() * 0.4; }
          break;
        case 'pushWind':
          B.face = angLerp(B.face, toP, Math.min(1, dt * 8));
          if (B.t > 0.5) { set('push'); ceo.action('attack'); }
          break;
        case 'push':
          if (B.t > 0.7) toTired(1.2);
          break;
        case 'plan': { // 中期経営計画：的の輪が課長を追って動き、時間が来ると炸裂する（計画は毎回変わる）
          if (!B.done) {
            B.done = true;
            Barks.say(head, B.phase === 'C' ? '中期経営計画、再修正！' : '中期経営計画を発表する！', 'rage', 1.3);
            const n = B.phase === 'C' ? 5 : 3;
            marks.forEach((q, i) => {
              q.on = i < n; if (!q.on) return;
              const a = Math.random() * 6.283, r = 2 + Math.random() * 2;
              q.x = P.x + Math.cos(a) * r; q.z = P.z + Math.sin(a) * r; q.m.visible = true; q.m.scale.setScalar(c.planR);
            });
          }
          for (const q of marks) {
            if (!q.on) continue;
            const mx = P.x - q.x, mz = P.z - q.z, md = Math.hypot(mx, mz) || 1;
            q.x += mx / md * 2.5 * dt; q.z += mz / md * 2.5 * dt;
            q.m.position.set(q.x, 0.08, q.z); q.m.material.opacity = 0.3 + 0.3 * Math.sin(B.t * 14);
          }
          if (B.t > c.planTime) {
            marks.forEach(q => {
              if (!q.on) return;
              q.on = false; q.m.visible = false;
              FX.emit(q.x, 0.5, q.z, { n: 24, color: '#ff6a3a', speed: 6, life: 0.6, size: 0.35 });
              if (Math.hypot(P.x - q.x, P.z - q.z) < c.planR && P.floorY < 2) P.damage(c.planDmg, q.x, q.z, 6);
            });
            G.shake = Math.max(G.shake, 0.35); toTired(c.tired);
          }
          break;
        }
        case 'focus': // 選択と集中：両側のパーティションが迫り、戦う範囲が狭まる
          if (!B.done) { B.done = true; B.focusT = c.focusTime; walls.forEach(w => { w.visible = true; }); Barks.say(head, '選択と集中だ。不採算部門は切る！', 'rage', 1.6); }
          if (B.t > 1.2) toTired(1.0);

const BOSS_TYPES = { gar: createGarBoss, rat: createRatBoss, bucho: createBuchoBoss, ceo: createCeoBoss };
const Boss = {

  start(def) {

    // 死亡処理を経由しないため、回復アイテムのドロップも発生しない。
    for (const e of Enemies.list.slice()) {
      if (e.def.fly) Enemies.remove(e);
    }

    this.active = true;
  },
  update(dt) { if (this.ctrl) this.ctrl.update(Player.ai ? dt * 0.8 : dt); },
  eachCircle(fn) { if (this.ctrl && this.active) this.ctrl.eachCircle(fn); },
  ratio() { return this.ctrl ? this.ctrl.ratio() : 0; },
  finish() { this.active = false; G.bossDown = true; G.lock = null; fireEvent('bossDown'); },
  reset() { if (this.ctrl) { this.ctrl.dispose(); this.ctrl = null; } this.active = false; }

/* ============================================================
 * 11. 攻撃判定（鞄・罵倒の音波・AIの自動迎撃）
 *     的は {x,z,y,r,owner,hit(dmg,nx,nz,push)} の形で統一
 * ============================================================ */
const Combat = {
  waves: [], bolts: [], thrown: [],
  init() {
    for (let i = 0; i < 14; i++) {
      const m = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
      m.visible = false; scene.add(m); this.waves.push({ m, alive: false, x: 0, y: 1.48, z: 0, dx: 0, dz: 1, d: 0, lv: 1, s: null, hit: new Set() });
    }
    const bm = new THREE.SpriteMaterial({ map: TEX.glow, color: 0x7df0ff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    for (let i = 0; i < 8; i++) { const m = new THREE.Sprite(bm); m.scale.set(0.8, 0.8, 1); m.visible = false; scene.add(m); this.bolts.push({ m, alive: false, t: null, x: 0, y: 0, z: 0, life: 0 }); }
  },
  eachTarget(fn) { for (const e of Enemies.list) if (!e.dead) fn(e); Boss.eachCircle(fn); },
  nearest(x, z, maxD) { let best = null, bd = maxD; this.eachTarget(t => { const d = Math.hypot(t.x - x, t.z - z) - t.r; if (d < bd) { bd = d; best = t; } }); return best; },

  throwItem(type) {
    const P = Player, cfg = CONFIG.throw, def = cfg.types[type];
    if (!def) return false;

    // 移動入力がある場合は進行方向を優先する。
    // 静止時は近くの敵を自動照準し、空中の敵にも対応する。
    let target = null, best = cfg.range;
    const moving = Math.hypot(Input.mx, Input.mz) > 0.2;
    const moveAngle = Math.atan2(Input.mx, Input.mz) + cameraHeading;

    this.eachTarget(t => {
      const dx = t.x - P.x, dz = t.z - P.z;
      const d = Math.hypot(dx, dz);
      if (d > cfg.range || d >= best) return;

      const angle = Math.atan2(dx, dz);
      if (moving && Math.abs(angDiff(angle, P.face)) > 0.85) return;

      best = d;
      target = t;
    });

    let angle = P.face;
    if (target) angle = Math.atan2(target.x - P.x, target.z - P.z);
    else if (moving) angle = moveAngle;

    P.face = angle;

    const dx = Math.sin(angle), dz = Math.cos(angle);
    const startY = 1.35 + P.floorY;   // 高所からは投げ下ろす
    const distance = target
      ? Math.hypot(target.x - P.x, target.z - P.z)
      : 9;

    const flightTime = clamp(distance / cfg.speed, 0.22, 1.0);
    const targetY = target
      ? Math.max(0.8, (target.y || 0) + (target.def && target.def.fly ? 0.15 : 0.9))
      : 0.8;

    const vy = clamp(
      (targetY - startY + cfg.gravity * flightTime * flightTime * 0.5) / flightTime,
      3,
      15
    );

    const mesh = makeThrowable(type);
    mesh.position.set(P.x + dx * 0.65, startY, P.z + dz * 0.65);
    scene.add(mesh);

    this.thrown.push({
      m: mesh,
      type,
      def: Object.assign({}, def, {
        damage: def.damage * P.powerMultiplier,
        push: def.push * P.powerMultiplier
      }),
      x: mesh.position.x,
      y: startY,
      z: mesh.position.z,
      vx: dx * cfg.speed,
      vy,
      vz: dz * cfg.speed,
      traveled: 0,
      life: 2,
      alive: true
    });

    FX.emit(P.x + dx * 0.65, startY, P.z + dz * 0.65, {
      n: 7, color: def.color, speed: 2,
      life: 0.3, size: 0.18
    });

    return true;
  },

  removeThrown(q) {
    q.alive = false;
    scene.remove(q.m);
    q.m.visible = false;
  },

  updateThrown(dt) {
    const cfg = CONFIG.throw;

    for (let i = this.thrown.length - 1; i >= 0; i--) {
      const q = this.thrown[i];
      if (!q.alive) {
        this.thrown.splice(i, 1);
        continue;
      }

      const oldX = q.x, oldY = q.y, oldZ = q.z;
      const dx = q.vx * dt, dz = q.vz * dt;

      q.x += dx;
      q.z += dz;
      q.y += q.vy * dt - cfg.gravity * dt * dt * 0.5;
      q.vy -= cfg.gravity * dt;
      q.traveled += Math.hypot(dx, dz);
      q.life -= dt;

      q.m.position.set(q.x, q.y, q.z);
      q.m.rotation.x += dt * 13;
      q.m.rotation.z += dt * 9;

      let hit = false;
      let hitX = q.x, hitY = q.y, hitZ = q.z;
      const done = new Set();

      // 前フレームから現在位置までの線分で判定する。
      // 高速で飛ぶ物体がカラスをすり抜けるのを防ぐ。
      const sx = q.x - oldX;
      const sy = q.y - oldY;
      const sz = q.z - oldZ;
      const len2 = sx * sx + sy * sy + sz * sz || 0.0001;

      this.eachTarget(t => {
        if (hit || done.has(t.owner)) return;

        const ty = (t.y || 0) + (t.def && t.def.fly ? 0.15 : 0.9);
        const px = t.x - oldX;
        const py = ty - oldY;
        const pz = t.z - oldZ;

          (px * sx + py * sy + pz * sz) / len2,
          0, 1

        const cx = oldX + sx * k;

        const cz = oldZ + sz * k;

        if (dist > radius) return;

        hitY = cy;
        hitZ = cz;

        const dir = Math.hypot(q.vx, q.vz) || 1;

          CONFIG.player.rageMax,
          Player.rage + CONFIG.rage.onHit

              q.z >= c.z0 && q.z <= c.z1 &&
              q.y < 2.2) {
            hit = true;
            break;
          }
        }
      }

      const ground = World.onGround(q.x, q.z);
      if (!hit && q.y <= (ground ? 0.2 : -3.5)) hit = true;
      if (!hit && (q.traveled > cfg.range + 4 || q.life <= 0)) hit = true;

      if (hit) {
        FX.emit(hitX, Math.max(0.2, hitY), hitZ, {
          n: q.type === 'bottle' ? 22 : 13,
          color: q.def.color,
          speed: q.type === 'brick' ? 6 : 4.5,
          life: 0.5,
          size: q.type === 'bottle' ? 0.18 : 0.24,
          spread: 0.35
        });

        this.removeThrown(q);
        this.thrown.splice(i, 1);
      } else if (Math.random() < 0.35) {
        FX.emit(q.x, q.y, q.z, {
          n: 1, color: q.def.color,
          speed: 0.4, life: 0.2,
          size: 0.12, g: 0
        });
      }
    }
  },

  melee() {
