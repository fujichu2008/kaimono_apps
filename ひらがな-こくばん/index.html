<!DOCTYPE html>
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#007acc">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<!-- APPSTUDIO_PWA_HEAD_END -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ごっぱと もじで あそぼう！</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
:root{
  --wall:#e6f4f8; --board:#244c44; --board-deep:#1b3b35; --wood:#c8965a; --wood-dark:#996d39;
  --chalk:#f5f2e6; --yellow:#ffd24c; --pink:#ff8fa3; --orange:#ff7b29; --cyan:#48cae4;
  --text:#1d3530; --muted:#5c7a72;
  --kyokasho:"YuKyokasho Yoko","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Klee One","Klee","Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
html,body{margin:0}
body{
  background:radial-gradient(circle at 15% 15%, #ffffff 0%, #e6f4f8 55%, #d2eef7 100%);
  color:var(--text);font-family:var(--kyokasho);
  padding:12px calc(12px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  min-height:100vh;min-height:100dvh;
}
.app{max-width:960px;margin:0 auto;display:grid;gap:12px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.78);padding:8px 14px;border-radius:18px;
  box-shadow:0 4px 14px rgba(36,76,68,.08);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff7b29,#ffa200);color:#fff;
  padding:5px 14px;border-radius:999px;font-size:clamp(1.05rem,3.8vw,1.35rem);
  font-weight:700;letter-spacing:.06em;box-shadow:0 3px 0 #cc580f;
  text-shadow:0 1px 2px rgba(0,0,0,.18);
}
#count{
  font-size:.95rem;font-weight:700;color:var(--board);
  background:#e9f5f2;padding:4px 10px;border-radius:999px;
}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{font:inherit;font-size:1rem;padding:9px 0;min-height:46px;border-radius:999px;border:2px solid var(--board);
  background:rgba(255,255,255,.8);color:var(--board);cursor:pointer;font-weight:700;transition:transform .12s,background .15s}
.modes button[aria-pressed="true"]{background:var(--board);color:var(--chalk);box-shadow:0 3px 0 var(--board-deep)}

.boardwrap{background:linear-gradient(180deg,var(--wood),var(--wood-dark));padding:9px;border-radius:14px;
  width:min(100%,58vh);width:min(100%,58dvh);min-width:240px;margin:0 auto;
  box-shadow:0 6px 0 #7a5428, 0 12px 24px rgba(29,53,48,.16)}
#stage{display:block;width:100%;aspect-ratio:1;background:
  radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.08),transparent 60%),
  radial-gradient(circle at 20% 82%,rgba(72,202,228,.14),transparent 36%),
  var(--board);
  border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.guide{stroke:rgba(245,242,230,.22);stroke-width:.4;stroke-dasharray:1.6 1.6;fill:none}
.ghost path{fill:none;stroke:rgba(245,242,230,.17);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.ink path{fill:none;stroke:var(--ink,var(--chalk));stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.num{font:700 6.5px var(--kyokasho);fill:var(--yellow);stroke:var(--board);stroke-width:1.6;paint-order:stroke;
  text-anchor:middle;dominant-baseline:central}
#startDot{fill:var(--yellow)}
#startRing{fill:none;stroke:var(--yellow);stroke-width:.9;transform-box:fill-box;transform-origin:center;
  animation:ring 1.3s ease-out infinite}
#startNum{font:700 5.2px var(--kyokasho);fill:var(--board-deep);text-anchor:middle;dominant-baseline:central}
#tip{fill:var(--yellow);opacity:.9}
#hana{fill:none;stroke:var(--pink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shake{animation:shake .3s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.5);opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ごっぱ3Dサポートステージ＆吹き出し */
#goppaStage{
  position:absolute;left:10px;bottom:10px;width:34%;height:34%;z-index:2;
  pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 50% 60%, rgba(72,202,228,.22) 0%, rgba(72,202,228,.06) 52%, transparent 72%);
}
#goppaStage canvas{width:100%!important;height:100%!important;display:block}
#goppaHit{
  position:absolute;left:12px;bottom:12px;width:24%;height:24%;z-index:2;
  border-radius:50%;cursor:pointer;background:transparent;border:0;padding:0;
}
#goppaBubble{
  position:absolute;left:14px;bottom:33%;z-index:5;pointer-events:none;
  background:#fff;color:var(--text);font-weight:700;font-size:clamp(.75rem,2.4vw,.92rem);
  padding:5px 11px;border-radius:999px;border:2px solid var(--orange);
  box-shadow:0 3px 8px rgba(0,0,0,.15);white-space:nowrap;
  opacity:0;transform:translateY(6px) scale(.9);transition:opacity .2s,transform .2s;
}
#goppaBubble.show{opacity:1;transform:translateY(0) scale(1)}
#goppaBubble::after{
  content:"";position:absolute;left:22px;bottom:-7px;
  border-width:7px 6px 0;border-style:solid;border-color:var(--orange) transparent transparent;
}

.msgbar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.88);border:2px solid #cbe4ec;border-radius:16px;
  padding:6px 12px;min-height:48px;box-shadow:0 3px 0 rgba(72,202,228,.22);
}
.msg-icon{font-size:1.25rem;line-height:1;flex-shrink:0}
#msg{text-align:center;font-size:1.08rem;font-weight:700;margin:0;color:var(--text)}

.ctrl{display:grid;grid-template-columns:1fr 1.5fr 1fr 1fr;gap:8px}
.ctrl button{font:inherit;font-size:1rem;font-weight:700;padding:12px 0;min-height:46px;border-radius:12px;border:0;cursor:pointer;
  background:#fff;color:var(--text);box-shadow:0 3px 0 #b8ced6}
.ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 #b8ced6}
.ctrl button.go{background:var(--yellow);box-shadow:0 3px 0 #c9a530}

.table{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:minmax(40px,1fr);direction:rtl;gap:4px;
  overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.table button,.table span{direction:ltr;aspect-ratio:3/4;min-width:0}
.table button{font:inherit;font-size:clamp(1rem,4.6vw,1.5rem);padding:0;border-radius:8px;border:0;cursor:pointer;
  background:#fff;color:var(--text);position:relative;box-shadow:0 2px 0 #c8dce2}
.table button.cur{background:var(--orange);color:#fff;box-shadow:0 2px 0 #c4510a;font-weight:700}
.table button.done::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.table button.hana::after{content:"💮";position:absolute;right:1px;top:1px;font-size:.62em;line-height:1}
.ctrl button{white-space:nowrap;font-size:clamp(.8rem,3.5vw,1rem)}
#word{text-align:center;font-size:1.9rem;min-height:1.5em;margin:0;letter-spacing:.08em}
#word b{color:#e0531f}
.order{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.order button{font:inherit;font-size:.9rem;padding:8px 0;min-height:44px;border-radius:999px;border:2px solid var(--wood-dark);
  background:transparent;color:var(--wood-dark);cursor:pointer}
.order button[aria-pressed="true"]{background:var(--wood-dark);color:#fff}
.user path{fill:none;stroke:var(--ink,var(--chalk));stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ghost.compare path{stroke:var(--cmp,rgba(243,207,86,.95));stroke-width:2.2}
/* ---------- たのしさの演出 ---------- */
header{flex-wrap:wrap}
.hud{display:flex;align-items:center;gap:8px}
#stars{font-size:.9rem;white-space:nowrap;color:#d48806;font-weight:700}
#sfx{font:inherit;font-size:1.1rem;width:44px;height:44px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.chalks{display:flex;justify-content:center;gap:14px}
.chalks button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid #fff;background:var(--c);cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.chalks button[aria-pressed="true"]{border-color:var(--orange);transform:scale(1.14)}
.table button.done::after{content:"⭐";width:auto;height:auto;border-radius:0;background:none;right:-2px;top:-3px;font-size:.72em;line-height:1}
.table button.hana::after{right:-2px;top:-3px;font-size:.8em}
.table button.joy{animation:hop2 .5s ease-out 3}
#buddy,#gFx{pointer-events:none}
#startDot{transform-box:fill-box;transform-origin:center}
#gStart.pulse #startDot{animation:pulse .5s ease-out}
.ink path.flash{animation:flashI .45s ease-out}
.user path.flash{animation:flashU .45s ease-out}
.ctrl button.bounce{animation:bounce .9s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(2.4)}100%{transform:scale(1)}}
@keyframes flashI{from{stroke:#fff;stroke-width:12}}
@keyframes flashU{from{stroke:#fff;stroke-width:11}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ---------- つぎに やること・ずかん・おとなメニュー・どれかな？ ---------- */
.boardwrap{position:relative}
.hbtn{font:inherit;font-size:1.1rem;width:44px;height:44px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.flow{font:inherit;font-size:1.25rem;font-weight:700;width:100%;min-height:52px;border-radius:16px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#ffe066,var(--yellow));color:var(--text);box-shadow:0 4px 0 #c9a530;white-space:nowrap}
.flow.off{visibility:hidden}
.flow.bounce{animation:bounce .9s ease-in-out infinite}
.quizbtn{font:inherit;font-size:1.1rem;font-weight:700;min-height:52px;border-radius:14px;border:2px solid var(--orange);cursor:pointer;background:#fff8f0;color:#c4510a;box-shadow:0 3px 0 #f2c094}
.quizbtn:disabled{opacity:.45;cursor:default;border-color:#ccc;color:var(--muted);box-shadow:none}
.quiz{position:absolute;top:9px;left:9px;right:9px;bottom:9px;z-index:3;display:flex;flex-direction:column;gap:8px;padding:8px}
.quiz[hidden]{display:none}
.qtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;color:var(--chalk);text-align:center;font-size:1rem}
.qtop button{font:inherit;font-size:1.3rem;width:52px;height:52px;padding:0;border-radius:50%;border:0;background:var(--chalk);color:var(--board);cursor:pointer}
.qchoices{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}
.qchoices button{font:inherit;font-size:clamp(1.6rem,9vmin,4rem);aspect-ratio:1;min-width:0;padding:0;border-radius:16px;border:0;cursor:pointer;
  background:var(--chalk);color:var(--board);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.qchoices button.dim{opacity:.3}
.qchoices button.hit{background:var(--yellow)}
#stage.quizzing>*{visibility:hidden}
#stage.quizzing>#gFx,#stage.quizzing>#buddy{visibility:visible}
.panel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(29,53,48,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.panel[hidden]{display:none}
.sheet{background:var(--wall);border-radius:16px;padding:14px;width:min(100%,640px);max-height:100%;overflow:auto;display:grid;gap:12px}
.ptop{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;font-size:1.2rem}
.pclose{font:inherit;font-size:1.4rem;width:52px;height:52px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.plabel{margin:0;font-size:.95rem;color:var(--muted)}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.bookgrid button,.bookgrid span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font:inherit;min-width:0}
.bookgrid span{background:rgba(0,0,0,.06);color:var(--muted);font-size:1.4rem}
.bookgrid button{border:3px solid #fff;background:#fff;color:var(--text);cursor:pointer;padding:2px;line-height:1.1}
.bookgrid button i{font-style:normal;font-size:1.7rem;display:block}
.bookgrid button b{font-size:1rem;display:block}
.bookgrid button.gold{border-color:#e0b43a;background:#fffaf0;box-shadow:0 0 0 2px #f3cf56 inset}
/* ---------- はじめる ---------- */
.startwrap{position:absolute;top:9px;left:9px;right:9px;bottom:9px;z-index:4;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
  background:rgba(27,59,53,.42);border-radius:6px;backdrop-filter:blur(2px)}
.startwrap[hidden]{display:none}
.start-sub{color:#fff;font-weight:700;font-size:1.1rem;text-shadow:0 2px 4px rgba(0,0,0,.4);background:rgba(0,0,0,.25);padding:4px 14px;border-radius:999px}
.startbtn{font:inherit;font-size:1.55rem;font-weight:700;min-height:70px;padding:0 34px;border-radius:999px;border:3px solid #fff;cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,#ff9e44,#ff7b29);color:#fff;box-shadow:0 5px 0 #b84a06,0 8px 20px rgba(0,0,0,.25)}
/* ---------- 配置：黒板 → 案内／進行ボタン → ことば → 操作 → チョークの色 ---------- */
.app>*{min-width:0}
.left>.boardwrap{grid-row:1}
.msgbar,.flowrow{grid-row:2;grid-column:1}
#word{grid-row:3}
.left>.ctrl{grid-row:4}
.left>.chalks{grid-row:5}
.msgbar{align-self:center}
.flowrow{display:flex;gap:8px;min-width:0}
.flowrow>.flow{width:auto;flex:1;min-width:0;font-size:clamp(1rem,5vw,1.25rem)}
.flow2{font:inherit;font-size:.95rem;font-weight:700;min-height:52px;padding:0 12px;border-radius:16px;border:0;cursor:pointer;white-space:nowrap;
  background:#fff;color:var(--text);box-shadow:0 4px 0 #b8ced6}
.flow2[hidden]{display:none}
/* 案内文と進行ボタンは同じ場所を共有し、完成時に入れ替える */
.left.act>.msgbar{visibility:hidden}
.left:not(.act)>.flowrow{visibility:hidden}
.modes button{font-size:clamp(.82rem,4vw,1rem);white-space:nowrap}
/* 「じぶんで」の失敗補助 */
.user path.fail{opacity:.28}
.ghost.aid path{stroke:rgba(245,242,230,.3)}
#endMark{fill:none;stroke:var(--yellow);stroke-width:.9;stroke-dasharray:1.6 1.2}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

@media (min-width:700px) and (min-height:600px){
  .app{max-width:1180px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;column-gap:28px}
  header,.modes{grid-column:1/-1}
  .left{grid-row:3}.right{grid-row:3}
}
.left,.right{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);min-width:0}

/* 五十音表：横スクロール中だけ、続きがある側に手がかりを出す */
.tablewrap{position:relative;min-width:0}
.tablewrap::before,.tablewrap::after{position:absolute;top:0;bottom:10px;width:34px;z-index:1;pointer-events:none;
  display:flex;align-items:center;color:var(--muted);font-size:.85rem;opacity:0;transition:opacity .2s}
.tablewrap::before{content:"◀";left:0;justify-content:flex-start;background:linear-gradient(to right,var(--wall) 25%,rgba(230,244,248,0))}
.tablewrap::after{content:"▶";right:0;justify-content:flex-end;background:linear-gradient(to left,var(--wall) 25%,rgba(230,244,248,0))}
.tablewrap.more-l::before,.tablewrap.more-r::after{opacity:1}

/* タブレット：こくばんを大きく */
@media (min-width:700px) and (min-height:600px){
  .boardwrap{width:min(100%,72vh);width:min(100%,72dvh)}
  #word{font-size:2.3rem}
  #msg{font-size:1.18rem}
}
/* 幅が十分あるとき：右列を五十音表が収まる幅に固定 */
@media (min-width:1000px) and (min-height:600px){
  .app{grid-template-columns:minmax(0,1fr) 488px}
}
/* スマホ横：左にこくばんだけ、ほかは右列にまとめて縦スクロール */
@media (orientation:landscape) and (max-height:599px) and (min-width:560px){
  body{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .app{max-width:none;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:8px;align-items:start;align-content:start}
  .left,.right{display:contents}
  header,.modes{grid-column:2}
  .left>*,.right>*{grid-column:2;min-width:0}
  .left>.boardwrap{grid-column:1;grid-row:1/span 9;position:sticky;top:8px;margin:0;min-width:180px;
    width:min(calc(100vh - 22px),52vw);width:min(calc(100dvh - 22px - env(safe-area-inset-bottom)),52vw)}
  #word{font-size:1.5rem}
}
/* スマホ横：右列の並び（案内 → ことば → 操作 → 色 → どれかな → 五十音表） */
@media (orientation:landscape) and (max-height:599px) and (min-width:560px){
  header{grid-row:1}
  .modes{grid-row:2}
  .msgbar,.flowrow{grid-column:2;grid-row:3}
  #word{grid-row:4}
  .left>.ctrl{grid-row:5}
  .left>.chalks{grid-row:6}
  .right>.quizbtn{grid-row:7}
  .right>.tablewrap{grid-row:8}
  .left>.boardwrap{grid-row:1/span 8}
}
@media (prefers-reduced-motion:reduce){#startRing{animation:none}.shake{animation:none}
  .ctrl button.bounce,.table button.joy{animation:none!important}}
</style>
</head>
<body>
<div id="book" class="panel" hidden>
  <div class="sheet">
    <div class="ptop"><b>📖 ごっぱの ことばずかん</b><span id="bookCount"></span><button class="pclose" data-close="book" aria-label="とじる">✕</button></div>
    <div id="bookGrid" class="bookgrid"></div>
  </div>
</div>
<div id="adult" class="panel" hidden>
  <div class="sheet">
    <div class="ptop"><b>⚙️ おとなメニュー</b><span></span><button class="pclose" data-close="adult" aria-label="とじる">✕</button></div>
    <p class="plabel">「つぎ」「まえ」の順番</p>
    <div id="adultOrder"></div>
    <p class="plabel">効果音</p>
    <div id="adultSfx"></div>
  </div>
</div>
<div class="app">
  <header>
    <div class="brand">
      <h1 class="title-badge" style="margin:0">🐟 ごっぱと もじで あそぼう！</h1>
      <div id="count"></div>
    </div>
    <div class="hud">
      <span id="stars" title="きょうの ほし"></span>
      <button id="bookBtn" class="hbtn" aria-label="ずかん">📖</button>
      <button id="gearBtn" class="hbtn" aria-label="おとなメニュー（ながおし）">⚙️</button>
      <button id="sfx" aria-label="こうかおん">🔔</button>
    </div>
  </header>

  <div class="modes" role="group" aria-label="れんしゅうのしかた">
    <button data-mode="watch">👀 おてほん</button>
    <button data-mode="trace">✏️ なぞる</button>
    <button data-mode="free">🖐 じぶんで</button>
  </div>

  <div class="left">
    <div class="boardwrap">
      <svg id="stage" viewBox="0 0 100 100" aria-label="れんしゅうのこくばん">
        <line class="guide" x1="50" y1="3" x2="50" y2="97"/>
        <line class="guide" x1="3" y1="50" x2="97" y2="50"/>
        <g id="gUser" class="user"></g>
        <g id="gGhost" class="ghost"></g>
        <g id="gInk" class="ink"></g>
        <g id="gNum"></g>
        <g id="gStart" style="display:none">
          <circle id="startRing" r="3.6"/><circle id="startDot" r="3.6"/><text id="startNum"></text>
        </g>
        <circle id="endMark" r="2.6" style="display:none"/>
        <circle id="tip" r="3" style="display:none"/>
        <path id="hana" style="display:none"/>
        <g id="buddy" style="display:none"></g>
        <g id="gFx"></g>
      </svg>
      <!-- 3Dサポートキャラ「ごっぱ」 -->
      <div id="goppaStage" aria-hidden="true"></div>
      <button id="goppaHit" type="button" aria-label="ごっぱを なでる" title="ごっぱを タッチしてみてね！"></button>
      <div id="goppaBubble" aria-hidden="true">いっしょに かこう♪</div>

      <div id="startWrap" class="startwrap">

<script>
/* 3Dモデルデータとレンダラー（ごっぱ） */
function createModelRenderer(THREE) {
 function buildGeometry(g) {
  switch (g.type) {
   case 'box':
    return new THREE.BoxGeometry(...(g.size || [1,1,1]));

   case 'sphere':
    return new THREE.SphereGeometry(
     g.radius ?? .5,
     g.widthSegments ?? 20,
     g.heightSegments ?? 12
    );

   case 'cylinder':
    return new THREE.CylinderGeometry(
     g.radiusTop ?? .5,
     g.radiusBottom ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'cone':
    return new THREE.ConeGeometry(
     g.radius ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'torus':
    return new THREE.TorusGeometry(
     g.radius ?? .5,
     g.tube ?? .12,
     g.radialSegments ?? 8,
     g.tubularSegments ?? 24
    );

   case 'plane':
    return new THREE.PlaneGeometry(...(g.size || [1,1]));

   case 'lathe':
    return new THREE.LatheGeometry(
     g.points.map(p => new THREE.Vector2(...p)),
     g.segments ?? 24
    );

   case 'extrude': {
    const shape = new THREE.Shape();
    g.points.forEach((p,i) => {
     if (i) shape.lineTo(...p);
     else shape.moveTo(...p);
    });
    shape.closePath();

    return new THREE.ExtrudeGeometry(shape,{
     depth: g.depth ?? .4,
     steps: 1,
     bevelEnabled: false,
     curveSegments: 1
    });
   }

   case 'tube': {
    const curve = new THREE.CatmullRomCurve3(
     g.points.map(p => new THREE.Vector3(...p)),
     g.closed ?? false,
     'centripetal'
    );

    return new THREE.TubeGeometry(
     curve,
     g.tubularSegments ?? 32,
     g.radius ?? .08,
     g.radialSegments ?? 8,
     g.closed ?? false
    );
   }

   case 'capsule': {
    const r = g.radius ?? .3;
    const l = g.length ?? 1;
    const n = g.capSegments ?? 6;
    const pts = [];

    for (let i=0;i<=n;i++) {
     const a = -Math.PI/2+i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      -l/2+Math.sin(a)*r
     ));
    }

    for (let i=0;i<=n;i++) {
     const a = i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      l/2+Math.sin(a)*r
     ));
    }

    return new THREE.LatheGeometry(pts,g.radialSegments ?? 20);
   }

   default:
    throw Error('不明なGeometry: '+g.type);
  }
 }

 function updateMaterial(m,d) {
  m.color.set(d.color);
  m.roughness = d.roughness ?? .6;
  m.metalness = d.metalness ?? 0;
  m.opacity = d.opacity ?? 1;
  m.transparent = d.transparent ?? false;
  m.emissive.set(d.emissive ?? '#000000');
  m.emissiveIntensity = d.emissiveIntensity ?? 0;
  m.side = THREE.DoubleSide;
  m.depthWrite = !m.transparent;
  m.needsUpdate = true;
 }

 function buildMaterial(d) {
  const m = new THREE.MeshStandardMaterial();
  updateMaterial(m,d);
  return m;
 }

 function transform(o,d) {
  o.position.fromArray(d.position);
  o.rotation.set(...d.rotation);
  o.scale.fromArray(d.scale || [1,1,1]);
  o.visible = d.visible !== false;
 }

 function buildPart(p,materials) {
  const group = new THREE.Group();
  group.name = p.name;
  group.userData.partId = p.id;
  transform(group,p);

  if (p.type === 'primitive') {
   const mesh = new THREE.Mesh(
    buildGeometry(p.geometry),
    materials[p.material]
   );
   mesh.castShadow = true;
   mesh.receiveShadow = true;
   mesh.userData.partId = p.id;
   group.add(mesh);
  }

  return group;
 }

 function dispose(root) {
  const gs = new Set();
  const ms = new Set();

  root.traverse(o => {
   if (o.geometry) gs.add(o.geometry);
   if (o.material) {
    (Array.isArray(o.material) ? o.material : [o.material])
     .forEach(m => ms.add(m));
   }
  });

  Object.values(root.userData.materials || {}).forEach(m => ms.add(m));
  gs.forEach(g => g.dispose());
  ms.forEach(m => m.dispose());
 }

 function buildModel(spec) {
  const root = new THREE.Group();
  const parts = {};
  const materials = {};
  const anchors = {};

  root.name = spec.meta.name;
  root.userData = {parts,materials,anchors};

  try {
   for (const [id,m] of Object.entries(spec.materials)) {
    materials[id] = buildMaterial(m);
   }

   for (const p of Object.values(spec.parts)) {
    parts[p.id] = buildPart(p,materials);
    root.add(parts[p.id]);
   }

   for (const p of Object.values(spec.parts)) {
    if (p.parent) parts[p.parent].add(parts[p.id]);
   }

   for (const a of Object.values(spec.anchors)) {
    const o = new THREE.Object3D();
    o.name = a.id;
    o.userData.anchorId = a.id;
    transform(o,a);

    (a.parent ? parts[a.parent] : root).add(o);
    anchors[a.id] = o;
   }

   root.updateMatrixWorld(true);
   return root;
  } catch (e) {
   dispose(root);
   throw e;
  }
 }

 // 動きの再生。各部品の基本姿勢に「差分（回転=度, 位置=m）」を足して毎フレーム当てはめる。
 // 使い方: const anim = createAnimator(model, spec); anim.play('walk'); 毎フレーム anim.update(dt,{speed});
 // showEffects: 停止中（動きなし）に効果部品を表示するか（編集画面では true、ゲームでは既定の false）
 function createAnimator(root,spec,{showEffects=false}={}) {
  const D = Math.PI/180;
  const parts = root.userData.parts;
  const clips = spec.animations || {};
  const rest = {};
  const touched = new Set();
  const handlers = {};
  // 効果部品（effect:true。炎・煙・光など）と、その本来の表示設定
  const effects = {};
  // 動きごとに参照している部品（tracks・spins・show）
  const uses = {};
  let current = null;
  let previous = null;
  let fade = 0;
  let fadeTime = 0;

  for (const [id,o] of Object.entries(parts)) {
   rest[id] = {p:o.position.clone(),r:o.rotation.clone(),s:o.scale.clone()};
  }

  for (const p of Object.values(spec.parts || {})) {
   if (p.effect === true && parts[p.id]) effects[p.id] = p.visible !== false;
  }

  for (const [cid,c] of Object.entries(clips)) {
   const used = uses[cid] = new Set((c.show || []).filter(id => parts[id]));

   Object.keys(c.tracks || {}).forEach(id => {
    if (!parts[id]) return;
    touched.add(id);
    used.add(id);
   });
   (c.spins || []).forEach(sp => {
    if (!parts[sp.part]) return;
    touched.add(sp.part);
    used.add(sp.part);
   });
  }

  // Catmull-Rom 補間（ease:"smooth" のとき、前後のキーを使って滑らかにつなぐ）
  function catmull(p0,p1,p2,p3,k) {
   const k2 = k*k;
   const k3 = k2*k;
   return .5*(
    2*p1
    +(-p0+p2)*k
    +(2*p0-5*p1+4*p2-p3)*k2
    +(-p0+3*p1-3*p2+p3)*k3
   );
  }

  function sample(list,t,c) {
   if (!Array.isArray(list) || !list.length) return null;
   if (t <= list[0][0]) return list[0][1];

   for (let i=1;i<list.length;i++) {
    const a = list[i-1];
    const b = list[i];

    if (t <= b[0]) {
     const span = b[0]-a[0];
     const k = span > 0 ? (t-a[0])/span : 1;

     if (c && c.ease === 'smooth' && list.length > 2) {
      const n = list.length;
      const loop = c.loop !== false;
      // くり返す動きは端の前後キーを反対側から、一回きりの動きは端のキーを使う
      const prev = i-2 >= 0 ? list[i-2][1] : loop ? list[n-2][1] : a[1];
      const next = i+1 < n ? list[i+1][1] : loop ? list[1][1] : b[1];
      return [0,1,2].map(j => catmull(prev[j],a[1][j],b[1][j],next[j],k));
     }

     return [0,1,2].map(j => a[1][j]+(b[1][j]-a[1][j])*k);
    }
   }

   return list[list.length-1][1];
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(layer,from,to,inclusive) {
   for (const [t,name] of clips[layer.id].events || []) {
    if ((inclusive ? t >= from : t > from) && t <= to) emit(name,layer.id);
   }
  }

  function advance(layer,step,withEvents) {
   const c = clips[layer.id];
   const dur = c.duration;
   let t = layer.time+step;

   layer.elapsed += step;

   if (withEvents) fire(layer,layer.time,Math.min(t,dur),layer.fresh);
   layer.fresh = false;

   if (t >= dur) {
    if (c.loop === false) {
     t = dur;
    } else {
     t = dur > 0 ? t % dur : 0;
     if (withEvents) fire(layer,0,t,true);
    }
   }

   layer.time = t;
  }

  function addLayer(layer,w,acc) {
   const c = clips[layer.id];
   if (!c || w <= 0) return;

   for (const [id,tr] of Object.entries(c.tracks || {})) {
    if (!parts[id]) continue;

    const a = acc[id] || (acc[id] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    const r = sample(tr.rotation,layer.time,c);
    const p = sample(tr.position,layer.time,c);
    const sc = sample(tr.scale,layer.time,c);

    for (let j=0;j<3;j++) {
     if (r) a.r[j] += r[j]*w;
     if (p) a.p[j] += p[j]*w;
     // 大きさは倍率（1=元の大きさ）。1からのずれを重みで混ぜる
     if (sc) a.s[j] += (sc[j]-1)*w;
    }
   }

   for (const sp of c.spins || []) {
    if (!parts[sp.part]) continue;

    const a = acc[sp.part] || (acc[sp.part] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    a.r['xyz'.indexOf(sp.axis)] += (sp.degPerSec*layer.elapsed % 360)*w;
   }
  }

  function apply() {
   const acc = {};
   const w = previous && fade > 0 ? Math.min(1,fadeTime/fade) : 1;

   if (current) addLayer(current,w,acc);
   if (previous) addLayer(previous,1-w,acc);

   for (const id of touched) {
    const o = parts[id];
    const base = rest[id];
    const a = acc[id] || {r:[0,0,0],p:[0,0,0],s:[0,0,0]};

    o.position.set(base.p.x+a.p[0],base.p.y+a.p[1],base.p.z+a.p[2]);
    o.rotation.set(
     base.r.x+a.r[0]*D,
     base.r.y+a.r[1]*D,
     base.r.z+a.r[2]*D,
     base.r.order
    );
    o.scale.set(
     base.s.x*Math.max(.001,1+a.s[0]),
     base.s.y*Math.max(.001,1+a.s[1]),
     base.s.z*Math.max(.001,1+a.s[2])
    );
   }

   // 効果部品は、それを使う動きの再生中だけ表示する（停止中は showEffects に従う）
   for (const [id,visible] of Object.entries(effects)) {
    const shown = current
     ? !!(uses[current.id]?.has(id) || previous && uses[previous.id]?.has(id))
     : showEffects;
    parts[id].visible = visible && shown;
   }
  }

  function play(id,{fade:f=.2,restart=false}={}) {
   if (!clips[id]) return false;
   if (current && current.id === id && !restart) return true;

   previous = current && f > 0 ? current : null;
   fade = f;
   fadeTime = 0;
   current = {id,time:0,elapsed:0,fresh:true};
   apply();
   return true;
  }

  function stop() {
   current = null;
   previous = null;
   apply();
  }

  // 指定した動きを時刻 t の姿勢で止めて表示する（前の動きのフェードは消し、合図は発火しない）
  function seek(id,t) {
   const c = clips[id];
   if (!c) return false;

   const time = Math.min(c.duration,Math.max(0,Number(t) || 0));

   current = {id,time,elapsed:time,fresh:false};
   previous = null;
   fade = 0;
   fadeTime = 0;
   apply();
   return true;
  }

  function update(dt,{speed=1}={}) {
   if (!current) return;

   const step = Math.max(0,dt)*speed;
   advance(current,step,true);

   if (previous) {
    advance(previous,step,false);
    fadeTime += Math.max(0,dt);
    if (fadeTime >= fade) previous = null;
   }

   apply();
  }

  function on(name,fn) {
   (handlers[name] ??= []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.entries(clips).map(([id,c]) => ({
    id,
    name: c.name || id,
    duration: c.duration,
    loop: c.loop !== false
   }));
  }

  // 作った直後に、効果部品の表示を停止中の状態へそろえる
  apply();

  return {
   play,
   stop,
   seek,
   update,
   on,
   list,
   get playing() {
    return current ? current.id : null;
   }
  };
 }

 // 移動の速さから待機・歩く・走る（乗り物は走行）を選ぶ。アプリの「試してみる」とゲームで共通の判定。
 function pickLocomotion(clips,speed,{walkSpeed=1.2,runSpeed=4}={}) {
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  // 乗り物: 動いていれば走行（車輪の回転は速さに比例）、止まっていれば停止
  if (has('drive') && !has('walk') && !has('run')) {
   return v > .05
    ? {id:'drive',rate:Math.min(5,Math.max(.1,v/walkSpeed))}
    : {id:first('idle'),rate:1};
  }

  if (v < .05) return {id:first('idle'),rate:1};

  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }

  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。setSpeed で移動系を自動選択し、action の一回きりの動きが終わると移動系へ戻る。
 function createController(animator,spec,opts={}) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;
  // play で指定した、続けて再生する動き（null のときは速さで自動選択）
  let hold = null;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
   hold = null;
  }

  // くり返しの動き（炎を吹いて飛ぶ fly など）を続けて再生する。null で自動の切り替えに戻す
  function play(id,{fade=.2}={}) {
   if (id === null || id === undefined) {
    hold = null;
    loco = undefined;
    return true;
   }

   if (dead || !clips[id]) return false;

   hold = id;
   oneShot = null;
   loco = id;
   animator.play(id,{fade});
   return true;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id,{fade=.12}={}) {
   if (dead || !clips[id]) return false;

   animator.play(id,{fade,restart:true});
   oneShot = {id,left:clips[id].duration};
   loco = undefined;
   if (id === 'die') dead = true;

   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);

   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }

   const next = hold ? {id:hold,rate:1} : pickLocomotion(clips,speed,opts);

   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{fade:.2});
    else animator.stop();
   }

   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,
   action,
   play,
   update,
   reset,
   get current() {
    return oneShot ? oneShot.id : loco || null;
   },
   get dead() {
    return dead;
   }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.action('attack'); 毎フレーム hero.update(dt);
 function createCharacter(spec,opts={}) {
  const object = buildModel(spec);
  const animator = createAnimator(object,spec);
  const controller = createController(animator,spec,opts);
  const disposeModel = dispose;

  return {
   object,
   animator,
   setSpeed: controller.setSpeed,
   action: controller.action,
   play: controller.play,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() {
    return controller.current;
   },
   dispose() {
    animator.stop();
    if (object.parent) object.parent.remove(object);
    disposeModel(object);
   }
  };
 }

 function getAnchor(root,id) {
  return root.userData.anchors[id] || null;
 }

 return {
  buildGeometry,
  buildMaterial,
  updateMaterial,
  transform,
  buildPart,
  buildModel,
  getAnchor,
  createAnimator,
  pickLocomotion,
  createController,
  createCharacter,
  dispose
 };

/* ---------- 3Dサポートキャラ「ごっぱ」のセットアップ ---------- */
let hero=null, goppaScene=null, goppaCam=null, goppaRenderer=null, goppaSpeed=0.85, bubbleTimer=0;
function showGoppaBubble(text, ms=2000){
  const b=$("goppaBubble"); if(!b)return;
  b.textContent=text;
  b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove("show"), ms);
}
function initGoppa3D(){
  const wrap=$("goppaStage");
  if(!wrap || typeof THREE==="undefined") return;
  const w=wrap.clientWidth||140, h=wrap.clientHeight||140;
  goppaScene=new THREE.Scene();
  goppaCam=new THREE.PerspectiveCamera(36, w/h, 0.1, 20);
  goppaCam.position.set(0, 0.62, 2.35);
  goppaCam.lookAt(0, 0.46, 0);

  goppaRenderer=new THREE.WebGLRenderer({alpha:true, antialias:true});
  goppaRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  goppaRenderer.setSize(w, h, false);
  wrap.appendChild(goppaRenderer.domElement);

  const amb=new THREE.AmbientLight(0xffffff, 0.85);
  goppaScene.add(amb);
  const dir=new THREE.DirectionalLight(0xfff8e7, 0.95);
  dir.position.set(1.8, 3.0, 2.5);
  goppaScene.add(dir);
  const rim=new THREE.DirectionalLight(0x48cae4, 0.45);
  rim.position.set(-2.0, 1.0, -1.5);
  goppaScene.add(rim);

  hero=ModelRenderer.createCharacter(MODEL_DATA, {walkSpeed:1.2, runSpeed:4});
  hero.object.position.set(0, 0, 0);
  hero.object.rotation.y = Math.atan2(0.32, 1); /* 黒板の中央・プレイヤー側へ斜めに向く */
  goppaScene.add(hero.object);

  /* ジャンプ着地の合図（land）で水しぶき・泡エフェクトを出す */
  hero.on("land", ()=>{
    if(!RM.matches) fxBubbles();
  });

  function resizeGoppa(){
    const cw=wrap.clientWidth||140, ch=wrap.clientHeight||140;
    goppaCam.aspect=cw/ch;
    goppaCam.updateProjectionMatrix();
    goppaRenderer.setSize(cw, ch, false);
  }
  window.addEventListener("resize", resizeGoppa);

  let lastT=performance.now();
  const anchorVec=new THREE.Vector3();
  (function loop(now){
    const dt=Math.min(0.1, (now-lastT)/1000);
    lastT=now;
    const sp = RM.matches ? 0 : goppaSpeed;
    hero.setSpeed(sp);
    hero.update(dt);

    /* 頭上の取付点（anchor_head_top）を使って吹き出しの高さを微調整 */
    const headAnchor = ModelRenderer.getAnchor(hero.object, "anchor_head_top");
    if(headAnchor && goppaCam){
      headAnchor.getWorldPosition(anchorVec);
      anchorVec.project(goppaCam);
      const b=$("goppaBubble");
      if(b && b.classList.contains("show")){
        const py = (1 - (anchorVec.y * 0.5 + 0.5)) * 34;
        b.style.bottom = Math.max(26, Math.min(39, 36 - py * 0.15)).toFixed(1) + "%";
      }
    }

    goppaRenderer.render(goppaScene, goppaCam);
    requestAnimationFrame(loop);
  })(lastT);
}

const GOPPA_LINES=["いっしょに かこう♪","ぼく ごっぱ だよ！","えらい えらい！","どの もじに する？","くるりんっ♪"];

});

/* ---------- 保存（使える環境のみ） ---------- */
function applySaved(raw){
  try{ const v=JSON.parse(raw);
    if(Array.isArray(v)){ v.forEach(c=>{ if(KANA[c]) done.set(c,Math.max(done.get(c)||0,1)); }); } /* 旧形式 */
    else if(v&&typeof v==="object"){
      if(v.done) for(const c in v.done){ if(KANA[c]) done.set(c,Math.max(done.get(c)||0,v.done[c]===2?2:1)); }
      if(v.order==="easy"||v.order==="aiueo") order=v.order;
      if(typeof v.sfx==="boolean") sfxOn=v.sfx;
      if(COLORS[v.chalk]) chalk=v.chalk;
      if(v.stars&&typeof v.stars.n==="number") stars={d:String(v.stars.d||""),n:v.stars.n,b:!!v.stars.b};
      if(Array.isArray(v.rows)) v.rows.forEach(i=>rowsDone.add(i));
    }
  }catch(e){}
}
async function loadDone(){
  let raw=null;
  try{ if(window.storage){ const r=await window.storage.get("hiragana-done",false); if(r&&r.value) raw=r.value; } }catch(e){}
  if(raw===null){ try{ raw=localStorage.getItem("hiragana-done"); }catch(e){} }
  if(!raw)return;
  applySaved(raw); renderTable(); renderOrder(); applyPrefs();
  if(order==="aiueo"&&!started&&cur===EASY[0]) load(ORDER[0]); /* 開始後は文字を切り替えない */
}
function saveDone(){

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(ms,fn,g){return new Promise(res=>{const t0=performance.now();
  (function f(now){ if(g!==gen){res(false);return;} const t=Math.min(1,(now-t0)/ms); fn(t);
    if(t<1)requestAnimationFrame(f); else res(true); })(t0);});}

function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
let jaVoice=null, speakTimer=0, speakQ=[], unlockAt=0, lastPen=-1e9, activeType="";
function pickVoice(){try{const vs=speechSynthesis.getVoices();

/* flush:true は前の発話を止めてから少し待って話す（iOSで発話が落ちるのを防ぐ） */

/* ---------- なぞる／じぶんで ---------- */
function showHint(quiet){
  const g=++gen, s=S[si], resume=mode==="trace"&&idx>0, p=resume?s.pts[idx]:s.pts[0];
  gStart.style.display=""; gStart.setAttribute("transform","translate("+p.x+" "+p.y+")");
  $("startNum").textContent=resume?"":si+1; /* 再開の目印は番号なし */
  if(!quiet){
    if(resume){guide("つづきから なぞろう","resume");runner(g,s);return;}
    const verb=mode==="free"?"かいてみよう":"なぞろう";
    guide((si+1)+"かくめ　きいろの まるから "+verb,"hint-"+mode,"きいろの まるから "+verb);
  }
  if(mode==="trace") runner(g,s);
}
async function runner(g,s){
  while(g===gen){
    if(!await sleep(500,g))return;
    tip.style.display="";
    const l0=mode==="trace"?Math.min(s.len,idx*STEP):0; /* 途中再開なら進捗位置から */
    const ok=await tween(Math.max(600,(s.len-l0)*14),t=>moveTip(s,l0+(s.len-l0)*t),g);
    if(!ok)return; tip.style.display="none";

}
function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};}
function advance(p){
  /* 前回の位置から今回の位置までを STEP 以下に分割し、次のお手本点から連続して進める */
  const s=S[si], last=s.pts.length-1, a=prevP||p, from=idx;
  const n=Math.max(1,Math.ceil(dist(a,p)/STEP));
  for(let k=1;k<=n&&idx<last;k++){
    const q={x:a.x+(p.x-a.x)*k/n,y:a.y+(p.y-a.y)*k/n};
    while(idx<last&&dist(q,s.pts[idx+1])<TOL)idx++;
  }
  prevP=p;
  if(idx!==from)setProg(si,Math.min(s.len,idx*STEP));
  if(idx>=s.pts.length-1)completeStroke();
}
function completeStroke(){
  if(!drawing)return; drawing=false;
  setProg(si,S[si].len); strokeDone(S[si].ink); si++; endInput(); idx=0;
  if(si>=S.length)finish(); else showHint();
}
function finish(){
  finished=true; const g=++gen;
  gStart.style.display="none"; tip.style.display="none";
  done.set(cur,Math.max(done.get(cur)||0,mode==="free"?2:1)); saveDone(); renderTable();
  const pr=PRAISE[Math.random()*PRAISE.length|0];
  guide(pr,"hana","",true);
  showGoppaBubble("やったね！ はなまる💮", 2600);
  hana.setAttribute("d",hanaPath(76,76,15)); hana.style.display="";
  const L=hana.getTotalLength(); hana.style.strokeDasharray=L+" "+L;
  tween(900,t=>{hana.style.strokeDashoffset=L*(1-t);},g);
  speak(cur,false);
  reward(g);
}
function hanaPath(cx,cy,R){
  let d="";const N=240;
  for(let i=0;i<=N;i++){const t=i/N;let a,r;
    if(t<.55){const u=t/.55;a=u*Math.PI*5;r=R*.6*u;}
    else{const u=(t-.55)/.45;a=Math.PI*5+u*Math.PI*2;r=R*(.6+.4*Math.abs(Math.sin(u*Math.PI*6)));}
    d+=(i?"L":"M")+(cx+r*Math.cos(a-Math.PI/2)).toFixed(2)+" "+(cy+r*Math.sin(a-Math.PI/2)).toFixed(2);}
  return d;
}

stage.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(quizOn)return; /* ミニゲーム中は書き込みを受け付けない */
  const pen=e.pointerType==="pen";
  if(pen)lastPen=performance.now();
  else if(e.pointerType==="touch"&&performance.now()-lastPen<1500)return; /* ペン直後の手のひらは無視 */
  if(drawing){
    if(!(pen&&activeType==="touch"))return; /* 2本目の指・手のひらは無視 */
    abortStroke(); /* 指で書きかけ → ペンに切り替え */
  }
  if(!started||mode==="watch")return; /* おてほん中に触っても再生し直さない */
  if(finished)return;
  const s=S[si], p=pt(e);
  const resume=mode==="trace"&&idx>0, anchor=resume?s.pts[idx]:s.pts[0];
  if(dist(p,anchor)>TOL*(mode==="free"?1.8:1.5)){
    stage.classList.remove("shake");void stage.getBoundingClientRect();stage.classList.add("shake");missStart();return;
  }
  ++gen; tip.style.display="none"; drawing=true; prevP=null; activePid=e.pointerId; activeType=e.pointerType;
  goppaSpeed = 1.6; /* 書いている間はごっぱも元気に泳いで応援 */
  if(resume)gStart.style.display="none";
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
  if(mode==="free"){
    userPts=[p]; gStart.style.display="none"; clearFail(); /* 書き直し始めたら、失敗した線だけ消す */
    userPath=el("path",{d:"M"+p.x.toFixed(1)+" "+p.y.toFixed(1)+"l0.01 0"},gUser);
  }else advance(p);
});
stage.addEventListener("pointermove",e=>{
  if(e.pointerType==="pen")lastPen=performance.now();
  if(!drawing||e.pointerId!==activePid)return;
  e.preventDefault();

});
/* ---------- じぶんで：自由書き ---------- */
function freeMove(p){
  if(!userPath)return;
  if(dist(p,userPts[userPts.length-1])<.8)return;
  userPts.push(p);
  userPath.setAttribute("d",userPath.getAttribute("d")+"L"+p.x.toFixed(1)+" "+p.y.toFixed(1));
}
function freeLift(){
  if(!drawing)return; drawing=false;
  endInput();
  const mine=userPath; /* 失敗時に薄く残すため、いま書いた線を控えておく */
  const s=S[si], end=s.pts[s.pts.length-1], last=userPts[userPts.length-1];
  let L=0; for(let k=1;k<userPts.length;k++)L+=dist(userPts[k-1],userPts[k]);
  /* 甘い判定：終点がお手本の終点付近、かつ お手本の半分以上の長さを書いている */
  if(last && dist(last,end)<=TOL*2 && L>=s.len*.5){
    strokeDone(userPath); userPath=null; clearAid(); si++;
    if(si>=S.length)finishFree(); else showHint();
  }else{
    if(userPath){userPath.remove();userPath=null;}
    stage.classList.remove("shake");void stage.getBoundingClientRect();stage.classList.add("shake");
    failAid(mine); guide("おてほんを みて もういちど","retry"); sfx.soft(); setBuddy("oops");
    showHint(true);
  }
}
function finishFree(){
  finished=true; const g=++gen;

  gGhost.classList.add("compare"); gGhost.style.display="";

}
/* 書きかけの画を破棄して、同じ画の始点からやり直せる状態に戻す */
function abortStroke(){
  drawing=false;
  endInput();
  if(mode==="free"){ if(userPath){userPath.remove();userPath=null;} userPts=[]; }
  else if(S[si]){ setProg(si,0); idx=0; }
  activePid=null;
  showHint(true);
}
function lift(e){
  const cancel=!!e&&e.type==="pointercancel"; /* キャンセルでは完成扱いにしない */
  if(e&&e.pointerType==="pen")lastPen=performance.now();
  if(e&&e.pointerId!==activePid)return;
  if(mode==="free"){if(drawing){if(cancel)abortStroke();else freeLift();}return;}
  if(!drawing)return;
  const s=S[si];
  if(!cancel&&idx/(s.pts.length-1)>=.85){completeStroke();return;}
  drawing=false;
  endInput(); /* 進捗（idx）は残す */
  showHint(); /* 続きの位置に再開の目印を出す */
}

/* 効果音（Web Audio の合成音） */
let AC=null, noiseBuf=null, scr=null;
function initAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      AC=new C();
      const n=AC.sampleRate, b=AC.createBuffer(1,n,n), d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      noiseBuf=b;
    }
    if(AC.state==="suspended")AC.resume();
  }catch(e){}
}
function tone(f,t0,dur,vol,type,f2){
  if(!AC||!sfxOn)return;
  try{
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+t0;
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
const sfx={
  pon(){tone(660,0,.14,.22,"sine",880);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,.2,"triangle"));},
  big(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.3,.2,"triangle"));},
  soft(){tone(260,0,.22,.14,"sine",196);}
};
/* チョークのこすれる音：動いている間だけ鳴り、止まるとすぐ消える */
function scratch(){
  if(!AC||!sfxOn||!noiseBuf)return;
  try{
    if(!scr){
      const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2600; f.Q.value=.7;
      const g=AC.createGain(); g.gain.value=0;
      s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); scr=g;
    }
    const t=AC.currentTime;
    scr.gain.cancelScheduledValues(t);
    scr.gain.setTargetAtTime(.05,t,.01);
    scr.gain.setTargetAtTime(0,t+.07,.04);
  }catch(e){}
}

/* 粒の演出（黒板の上） */
let parts=[], fxRun=false;
function addPart(o){parts.push(o); if(!fxRun){fxRun=true;requestAnimationFrame(fxTick);}}
function fxTick(now){
  parts=parts.filter(p=>{
    if(p.t0===undefined)p.t0=now+(p.delay||0);
    const ms=now-p.t0; if(ms<0)return true;
    const t=ms/p.life; if(t>=1){p.el.remove();return false;}
    const T=ms/1000, x=p.x+p.vx*T, y=p.y+p.vy*T+.5*p.g*T*T, sc=p.grow?Math.min(1,t*3):1;
    p.el.setAttribute("transform","translate("+x.toFixed(2)+" "+y.toFixed(2)+") rotate("+(p.rot*T).toFixed(1)+") scale("+sc.toFixed(2)+")");
    p.el.setAttribute("opacity",(t<.6?1:(1-t)/.4).toFixed(2));
    return true;
  });
  if(parts.length)requestAnimationFrame(fxTick); else fxRun=false;
}

  if(stars.n>=5&&!stars.b){stars.b=true;texts.push("ほしが 5こ！ すごい！");}
  renderStars(); saveDone();
  if(!texts.length)return;
  texts.forEach(t=>speak(t,false));
  sleep(1400,g).then(ok=>{
    if(!ok)return;
    msg.textContent=texts.join("　"); sfx.big(); setBuddy("happy");
    showGoppaBubble("すごーい！！🎉", 2600);
    if(!RM.matches){fxConfetti();fxStars();}
    if(rowHit)[...$("table").children].forEach(b=>{if(row.includes(b.textContent))b.classList.add("joy");});
  });
}

/* チョークの色・効果音の設定 */
function applyInk(){
  if(mode==="watch")stage.style.removeProperty("--ink"); else stage.style.setProperty("--ink",COLORS[chalk]);
  stage.style.setProperty("--cmp",chalk==="yellow"?"#f29a94":"rgba(243,207,86,.95)");
}
function applyPrefs(){
  document.querySelectorAll(".chalks button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.chalk===chalk));
  const s=$("sfx"); s.textContent=sfxOn?"🔔":"🔕"; s.setAttribute("aria-pressed",sfxOn);
  applyInk(); renderStars();
}
document.querySelectorAll(".chalks button").forEach(b=>b.onclick=()=>{
  chalk=b.dataset.chalk;applyPrefs();saveDone();sfx.pon();
  if(hero){hero.play(null);hero.action("jump");}
});
$("sfx").onclick=()=>{sfxOn=!sfxOn;applyPrefs();saveDone();if(sfxOn)sfx.pon();};

/* ---------- つぎに やること ---------- */
const FLOW={
  toTrace:["✏️ なぞってみよう","なぞってみよう"],
  toFree:["🖐 じぶんで かいてみよう","じぶんで かいてみよう"],
  next:["▶ つぎの もじ","つぎの もじ"]
};
let flowKind="";
function showFlow(k){
  flowKind=k; const b=$("flow");
  b.textContent=FLOW[k][0]; b.classList.remove("off"); b.classList.toggle("bounce",!RM.matches);
  $("flow2").hidden=!(k==="next"&&mode==="trace"); /* なぞる完了後だけ「じぶんで」への入口を出す */
  document.querySelector(".left").classList.add("act");
  /* toTrace は直前の案内と同じ内容なので読み上げを重ねない */
  if(k!=="toTrace"&&unlocked&&lastGuide!=="flow-"+k){lastGuide="flow-"+k;speak(FLOW[k][1],false);}
}
function hideFlow(){
  flowKind=""; const b=$("flow"); b.classList.add("off"); b.classList.remove("bounce");
  $("flow2").hidden=true;
  document.querySelector(".left").classList.remove("act");
}
$("flow2").onclick=()=>setMode("free");

/* ---------- 「じぶんで」の失敗補助 ---------- */
/* 失敗した線を薄く残し、その画のお手本と終点を見せる。判定は変えない */
function clearFail(){ if(failPath){failPath.remove();failPath=null;} }
function failAid(p){
  clearFail();
  if(p){p.classList.remove("flash");p.classList.add("fail");gUser.appendChild(p);failPath=p;}
  aidOn=true;
  [...gGhost.children].forEach((c,i)=>{c.style.display=i===si?"":"none";});
  gGhost.classList.add("aid"); gGhost.style.display="";
  const s=S[si], e=s.pts[s.pts.length-1], m=$("endMark");
  m.setAttribute("cx",e.x); m.setAttribute("cy",e.y); m.style.display="";
}
function clearAid(){
  clearFail();
  if(!aidOn)return;
  aidOn=false;
  [...gGhost.children].forEach(c=>{c.style.display="";});
  gGhost.classList.remove("aid");
  if(mode==="free")gGhost.style.display="none";
  $("endMark").style.display="none";
}

$("flow").onclick=()=>{
  const k=flowKind;
  if(k==="toTrace")setMode("trace"); else if(k==="toFree")setMode("free"); else if(k==="next")step(1);
};
function setModeUI(m){
  mode=m;
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
}
/* おてほん中の音と粉 */
function demoFx(s,l){
  const k=Math.min(s.pts.length-1,Math.round(l/STEP));
  scratch(); dust(s.pts[k]);
}

/* ---------- ずかん ---------- */
function renderBook(){
  const g=$("bookGrid"); g.innerHTML=""; let n=0;
  ORDER.forEach(c=>{
    const lv=done.get(c)||0, w=WORDS[c];
    if(!lv||!w){const s=document.createElement("span");s.textContent="？";g.appendChild(s);return;}
    n++;
    const b=document.createElement("button"); if(lv===2)b.classList.add("gold");
    b.setAttribute("aria-label",c+" "+w[1]);
    const i=document.createElement("i"); i.textContent=w[0];
    const t=document.createElement("b"); t.textContent=c;
    b.appendChild(i); b.appendChild(t);
    b.onclick=()=>speak(c+"。"+w[1]+"の、"+c);
    g.appendChild(b);
  });
  $("bookCount").textContent=n+" / "+ORDER.length;
}
$("bookBtn").onclick=()=>{renderBook();$("book").hidden=false;};
document.querySelectorAll(".pclose").forEach(b=>b.onclick=()=>{$(b.dataset.close).hidden=true;});
document.querySelectorAll(".panel").forEach(p=>p.addEventListener("click",e=>{if(e.target===p)p.hidden=true;}));

/* ---------- おとなメニュー（⚙ を1.5秒ながおし） ---------- */
$("adultOrder").appendChild(document.querySelector(".order"));
$("adultSfx").appendChild($("sfx"));
let gearT=0;
const gearBtn=$("gearBtn");
gearBtn.addEventListener("pointerdown",()=>{clearTimeout(gearT);gearT=setTimeout(()=>{$("adult").hidden=false;},1500);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>gearBtn.addEventListener(ev,()=>clearTimeout(gearT)));
gearBtn.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- ミニゲーム「どれかな？」 ---------- */
let quizOn=false, qAns="", qN=0, qLock=false;
/* 「を」は読み上げが「お」と同じ音になるので出題しない */
function quizPool(){return [...done.keys()].filter(c=>c!=="を"&&KANA[c]);}
function updateQuizBtn(){const b=$("quizBtn"); if(b)b.disabled=quizPool().length<3;}
function quizProg(){$("qProg").textContent="⭐".repeat(qN)+"☆".repeat(Math.max(0,5-qN));}
function quizOpen(){
  if(quizPool().length<3)return;
  ++gen; endInput(); hideFlow(); tip.style.display="none";
  quizOn=true; quizId++; qN=0; qAns="";
  stage.classList.add("quizzing"); $("quiz").hidden=false;
  if(hero){ hero.play(null); hero.action("turn"); showGoppaBubble("どれかな？ あててね！", 2000); }
  quizNext();
}
function quizNext(){
  const pool=quizPool(); let a;
  do{a=pool[Math.random()*pool.length|0];}while(pool.length>3&&a===qAns);
  qAns=a;
  const others=pool.filter(c=>c!==a).sort(()=>Math.random()-.5).slice(0,2);
  const box=$("qChoices"); box.innerHTML="";
  [a,...others].sort(()=>Math.random()-.5).forEach(c=>{
    const b=document.createElement("button"); b.textContent=c;
    b.onclick=()=>quizPick(b,c);
    box.appendChild(b);
  });
  qLock=false; quizProg(); msg.textContent="ごっぱの もんだい！ どれかな？";
  speak(qAns);
}
function quizPick(b,c){
  if(qLock||!quizOn)return;
  if(c===qAns){
    qLock=true; qN++; quizProg();
    b.classList.add("hit"); sfx.pon(); setBuddy("happy");
    showGoppaBubble("せいかい！ すごい！✨", 1200);
    if(!RM.matches)fxStars();
    const id=quizId;
    setTimeout(()=>{ if(!quizOn||id!==quizId)return; if(qN>=5)quizEnd(); else quizNext(); },900);
  }else{
    b.classList.add("dim"); b.disabled=true; sfx.soft(); setBuddy("oops");
  }
}
function quizEnd(){
  sfx.fanfare(); setBuddy("happy");
  showGoppaBubble("ぜんぶ せいかい！🎉", 2200);
  if(!RM.matches)fxConfetti();
  msg.textContent="ぜんぶ できたね！"; speak("ぜんぶ できたね！");
  const id=quizId;
  setTimeout(()=>{ if(id===quizId)quizClose(); },1500);
}
function quizHide(){
  if(!quizOn)return;
  quizId++; quizOn=false; $("quiz").hidden=true; stage.classList.remove("quizzing");
}
function quizClose(){ if(!quizOn)return; start(); }
$("quizBtn").onclick=quizOpen;
$("qSay").onclick=()=>{if(quizOn&&qAns)speak(qAns);};
$("qClose").onclick=quizClose;

/* ---------- 入力の解除（共通） ---------- */
/* 指を離す・キャンセル・ペンへの切り替え・画の完成・盤面リセットのすべてがここを通る */
function endInput(){
  if(activePid!==null){try{stage.releasePointerCapture(activePid);}catch(_){}}
  drawing=false; activePid=null; activeType=""; prevP=null;
  goppaSpeed = 0.85;
}

/* ---------- はじめる ---------- */
function begin(){
  if(started)return;
  started=true; unlock();
  const w=$("startWrap"); if(w)w.hidden=true;
  if(hero){
    hero.play(null);
    hero.action("emote");
    showGoppaBubble("よろしくね！ いっしょに あそぼう♪", 2500);
  }
}
$("startBtn").onclick=()=>{speak(cur); start();};
/* 「あそぶ」より先に他のボタンが押されても、同じ開始処理をしてからその操作を行う */
document.addEventListener("click",e=>{
  if(started)return;
  const b=e.target&&e.target.closest?e.target.closest("button"):null;
  if(!b)return;
  begin();
  const g0=gen;
  /* 押されたボタンがお手本や練習を始めなかった場合だけ、ここで始める */
  setTimeout(()=>{ if(gen===g0&&!quizOn)start(); },0);
},true);

/* ---------- 五十音表・ボタン ---------- */
function renderTable(){
  const t=$("table"), keep=t.scrollLeft; t.innerHTML="";
  updateQuizBtn();
  ROWS.forEach(row=>{for(const c of row){
    if(c==="　"){t.appendChild(document.createElement("span"));continue;}
    const b=document.createElement("button"); b.textContent=c;
    if(c===cur)b.classList.add("cur"); if(done.has(c))b.classList.add(done.get(c)===2?"hana":"done");
    if(c===cur)b.setAttribute("aria-current","true");
    b.onclick=()=>load(c);
    t.appendChild(b);
    if(c===cur)requestAnimationFrame(()=>{
      if(!b.isConnected)return;
      t.scrollLeft=keep;
      const r=b.getBoundingClientRect(), tr=t.getBoundingClientRect();
      if(r.left<tr.left)t.scrollLeft-=tr.left-r.left+4;
      else if(r.right>tr.right)t.scrollLeft+=r.right-tr.right+4;
      updateFade();
    });
  }});
}
function setMode(m){
  mode=m;
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
  if(hero){
    hero.play(null);
    hero.action("jump");
  }
  start();
}
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function step(dv){const O=order==="easy"?EASY:ORDER, i=O.indexOf(cur);load(O[(i+dv+O.length)%O.length]);}
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
$("again").onclick=()=>start();
$("say").onclick=()=>sayWord();
function renderOrder(){document.querySelectorAll(".order button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.order===order));}
document.querySelectorAll(".order button").forEach(b=>b.onclick=()=>{order=b.dataset.order;renderOrder();saveDone();speak(b.textContent);});
/* 音声は最初の操作のあとから有効（ブラウザの自動再生制限） */
function unlock(){
  initAudio();
  if(unlocked)return; unlocked=true; unlockAt=performance.now();
  try{const u=new SpeechSynthesisUtterance(" ");u.lang="ja-JP";u.volume=0;speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener("pointerup",unlock,true);
document.addEventListener("click",unlock,true);
document.addEventListener("keydown",unlock,true);
/* 五十音表の「つづき」表示（rtl：scrollLeft は右端が0、左へ行くほど負） */
function updateFade(){
  const t=$("table"), w=$("tablewrap"); if(!t||!w)return;
  const max=t.scrollWidth-t.clientWidth, x=Math.abs(t.scrollLeft), over=max>2;
  w.classList.toggle("more-l",over&&x<max-2);
  w.classList.toggle("more-r",over&&x>2);
}
$("table").addEventListener("scroll",updateFade,{passive:true});
window.addEventListener("resize",updateFade);

initGoppa3D();
document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
renderOrder();
applyPrefs();
load(EASY[0]);
loadDone();
