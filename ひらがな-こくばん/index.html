<!DOCTYPE html>
<html lang="ja">
<head>
<!-- APPSTUDIO_PWA_HEAD_START -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#007acc">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<!-- APPSTUDIO_PWA_HEAD_END -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ごっぱと もじで あそぼう！</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.0/dist/abcjs-basic-min.js"></script>
<style>
:root{
  --wall:#e6f4f8; --board:#244c44; --board-deep:#1b3b35; --wood:#c8965a; --wood-dark:#996d39;
  --chalk:#f5f2e6; --yellow:#ffd24c; --pink:#ff8fa3; --orange:#ff7b29; --cyan:#48cae4;
  --text:#1d3530; --muted:#5c7a72;
  --kyokasho:"YuKyokasho Yoko","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Klee One","Klee","Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
html,body{margin:0}
body{
  background:radial-gradient(circle at 15% 15%, #ffffff 0%, #e6f4f8 55%, #d2eef7 100%);
  color:var(--text);font-family:var(--kyokasho);
  padding:12px calc(12px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  min-height:100vh;min-height:100dvh;
}
.app{max-width:960px;margin:0 auto;display:grid;gap:12px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.78);padding:8px 14px;border-radius:18px;
  box-shadow:0 4px 14px rgba(36,76,68,.08);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#count{
  font-size:1.1rem;font-weight:700;color:var(--board);
  background:#e9f5f2;padding:5px 14px;border-radius:999px;
  border:2px solid #cbe4ec;
}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{font:inherit;font-size:1rem;padding:9px 0;min-height:46px;border-radius:999px;border:2px solid var(--board);
  background:rgba(255,255,255,.8);color:var(--board);cursor:pointer;font-weight:700;transition:transform .12s,background .15s}
.modes button[aria-pressed="true"]{background:var(--board);color:var(--chalk);box-shadow:0 3px 0 var(--board-deep)}

.boardwrap{background:linear-gradient(180deg,var(--wood),var(--wood-dark));padding:9px;border-radius:14px;
  width:min(100%,58vh);width:min(100%,58dvh);min-width:240px;margin:0 auto;
  box-shadow:0 6px 0 #7a5428, 0 12px 24px rgba(29,53,48,.16)}
#stage{display:block;width:100%;aspect-ratio:1;background:
  radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.08),transparent 60%),
  radial-gradient(circle at 20% 82%,rgba(72,202,228,.14),transparent 36%),
  var(--board);
  border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.guide{stroke:rgba(245,242,230,.22);stroke-width:.4;stroke-dasharray:1.6 1.6;fill:none}
.ghost path{fill:none;stroke:rgba(245,242,230,.17);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.ink path{fill:none;stroke:var(--ink,var(--chalk));stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.num{font:700 6.5px var(--kyokasho);fill:var(--yellow);stroke:var(--board);stroke-width:1.6;paint-order:stroke;
  text-anchor:middle;dominant-baseline:central}
#startDot{fill:var(--yellow)}
#startRing{fill:none;stroke:var(--yellow);stroke-width:.9;transform-box:fill-box;transform-origin:center;
  animation:ring 1.3s ease-out infinite}
#startNum{font:700 5.2px var(--kyokasho);fill:var(--board-deep);text-anchor:middle;dominant-baseline:central}
#tip{fill:var(--yellow);opacity:.9}
#hana{fill:none;stroke:var(--pink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.shake{animation:shake .3s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.5);opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ごっぱ3Dサポートステージ＆吹き出し */
#goppaStage{
  position:absolute;left:10px;bottom:10px;width:32%;height:32%;z-index:2;
  pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 50% 60%, rgba(72,202,228,.22) 0%, rgba(72,202,228,.06) 52%, transparent 72%);
  transition:left .45s cubic-bezier(.22,1,.36,1), bottom .45s cubic-bezier(.22,1,.36,1), width .45s cubic-bezier(.22,1,.36,1), height .45s cubic-bezier(.22,1,.36,1), opacity .22s ease, transform .22s ease;
}
/* タイトル画面中（開始前）はごっぱをタイトル画面中央の枠いっぱいに大きく登場させる */
#startWrap #goppaStage{
  left:0;bottom:0;width:100%;height:100%;z-index:5;
  background:radial-gradient(circle at 50% 52%, rgba(255,255,255,.55) 0%, rgba(144,224,239,.35) 48%, transparent 72%);
  filter:drop-shadow(0 8px 16px rgba(0,30,60,.3));
}
#goppaStage canvas{width:100%!important;height:100%!important;display:block}
/* ごっぱの居場所：文字の画と重ならない隅へ（タイトル画面では使わない） */
.boardwrap:not(.title-mode)[data-gcorner="tl"] #goppaStage{left:10px;bottom:calc(76% - 10px);width:24%;height:24%}
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaStage{left:calc(76% - 10px);bottom:calc(76% - 10px);width:24%;height:24%}
.boardwrap:not(.title-mode)[data-gcorner="tl"] #goppaHit{left:calc(10px + 5%);bottom:calc(81% - 10px);width:14%;height:14%}
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaHit{left:calc(81% - 10px);bottom:calc(81% - 10px);width:14%;height:14%}
.boardwrap:not(.title-mode)[data-gdim="1"] #goppaStage{opacity:.4;transform:scale(.85)}
.boardwrap:not(.title-mode)[data-gcorner="tl"] #goppaBubble,
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaBubble{top:calc(24% + 14px);bottom:auto}
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaBubble{left:auto;right:14px}
.boardwrap:not(.title-mode)[data-gcorner="tl"] #goppaBubble::after,
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaBubble::after{top:-7px;bottom:auto;border-width:0 6px 7px;border-color:transparent transparent var(--orange)}
.boardwrap:not(.title-mode)[data-gcorner="tr"] #goppaBubble::after{left:auto;right:22px}
/* 3Dが使えないときの絵文字ごっぱ */
.goppa-fallback{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vmin,3.6rem);line-height:1}
#startWrap .goppa-fallback{font-size:clamp(4rem,22vmin,9rem)}
.boardwrap:not(.title-mode)[data-gcorner="tl"] .goppa-fallback,
.boardwrap:not(.title-mode)[data-gcorner="tr"] .goppa-fallback{font-size:clamp(1.4rem,6vmin,2.8rem)}
.goppa-fallback span{display:inline-block;animation:goppaBob 2.4s ease-in-out infinite alternate}
.goppa-fallback.hop span{animation:goppaHop .5s ease-out}
@keyframes goppaBob{0%{transform:translateY(0) rotate(-4deg)}100%{transform:translateY(-8%) rotate(4deg)}}
@keyframes goppaHop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-30%) scale(1.15)}}
.goppa-fallback.wobble span{animation:goppaWobble .8s ease-out}
.goppa-fallback.spin span{animation:goppaSpin 1.2s ease-in-out}
@keyframes goppaWobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes goppaSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(540deg) scale(1.1)}100%{transform:rotate(720deg) scale(1)}}
/* ごっぱの上に出す絵文字演出（ごっぱと一緒に隅・タイトルへ移動する） */
.goppa-fx{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:visible;z-index:3}
.goppa-fx span{position:absolute;left:50%;top:48%;font-size:clamp(.9rem,3.6vmin,1.6rem);line-height:1;
  opacity:0;transform:translate(-50%,-50%);animation:goppaPop .9s ease-out forwards}
#startWrap .goppa-fx span{font-size:clamp(1.4rem,6vmin,2.6rem)}
@keyframes goppaPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  20%{opacity:1;transform:translate(calc(-50% + var(--dx) * .3),calc(-50% + var(--dy) * .3)) scale(1.1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9)}
}
#goppaHit{
  position:absolute;left:calc(10px + 5%);bottom:calc(10px + 5%);width:22%;height:22%;z-index:2;
  border-radius:50%;cursor:pointer;background:transparent;border:0;padding:0;
}
#startWrap #goppaHit{
  left:20%;bottom:15%;width:60%;height:60%;z-index:6;
}
.boardwrap.writing-active #goppaStage{opacity:.55;transform:scale(.92)}
.boardwrap.writing-active #goppaHit{pointer-events:none}
#goppaBubble{
  position:absolute;left:14px;bottom:33%;z-index:6;pointer-events:none;
  background:#fff;color:var(--text);font-weight:700;font-size:clamp(.75rem,2.4vw,.92rem);
  padding:5px 11px;border-radius:999px;border:2px solid var(--orange);
  box-shadow:0 3px 8px rgba(0,0,0,.15);white-space:normal;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.3;
  opacity:0;transform:translateY(6px) scale(.9);transition:opacity .2s,transform .2s,left .3s,bottom .3s;
}
#startWrap #goppaBubble{
  left:50%;bottom:82%!important;transform:translate(-50%, 6px) scale(.9);
}
#startWrap #goppaBubble.show{
  transform:translate(-50%, 0) scale(1);
}
#goppaBubble.show{opacity:1;transform:translateY(0) scale(1)}
#goppaBubble::after{
  content:"";position:absolute;left:22px;bottom:-7px;
  border-width:7px 6px 0;border-style:solid;border-color:var(--orange) transparent transparent;
}
#startWrap #goppaBubble::after{
  left:50%;transform:translateX(-50%);
}

.msgbar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.88);border:2px solid #cbe4ec;border-radius:16px;
  padding:6px 12px;min-height:48px;box-shadow:0 3px 0 rgba(72,202,228,.22);
}
.msg-icon{font-size:1.25rem;line-height:1;flex-shrink:0}
#msg{text-align:center;font-size:1.08rem;font-weight:700;margin:0;color:var(--text)}

.ctrl{display:grid;grid-template-columns:1fr 1.5fr 1fr 1fr;gap:8px}
.ctrl button{font:inherit;font-size:1rem;font-weight:700;padding:12px 0;min-height:46px;border-radius:12px;border:0;cursor:pointer;
  background:#fff;color:var(--text);box-shadow:0 3px 0 #b8ced6}
.ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 #b8ced6}
.ctrl button.go{background:var(--yellow);box-shadow:0 3px 0 #c9a530}

.table{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:minmax(40px,1fr);direction:rtl;gap:4px;
  overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.table button,.table span{direction:ltr;aspect-ratio:3/4;min-width:0}
.table button{font:inherit;font-size:clamp(1rem,4.6vw,1.5rem);padding:0;border-radius:8px;border:0;cursor:pointer;
  background:#fff;color:var(--text);position:relative;box-shadow:0 2px 0 #c8dce2}
.table button.cur{background:var(--orange);color:#fff;box-shadow:0 2px 0 #c4510a;font-weight:700}
.table button.wish{outline:2.5px dashed #ffb703;outline-offset:-2px}
.table button.wish::before{content:"🎁";position:absolute;left:-2px;top:-4px;font-size:.68em;line-height:1;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.table button.done::after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
.table button.hana::after{content:"💮";position:absolute;right:1px;top:1px;font-size:.62em;line-height:1}
.ctrl button{white-space:nowrap;font-size:clamp(.8rem,3.5vw,1rem)}
#word{text-align:center;font-size:1.9rem;min-height:1.5em;margin:0;letter-spacing:.08em}
#word b{color:#e0531f}
.order{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.order button{font:inherit;font-size:.9rem;padding:8px 0;min-height:44px;border-radius:999px;border:2px solid var(--wood-dark);
  background:transparent;color:var(--wood-dark);cursor:pointer}
.order button[aria-pressed="true"]{background:var(--wood-dark);color:#fff}
.user path{fill:none;stroke:var(--ink,var(--chalk));stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.ghost.compare path{stroke:var(--cmp,rgba(243,207,86,.95));stroke-width:2.2}
/* ---------- たのしさの演出 ---------- */
header{flex-wrap:wrap}
.hud{display:flex;align-items:center;gap:8px}
#stars{font-size:.9rem;white-space:nowrap;color:#d48806;font-weight:700}
#sfx{font:inherit;font-size:1.1rem;width:44px;height:44px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.chalks{display:flex;justify-content:center;gap:14px}
.chalks button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid #fff;background:var(--c);cursor:pointer;box-shadow:0 2px 0 #b8ced6;font-size:1.2rem;display:grid;place-items:center}
.chalks button.chalk-rainbow{background:conic-gradient(#ff6b8b,#ffd24c,#7ae582,#48cae4,#b589ff,#ff6b8b)}
.chalks button[aria-pressed="true"]{border-color:var(--orange);transform:scale(1.14)}
#bookBtn{position:relative}
#bookBtn[data-food]::after{
  content:attr(data-food);position:absolute;right:-5px;bottom:-4px;
  background:var(--orange);color:#fff;font-size:.68rem;font-weight:700;
  padding:1px 5px;border-radius:999px;border:1.5px solid #fff;line-height:1.1;
}
.table button.done::after{content:"⭐";width:auto;height:auto;border-radius:0;background:none;right:-2px;top:-3px;font-size:.72em;line-height:1}
.table button.hana::after{right:-2px;top:-3px;font-size:.8em}
.table button.joy{animation:hop2 .5s ease-out 3}
#buddy,#gFx{pointer-events:none}
#startDot{transform-box:fill-box;transform-origin:center}
#gStart.pulse #startDot{animation:pulse .5s ease-out}
.ink path.flash{animation:flashI .45s ease-out}
.user path.flash{animation:flashU .45s ease-out}
.ctrl button.bounce{animation:bounce .9s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(2.4)}100%{transform:scale(1)}}
@keyframes flashI{from{stroke:#fff;stroke-width:12}}
@keyframes flashU{from{stroke:#fff;stroke-width:11}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ---------- つぎに やること・ずかん・おとなメニュー・どれかな？ ---------- */
.boardwrap{position:relative}
.hbtn{font:inherit;font-size:1.1rem;width:44px;height:44px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
#gearBtn{touch-action:none}
.flow{font:inherit;font-size:1.25rem;font-weight:700;width:100%;min-height:52px;border-radius:16px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#ffe066,var(--yellow));color:var(--text);box-shadow:0 4px 0 #c9a530;white-space:nowrap}
.flow.off{visibility:hidden}
.flow.bounce{animation:bounce .9s ease-in-out infinite}
.quizbtn{font:inherit;font-size:1.1rem;font-weight:700;min-height:52px;border-radius:14px;border:2px solid var(--orange);cursor:pointer;background:#fff8f0;color:#c4510a;box-shadow:0 3px 0 #f2c094}
.quizbtn:disabled{opacity:.45;cursor:default;border-color:#ccc;color:var(--muted);box-shadow:none}
.quiz{position:absolute;top:9px;left:9px;right:9px;bottom:9px;z-index:3;display:flex;flex-direction:column;gap:8px;padding:8px}
.quiz[hidden]{display:none}
.qtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;color:var(--chalk);text-align:center;font-size:1rem}
.qtop button{font:inherit;font-size:1.3rem;width:52px;height:52px;padding:0;border-radius:50%;border:0;background:var(--chalk);color:var(--board);cursor:pointer}
.qhint{text-align:center;color:var(--chalk);font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:700;background:rgba(0,0,0,.22);padding:6px 12px;border-radius:999px;align-self:center}
.qchoices{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;padding-top:6px;padding-bottom:24%}
.qchoices button{font:inherit;font-size:clamp(1.6rem,9vmin,4rem);aspect-ratio:1;min-width:0;padding:0;border-radius:16px;border:0;cursor:pointer;
  background:var(--chalk);color:var(--board);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.qchoices button.dim{opacity:.3}
.qchoices button.hit{background:var(--yellow)}
#stage.quizzing>*{visibility:hidden}
#stage.quizzing>#gFx,#stage.quizzing>#buddy{visibility:visible}
.panel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(29,53,48,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.panel[hidden]{display:none}
.sheet{background:var(--wall);border-radius:16px;padding:14px;width:min(100%,640px);max-height:100%;overflow:auto;display:grid;gap:12px}
.ptop{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;font-size:1.2rem}
.pclose{font:inherit;font-size:1.4rem;width:52px;height:52px;padding:0;border-radius:50%;border:0;background:#fff;cursor:pointer;box-shadow:0 2px 0 #b8ced6}
.plabel{margin:0;font-size:.95rem;color:var(--muted)}
/* おとなメニュー：判定のきびしさ・学習の記録 */
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.judge button{font:inherit;font-size:.9rem;padding:8px 0;min-height:44px;border-radius:999px;border:2px solid var(--wood-dark);
  background:transparent;color:var(--wood-dark);cursor:pointer}
.judge button[aria-pressed="true"]{background:var(--wood-dark);color:#fff}
.report{display:grid;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;font-size:.95rem}
.report .rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:.8rem;color:var(--muted)}
.report .rstats b{display:block;font-size:1.25rem;color:var(--board)}
.report .rweak{display:flex;flex-wrap:wrap;gap:6px}
.report .rweak button{font:inherit;font-size:1.2rem;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--orange);background:#fff8f0;color:var(--text);cursor:pointer}
.report .rnote{margin:0;color:var(--muted);font-size:.85rem}
/* ---------- 🐠 ごっぱの もじすいぞくかん ---------- */
#book .sheet.aqua-sheet{
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55) 0%, rgba(144,224,239,.25) 35%, transparent 70%),
    linear-gradient(180deg, #48cae4 0%, #0096c7 48%, #023e8a 100%);
  color:#fff;border:3px solid #90e0ef;box-shadow:0 12px 32px rgba(2,62,138,.55);
  position:relative;overflow-x:hidden;
}
#book .ptop{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
}
#book .ptop b{
  color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);font-size:clamp(1.05rem,4.2vw,1.3rem);
  white-space:nowrap;margin-right:auto;
}
#book .ptop .pclose{order:2;width:44px;height:44px;font-size:1.2rem;flex-shrink:0}
#book .ptop .feed-btn{order:3}
#bookCount{
  order:4;background:rgba(255,255,255,.22);color:#fff;padding:5px 12px;
  border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap;margin-left:auto;
}
.feed-btn{
  font:inherit;font-size:.88rem;font-weight:700;padding:6px 14px;min-height:40px;border-radius:999px;
  border:2px solid #fff;background:linear-gradient(180deg,#ffe066,#ffb703);color:var(--text);
  cursor:pointer;box-shadow:0 3px 0 #c98a00;white-space:nowrap;transition:transform .12s;
}
.feed-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c98a00}
.aqua-food-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;border-radius:16px}
.aqua-food{
  position:absolute;top:-24px;font-size:1.25rem;line-height:1;
  animation:foodFall 1.9s ease-in forwards;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
}
.aqua-note{
  position:absolute;top:-8px;right:-4px;font-size:1rem;line-height:1;pointer-events:none;z-index:3;
  animation:notePop .95s ease-out forwards;
}
.bookgrid button.bubble.eating{
  animation:bubbleEat .55s ease-in-out 2!important;
}
@keyframes foodFall{
  0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:1}
  75%{opacity:1}

.app>*{min-width:0}

.left>.ctrl{grid-row:4}

<script>
/* 3Dモデルデータとレンダラー（ごっぱ） */
function createModelRenderer(THREE) {
 function buildGeometry(g) {
  switch (g.type) {
   case 'box':
    return new THREE.BoxGeometry(...(g.size || [1,1,1]));

   case 'sphere':
    return new THREE.SphereGeometry(
     g.radius ?? .5,
     g.widthSegments ?? 20,
     g.heightSegments ?? 12
    );

   case 'cylinder':
    return new THREE.CylinderGeometry(
     g.radiusTop ?? .5,
     g.radiusBottom ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'cone':
    return new THREE.ConeGeometry(
     g.radius ?? .5,
     g.height ?? 1,
     g.radialSegments ?? 20
    );

   case 'torus':
    return new THREE.TorusGeometry(
     g.radius ?? .5,
     g.tube ?? .12,
     g.radialSegments ?? 8,
     g.tubularSegments ?? 24
    );

   case 'plane':
    return new THREE.PlaneGeometry(...(g.size || [1,1]));

   case 'lathe':
    return new THREE.LatheGeometry(
     g.points.map(p => new THREE.Vector2(...p)),
     g.segments ?? 24
    );

   case 'extrude': {
    const shape = new THREE.Shape();
    g.points.forEach((p,i) => {
     if (i) shape.lineTo(...p);
     else shape.moveTo(...p);
    });
    shape.closePath();

    return new THREE.ExtrudeGeometry(shape,{
     depth: g.depth ?? .4,
     steps: 1,
     bevelEnabled: false,
     curveSegments: 1
    });
   }

   case 'tube': {
    const curve = new THREE.CatmullRomCurve3(
     g.points.map(p => new THREE.Vector3(...p)),
     g.closed ?? false,
     'centripetal'
    );

    return new THREE.TubeGeometry(
     curve,
     g.tubularSegments ?? 32,
     g.radius ?? .08,
     g.radialSegments ?? 8,
     g.closed ?? false
    );
   }

   case 'capsule': {
    const r = g.radius ?? .3;
    const l = g.length ?? 1;
    const n = g.capSegments ?? 6;
    const pts = [];

    for (let i=0;i<=n;i++) {
     const a = -Math.PI/2+i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      -l/2+Math.sin(a)*r
     ));
    }

    for (let i=0;i<=n;i++) {
     const a = i*Math.PI/(2*n);
     pts.push(new THREE.Vector2(
      Math.max(0,Math.cos(a)*r),
      l/2+Math.sin(a)*r
     ));
    }

    return new THREE.LatheGeometry(pts,g.radialSegments ?? 20);
   }

   default:
    throw Error('不明なGeometry: '+g.type);
  }
 }

 function updateMaterial(m,d) {
  m.color.set(d.color);
  m.roughness = d.roughness ?? .6;
  m.metalness = d.metalness ?? 0;
  m.opacity = d.opacity ?? 1;
  m.transparent = d.transparent ?? false;
  m.emissive.set(d.emissive ?? '#000000');
  m.emissiveIntensity = d.emissiveIntensity ?? 0;
  m.side = THREE.DoubleSide;
  m.depthWrite = !m.transparent;
  m.needsUpdate = true;
 }

 function buildMaterial(d) {
  const m = new THREE.MeshStandardMaterial();
  updateMaterial(m,d);
  return m;
 }

 function transform(o,d) {
  o.position.fromArray(d.position);
  o.rotation.set(...d.rotation);
  o.scale.fromArray(d.scale || [1,1,1]);
  o.visible = d.visible !== false;
 }

 function buildPart(p,materials) {
  const group = new THREE.Group();
  group.name = p.name;
  group.userData.partId = p.id;
  transform(group,p);

  if (p.type === 'primitive') {
   const mesh = new THREE.Mesh(
    buildGeometry(p.geometry),
    materials[p.material]
   );
   mesh.castShadow = true;
   mesh.receiveShadow = true;
   mesh.userData.partId = p.id;
   group.add(mesh);
  }

  return group;
 }

 function dispose(root) {
  const gs = new Set();
  const ms = new Set();

  root.traverse(o => {
   if (o.geometry) gs.add(o.geometry);
   if (o.material) {
    (Array.isArray(o.material) ? o.material : [o.material])
     .forEach(m => ms.add(m));
   }
  });

  Object.values(root.userData.materials || {}).forEach(m => ms.add(m));
  gs.forEach(g => g.dispose());
  ms.forEach(m => m.dispose());
 }

 function buildModel(spec) {
  const root = new THREE.Group();
  const parts = {};
  const materials = {};
  const anchors = {};

  root.name = spec.meta.name;
  root.userData = {parts,materials,anchors};

  try {
   for (const [id,m] of Object.entries(spec.materials)) {
    materials[id] = buildMaterial(m);
   }

   for (const p of Object.values(spec.parts)) {
    parts[p.id] = buildPart(p,materials);
    root.add(parts[p.id]);
   }

   for (const p of Object.values(spec.parts)) {
    if (p.parent) parts[p.parent].add(parts[p.id]);
   }

   for (const a of Object.values(spec.anchors)) {
    const o = new THREE.Object3D();
    o.name = a.id;
    o.userData.anchorId = a.id;
    transform(o,a);

    (a.parent ? parts[a.parent] : root).add(o);
    anchors[a.id] = o;
   }

   root.updateMatrixWorld(true);
   return root;
  } catch (e) {
   dispose(root);
   throw e;
  }
 }

 // 動きの再生。各部品の基本姿勢に「差分（回転=度, 位置=m）」を足して毎フレーム当てはめる。
 // 使い方: const anim = createAnimator(model, spec); anim.play('walk'); 毎フレーム anim.update(dt,{speed});
 // showEffects: 停止中（動きなし）に効果部品を表示するか（編集画面では true、ゲームでは既定の false）
 function createAnimator(root,spec,{showEffects=false}={}) {
  const D = Math.PI/180;
  const parts = root.userData.parts;
  const clips = spec.animations || {};
  const rest = {};
  const touched = new Set();
  const handlers = {};
  // 効果部品（effect:true。炎・煙・光など）と、その本来の表示設定
  const effects = {};
  // 動きごとに参照している部品（tracks・spins・show）
  const uses = {};
  let current = null;
  let previous = null;
  let fade = 0;
  let fadeTime = 0;

  for (const [id,o] of Object.entries(parts)) {
   rest[id] = {p:o.position.clone(),r:o.rotation.clone(),s:o.scale.clone()};
  }

  for (const p of Object.values(spec.parts || {})) {
   if (p.effect === true && parts[p.id]) effects[p.id] = p.visible !== false;
  }

  for (const [cid,c] of Object.entries(clips)) {
   const used = uses[cid] = new Set((c.show || []).filter(id => parts[id]));

   Object.keys(c.tracks || {}).forEach(id => {
    if (!parts[id]) return;
    touched.add(id);
    used.add(id);
   });
   (c.spins || []).forEach(sp => {
    if (!parts[sp.part]) return;
    touched.add(sp.part);
    used.add(sp.part);
   });
  }

  // Catmull-Rom 補間（ease:"smooth" のとき、前後のキーを使って滑らかにつなぐ）
  function catmull(p0,p1,p2,p3,k) {
   const k2 = k*k;
   const k3 = k2*k;
   return .5*(
    2*p1
    +(-p0+p2)*k
    +(2*p0-5*p1+4*p2-p3)*k2
    +(-p0+3*p1-3*p2+p3)*k3
   );
  }

  function sample(list,t,c) {
   if (!Array.isArray(list) || !list.length) return null;
   if (t <= list[0][0]) return list[0][1];

   for (let i=1;i<list.length;i++) {
    const a = list[i-1];
    const b = list[i];

    if (t <= b[0]) {
     const span = b[0]-a[0];
     const k = span > 0 ? (t-a[0])/span : 1;

     if (c && c.ease === 'smooth' && list.length > 2) {
      const n = list.length;
      const loop = c.loop !== false;
      // くり返す動きは端の前後キーを反対側から、一回きりの動きは端のキーを使う
      const prev = i-2 >= 0 ? list[i-2][1] : loop ? list[n-2][1] : a[1];
      const next = i+1 < n ? list[i+1][1] : loop ? list[1][1] : b[1];
      return [0,1,2].map(j => catmull(prev[j],a[1][j],b[1][j],next[j],k));
     }

     return [0,1,2].map(j => a[1][j]+(b[1][j]-a[1][j])*k);
    }
   }

   return list[list.length-1][1];
  }

  function emit(name,clipId) {
   const e = {event:name,clip:clipId};
   (handlers[name] || []).forEach(fn => fn(e));
   (handlers['*'] || []).forEach(fn => fn(e));
  }

  function fire(layer,from,to,inclusive) {
   for (const [t,name] of clips[layer.id].events || []) {
    if ((inclusive ? t >= from : t > from) && t <= to) emit(name,layer.id);
   }
  }

  function advance(layer,step,withEvents) {
   const c = clips[layer.id];
   const dur = c.duration;
   let t = layer.time+step;

   layer.elapsed += step;

   if (withEvents) fire(layer,layer.time,Math.min(t,dur),layer.fresh);
   layer.fresh = false;

   if (t >= dur) {
    if (c.loop === false) {
     t = dur;
    } else {
     t = dur > 0 ? t % dur : 0;
     if (withEvents) fire(layer,0,t,true);
    }
   }

   layer.time = t;
  }

  function addLayer(layer,w,acc) {
   const c = clips[layer.id];
   if (!c || w <= 0) return;

   for (const [id,tr] of Object.entries(c.tracks || {})) {
    if (!parts[id]) continue;

    const a = acc[id] || (acc[id] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    const r = sample(tr.rotation,layer.time,c);
    const p = sample(tr.position,layer.time,c);
    const sc = sample(tr.scale,layer.time,c);

    for (let j=0;j<3;j++) {
     if (r) a.r[j] += r[j]*w;
     if (p) a.p[j] += p[j]*w;
     // 大きさは倍率（1=元の大きさ）。1からのずれを重みで混ぜる
     if (sc) a.s[j] += (sc[j]-1)*w;
    }
   }

   for (const sp of c.spins || []) {
    if (!parts[sp.part]) continue;

    const a = acc[sp.part] || (acc[sp.part] = {r:[0,0,0],p:[0,0,0],s:[0,0,0]});
    a.r['xyz'.indexOf(sp.axis)] += (sp.degPerSec*layer.elapsed % 360)*w;
   }
  }

  function apply() {
   const acc = {};
   const w = previous && fade > 0 ? Math.min(1,fadeTime/fade) : 1;

   if (current) addLayer(current,w,acc);
   if (previous) addLayer(previous,1-w,acc);

   for (const id of touched) {
    const o = parts[id];
    const base = rest[id];
    const a = acc[id] || {r:[0,0,0],p:[0,0,0],s:[0,0,0]};

    o.position.set(base.p.x+a.p[0],base.p.y+a.p[1],base.p.z+a.p[2]);
    o.rotation.set(
     base.r.x+a.r[0]*D,
     base.r.y+a.r[1]*D,
     base.r.z+a.r[2]*D,
     base.r.order
    );
    o.scale.set(
     base.s.x*Math.max(.001,1+a.s[0]),
     base.s.y*Math.max(.001,1+a.s[1]),
     base.s.z*Math.max(.001,1+a.s[2])
    );
   }

   // 効果部品は、それを使う動きの再生中だけ表示する（停止中は showEffects に従う）
   for (const [id,visible] of Object.entries(effects)) {
    const shown = current
     ? !!(uses[current.id]?.has(id) || previous && uses[previous.id]?.has(id))
     : showEffects;
    parts[id].visible = visible && shown;
   }
  }

  function play(id,{fade:f=.2,restart=false}={}) {
   if (!clips[id]) return false;
   if (current && current.id === id && !restart) return true;

   previous = current && f > 0 ? current : null;
   fade = f;
   fadeTime = 0;
   current = {id,time:0,elapsed:0,fresh:true};
   apply();
   return true;
  }

  function stop() {
   current = null;
   previous = null;
   apply();
  }

  // 指定した動きを時刻 t の姿勢で止めて表示する（前の動きのフェードは消し、合図は発火しない）
  function seek(id,t) {
   const c = clips[id];
   if (!c) return false;

   const time = Math.min(c.duration,Math.max(0,Number(t) || 0));

   current = {id,time,elapsed:time,fresh:false};
   previous = null;
   fade = 0;
   fadeTime = 0;
   apply();
   return true;
  }

  function update(dt,{speed=1}={}) {
   if (!current) return;

   const step = Math.max(0,dt)*speed;
   advance(current,step,true);

   if (previous) {
    advance(previous,step,false);
    fadeTime += Math.max(0,dt);
    if (fadeTime >= fade) previous = null;
   }

   apply();
  }

  function on(name,fn) {
   (handlers[name] ??= []).push(fn);
   return () => {
    handlers[name] = handlers[name].filter(x => x !== fn);
   };
  }

  function list() {
   return Object.entries(clips).map(([id,c]) => ({
    id,
    name: c.name || id,
    duration: c.duration,
    loop: c.loop !== false
   }));
  }

  // 作った直後に、効果部品の表示を停止中の状態へそろえる
  apply();

  return {
   play,
   stop,
   seek,
   update,
   on,
   list,
   get playing() {
    return current ? current.id : null;
   }
  };
 }

 // 移動の速さから待機・歩く・走る（乗り物は走行）を選ぶ。アプリの「試してみる」とゲームで共通の判定。
 function pickLocomotion(clips,speed,{walkSpeed=1.2,runSpeed=4}={}) {
  const v = Math.max(0,Number(speed) || 0);
  const has = id => !!clips[id];
  const first = (...ids) => ids.find(has) || null;
  const rate = (x,base) => Math.min(3,Math.max(.3,x/base));

  // 乗り物: 動いていれば走行（車輪の回転は速さに比例）、止まっていれば停止
  if (has('drive') && !has('walk') && !has('run')) {
   return v > .05
    ? {id:'drive',rate:Math.min(5,Math.max(.1,v/walkSpeed))}
    : {id:first('idle'),rate:1};
  }

  if (v < .05) return {id:first('idle'),rate:1};

  if (v < runSpeed) {
   const id = first('walk','run');
   return {id,rate:rate(v,id === 'run' ? runSpeed : walkSpeed)};
  }

  const id = first('run','walk');
  return {id,rate:rate(v,id === 'walk' ? walkSpeed : runSpeed)};
 }

 // 動きの切り替え役。setSpeed で移動系を自動選択し、action の一回きりの動きが終わると移動系へ戻る。
 function createController(animator,spec,opts={}) {
  const clips = spec.animations || {};
  let speed = 0;
  let loco;
  let oneShot = null;
  let dead = false;
  // play で指定した、続けて再生する動き（null のときは速さで自動選択）
  let hold = null;

  function reset() {
   loco = undefined;
   oneShot = null;
   dead = false;
   hold = null;
  }

  // くり返しの動き（炎を吹いて飛ぶ fly など）を続けて再生する。null で自動の切り替えに戻す
  function play(id,{fade=.2}={}) {
   if (id === null || id === undefined) {
    hold = null;
    loco = undefined;
    return true;
   }

   if (dead || !clips[id]) return false;

   hold = id;
   oneShot = null;
   loco = id;
   animator.play(id,{fade});
   return true;
  }

  function setSpeed(v) {
   speed = Number(v) || 0;
  }

  function action(id,{fade=.12}={}) {
   if (dead || !clips[id]) return false;

   animator.play(id,{fade,restart:true});
   oneShot = {id,left:clips[id].duration};
   loco = undefined;
   if (id === 'die') dead = true;

   return true;
  }

  function update(dt) {
   const step = Math.max(0,Number(dt) || 0);

   if (oneShot) {
    animator.update(step,{speed:1});
    oneShot.left -= step;
    if (dead || oneShot.left > 0) return;
    oneShot = null;
   }

   const next = hold ? {id:hold,rate:1} : pickLocomotion(clips,speed,opts);

   if (next.id !== loco) {
    loco = next.id;
    if (loco) animator.play(loco,{fade:.2});
    else animator.stop();
   }

   animator.update(step,{speed:next.rate});
  }

  return {
   setSpeed,
   action,
   play,
   update,
   reset,
   get current() {
    return oneShot ? oneShot.id : loco || null;
   },
   get dead() {
    return dead;
   }
  };
 }

 // ゲーム用のキャラ。hero.setSpeed(速さ); hero.action('attack'); 毎フレーム hero.update(dt);
 function createCharacter(spec,opts={}) {
  const object = buildModel(spec);
  const animator = createAnimator(object,spec);
  const controller = createController(animator,spec,opts);
  const disposeModel = dispose;

  return {
   object,
   animator,
   setSpeed: controller.setSpeed,
   action: controller.action,
   play: controller.play,
   update: controller.update,
   reset: controller.reset,
   on: animator.on,
   get current() {
    return controller.current;
   },
   dispose() {
    animator.stop();
    if (object.parent) object.parent.remove(object);
    disposeModel(object);
   }
  };
 }

 function getAnchor(root,id) {
  return root.userData.anchors[id] || null;
 }

 return {
  buildGeometry,
  buildMaterial,
  updateMaterial,
  transform,
  buildPart,
  buildModel,
  getAnchor,
  createAnimator,
  pickLocomotion,
  createController,
  createCharacter,
  dispose

  if(/L\s*[\d.]+\s+[\d.]+\s*$/.test(d) && pts.length>=6){
    const e=pts[pts.length-1], p1=pts[Math.max(0,pts.length-5)], p0=pts[Math.max(0,pts.length-11)];
    const v1x=p1.x-p0.x, v1y=p1.y-p0.y, v2x=e.x-p1.x, v2y=e.y-p1.y;
    const l1=Math.hypot(v1x,v1y)||1, l2=Math.hypot(v2x,v2y)||1;
    const cos=(v1x*v2x+v1y*v2y)/(l1*l2);
    if(cos<0.55) return {kind:"hane", badge:"↗ぴょん", voice:"おわりは ぴょん"};
  }
  if(HARAI_SET.has(base+"-"+i)){
    return {kind:"harai", badge:"💨すーっ", voice:"おわりは すーっ"};
  }
  return {kind:"tome", badge:"●ぴたっ", voice:"おわりは ぴたっ"};
}

/* ---------- 3Dサポートキャラ「ごっぱ」のセットアップ ---------- */
let hero=null, goppaScene=null, goppaCam=null, goppaRenderer=null, goppaSpeed=0.85, bubbleTimer=0;
const GOPPA_BASE_Y = Math.atan2(0.32, 1);
/* ごっぱの居場所の候補（黒板座標）。右下ははなまる用なので使わない */
const GOPPA_CORNERS={
  bl:{x0:0,x1:34,y0:66,y1:100,cx:18,cy:82,yaw:GOPPA_BASE_Y},
  tl:{x0:0,x1:30,y0:0,y1:30,cx:15,cy:15,yaw:GOPPA_BASE_Y},
  tr:{x0:70,x1:100,y0:0,y1:30,cx:85,cy:15,yaw:-GOPPA_BASE_Y}
};
let goppaCorner="bl", goppaBaseYaw=GOPPA_BASE_Y;
let goppaTargetYaw = GOPPA_BASE_Y, goppaTargetPitch = 0;
let goppaLoopOn=false, goppaFallbackOn=false, goppaResizeFn=null;
/* 向きの追従用（重ねる回転と分けて持つ） */
let goppaYaw=GOPPA_BASE_Y;
/* タップで重ねる動き：各値は残り時間（秒） */
const POKE_DUR={squash:.25,wobble:.8,spin:1.2};
const goppaPoke={squash:0,wobble:0,spin:0,wobbleT:0,spinOff:0};
function applyGoppaPoke(dt){
  if(!hero)return;
  const o=hero.object, P=goppaPoke;
  if(RM.matches){ P.squash=0; P.wobble=0; P.spin=0; P.spinOff=0; }
  /* ぷにっ（つぶれて戻る） */
  let k=0;
  if(P.squash>0){ P.squash=Math.max(0,P.squash-dt); k=P.squash/POKE_DUR.squash; }
  o.scale.set(1+.12*k, 1-.15*k, 1+.12*k);
  /* プルプル（くすぐったい） */
  if(P.wobble>0){
    P.wobble=Math.max(0,P.wobble-dt); P.wobbleT+=dt;
    o.rotation.z=Math.sin(P.wobbleT*30)*.25*(P.wobble/POKE_DUR.wobble);
  }else o.rotation.z=0;
  /* ぐるぐる（めがまわる）：終わったら近い向きから0.3秒以内に戻す */
  if(P.spin>0){
    P.spin=Math.max(0,P.spin-dt); P.spinOff+=12*dt;
  }else if(P.spinOff!==0){
    const TAU=Math.PI*2;
    let a=((P.spinOff%TAU)+TAU)%TAU; if(a>Math.PI)a-=TAU;
    const back=Math.PI/.3*dt;
    P.spinOff=Math.abs(a)<=back?0:a-Math.sign(a)*back;
  }
  o.rotation.y=goppaYaw+P.spinOff;
}

function lookAtBoardPoint(x, y){

  const c=GOPPA_CORNERS[goppaCorner]||GOPPA_CORNERS.bl;
  const dx = Math.max(-85, Math.min(85, x - c.cx)) / 85;
  const dy = Math.max(-85, Math.min(85, y - c.cy)) / 85;
  goppaTargetYaw = goppaBaseYaw + dx * 0.55;
  goppaTargetPitch = dy * 0.32;
}

}

/* 文字の画と重ならない隅を選ぶ（同数なら 左下 → 左上 → 右上 の順） */
function placeGoppa(){
  if(quizOn){ setGoppaCorner("bl", false); return; }
  const M=6, count={bl:0,tl:0,tr:0};
  S.forEach(s=>s.pts.forEach(p=>{
    for(const k in count){
      const z=GOPPA_CORNERS[k];
      if(p.x>=z.x0-M&&p.x<=z.x1+M&&p.y>=z.y0-M&&p.y<=z.y1+M) count[k]++;
    }
  }));
  let best="bl";
  if(count.bl>0){
    ["tl","tr"].forEach(k=>{ if(count[k]<count[best]) best=k; });
  }
  setGoppaCorner(best, count[best]>0);
}

function setupGoppa3D(wrap){

  goppaRenderer=new THREE.WebGLRenderer({alpha:true, antialias:true});

  goppaRenderer.setSize(w, h, false);

  showGoppaBubble("いっしょに あそぼう♪", 3500);

  /* ジャンプ着地の合図（land）で水しぶき・泡エフェクトを出す */
  hero.on("land", ()=>{

  });

  let lastW=0, lastH=0;
  function resizeGoppa(){
    const cw=wrap.clientWidth||140, ch=wrap.clientHeight||140;
    if(cw===lastW && ch===lastH)return;
    lastW=cw; lastH=ch;
    goppaCam.aspect=cw/ch;
    goppaCam.updateProjectionMatrix();
    goppaRenderer.setSize(cw, ch, false);
  }
  goppaResizeFn=resizeGoppa;
  window.addEventListener("resize", resizeGoppa);

  let lastT=performance.now();
  const anchorVec=new THREE.Vector3();
  goppaLoopOn=true;
  (function loop(now){
    if(!goppaLoopOn || !hero || !goppaRenderer) return;
    const dt=Math.min(0.1, (now-lastT)/1000);
    lastT=now;
    resizeGoppa();
    const sp = RM.matches ? 0 : (started ? goppaSpeed : 1.35);
    hero.setSpeed(sp);
    hero.update(dt);

    /* 筆先への視線・向きの滑らかな追従（タップで重ねる動きはこのあと加える） */
    const easeK = Math.min(1, dt * 8);
    goppaYaw += (goppaTargetYaw - goppaYaw) * easeK;
    hero.object.rotation.x += (goppaTargetPitch - hero.object.rotation.x) * easeK;
    applyGoppaPoke(dt);

    /* 頭上の取付点（anchor_head_top）を使って吹き出しの高さを微調整 */
    const headAnchor = ModelRenderer.getAnchor(hero.object, "anchor_head_top");
    if(headAnchor && goppaCam){

      const blFree = goppaCorner==="bl" && !(bw && bw.classList.contains("title-mode"));
      if(b && !blFree){

      }else if(b && b.classList.contains("show")){

      }

    if($("book").hidden && $("adult").hidden) goppaRenderer.render(goppaScene, goppaCam);
    requestAnimationFrame(loop);
  })(lastT);
}

/* ---------- 保存（IndexedDBメイン＋既存ストレージ互換） ---------- */
const DB_NAME="goppa-hiragana-db", DB_STORE="appData", DB_KEY="state";
function openGoppaDB(){
  return new Promise(res=>{
    try{
      if(typeof indexedDB==="undefined"){res(null);return;}
      const req=indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
async function idbGet(){
  const db=await openGoppaDB(); if(!db)return null;
  return new Promise(res=>{
    try{
      const tx=db.transaction(DB_STORE,"readonly"), r=tx.objectStore(DB_STORE).get(DB_KEY);
      r.onsuccess=()=>res(r.result||null);
      r.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}
async function idbSet(obj){
  const db=await openGoppaDB(); if(!db)return false;
  return new Promise(res=>{
    try{
      const tx=db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).put(obj, DB_KEY);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>res(false);
    }catch(e){res(false);}
  });
}
function applySaved(raw){
  try{
    const v=typeof raw==="string"?JSON.parse(raw):raw;
    if(Array.isArray(v)){ v.forEach(c=>{ if(KANA[c]) done.set(c,Math.max(done.get(c)||0,1)); }); } /* 旧形式 */
    else if(v&&typeof v==="object"){
      if(v.done) for(const c in v.done){ if(KANA[c]) done.set(c,Math.max(done.get(c)||0,v.done[c]===2?2:1)); }
      if(v.works&&typeof v.works==="object"){
        for(const c in v.works){
          const raw=v.works[c];
          /* 旧形式（1文字1件）と新形式（古い順の履歴の配列）の両方を読む */
          const list=(Array.isArray(raw)?raw:[raw]).map(normalizeWork).filter(Boolean)
            .sort((a,b)=>a.t-b.t);
          if(KANA[c]&&list.length){
            while(list.length>WORK_MAX) list.splice(1,1);
            works.set(c,list);
            done.set(c, 2);
          }
        }
      }
      if(v.order==="easy"||v.order==="aiueo") order=v.order;
      if(typeof v.sfx==="boolean") sfxOn=v.sfx;
      if(COLORS[v.chalk]) chalk=v.chalk;
      if(v.stars&&typeof v.stars.n==="number") stars={d:String(v.stars.d||""),n:v.stars.n,b:!!v.stars.b};
      if(Array.isArray(v.rows)) v.rows.forEach(i=>rowsDone.add(i));
      if(v.judge==="easy"||v.judge==="normal"||v.judge==="hard") judge=v.judge;
      if(typeof v.food==="number"&&v.food>=0) food=Math.round(v.food);
      if(typeof v.wish==="string"&&KANA[v.wish]) wishChar=v.wish;
      if(v.grades&&typeof v.grades==="object"){
        for(const c in v.grades){
          const n=Math.round(Number(v.grades[c]));
          if(KANA[c]&&n>=1&&n<=3) grades.set(c,Math.max(grades.get(c)||0,n));
        }
      }
    }
  }catch(e){}
}
async function loadDone(){
  let data=await idbGet(), fromLegacy=false;

function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};}
function advance(p){
  /* 現在の進捗点から大きく離れた場所（TOL*2.4以上）をこすっている場合は進めず、やさしく案内する */
  const s=S[si], last=s.pts.length-1, curPt=s.pts[idx];
  if(dist(p,curPt)>TOL*2.4 && dist(p,s.pts[Math.min(last,idx+1)])>TOL*2.2){
    offTrackCount++;

    const now=performance.now();
    if(offTrackCount>=8 && now-lastOffBubble>2200){
      lastOffBubble=now;
      showGoppaBubble("せんの うえを ゆっくり なぞろう♪", 2000);
    }
    return;
  }
  offTrackCount=0;
  /* 前回の位置から今回の位置までを STEP 以下に分割し、次のお手本点から連続して進める */
  const a=prevP||p, from=idx;
  const n=Math.max(1,Math.ceil(dist(a,p)/STEP));
  for(let k=1;k<=n&&idx<last;k++){
    const q={x:a.x+(p.x-a.x)*k/n,y:a.y+(p.y-a.y)*k/n};
    while(idx<last&&dist(q,s.pts[idx+1])<TOL)idx++;

function hanaPath(cx,cy,R){
  let d="";const N=240;
  for(let i=0;i<=N;i++){const t=i/N;let a,r;
    if(t<.55){const u=t/.55;a=u*Math.PI*5;r=R*.6*u;}
    else{const u=(t-.55)/.45;a=Math.PI*5+u*Math.PI*2;r=R*(.6+.4*Math.abs(Math.sin(u*Math.PI*6)));}
    d+=(i?"L":"M")+(cx+r*Math.cos(a-Math.PI/2)).toFixed(2)+" "+(cy+r*Math.sin(a-Math.PI/2)).toFixed(2);}
  return d;
}

function freeMove(p){

/* 判定のきびしさ（easy は従来の甘い判定と同じ、normal 以上は書く向きも確認） */
const JUDGE={
  easy:{end:TOL*2,minL:.5,maxL:Infinity,dev:Infinity,ordered:false},
  normal:{end:TOL*2,minL:.6,maxL:2.2,dev:14,ordered:true},
  hard:{end:TOL*1.4,minL:.7,maxL:1.6,dev:9,ordered:true}
};
/* 失敗の理由ごとの ひとこと */
const FAIL_TIPS={
  short:"もっと ながく、おわりまで かこう",
  long:"ながすぎるよ。おてほんを みて もういちど",
  end:"おわりの ばしょを よく みて もういちど",
  order:"きいろの まるから じゅんばんに かこう",
  shape:"おてほんの せんに そって かいてみよう"
};
/* 線を長さに沿って n 点に打ち直す */
function resample(pts,n){
  if(pts.length<2)return Array.from({length:n},()=>({x:pts[0].x,y:pts[0].y}));
  const acc=[0]; for(let i=1;i<pts.length;i++)acc.push(acc[i-1]+dist(pts[i-1],pts[i]));
  const total=acc[acc.length-1]||1, out=[]; let j=1;
  for(let k=0;k<n;k++){
    const d=total*k/(n-1);
    while(j<pts.length-1&&acc[j]<d)j++;
    const a=pts[j-1], b=pts[j], seg=(acc[j]-acc[j-1])||1, t=Math.min(1,Math.max(0,(d-acc[j-1])/seg));
    out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  }
  return out;
}
/* お手本とのずれ（平均距離）。ordered=true は順番どおりにたどれているかも見る */
function strokeDev(up,s,ordered){
  const N=24, u=resample(up,N);
  let t=0;
  if(ordered){ const m=resample(s.pts,N); for(let i=0;i<N;i++)t+=dist(u[i],m[i]); return t/N; }
  for(const p of u){ let best=1e9; for(const q of s.pts){ const d=dist(p,q); if(d<best)best=d; } t+=best; }
  return t/N;
}
/* 1文字の評価：線のずれ・大きさ・位置から ⭐1〜3 と ひとこと */
function gradeFree(){
  if(!freeDevs.length||!freeAll.length)return null;
  const avg=freeDevs.reduce((a,b)=>a+b,0)/freeDevs.length;
  const box=ps=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ps.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});return{w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};};
  const u=box(freeAll), m=box(S.flatMap(s=>s.pts));
  const ratio=Math.max(u.w,u.h)/Math.max(1,Math.max(m.w,m.h));
  const off=Math.hypot(u.cx-m.cx,u.cy-m.cy);
  let stars=avg<=5?3:avg<=9?2:1, tip;
  if(ratio<.72){ stars=Math.max(1,stars-1); tip="もうすこし おおきく かけると もっと すてき！"; }
  else if(ratio>1.35){ stars=Math.max(1,stars-1); tip="もうすこし ちいさく かいてみよう"; }
  else if(off>16){ stars=Math.max(1,stars-1); tip="ますの まんなかに かいてみよう"; }
  else if(stars<3) tip="おてほんを よく みて かくと もっと じょうずに なるよ";
  else tip="かたちも ばっちり！";
  return {stars,tip};
}
function freeLift(){
  if(!drawing)return; drawing=false;
  endInput();
  const mine=userPath; /* 失敗時に薄く残すため、いま書いた線を控えておく */
  const s=S[si], end=s.pts[s.pts.length-1], last=userPts[userPts.length-1];
  let L=0; for(let k=1;k<userPts.length;k++)L+=dist(userPts[k-1],userPts[k]);
  /* 同じ画で2回以上連続失敗している場合は JUDGE.easy に緩和して挫折を防ぐ */
  const J = strokeFailCount>=2 ? JUDGE.easy : (JUDGE[judge]||JUDGE.normal);
  let why="";
  if(!last||L<s.len*J.minL) why="short";
  else if(L>s.len*J.maxL) why="long";
  else if(dist(last,end)>J.end) why="end";
  let dev=0;
  if(!why){
    dev=strokeDev(userPts,s,J.ordered);
    if(dev>J.dev){
      /* 逆向きや途中の順序ずれの場合は「きいろの まるから じゅんばんに かこう」と案内 */
      const unordDev=strokeDev(userPts,s,false);
      why = (J.ordered && unordDev<=J.dev) ? "order" : "shape";
    }
  }
  if(!why){
    strokeFailCount=0;
    freeDevs.push(dev); freeAll.push(...userPts);
    strokeDone(userPath); userPath=null; clearAid(); si++;
    if(si>=S.length)finishFree(); else showHint();
  }else{
    strokeFailCount++;
    if(userPath){userPath.remove();userPath=null;}
    stage.classList.remove("shake");void stage.getBoundingClientRect();stage.classList.add("shake");
    failAid(mine); guide(FAIL_TIPS[why],"retry-"+why); sfx.soft(); setBuddy("oops");
    showHint(true);
  }
}
function finishFree(){
  finished=true; const g=++gen;
  gStart.style.display="none"; tip.style.display="none"; hideEndGuide();
  gGhost.classList.add("compare"); gGhost.style.display="";
  guide("おてほんと くらべてみよう","compare");
  if(hero) hero.action("turn");
  sleep(1500,g).then(ok=>{if(ok)finish();});
}
/* 書きかけの画を破棄して、同じ画の始点からやり直せる状態に戻す */
function abortStroke(){
  drawing=false;
  endInput();
  if(mode==="free"){ if(userPath){userPath.remove();userPath=null;} userPts=[]; }
  else if(S[si]){ setProg(si,0); idx=0; }
  activePid=null;
  showHint(true);
}
function lift(e){
  const cancel=!!e&&e.type==="pointercancel"; /* キャンセルでは完成扱いにしない */
  if(e&&e.pointerType==="pen")lastPen=performance.now();
  if(e&&e.pointerId!==activePid)return;
  if(mode==="free"){if(drawing){if(cancel)abortStroke();else freeLift();}return;}
  if(!drawing)return;
  const s=S[si];
  if(!cancel&&idx/(s.pts.length-1)>=.85){completeStroke();return;}
  drawing=false;
  endInput(); /* 進捗（idx）は残す */
  showHint(); /* 続きの位置に再開の目印を出す */
}

/* ---------- ABC簡易パーサー ---------- */
/*
 * この曲で使用するABC表記に対応する。
 * 音符、休符、オクターブ記号、音価、和音を解析する。
 * 汎用ABCプレイヤーではなく、この楽譜専用の軽量実装。
 */

const BGM_NOTE_BASE={
  C:0,D:2,E:4,F:5,G:7,A:9,B:11
};

/* 調号 F major：Bは標準でフラット */
function bgmPitch(token,octaveOffset=0){
  const m=token.match(/^([\^_=]*)([A-Ga-g])([,']*)$/);
  if(!m)return null;

  const accidental=m[1];
  const letter=m[2];
  const marks=m[3];
  const upper=letter.toUpperCase();

  let midi=60+BGM_NOTE_BASE[upper];

  if(letter!==upper)midi+=12;

  for(const c of marks){
    if(c==="'")midi+=12;
    if(c===",")midi-=12;
  }

  if(accidental.includes("^"))midi+=1;
  else if(accidental.includes("_"))midi-=1;
  else if(accidental.includes("=")){
    /* ナチュラル */
  }else if(upper==="B"){
    midi-=1;
  }

  return midi+octaveOffset;
}

function parseBgmVoice(voice){
  const events=[];

  const bars=voice.notes
    .replace(/\s/g,"")
    .replace(/:/g,"")
    .split("|")
    .filter(Boolean);

  const totalBars=Math.min(BGM_SCORE.bars,bars.length);

  for(let bar=0;bar<totalBars;bar++){
    const src=bars[bar];
    let local=0;

    const re=/(\[[^\]]+\]|[\^_=]*[A-Ga-gz][,']*)(\d+)?/g;
    let match;

    while((match=re.exec(src))!==null){
      const raw=match[1];
      const len=Math.max(1,Number(match[2]||1));

      if(raw!=="z"){
        const chord=raw.startsWith("[")
          ? raw.slice(1,-1).match(/[\^_=]*[A-Ga-g][,']*/g)||[]
          : [raw];

        for(const note of chord){
          const pitch=bgmPitch(note,voice.octave||0);
          if(pitch!==null){
            events.push({
              tick:bar*8+local,
              length:Math.min(len,8-local),
              pitch,
              voice
            });
          }
        }
      }

      local+=len;

      if(local>=8)break;
    }
  }

  return events;
}

/*

 * 上から順に試し、最初に取得できた場所を使う。
 * jsDelivrはthree.js・abcjs本体と同じCDNなので、
 * github.ioに届かない環境でも取得できる可能性が高い。
 */
const BGM_SOUNDFONT_URLS=[
  "https://cdn.jsdelivr.net/gh/paulrosen/midi-js-soundfonts@gh-pages/abcjs/",
  "https://paulrosen.github.io/midi-js-soundfonts/abcjs/",
  "https://paulrosen.github.io/midi-js-soundfonts/FluidR3_GM/"
];
let bgmSoundFontUrl=null;

/* 各候補へ小さなテスト取得を行い、使える取得先を選ぶ */
async function pickSoundFontUrl(){
  if(bgmSoundFontUrl)return bgmSoundFontUrl;

  for(const url of BGM_SOUNDFONT_URLS){
    const ctrl=typeof AbortController!=="undefined"
      ? new AbortController()
      : null;
    const timer=setTimeout(()=>{
      if(ctrl)ctrl.abort();
    },6000);

    try{
      const res=await fetch(
        url+"acoustic_grand_piano-mp3/C4.mp3",
        {
          mode:"cors",
          cache:"force-cache",
          signal:ctrl?ctrl.signal:undefined
        }
      );

      if(res.ok){
        bgmSoundFontUrl=url;
        return url;
      }

      console.warn("BGM音源の取得先を利用できません",url,res.status);
    }catch(e){
      console.warn("BGM音源の取得先に接続できません",url,e);
    }finally{
      clearTimeout(timer);
    }
  }

  throw new Error("BGM音源の取得先に接続できません");
}

async function prepareAbcBgm(){
  if(bgmBuffer)return bgmBuffer;
  if(bgmLoadPromise)return bgmLoadPromise;

  bgmLoadPromise=(async()=>{
    if(typeof ABCJS==="undefined"||
       !ABCJS.synth||
       !ABCJS.synth.supportsAudio()){
      throw new Error("abcjsの音声再生機能を利用できません");
    }

    if(!AC){
      throw new Error("AudioContextが初期化されていません");
    }

    /*
     * 描画先を指定せずABCを解析する。
     * 楽譜の表示UIは生成しない。
     */
    const visualObjects=ABCJS.renderAbc("*",BGM_ABC);

    if(!visualObjects||!visualObjects[0]){
      throw new Error("ABC楽譜の解析に失敗しました");
    }

    /*
     * 接続できる取得先を選んでから、
     * その場所の楽器音でabcjsを初期化する。
     */
    const soundFontUrl=await pickSoundFontUrl();

    const synth=new ABCJS.synth.CreateSynth();

    const result=await synth.init({
      audioContext:AC,
      visualObj:visualObjects[0],
      options:{
        soundFontUrl
      }
    });

    /*
     * 一部のSoundFont取得失敗だけで
     * 楽曲全体を停止しない。
     */
    if(result.error&&result.error.length){
      console.warn(
        "一部のBGM音源を取得できませんでした",
        result.error
      );
    }

    const loadedCount=(result.loaded||[]).length;
    const cachedCount=(result.cached||[]).length;

    if(
      result.error&&result.error.length&&
      loadedCount+cachedCount===0
    ){
      throw new Error("BGM音源を取得できませんでした");
    }

    await synth.prime();

    const buffer=synth.getAudioBuffer();

    if(!buffer||buffer.length===0){
      throw new Error("BGMバッファを生成できませんでした");
    }

    bgmSynth=synth;
    bgmBuffer=buffer;

    return buffer;
  })();

  try{
    return await bgmLoadPromise;
  }catch(e){
    bgmLoadPromise=null;
    bgmSynth=null;
    bgmBuffer=null;
    throw e;
  }
}

/*
 * 停止済みのAudioBufferSourceNodeは再利用できない。
 * 再生するたびに新しいSourceNodeを作る。
 */
function playAbcBgmBuffer(buffer){
  if(!AC||!bgmBus||!buffer)return;

  if(bgmSource){
    try{
      bgmSource.stop();
      bgmSource.disconnect();
    }catch(e){}
    bgmSource=null;
  }

  const source=AC.createBufferSource();

  source.buffer=buffer;
  source.loop=true;

  source.connect(bgmBus);

  bgmSource=source;

  source.onended=()=>{
    try{source.disconnect();}catch(e){}
    if(bgmSource===source){
      bgmSource=null;
    }
  };

  source.start(0);
}

 *
 * 両者を分けることで、BGMを小さくしても
 * 効果音まで小さくなることを防ぐ。
 */

const AUDIO_MIX={
  bgm:0.11,
  abcBgm:0.45,
  sfx:0.85,
  fade:0.18
};

const BGM_TIMING={
  eighth:60/BGM_SCORE.bpm/2,
  lookAhead:0.35,
  interval:100
};

let bgmTimer=null;
let bgmPlaying=false;
let bgmStartTime=0;
let bgmNextTick=0;
let bgmRunId=0;

function initAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C)return;

      AC=new C();

      /* 効果音専用バス */
      sfxBus=AC.createGain();
      sfxBus.gain.value=AUDIO_MIX.sfx;
      sfxBus.connect(AC.destination);

      /* BGM専用バス */
      bgmBus=AC.createGain();
      bgmBus.gain.value=0;
      bgmBus.connect(AC.destination);

      /* 既存のチョーク音に使用するノイズ */
      const n=AC.sampleRate;
      const b=AC.createBuffer(1,n,n);
      const d=b.getChannelData(0);

      for(let i=0;i<n;i++){
        d[i]=Math.random()*2-1;
      }

      noiseBuf=b;
    }

    if(AC.state==="suspended"){
      const p=AC.resume();
      if(p&&p.catch)p.catch(()=>{});
    }

  }catch(e){}
}

/* ---------- BGM音源 ---------- */

function bgmFrequency(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

/*
 * ピークを抑えた1音の合成。
 * 音符ごとに独立したGainNodeを生成し、
 * 再生終了後はWeb Audio側で自然に解放する。
 */
function playBgmNote(event,when){
  if(!AC||!bgmBus||!bgmPlaying)return;

  try{
    const v=event.voice;
    const duration=Math.max(
      0.04,
      event.length*BGM_TIMING.eighth
    );

    const oscillator=AC.createOscillator();
    const gain=AC.createGain();

    let frequency=bgmFrequency(event.pitch);

    if(v.percussion){
      /* ウッドブロック：高音の短いクリック */
      frequency=1050;
    }

    oscillator.type=v.type;
    oscillator.frequency.setValueAtTime(frequency,when);

    if(v.percussion){
      oscillator.frequency.exponentialRampToValueAtTime(
        650,when+0.025
      );
    }

    const attack=Math.min(v.attack,duration*0.4);

    const release=Math.min(
      v.release,
      Math.max(0.025,duration*0.45)
    );

    let noteEnd=when+duration;

    if(v.percussion){
      noteEnd=when+0.045;
    }

    const peak=v.level;

    gain.gain.setValueAtTime(0,when);

    gain.gain.linearRampToValueAtTime(
      peak,
      when+Math.min(attack,0.015+(duration*0.1))
    );

    if(v.name==="Strings"){
      gain.gain.setValueAtTime(
        peak,
        Math.max(when+attack,noteEnd-release)
      );
    }else{
      gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001,peak*0.65),
        Math.max(
          when+attack+0.001,
          noteEnd-release
        )
      );
    }

    gain.gain.linearRampToValueAtTime(
      0,
      noteEnd
    );

    oscillator.connect(gain);
    gain.connect(bgmBus);

    oscillator.start(when);
    oscillator.stop(noteEnd+0.02);

    oscillator.onended=()=>{
      try{
        oscillator.disconnect();
        gain.disconnect();
      }catch(e){}
    };

  }catch(e){}
}

/* ---------- BGMスケジューラー ---------- */

/*
 * setInterval自体で音を鳴らさず、
 * AudioContext.currentTimeに基づいて先読み予約する。
 *
 * 描画負荷やフレームレートの影響を受けにくい。
 */

const BGM_TOTAL_TICKS=BGM_SCORE.bars*8;

const BGM_EVENT_INDEX=new Map();

for(const event of BGM_EVENTS){
  if(!BGM_EVENT_INDEX.has(event.tick)){
    BGM_EVENT_INDEX.set(event.tick,[]);
  }

  BGM_EVENT_INDEX.get(event.tick).push(event);
}

function scheduleBgm(){
  if(!AC||!bgmPlaying)return;
  if(AC.state!=="running")return;

  const now=AC.currentTime;
  const horizon=now+BGM_TIMING.lookAhead;

  /*
   * バックグラウンド復帰などで再生位置が大きく遅れた場合は
   * 過去の音をまとめて発音せず、現在時刻へ追いつく。
   */
  const expected=Math.max(
    0,
    Math.floor(
      (now-bgmStartTime)/BGM_TIMING.eighth
    )
  );

  if(expected>bgmNextTick+4){
    bgmNextTick=expected;
  }

  while(
    bgmStartTime+
    bgmNextTick*BGM_TIMING.eighth
    <horizon
  ){
    const tick=bgmNextTick%BGM_TOTAL_TICKS;

    const when=bgmStartTime+
      bgmNextTick*BGM_TIMING.eighth;

    const events=BGM_EVENT_INDEX.get(tick);

    if(events){
      for(const event of events){
        playBgmNote(event,Math.max(now+0.005,when));
      }
    }

    bgmNextTick++;
  }
}

/*
 * 内蔵シンセでBGMを再生する（ネットワーク不要）。
 */
function startSynthBgm(){
  if(!AC||!bgmBus)return;

  clearInterval(bgmTimer);

  bgmStartTime=AC.currentTime+0.06;
  bgmNextTick=0;

  scheduleBgm();
  bgmTimer=setInterval(scheduleBgm,BGM_TIMING.interval);
}

async function startBgm(){
  initAudio();

  if(!AC||!bgmBus||!sfxOn||!started)return;
  if(bgmPlaying)return;

  bgmPlaying=true;

  const requestId=++bgmRequestId;

  try{
    /*
     * 初回のみSoundFontを取得して
     * abcjsで楽曲全体を生成する。
     * 内蔵オシレーターシンセ（ピーピー音）へのフォールバックは行わない。
     */
    const buffer=await prepareAbcBgm();

    /*
     * 音声読み込み中に画面が閉じられた場合や、
     * サウンドがオフになった場合は再生しない。
     */
    if(
      requestId!==bgmRequestId||
      !bgmPlaying||
      !started||
      !sfxOn||
      document.hidden
    ){
      return;
    }

    /*
     * AudioContextはスタート操作時に先にresumeする。
     * 非同期読み込み後も停止状態なら復帰を再試行する。
     */
    if(AC.state!=="running"){
      try{
        await Promise.race([
          AC.resume(),
          new Promise((_,reject)=>setTimeout(
            ()=>reject(new Error("音声の起動がタイムアウトしました")),
            2000
          ))
        ]);
      }catch(e){
        throw new Error(
          "音声を開始できません。画面をタップして再試行してください"
        );
      }
    }

    if(
      requestId!==bgmRequestId||
      !bgmPlaying||
      !sfxOn||
      document.hidden
    ){
      return;
    }

    if(AC.state!=="running"){
      throw new Error("AudioContextが再生可能状態ではありません");
    }

    /*
     * 既存の独立音量バスを使用する。
     * 効果音用sfxBusは変更しない。
     */
    const now=AC.currentTime;
    const targetGain=buffer?AUDIO_MIX.abcBgm:AUDIO_MIX.bgm;

    bgmBus.gain.cancelScheduledValues(now);
    bgmBus.gain.setValueAtTime(0,now);

    bgmBus.gain.linearRampToValueAtTime(
      targetGain,
      now+AUDIO_MIX.fade
    );

    playAbcBgmBuffer(buffer);

  }catch(e){
    if(requestId!==bgmRequestId)return;

    bgmPlaying=false;

    console.warn(
      "Goppa Moji March: BGMを再生できませんでした",
      e
    );

    /*
     * 無音のまま放置せず、画面上にも状態を表示する。
     * 学習機能と効果音は引き続き利用できる。
     */
    showGoppaBubble(
      "🎵 おんがくを よみこめなかったよ",
      3500
    );
  }
}

function stopBgm(){
  bgmPlaying=false;

  /*
   * 進行中の非同期ロードを無効化する。
   * キャッシュ済みの楽曲バッファは保持する。
   */
  bgmRequestId++;

  clearInterval(bgmTimer);
  bgmTimer=null;

  if(bgmSource){
    const source=bgmSource;
    bgmSource=null;

    try{
      source.stop();
    }catch(e){}

    try{
      source.disconnect();
    }catch(e){}
  }

  if(!AC||!bgmBus)return;

  const now=AC.currentTime;

  bgmBus.gain.cancelScheduledValues(now);
  bgmBus.gain.setValueAtTime(0,now);
}

function syncGameAudio(){
  if(!started||!sfxOn||document.hidden){
    stopBgm();
    return;
  }

  startBgm();
}

/*
 * スマホで画面を閉じた場合の対策。
 *
 * 非表示中はBGMの予約処理を止める。
 * 復帰後はユーザーの音設定に従って再開する。
 */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopBgm();
  }else if(started&&sfxOn){
    initAudio();
    syncGameAudio();
  }
});

function tone(f,t0,dur,vol,type,f2){
  if(!AC||!sfxOn)return;
  try{
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+t0;
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);
    g.connect(sfxBus||AC.destination);
    o.start(t);
    o.stop(t+dur+.03);
    o.onended=()=>{
      try{o.disconnect();g.disconnect();}catch(e){}
    };
  }catch(e){}
}
const sfx={
  pon(){tone(660,0,.14,.22,"sine",880);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,.2,"triangle"));},
  big(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.3,.2,"triangle"));},
  soft(){tone(260,0,.22,.14,"sine",196);},
  boing(){tone(320,0,.18,.2,"sine",640);},
  kira(){[1319,1568,2093].forEach((f,i)=>tone(f,i*.07,.14,.14,"triangle"));},
  whoosh(){tone(900,0,.25,.1,"triangle",300);},
  giggle(){[880,1046,880,1046].forEach((f,i)=>tone(f,i*.07,.08,.14,"sine"));},
  dizzy(){tone(700,0,.5,.14,"sine",350);},
  pet(){tone(523,0,.18,.16,"sine");tone(659,.12,.22,.16,"sine");}
};
/* チョークのこすれる音：動いている間だけ鳴り、止まるとすぐ消える */
function scratch(){
  if(!AC||!sfxOn||!noiseBuf)return;
  try{
    if(!scr){
      const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2600; f.Q.value=.7;
      const g=AC.createGain(); g.gain.value=0;
      s.connect(f); f.connect(g); g.connect(sfxBus||AC.destination); s.start(); scr=g;
    }
    const t=AC.currentTime;
    scr.gain.cancelScheduledValues(t);
    scr.gain.setTargetAtTime(.05,t,.01);
    scr.gain.setTargetAtTime(0,t+.07,.04);
  }catch(e){}
}

/* 粒の演出（黒板の上） */
let parts=[], fxRun=false;
function addPart(o){parts.push(o); if(!fxRun){fxRun=true;requestAnimationFrame(fxTick);}}
function fxTick(now){
  parts=parts.filter(p=>{
    if(p.t0===undefined)p.t0=now+(p.delay||0);
    const ms=now-p.t0; if(ms<0)return true;
    const t=ms/p.life; if(t>=1){p.el.remove();return false;}
    const T=ms/1000, x=p.x+p.vx*T, y=p.y+p.vy*T+.5*p.g*T*T, sc=p.grow?Math.min(1,t*3):1;
    p.el.setAttribute("transform","translate("+x.toFixed(2)+" "+y.toFixed(2)+") rotate("+(p.rot*T).toFixed(1)+") scale("+sc.toFixed(2)+")");
    p.el.setAttribute("opacity",(t<.6?1:(1-t)/.4).toFixed(2));
    return true;
  });
  if(parts.length)requestAnimationFrame(fxTick); else fxRun=false;
}
function fxText(ch,size){
  const t=el("text",{"font-size":size,"text-anchor":"middle","dominant-baseline":"central",opacity:0},gFx);
  t.textContent=ch; return t;
}

/* 「じぶんで」かいた文字の履歴（古い順・最大 WORK_MAX 件） */
const WORK_MAX=5;
function workList(ch){
  const v=works.get(ch);
  return Array.isArray(v)?v:[];
}
function latestWork(ch){
  const l=workList(ch);
  return l.length?l[l.length-1]:null;
}
function normalizeWork(w){
  if(!w||!Array.isArray(w.p)||!w.p.length)return null;
  return {c:COLORS[w.c]?w.c:"white",p:w.p.map(String),t:Number(w.t)||0};
}
/* 新しい文字を追加。上限を超えたら、いちばん古い文字は残して、その次に古い文字から入れ替える */
function addWork(ch,entry){
  const l=workList(ch).slice();
  l.push(entry);
  while(l.length>WORK_MAX) l.splice(1,1);
  works.set(ch,l);
}
function buildHandwritingSVG(svgEl, ch, strokeWidth, entry){
  svgEl.innerHTML="";
  el("line",{class:"guide",x1:50,y1:6,x2:50,y2:94},svgEl);
  el("line",{class:"guide",x1:6,y1:50,x2:94,y2:50},svgEl);
  const wk=entry||latestWork(ch);
  const paths=wk&&wk.p&&wk.p.length?wk.p:(KANA[ch]||[]);
  const isRain=wk&&wk.c==="rainbow";
  const col=wk?(COLORS[wk.c]||COLORS.white):"rgba(245,242,230,.85)";
  paths.forEach((d,i)=>{
    const strokeCol = isRain ? RAINBOW_DUST[i%RAINBOW_DUST.length] : col;
    el("path",{d,fill:"none",stroke:strokeCol,"stroke-width":strokeWidth,"stroke-linecap":"round","stroke-linejoin":"round"},svgEl);
  });
}

/* ---------- ミニゲーム「どれかな？」 ---------- */
let quizOn=false, qAns="", qType="char", qN=0, qLock=false;
/* 「を」「ぢ」「づ」は読み上げが「お」「じ」「ず」と同じ音になるので出題しない */
function quizPool(){return [...done.keys()].filter(c=>c!=="を"&&c!=="ぢ"&&c!=="づ"&&KANA[c]);}
function updateQuizBtn(){const b=$("quizBtn"); if(b)b.disabled=quizPool().length<3;}
function quizProg(){$("qProg").textContent="⭐".repeat(qN)+"☆".repeat(Math.max(0,5-qN));}
function quizOpen(){
  if(quizPool().length<3)return;
  ++gen; endInput(); hideFlow(); tip.style.display="none"; hideEndGuide();
  quizOn=true; quizId++; qN=0; qAns="";
  stage.classList.add("quizzing"); $("quiz").hidden=false;
  setGoppaCorner("bl", false); /* クイズのレイアウトに合わせて左下に固定 */
  if(hero){ hero.play(null); hero.action("turn"); showGoppaBubble("どれかな？ あててね！", 2000); }
  quizNext();
}
function quizPromptVoice(ch){
  const w=WORDS[ch];
  if(qType==="word") return "「"+ch+"」の つく ことばは どれかな？";
  return w ? ch+"。"+w[1]+"の、"+ch+"、は どれかな？" : ch+"、は どれかな？";
}
function quizNext(){
  const pool=quizPool(); let a;
  do{a=pool[Math.random()*pool.length|0];}while(pool.length>3&&a===qAns);
  qAns=a;
  const others=pool.filter(c=>c!==a).sort(()=>Math.random()-.5).slice(0,2);
  const choices=[a,...others].sort(()=>Math.random()-.5);
  /* 全選択肢に WORDS がある場合は約半分の確率で「文字→ことば（絵文字）あて」を出題 */
  qType = (choices.every(c=>WORDS[c]) && Math.random()<0.5) ? "word" : "char";
  const box=$("qChoices"); box.innerHTML="";
  choices.forEach(c=>{
    const b=document.createElement("button");
    if(qType==="word"){
      const cw=WORDS[c];
      b.className="wchoice";
      b.innerHTML="<span>"+cw[0]+"</span><small>"+cw[1]+"</small>";
    }else{
      b.textContent=c;
    }
    b.onclick=()=>quizPick(b,c);
    box.appendChild(b);
  });
  const w=WORDS[qAns], hEl=$("qHint");
  if(qType==="word"){
    if(hEl) hEl.textContent="「"+qAns+"」の つく ことばは どれかな？";
    msg.textContent="「"+qAns+"」の ことばを えらぼう！";
  }else if(w){
    const masked=w[1].split(qAns).join("〇");
    if(hEl) hEl.textContent=w[0]+" 「"+masked+"」の もじは どれかな？";
    msg.textContent=w[0]+" の もじは どれかな？";
  }else{
    if(hEl) hEl.textContent="どの もじかな？";
    msg.textContent="ごっぱの もんだい！ どれかな？";
  }
  qLock=false; quizProg();
  speak(quizPromptVoice(qAns));
}
function quizPick(b,c){
  if(qLock||!quizOn)return;
  if(c===qAns){
    qLock=true; qN++; quizProg();
    b.classList.add("hit"); sfx.pon(); setBuddy("happy");
    const w=WORDS[qAns];
    showGoppaBubble(w ? "せいかい！ "+w[0]+w[1]+"✨" : "せいかい！ すごい！✨", 1300);
    if(!RM.matches)fxStars();
    const id=quizId;
    setTimeout(()=>{ if(!quizOn||id!==quizId)return; if(qN>=5)quizEnd(); else quizNext(); },950);
  }else{
    b.classList.add("dim"); b.disabled=true; sfx.soft(); setBuddy("oops");
  }
}
function quizEnd(){
  sfx.fanfare(); setBuddy("special");
  const td=today(); if(stars.d!==td)stars={d:td,n:0,b:false};
  stars.n++; food++; renderStars(); renderFoodUI(); saveDone();

  speak("ぜんぶ できたね！ ほしと ごはんが ふえたよ！");
  const id=quizId;

}

  updateFade();
});
function step(dv){const O=order==="easy"?EASY:ORDER, i=O.indexOf(cur);load(O[(i+dv+O.length)%O.length]);}
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
$("again").onclick=()=>start();
$("say").onclick=()=>sayWord();
function renderOrder(){document.querySelectorAll(".order button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.order===order));}
document.querySelectorAll(".order button").forEach(b=>b.onclick=()=>{order=b.dataset.order;renderOrder();saveDone();speak(b.textContent);});
/* 音声は最初の操作のあとから有効（ブラウザの自動再生制限） */
function unlock(){
  initAudio();
  if(AC&&!bgmBuffer&&!bgmLoadPromise){
    prepareAbcBgm().catch(()=>{});
  }
  if(unlocked)return; unlocked=true; unlockAt=performance.now();
  try{const u=new SpeechSynthesisUtterance(" ");u.lang="ja-JP";u.volume=0;speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener("pointerup",unlock,true);
document.addEventListener("click",unlock,true);
document.addEventListener("keydown",unlock,true);
/* 五十音表の「つづき」表示（rtl：scrollLeft は右端が0、左へ行くほど負） */
function updateFade(){
  const t=$("table"), w=$("tablewrap"); if(!t||!w)return;
  const max=t.scrollWidth-t.clientWidth, x=Math.abs(t.scrollLeft), over=max>2;
  w.classList.toggle("more-l",over&&x<max-2);
  w.classList.toggle("more-r",over&&x>2);
}
$("table").addEventListener("scroll",updateFade,{passive:true});
window.addEventListener("resize",updateFade);

mountGoppa(true); /* 開始前はタイトル画面に ごっぱを置く */
ensureGoppaFx(); /* 3Dが使えなくても残る演出レイヤー */
initGoppa3D();
scheduleGoppaInvite(8000);
pickNextWish();
document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
renderOrder();
applyPrefs();
load(EASY[0]);
loadDone();
</script>
